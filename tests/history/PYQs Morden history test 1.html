function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

low-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Sepoy Mutiny, also known as the Indian Mutiny, was a revolt by Indian soldiers against their British commanders in 1857-58. The rebellion began in Meerut on May 10, 1857, when sepoys of the British East India Company\u0026#39;s army mutinied.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion spread to other areas, including Delhi, Kanpur, Agra, and Lucknow. The rebellion was contained in 1858 when the rebels were defeated in Gwalior on June 20.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion was a response to the British East India Company\u0026#39;s attempts to develop the Indian economy and legal system. In January 1857, rumors began to circulate in the army that cartridges had been greased with animal tallow, which is sacred to Hindus and pigs being forbidden for Muslims.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe process for opening a cartridge was to tear the paper seal with your teeth, which some boys found to be a sin and an attempt to undermine their religions.\u003c/li\u003e\r\n\t\u003cli\u003eThe British granted amnesty to all rebels not involved in murder on November 1, 1858, but did not declare the hostilities to have formally ended until July 8, 1859.\u003c/li\u003e\r\n\t\u003cli\u003eBritish Administration records say that about 6,000 British died in the Indian Mutiny, and 800,000 Indians, including those who died during the mutiny, famines, and epidemics.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Doctrine of Lapse :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a policy that stated that if an Indian ruler died without a male heir, their kingdom would automatically become part of the British Empire. The policy was introduced by Lord Dalhousie, the Governor General of India from 1848 to 1856. The doctrine was also applied in cases where the ruler was judged to be \u0026quot;unfit\u0026quot; to rule.\u003c/li\u003e\r\n\t\u003cli\u003eThe Doctrine of Lapse was one of the methods of the East India Company to expand its territory. The doctrine was also applied by the East India Company in India until 1859. The first state annexed under the doctrine of lapse was Satara in 1848.\u003c/li\u003e\r\n\t\u003cli\u003eThe Doctrine of Lapse is generally regarded as having contributed to the discontent that was a factor in the outbreak of the Indian Mutiny in 1857 and the widespread revolt that followed.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44010", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e* on : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Champaran Satyagraha was a nonviolent resistance campaign led by Mahatma Gandhi in 1917. The movement was a protest against the exploitation andabuse faced by local indigo farmers at the hands of the British colonial authorities and plantation owners.\u003c/li\u003e\r\n\t\u003cli\u003eThe Champaran Satyagraha was the first popular satyagraha movement. It was a peasants uprising, led by Mahatma Gandhi in the Champaran district of Bihar. The farmer\u0026rsquo;s in the region revolted against the British power against the imposed indigo cultivation between 1914 and 1916.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement was started by Mahatma Gandhi in 1917 to look into the problem of the Tinkathia system. Under this system, the tenant farmers were compelled to grow indigo on a specific portion of their landholding. This was typically 3/20th of their land.\u003c/li\u003e\r\n\t\u003cli\u003eDuring the Champaran Satyagraha movement, Mahatma Gandhi was arrested on 16th April 1917 on the charges of creating deep unrest and was ordered to evacuate the province.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Civil Disobedience Movement (CDM) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a major mass movement launched in 1930 by Mahatma Gandhi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe CDM\u0026rsquo;s demands included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Releasing political prisoners\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Reducing the rupee-sterling exchange ratio\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Reducing agricultural tax by 50%\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Eliminating the government\u0026rsquo;s monopoly on salt\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Reducing military expenditure and salaries of highest-grade services\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe CDM was withdrawn in 1931 when Gandhi signed the \u0026ldquo;Gandhi-Irwin\u0026rdquo; pact.\u003c/li\u003e\r\n\t\u003cli\u003eCivil disobedience is a nonviolent action where an individual refuses to obey a law for moral or philosophical reasons. It can be active or passive, direct or indirect. The purpose of civil disobedience is usually to force concessions from the government or occupying power.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome examples of civil disobedience include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Boston Tea Party\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Mahatma Gandhi\u0026rsquo;s Salt March\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Suffragists\u0026rsquo; illegal voting\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Whites-only lunch counter sit-ins\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Youth climate movement school walkouts\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eCivil disobedience is also known as passive resistance. It has been a major tactic and philosophy of many social movements, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Nationalist movements in Africa and India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The American civil rights movement\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Labor movements\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44012", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r \r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMahatma Gandhi started the Dandi March on March 12, 1930. The march lasted until April 6, 1930. The Dandi March, also known as the Salt March and the Dandi Satyagraha, was a nonviolent protest against the British salt monopoly.\u003c/li\u003e\r\n\t\u003cli\u003eThe march was a direct action campaign of tax resistance and protest against injustice. The march began at Sabarmati Ashram in Ahmedabad and ended in Dandi, a coastal town in Gujarat. The march was nearly 385 km long and Gandhi was accompanied by 80 satyagrahis.\u003c/li\u003e\r\n\t\u003cli\u003eGandhi inaugurated the Civil Disobedience Movement by picking up a handful of salt in Dandi. He continued his satyagraha against the salt tax for the next two months, encouraging other Indians to break the salt laws.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Communal Award :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a series of elections announced by British Prime Minister Ramsay MacDonaldon August 16, 1932. It was also known as the MacDonald Award. The award was a result of the second round table conference and was based on the findings of the Indian Franchise Committee.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe key provisions of the award were:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Doubling the seats in the provincial legislatures\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Keeping the separate electorate system, especially for minorities\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Providing considerable weightage to the Muslims\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Reserving 3% of the total seats for women\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Communal Award extended the separate electorate to depressed classes and other minorities, including Muslims, Sikhs, Indian Christians, Anglo-Indians, and Europeans. The award favored the minorities over the Hindus, causing consternation and anger from Gandhi.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44013", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConcessions given to Muslims by the British\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAmity achieved between Congress and Muslim League\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003csty g {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBefore the visit of the Cabinet Mission\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Interim Government at the Centre after independence was formed.............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1979)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Interim Government of India was formed on September 2, 1946, after the Cabinet Mission of Britain visited India in 1946. The Cabinet Mission was part of the Cabinet Mission Plan of 1946, which was an attempt by the British government to address tensions between the Indian National Congress and the Muslim League over the future of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Cripps Mission began in 1942, and colonial authorities made several attempts to form an interim government in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Cripps Mission\u0026rsquo;s proposals included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Setting up an Indian dominion Forming a Constituent\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Assembly to frame a new constitution\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Allowing any province that was unwilling to join the Indian dominion to form a separate union and have a separate constitution\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Cabinet Mission\u0026rsquo;s proposals failed because the Congress Party wanted a strong center with minimal powers for the provinces, and the Muslim League wanted strong political safeguards for Muslims. The interim government was formed from the newly elected Constituent Assembly on September 2, 1946. The government included the Viceroy and Commander in Chief of Britain, members from the AllIndia Muslim League, and Jawaharlal Nehru as the Head of the Interim Government.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Mountbatten Plan :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the 3 June Plan, was a proposal to divide British India into India and Pakistan. It was announced on June 3, 1947, and led to the end of British colonial rule in the Indian subcontinent. The plan\u0026rsquo;s main purpose was to partition India and quickly transfer responsibility to Indian governments for the divided sections.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe plan included the following principles:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Both countries would have the right to make their own constitutions.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Both countries would have autonomy and sovereignty.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Princely states would have the choice to remain independent or join India or Pakistan.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Boundary Commission was established to fix the international boundaries between the two countries. The commission was chaired by Sir Cyril Radcliffe and was tasked with demarcating Bengal and Punjab into the two new countries.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian Independence Act was passed by the British parliament on July 5, 1947. The act\u0026rsquo;s aim was to transfer power from the British Crown to the newly independent dominions of India and Pakistan.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Cabinet Mission Plan :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a statement made in 1946 by the British Prime Minister Clement Attlee to discuss the transfer of power from the British to the Indian government. The plan proposed a three-tier administrative structure for British India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe plan also aimed to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Strengthen India\u0026rsquo;s unity\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Help India achieve independence\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Avoid partition\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe plan proposed the formation of a Union of India, comprising both the British India and the Princely States. The Union would remain in charge of only foreign affairs, defense, and communications.\u003c/li\u003e\r\n\t\u003cli\u003eThe plan failed due to a conflict : of interest between the Hindu and Muslim groups. The Congress opposed the creation of Pakistan as the Cabinet Mission Plan did not guarantee a separate sovereign state for Muslims.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44018", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCivil Disobedience Movement\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img { 6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRabindranath Tagore surrendered his title to the British because of.............\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1979)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRabindranath Tagore returned his knighthood in 1919 to protest the Jallianwala Bagh massacre.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1915, King George V awarded Tagore a knighthood for his contributions to literature, making him the first Indian to receive the honor. On April 13, 1919, General Dyer and his armed troops opened fire on a crowd of thousands gathered at Jallianwala Bagh in Amritsar. Tagore renounced his knighthood in 1919 to condemn the incident.\u003c/li\u003e\r\n\t\u003cli\u003eTagore received news of the massacre on May 22, 1919. He attempted to organize a protest meeting in Calcutta before deciding to renounce his knighthood as a symbolic act of protest.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Civil Disobedience Movement (CDM) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a major mass movement launched in 1930 by Mahatma Gandhi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe CDM\u0026rsquo;s demands included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Releasing political prisoners\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Reducing the rupee-sterling exchange ratio\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Reducing agricultural tax by 50%\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Eliminating the government\u0026rsquo;s monopoly on salt\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Reducing military expenditure and salaries of highest-grade services\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe CDM was withdrawn in 1931 when Gandhi signed the \u0026ldquo;Gandhi-Irwin\u0026rdquo; pact.\u003c/li\u003e\r\n\t\u003cli\u003eCivil disobedience is a nonviolent action where an individual refuses to obey a law for moral or philosophical reasons. It can be active or passive, direct or indirect. The purpose of civil disobedience is usually to force concessions from the government or occupying power.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome examples of civil disobedience include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Boston Tea Party\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Mahatma Gandhi\u0026rsquo;s Salt March\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Suffragists\u0026rsquo; illegal voting\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Whites-only lunch counter sit-ins\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Youth climate movement school walkouts\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eCivil disobedience is also known as passive resistance. It has been a major tactic and philosophy of many social movements, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Nationalist movements in Africa and India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The American civil rights movement\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Labor movements\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Anti-war movements\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Non-Cooperation Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a peaceful protest against the British government in India that lasted from 1920 to 1922. The movement was a political campaign led by Mahatma Gandhi to persuade the British to grant self-governance to India. The movement\u0026rsquo;s main goal was to achieve \u0026ldquo;Poorna swaraj\u0026rdquo; through peaceful means.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement was triggered by many reasons, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Jallianwala Bagh massacre On April 13, 1919, a large crowd of unarmed men, women, and children were shot at with machine guns and rifles by General Dyer.\u003c/li\u003e\r\n\t\u003cli\u003eThe Government of India Act of 1919\u003c/li\u003e\r\n\t\u003cli\u003eThis act curtailed the right to vote and gave Indians little say in government decisions.\u003c/li\u003e\r\n\t\u003cli\u003eResentment at the British after the war\u003c/li\u003e\r\n\t\u003cli\u003eIndians felt betrayed by the British after they provided extensive support of manpower and resources during the First World War.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement consisted of Indians:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Resigning their titles\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Boycotting government educational institutions, the courts, government service, foreign goods, and elections\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Eventually, refusing to pay taxes\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British government responded\u0026nbsp;with severe repression, arresting thousands of protesters and imposing harsh punishments. This led to further resentment and fueled the demand for independence.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Partition of Bengal :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a territorial reorganization of the Bengal Presidency that took place on October 16, 1905. The British Raj implemented the partition, which separated the largely Hindu western areas from the largely Muslim eastern areas.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition divided the province into West Bengal and East Bengal. The Muslims supported the partition because they would have their own province, but the Hindus opposed it.\u003c/li\u003e\r\n\t\u003cli\u003eT he partition led to a nationalist movement known as the Swadeshi Movement. The movement advocated boycotting British goods and promoting Indian-made products to protest against the partition and assert Indian self-reliance.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition also brought the province to the brink of open rebellion. The British recognized that Bengal was too large for a single province and determined that it needed reorganization and division.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44019", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u x-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBattle of Panipat\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe French supremacy in India came to an end with the..............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1979)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Battle of Wandiwash in 1760 marked the end of French influence in India. The battle was fought between the British, led by Eyre Coote, and the French, led by T homas-Arthur, Comte de Lally.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle was a decisive victory for the British, who defeated the French and captured Marquis de Bussy. The French put up a fierce resistance, but were overwhelmed by the British\u0026rsquo;s superior tactics and firepower.\u003c/li\u003e\r\n\t\u003cli\u003eThe Battle of Wandiwash was a decisive battle in the Third Carnatic War, which ended almost a century of conflict between the French and British.\u003c/li\u003e\r\n\t\u003cli\u003eThe resulting Treaty of Paris reduced the French Company to a trading body without political privileges.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Plassey :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It was a decisive victory for the British East India Company over the Nawab of Bengal and his French allies on June 23, 1757.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The end of the French forces Mir Jafar being crowned as the Nawab of Bengal\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The battle helped the British East India Company take control of Bengal in 1772.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe battle resulted in:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The British gaining political power in Northern India\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Buxar :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was fought between the British East India Company and a combined alliance of Indian states on October 22, 1764.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe British forces were led by Major Hector Munro, while the alliance included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Mir Qasim, Nawab of Bengal\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Shuja-ud-Daula, Nawab of Awadh\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Shah Alam II, Mughal Emperor\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe battle took place in Buxar, a fortified town in Bihar, on the banks of the Ganges river. The battle was a result of the misuse of trade privileges by the Nawab of Bengal and the colonialist ambitions of the British East India Company.\u003c/li\u003e\r\n\t\u003cli\u003eThe British won the battle, with Mir Qasim\u0026rsquo;s soldiers retreating and the other two surrendering. The battle was a turning point in Indian history, marking the beginning of British rule in India. The Treaty of Allahabad, signed by Shah Alam II on August 12, 1765, ended the war.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle took place on the banks of the Bhagirathi-Hooghly River, near the small village of Plassey, in north-eastern India.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle was part of the Third Carnatic War and the worldwide Seven Years\u0026rsquo; War (1756-63). T he British East India Company, led by Robert Clive, won because of the defection of Mir Jafar, the commander-in-chief of the Nawab\u0026rsquo;s army. Clive bribed Mir Jafar, promised to make him Nawab of Bengal, and bought support from his enemies.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe treaty forced the defeated Indian rulers to sign it, granting the East India Company diwani rights. This gave the company the right to collect revenue from the territories of Bengal, Bihar, and Orissa on behalf of the Mughal emperor. T he First Battle of Panipat : It was fought on April 21, 1526, between the invading forces of Babur and the Lodi Empire. The battle took place near the small village of Panipat, in the present day Indian state of Haryana. T he Mughal force was outnumbered but prevailed due to the resourcefulness of their commander, Babur. Babur used f ield fortifications and the firepower of gunpowder. It is widely accepted thatBabur\u0026rsquo;s guns were the decisive factor in the battle because Ibrahim Lodi had no field artillery. The cannons\u0026rsquo; sound scared Lodi\u0026rsquo;s elephants, who crushed Lodi\u0026rsquo;s soldiers. The battle marked the beginning of the Mughal Empire and the end of the Delhi Sultanate. The Second and Third Battles of Panipat took place in 1556 and 1761.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44023", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSuspension of Gen. Dyer\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max- important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following was not the outcome of Jallianwalah Bagh massacre? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1979)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eTemporary peace in Punjab is not an outcome of the Jallianwala Bagh massacre. The Jallianwala Bagh massacre, also called the Massacre of Amritsar, occurred on April 13, 1919.British troops, led by General Dyer, fired on a crowd of unarmed Indian civilians in an open space called Jallianwala Bagh in Amritsar, Punjab. The massacre was a result of a demonstration against the Rowlatt Act, which was passed in 1919 to extend the British government\u0026rsquo;s World War I emergency powers to combat subversive activities. Some other outcomes of the massacre include: 1. Newspapers were banned 2. Editors were put behind bars or deported 3. Rabindranath Tagore, who had been knighted by the British, renounced his knighthood 4. The government responded with further brutalities\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44024", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-w 3e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone of the above\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSwadeshi movement started during...............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1979)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Swadeshi Movement began in India on August 7, 1905, during the Anti-Bengal Partition agitation. The movement was a reaction to the partition of Bengal, which was announced in July 1905 and came into effect in October 1905.\u003c/li\u003e\r\n\t\u003cli\u003eThe Swadeshi movement was a six-year (1905\u0026ndash;1911) anti-partition movement.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement\u0026rsquo;s main principles include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Swadeshi: Using products and services from one\u0026rsquo;s own country\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Boycott: Refraining from using British goods\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Self-reliance: Aiming for economic self-reliance and independence from British rule\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Nationalism: Contributing to the development of Indian nationalism\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe movement began in 1905 in response to the British government\u0026rsquo;s decision to partition Bengal.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement\u0026rsquo;s main features include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Boycotting foreign goods\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Promoting indigenous industries\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Mass mobilization\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Burning British-made goods\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Swadeshi movement is now known as the \u0026ldquo;Make in India\u0026rdquo; campaign.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Non-Cooperation Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a peaceful protest against the British government in India that lasted from 1920 to 1922. The movement was a political campaign led by Mahatma Gandhi to persuade the British to grant self-governance to India. The movement\u0026rsquo;s main goal was to achieve \u0026ldquo;Poorna swaraj\u0026rdquo; through peaceful means.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement was triggered by many reasons, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Jallianwala Bagh massacre On April 13, 1919, a large crowd of unarmed men, women, and children were shot at with machine guns and rifles by General Dyer.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act of 1919 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis act curtailed the right to vote and gave Indians little say in government decisions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eResentment at the British after the war :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIndians felt betrayed by the British after they provided extensive support of manpower and resources during the First World War.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement consisted of Indians:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Resigning their titles\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Boycotting government educational institutions, the courts, government service, foreign goods, and elections\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Eventually, refusing to pay taxes\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British government responded with severe repression, arresting thousands of protesters and imposing harsh punishments. This led to further resentment and fueled the demand for independence.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Civil Disobedience Movement (CDM) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a major mass movement launched in 1930 by Mahatma Gandhi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe CDM\u0026rsquo;s demands included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;1. Releasing political prisoners\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Reducing the rupee-sterling exchange ratio\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Reducing agricultural tax by 50%\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Eliminating the government\u0026rsquo;s monopoly on salt\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Reducing the rupee-sterling exchange ratio Reducing agricultural tax by 50%\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe CDM was withdrawn in 1931 when Gandhi signed the \u0026ldquo;Gandhi-Irwin\u0026rdquo; pact.\u003c/li\u003e\r\n\t\u003cli\u003eCivil disobedience is a nonviolent action where an individual refuses to obey a law for moral or philosophical reasons. It can be active or passive, direct or indirect. The purpose of civil disobedience is usually to force concessions from the government or occupying power.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome examples of civil disobedience include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Boston Tea Party\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Mahatma Gandhi\u0026rsquo;s Salt March\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Suffragists\u0026rsquo; illegal voting\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Whites-only lunch counter sit-ins\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Youth climate movement school walkouts\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eCivil disobedience is also known as passive resistance. It has been a major tactic and philosophy of many social movements, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Nationalist movements in Africa and India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The American civil rights movement\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Labor movements\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Anti-war movements\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id" 003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe year 1919 is associated with many events, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Rowlatt Act :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn February 1919, the Imperial Legislative Council of British India passed the Rowlatt Act, which extended the Defence of India Act of 1915. The act allowed the trial of political cases without juries and the internment of suspects without trial.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Rowlatt Satyagraha :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eOn April 6, 1919, Mahatma Gandhi began a non-violent protest against the Rowlatt Act, which he called the Rowlatt Satyagraha. The protest included a nationwide hartal, where people were asked to stop going to work and hold meetings against the act.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Jallianwala Bagh Massacre :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Rowlatt Act led to a chain of events that culminated in the Jallianwala Bagh massacre. On Baisakhi, a day of celebration and peaceful protest, General Dyer ordered fire on a crowd gathered in Jallianwala Bagh without warning.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome other outcomes of the massacre include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Newspapers were banned\u003cbr /\u003e\r\n2. Editors were put behind bars or deported\u003cbr /\u003e\r\n3. Rabindranath Tagore, who had been knighted by the British, renounced his knighthood\u003cbr /\u003e\r\n4. The government responded with further brutalities.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDandi March:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMahatma Gandhi started the Dandi March on March 12, 1930. The march lasted until April 6, 1930.\u003c/li\u003e\r\n\t\u003cli\u003eThe Dandi March, also known as the Salt March and the Dandi Satyagraha, was a nonviolent protest against the British salt monopoly. The march was a direct action campaign of tax resistance and protest against injustice.\u003c/li\u003e\r\n\t\u003cli\u003eThe march began at Sabarmati Ashram in Ahmedabad and ended in Dandi, a coastal town in Gujarat. The march was nearly 385 km long and Gandhi was accompanied by 80 satyagrahis.\u003c/li\u003e\r\n\t\u003cli\u003eGandhi inaugurated the Civil Disobedience Movement by picking up a handful of salt in Dandi. He continued his satyagraha against the salt tax for the next two months, encouraging other Indians to break the salt laws.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Chauri Chaura incident:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt occurred on February 4, 1922, when police in the town of Chauri Chaura, India. The protesters were participating in the Non-cooperation movement, which was led by Mahatma Gandhi. The clash resulted in the deaths of about 22 policemen and 3 civilians.\u003c/li\u003e\r\n\t\u003cli\u003eThe incident led to Mahatma Gandhi calling off the Non-Cooperation Movement, which lasted from 1920-1922. 225 people were arrested, and 6 died in police custody. In July 1923, 19 people were executed after a trial, and 113 were sentenced to varying years of imprisonment.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Partition of Bengal:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a territorial reorganization of the Bengal Presidency that took place on October 16, 1905. The British Raj implemented the partition, which separated the largely Hindu western areas from the largely Muslim eastern areas.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition divided the province into West Bengal and East Bengal. The Muslims supported the partition because they would have their own province, but the Hindus opposed it.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition led to a nationalist movement known as the Swadeshi Movement. The movement advocated boycotting British goods and promoting Indian-made products to protest against the partition and assert Indian self-reliance.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition also brought the province to the brink of open rebellion. The British recognized that Bengal was too large for a single province and determined that it needed reorganization and division.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44035", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow s the division of administration into Nizamat and Diwani. In this system, the British East India Company was given the Diwani, which included the right to collect revenue and administer civil justice. The Nawab of Bengal was given the Nizamat, which included administrative rights, maintaining law and order, and defending the frontiers. T he British East India Company used harsh measures to collect revenue and increased the rates. The company and the Nawab neglected the welfare of the people. T he dual government system was introduced by Robert Clive in 1765 following his victory in the Battle of Plassey in 1757. T he system had the following characteristics:T he East India Company collected revenue. T he Nawab of Bengal was responsible for law and order, general administration, and maintenance. T he Company was responsible for military power and the right to collect and use the revenue of Bengal. T he Company directly collected its revenues through the right to nominate the Deputy Subahdar The Company controlled the Nizamat of the police and judicial powers.T he dual system of government was abolished by Warren Hastings in 1772 and Bengal was brought under direct control of the British.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44041", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} ", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich important event immediately preceded Jallianwala Bagh massacre? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1980)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Rowlatt Act, also known as the Black Act, was passed on March 10, 1919.The act gave the government the power to arrest or confine anyone suspected of seditious activities without a trial. This led to nationwide unrest. T he Rowlatt Act Satyagraha took place in 1919. M.K. Gandhi and Muhammad Ali Jinnah opposed the act because it restricted freedom of expression and strengthened the police\u0026rsquo;s power. As a result, the British government arrested the two national leaders Dr Satya Pal and Dr Saifuddin Kitchlew for their involvement in the protests against the act. On April 13, 1919, the British military Commander General Dyer and his soldiers blocked the entrance to Jallianwala Bagh, a public garden in Amritsar, on the day of Baisakhi. Without warning, Dyer ordered his soldiers to open fire at the unarmed crowd, killing thousands of people. The massacre sparked anger among Indians. T he Communal Award : It was a series of elections announced by British Prime Minister Ramsay MacDonald on August 16, 1932. It was also known as the MacDonald Award. T he award was a result of the second round table conference and was based on the findings of the Indian Franchise Committee. 1. T he Simon Commission : It is also known as the Indian Statutory Commission, was a group of seven British Parliament members sent to India in 1928 to study potential constitutional reform. T he commission was chaired by Sir John Simon, and the report it published in 1930 is known as the Simon Report. T he Simon Commission was boycotted by Indians because it had no Indian representatives. The commission\u0026rsquo;s all white membership was seen as an insult to Indians, who believed that a few British people should not be able to determine their destiny. T he Simon Commission accepted the idea of federalism and sought to maintain direct contact between the British crown and Indian states. The Simon Report was important in the constitutional discussions that led to the Government of India Act of 1935. T he Quit India Movement : It was a civil disobedience movement launched by Mahatma Gandhi on August 8, 1942. The movement\u0026rsquo;s demands were to end British rule in India, gain Indian cooperation in World War II, and form a provisional government after the British withdrew. T he movement had two phases: T he key provisions of the award were: Doubling the seats in the provincial legislatures 2. 3. 4. Keeping the separate electorate system, especially for minorities Providing considerable weightage to the Muslims Reserving 3% of the total seats for women T he Communal Award extended the separate electorate to depressed classes and other minorities, including Muslims, Sikhs, Indian Christians, Anglo-Indians, and Europeans. The award favored the minorities over the Hindus, causing consternation and anger from Gandhi. Download Our App 1. 2. First phase: Urban revolt, marked by strikes, boycotts, and picketing Second phase: Focus shifted to the countryside, which witnessed a major peasant rebellion T he movement also had a third phase, where parallel or provisional governments were set up to govern during the rebellion. These alternative administrations were formed in areas like Ballia, Tamluk, and Satara. The movement helped India eventually gain independence in 1947.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44042", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCompulsory elementary education\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSocia width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the correct order of happenings of the following three events in the British rule in India? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1981)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Rowlatt Act\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Hunter Report\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Jallianwalla Bagh Tragedy\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer from the codes given below:\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) T he Rowlatt Act, officially known as the Anarchical and Revolutionary Crimes Act of 1919, was passed by the British government in March 1919. T he act gave the British government the power to:1. 2. 3. 4. 5. Arrest anyone suspected of terrorist activities Detain people arrested for up to two years without trial Search places without a warrant Place severe restrictions on the freedom of the press T he purpose of the Act was to curb the growing nationalist upsurge in the country. Mahatma Gandhi called upon the people to perform satyagraha against the act. T he Rowlatt Act was popularly known as the \u0026ldquo;Black Act\u0026rdquo; in the Indian freedom movement during the British period. T he Rowlatt Act also restricted civil liberties, such as freedom of speech and assembly. This led to nationwide unrest. Gandhi initiated Satyagraha to protest against the Rowlatt Act. However, Gandhi was overwhelmed by the atmosphere of total violence and withdrew the movement on April 18, 1919. In 1922, after the massacre and the report of the Oppressive Laws Committee, the Act got repealed.T he Jallianwala Bagh massacre :It is also called the Massacre of Amritsar, occurred on April 13, 1919. British troops, led by General Dyer, fired on a crowd of unarmed Indian civilians in an open space called Jallianwala Bagh in Amritsar, Punjab. T he massacre was a result of a demonstration against the Rowlatt Act, which was passed in 1919 to extend the British government\u0026rsquo;s World War I emergency powers to combat subversive activities. Some other outcomes of the massacre include: 1. 2. 3. 4. Newspapers were banned Editors were put behind bars or deported Rabindranath Tagore, who had been knighted by the British, renounced his knighthood T he government responded with further brutalitiesThe Hunter Commission Report of 1919 : It concluded that the gathering in Jallianwala Bagh was not a conspiracy to overthrow British rule in Punjab. The commission also found that the declaration of martial law in Punjab was justified. However, the commission concluded that Dyer\u0026rsquo;s firing at the mob was justified, except that he should have given a warning first and shortened the duration of the firing. The commission also concluded that the duration of firing (10 minutes), as ordered by Dyer, was a grave error. The Hunter Commission was appointed by Edwin Montagu, the Secretary of State for India. The commission\u0026rsquo;s official name was the Disorders Inquiry Committee. The commission was chaired by Sir William Hunter, an Indian Civil Service officer and member of the Viceroy\u0026rsquo;s Executive Council.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44051", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003c ican Revolution, the French Revolution, the Irish Rebellion of 1798, the Haitian Revolution, the revolt of slaves in Latin America, and of course the wave of revolutions across Europe in 1848 among others. Mahatma Gandhi\u0026rsquo;s mass movements are focused on fighting against colonial rule while following non-violent principles. The period from 1919 to 1948 is known as the Gandhian era in Indian history because Gandhi dominated the Indian National Congress during this time. Some of Gandhi\u0026rsquo;s major movements include: 1. Champaran Movement: A nonviolent civil disobedience campaign in 1917 in the Champaran district of Bihar 2. Kheda Movement: In 1918 3. Khilafat Movement: In 1920, a worldwide protest was organized to combat the status of the Caliph 4. Non-cooperation Movement: In 1920 5. Civil Disobedience Movement: In 1930 6. Dandi March: Also known as the \u0026ldquo;Salt movement or Dandi Satyagraha\u0026rdquo; in 1930, Gandhi marched from Sabarmati Ashram to the coastal village of Dandi to protest the high salt tax 7. Quit India Movement: In 1942, Gandhi launched a mass civil disobedience movement that forced the British to leave India\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44058", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eVinoba Bhave\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img paign of tax resistance and nonviolent protest against the British salt monopoly. Gandhi and other nationalists believed that it was sinful to tax salt because it is such an essential item of food. The march was a 24-day march from Gandhi\u0026rsquo;s Sabarmati Ashram to the coastal town of Dandi to produce salt from the sea and defy the salt law. The march was a highly visible demonstration against the increasingly repressive salt tax. The march was a major nonviolent protest action in India directed against the British government\u0026rsquo;s tax on salt, which greatly affected the poorest Indians. Mahatma Gandhi\u0026rsquo;s Harijan campaign is a significant movement : It aims to address social discrimination and untouchability in India. In 1932, Gandhi established the Harijan Sevak Sangh organization to uplift the Harijans (Depressed Class or Dalits) and end untouchability. Gandhi\u0026rsquo;s campaign is considered as vital as winning political freedom. In his campaign, Gandhi referred to the oppressed class as \u0026ldquo;Harijans\u0026rdquo; or \u0026ldquo;sons of God\u0026rdquo;. He also called the untouchables \u0026ldquo;Harijans\u0026rdquo; or \u0026ldquo;Children of God\u0026rdquo; and worked long for their liberation. The Simon Commission : It is also known as the Indian Statutory Commission, was a group of seven British Parliament members sent to India in 1928 to study potential constitutional reform. The commission was chaired by Sir John Simon, and the report it published in 1930 is known as the Simon Report. The Simon Commission was boycotted by Indians because it had no Indian representatives. The commission\u0026rsquo;s all white membership was seen as an insult to Indians, who believed that a few British people should not be able to determine their destiny. The Simon Commission accepted the idea of federalism and sought to maintain direct contact between the British crown and Indian states. The Simon Report was important in the constitutional discussions that led to the Government of India Act of 1935.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44066", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMahatma Gandhi\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eW. C. Bannerjee\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eG. K. Gokhale\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u00
