ng": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Civil Disobedience Movement, launched by Mahatma Gandhi in 1930, was aimed at achieving Purna Swaraj, or complete independence from British rule. The movement began with the historic Dandi March (Salt Satyagraha), where Gandhi marched from Sabarmati Ashram to Dandi to protest the British salt tax. The movement encouraged Indians to break unjust laws peacefully, refuse to pay taxes, boycott British goods, and promote self-reliance. It marked a major shift in India\u0026rsquo;s freedom struggle, as it demanded total independence rather than limited reforms.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHome Rule Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt refers to the Home Rule Movement started in 1916 by Bal Gangadhar Tilak and Annie Besant. It sought self-government or dominion status within the British Empire, similar to the status enjoyed by colonies like Canada and Australia. While it aroused political awareness among Indians, it did not demand complete freedom from British rule, as the Civil Disobedience Movement later did.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eNon-cooperation with British government :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt refers to the Non-Cooperation Movement of 1920\u0026ndash;1922, also led by Gandhi. It aimed to resist British rule through peaceful non-cooperation\u0026mdash;by boycotting schools, offices, courts, and foreign goods. However, it was called off after the Chauri Chaura incident in 1922 when protestors turned violent. This movement laid the foundation for later struggles like Civil Disobedience but was distinct in purpose and time.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHindu-Muslim unity :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a significant objective during the Khilafat and Non-Cooperation Movements, as Gandhi sought to unite the two communities in a joint struggle against British rule. However, it was not the main aim of the Civil Disobedience Movement, which focused on complete independence.\u003c/li\u003e\r\n\t\u003cli\u003eIn conclusion, while Home Rule, Non-Cooperation, and Hindu-Muslim unity were important phases and ideals in India\u0026rsquo;s freedom struggle, the Civil Disobedience Movement of 1930 was specifically launched for the goal of Purna Swaraj (complete independence) \u0026mdash; making \u003cstrong\u003eoption (b) the correct answer.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44068", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOf Chauri Chaura incident\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-w n 1882, the then Viceroy of India, Lord Ripon, passed a resolution that led to democratic forms of municipal governance in India. He was a staunch Liberal democrat with faith in self government. Ripon believed that self government is the highest and noblest principles of politics. Therefore, Ripon helped the growth of local bodies like the Municipal Committees in towns and the local boards in talukas and villages. The powers of municipalities were increased. Lord Ripon\u0026rsquo;s Resolution of Local Bodies included: 1. Elections: Non-officials were elected to urban and rural local bodies. Rent-payers could participate in the election. 2. Positions: Non-officials could hold the position of chairman in the local bodies.Local self-government is a democratic form of governance that empowers local communities and authorities to make decisions on matters that directly affect their areas.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44077", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDandi\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eChamparan\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAhmedabad\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBardoli\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe first great experiment of Gandhiji in \u0026lsquo;Satyagraha\u0026rsquo; took place in............\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1983)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) Mahatma Gandhi\u0026rsquo;s first great experiment in Satyagraha took place in Champaran, Bihar in 1917. The Champaran Satyagraha was a farmers\u0026rsquo; uprising during the British colonial era in 1917. It\u0026rsquo;s considered a historically important rebellion in the Indian independence movement. In 1917, Gandhi was persuaded by Rajkumar Shukla, an indigo cultivator, to go to Champaran to investigate the conditions of the farmers there. He adopted non violent Satyagraha as a mass movement to oppose the coercive acts against farmers. Satyagraha, or \u0026ldquo;holding firmly to truth\u0026rdquo;, or \u0026ldquo;truth force\u0026rdquo;, is a particular form of nonviolent resistance or civil resistance. The Dandi March : It is also known as the Salt March, was a nonviolent civil disobedience campaign led by Mohandas Karamchand Gandhi from March 12, 1930 to April 6, 1930. The march was a protest against the British salt monopoly, which was established by the 1882 Salt Act. The act gave the British a monopoly on the collection and manufacture of salt, and levied a tax on it. Gandhi and other nationalists believed that taxing salt was sinful because it is a basic food item. The march was a centerpiece of the 1930 Salt Satyagraha, which was a protest against the increasingly repressive salt tax. The march began with a core group of followers, and hundreds more joinedthem along the way. On April 5, the group reached Dandi after a 240-mile (385 km) journey. Gandhi was arrested in early May after informing the British governor of India of his intention to march on the Dharasana saltworks. News of Gandhi\u0026rsquo;s imprisonment led tens of thousands more Indians to join the satyagraha. The Dandi March and Gandhi\u0026rsquo;s satyagraha teachings had a significant influence on American activists like Martin Luther King Jr. and James Bevel during the Civil Rights Movement in the 1960s. The Bardoli Satyagraha : It was a farmers\u0026rsquo; movement and nationalist movement in India that began on June 12, 1928. The movement was led by Sardar Vallabhbhai Patel and protested against the British colonial government\u0026rsquo;s oppressive land revenue policies. The movement demanded the repeal of the 22% tax increase levied by the Bombay Presidency. The Bardoli Taluk in modern-day Gujarat was hit by floods and famines in 1925, which affected the crop yield and the farmers financially. Despite petitions and appeals from civic groups and farmers, the government decided to go ahead with tax collection. The peasants adopted a resolution to not pay the assessment until an inquiry was set up. The government acted aggressively and issued notices to pay the assessment or suffer loss of property or forfeiture of land. The government confiscated a large chunk of land. The government set up the Maxwell Broomfield commission, in the fear that things would go out of hand by the Bardoli Satyagraha. The revenue was reduced to around 6.03% and the peasants came to return the lands which were confiscated from them. The movement was a turning point in the Indian nationalist fight. However, the movement also had some criticisms: 1. It mostly ignored the plight of impoverished farmers. 2. It did not bring up the issue of Hali Pratha (a kind of bonded labor system). 3. The peasants\u0026rsquo; fundamental problems were not addressed.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44078", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max- British. T he policy was used to extend British Paramountcy and annexed many Indian states, including: 1. 2. 3. 4. 5. 6. 7. Satara in 1848 Jaitpur in 1849 Sambalpur in 1849 Baghat in 1850 Udaipur in 1852 Jhansi in 1853 Nagpur in 1854 T he policy led to unrest among Indian princes and was one of the causes of the Indian Revolt of 1857. Lord William Bentinck : He was the Governor-General of India from 1828 to 1835. He is known as a liberal reformer who made many changes to the administration of India. Bentinck\u0026rsquo;s policies included:Non-intervention :Bentinck adopted a policy of non intervention and non-aggression with Indian states. He only interfered in the affairs of the Indian states to end any form of misgovernment and never to annex any territory. Education : Bentinck promoted education in India. He passed the English Education Act 1835 that replaced Persian with English in the higher courts. He also advocated for Indians to be educated in the western style so that more Indians could be employed in the administration.Social reforms :Bentinck abolished the systems of \u0026ldquo;Sati\u0026rdquo; and human sacrifice. He also suppressed the system of Thugee. Financial reforms : Bentinck economized to deal with a deficit of about one crore. Bentinck also: 1. 2. 3. 4. 5. 6. 7. 8. Abolished debts Reorganized the legal system Improved communications Introduced education programs Opened up official posts to natives Suppressed female infanticide Abolished lawlessness Reduced the salaries of the civil servants Lord Ripon : He is a British viceroy, is known as the \u0026ldquo;father of local self-government\u0026rdquo; in India. In 1882, he introduced a resolution that established district and local boards and expanded the rights and authority of municipal governments.Local self-government is a democratic form of governance that empowers local communities and authorities to make decisions on matters that directly affect their areas. It falls under the state government\u0026rsquo;s jurisdiction and is further divided into Zila Parishads, Panchayat Samitis, Mahanagar Palikas, Nagar Palikas, and Panchayats. Lord Ripon is also known for: 1. 2. Enacting the Factory Act, which established the first factory Providing for a one-hour break during working hours and four monthly vacations for employees In 1905, Lord Curzon, the British Viceroy of India : \u0026bull; Announced the partition of Bengal into two provinces: 1. 2. West Bengal and East Bengal.The partition was implemented on October 19, 1905. The partition separated the largely Muslim eastern areas from the largely Hindu western areas. The new province of East Bengal and Assam had a population of 38 million, predominately Muslim, while the western province, called Bengal, was reduced to 55 million people, primarily Hindus. The partition was opposed by the Hindus, but supported by the Muslims who would have their own province. The partition was undone six years later. Curzon\u0026rsquo;s motives for the partition were to curb the radical Bengali nationalists and to weaken the nationalist\u0026rsquo;s movements. He also wanted to weaken Bengal, the nerve center of Indian nationalism, and divide the Muslims and Hindus based on religion. The partition began a transformation of the Indian National Congress from a middle class pressure group into a nationwide mass movement.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44083", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}  @font-face { font-family: \u0027serif\u0027;src: url(\u0027https://appx-content-v2.classx.co.in/fonts/serif.ttf\u0027) format(\u0027truetype\u0027); } \u003c/style\u003e\u0 7; width:140px; padding:.113px 2px 0cm 0cm; height:45px; border-top:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003eSwami Vivekananda\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below:\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eA B C D\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) Swami Vivekananda (1863-1902) founded the Ramakrishna Mission in 1897. Vivekananda was the chief disciple of the Indian Hindu spiritual guru and mystic Ramakrishna. The mission is named after Ramakrishna. The Ramakrishna Mission is a registered society that promotes the Hindu philosophy of Vedanta\u0026ndash;Advaita Vedanta and four yogic ideals. The mission\u0026rsquo;s goal is to serve humanity in the spirit of \u0026ldquo;service of God in man\u0026rdquo;.Swami Dayanand Saraswati founded the Arya Samaj in 1875. The organization\u0026rsquo;s goal was to restore the Vedas, the earliest Hindu scriptures, as revealed truth. T he Arya Samaj is a monotheistic Indian Hindu reform movement that promotes values and practices based on the belief in the infallible authority of the Vedas. T he movement\u0026rsquo;s followers believe that the Vedas are infallible and the literal word of God. They also believe in one God, known as \u0026ldquo;Om,\u0026rdquo; who is omniscient, omnipresent, omnipotent, and the source of all justice, bliss, intelligence, and mercy. The Arya Samaj also advocated for causes like widow remarriage and education of girl children. Raja Ram Mohan Roy (1772-1833) founded the Brahmo Samaj in 1828. T he Brahmo Samaj is a monotheistic sect of Hinduism that began as a reform association called the Brahmo Sabha. The Brahmo Samaj does not accept the authority of the Vedas, has no faith in avatars, and does not insist on belief in karma. T he Brahmo Samaj was a powerful socio religious movement in India that aimed to bring a renaissance to Bengal. T he movement fought against prevailing evil practices in society, particularly the practice of Sati and the caste system. It also emphasized educational, religious, and social reform. The Brahmo Samaj played an important role in stamping out the dowry and caste systems, aiming to encourage women\u0026rsquo;s empowerment. Atmaram Pandurang founded the Prarthana Samaj, or \u0026ldquo;Prayer Society\u0026rdquo; in Sanskrit, in Bombay on March 31, 1867. T he Prarthana Samaj was a socio-religious reform movement that aimed to promote theistic worship and social reform. The movement\u0026rsquo;s main goal was to make people believe in and worship one God.T he Prarthana Samaj\u0026rsquo;s social reforms included: 1. 2. 3. Inter-dining Inter-marriage Widow remarriage4. Upliftment of women and depressed classes T he Prarthana Samaj was a branch of the Brahmo Samaj. The society\u0026rsquo;s members were followers of the Marathi Sant Mat\u0026rsquo;s religious tradition, including Namdev and Tukaram. Although the Prarthana Samaj members were devoted theists, they also worshiped formless gods. The Prarthana Samaj\u0026rsquo;s precursor was the Paramahamsa Sabha, a secret society for the promotion of liberal ideas.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subje =\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3, 1, 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe following are the events in national movement.............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1983)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Champaran Satyagraha\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Non-Cooperation Movement\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Quit India Movement\u003c/p\u003e\r\n\r\n\u003cp\u003e4.\u0026nbsp;Dandi March\u003c/p\u003e\r\n\r\n\u003cp\u003eThe correct chronological order is :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) T he Champaran Satyagraha : It was a farmer\u0026rsquo;s uprising that took place in the Champaran district of Bihar in 1917-1918. It was led by Mahatma Gandhi and is considered a historically important rebellion in the Indian independence movement.T he Champaran Satyagraha began when farmers revolted against British power between 1914 and 1916. The farmers were forced to grow indigo on a portion of their land, but they could not grow the food they needed and received little payment for it. T he British also forced farmers by binding them in unfair contracts to grow indigo on their lands. Gandhi was persuaded by Pandit Raj Kumar Shukla to visit the region and try to organize mass uprisings by people to protest against injustice.Satyagraha means clinging to truth, holding fast to truth, insistence on truth, or firm adherence to truth. Gandhiji described Satyagraha as \u0026ldquo;firmness in a good cause\u0026rdquo; in Indian opinion. T he Non-Cooperation Movement : It was a nonviolent civil disobedience campaign launched in 1920 by Mahatma Gandhi. The movement\u0026rsquo;s goal was to achieve Indian independence from British rule by persuading the British government to grant self-governance.\u0026nbsp;The movement lasted from September 1920 to February 1922. T he movement\u0026rsquo;s main objectives were to achieve \u0026ldquo;Poorna swaraj\u0026rdquo; through peaceful means and to restore the old status of the Caliph.\u0026nbsp; T he movement was a response to several causes, including: 1. 2. 3. 4. 5. T he Jallianwala Bagh massacre T he Rowlatt Act T he Khilafat Movement T he Government of India Act of 1919 Resentment at the British after the war\u0026nbsp; T he movement\u0026rsquo;s driving force was Gandhi\u0026rsquo;s philosophy of Satyagraha, which emphasized non-violence and civil resistance.\u0026nbsp;T he movement consisted of Indians:Resigning their titles 2. 3. Boycotting government educational institutions, the courts, government service, foreign goods, and elections Eventually, refusing to pay taxes\u0026nbsp; T he British government responded with severe repression, arresting thousands of protesters and imposing harsh punishments.\u0026nbsp;This led to further resentment and fueled the demand for independence.\u0026nbsp;Dandi March : It is also known as the Salt March and the Salt Satyagraha, was a non-violent civil disobedience movement led by MahatmaGandhi from March 12, 1930 to April 6, 1930. T he march was a direct action campaign of tax resistance and non-violent protest against the British salt monopoly. Gandhi and other nationalists believed that it was sinful to tax salt because it is such an essential item of food. The march was a 24-day march from Gandhi\u0026rsquo;s Sabarmati Ashram to the coastal town of Dandi to produce salt from the sea and defy the salt l aw. T he march was a highly visible demonstration against the increasingly repressive salt tax. The march was a major non-violent protest action in India directed against the British government\u0026rsquo;s tax on salt, which greatly affected the poorest Indians.T he Quit India Movement : was a civil disobedience movement launched by Mahatma Gandhi on August 8, 1942. The movement\u0026rsquo;s demands were to end British rule in India, gain Indian cooperation in World War II, and form a provisional government after the British withdrew.T he movement had two phases:First phase: Urban revolt, marked by strikes, boycotts, and picketing Second phase: Focus shifted to the countryside, which witnessed a major peasant rebellion T he movement also had a third phase, where parallel or provisional governments were set up to govern during the rebellion. These alternative administrations were formed in areas like Ballia, Tamluk, and Satara. The movement helped India eventually gain independence in 1947.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44087", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 4, 3\u0026nbsp;\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 1, 3, 4\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3, 2, 1, 4\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3, 1, 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe following are the events in national movement............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1983)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Champaran Satyagraha\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Non-Cooperation Movement\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Quit India Movement\u003c/p\u003e\r\n\r\n\u003cp\u003e4.\u0026nbsp;Dandi March\u003c/p\u003e\r\n\r\n\u003cp\u003eThe correct chronological order is :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) T he Swadeshi Movement : It began in India on August 7, 1905, during the Anti-Bengal Partition agitation. The movement was a reaction to the partition of Bengal, which was announced in July 1905 and came into effect in October 1905. T he Swadeshi movement was a six-year (1905\u0026ndash;1911) anti-partition movement. T he movement\u0026rsquo;s main principles include: 1. 2. 3. 4. Swadeshi: Using products and services from one\u0026rsquo;s own country Boycott: Refraining from using British goods Self-reliance: Aiming for economic self-reliance and independence from British rule Nationalism: Contributing to the development of Indian nationalism T he movement began in 1905 in response to the British government\u0026rsquo;s decision to partition Bengal. 1. laid the foundation of the movement in Madras (present-day Chennai). Tilak established the Poona Home Rule League in April 1916. T he league\u0026rsquo;s demands included: 1. 2. 3. Swaraj Education in vernacular languages T he formation of linguistic states T he movement\u0026rsquo;s signature achievement was the Montague Declaration of 1917, which recognized the inclusion of more Indians in the government and the development of self-governing institutions. T he movement was unable to gain support from Muslims, Anglo-Indians, and non Brahmins because they believed that home rule would lead to rule by the upper-caste Hindu majority. In 1921, the All India Home Rule League changed its name to Swarajya Sabha. T he Bardoli Satyagraha : It was a non-violent protest against the British government\u0026rsquo;s increased land tax in Bardoli, Gujarat, India. The movement began on June 12, 1928 and was led by Sardar Vallabhbhai Patel and Mohandas Karamchand Gandhi. T he movement\u0026rsquo;s main features include: Boycotting foreign goods 2. 3. 4. Promoting indigenous industries Mass mobilization Burning British-made goods T he Swadeshi movement is now known as the \u0026ldquo;Make in India\u0026rdquo; campaign. What is Home Rule Movement? It was a political movement in India from 1916 to 1918 that sought self-government for India within the British Empire. The movement was a response to the hardships faced by the masses after World War I. T he movement\u0026rsquo;s leaders included Bal Gangadhar Tilak and Annie Besant. Besant Download Our App T he movement was supported by various groups, including Patidars, Anavil Brahmins, Baniyas, and even certain Muslim and Parsi landowners. T he movement was a turning point in the Indian nationalist fight. It was the offspring of Gandhi\u0026rsquo;s non-cooperation movement. However, the movement also had some criticisms: 1. 2. 3. It mostly ignored the plight of impoverished farmers. It did not bring up the issue of Hali Pratha (a kind of bonded labor system). T he peasants\u0026rsquo; fundamental problems were not addressed. T he Round Table Conferences : It were a series of meetings held in London between 1930 and 1932. The Britishgovernment organized the conferences in response to the Simon Report. The main topic of the conferences was the constitution and India. T he conferences were held to: 1. 2. 3. 4. Discuss constitutional reforms in India Make proposals regarding the next stage of India\u0026rsquo;s constitutional development Inform an Act of Parliament Consider the future government of India T he conferences were conducted by the British government and Indian political personalities. The first conference was held from November 12, 1930 to January 19, 1931. The second conference was held from September 7, 1931 to December 1, 1931. The third conference was held from November 17, 1932 to December 24, 1932. Some key participants from India included:B. R. Ambedkar Jinnah Sir Tej Bahadur Sapru V. S. Srinivasa Sastri Sir Muhammad Zafrulla Khan K. T. PaulMirabehn T he Indian National Congress did not participate in the first conference because Congress leaders were imprisoned for their involvement in the Civil Disobedience Movement.\u003c/p\u break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone is correct\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following is/are correct? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1983)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eNewspaper: Publisher/Editor\u003c/p\u003e\r\n\r\n\u003cp\u003eA. Leader: Annie Besant\u003c/p\u003e\r\n\r\n\u003cp\u003eB. Yugantar: C. Y. Chintamani\u003c/p\u003e\r\n\r\n\u003cp\u003eC. Young India: Aurobindo Ghosh\u003c/p\u003e\r\n\r\n\u003cp\u003eCodes:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) \u0026bull; Annie Besant, a British socialist, theosophist, and women\u0026rsquo;s rights activist, published two newspapers: 1. 2. New India and T he Commonweal. New India was a daily newspaper published in India in the early 20th century. The newspaper\u0026rsquo;s purpose was to highlight issues related to the Indian freedom struggle and to express Besant\u0026rsquo;s perspectives through editorials. The newspaper was previously named Madras Standard. T he Commonweal was a weekly newspaper. In 1916, Besant started the Home Rule League in Chennai, Tamil Nadu. She believed that self-government was a right of the Indians and that they were entitled to it. T hrough her articles in The Commonweal, she tried to make people aware of the purpose of her agitation. Madan Mohan Malviya, also known as Mahamana, founded the English-language newspaper The Leader in 1909. T he paper was published in Allahabad and was one of the most influential newspapers in India during the British Raj.Malviya was also the editor of Hindustan and Indian Union, and the founder of Maryada, Abhyudaya, and Banaras Hindu University. He served as the President of the Indian National Congress for three terms and was the founder of Scouting in India. Barindra Kumar Ghosh, an Indian revolutionary and journalist, founded the Bengali newspaper Jugantar Patrika in 1906. The newspaper was also known as Yugantar and was one of the two main secret revolutionary movements in Bengal for Indian independence. T he newspaper\u0026rsquo;s founders also included Abhinash Bhattacharya and Bhupendranath Dutt. The newspaper was a political weekly that served as the official voice of the Anushilan Samiti, arevolutionary organization in Bengal at the time. The newspaper\u0026rsquo;s goal was to spread awareness about the political situation, promote revolutionary ideas, and mobilize the masses for the cause of independence. The newspaper was critical of the Indian National Congress\u0026rsquo;s policies and its moderate stance over the freedom struggle. The newspaper was banned in 1908. Mohandas Karamchand Gandhi, also known as Mahatma Gandhi, published the weekly journal Young India from 1919 to 1931. Gandhi used the journal to spread his ideology of non-violence and resistance. He also sought to popularize India\u0026rsquo;s demand for independence or Swaraj. Young India was originally a book written by Lala Lajpat Rai in 1916.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44089", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eC. R. Attlee\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRamsay Macdonald\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/s te alongside Hindus in general constituencies. The award was later incorporated into the act of 1935. The Congress opposed the award, believing it promoted the idea that Muslims, Sikhs, and Christians were separate groups with different interests from the rest of India. The Congress decided to neither accept nor reject the award.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44090", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBombay\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCalcutta\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLahore\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLucknow\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe first session of Indian National Congress in 1885 was held at.............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1983)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) The first session of the Indian National Congress (INC) was held from December 28\u0026ndash;31, 1885 at Gokuldas Tejpal Sanskrit College in Bombay. The session was attended by 72 delegates, including social reformers, journalists, and lawyers. Prominent delegates included Dadabhai Naoroji, Surendranath Banerjee, Badruddin Tyabji, Pherozeshah Mehta, W. C. Bonnerjee, and S. Ramaswami Mudaliar. Wyomesh Chandra Banerjee became the first president of the INC after the party\u0026rsquo;s foundation in December 1885.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44091", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCabinet Mission Plan\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAttlee Declaration\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSimon Commission Plan\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMountbatten Declaration\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following was mainly responsible for the transfer of power by the British to India on August 15, 1947? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1983)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) Lord Mountbatten, the last viceroy of British India, was mainly responsible for the transfer of power to India on August 15, 1947. Mountbatten chose August 15, 1947 because it was the day in 1945 that the Japanese Army surrendered in World War II. The British Parliament ratified the Mountbatten Plan on July 18, 1947, for the Independence of India Act, which was implemented on August 15, 1947. The British partitioned India in 1947 due to a complex interplay of factors, including: 1. Rising communal tensions in the 1930s2. Political choices made by elites at both national and provincial levels 3. The impact of the Second World War 4. The widespread breakdown of law and order following the \u0026lsquo;Great Calcutta Killing\u0026rsquo; in 1946 The Cabinet Mission Plan : It was a statement made in 1946 by the British Prime Minister Clement Attlee. The plan proposed a three-tier administrative structure for British India. The plan also aimed to: 1. Strengthen India\u0026rsquo;s unity 2. Help India achieve independence 3. Avoid partition The Cabinet Mission Plan proposed the formation of a Union of India, comprising both the British India and the Princely States. The Union would remain in charge of only foreign affairs, defense, and communications. The remaining powers would be vested in the provinces. The Cabinet Mission Plan raised the issue of whether independence was to result in a united India or one divided into Hindu and Muslim areas. The Congress opposed the creation of Pakistan as the Cabinet Mission Plan did not guarantee a separate sovereign state for Muslims. Atlee Declaration : On February 20, 1947, British Prime Minister Clement Attlee announced that the British government would grant full self-government to British India by June 30, 1948. The announcement also stated that the future of the Princely States would be decided after the date of final transfer is decided. Attlee\u0026rsquo;s announcement also granted freedom to the Indian princely states to either join the Dominion of India or Dominion of Pakistan or to remain independent. \u0026bull; The Indian Independence Act was passed in 1947, creating two new independent dominions: 1. India and 2. Pakistan. Pakistan was later split into Pakistan and East Pakistan, which is now Bangladesh. The Simon Commission : It was a group of seven British Members of Parliament that was appointed in 1927 to study the Government of India Act of 1919. The commission\u0026rsquo;s purpose was to examine the act and recommend improvements to the system. The commission\u0026rsquo;s plan was to abolish diarchy, which would have extended provincial autonomy by establishing representative government. However, the plan would have allowed British governors to retain most of their emergency powers. The Simon Commission was strongly opposed by national leaders and freedom fighters because the British administration did not include any Indians in the commission. The commission led to the Government of India Act of 1935, which served as the basis for many parts of the current Indian Constitution.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44092", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1936\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1941\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1942\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u tional Congress were arrested by the British Government. The Quit India Movement is a defining moment in the history of India\u0026rsquo;s freedomstruggle. Every year Quit India Day is observed on August 8.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44093", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth A and R are true but R is not the reason for A\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth A and R are true but R is the reason for A\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither A nor R is correct\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA is correct but R is wrong\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion(A) : Great Britain gave India her independence on August 15, 194\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R) : Great Britain became weak after her involvement in World War II. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1983)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) India gained independence from the British on August 15, 1947. This day also marks the partition of the subcontinent into India and Pakistan. The Indian Independence Act was passed on July 18, 1947, and came into effect at midnight on August 15, 1947. The British Parliament gave the last British governor general of India, Louis Mountbatten, the mandate to transfer power to India by June 30, 1948. However, Mountbatten chose August 15, 1947 for two reasons: 1. He didn\u0026rsquo;t want bloodshed or riots 2. August 15 marked the second anniversary of Japan\u0026rsquo;s surrender in World War II The partition of the subcontinent was due to British imperialism and religious conflict between Hindus and Muslims. The subcontinent was divided to form: 1. Muslim majority Pakistan 2. Hindu majority India World War II weakened Great Britain: \u0026bull; Financial damage: The war stripped Britain of its foreign financial resources and left it in disarray. \u0026bull; Economic devastation: The war left Britain economically devastated. \u0026bull; Loss of prestige: Japan\u0026rsquo;s wartime victories destroyed Britain\u0026rsquo;s imperial prestige. \u0026bull; Loss of authority: Britain slowly began to lose authority over its colonial possessions. \u0026bull; Anti-colonialist sentiment: In the years following 1945, anti-colonialist sentiment was on the rise and Britain was in no shape whatsoever to counter these movements. \u0026bull; Growing independent view: Many parts of the empire contributed troops and resources to the war effort and took a growing independent view. The collapse of British imperial power can be traced directly to the impact of World War Two. All but complete collapse of British imperial power is by the mid-1960s.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44094", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSimon Commission-1927\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSalt Satyagraha-1930\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGandhi Irwin Pact-1931\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eQuit India Movement-1941\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following events is not correct? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1983)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) The Quit India Movement, or the August Movement, is not correct. Here\u0026rsquo;s some information about these events: Simon Commission-1927 : In 1927, the British government appointed a seven-person commission, led by Sir John Simon, to review the 1919 Government of India Act and suggest constitutional reforms. The commission did not include any Indian members, which sparked widespread protests. Salt Satyagraha-1930 : In 1930, Mohandas Gandhi led the Salt March, a nonviolent act of civil disobedience, from March 12\u0026ndash;April 6 to protest British rule in India. The march is also known as the Dandi March, Dandi Satyagraha, and the Salt March. Gandhi-Irwin Pact-1931 : On March 5, 1931, Mahatma Gandhi and Lord Irwin signed a political agreement.Quit India Movement-1941 : In 1942, Mahatma Gandhi launched the Quit India Movement, or the August Movement, at the Bombay session of the All India Congress Committee.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44095", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} im  impressed by the f ighting qualities of the Khalsa and began to recruit Sikhs into their military.\u003c/li\u003e\r\n\t\u003cli\u003eThe British annexed Oudh on February 7, 1856, under the terms of the Doctrine of Lapse. The Doctrine of Lapse allowed the British to annex Indian kingdoms if the ruler died without a male heir.\u003c/li\u003e\r\n\t\u003cli\u003eThe annexation of Oudh, also known as Awadh, was a significant event in Indian history. The annexation angered many Indians and is considered a cause of the Indian Mutiny (1857\u0026ndash;58), the largest rebellion against British rule. The Indian Mutiny is also known as the First War of Indian Independence\u003c/li\u003e\r\n\t\u003cli\u003eThe British annexed Upper Burma on January 1, 1886, after many years of conflict and British interference in Burmese politics. The Viceroy of India, Lord Dufferin, announced the annexation.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe annexation ended the Konbaung dynasty and Burmese independence. However, resistance to British rule continued for four years.\u003c/li\u003e\r\n\t\u003cli\u003eThe British occupied all of present-day Myanmar after three wars, making the territory a province of British India on January 1, 1886.\u003c/li\u003e\r\n\t\u003cli\u003eAfter World War II, the British granted Myanmar independence in January 1948, after 62 years of colonial rule.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44100", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003csty h:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the correct chronological order of the following? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1984)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. First Round Table Conference\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Gandhi Irwin Pact\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Simon Commission\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Cripps Mission\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer from the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Simon Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Indian Statutory Commission, was a group of seven British Parliament members who studied constitutional reform in India in 1927. The commission was appointed by the British Conservative government in November 1927 to report on the working of the Indian constitution. The commission\u0026rsquo;s chairman was Sir John Simon.\u003c/li\u003e\r\n\t\u003cli\u003eThe Simon Commission\u0026rsquo;s recommendations included giving more autonomy to Indian provincial governments, but keeping a veto for the Viceroy. The Simon Report was important in the constitutional discussion that led to the Government of India Act of 1935.\u003c/li\u003e\r\n\t\u003cli\u003eThe commission was boycotted by Indians because all its members were Englishmen and the commission had no Indian member. The slogan \u0026ldquo;Simon Go Back\u0026rdquo; became one of the most enduring slogans of the Indian freedom struggle.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe First Round Table Conference :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a series of meetings held in London from November 12, 1930 to January 19, 1931. The conference was organized by the British government and Indian political figures to discuss constitutional reforms in India. The conference was based on the recommendations of Muhammad Ali Jinnah and the Simon Commission report.\u003c/li\u003e\r\n\t\u003cli\u003eThe conference was the first time that Indians and the British met as equals. Attendees included the Princely States, the Muslim League, the Justice Party, and the Hindu Mahasabha. However, the Indian National Congress (INC) boycotted the conference, demanding complete independence for India. The reason for boycotting the conference was that Congress leaders were imprisoned for their involvement in the Civil Disobedience Movement.\u003c/li\u003e\r\n\t\u003cli\u003eThe Round Table Conferences were a series of three conferences held between 1930 and 1932. The second conference was held from September 7, 1931 to December 1, 1931, and the third conference was held from November 17, 1932 to December 24, 1932.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Gandhi-Irwin Pact :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a political agreement signed on March 5, 1931 between Mahatma Gandhi and Lord Irwin, the Viceroy of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe pact marked the end of a period of civil disobedience, or satyagraha, in India against British rule. The pact aimed to resolve the civil disobedience movement and ease political tensions in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome of the demands made in the pact include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Withdrawing all ordinances and prosecutions\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Releasing all political prisoners\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Restoring the confiscated properties of the satyagrahis\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Permitting the free collection or manufacture of salt\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn the pact, Gandhi promises to discontinue the Satyagraha Campaign and Irwin promises to release those Indians arrested for salt production.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Cripps Mission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a failed attempt by the British government to gain Indian support for their World War II efforts. The mission took place from March 22 to April 11, 1942 in Delhi, India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe mission\u0026rsquo;s purposes were to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Secure Indian cooperation\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Seek support for the British war\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Establish the Indian Union\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Allow India to participate in international bodies and the United Nations\u003c/p\u003e\r\n\r\n\u003cp\u003e5. The mission was organized by Sir Richard Stafford Cripps, a member of the War Cabinet.\u003c/p\u003e\r\n\r\n\u003cp\u003e6. The mission failed and the issue of India\u0026rsquo;s constitution was postponed until the end of the war.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe mission\u0026rsquo;s proposals were constitutional and sought Indian support. However, the Muslim League criticized the idea of a single Indian Union. They also stated that the proposals denied the Muslims the right to self-determination and the creation of Pakistan.\u003c/li\u003e\r\n\t\u003cli\u003eThe failure of the Cripps Mission led to the Quit India Movement. The Quit India Movement was a countrywide strike wave that involved workers, peasants, and states\u0026rsquo; peoples.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "416", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44105", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text
