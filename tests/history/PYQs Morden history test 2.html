max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 1, 4, 3\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3, 4, 1, 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArrange the following in a chronological order: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1986)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Dandi March\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Simon Commission\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Poona Pact\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Gandhi Irwin Pact\u003c/p\u003e\r\n\r\n\u003cp\u003eThe correct order is :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Simon Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Indian Statutory Commission, was a group of seven British Parliament members who studied constitutional reform in India in 1927. The commission was appointed by the British Conservative government in November 1927 to report on the working of the Indian constitution. The commission\u0026rsquo;s chairman was Sir John Simon.\u003c/li\u003e\r\n\t\u003cli\u003eThe Simon Commission\u0026rsquo;s recommendations included giving more autonomy to Indian provincial governments, but keeping a veto for the Viceroy. The Simon Report was important in the constitutional discussion that led to the Government of India Act of 1935.\u003c/li\u003e\r\n\t\u003cli\u003eThe commission was boycotted by Indians because all its members were Englishmen and the commission had no Indian member. The slogan \u0026ldquo;Simon Go Back\u0026rdquo; became one of the most enduring slogans of the Indian freedom struggle.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Dandi March :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Salt March, was a nonviolent civil disobedience campaign led by Mohandas Karamchand Gandhi from March 12, 1930 to April 6, 1930.\u003c/li\u003e\r\n\t\u003cli\u003eThe march was a protest against the British salt monopoly, which was established by the 1882 Salt Act. The act gave the British a monopoly on the collection and manufacture of salt, and levied a tax on it.\u003c/li\u003e\r\n\t\u003cli\u003eGandhi and other nationalists believed that taxing salt was sinful because it is a basic food item. The march was a centerpiece of the 1930 Salt Satyagraha, which was a protest against the increasingly repressive salt tax.\u003c/li\u003e\r\n\t\u003cli\u003eThe march began with a core group of followers, and hundreds more joined them along the way. On April 5, the group reached Dandi after a 240-mile (385 km) journey.\u003c/li\u003e\r\n\t\u003cli\u003eGandhi was arrested in early May after informing the British governor of India of his intention to march on the Dharasana saltworks. News of Gandhi\u0026rsquo;s imprisonment led tens of thousands more Indians to join the satyagraha.\u003c/li\u003e\r\n\t\u003cli\u003eThe Dandi March and Gandhi\u0026rsquo;s satyagraha teachings had a significant influence on American activists like Martin Luther King Jr. and James Bevel during the Civil Rights Movement in the 1960s.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Gandhi-Irwin Pact :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a political agreement signed on March 5, 1931 between Mahatma Gandhi and Lord Irwin, the Viceroy of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe pact marked the end of a period of civil disobedience, or satyagraha, in India against British rule. The pact aimed to resolve the civil disobedience movement and ease political tensions in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome of the demands made in the pact include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eWithdrawing all ordinances and prosecutions\u003c/li\u003e\r\n\t\u003cli\u003eReleasing all political prisoners\u003c/li\u003e\r\n\t\u003cli\u003eRestoring the confiscated properties of the satyagrahis\u003c/li\u003e\r\n\t\u003cli\u003ePermitting the free collection or manufacture of salt\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn the pact, Gandhi promises to discontinue the Satyagraha Campaign and Irwin promises to release those Indians arrested for salt production.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Poona Pact :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was an agreement signed in 1932 between Mahatma Gandhi and Dr. B.R. Ambedkar. The pact was signed in Yerwada Central Jail, Poona, on September 24, 1932.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe pact was a negotiated settlement that significantly shaped the political representation of the depressed classes, now known as Scheduled Castes (SC).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe pact\u0026rsquo;s terms included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eGuaranteed fair representation of the depressed classes in public services\u003c/li\u003e\r\n\t\u003cli\u003eReserved 147 seats for the depressed classes in the legislature\u003c/li\u003e\r\n\t\u003cli\u003eEarmarked a portion of the educational grant for the depressed classes\u003c/li\u003e\r\n\t\u003cli\u003eAccepted a joint electorate\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAbandoned the principle of a separate electorate\u003c/li\u003e\r\n\t\u003cli\u003eThe pact also gave reserved seats for depressed classes in the central and provincial legislative councils.\u003c/li\u003e\r\n\t\u003cli\u003eThe pact was significant because it stopped Mahatma Gandhi\u0026rsquo;s fast-unto-death action. Gandhi did not want to slow down the process of integrating Dalits. The pact marked the start of the movement against \u0026ldquo;untouchability\u0026rdquo; within the Indian nationalist movement.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44128", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 1 4 3\u0026nbsp; \u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !imp u003e3. Right to secede: \u003c/strong\u003eAllow provinces that are unwilling to accept the constitu tion to either maintain their current constitutional status or frame their own constitution.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Treaty: \u003c/strong\u003eAfter the constitution is formed, there will be a treaty between Britain and India to set up a frame work for transferring political power to India.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Relations with the Commonwealth:\u003c/strong\u003e Allow the Indian Union to decide its relations with the Commonwealth.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Participation in international bodies: \u003c/strong\u003eAllow the Indian Union to partic ipate in the United Nations and other international bodies.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Cripps Mission was rejected by the INC, the Muslim League, and other Indian groups. The British saw the proposals as too radical, and the INC, who wanted complete independence, saw them as too conservative.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44130", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max- \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Charter Act of 1793\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGovernment of India Act 1919\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following Acts was introduced by the Britishers to remove the shortcomings of the Regulating Act?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1986)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePitt\u0026rsquo;s India Act 1784 or the East India Company Act 1784 was passed in the British Parliament to rectify the defects of the Regulating Act 1773.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Pitt\u0026rsquo;s India Act of 1784 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the East India Company Act of 1784, was a British Parliament act that established a dual system of control over British India. The act was named after British prime minister William Pittthe Younger and was intended to address the shortcomings of the Regulating Act of 1773.\u003c/li\u003e\r\n\t\u003cli\u003eThe act established the British government\u0026rsquo;s authority over the East India Company\u0026rsquo;s rule in India. The act also distinguished between the company\u0026rsquo;s commercial and political functions. The act was in effect until 1858.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome other outcomes of the Pitt\u0026rsquo;s India Act:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Governor-General :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe act reduced the number of members required in the Governor-General\u0026rsquo;s council. The Governor-General also gained veto power and lost their military powers.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Board of Control :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe act established a Board of Control to manage the Company\u0026rsquo;s civil, military, and revenue affairs. The Board of Control included the chancellor of exchequer and a secretary of state.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Property disclosure :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe act required civil and military officers to disclose their properties in India and Britain within two months of joining. Corrupt officers faced severe punishments.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Capital :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe act made Calcutta the capital of the British Indian colonies.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5.\u0026nbsp;Subservience :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe act made the Madras and Bombay presidencies subservient to the Bengal Presidency.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. The Charter Act of 1793 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis Act continued the company\u0026rsquo;s rule over the British territories in India. It continued the company\u0026rsquo;s trade monopoly in India for another 20 years.\u003c/li\u003e\r\n\t\u003cli\u003eThe Act established that \u0026ldquo;acquisition of sovereignty by the subjects of the Crown is on behalf of the Crown and not in its own right,\u0026rdquo; which clearly stated that the\u0026nbsp;company\u0026rsquo;s political functions were on behalf of the British government. The company\u0026rsquo;s dividends were allowed to be raised to 10%.\u003c/li\u003e\r\n\t\u003cli\u003eThe Governor-General was given more powers. He could override his council\u0026rsquo;s decision under certain circumstances.\u003c/li\u003e\r\n\t\u003cli\u003eHe was also given authority over the governors of Madras and Bombay.\u003c/li\u003e\r\n\t\u003cli\u003eWhen the Governor-General was present in Madras or Bombay, he would supersede in authority over the governors of Madras and Bombay.\u003c/li\u003e\r\n\t\u003cli\u003eIn the Governor-General\u0026rsquo;s absence from Bengal, he could appoint a Vice President from among the civilian members of his Council.\u003c/li\u003e\r\n\t\u003cli\u003eThe composition of the Board of Control changed. It was to have a President and two junior members, who were not necessarily members of the Privy Council.\u003c/li\u003e\r\n\t\u003cli\u003eThe salaries of the staff and the Board of Control were also now charged to the company.\u003c/li\u003e\r\n\t\u003cli\u003eAfter all expenses, the company had to pay the British government Rs.5 Lakhs from the Indian revenue annually.\u003c/li\u003e\r\n\t\u003cli\u003eSenior company officials were barred from leaving India without permission. If they did so, it would be considered as a resignation.\u003c/li\u003e\r\n\t\u003cli\u003eThe company was n", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation :. (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Regulating Act of 1773 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a law passed by the British Parliament to reform the East India Company\u0026rsquo;s management and rule in India. It was also known as the East India Company Act of 1772.\u003c/li\u003e\r\n\t\u003cli\u003eThe act was the first step taken by the British government to control and regulate the affairs of the East India Company in India. It acknowledged the company\u0026rsquo;s political and administrative functions for the first time.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act\u0026rsquo;s provisions included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Requiring the company\u0026rsquo;s court of directors to report to the British government on revenue, civil, and military affairs in India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Limiting the court of directors\u0026rsquo; tenure to four years.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe act was introduced to address the company\u0026rsquo;s misgovernance, which had led to bankruptcy in the country.\u003c/li\u003e\r\n\t\u003cli\u003eThe Regulating Act and the India Act (1784) established government control of political policy.\u003c/li\u003e\r\n\t\u003cli\u003eThe company\u0026rsquo;s commercial monopoly was broken in 1813, and from 1834 it was merely a managing agency for the British government of India. It lost that role after the Indian Mutiny (1857).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Partition of Bengal in 1905 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a territorial reorganization of the Bengal Presidency by the British Raj. Thepartition separated the largely Muslim eastern areas from the largely Hindu western areas.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition was announced by Lord Curzon, the Viceroy of India at the time, and came into effect during his viceroyalty.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition left a significant minority of Hindus in East Bengal and Muslims in West Bengal. The Muslims supported the partition because they would have their own province, but the Hindus opposed it.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition marked the start of the Indian National Congress\u0026rsquo; transformation from a middle-class political organization into a wide-ranging growing movement. The partition brought the province to the brink of open rebellion. British officials argued that the province\u0026rsquo;s size made it difficult to handle and led to the marginalization of the poorer eastern part.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe All-India Muslim League (AIML) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was established on December 30, 1906, in Dhaka. The league was created to represent the interests of Indian Muslims in a country made up of mostly Hindus.\u003c/li\u003e\r\n\t\u003cli\u003eThe league was an important topic in the Indian struggle for independence.\u003c/li\u003e\r\n\t\u003cli\u003eThe league led the movement for a separate Muslim nation during the partition of British India in 1947.\u003c/li\u003e\r\n\t\u003cli\u003eThe Two-Nation theory argued for a different state for the Muslims of the British Indian Empire. This interpretation promised a democratic state where Muslims and non-Muslims would be treated equally.\u003c/li\u003e\r\n\t\u003cli\u003eThe league was initially encouraged by the British, who were generally favorable to their rule.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Surat Split : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;It was a 1907 event when the Indian National Congress (INC) split into two groups:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. the Moderates and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. the Radicals, also known as the Extremists.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe split was caused by a disagreement over who should be the presidential candidate. The Extremists wanted Lala Lajpat Rai, while the Moderates supported Rash Bihari Ghosh. The split was a major blow to the INC, and the differences between the two groups presented an opportunity to the British.\u003c/li\u003e\r\n\t\u003cli\u003eThe INC reunited in 1915. The Moderates, also known as the Early Nationalists, were a group of political leaders active between 1885 and 1907. They believed that political connections with Britain were in India\u0026rsquo;s best interests and that the time wasn\u0026rsquo;t right for a direct challenge to British rule.\u003c/li\u003e\r\n\t\u003cli\u003eThe Extremists believed in self-reliance as a weapon against domination. They promoted Swadeshi and boycotted foreign goods.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44137", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}  @font-face { font-family: \u0027serif\u0027;src: url(\u0027https://appx-content-v2.classx.co.in/fonts/seri max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the correct chronological order of the following?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1987)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eA.\u0026nbsp;Cabinet Mission\u003c/p\u003e\r\n\r\n\u003cp\u003eB.\u0026nbsp;Montague Chelmsford Reforms\u003c/p\u003e\r\n\r\n\u003cp\u003eC.\u0026nbsp;Minto \u0026ndash; Morley Reforms\u003c/p\u003e\r\n\r\n\u003cp\u003eD.\u0026nbsp;Cripps Mission\u003c/p\u003e\r\n\r\n\u003cp\u003eCodes:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Morley-Minto Reforms :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Indian Councils Act of 1909, were a series of reforms passed by the British Parliament in 1909.\u003c/li\u003e\r\n\t\u003cli\u003eThe reforms were formulated by John Morley, the secretary of state for India from 1905\u0026ndash;1910, following discussions with Lord Minto, the viceroy of India from 1905\u0026ndash;1910.\u003c/li\u003e\r\n\t\u003cli\u003eThe reforms introduced the elective principle to membership in the imperial and local legislative councils in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe reforms also increased the size of the legislative councils at the center and the provinces:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Central Legislative Council: From 16 to 60 members.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Legislative Councils of Bengal, Madras, Bombay and United Provinces: 50 members each.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Legislative Councils of Punjab, Burma and Assam: 30 members each.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe reforms also included the admission of Indians to the Secretary of State\u0026rsquo;s council, to the viceroy\u0026rsquo;s executive council, and to the executive councils of Bombay and Madras. The reforms also introduced an elected element into legislative councils with provision for separate electorates for Muslims.\u003c/li\u003e\r\n\t\u003cli\u003eThe reforms were aimed at appeasing the moderates of the country. Although it did not go far enough in giving Indians a voice in their own country, it was a significant improvement on previous legislation and opened up new opportunities for Indian participation in politics.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Montagu-Chelmsford Reforms of 1919 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt were a set of constitutional reforms introduced by the British colonial government to gradually establish self governing institutions in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe reforms were also known as the Mont\u0026ndash;Ford Reforms.\u003c/li\u003e\r\n\t\u003cli\u003eThe reforms were based on the recommendations of a report by Edwin Montagu, the Secretary of State for India, and Lord Chelmsford, the Viceroy of India from 1916\u0026ndash;1921.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe reforms included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Granting voting rights to women over the age of 21\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A royal amnesty for political prisoners and revolutionary terrorists\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Rowlatt Act, which suspended basic principles of rule of law and allowed closed court proceedings against suspected political dissidents\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe reforms were a turning point in India\u0026rsquo;s constitutional evolution and its struggle for independence. However, the reforms did not satisfy the demands of Indian nationalists.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Cripps Mission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a meeting between British government representatives and Indian leaders that took place from March 22 to April 11, 1942.\u003c/li\u003e\r\n\t\u003cli\u003eThe mission\u0026rsquo;s purpose was to secure Indian cooperation and support for the British war efforts in World War II. The mission\u0026rsquo;s proposals were constitutional and sought Indian support.\u003c/li\u003e\r\n\t\u003cli\u003eThe mission was organized by Sir Richard Stafford Cripps, a member of the War Cabinet. The mission failed and the issue of India\u0026rsquo;s constitution was postponed until the end of the war.\u003c/li\u003e\r\n\t\u003cli\u003eThe mission\u0026rsquo;s failure led to the Quit India Movement, a countrywide strike wave that involved workers, peasants, and states\u0026rsquo; peoples.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe mission\u0026rsquo;s proposals included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Establishing the Indian Union\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Allowing India to participate in international bodies and the United Nations\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Constituent Assembly would have members nominated by the Provincial Assemblies as well as the Princely States\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Any Province, which is not prepared to accept the new Constitution would have the right to sign a separate agreement with Britain regarding its future status.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Muslim League criticized the idea of a single Indian Union. They also stated that the proposals denied the Muslims the right to self-determination and the creation of Pakistan.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Cabinet Mission Plan :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a proposal put forward by the British Cabinet Mission in 1946 to address the issue of Indian independence. It recommended the creation of a united India with a federal structure, granting significant autonomy to provinces, while ensuring protections for minorities.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, it failed to gain acceptance from Indian political leaders and ultimately led to the partition of India and the creation of Pakistan.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44147", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo give India dominion status\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo introduce provincial autonomy in India\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo discuss future setup for India on the basis of the Simon Commission report\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !imp n Association.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Ghadar Party\u0026rsquo;s activities included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Smuggling arms Inciting Indian soldiers in the British Army to mutiny Starting an armed revolution for India\u0026rsquo;s independence\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Ghadar Party organized its own newspaper, The Ghadar, which was published in Urdu and Gurmukhi.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The party spread propaganda against the British and their associates through the newspaper.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44149", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLord Ripon\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u /style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLord Cornwallis introduced............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1987)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn 1793, Lord Cornwallis introduced the Permanent Settlement Act, also known as the Zamindari system, in Bengal, Bihar, Orissa, and Varanasi.\u003c/li\u003e\r\n\t\u003cli\u003eThe Permanent Settlement is an agreement between the East India Company and the Zamindars to fix land revenue.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe system\u0026rsquo;s main features are:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Zamindars, or landlords, are made the owners of the land\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Farmers are reduced to the status of tenants\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The land rights of members are fixed in perpetuity\u003c/p\u003e\r\n\r\n\u003cp\u003e4. There is no provision for fixed rent or occupancy right for actual cultivators\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Permanent Settlement was introduced to generate revenue for the East India Company and encourage the zamindars to invest in improving the land. Cornwallis was a British Army officer, Whig politician, and colonial administrator.\u003c/li\u003e\r\n\t\u003cli\u003eHe is best known as one of the leading British general officers in the American War of Independence.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Mahalwari system :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a revenue system used by the British in India. It was introduced in 1822 by Holt Mackenzie and Robert Merttins Bird.\u003c/li\u003e\r\n\t\u003cli\u003eThe word \u0026ldquo;Mahalwari\u0026rdquo; comes from the Hindi word \u0026ldquo;Mahal\u0026rdquo;, which means a group of villages.\u003c/li\u003e\r\n\t\u003cli\u003eIn the Mahalwari system, village headmen collect land revenue from farmers on behalf of the entire village.\u003c/li\u003e\r\n\t\u003cli\u003eThe revenue is based on the produce of the Mahal, which is a compact area containing one or more villages. In this system, landlords or Lambardars are assigned to represent villages or groups of villages. The landlords and village communities are jointly responsible for paying taxes.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mahalwari system had elements from both the Zamindari and Ryotwari systems. It was prevalent in parts of the Gangetic Valley, Uttar Pradesh, the North Western province, parts of Central India, and Punjab.\u003c/li\u003e\r\n\t\u003cli\u003eOne of the system\u0026rsquo;s flaws is that the survey is based on erroneous assumptions, which allows for manipulation and corruption. The Company spends more on collection than the revenue it receives at times, and as a result, the system is deemed a failure.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Mansabdari system :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a grading system used by the Mughal Empire to rank and salary Mansabdars, or nobles, in 1571. The word \u0026ldquo;Mansab\u0026rdquo; comes from the Arabic language and means \u0026ldquo;position\u0026rdquo; or \u0026ldquo;rank\u0026rdquo;. The system included all aspects of administration, including civil, military, and revenue affairs.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIt had two main features:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Zat: \u003c/strong\u003eThe personal rank of the official, which indicated their pay and status\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Sawar:\u003c/strong\u003e The rank that determined how many horses an official was required to maintain\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe system determined the rank and status of a government official and military generals. Every civil and military officer was given a mansab, which determined their salaries and allowances.\u003c/li\u003e\r\n\t\u003cli\u003eThe system also provided the emperor with a loyal and professional class of officers who were directly accountable to thecentral authority. It facilitated the efficient mobilization of the military by attaching a specific number of soldiers to each mansabdar.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44152", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u0 hing the worship of one God. It also emphasized educational, religious, and social reform, and aimed to encourage women\u0026rsquo;s empowerment.\u003c/li\u003e\r\n\t\u003cli\u003eThe Brahmo Samaj was one of the most powerful socio-religious movements in India. It aimed to bring a renaissance to Bengal by fighting against prevailing evil practices in society, particularly the practice of Sati and the caste system.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eSwami Vivekananda :\u003c/strong\u003e\u0026nbsp;the chief disciple of the Indian Hindu spiritual guru Ramakrishna, founded the Ramakrishna Mission on May 1, 1897. The mission was originally called The Ramakrishna Mission Association.\u003c/li\u003e\r\n\t\u003cli\u003eThe mission is named after Ramakrishna and primarily promotes the Hindu philosophy of Vedanta\u0026ndash;Advaita Vedanta and four yogic ideals.\u003c/li\u003e\r\n\t\u003cli\u003eThe mission played a significant role in the development of nationalistic awareness and the spiritual growth of Indians. Swami Vivekananda said he wanted to \u0026ldquo;set in motion a machinery which will bring noblest ideas to the doorstep of even the poorest and the meanest\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44156", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word; \u003eThe newspaper became popular and played a significant role in promoting social reforms in Gujarat.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDadabhai Naoroji :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a leading social reformer and a key player in the lobbying that led to the 1865 Parsi Acts. The acts created a Parsi personal law of inheritance and matrimony.\u003c/li\u003e\r\n\t\u003cli\u003eNaoroji was a founder of the Parsi Law Association, which advocated for legal status for women and uniform laws of marriage and inheritance for the Parsis.\u003c/li\u003e\r\n\t\u003cli\u003eHe was also a pioneer of women\u0026rsquo;s education and an upholder of equal laws for men and women. Naoroji was a key figure in promoting social and educational reforms within the Parsi community.\u003c/li\u003e\r\n\t\u003cli\u003eHe was opposed to casteism and caste restrictions, andworked towards the upliftment of Parsi society by challenging orthodox practices and advocating for a more progressive and inclusive approach.\u003c/li\u003e\r\n\t\u003cli\u003eNaoroji also became the first South Asian Member of Parliament in the House of Commons in London in 1892. During his time in Westminster, he became involved with local progressive organizations, temperance societies, and feminist and women\u0026rsquo;s suffrage circles.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDebendranath Tagore :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eEstablished the Tattvabodhini Sabha on October 6, 1839 in Kolkata. The group was originally called the Tattvaranjini Sabha, but was soon renamed to Tattwabodhini, which translates to \u0026ldquo;Truth-seekers\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe Tattvabodhini Sabha was a splinter group of the Brahmo Samaj, a group that sought to reform Hinduism and Indian society.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sabha\u0026rsquo;s goals were to encourage religious inquiry and spread the Upanishads. The Sabha and its Bengali publication, the Tattvabodhini Patrika, studied India\u0026rsquo;s history rationally and spread the ideas of Rammohan.\u003c/li\u003e\r\n\t\u003cli\u003eThe Tattvabodhini Patrika published articles on a variety of topics, including theology, scriptural texts, social problems, and Indian history. The publication also sought to protect the educated middle class from Western influence. The Sabha had a significant impact on the region\u0026rsquo;s social, political, and cultural aspects for 20 years, from 1839 to 1859.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHenry Louis Vivian Derozio (1809\u0026ndash;1831) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Anglo-Indian poet and teacher who did not express his opinion on the existence of God. He was a liberal thinker who supported freedom of speech and opposed the burning of widows on funeral pyres or killing children to appease gods.\u003c/li\u003e\r\n\t\u003cli\u003eDerozio was raised in a middle-class Christian environment, but his teachings at Hindu colleges were rationalist. He was one of the first key figures in writing in Indian English and is known for his radical standpoints.\u003c/li\u003e\r\n\t\u003cli\u003eSome of his poems include \u0026ldquo;The Harp of India\u0026rdquo;, \u0026ldquo;To India - My Native Land\u0026rdquo;, and \u0026ldquo;The Fakeer of Jungheera\u0026rdquo;. Some have attributed Derozio\u0026rsquo;s religious skepticism to David Drummond, a freethinker.\u003c/li\u003e\r\n\t\u003cli\u003eDerozio has also been accused of inciting his students to atheism, disobedience, and incest, but no charges were formally leveled against him.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "dif 03e\r\n\r\n\u003cp\u003eSelect the correct answer from the codes given below :\u003c/p\u003e\r\n\r\n\u003cp\u003eA B C D\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Indian Councils Act of 1909 introduced the concept of separate electorates. The British granted separate electorates to Muslims in 1909, after a Muslim delegation requested them in 1906.\u003c/li\u003e\r\n\t\u003cli\u003eThe Act was expanded in 1919 to allow Muslims to elect their own representatives in designated constituencies. Under separate electorates, Muslim members were to be elected only by Muslim voters.\u003c/li\u003e\r\n\t\u003cli\u003eThe Act of 1909 also increased the size of legislative councils at the Centre and the provinces. Lord Minto is known as the father of the communal electorate.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act of 1919 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Montague Chelmsford Reforms, introduced dyarchy in India. The act came into force in 1921. Dyarchy is a system of double government, which means rule of two.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act divided provincial subjects into two categories:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. transferred\u003c/strong\u003e and\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. reserved:\u003c/strong\u003e Transferred\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. subjects :\u003c/strong\u003e The governor, with the help of ministers, administers these subjects. These subjects are responsible to the Legislative Council.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Reserved subjects : \u003c/strong\u003eThe governor and his executive council administer these subjects, and they are not responsible to the Legislative Council.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe governor-general has complete jurisdiction over the provinces\u0026rsquo; reserved issues. The act also introduced bicameralism and direct election for the first time in India, and established a public service commission in 1926.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act of 1935 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt introduced provincial autonomy in India. The act gave more autonomy to the provinces, abolished diarchy at the provincial levels, and established an All India Federation. Provincial autonomy is the degree of self governance and decision-making power granted to provinces or regional entities within a country. The act originally received royal assent in August 1935.\u003c/li\u003e\r\n\t\u003cli\u003eThe British colonial government then revised and adapted its entire body of central and provincial administrative laws to ensure that they conformed to the principle of provincial autonomy between 1935 and 1938.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eThe Cripps Mission, a failed attempt by the British government in 1942, proposed a Constituent Assembly to frame a new constitution for India: \u003c/strong\u003eThe Constituent Assembly would be a body to make a constitution for India after the war.\u003c/li\u003e\r\n\t\u003cli\u003eThe members would be elected by the provincial assemblies and nominated by the rulers in the case of the Princely States. The constitution would be drafted entirely by Indians.\u003c/li\u003e\r\n\t\u003cli\u003eThe proposed Constituent Assembly would consist of 292 members from British India and 93 from Indian States. Any province unwilling to join the Indian dominion could form a separate union and have a separate constitution.\u003c/li\u003e\r\n\t\u003cli\u003eAny province which wouldn\u0026rsquo;t accept the new constitution would have the right to sign a separate agreement with the British.\u003c/li\u003e\r\n\t\u003cli\u003eIndian Provinces were given the right of secession from the Centre after 10 years. Until the new constitution came into force, India\u0026rsquo;s defence would be controlled by the British and the powers of the Governor General would remain unaltered.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44164", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth A and R are true and R is the correct explanation of A\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A): The Zamindari Settlement was introduced by Lord Cornwallis.\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R): The British desired to create a landed class in India for support.\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1988)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eLord Cornwallis introduced the Zamindari System in 1793 through the Permanent Settlement Act. The system was introduced in the provinces of Bengal, Bihar, Orissa, and Varanasi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003cstrong\u003eThe Zamindari System is a major land revenue system that consists of three components:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. the British\u003c/p\u003e\r\n\r\n\u003cp\u003e2. the Zamindar (Landlord)\u0026nbsp;and\u003c/p\u003e\r\n\r\n\u003cp\u003e3. the peasants\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe main feature of the system is that the British Raj receives a fixed sum of land revenue. This revenue is collected from the peasants and then offered to the British Raj.\u003c/li\u003e\r\n\t\u003cli\u003eThe Zamindari System fixed the land rights of the members in perpetuity without any provision for fixed rent or occupancy right for actual cultivators.\u003c/li\u003e\r\n\t\u003cli\u003eZamindars were recognized as the owners of the lands. The British introduced land settlements in India to create a landed class that would support British authority.\u003c/li\u003e\r\n\t\u003cli\u003eThe British wanted a regular source of revenue for the state, and settled peasants were easier to control and administer than people who were always on the move.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Permanent Settlement of 1793 divided the East India Company\u0026rsquo;s service personnel into three branches:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. revenue\u003c/p\u003e\r\n\r\n\u003cp\u003e2. judicial\u0026nbsp;and\u003c/p\u003e\r\n\r\n\u003cp\u003e3. commercial.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRevenues were collected by zamindars, native Indians who were treated as landowners. This division created an Indian landed class that supported British authority.\u003c/li\u003e\r\n\t\u003cli\u003eThe British were particularly interested in the Indian textile industry, which was one of the most productive in the world at the time.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", " in 1946 based on the recommendations of the Cabinet Mission.\u003c/li\u003e\r\n\t\u003cli\u003eThe Cabinet Mission was a group of British government members who visited India in 1946 to negotiate the transfer of power from the British Raj to Indian leadership.\u003c/li\u003e\r\n\t\u003cli\u003eThe idea of a constituent assembly was first proposed in 1934 by M.N. Roy.\u003c/li\u003e\r\n\t\u003cli\u003eThe Constituent Assembly was formed in November 1946, and elections were held for the first time for the assembly under the Cabinet Mission Plan.\u003c/li\u003e\r\n\t\u003cli\u003eThe assembly\u0026rsquo;s main goal was to draft the Constitution of India. B. N. Rau was appointed as the Constitutional Adviser to the Constituent Assembly in 1946.\u003c/li\u003e\r\n\t\u003cli\u003eHe was responsible for the general structure of the Constitution\u0026rsquo;s democratic framework and prepared its initial draft in February 1948.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Mountbatten Plan : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIt is also known as the 3 June Plan, was a proposal to divide British India into two independent nations:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. India and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Pakistan.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe plan was introduced on June 3, 1947, and led to the end of British colonial rule in the Indian subcontinent.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe plan also included the following provisions:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Provinces would be declared independent successor states.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. They would have the option to join the constituent assembly or not.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The constitution framed by the Constituent Assembly would not apply to Muslim-majority areas.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The transfer of power from the British authorities was to be implemented by Indian leaders on August 15, 1947.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe plan was also known as the \u0026ldquo;Dickie Bird Plan\u0026rdquo; or \u0026ldquo;Plan Balkan\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44178", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026nbsp;Bal Gangadhar Tilak\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAurobindo Ghosh\u003c/p\u003e", "option_3": "\u003cstyl sitive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following sessions of the Indian National Congress :\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1990)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe session in which..............\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Muslim League and the Indian National Congress met jointly\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Indian National Congress divided into two groups.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The resolution for \u0026ldquo;Complete Independence\u0026rdquo; was passed.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The Non-cooperation resolution was passed.\u003c/p\u003e\r\n\r\n\u003cp\u003eThe correct chronological sequence of these sessions is :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian National Congress (INC) split into two groups in 1907:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Radicals : \u003c/strong\u003eAlso known as \u0026ldquo;jahal\u0026rdquo;, they wanted to use violent methods to expel the British Empire from India.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Moderates :\u003c/strong\u003e Also known as \u0026ldquo;maval\u0026rdquo;, they wanted to use non-violent means to achieve Indian independence. The split occurred after the introduction of revolutionary ideas.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe two factions had previously patched their differences, but split for good in 1907.\u003c/li\u003e\r\n\t\u003cli\u003eThe INC reunited in 1915.\u003c/li\u003e\r\n\t\u003cli\u003eThe INC was founded in 1885, initially with the goal of pursuing moderate reform under the British raj in India. Its roots are in the early Indian nationalist movement that arose from the Indian Rebellion of 1857.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian National Congress (INC) and the All-India Muslim League met jointly in 1916 to sign the Lucknow Pact. The pact was masterminded by Muhammad Ali Jinnah, a member of both parties.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe pact\u0026rsquo;s goals included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Pressuring the British government to adopt a more liberal approach to India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Giving Indians more authority to run their country\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Safeguarding basic Muslim demands\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe pact was important because it:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Enhanced the League\u0026rsquo;s power in Indian politics\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Established communalism as an unavoidable part of Indian politics\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Gave the impression of Hindu Muslim unity in the national political scene\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Muslim League played a decisive role in the 1940s, becoming a driving force behind the division of India along religious lines and the creation of Pakistan as a Muslim state in 1947.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian National Congress (INC) passed the Non-Cooperation resolution in December 1920 at its Nagpur session in Maharashtra.\u003c/li\u003e\r\n\t\u003cli\u003eThe resolution was drafted by Mahatma Gandhi. The resolution stated that \u0026ldquo;there can be no contentment in India\u0026hellip; without the establishment of swarajya\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe INC called upon different sections of society to make sacrifices to attain swarajya, or self-government, by peaceful means. The resolution also promoted self-reliance by spinning khadi, buying Indian-made goods only, and boycotting British goods.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement also called for stopping planned dismemberment of Turkey (Khilafat Movement) and the end to untouchability.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian National Congress (INC) passed the resolution for \u0026ldquo;complete independence\u0026rdquo; on December 19, 1929 at the Lahore Session. The resolution is called the Declaration of Purna Swaraj, which means \u0026ldquo;total independence\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe resolution was made public on January 26, 1930, and the Congress Party urged Indians to celebrate it as \u0026ldquo;Independence Day\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe resolution was a defining moment in India\u0026rsquo;s struggle for freedom and set the stage for the subsequent Civil Disobedience movement led by Mahatma Gandhi.\u003c/li\u003e\r\n\t\u003cli\u003eThe resolution also asked all members of the legislature to resign their seats.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44182", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 2 4 1\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle p: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eKesab Chandra Sen was a prominent leader and social reformer of the Brahmo Samaj movement. Initially, he was associated with the Adi Brahmo Samaj under Debendranath Tagore but later formed his own branch called the Sadharan Brahma Samaj in 1878, after ideological differences with Tagore. He worked to modernize Indian society by promoting women\u0026rsquo;s education, widow remarriage, and the abolition of caste distinctions. Hence, Kesab Chandra Sen is correctly matched with Sadharan Brahma Samaj (3).\u003c/li\u003e\r\n\t\u003cli\u003eHenry Vivian Derozio was an Anglo-Indian teacher, poet, and radical thinker who founded the Young Bengal Movement in the early 19th century. As a teacher at Hindu College in Calcutta, he inspired his students to question superstitions, challenge social norms, and advocate for rationalism and freedom of thought. His followers, known as \u0026ldquo;Derozians,\u0026rdquo; carried forward his reformist and intellectual ideas. Thus, Derozio is rightly matched with the Young Bengal Movement (1).\u003c/li\u003e\r\n\t\u003cli\u003eDadoba Pandurang Tarkhadkar was a pioneer social reformer from Maharashtra who founded the Param Hansa Mandali in 1849 at Bombay (Mumbai). It was one of the earliest socio-religious reform organizations in western India and aimed to promote equality, women\u0026rsquo;s education, and the rejection of caste-based discrimination and idol worship. Therefore, Dadoba Pandurang is correctly associated with Param Hansa Mandali (2).\u003c/li\u003e\r\n\t\u003cli\u003eDevendranath Tagore, father of the famous poet Rabindranath Tagore, was an important reformer and religious thinker who played a major role in the Brahmo Samaj movement. In 1839, he founded the Tatvabodhini Sabha, which aimed to promote the teachings of the Upanishads and reform Hindu society through rational and spiritual awakening. The Sabha later merged with the Brahmo Samaj, strengthening the reformist movement. Hence, Devendranath Tagore correctly matches with Tatvabodhini Sabha (4).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThus the correct answer is D.\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44183", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n
