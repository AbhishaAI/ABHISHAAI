function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

nt} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A) : In 1946 in Bombay the ratings of the Royal Indian Navy RIN rose in open mutiny against the British.\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R) : The Royal Indian Navy joined the INA................... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1984)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Royal Indian Navy (RIN) Mutiny, also known as the Indian Naval Mutiny, began on February 18, 1946, when naval ratings in Bombay (now Mumbai) went on strike.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe mutiny was a result of many factors, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Discrimination: \u003c/strong\u003eThe British military discriminated against HMIS Talwar\u0026rsquo;s rating based on race.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Salary: \u003c/strong\u003eIndian and British troops were paid different salaries for the same position.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Access: \u003c/strong\u003eBritish soldiers had better access to facilities and food.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe mutiny was organized secretly by the Marines and the Indian people. The leaders of the mutiny were Salil Shyam, B. C. Dutt, Madan Singh, Rishi Dev Puri (Deb), and M. S. Khan.\u003c/li\u003e\r\n\t\u003cli\u003eThe mass strike against the British authorities continued until February 23, 1946. In this one week, the city of Bombay stood firmly behind the ratings.\u003c/li\u003e\r\n\t\u003cli\u003eThe Royal Indian Navy (RIN) was formally inaugurated in 1934 and was divided into the Royal Indian Navy and the Royal Pakistan Navy after India\u0026rsquo;s partition. On January 26, 1950, India became a republic and the RIN was renamed the Indian Navy.\u003c/li\u003e\r\n\t\u003cli\u003eThe RIN mutiny, also known as the 1946 Naval Uprising, was a failed insurrection of Indian naval ratings, soldiers, police personnel, and civilians against the British government in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe mutiny was a widespread and coordinated protest by Indian sailors within the British Indian Navy, symbolizing a major challenge to British colonial rule just before India gained independence in 1947.\u003c/li\u003e\r\n\u003c/ul\u003e", " pe=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe first Civil Disobedience Movement led by Mahatma Gandhi was started in 1919 against the Rowlatt Act. The Rowlatt Act, officially known as the Anarchical and Revolutionary Crimes Act of 1919, was passed by the British government to curb political unrest in India after World War I.\u003c/li\u003e\r\n\t\u003cli\u003eIt allowed the authorities to imprison any person suspected of revolutionary activities without trial, which was seen as a direct attack on civil liberties. Gandhi considered the Act unjust and oppressive, and in response, he launched a nationwide Satyagraha campaign \u0026mdash; marking the beginning of civil disobedience in India, where people peacefully refused to obey unjust laws.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJallianwala Bagh massacre :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt took place in 1919, soon after the Rowlatt Act protests. It was a tragic outcome of the unrest created by the Act when British troops under General Dyer opened fire on a peaceful gathering in Amritsar, killing hundreds. Although this event intensified India\u0026rsquo;s struggle for freedom, it was not the cause for which the first civil disobedience began.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eChauri Chaura incident :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt took place in 1922 during the Non-Cooperation Movement, not the Civil Disobedience Movement. It involved violent clashes between protestors and the police, leading Gandhi to suspend the movement because it violated his principle of nonviolence.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eArrival of Cripps\u0026rsquo; Mission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt arrived in 1942 and was related to World War II, when the British government sent Sir Stafford Cripps to negotiate Indian cooperation in the war effort. It came much later and had no link to the first civil disobedience movement.\u003c/li\u003e\r\n\t\u003cli\u003eThus, Gandhi\u0026rsquo;s first act of Civil Disobedience was launched in 1919 as a protest against the Rowlatt Act, making \u003cstrong\u003eoption (a) the correct answer.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44110", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRabindra Nath Tagore\u0026nbsp;\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{o India Act, 1935\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone of the above\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following Acts gave representation to Indians for the first time in legislatures? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1985)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian Councils Act of 1909 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Morley-Minto reform, is another act that gave representation to Indians for the first time in legislation. This act empowered the Governor General to nominate one Indian member to the Executive Council. The act also granted the Muslim League\u0026rsquo;s request for separate electorates and reserved seats in the Imperial Council.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act of 1919 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a British Parliament act that aimed to increase Indian participation in the administration of their country. The act was based on the recommendations of a report by Edwin Montagu, the Secretary of State for India, and Lord Chelmsford, India\u0026rsquo;s Viceroy between 1916 and 1921.\u003c/li\u003e\r\n\t\u003cli\u003eThe act introduced bicameralism and direct elections for the first time in India. The Imperial Legislative Council was converted into a bicameral legislature with the Imperial Legislative Assembly as the lower house and the Council of State as the upper house.\u003c/li\u003e\r\n\t\u003cli\u003eThe act also gave the Governor-General the power to suspend ministers for any reason he deemed appropriate. The Governor General also retained full control of finances. The Legislative Council could enact legislation, but it required the consent of the Governor. The act also included important issues like law and order, finance, and land revenue in a reserved list.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the majority of members in the councils were still appointed by the British government rather than being elected by the Indian public. The British government also retained significant control over crucial areas such as defense, finance, and administration.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act of 1935 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a milestone in the history of the Government of India. It was the last constitution given to India by the British before the country gained independence in 1947.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act was based on the following:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Simon Commission Report\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Recommendations of the Round Table Conferences\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The White Paper published by the British government in 1933\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Report of the Joint Select Committees\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act\u0026rsquo;s features include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Federal system: \u003c/strong\u003eThe act established a federal system of the Indian Government.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Division of powers: \u003c/strong\u003eThe act divided powers between the center and the states or provinces.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Two chambers: \u003c/strong\u003eThe act introduced the concept of having two chambers within the state.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Abolition of provincial dyarchy:\u003c/strong\u003e The act abolished the system of provincial dyarchy and suggested the establishment of dyarchy at the center.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Federation of India: \u003c/strong\u003eThe act suggested the establishment of a \u0026ldquo;Federation of India\u0026rdquo; consisting of the provinces of British India and most of the princely states.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Division of powers into three lists: \u003c/strong\u003eThe act divided the powers between center and units in terms of three lists: federal list, the provincial list and the concurrent list.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44114", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eFormation of Theosophical Society\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max 1890.\u003c/li\u003e\r\n\t\u003cli\u003eTilak is believed to have said the words in 1916 in Belgaum, Karnataka. He was released from prison in 1914 and returned to political life.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eTilak popularized four concepts :\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e1. Swaraj\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Swadeshi\u003c/p\u003e\r\n\r\n\u003cp\u003e3. national education\u0026nbsp;and\u003c/p\u003e\r\n\r\n\u003cp\u003e4. boycott\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eFor Tilak, Swaraj was self-government. He believed that with Swaraj, everyone would be free and have the right to participate in the government.\u003c/li\u003e\r\n\t\u003cli\u003eMahatma Gandhi\u0026rsquo;s quotes on freedom, religion and service \u0026ldquo;My religion is based on truth and non-violence. Truth is my God. Non-violence is the means of realising Him.\u0026rdquo;\u003c/li\u003e\r\n\t\u003cli\u003eSubhash Chandra Bose, also known as Netaji, is credited with coining the slogan \u0026ldquo;Dilli Chalo\u0026rdquo;. Bose used the slogan in 1944 to motivate the Indian National Army (INA) as they began their military campaign against Burma.\u003c/li\u003e\r\n\t\u003cli\u003eOn July 6, 1943, Bose gave his famous \u0026ldquo;Dilli Chalo\u0026rdquo; speech at the Padang, a large field in Singapore. The speech was a call to arms for the INA, which Bose had formed with the help of the Japanese.\u003c/li\u003e\r\n\t\u003cli\u003eThe slogan \u0026ldquo;Chalo Delhi\u0026rdquo; has been used by several organizations and individuals for different purposes. For example, the Aam Aadmi Party (AAP) used the slogan in their election campaign for the Delhi Legislative Assembly elections in 2015.\u003c/li\u003e\r\n\t\u003cli\u003eSubhas Chandra Bose, also known as Netaji, is credited with saying \u0026ldquo;You give me blood, I will give you freedom\u0026rdquo;. He delivered the famous speech on July 4, 1944 in Burma (present-day Myanmar) to members of the Indian National Army.\u003c/li\u003e\r\n\t\u003cli\u003eBose was born on January 23, 1897 in Cuttack, Odisha, and is known for his role in India\u0026rsquo;s independence movement.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44116", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSuppressing the revolt arisen\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u0 es caused by the Swadeshi movement\u003c/p\u003e\r\n\r\n\u003cp\u003e5. To foster division\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe partition was announced on July 16, 1905 by Lord Curzon, the then Viceroy of India. The partition was implemented on October 16, 1905.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition animated the Muslims to form their own national organization along communal lines. The Swadeshi movement was started in response to the partition in 1905. The movement advocated for the boycott of British goods and the promotion of Indian-made goods, and it played a significant role in the Indian independence movement.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44117", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 4\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003eLegislature\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eSelect the correct answer from the codes given below :\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian Councils Act of 1909 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Morley\u0026ndash;Minto or Minto\u0026ndash;Morley Reforms, was a series of reforms passed by the British Parliament in 1909. The act increased the involvement ofIndians in the governance of British India and formally introduced the principle of elections in India for the first time.\u003c/li\u003e\r\n\t\u003cli\u003eThe act introduced the concept of \u0026ldquo;separate electorate\u0026rdquo; and increased the size of the legislative councils at the center and the provinces. The act also enhanced the functions of the legislative councils, allowing members to ask supplementary questions, move resolutions on the budget, and vote for separate items for the budget of the country.\u003c/li\u003e\r\n\t\u003cli\u003eThe act was formulated by John Morley, secretary of state for India (1905\u0026ndash;10). With the help of Krishna G. Gupta (Indian Civil Service officer) and Sayyid Husain Bilgrami (member of the Indian Muslim League), John Morley was able to bring a resolution in the British parliament.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act of 1919 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a law passed by the British Parliament to increase Indian participation in the government of India. The act was also known as the Councils Act of 1919. It was in effect from 1919 to 1929.\u003c/li\u003e\r\n\t\u003cli\u003eThe act introduced the concept of responsible government and a federal structure with a unitary bias. It also established a dual system of government, with one accountable government and one not accountable.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act also introduced:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eBicameralism\u003c/li\u003e\r\n\t\u003cli\u003eDirect elections\u003c/li\u003e\r\n\t\u003cli\u003eThe concept of separate electorate\u003c/li\u003e\r\n\t\u003cli\u003eThe office of High Commissioner for India in London\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act also included matters related to specific provinces, such as:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePublic health, Local self-government, Education, General administration, Medical facilities, Land revenue, Water supply, Famine relief, Law and order, Agriculture.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act of 1935 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a milestone in the history of theGovernment of India. It was the last constitution given to India by the British before the country gained independence in 1947.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Act was based on the following :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSimon Commission Report Recommendations of the Round Table Conferences T he White Paper published by the British government in 1933 Report of the Joint Select Committees\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Act\u0026rsquo;s features include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Federal system: \u003c/strong\u003eThe act established a federal system of the Indian Government.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Division of powers: \u003c/strong\u003eThe act divided powers between the center and the provinces.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Establishment of an all-Indian Federation:\u003c/strong\u003e The act provided for the establishment of an all-Indian Federation consisting of provinces and princely states as units.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Abolition of provincial dyarchy: \u003c/strong\u003eThe act abolished the system of provincial dyarchy and suggested the establishment of dyarchy at the center.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Act was first published on August 2, 1935 and received royal assent in August 1935. It was the longest Act that the British Parliament ever enacted until the Greater London Authority Act 1999 surpassed it.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian Independence Act of 1947 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was passed by the British Parliament on July 5, 1947 and received royal assent on July 18, 1947. The act granted independence to India and Pakistan on August 15, 1947.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003cstrong\u003eThe act partitioned British India into two new independent dominions:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. India and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Pakistan.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePakistan was divided into two territories:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eWest Pakistan and East Pakistan, which is now Bangladesh. The act also separated the Muslim, Hindu, and Sikh populations.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act also:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Abolished the title of the \u0026ldquo;Emperor of India\u0026rdquo; from the British Crown\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Abolished the position of the Secretary of States for India and the office of the Viceroy\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Allowed for a joint Governor-General if both parties agreed\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Allowed both states\u0026rsquo; constituent assemblies to draft constitutions for their own countries\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44118", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{ove img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAnnexing the princely States\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLord Wellesley greatly extended the British dominion in India through............... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1985)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eLord Wellesley, the British Governor General of India from 1798 to 1805, expanded the British dominion in India through the Subsidiary Alliance system. This system brought the princely kingdoms under British rule.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Subsidiary Alliance system required Indian rulers to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Pay a subsidy to the British for the maintenance of the British army\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Dissolve their own armed forces\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Accept British forces in their territory\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn exchange, the British would protect the rulers from their enemies and promised not to interfere in the internal affairs of the allied state. However, they rarely followed through on this promise.\u003c/li\u003e\r\n\t\u003cli\u003eLord Wellesley also relied on war and assuming the territories of formerly subordinated rulers to achieve political control over India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Doctrine of Lapse :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a policy used by the East India Company to annex princely states in the Indian subcontinent. The policy was devised by Lord Dalhousie, the Governor General of India from 1848 to 1856, to deal with questions of succession to Hindu Indian states.\u003c/li\u003e\r\n\t\u003cli\u003eThe policy was applied until 1858, when the British Raj took over rule from the East India Company. The policy was based on the British belief that they had a moral and legal obligation to modernize and stabilize Indian states.\u003c/li\u003e\r\n\t\u003cli\u003eThe policy stated that any princely state or territory under the British East India Company would automatically be annexed if the ruler died without a male heir. Satara was the first state annexed under the doctrine of lapse in 1848.\u003c/li\u003e\r\n\t\u003cli\u003eThe policy was a main political cause for the great revolt of 1857. In 1857, a group of Indian rulers formed a secret society called the \u0026ldquo;Sepoy Mutiny\u0026rdquo; to overthrow the East India Company. This uprising was unsuccessful, but it did lead to the end of the doctrine of lapse in 1859.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44119", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 4 2 1\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e {overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFreedom at Midnight :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a 1975 non-fiction book by Larry Collins and Dominique Lapierre. The bookis about the events surrounding the Indian independence movement and partition. The story begins with the appointment of Lord Mountbatten of Burma as the last Viceroy of British India and ends with the assassination and funeral of Mahatma Gandhi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGeorge Orwell wrote Nineteen Eighty Four :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe dystopian novel was published in 1949 as a warning against totalitarianism. It was Orwell\u0026rsquo;s ninth and final book completed during his lifetime.\u003c/li\u003e\r\n\t\u003cli\u003eThe novel follows Winston Smith, a low-ranking member of the Party, who is frustrated by the Party\u0026rsquo;s control over people\u0026rsquo;s lives. The Party controls everything, including exercise, jobs, thoughts, and relationships. If the Party doesn\u0026rsquo;t like someone, they can vaporize that person. The Party also controls the past and what people can remember about it.\u003c/li\u003e\r\n\t\u003cli\u003eNineteen Eighty-Four made a deep impression on readers, and its ideas entered mainstream culture. The term \u0026ldquo;Orwellian\u0026rdquo; is now a universal shorthand for anything repressive or totalitarian.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Story of My Experiments with Truth is an autobiography by Mohandas Karamchand Gandhi :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt covers Gandhi\u0026rsquo;s life from early childhood through 1921. Gandhi wrote the book in weekly installments from 1925 to 1929 in his journal Navjivan.\u003c/li\u003e\r\n\t\u003cli\u003eThe book is about Gandhi\u0026rsquo;s quest for freedom for India and his inspiration of millions with his willpower and actions. It explores Gandhi\u0026rsquo;s life, principles, and nonviolent philosophy. The introduction describes his search for truth, and the conclusion summarizes it, demonstrating the overall message.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eThe Song Of India : \u003c/strong\u003eSarojini Naidu.\u003c/li\u003e\r\n\t\u003cli\u003eThe Song of India\u0026rdquo; is a poem by Sarojini Naidu, who was known as the \u0026ldquo;Nightingale of India.\u0026rdquo; She was not only a poet but also a freedom fighter and political leader. Her works often reflected patriotism, Indian culture, and the beauty of nature.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44120", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !im \"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSepoy mutiny of 1857 failed due to the.............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1985)\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Sepoy Mutiny, also known as the Indian Mutiny, was an uprising against the British East India Company\u0026#39;s rule in 1857-58. The rebellion began on May 10, 1857, when sepoys, or Indian soldiers, in the British East India Company\u0026#39;s army rebelled in Meerut, a garrison town northeast of Delhi.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion spread to other areas, including Delhi, Agra, Kanpur, and Lucknow, and eventually involved the masses. The rebellion was contained in 1858 when the rebels were defeated in Gwalior on June 20, 1858.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe rebellion had many causes, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The British East India Company\u0026#39;s attempts to develop the Indian economy and legal system\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The British paramountcy\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The doctrine of lapse\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The introduction of a new cartridge for the Enfield rifle, which was wrapped in paper coated in grease to make it easier to load\u003c/p\u003e\r\n\r\n\u003cp\u003e5. The refusal of Enfield cartridges\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British granted amnesty to all rebels not involved in murder on November 1, 1858, but did not declare the hostilities to have officially ended until July 8, 1859. By the end of the rebellion, over 50,000 sepoys had died or been executed, and another 100,000 civilians were killed by British efforts to put down the rebellion.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 1857 Mutiny failed due to a number of reasons, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Lack of planning and leadership\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Lack of unity\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Poor organization\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Lack of common ideal\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Lack of mass support\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Administrative causes\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Discontent among sepoys\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Organizational and military supe\u0026ntilde;ority of the English side.\u003c/p\u003e\r\n\r\n\u003cp\u003e9. Poor arms and equipment\u003c/p\u003e\r\n\r\n\u003cp\u003e10. Lack of spirit of nationalism\u003c/p\u003e\r\n\r\n\u003cp\u003e11. Lack of pan-India participation\u003c/p\u003e\r\n\r\n\u003cp\u003e12 Lack of all class participation\u003c/p\u003e\r\n\r\n\u003cp\u003e13. No support from the ruling class\u003c/p\u003e\r\n\r\n\u003cp\u003e14. The common people lost faith in Indian soldiers.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOther causes include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Rampant corruption in company\u0026#39;s administration\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Complex judicial system\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The character of British rule imparted a foreign and alien outlook\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Exclusion of natives from the higher administrative posts\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Misgovernance\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Conditions of service in the Company\u0026#39;s Army and cantonments increasingly came into conflict\u003c/p\u003e\r\n\r\n\u003cp\u003e7. The rebels fought with old-fashioned weapons while the British used all modern weapons\u003c/p\u003e\r\n\r\n\u003cp\u003e8. In many places the people were scared by the cruelty of the rebels.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44121", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo demonstrate against the policies of British\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n {overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A): The First War of Indian Independence started in 1857.\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R): The soldiers refused to use the greased cartridges.\u003cstrong\u003e (UPSC Prelims\u0026nbsp;1985)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Indian Rebellion of 1857, also known as the First War of Independence, began on May 10, 1857 in Meerut. The rebellion was an uprising against the rule of the British East India Company, which acted as a sovereign power on behalf of the British Crown.\u003c/li\u003e\r\n\t\u003cli\u003eThe revolt began as a mutiny of sepoys in the company\u0026rsquo;s army in Meerut, and then spread to other areas, including Delhi, Agra, Kanpur, and Lucknow. The rebellion was unsuccessful in ousting the British from the country.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe causes of the revolt include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Company rule: \u003c/strong\u003eAbout two-thirds of the country was under the East India Company\u0026rsquo;s rule.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Land taxes: \u003c/strong\u003ePeople were discontent with the land taxes taken by the Brit ish government.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Seizure of kingdoms:\u003c/strong\u003e The British seized many kingdoms and princely states.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Desire for freedom: \u003c/strong\u003ePeople wanted freedom from foreign rule.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British granted amnesty to all rebels not involved in murder on November 1, 1858, but did not declare the hostilities to have formally ended until July 8, 1859.\u003c/li\u003e\r\n\t\u003cli\u003eMangal Pandey was the first soldier to refuse to use the greased cartridges of thenew Enfield rifles in March 1857. Pandey was a sepoy in the 34th Bengal Native Infantry regiment of the British East India Company.\u003c/li\u003e\r\n\t\u003cli\u003ePandey\u0026rsquo;s attack on British officers on March 29, 1857, was the first major incident of what came to be known as the Sepoy Mutiny. Pandey was hanged to death for attacking his officers in Barrackpore, on 29 March 1857.\u003c/li\u003e\r\n\t\u003cli\u003eThe soldiers refused to use the cartridges because they were believed to be greased with animal fat that was offensive to Hindus and Muslims. The cartridges were made in England and were carried by the sepoys from 1855 to 1857 to check whether they could resist Indian weather.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44123", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overf ndia\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eSome of his major works include Satyarth Prakash, Satyarth Bhumika, Sanskarvidhi, Rigvedadi Bhashya Bhumika, Rigved Bhashyam, and Yajurved Bhashyam. He also founded the Paropakarini Sabha in Ajmer to publish and preach his works and Vedic texts.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44125", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3, 2, 4\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: brea ive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArrange the following in a chronological order.............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1986)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Foundation of Muslim League\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Jallianwala Bagh Massacre\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Khilafat Movement\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Civil Disobedience Movement\u003c/p\u003e\r\n\r\n\u003cp\u003eThe correct order is :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe All-India Muslim League (AIML) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was established on December 30, 1906, in Dhaka. The league was created to represent the interests of Indian Muslims in a country made up of mostly Hindus. The league was an important topic in the Indian struggle for independence.\u003c/li\u003e\r\n\t\u003cli\u003eThe league led the movement for a separate Muslim nation during the partition of British India in 1947. The Two-Nation theory argued for a different state for the Muslims of the British Indian Empire. This interpretation promised a democratic state where Muslims and non-Muslims would be treated equally. The league was initially encouraged by the British, who were generally favorable to their rule.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Jallianwala Bagh massacre :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Amritsar massacre, took place on April 13, 1919. The massacre was a turning point in India\u0026rsquo;s independence struggle. On that day, a large group of peaceful protesters gathered in Jallianwala Bagh, a public garden in Amritsar, Punjab, India.\u003c/li\u003e\r\n\t\u003cli\u003eThe protesters were celebrating Baisakhi and wanted to protest the arrest and deportation of two national leaders, Satyapal and Saifuddin Kitchlew. General Reginald Dyer ordered British Indian Army soldiers to fire on the unarmed civilians. The soldiers fired for about ten minutes, killing an estimated 379 people and injuring more than a thousand. The victims included men, women, and children. The incident led to widespread condemnation, with Winston Churchill describing the day as \u0026ldquo;monstrous\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Khilafat Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a political campaign that took place from 1919\u0026ndash;1924.It was a protest by Indian Muslims against British policies towards Turkey and the Ottoman Empire after World War I. The movement\u0026rsquo;s goal was to pressure the British government to keep the Ottoman Sultan as Caliph of Islam after the Ottoman Empire\u0026rsquo;s breakup.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement also aimed to unite the Muslim community in India behind the broader Indian nationalist movement. It sought to address Turkey\u0026rsquo;s grievances and promote Hindu-Muslim unity.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement was abruptly called off on February 12, 1922, at Gandhiji\u0026rsquo;s insistence, following the news of the Chauri Chaura incident.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Civil Disobedience Movement (CDM) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a significant event in India\u0026rsquo;s fight for independence from British rule in 1930. The movement originated in Calcutta (present-day Kolkata) and spread throughout Bengal.\u003c/li\u003e\r\n\t\u003cli\u003eCivil disobedience is when a citizen refuses to obey certain laws, demands, orders,or commands of a government. Some definitions say that civil disobedience must be nonviolent to be considered \u0026ldquo;civil\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe CDM was a direct-action campaign of tax resistance and nonviolent protest against the British salt monopoly. It was led by Mohandas Karamchand Gandhi and originated with the Dandi March, also known as the Salt March and the Dandi Satyagraha.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGandhi made 11 demands to the British government, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003e\u0026nbsp;Releasing political prisoners\u003c/li\u003e\r\n\t\u003cli\u003eAccepting the Postal\u003c/li\u003e\r\n\t\u003cli\u003eReservation Bill\u003c/li\u003e\r\n\t\u003cli\u003eReducing the rupee-sterling exchange ratio\u003c/li\u003e\r\n\t\u003cli\u003eIntroducing textile protection\u003c/li\u003e\r\n\t\u003cli\u003eReserving coastal shipping for Indians\u003c/li\u003e\r\n\t\u003cli\u003eReducing land revenue by 50%\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British did not respond to Gandhi\u0026rsquo;s demands, and the CDM was withdrawn in 1931 when Gandhi signed the \u0026ldquo;Gandhi Irwin\u0026rdquo; pact.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome reasons that paved the way for the CDM include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eThe formation of the Simon Commission\u003c/li\u003e\r\n\t\u003cli\u003eThe rejection of the demand for Dominion Status\u003c/li\u003e\r\n\t\u003cli\u003eDemonstrations against the detention of social revolutionaries\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome examples of civil disobedience movements:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eSalt March\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eKhilafat movement : \u003c/strong\u003eThis mass civil disobedience movement included the non-payment of taxes and the establishment of national schools and colleges.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eThe Karachi session :\u003c/strong\u003e This landmark session was held in 1931, immediately after the Gandhi-Irwin pact. It brought to an end the first phase of the civil disobedience movement that had begun with the Dandi March.\u003c/li\u003e\r\n\u003c/ol\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44126", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003c women\u0026rsquo;s rights activist, author, and politician.\u003c/li\u003e\r\n\t\u003cli\u003eBesant was a strong supporter of the Indian self-government movement and contributed to many social reforms in India. In 1916, she launched the Home Rule League with Lokmanya Tilak to campaign for democracy in India and dominion status within the Empire. She also co-founded the Banaras Hindu University.\u003c/li\u003e\r\n\t\u003cli\u003eBesant was also a political and religious activist with feminist ideas. She fought for the freedom of thought, secularism, women\u0026rsquo;s right, birth control, workers right and Fabian socialism.\u003c/li\u003e\r\n\t\u003cli\u003eSir William Jones, a British lawyer and Orientalist, founded the Asiatic Society of Bengal on January 15, 1784. The society\u0026rsquo;s main focus was to study Hindu culture and philosophy, and to examine the importance of the Sanskrit language.\u003c/li\u003e\r\n\t\u003cli\u003eThe Asiatic Society is located at Park Street, Kolkata, West Bengal, India. It includes a library, museum, and the Journal of the Asiatic Society.\u003c/li\u003e\r\n\t\u003cli\u003eThe Theosophical Society was founded in New York City in 1875 by Helena Petrovna Blavatsky, Colonel Henry Steel Olcott, William Quan Judge, and 16 others. The society\u0026rsquo;s headquarters were established in Adyar, India in 1882.\u003c/li\u003e\r\n\t\u003cli\u003eThe society\u0026rsquo;s main objectives were to promote the study of ancient religions and philosophies and to form a universal brotherhood of man without distinction of race, color, or creed.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1893, Mrs. Annie Besant took over the leadership of the Society after the death of Olcott. The movement was popularized by Annie Besant in India.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1",
