003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Hunter Commission\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Charles Wood\u0026rsquo;s Dispatch\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Sadler Commission\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Raleigh Commission\u003c/p\u003e\r\n\r\n\u003cp\u003eTheir correct chronological sequence :\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eWood\u0026rsquo;s Dispatch is the informal name for a formal dispatch sent in 1854 by Sir Charles Wood to Lord Dalhousie, the Governor General of India. Wood was the President of the Board of Control of the British East India Company.\u003c/li\u003e\r\n\t\u003cli\u003eThe dispatch is also known as the Magna Carta of English Education in India. It outlined a plan for expanding education in British India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe dispatch\u0026rsquo;s objectives included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Educating Indians on Western culture\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Producing a class of public officials\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Promoting the moral and intellectual development of the next generation\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Enhancing Indians\u0026rsquo; practical and vocational skills\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe dispatch suggested that:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Primary schools should adopt vernacular languages\u003c/p\u003e\r\n\r\n\u003cp\u003e2. High schools should use an Anglo vernacular medium\u003c/p\u003e\r\n\r\n\u003cp\u003e3. English should be the medium for college-level education\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe dispatch\u0026rsquo;s recommendations included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Establishing a Department of Public Instruction in each of Bengal\u0026rsquo;s five provinces\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Expanding mass education\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Establishing universities in the three Presidency towns of Calcutta, Bombay, and Madras\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe dispatch\u0026rsquo;s impact included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;The establishment of universities in Bombay, Madras, and Calcutta in 1857\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The establishment of education departments in all provinces\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The establishment of Bethune School for women\u0026rsquo;s education\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Hunter Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was established in 1882 by Viceroy Lord Ripon to examine the state of education in India and recommend reforms.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe commission\u0026rsquo;s objectives were to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Assess the status of elementary education in the British territories\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Suggest ways to improve and extend elementary education\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Assess the work of religious missionaries in the field of education\u003c/p\u003e\r\n\r\n\u003cp\u003e4.\u0026nbsp;The commission was headed by William Wilson Hunter, an Indian Civil Service (ICS) officer and a member of Lord Ripon\u0026rsquo;s Executive council.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe commission had 20 members, including 7 Indian members. The commission tried to improve the Indian education system by developing proper infrastructure, improving primary education, and adopting a policy of religious neutrality.\u003c/li\u003e\r\n\t\u003cli\u003eThe commission also praised the quality of secondary level education provided in the British occupied areas, particularly the region of Bengal.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Raleigh Commission :\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Indian Universities Commission, was established in 1902 to examine the state of Indian universities and recommend ways to improve their structure and operations. The commission was led by Sir Thomas Raleigh and appointed by Lord Curzon.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe commission\u0026rsquo;s recommendations included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;The government should appoint the majority of university fellows\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The number and terms of office of fellows should be reduced\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The government should have the power to change or approve regulations, and to veto university senate regulations\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe commission also made recommendations for school education reform, university curricular reforms, education and examinations, research, student welfare, and state scholarships.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sadler Commission was a commission established in 1917 by the Indian government to investigate the problems faced by Calcutta University.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe commission\u0026rsquo;s goals included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Reducing the load on university education\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Improving the quality of education\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Improving the quality of secondary education\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Freeing universities from the responsibility of secondary education so they can concentrate only on higher education\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe commission\u0026rsquo;s main recommendations included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Organizing all the teaching staff in Calcutta so that Calcutta University would be a full-fledged university\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Bifurcating higher education at the intermediate examination instead of the matriculation examination\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Creating intermediate colleges that would offer instruction in arts, science, medicine, engineering, teaching, and more\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Setting up a separate board of secondary and \u0026lsquo;intermediate education for administration and control of secondary and intermediate education\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;There should be less rigidity in framing university regulations\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44184", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/cs \r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2-3-4-1\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3-2-1-4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following events in Indian Freedom Movement :\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1990)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Singh Sabha Movement\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Quit India Movement\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Dandi March\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Gurdwara Reform Movement\u003c/p\u003e\r\n\r\n\u003cp\u003eThe correct chronological sequence of these events is :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Singh Sabha Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Singh Sabha Lehar, was a Sikh movement that began in the 1870s. The movement\u0026rsquo;s goal was to revive Sikh doctrine and bring back Sikhs who had converted to other religions. The movement also sought to establish a distinct space for Sikhs within India\u0026rsquo;s religious framework.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement\u0026rsquo;s first unit was formed in Amritsar in 1873. A more radical branch was formed in Lahore, which emphasized that Sikhs were not Hindus. The movement was a response to the activities of Christian, Hindu, and Muslim reform movements.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement\u0026rsquo;s policy was to avoid criticism of other religions and political matters. The movement also worked to spread Gurmukhi Punjabi through magazines and other media.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Gurdwara Reform Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Akali Movement, was a mass movement that took place from 1920 to 1925. The movement was a campaign to reform Sikh places of worship, known as gurdwaras, in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement began in Amritsar, Punjab, as a protest against the British government and their loyal mahants (priests). The mahants had taken over some of the Sikhs\u0026rsquo; gurdwaras.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement included: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Taran Taran Morcha:\u003c/strong\u003e A mandate was issued from the Akal Takhat to elect a representative body to govern the Golden Temple and reform other shrines.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Nankana tragedy: \u003c/strong\u003eNankana Sahib, the birthplace of Guru Nanak, was controlled by Mahants who deprived the poor peasantry of their rights.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Morcha Chabian: \u003c/strong\u003eA campaign to re cover the keys to the Golden Temple treasury.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Babbar Akali movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a splinter group of \u0026ldquo;militant\u0026rdquo; Sikhs who broke away from the mainstream Akali movement in 1921. The Babbar Akali movement was founded by Kishan Singh Gargaj (1886-1926).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Dandi March :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Salt March, was a nonviolent civil disobedience campaign led by Mohandas Karamchand Gandhi from March 12, 1930 to April 6, 1930.\u003c/li\u003e\r\n\t\u003cli\u003eThe march was a protest against the British salt monopoly, which was established by the 1882 Salt Act. The act gave the British a monopoly on the collection and manufacture of salt, and levied a tax on it.\u003c/li\u003e\r\n\t\u003cli\u003eGandhi and other nationalists believed that taxing salt was sinful because it is a basic food item. The march was a centerpiece of the 1930 Salt Satyagraha, which was a protest against the increasingly repressive salt tax.\u003c/li\u003e\r\n\t\u003cli\u003eThe march began with a core group of followers, and hundreds more joined them along the way. On April 5, the group reached Dandi after a 240-mile (385 km) journey.\u003c/li\u003e\r\n\t\u003cli\u003eGandhi was arrested in early May after informing the British governor of India of his intention to march on the Dharasana saltworks. News of Gandhi\u0026rsquo;s imprisonment led tens of thousands more Indians to join the satyagraha.\u003c/li\u003e\r\n\t\u003cli\u003eThe Dandi March and Gandhi\u0026rsquo;s satyagraha teachings had a significant influence on American activists like Martin Luther King Jr. and James Bevel during the Civil Rights Movement in the 1960s.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Quit India Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a civil disobedience movement launched by Mahatma Gandhi on August 8, 1942. The movement\u0026rsquo;s demands were to end British rule in India, gain Indian cooperation in World War II, and form a provisional government after the British withdrew.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement had two phases:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. First phase: \u003c/strong\u003eUrban revolt, marked by strikes, boycotts, and picketing\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Second phase: \u003c/strong\u003eFocus shifted to the countryside, which witnessed a major peasant rebellion\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe movement also had a third phase, where parallel or provisional governments were set up to govern during the rebellion. These alternative administrations were formed in areas like Ballia, Tamluk, and Satara. The movement helped India eventually gain independence in 1947.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44185", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTantia Tope\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLaxmibai\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNana Sahib\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:10 \u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eNana Sahib led the revolt of 1857 in Kanpur.He was the 14th Peshwa of the Maratha Empire, and his original name was Dhondu Pant. Nana Sahib joined the revolt after being denied pension and honors because he was not the natural born heir. Tantia Tope, Nana Sahib\u0026rsquo;s general, assisted him in Kanpur.\u003c/li\u003e\r\n\t\u003cli\u003eThe revolt began in Meerut on May 10, 1857, and gradually spread to places like Kanpur, Bareilly, Jhansi, Delhi, and Awadh. On June 23, 1857, rebel soldiers under Nana Sahib launched a major attack on the British entrenchment.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian Rebellion of 1857 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a major but unsuccessful uprising against the British East India Company\u0026rsquo;s rule in India from 1857\u0026ndash;58. The revolt began on May 10, 1857, at Meerut as a sepoy mutiny. The revolt is also known as the Sepoy Mutiny, the Indian Mutiny, the Great Rebellion, and the Revolt of 1857.\u003c/li\u003e\r\n\t\u003cli\u003eThe revolt began as a mutiny of the British East India Company\u0026rsquo;s army sepoys, but eventually gained the support of the masses. The immediate cause of the revolt was the introduction of new Enfield cartridges, which were rumored to be lined with cow and pig fat. Both Hindus and Muslims had issues with pig and cow fat.\u003c/li\u003e\r\n\t\u003cli\u003eThe revolt was a failure due to poor organization and lack of mass support. The sepoys lacked a common ideal, and it was difficult to find a leader with both military and political skills.\u003c/li\u003e\r\n\t\u003cli\u003eThe revolt resulted in the deaths of over 50,000 sepoys, and another 100,000 civilians killed by the British. The chaos that followed also contributed to a major famine that killed even more people.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44186", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1930\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cs verflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe intensity of famine increased in India under the British rule because.............\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1991)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;The intensity of famine increased in India under British rule due to a combination of factors: \u003c/strong\u003eBritish economic and administrative policies:\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThese included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Rack-renting\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Levies for war\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Free trade policies\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Expansion of export agriculture\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Neglect of agricultural investment\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Extraction of land revenue\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Conversion of agricultural land for cash crops\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Disruption of traditional agricultural practices\u003c/p\u003e\r\n\r\n\u003cp\u003e9. Imposition of high taxes\u003c/p\u003e\r\n\r\n\u003cp\u003e10. Uneven rainfall\u003c/p\u003e\r\n\r\n\u003cp\u003e11. Drought\u003c/p\u003e\r\n\r\n\u003cp\u003e12. Continuous draining of India\u0026rsquo;s wealth\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British administration took over in 1858 and became concerned with preventing famines. The Famine Commission Report of 1880 recommended the introduction of Famine Codes. However, before these measures had an effect, two more famines followed.\u003c/li\u003e\r\n\t\u003cli\u003eThe famines in nineteenth-century India were often caused by massive crop failures resulting from drought. The first effect of drought was to stop all field labor, which threw people out of work. This led to distress among agricultural laborers and rural artisans, and the few small trades and handicrafts that depended on them.\u003c/li\u003e\r\n\t\u003cli\u003eThe proximate cause of famines, without exception, was a sharp rise in food prices, which in turn reduced real wages and caused starvation, malnutrition and epidemic, mainly among agricultural labourer groups.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWhat is Drain Of Wealth?\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDadabhai Naoroji wrote Poverty and Un British Rule in India in 1901. The book is a study of the difference between British liberal ideas and the reality of British rule in India.\u003c/li\u003e\r\n\t\u003cli\u003eIn the book, Naoroji criticizes the economic impact of British rule and argues that British economic policies extracted wealth from India to finance Britain\u0026rsquo;s industries. This theory is known as the \u0026ldquo;drain of wealth\u0026rdquo;. Naoroji also argues that British rule was despotic and destructive to Indians.\u003c/li\u003e\r\n\t\u003cli\u003eNaoroji was a former Liberal member of parliament, founder and some-time president of the Indian National Congress, and merchant. At the time of writing he was living in Britain.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44193", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eHis participation in the Quit India Movement\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u  1942\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe movement resulted in widespread civil disobedience and protests, which were met with harsh repression by the British authorities.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement\u0026rsquo;s significance was that it placed the demand for independence on the immediate agenda of the national movement.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44195", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMountbatten plan\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style  formed on January 1, 1923 by Indian politicians and members of the Indian National Congress. Das was a champion of national education and advocated for Hindu-Muslim unity, cooperation, and communal harmony.\u003c/li\u003e\r\n\t\u003cli\u003eHe resigned as president of the Indian National Congress after losing a motion on \u0026ldquo;No Council Entry\u0026rdquo; to Gandhi\u0026rsquo;s faction.\u003c/li\u003e\r\n\t\u003cli\u003eVinayak Damodar Savarkar is a member of the Hindu Mahasabha. During World War II, Savarkar was the president of the Hindu Mahasabha. He supported the British war effort in India and promoted the slogan \u0026ldquo;Hinduize all Politics and Militarize Hindudom\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hindu Mahasabha\u0026rsquo;s ideology includes Hindutva, Hindu nationalism, ultranationalism, social conservatism, national conservatism, economic nationalism, and right-wing populism.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44200", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{ ": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following are associated with Lord Lytton?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1992)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Rowlatt Act\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Arms Act\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Vernacular Press Act\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Abolition of duties on the import of coarse cotton goods\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer by using the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eLord Lytton was the viceroy of India from 1876\u0026ndash;1880.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHe is associated with the following acts: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eVernacular Press Act :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn 1878, Lord Lytton proposed the Vernacular Press Act, which limits the freedom of the Indian-language press.\u003c/li\u003e\r\n\t\u003cli\u003eThe act was intended to prevent the press from criticizing British policies, especially during the Second Anglo-Afghan War (1878\u0026ndash;1880).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIndian Arms Act :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn 1879, Lord Lytton introduced the Indian Arms Act, which requires Indians to obtain a license or permission to keep, sell, or purchase weapons.\u003c/li\u003e\r\n\t\u003cli\u003eOffenders are sentenced to a fine and seven years in prison.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRoyal Titles Act, 1876 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn 1876, Lord Lytton\u0026rsquo;s Royal Titles Act gave Queen Victoria the title of \u0026ldquo;Kaiser-i-Hind\u0026rdquo;, or \u0026ldquo;Queen Empress of India\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eAbolition of duties on the import of coarse cotton goods On March 13, 1879, Lord Lytton abolished the import duty on cotton goods, except for the finest qualities.\u003c/li\u003e\r\n\t\u003cli\u003eLytton was eager to reduce or completely abolish cotton duties. On April 4, 1879, the House of Commons passed a resolution stating that the Indian import duty on cotton goods should be abolished as unjust.\u003c/li\u003e\r\n\t\u003cli\u003eThe resolution also stated that it would be fair to abolish duties on all goods if the duty on cotton goods were abolished.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Rowlatt Act :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is officially known as the Anarchical and Revolutionary Crimes Act of 1919, was passed by the British government in March 1919.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act gave the British government the power to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Arrest anyone suspected of terrorist activities\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Detain people arrested for up to two years without trial\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Search places without a warrant\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Place severe restrictions on the freedom of the press\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe purpose of the Act was to curb the growing nationalist upsurge in the country. The act was named after Sir Sidney Rowlatt, the chairman of the committee that drafted it.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rowlatt Acts were a set of laws passed in February 1919 by the Imperial Legislative Council, the legislature of British India. The acts were intended to replace the Defence of India Act of 1915, which had been passed during wartime.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rowlatt Act led to nationwide unrest. Mahatma Gandhi called upon the people to perform satyagraha against the act.\u003c/li\u003e\r\n\t\u003cli\u003eRallies were organized in various cities. Workers went on strike in railways. Workshops and shops closed down.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44201", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break  in peaceful and constitutional methods to achieve reforms. They followed a policy of petitions, resolutions, and dialogues with the British government, hoping that the British would grant political rights gradually. Their approach was often described as one of \u0026ldquo;prayers, petitions, and protests.\u0026rdquo;\u003c/li\u003e\r\n\t\u003cli\u003eIn contrast, Bal Gangadhar Tilak was an Extremist leader who believed that freedom could not be achieved through mere requests but only through active resistance and assertive action. He emphasized Swaraj (self-rule) as the birthright of every Indian and inspired the masses through his newspapers Kesari and The Mahratta. Tilak\u0026rsquo;s approach involved boycotts, swadeshi, and passive resistance, which were seen as radical compared to the methods of the Moderates. He, along with Bipin Chandra Pal and Lala Lajpat Rai, formed the famous Lal-Bal-Pal trio, who spearheaded the Extremist movement within the Congress.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, while Gopal Krishna Gokhale, Dadabhai Naoroji, and Firoz Shah Mehta were Moderates advocating gradual reform, Bal Gangadhar Tilak was not a Moderate \u0026mdash; he was an Extremist leader who called for direct action and mass participation to achieve India\u0026rsquo;s independence.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "417", "test_series_id": "19", "topic": ""}];
const QUIZ_TITLE = "Modern History PYQ Test 2";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
