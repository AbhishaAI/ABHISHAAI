<main style="max-width: 950px; margin: 35px auto; padding: 0 25px; font-family: 'Georgia', serif; padding-bottom: 150px;">

<button onclick="navigate(1)" style="background: #1b1b1b; color: #fdf6e3; border: none; padding: 18px 45px; cursor: pointer; font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">NEXT QUESTION</button>

function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2001)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Arya Samaj was founded in 1835.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Lala Lajpat Rai opposed the appeal of Arya Samaj to the authority of Vedas in support of its social reform programmes.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Under Keshab Chandra Sen, the Brahmo Samaj campaigned for women\u0026rsquo;s education.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Vinoba Bhave founded the Sarvodaya Samaj to work among rufugees.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of these statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Arya Samaj was founded on April 10, 1875, in Girgaon. The name Arya Samaj translates to \u0026ldquo;Society of Nobles\u0026rdquo; in Sanskrit. The Arya Samaj is a Hindu reform movement that aims to reestablish the Vedas as revealed truth. The Vedas are the earliest Hindu scriptures.\u003c/li\u003e\r\n\t\u003cli\u003eArya Samaj followers believe the Vedas are infallible and the literal word of God. The Arya Samaj was founded by Swami Dayananda Saraswati, a Hindu scholar and social activist. Saraswati spent 15 years as awandering scholar, studying the Vedas and Indian philosophy.\u003c/li\u003e\r\n\t\u003cli\u003eThe Arya Samaj is one of the Hindu organizations that worked towards growing civil rights movements in India in the 1800s. The organization also advocated for causes like widow remarriage and education of girl children. The Arya Samaj\u0026rsquo;s official flag and symbol is AUM.\u003c/li\u003e\r\n\t\u003cli\u003eLala Lajpat Rai did not oppose the Arya Samaj\u0026rsquo;s appeal to the authority of the Vedas. Rai was a prominent leader of the Indian National Congress and a supporter of the Arya Samaj. He was an active member of the Hindu reformist movement, which aimed to promote Vedic principles and oppose the caste system and idol worship. Keshab Chandra Sen, a leader of the Brahmo Samaj, campaigned for women\u0026rsquo;s education.\u003c/li\u003e\r\n\t\u003cli\u003eThe Brahmo Samaj encouraged women\u0026rsquo;s education, widow remarriage, and the abolition of promiscuity. The Brahmo Samaj was founded in 1828 by Raja Ram Mohan Roy. In 1857, Keshav Chandra Sen joined the Brahmo Samaj and in 1880 he founded the Navavidhan Brahmo Samaj. After being expelled from the Brahmo Samaj for his extreme ideas, Keshab Chandra Sen created the Brahmo Samaj of India.\u003c/li\u003e\r\n\t\u003cli\u003eVinoba Bhave, a disciple of Mahatma Gandhi, founded the Sarvodaya Samaj (Society of Well-being) to help marginalized groups, including refugees. The Sarvodaya movement was started by Bhave, who was a strong advocate of human rights and non violence. The word \u0026ldquo;Sarvodaya\u0026rdquo; is Hindi for \u0026ldquo;universal uplift\u0026rdquo; or \u0026ldquo;progress of all\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44326", "image_check": "0", "image_link_1": ss\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe farmers were not interested in getting pattas\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eUnder the Permanent Settlement, 1793, the zamindars were required to issue pattas to the farmers which were not issued by many of the zamindars. The reason was............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2001)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMany Zamindars did not issue pattas to farmers under the Permanent Settlement of 1793 because there was no official check upon them.\u003c/li\u003e\r\n\t\u003cli\u003eThe Permanent Settlement of 1793 required Zamindars to issue pattas to farmers, but many failed to do so. The British Government implemented the system to resolve the agrarian crisis and distress that had resulted in lower agricultural output.\u003c/li\u003e\r\n\t\u003cli\u003eThe system\u0026rsquo;s main aim was to increase investment in agriculture, trade, and the resources of the state\u0026rsquo;s revenue.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Permanent Settlement system had the following features:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The amount to be paid by the landlords was fixed.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The amount was agreed that would not increase in future (permanent).\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The fixed amount was 10/11th portion of the revenue for the government and 1/11th was for the Zamindar.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe absence of stringent regulatory measures provided ample room for Zamindars to exploit their position. For example, farmers now had to work on unproductive land, which was a strain. Additionally, there was a revenue loss for the government in the case of productive land. Numerous Zamindars defaulted due to the high revenue rates.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44327", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/ eCabinet Mission\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWavell Plan\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe last opportunity to avoid the partition of India was lost with the rejection of.............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe last opportunity to avoid the partition of India was lost with the rejection of the Cabinet Mission Plan in 1946. The Cabinet Mission was a British government initiative to find a solution to the political crisis in India. The plan proposed a united India with a federal structure, but the Muslim League rejected it, demanding a separate Muslim state. The rejection of the Cabinet Mission Plan led to the partition of India into two dominions, India and Pakistan, in 1947.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition of India was a traumatic event that resulted in the displacement of millions of people and the deaths of hundreds of thousands. It is a reminder of the importance of finding peaceful solutions to political conflict.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eChakravarti Rajagopalachari\u0026rsquo;s formula, or C. R. formula :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a proposal to solve the political deadlock between the All India Muslim League and the Indian National Congress over British India\u0026rsquo;s independence.\u003c/li\u003e\r\n\t\u003cli\u003eChakravarti Rajagopalachari, also known as Rajaji or C.R., was an Indian statesman, writer, lawyer, and independence activist. He was born on December 10, 1878 and died on December 25, 1972.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Wavell Plan :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a proposal for Indian self - government presented in 1945. The plan was named after Lord Wavell, who became the Viceroy of India in 1943. The plan failed due to disagreements between the Muslim League and the Indian National Congress.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Wavell Plan included the following proposals:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Viceroy\u0026rsquo;s Executive Council would have all Indian members except the Viceroy and the Commander-in Chief.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The council would have a \u0026ldquo;balanced representation\u0026rdquo; of all Indians.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The creation of a federal government in India, with a central government and two provinces, one Hindu majority and one Muslim-majority.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Equal representation of Muslims and Hindus.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Indians would hold all portfolios, except the defense portfolio.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Wavell Plan is considered to be a significant step towards Indian independence because it sought to give the country almost total power.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44329", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndian Council Act, 1861\u003c/p\u003e", "op h:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndian Councils Act, 1909\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following Acts of British India strengthened the Viceroy\u0026rsquo;s authority over his executive council by substituting \u0026ldquo;portfolio\u0026rdquo; or departmental system for corporate functioning? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Indian Councils Act of 1861 (24 \u0026amp; 25 Vict. c. 67) strengthened the Viceroy\u0026#39;s authority over his Executive Council by substituting the portfolio or departmental system for corporate functioning.\u003c/li\u003e\r\n\t\u003cli\u003eThe act transforms the Viceroy\u0026#39;s Executive Council into a miniature cabinet run on the Portfolio system. Under this, a member of the Viceroy\u0026#39;s council is made in-charge of one or more departments of the Government and is authorized to issue final orders on behalf of the council on matters of his department(s).\u003c/li\u003e\r\n\t\u003cli\u003eThe act also increases the number of members by one. Three members are to be appointed by the Secretary of State for India, and two by the Sovereign. The portfolio system was introduced by Lord Canning in 1859.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act of 1858 :\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was an act of the British Parliament that transferred the government and territories of the East India Company to the British Crown. The act was passed on August 2, 1858 and commenced on November 1.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act\u0026#39;s provisions included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Liquidating the British East India Company\u003cbr /\u003e\r\n2. Transferring its functions to the British Crown\u003cbr /\u003e\r\n3. Governing Indian territories of Britain in the name of the British Queen\u003cbr /\u003e\r\n4. Scrapping the Court of Directors and the Board of Control\u003cbr /\u003e\r\n5. The Secretary of State for India would exercise authority over India, aided by a Council\u003cbr /\u003e\r\n6. The Secretary of State would act as a channel of communication between the British government and Indian Administration.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Secretary of State would have complete authority and control over the Indian Administration\u003c/li\u003e\r\n\t\u003cli\u003eThe Secretary of State would have the power to send secret dispatches to India without consulting his council\u003c/li\u003e\r\n\t\u003cli\u003eThe act was largely confined to improving the administrative machinery by which the Indian Government was to be supervised and controlled in England.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian Councils Act of 1892 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was an act of the British Parliament that amended the composition and function of legislative councils in British India. The act was introduced by Richard Assheton Cross, the first Viscount Cross, and received royal assent on June 20, 1892 It commenced on February 3, 1893.\u003c/li\u003e\r\n\t\u003cli\u003eThe act increased the number of members in the central and provincial councils. It also increased the powers of the council\u0026#39;s additional membership, allowing them to ask questions of government and to criticize formally the official budget during one day.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act\u0026#39;s significance included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Hearing opinions, even though Indians did not have the power to veto the majority\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Allowing non-officials to have free and open discussion on the government\u0026#39;s financial strategy\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHowever, the act also had some limitations:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Providing no benefits to the common man\u003cbr /\u003e\r\n2. Creating the stage for the development of numerous revolutionary forces in India.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe act was opposed by prominent Indian leaders like Bal Gangadhar Tilak.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian Councils Act of 1909 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Morley-Minto Reforms, was a law passed by the British Parliament that increased the involvement of Indians in the governance of British India. The act was formulated by John Morley, the secretary of state of India from 1905-1910, and Lord Minto, the viceroy of India from 1905-1910.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act increased the size of the legislative councils at the center and the provinces:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Central Legislative Council: From 16 to 60 members.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Legislative Councils of Bengal, Madras, Bombay and United Provinces: 50 members each.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e3 Legislative Councils of Punjab,Burma and Assam: 30 members each.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act also:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Enhanced the functions of the legislative councils at both levels\u003cbr /\u003e\r\n2. Introduced the concept of \u0026quot;separate electorate\u0026quot;\u003cbr /\u003e\r\n3. Created executive councils in the provinces of Bombay, Madras, and West-Bengal\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIntroduced the office of a \u0026quot;Vice-President\u0026quot; at both the center and the provinces\u003c/li\u003e\r\n\t\u003cli\u003eThe elected members were to be indirectly elected. The local bodies were to elect an electoral college, which in turn would elect members of provincial legislatures, who in turn would elect members of the central legislature.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44330", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eexercise more and direct political and administrative control over the princely states\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003einvolve the princes actively in the administration of the colony\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} /tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eCodes :\u003c/p\u003e\r\n\r\n\u003cp\u003eABCD\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Communal Award :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was announced by British Prime Minister Ramsay MacDonald on August 16, 1932. It was also known as the MacDonald Award.\u003c/li\u003e\r\n\t\u003cli\u003eThe award provided separate electorates for minorities, including Muslims, Sikhs, Indian Christians, Anglo-Indians, women, and the \u0026ldquo;depressed classes\u0026rdquo;. It also ensured the retention of separate electorates for Muslims, Sikhs, and Europeans.\u003c/li\u003e\r\n\t\u003cli\u003eThe award was based on the recommendations of the Indian Franchise Committee and Ambedkar\u0026rsquo;s efforts. It was announced after the Round Table Conference (1930\u0026ndash;32). The award was later incorporated into the act of 1935.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe August Offer :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a proposal made in 1940 by Lord Linlithgow, the Viceroy of India. The offer was a response to the Indian National Congress\u0026rsquo;s disappointment with the British involvement of India in World War I. The offer was presented at a conference in Simla and aimed to appease Indian sentiments and gain support for World War II.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe August Offer included the following promises:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Expanding the Executive Council of the Viceroy of India to include more Indians\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Establishing an advisory war council\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Giving full weight to minority opinion\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Recognizing Indians\u0026rsquo; right to frame their own constitution\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe offer was rejected by the Congress and the League. The Congress rejected the offer because they wanted complete independence, but were offered Dominion status instead. The League stated that they would accept nothing less than the country\u0026rsquo;s separation. The British later tweaked the offer and came up with the Cripps Proposal in 1942.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Doctrine of Lapse :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a policy of annexation adopted by the East India Company in the Indian subcontinent. The policy was introduced by James Broun-Ramsay, 1st Marquess of Dalhousie, the Governor General of India from 1848 to 1856. The policy was applied until 1858, when the British Raj took over from the East India Company.\u003c/li\u003e\r\n\t\u003cli\u003eThe policy stated that if an Indian ruler died without a male heir, his kingdom would automatically become part of the British Empire. The policy\u0026rsquo;s stated reason was that the rulers of these states were not doing enough to protect their people from \u0026ldquo;external aggression and internal rebellion\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe policy was applied in the following cases:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Satara (1848)\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Jaitpur and Sambalpur (1849)\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Baghat (1850)\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Chota Udaipur (1852)\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Jhansi (1853)\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Nagpur (1854)\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Indian government continued to apply elements of the Doctrine of Lapse until 1971, when the 26th amendment to the Indian constitution discontinued recognition of former ruling families.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44334", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGaro\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e* ndia) with List II (Provisions) and select the correct answer using the codes given below the lists: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eList I (Acts of Colonial Government of India)\u003c/p\u003e\r\n\r\n\u003cp\u003eA. Charter Act, 1813\u003c/p\u003e\r\n\r\n\u003cp\u003eB. Regulating Act\u003c/p\u003e\r\n\r\n\u003cp\u003eC. Act of 1858\u003c/p\u003e\r\n\r\n\u003cp\u003eD. Pitt\u0026rsquo;s India Act\u003c/p\u003e\r\n\r\n\u003cp\u003eList II (Provisions)\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Set up a Board of Control in Britain to fully regulate the East India Company\u0026rsquo;s affair in India\u003c/p\u003e\r\n\r\n\u003cp\u003e2 Company\u0026rsquo;s trade monopoly in India was ended\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The power to govern was transferred from East India Company to British Crown\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The Company\u0026rsquo;s Director were asked to present to the British Government all correspondence and documents pertaining to the administration of the company\u003c/p\u003e\r\n\r\n\u003cp\u003eCodes :\u003c/p\u003e\r\n\r\n\u003cp\u003eABCD\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Charter Act of 1813 renewed the charter of the East India Company for another 20 years, but it also ended the Company\u0026rsquo;s trade monopoly in India, except for trade in tea and with China.\u003c/li\u003e\r\n\t\u003cli\u003eThis marked the beginning of free trade policies in British India, allowing other British merchants to participate in Indian commerce.\u003c/li\u003e\r\n\t\u003cli\u003eAdditionally, this Act allowed Christian missionaries to enter India to spread education and religion and provided an annual grant of \u20b91 lakh for promoting education in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Regulating Act of 1773 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was the first attempt by the British Parliament to regulate the affairs of the East India Company in India.\u003c/li\u003e\r\n\t\u003cli\u003eIt was enacted due to widespread corruption and mismanagement by Company officials.\u003c/li\u003e\r\n\t\u003cli\u003eThis Act created the office of the Governor-General of Bengal (Warren Hastings being the first) and a Council of four members to assist him.\u003c/li\u003e\r\n\t\u003cli\u003eIt also established a Supreme Court at Calcutta (1774) to administer justice.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, this Act did not create a Board of Control \u0026mdash; that came later under the Pitt\u0026rsquo;s India Act (1784).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;Act of 1858 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Government of India Act of 1858 was a direct result of the Revolt of 1857, which exposed the Company\u0026rsquo;s administrative failures.\u003c/li\u003e\r\n\t\u003cli\u003eThis Act abolished the East India Company, and all its powers, territories, and revenues were transferred to the British Crown.\u003c/li\u003e\r\n\t\u003cli\u003eIt created the office of the Secretary of State for India, assisted by a 15-member Council of India, based in London.\u003c/li\u003e\r\n\t\u003cli\u003eThe Governor-General of India was henceforth known as the Viceroy, representing the British Crown.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePitts India Act 1784:\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Pitt\u0026rsquo;s India Act of 1784 was passed to address the shortcomings of the Regulating Act.\u003c/li\u003e\r\n\t\u003cli\u003eIt created a dual system of control \u0026mdash; one by the British Government and the other by the East India Company.\u003c/li\u003e\r\n\t\u003cli\u003eUnder this Act, a Board of Control was established in Britain to oversee the Company\u0026rsquo;s political and administrative affairs in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Company\u0026rsquo;s Court of Directors had to submit all correspondence, dispatches, and documents related to Indian administration to the Board of Control for approval.\u003c/li\u003e\r\n\t\u003cli\u003eThis ensured greater Parliamentary supervision over the Company\u0026rsquo;s actions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTherefore, the correct answer is (A) 2 4 3 1.\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44339", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css rsquo;s monopoly on trade with India, except for tea.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Charter Act of 1833 made the company a purely administrative body, ending its commercial activities.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Charter Act of 1833 made the Governor-General of Bengal the Governor-General of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The Charter Act of 1833 introduced a system of open competition for selecting civil servants.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. The Charter Act of 1833 states that Indians should not be prevented from holding any position, office, or employment under the company based on religion, place of birth, or descent.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44340", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSardar Vallabhbhai Patel\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {  exempt from trial by Indian magistrates.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. In cases involving death or transportation, British subjects could only be tried by a high court.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe bill raised a great outcry within the European community. The British, both in India and in Britain, strongly opposed the bill and it was not passed.\u003c/li\u003e\r\n\t\u003cli\u003eA compromise was reached by which a British subject could claim a jury, half of which would be Europeans.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44342", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThat all Indian States should join the Indian Union as a condition to consider any degree of autonomy for India\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n eak-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A): Marathas emerged as the strongest native power in India after the decline of Mughal empire.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R): Marathas were the first to have a clear concept of a united Indian nation.\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2003)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe statement that the Marathas emerged as the strongest native power in India after the decline of the Mughal empire is correct, but the reason is false.\u003c/li\u003e\r\n\t\u003cli\u003eThe Maratha Empire was a major power in India from the late 17th century to the mid 19th century. The Marathas, led by warrior king Shivaji, established a strong foothold in the Western Ghats and gradually expanded their influence.\u003c/li\u003e\r\n\t\u003cli\u003eThe Marathas\u0026rsquo; rise is primarily due to Shivaji and the circumstances that shaped his character and that of his followers.The Marathas\u0026rsquo; rise is a pivotal turning point in Indian history, as their spread of power played a significant role in the decline of the Mughal Empire. The Mughal Empire, under the rule of Emperor Aurangzeb, had reached its zenith by the late 17th century, spanning across a vast territory and wielding immense power.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome reasons for the collapse of the Maratha Empire include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The weakening of central authority\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The waning popularity of Hindus among Muslims\u003c/p\u003e\r\n\r\n\u003cp\u003e3. A series of rebellions by Pindaris and Dates that disrupted trade and the economy\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44352", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} i "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: Some of the main features of the Government of India Act, 1935 were the........ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Abolition of diarchy in the Governors\u0026rsquo; provinces\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Power of the Governors to veto legislative action and to legislate on their own\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Abolition of the principle of communal representation\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Government of India Act, 1935 abolished dyarchy at the provincial level and introduced provincial autonomy.\u003c/li\u003e\r\n\t\u003cli\u003eNow, the provincial governments were given full control over their subjects, with ministers responsible to the provincial legislatures.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, dyarchy was introduced at the Centre (though it was never implemented).\u003c/li\u003e\r\n\t\u003cli\u003eThe Governors under the 1935 Act retained special powers and discretionary authority.\u003c/li\u003e\r\n\t\u003cli\u003eThey could veto bills, reserve them for the consideration of the Governor-General, and even issue ordinances or laws on their own in special circumstances.\u003c/li\u003e\r\n\t\u003cli\u003eThus, while the provinces gained autonomy in theory, the Governor retained overriding powers, ensuring British control.\u0026nbsp;\u003cstrong\u003eHence, statement 2 is true.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe Government of India Act, 1935 did not abolish but extended communal representation even further.\u003c/li\u003e\r\n\t\u003cli\u003eSeparate electorates were provided not just for Muslims but also for Sikhs, Indian Christians, Anglo-Indians, and Europeans.\u003c/li\u003e\r\n\t\u003cli\u003eThis system deepened communal divisions rather than removing them. \u003cstrong\u003eHence, statement 3 is false.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThus, the correct answer is (B) 1 and 2.\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44353", "image_check x-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe first session of the Indian National Congress (INC) was held in Bombay from December 28\u0026ndash;30, 1885. The session was attended by 72 delegates, including socialreformers, journalists, and lawyers. The INC was established at Gokuldas Tejpal Sanskrit College in Bombay, with Womesh Chunder Bonnerjee of Calcutta elected as president.\u003c/li\u003e\r\n\t\u003cli\u003eThe INC\u0026rsquo;s second session was held in Calcutta from December 27\u0026ndash;30, 1886. The third session was held in Madras from December 27\u0026ndash;30, 1887, and the fourth session was held in Allahabad from December 26\u0026ndash;29, 1888.\u003c/li\u003e\r\n\t\u003cli\u003eThe second session of the Indian National Congress was held in 1906 under the leadership of Dadabhai Naoroji. The number of delegates increased to 434. At the end of the session, the Congress decided to establish Provincial Congress Committees across the country.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian National Congress (INC) and the All-India Muslim League (AIML) held their annual sessions in Lucknow in 1916 to form a joint alliance to gain independence from the British. The two parties signed the Lucknow Pact on December 29, 1916, with the INC session on December 26, 28, 29, and 30, 1916, and the AIML session on December 31, 1916.\u003c/li\u003e\r\n\t\u003cli\u003eThe pact is an important event in the nationalistic struggle for freedom. It is considered an example of a consociational practice in Indian politics. The pact states that religious minorities will be represented in provincial legislatures. The Muslim League leaders also agreed to join the Congress movement, demanding Indian autonomy.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic" image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Montagu - Chelmsford Report formed the basic of.............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Indian Councils Act of 1909, also known as the Morley\u0026ndash;Minto Reforms, came much earlier (1909) than the Montagu\u0026ndash;Chelmsford Report (1918).\u003c/li\u003e\r\n\t\u003cli\u003eIt was based on reforms introduced by Lord Morley (Secretary of State for India) and Lord Minto (Viceroy of India).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIts main features included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIncreasing the number of Indian members in the legislative councils.\u003c/li\u003e\r\n\t\u003cli\u003eAllowing indirect elections to legislative councils.\u003c/li\u003e\r\n\t\u003cli\u003eIntroducing the principle of separate electorates for Muslims \u0026mdash; a major step toward communal politics in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act, 1919 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Montagu\u0026ndash;Chelmsford Report (1918) was published jointly by Edwin Montagu, the Secretary of State for India, and Lord Chelmsford, the Viceroy of India.\u003c/li\u003e\r\n\t\u003cli\u003eIt formed the basis of the Government of India Act, 1919, which introduced constitutional reforms in British India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Act is often called the Montagu\u0026ndash;Chelmsford Reforms.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMain features included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIntroduction of Dyarchy in the provinces \u0026mdash; division of subjects into \u0026ldquo;reserved\u0026rdquo; (handled by British officials) and \u0026ldquo;transferred\u0026rdquo; (handled by Indian ministers).\u003c/li\u003e\r\n\t\u003cli\u003eExpansion of legislative councils and greater Indian participation in government.\u003c/li\u003e\r\n\t\u003cli\u003eEstablishment of bicameral legislature at the Centre \u0026mdash; the Central Legislative Assembly and the Council of States.\u003c/li\u003e\r\n\t\u003cli\u003eIncrease in the franchise (voting rights) on a limited basis.\u003c/li\u003e\r\n\t\u003cli\u003eCreation of a Public Service Commission.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, the Government of India Act, 1919 was directly based on the Montagu\u0026ndash;Chelmsford Report.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act, 1935 :\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was not based on the Montagu\u0026ndash;Chelmsford Report, but rather on the recommendations of the Simon Commission (1927) and the Round Table Conferences (1930\u0026ndash;32).\u003c/li\u003e\r\n\t\u003cli\u003eIt was a far more comprehensive and detailed constitution, introducing:\u003c/li\u003e\r\n\t\u003cli\u003eProvincial autonomy (abolishing dyarchy in provinces).\u003c/li\u003e\r\n\t\u003cli\u003eProposal for an All-India Federation (though never implemented).\u003c/li\u003e\r\n\t\u003cli\u003eEstablishment of the Federal Court (1937).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian Independence Act, 1947 :\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was based on the Mountbatten Plan, not the Montagu\u0026ndash;Chelmsford Report.\u003c/li\u003e\r\n\t\u003cli\u003eIt was passed by the British Parliament to grant independence to India and create two dominions \u0026mdash; India and Pakistan.\u003c/li\u003e\r\n\t\u003cli\u003eIt marked the end of British rule in India, transferring sovereignty to the new governments.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTherefore the correct answer is B.\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44356", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "n . Tipu Sultan was killed in the Third Anglo- Mysore War.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Mir Jafar entered in a conspiracy with the English for the defeat of Nawab Siraj ud daulah in the Battle of Plassey.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn the Third Battle of Panipat in 1761, Ahmad Shah Abdali defeated the Marathas, not Ibrahim Lodi. The battle was fought on January 14, 1761, and resulted in heavy casualties on both sides. It was the worst defeat in the Marathas\u0026rsquo; history and ended their attempt to succeed the Mughals as rulers of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe first Battle of Panipat was fought in 1526, when Babur defeated Ibrahim Lodi. The second Battle of Panipat was fought in 1556, when Akbar defeated Hemu.\u003c/li\u003e\r\n\t\u003cli\u003ePanipat was chosen as the site for the battles because it was located at the confluence of several important kingdoms, including Delhi, Agra, and Jaipur.\u003c/li\u003e\r\n\t\u003cli\u003eTipu Sultan was killed in 1799 while defending his stronghold of Seringapatam during the Fourth Anglo-Mysore War. The Fourth Anglo-Mysore War was fought between 1798 and 1799 between the East India Company and Hyderabad Deccan against the Kingdom of Mysore.\u003c/li\u003e\r\n\t\u003cli\u003eThe East India Company fought a series of battles between 1767 and 1799 called the Anglo-Mysore Wars. The Third Anglo Mysore War took place in the late 18th century.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome causes of the war include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Treaty of Seringapatam failed to bring peace between Tipu and the English.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Tipu refused to accept the Subsidiary Alliance of Lord Wellesley.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Tipu aligned with the French, which the British saw as a threat.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe victors of the Fourth Anglo-Mysore War forced Tipu\u0026rsquo;s family into exile and restored control of Mysore to the Wadiyars.\u003c/li\u003e\r\n\t\u003cli\u003eMir Jafar conspired with the English to overthrow Nawab Siraj-ud-Daulah in the Battle of Plassey.\u003c/li\u003e\r\n\t\u003cli\u003eThe Battle of Plassey was a decisive victory for the British East India Company in 1757. The victory was made possible by the defection of Mir Jafar, Nawab Siraj-ud Daulah\u0026rsquo;s commander in chief.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44364", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndian Freedom Party\u0026nbsp;\u003c/p\u003e" : break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Warren Hastings was the first Governor General who established a regular police force in India on the British pattern\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A Supreme Court was established at Calcutta by the Regulating Act, 1773.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Indian Penal Code came into effect in the year 1860.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe statement \u0026ldquo;Warren Hastings was the first Governor General who established a regular police force in India on the British pattern\u0026rdquo; is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eLord Cornwallis established a regular police force in India in 1786, introducing the Cornwallis Code in 1793. Cornwallis\u0026rsquo;s police force was considered a popular aspect of British authority. In his system, each district was divided into \u0026ldquo;thanas\u0026rdquo;, each led by a \u0026ldquo;daroga\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eIn contrast, Warren Hastings, an English statesman, was the first Governor-General of India from 1772 to 1785. He did, however, reorganize the existing policing system and appoint a superintendent of police for each district in 1774. In 1775, he established faujdar thanas in major towns and supported them with smaller police stations.\u003c/li\u003e\r\n\t\u003cli\u003eThe Supreme Court of Judicature at Fort William in Calcutta was established in 1774 by the Regulating Act of 1773. The court replaced the Mayor\u0026rsquo;s Court of Calcutta and was British India\u0026rsquo;s highest court from 1774 until 1862.\u003c/li\u003e\r\n\t\u003cli\u003eThe court had one Chief Justice and three other regular judges or Puisne Judges. Sir Elijah Impey was the first Chief Justice of this Supreme Court.\u003c/li\u003e\r\n\t\u003cli\u003eThe judges had to be Barrister-at-Law of England or Ireland of not less than five years\u0026rsquo; standing. The court had civil and criminal jurisdiction over the British subjects and not Indian natives.\u003c/li\u003e\r\n\t\u003cli\u003eThe Regulating Act of 1773 was passed to reduce the power of the Supreme Court and enhance the power of the Governor General and his council members.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian Penal Code (IPC) was enacted in 1860 and came into effect on January 1, 1862. The IPC is the main criminal code of India and is the longest surviving code in the common law world.\u003c/li\u003e\r\n\t\u003cli\u003eThe IPC was drafted by Lord Macaulay and based on the draft prepared by the first law commission of India. However, Lord Macaulay died near the end of 1859 and did not live to see the code come into force.\u003c/li\u003e\r\n\t\u003cli\u003eThe IPC provides the most severe punishment of the death sentence or life imprisonment and fine in case of offense against the state. This chapter includes offenses like waging war, collecting arms to wage war, sedition, etc..\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44366", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The provincial autonomy\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The establishment of Federal Court\u003c/p\u003e\r\n\r\n\u003cp\u003e3. All India Federation at the centre\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act of 1935 provided for the following:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. All India Federation :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe act established an All-India Federation made up of provinces and princely states. The federation would be based on a union of princely states. However, the act\u0026rsquo;s provision for the federation never came into effect because the princely states did not join.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Federal Court L: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;The act established a Federal Court in 1937. The court has three types of jurisdictions:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003ei) original\u003c/p\u003e\r\n\r\n\u003cp\u003eii) appellate\u0026nbsp;and\u003c/p\u003e\r\n\r\n\u003cp\u003eiii) advisory\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;It also has exclusive original jurisdic tion in any dispute between the Feder ation and its units.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Division of powers : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act divides powers between the center and units into three lists:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003ei) federal\u003c/p\u003e\r\n\r\n\u003cp\u003eii) provincial, and\u003c/p\u003e\r\n\r\n\u003cp\u003eiii) concurrent.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Public Service Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act provides for the establishment of a\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003ei) Federal Public Service Commission\u003c/p\u003e\r\n\r\n\u003cp\u003eii) Provincial Public Service Commission, and\u003c/p\u003e\r\n\r\n\u003cp\u003eiii) Joint Public Service Commission for two or more provinces.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOther features of the act include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eThe act reserves the right to amend for the British Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThe act provides the British Government with legal tools to reclaim total control at any time.\u003c/li\u003e\r\n\u003c/ol\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44367", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overf
