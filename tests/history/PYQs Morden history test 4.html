om 1503, much earlier than when the Dutch took over in 1663.\u003c/li\u003e\r\n\t\u003cli\u003eKochi did become part of the British colony. The British took control of Kochi from the Dutch in 1814 under the Anglo Dutch Treaty and it remained so until Indian independence in 1947.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44368", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBattle of Wandiwash - Battle of Buxar - Battle of Ambur - Battle of Plassey.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBattle of Ambur - Battle of Plassey - Battle of Wandiwash - Battle of Buxar.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBattle of Wandiwash - Battle of Plassey - Battle of Ambur - Battle of Buxar.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBattle of Ambur - Battle of Buxar - Battle of Wandiwash - Battle of Plassey.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following is the correct chronological order of the battle fought in India in the 18th Century?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Ambur :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a major battle fought on August 3, 1749, between the English and the French. The battle was the first major battle of the Second Carnatic War, which lasted from 1749 to 1754. The war was fought between the English and the French, who were old rivals in Europe. The main cause of the war was political unrest in Hyderabad and Carnatic.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle was initiated by Muzaffar Jung and supported by Joseph Fran\u0026ccedil;ois Dupleix. The battle was led by Chanda Sahib, who sought to overthrow Anwaruddin Muhammed Khan, the Nawab of the Carnatic. Anwaruddin Khan died in the battle.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle demonstrated the superiority of European arms and methods of warfare. The Second Carnatic War was won by the English army under Robert Clive\u0026rsquo;s command. Mohammed Ali, the English nominee, was appointed the Nawab of Carnatic at the end of the war.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Plassey :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was fought on June 23, 1757, in north eastern India. The British East India Company, led by Robert Clive, fought against the forces of Siraj-ud-Daulah, the last Nawab of Bengal, and his French allies. The battle took place on the banks of the Bhagirathi-Hooghly River, near the small village of Plassey.\u003c/li\u003e\r\n\t\u003cli\u003eThe Battle of Plassey is part of the Third Carnatic War and the Seven Years\u0026rsquo; War (1756-63). It is considered a major turning point in modern Indian history.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe battle\u0026rsquo;s results include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The British gaining political power in Northern India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The end of the French forces\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Mir Jafar being crowned as the Nawab of Bengal\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The East India Company\u0026rsquo;s acquisition of Bengal\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Wandiwash :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a decisive battle in the Third Carnatic War, fought between the British and French colonial empires from 1757\u0026ndash;1763. The battle took place on January 22, 1760, in Puducherry, also known as Pondicherry. The British, led by Sir Eyre Coote, defeated the French forces under Thomas-Arthur, Comte de Lally.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle was a turning point in Indian history, establishing British supremacy in India and helping to vanquish the nativepowers. The French lost their political influence in India forever, and the English became the supreme European power in the Indian subcontinent.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Buxar :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a conflict between the British East India Company and the joint forces of the Nawab of Oudh, the Nawab of Bengal, and the Mughal Emperor. The battle took place between October 22\u0026ndash;23, 1764. The British East India Company was led by Hector Munro.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle was a result of the Nawab of Bengal\u0026rsquo;s misuse of trade privileges and the East India Company\u0026rsquo;s colonialist ambitions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe battle resulted in the following:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Mir Qasim, Shuja-Ud-Daula, and Shah Alam-II lost the battle\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Major Hector Munro won a decisive battle\u003c/p\u003e\r\n\r\n\u003cp\u003e3. English became a great power in northern India\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe battle was a turning point in Indian history, as it marked the beginning of British rule in India. The Mughals were decisively defeated, and their power began to decline rapidly.\u003c/li\u003e\r\n\t\u003cli\u003eThe alliance\u0026rsquo;s forces were forced to sign the Treaty of Allahabad in 1765 which granted the East India Company the right to collect taxes in Bengal Bahar.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44369", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eJhansi\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle yle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements:\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Lord Mountbatten was the Viceroy when Shimla Conference took place\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Indian Navy Revolt, 1946 took place when the Indian sailors in the Royal Indian Navy at Bombay and Karachi rose against the Government\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eLord Mountbatten was not the Viceroy of India when the Shimla Conference took place in June 1945.\u003c/li\u003e\r\n\t\u003cli\u003eLord Wavell was the Viceroy of India from 1944\u0026ndash;1947.\u003c/li\u003e\r\n\t\u003cli\u003eLord Mountbatten became the Viceroy of India in March 1947 and served until August 15, 1947.\u003c/li\u003e\r\n\t\u003cli\u003eThe Shimla Conference was a meeting between Lord Wavell and major political leaders of British India. The conference took place on June 25, 1945, and was held to discuss the Wavell Plan. The Wavell Plan was an attempt to resolve the political impasse in India and pave the way for self government.\u003c/li\u003e\r\n\t\u003cli\u003eThe plan proposed that if Indian political parties helped the British in World War II, the British would introduce constitutional reforms. However, the plan failed due to irreconcilable differences between the Indian National Congress and the Muslim League.\u003c/li\u003e\r\n\t\u003cli\u003eThe Royal Indian Navy (RIN) Mutiny, also known as the Indian Naval Mutiny, began on February 18, 1946. The revolt began as a strike by ratings of the RIN in protest of general conditions, including food and working conditions. The revolt also included demands for independence from British rule, and support from Hindus, Muslims, and Parsis.\u003c/li\u003e\r\n\t\u003cli\u003eThe revolt involved over 20,000 sailors, soldiers, police officers, and civilians, and spread to 78 ships and 21 naval establishments. On February 19, 1946, a Naval Central Strike committee was elected, and the mass strike continued until February 23, 1946. Security forces shot and killed around 400 people during the revolt.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": " e of satyagraha and civil disobedience. In 1918, the Champaran Agrarian Bill became the Champaran Agrarian Act.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMany leaders were associated with the Champaran, Satyagraha, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Mahatma Gandhi\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Rajendra Prasad\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Brajkishore Prasad\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Anugrah Narayan Sinha\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Ramnavmi Prasad\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Mazhar-ul-Haq\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Narahari Parekh\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Shambhusharan Varma\u003c/p\u003e\r\n\r\n\u003cp\u003e9. J. B. Kripalani\u003c/p\u003e\r\n\r\n\u003cp\u003e10. Babu Gaya Prasad Singh\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe strike was a dispute between mill owners and employees over the end of a plague bonus. The bonus was given to workers from August 1917 to January 1918 to prevent them from fleeing during a plague outbreak. Some bonuses were as high as 80% of the worker\u0026#39;s wage.\u003c/li\u003e\r\n\t\u003cli\u003eGandhi used a hunger strike for the first time during the strike.\u003c/li\u003e\r\n\t\u003cli\u003eMahatma Gandhi was the spiritual leader of the Kheda Satyagraha, which was launched in March 1919.\u003c/li\u003e\r\n\t\u003cli\u003eHe was assisted by Sardar Vallabhbhai Patel and other local lawyers and advocates, including:\u003c/li\u003e\r\n\t\u003cli\u003eIndulal Yagnik, Mahadev Desai, Narhari Parikh, Mohanlal Shankarlal Banker, Pandya, Ravi Shankar Vyas.\u003c/li\u003e\r\n\t\u003cli\u003eSardar Vallabhbhai Patel, a local resident and lawyer, played a key role in organizing the peasants and spreading the message across villages.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kheda peasant struggle is also known as the no-tax peasant struggle. The main demand of the Kheda peasants relaxation in paying the revenue. The British government was eventually forced to offer concessions and provide relief to the farmers of Kheda.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44372", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBihar\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMadhya Pradesh\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !  "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: On the eve of the launch of Quit India Movement, Mahatma Gandhi............ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. asked the Government servants to resign.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. asked the soldiers to leave their posts.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. asked the Princes of the Princely States to accept the sovereignty of their own people.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMahatma Gandhi asked the Princes of the Princely States to accept the sovereignty of their own people on the eve of the launch of the Quit India Movement.\u003c/li\u003e\r\n\t\u003cli\u003eThe Quit India Movement was launched on August 8, 1942, by Mahatma Gandhi at the Bombay session of the All India Congress Committee. The movement demanded an end to British rule in India.\u003c/li\u003e\r\n\t\u003cli\u003eIn his \u0026ldquo;Quit India\u0026rdquo; speech, Gandhi said, \u0026ldquo;We cannot evoke the true spirit of sacrifice and velour, so long as we are not free\u0026rdquo;. He also said, \u0026ldquo;I know the British Government will not be able to withhold freedom from us, when we have made enough self-sacrifice\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement was organized in several princely states, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMysore, Hyderabad, Baroda, Kathiawad States, Deccan States, Jamnagar, Indore, Nawanagar.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome of Gandhi\u0026rsquo;s instructions for the movement included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Government servants: Declare allegiance to Congress, but don\u0026rsquo;t resign\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Soldiers: Don\u0026rsquo;t leave the army, but don\u0026rsquo;t time compatriots\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Students: Confident students can leave studies\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Peasants: Pay rent to anti-government Zamindars, but don\u0026rsquo;t pay rent to pro government Zamindars\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Princes: Support the people and accept their sovereignty\u003c/p\u003e\r\n\r\n\u003cp\u003e6. People of the princely states: Support the ruler only if he is anti-government, and declare themselves part of the Indian nation\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement had three phases:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. First phase: \u003c/strong\u003ePeaceful protests and nonviolent resistance, which were quickly suppressed by the British\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Second phase: \u003c/strong\u003eFocus shifted to the countryside, which saw a major peasant rebellion\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Third phase: \u003c/strong\u003eUrban revolt, marked by strikes, boycotts, and picketing\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe movement also included boycotting the British government and rejecting transactions involving the government. The British arrested tens of thousands of leaders, keeping them imprisoned until 1945.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44381", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\" 003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Ishwar Chandra Vidyasagar founded the Bethune\u0026nbsp;School at Calcutta with the main aim of encouraging education for women\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Bankim Chandra Chattopadhyay was the first graduate of the Calcutta University.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Keshav Chandra Sen\u0026rsquo;s campaign against Sati led to the enactment of a law to ban Sati by the then Governor General\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIshwar Chandra Vidyasagar was a secretary of the Bethune School in Calcutta, which was established in 1849.The school\u0026rsquo;s main goal was to encourage women\u0026rsquo;s education.\u003c/li\u003e\r\n\t\u003cli\u003eVidyasagar was a pioneer of higher education for women in India. He believed that education was the only way to improve women\u0026rsquo;s lives and eradicate social evils. He also advocated for widow remarriage and girls\u0026rsquo; education, which led to the Hindu Widow Remarriage Act of 1856.\u003c/li\u003e\r\n\t\u003cli\u003eVidyasagar also wrote several books, including Borno Porichoy, Upakramonika,and Byakaran Koumudi. Borno Porichoy, which translates to \u0026ldquo;introduction to the letter\u0026rdquo;, is still used as a textbook for learning the Bengali alphabet.\u003c/li\u003e\r\n\t\u003cli\u003eBankim Chandra Chattopadhyay was one of the first two people to graduate from the University of Calcutta. He was born on June 27, 1838, and was educated at Hooghly Mohsin College and Presidency College, Calcutta.\u003c/li\u003e\r\n\t\u003cli\u003eChattopadhyay was a writer, poet, novelist, and journalist in the Bengali language. He was a deputy magistrate in the Indian civil service from 1858 until his retirement in 1891. He also obtained a law degree in 1869.\u003c/li\u003e\r\n\t\u003cli\u003eChattopadhyay is known for writing India\u0026rsquo;s national anthem, \u0026ldquo;Vande Mataram\u0026rdquo;, which inspired revolutionaries during the Indian independence movement. He believed that India could only rise with the help of nationalism, and that English education alone could not revive Hindu society.\u003c/li\u003e\r\n\t\u003cli\u003eOn December 4, 1829, Lord William Bentinck, the first Governor-General of British-ruled India, passed the Bengal Sati Regulation (Regulation XVII). The law made Sati illegal and punishable by law.\u003c/li\u003e\r\n\t\u003cli\u003eBentinck served as Governor-General from 1828\u0026ndash;1835. Bentinck also helped Raja Rammohan Roy suppress other social evils, such as child marriage, polygamy, and female infanticide.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44382", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {m )\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. In the First Round Table Conference Dr. Ambedkar demanded electorates for the depressed classes.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. In the Poona Pact, special provisions for representation of the depressed people in the local bodies and civil services were made.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Indian National Congress did not take part in the Third Round Table Conference\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDr. B. R. Ambedkar demanded a separate electorate for the Untouchables at the First Round Table Conference. The conference took place in London from November 12, 1930 to January 19, 1931.\u003c/li\u003e\r\n\t\u003cli\u003eThe Poona Pact allocated 148 seats for the depressed classes in legislative assemblies, instead of the original 80. Ambedkar agreed to sign the pact, despite being in favor of communal awards.\u003c/li\u003e\r\n\t\u003cli\u003eThe Poona Pact was negotiated by B.R. Ambedkar and Mahatma Gandhi on behalf of depressed classes and upper-caste Hindu leaders. The pact was signed in the Yerwada Central Jail, Poona on September 24, 1932, as a protest against a decision made by the British Government.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian National Congress (INC) did not participate in the Third Round Table Conference because many INC leaders were imprisoned for their involvement in the civil disobedience movement. The INC\u0026rsquo;s leader, Mahatma Gandhi, was also a member of the Congress.\u003c/li\u003e\r\n\t\u003cli\u003eThe Third Round Table Conference was held from November 17 to December 24, 1932. The conference was an attempt to resolve problems between Indian leaders and the British government, but disagreements between the two parties prevented the conferences from resolving the problems.\u003c/li\u003e\r\n\t\u003cli\u003eThe Round Table Conferences were meetings between the British government and Indian representatives to ensure peace in British-occupied India. The conferences were held between 1930 and 1932.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44383", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLord Dufferin\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overfl  are at the core of the Fabian Society. They wrote studies on industrial Britain and alternative co operative economics.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Graham Wallas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eWallas is an early Fabian theorist and member of the Fabian Society.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Annie Besant :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBesant is an early member of the Fabian Society.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Edward Pease :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePease is an early member of the Fabian Society. Fabianism is a socialist organization that advocates for a gradual transition to a socialist society.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFabianism advocates for:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A more equitable distribution of wealth\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Social justice\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Universal access to education\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Elimination of poverty and inequality\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Defense of democratic values 6. Empowerment of citizens\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44385", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: newed the company\u0026rsquo;s charter, but unlike previous charters, it did not specify a time period.\u003c/li\u003e\r\n\t\u003cli\u003eBritish Parliament passed the Government of India Act of 1858 to abolish the East India Company and take over the responsibility of ruling India.\u003c/li\u003e\r\n\t\u003cli\u003eThe act was passed on August 2, 1858.The act transferred the East India Company\u0026rsquo;s government and territories to the British Crown. It also made Queen Victoria the administrative head of the colony of India and replaced the East India Company\u0026rsquo;s Court of Directors with a Secretary of State.\u003c/li\u003e\r\n\t\u003cli\u003eThe East India Company was a joint-stock company founded in 1600 to trade in the Indian Ocean region. In 1833, the company lost its special trading privileges and the right to trade.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44388", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u on_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements about Madam Bhikaji Cama.............\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;2006)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Madam Cama unfurled the National Flag at the international Socialist Conference in Paris in the year 1907.\u003c/p\u003e\r\n\r\n\u003cp\u003e2 . Madam Cama served as private secretary to Dadabhai Naoroji 3. Madam Cama was born to Parsi parents.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMadam Bhikaji Cama unfurled the first version of the Indian national flag at the International Socialist Congress in Stuttgart, Germany on August 22, 1907.\u003c/li\u003e\r\n\t\u003cli\u003eThe flag was a tricolour of green, saffron, and red stripes.\u003c/li\u003e\r\n\t\u003cli\u003eMadam Bhikaji Cama (1861-1936) served as the private secretary to Dadabhai Naoroji, a prominent leader of the Indian National Congress. Naoroji was the first Asian to be elected to the British House of Commons.\u003c/li\u003e\r\n\t\u003cli\u003eCama also supported the founding of Varma\u0026rsquo;s Indian Home Rule Society in 1905. She is also known for unfurling the first version of the Indian national flag at the International Socialist Conference inStuttgart, Germany in 1907. She is known as the \u0026ldquo;Mother of the Indian Revolution\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eCama also started the Paris edition of Bande Mataram to spread information about the freedom movement and gain support. The newspaper\u0026rsquo;s purpose was to oppose British rule in India. Cama is known as the \u0026ldquo;Mother of the Indian Revolution\u0026rdquo;. She is believed to have designed the flag jointly with someone. During the flag-raising ceremony, she appealed for equality and autonomy from the British, who had taken over the Indian subcontinent. She also described the devastating effects of a famine that had struck the Indian subcontinent.\u003c/li\u003e\r\n\t\u003cli\u003eMadam Cama (1861-1936) was born to Parsi parents. Her parents were Sorabji Framji Patel and Jaijibai Sorabji Patel. Sorabji was a merchant and a lawyer who was a well-known member of the Parsi community.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "419", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44389", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": " const QUIZ_TITLE = "Modern History PYQ Test 4";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}
