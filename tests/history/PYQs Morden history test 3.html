p:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e\u0026nbsp;4. V. D. Savarkar \u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eCodes:\u003c/p\u003e\r\n\r\n\u003cp\u003eABCD\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAbhinav Bharat Mandir (Young India Society) was a secret society founded in 1904 by Vinayak Damodar Savarkar and his brother Ganesh Damodar Savarkar. The society was established during the Indian War of Independence.\u003c/li\u003e\r\n\t\u003cli\u003eThe Anushilan Samiti was\u0026nbsp;a prominent organization during India\u0026rsquo;s freedom struggle.\u0026nbsp;It was founded in 1902 and lasted until 1930.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe Samiti was a collaboration of local youth groups and gyms, and its focus was on physical education and moral development.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe Samiti was led by nationalists Aurobindo Ghosh and his brother Barindra Ghosh.\u0026nbsp;The group advocated for revolutionary violence to overthrow the British Empire in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Samiti was influenced by Bankim Chandra Chatterjee\u0026rsquo;s Anandmath and philosophies like Italian Nationalism and the Pan-Asianism of Kakuzo Okakura.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003cstrong\u003eThe Samiti had two branches:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Jugantar Group in Kolkata and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Dhaka Anushilan Samiti in Dhaka.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eOther leaders of the Samiti included:\u003c/strong\u003e Deshabandhu Chittaranjan Das, Surendranath Tagore, Jatindranath Banerjee, Bagha Jatin, Hedgewar.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eIn 1908, the Samiti sent young recruits Khudiram Bose and Prafulla Chaki on a mission to assassinate chief presidency magistrate D. H. Kingsford.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThey bombed a carriage they mistook for Kingsford\u0026rsquo;s, killing two Englishwomen.\u0026nbsp;Bose was arrested while attempting to flee and Chaki committed suicide.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe Ghadar Party was founded on July 15, 1913, in the United States by Lala Har Dayal, Sant Baba Wasakha Singh Dadehar, Baba Jawala Singh, Santokh Singh, and Sohan Singh Bhakna. The party was originally called the Pacific Coast Hindustan Association.\u003c/li\u003e\r\n\t\u003cli\u003eThe Ghadar Party was based in San Francisco, with branches along the US Coast and in the far East. The Ghadar freedom movement began in 1914, after the party\u0026rsquo;s formation. The party\u0026rsquo;s ideology was Indian independence and Indian nationalism.\u003c/li\u003e\r\n\t\u003cli\u003eThe Swaraj Party was founded on January 1, 1923 by Indian politicians Chittaranjan Das, Motilal Nehru, and other members of the Indian National Congress. The party was established to fight British colonialism and to demonstrate that the councils were not democratic.\u003c/li\u003e\r\n\t\u003cli\u003eThe Swaraj Party was opposed by Gandhi\u0026rsquo;s supporters, who became known as the No Changers. Gandhi relaxed the rules on spinning and named some Swarajists to important positions in the Congress Party.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44246", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 3 1 2\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\ ign=\"left\" style=\"margin-left:11px; text-align:left; text-indent:-8.5pt\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e4. First session of National Conference at Calcutta\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eCodes :\u003c/p\u003e\r\n\r\n\u003cp\u003eA B C D\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe first session of the Indian National Conference was held in Calcutta from December 28\u0026ndash;30, 1883. The conference was attended by more than 100 delegates from different parts of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe second National Conference was held in Calcutta in 1885, and coincided with the first meeting of the National Congress in Bombay.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1896, Rahimtulla M. Sayani presided over the 12th Annual Session of the Congress in Calcutta. During this session, \u0026ldquo;Vande Mataram\u0026rdquo; was first sung.\u003c/li\u003e\r\n\t\u003cli\u003eThe All-India Muslim League (AIML) was founded in 1906 at Dhaka, which is now part of Bangladesh. The league was formed by a group of Muslim landlords and nawabs. The name was proposed by Nawab Khwaja Sir Salimullah Bahadur and seconded by Hakim Ajmal Khan.\u003c/li\u003e\r\n\t\u003cli\u003eThe AIML was established when some well-known Muslim politicians met the Viceroy of British India, Lord Minto, with the goal of securing Muslim interests on the Indian subcontinent. The league wasinitially encouraged by the British and was generally favorable to their rule. However, in 1913, the organization adopted self government for India as its goal.\u003c/li\u003e\r\n\t\u003cli\u003eThe first session of the party was held in Karachi in 1907. The constitution of the Muslim League was framed in 1907, in Dacca.\u003c/li\u003e\r\n\t\u003cli\u003eAfter the independence of India and Pakistan, the Muslim League was split. The major part went to Pakistan and continued politics as the Muslim League there. The Muslim League remained as a minor party in India, especially in Kerala.\u003c/li\u003e\r\n\t\u003cli\u003eThe All India States People\u0026rsquo;s Conference (AISPC) was formed in 1927. The first session of the organization was held in Bombay on December 17, 1927. The conference was a coalition of political movements in the princely states of the British Raj. These movements were also known as Praja Mandals or Lok Parishads.\u003c/li\u003e\r\n\t\u003cli\u003eThe conference was initiated by Balwant Rai Mehta, Manmaya Lal Kotari, and G.R. Abhyankar in Kathiawar. The first session was attended by about 700 political workers.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1928, the AISPC helped the Congress party draft the Nehru Report, which was an early version of the Constitution of India. Jawaharlal Nehru became the President of the organization in 1939 and remained so until 1946.\u003c/li\u003e\r\n\t\u003cli\u003eThe Communal Award was announced by British Prime Minister Ramsay MacDonald on August 16, 1932. It was also known as the MacDonald Award.\u003c/li\u003e\r\n\t\u003cli\u003eThe award provided separate electorates for minorities, including Muslims, Sikhs, Indian Christians, Anglo-Indians, women, and the \u0026ldquo;depressed classes\u0026rdquo;. It also ensured the retention of separate electorates for Muslims, Sikhs, and Europeans.\u003c/li\u003e\r\n\t\u003cli\u003eThe award was based on the recommendations of the Indian Franchise Committee and Ambedkar\u0026rsquo;s efforts. It was announced after the Round Table Conference (1930\u0026ndash;32). The award was later incorporated into the act of 1935.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44247", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 1 3 2\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% rite A Nation in Making.\u003c/li\u003e\r\n\t\u003cli\u003eHind Swaraj or Indian Home Rule was written by Mohandas K. Gandhi in 1909. The book is considered one of the most famous works written during India\u0026rsquo;s freedom struggle\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;In the book, Gandhi expresses his views on Swaraj, modern civilization, and mechanization. He also declares that the British rule in India only survived because of the cooperation of Indians. According to The Hindu, Hind Swaraj is Gandhi\u0026rsquo;s primary work of philosophy.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian Struggle is a two-part book written by Indian nationalist leader Netaji Subhash Chandra Bose. The book covers the history of the Indian independence movement from 1920\u0026ndash;1942.Bose was a youth educator, journalist, and commandant of the Bengal Congress volunteers. In 1921, he was imprisoned for his activities. In 1924, he became the chief executive officer of the Calcutta Municipal Corporation.\u003c/li\u003e\r\n\t\u003cli\u003eBose was exiled in Europe after being arrested and detained by the colonial government. He was suspected of being involved in acts of violence and being associated with the Bengal Volunteers, a revolutionary group.\u003c/li\u003e\r\n\t\u003cli\u003eLala Lajpat Rai\u0026rsquo;s 1965 book Autobiographical Writings was written shortly before his death. It was edited by Vijaya Chandra Joshi and published by University Publishers.\u003c/li\u003e\r\n\t\u003cli\u003eLajpat Rai was a prominent leader in India\u0026rsquo;s struggle for freedom. He was born in Dhudike, Punjab, India in 1865.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHis other writings include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Story of My Deportation (1908)\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Arya Samaj (1915)\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The United States of America: A Hindu\u0026rsquo;s Impression (1916)\u003c/p\u003e flow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Anarchical and Revolutionary Crime Act (1919) was popularly known as the............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Anarchical and Revolutionary Crimes Act of 1919 is famously known as the Rowlatt Act, named after Justice Sidney Rowlatt, who headed the committee that recommended it. The Act allowed the British government in India to imprison anyone suspected of revolutionary activities without trial for up to two years.\u003c/li\u003e\r\n\t\u003cli\u003eThis law was seen as highly repressive and unjust, as it extended the wartime emergency powers even after World War I ended. Mahatma Gandhi strongly opposed it and launched the Rowlatt Satyagraha in 1919, marking one of the first mass protests under his leadership. The public outrage over this Act led to widespread demonstrations, culminating in the Jallianwala Bagh massacre (April 13, 1919).\u003c/li\u003e\r\n\t\u003cli\u003eThus, the Anarchical and Revolutionary Crimes Act (1919) and the Rowlatt Act are one and the same.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePitt\u0026rsquo;s India Act (1784) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePassed during the British Parliament in 1784, it established dual control over British India \u0026mdash; one by the British Government and the other by the East India Company.\u003c/li\u003e\r\n\t\u003cli\u003eIt created the Board of Control to regulate the affairs of the Company and laid the foundation for centralised British administration in India.\u003c/li\u003e\r\n\t\u003cli\u003eThis Act has no connection with revolutionary crimes or the 1919 period.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIndian Arms Act (1878) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIntroduced by Lord Lytton, this Act prohibited Indians from possessing arms without a license, while Europeans were exempted.\u003c/li\u003e\r\n\t\u003cli\u003eIt was considered discriminatory and added to Indian resentment during the colonial period.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, this Act was passed in 1878, not 1919, and was about weapons, not revolutionary activities.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIlbert Bill (1883):\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIntroduced by Lord Ripon, it sought to allow Indian judges to try European British subjects in criminal cases.\u003c/li\u003e\r\n\t\u003cli\u003eThis bill faced huge opposition from British residents in India, leading to a major racial controversy.\u003c/li\u003e\r\n\t\u003cli\u003eIt was a judicial reform, not related to revolutionary or criminal suppression laws.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "4", "co -word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSurya Sen, also known as Surya Kumar Sen, led the 1930 Chittagong armoury raid. The Chittagong armoury raid was an attempt by armed Indian independence fighters to raid the police and auxiliary forces armoury in the Chittagong district on April 18, 1930. The British called the raid the Chittagong Uprising.\u003c/li\u003e\r\n\t\u003cli\u003eSen recruited revolutionaries like Anant Singh, Ganesh Ghosh, and Kalpana Dutta to plan the raid. On April 18, 1930, a group of 63 young people, mostly teenagers, led by Sen raided the armoury and liberated it from British control. They unfurled the Indian flag and banished British rule for a few days.\u003c/li\u003e\r\n\t\u003cli\u003eOn April 22, 1930, thousands of British army personnel caught up with the revolutionaries on Jalalabad hill and engaged in a brutal standoff. The standoff resulted in the death of 12 revolutionaries and 80 British Army personnel.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRam Prasad Bismil :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was the mastermind behind the Kakori Conspiracy, a historic event in the Indian independence movement. On August 9, 1925, members of the Hindustan Republican Association (HRA) robbed a train at Kakori station near Lucknow, Uttar Pradesh.\u003c/li\u003e\r\n\t\u003cli\u003eThe robbery was planned by Bismil and Ashfaqullah Khan, and executed by Bismil, Khan, Chandrashekhar Azad, Rajendra Shachindra Bakshi, Keshab Chakravarty, Murari Lal Khanna (Gupta), Banwari Lal, Mukundi Lal Gupta, and Lahiri, Manmathnath Gupta.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kakori Conspiracy resulted in three (later four) men being sentenced to death, and one being given life imprisonment. Most of the remaining defendants were given prison sentences of up to 14 years, although two were acquitted, and two more were pardoned.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJatindra Nath Das :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is also known as Jatin Das, was a revolutionary freedom fighter who was arrested in 1929 in connection with the Lahore Conspiracy Case. The case accused Das and others of attempting to murder the person responsible for the death of freedom fighter Lala Lajpat Rai.\u003c/li\u003e\r\n\t\u003cli\u003eDas was arrested on June 14, 1929 and died in prison after a 63-day hunger strike. During his time in prison, he demanded humane treatment of political prisoners and improved conditions. He also went on a hunger strike to demand equal treatment of Indian and European prisoners.\u003c/li\u003e\r\n\t\u003cli\u003eDas was born on October 27, 1904 in Calcutta and joined the revolutionary organization Anushilan Samiti. He also participated in the Non-Cooperation Movement led by Mahatma Gandhi in 1921.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Ghadar Party :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was founded on July 15, 1913, in the United States by Lala Har Dayal, Sant Baba Wasakha Singh Dadehar, Baba Jawala Singh, Santokh Singh, and Sohan Singh Bhakna. The party was originally called the Pacific Coast Hindustan Association.\u003c/li\u003e\r\n\t\u003cli\u003eThe Ghadar Party was based in San Francisco, with branches along the US Coast and in the far East. The Ghadar freedom movement began in 1914, after the party\u0026#39;s formation. The party\u0026#39;s ideology was Indian independence and Indian nationalism.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44264", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 3 1 5\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 3 2 1\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003 adding:.60px 7px 0cm 5px; height:22px; border-top:none; border-right:1px solid #181717; border-left:1px solid #181717\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #181717; width:79px; padding:.60px 7px 0cm 5px; height:22px; border-top:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"tab-stops:right 50.15pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e5.\u0026nbsp;1905\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eCodes :\u003c/p\u003e\r\n\r\n\u003cp\u003eA B C D\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Surat Split :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;It was a 1907 event when the Indian National Congress (INC) split into two groups:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. the Moderates and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. the Radicals, also known as the Extremists.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe split was caused by a disagreement over who should be the presidential candidate. The Extremists wanted Lala Lajpat Rai, while the Moderates supported Rash Bihari Ghosh.\u003c/li\u003e\r\n\t\u003cli\u003eThe split was a major blow to the INC, and the differences between the two groups presented an opportunity to the British. The INC reunited in 1915.\u003c/li\u003e\r\n\t\u003cli\u003eThe Moderates, also known as the Early Nationalists, were a group of political leaders active between 1885 and 1907. \u0026nbsp;hey believed that political connections with Britain were in India\u0026rsquo;s best interests and that the time wasn\u0026rsquo;t right for a direct challenge to British rule.\u003c/li\u003e\r\n\t\u003cli\u003eThe Extremists believed in self-reliance as a weapon against domination. They promoted Swadeshi and boycotted foreign goods.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Communal Award :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was announced by British Prime Minister Ramsay MacDonald on August 16, 1932. It was also known as the MacDonald Award.\u003c/li\u003e\r\n\t\u003cli\u003eThe award provided separate electorates for minorities, including Muslims, Sikhs, Indian Christians, Anglo-Indians, women, and the \u0026ldquo;depressed classes\u0026rdquo;. It also ensured the retention of separate electorates for Muslims, Sikhs, and Europeans.\u003c/li\u003e\r\n\t\u003cli\u003eThe award was based on the recommendations of the Indian Franchise Committee and Ambedkar\u0026rsquo;s efforts. It was announced after the Round Table Conference (1930\u0026ndash;32). The award was later incorporated into the act of 1935.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe All-Party Conference :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a group of Indian political parties that organized a committee in 1928 to write the Constitution of India. The conference was chaired by Dr. M. A. Ansari.\u003c/li\u003e\r\n\t\u003cli\u003eThe conference played a key role in the Indian independence movement. It united diverse political and social organizations to create a front against British rule.\u003c/li\u003e\r\n\t\u003cli\u003eThe conference was held in Guwahati in 1928 and was attended by leaders of India\u0026rsquo;s various political parties and organizations.\u003c/li\u003e\r\n\t\u003cli\u003eThe Lucknow All Parties Conference of 1928 was a landmark event in the history of the Indian Freedom Struggle. It adopted a draft constitution for free India and endorsed a dominion status for it.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Poorna Swaraj resolution :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a declaration of complete independence from the British Empire, passed by the Indian National Congress in 1929. The resolution was proclaimed on January 26, 1930, and is now celebrated as India\u0026rsquo;s Republic Day.\u003c/li\u003e\r\n\t\u003cli\u003eThe resolution was a powerful assertion of India\u0026rsquo;s desire to break free from colonialism and reclaim its destiny. However, Prime Minister Nehru later interpreted the resolution as allowing India to remain within the British Commonwealth.\u003c/li\u003e\r\n\t\u003cli\u003eThe resolution was passed at the Indian National Congress session in Lahore on December 19, 1929, under the presidency of Jawaharlal Nehru. The president of the convention, Pandit Jawaharlal Nehru, hoisted the Indian tricolour flag on the bank of the Ravi River.\u003c/li\u003e\r\n\u003 text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e\u0026nbsp;4. Awadh \u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eCodes :\u003c/p\u003e\r\n\r\n\u003cp\u003eA B C D\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Moplah Rebellion :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Malabar Rebellion or Mappila Rebellion, was an armed revolt that took place in 1921. The rebellion was a response to British colonial rule and the feudal system in the Malabar region of Kerala, India. The rebellion was led by Variyamkunnath Kunjahammed Haji and Ali Musaliar, and began on August 20, 1921.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion was the result of a series of riots by Mappila Muslims in the 19th and early 20th centuries. The Khilafat Movement, which began in 1919 to restore the caliphate in Turkey, also contributed to communal feelings among the Moplahs.\u003c/li\u003e\r\n\t\u003cli\u003eThe Moplahs were also concerned about the growth of Hindu nationalism in India and the perceived Hindu domination of the Malabar region.\u003c/li\u003e\r\n\t\u003cli\u003eThe Moplahs were mostly tenant farmers who were angry at the upper-caste Hindu landlords and the British colonial authorities for protecting and supporting them. The rebellion lasted over four months.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Pabna Disturbances :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Pabna Revolt, was a peasant uprising that took place from 1873\u0026ndash;1876. The revolt began in the Yusufshahi Pargana of Pabna, which is now part of Bangladesh.\u003c/li\u003e\r\n\t\u003cli\u003eThe peasants, known as \u0026ldquo;Ryots\u0026rdquo; in the native language, revolted against the \u0026ldquo;zamindars\u0026rdquo; who oppressed them with high rents, evictions, and other levies. The peasants were forced to pay land taxes, rents, and other levies regardless of the year\u0026rsquo;s harvest, crop production rate, and low rainfall. In fact, the taxes were often doubled for the poor peasants.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pabna rebellion is considered a landmark because it brought about a change in perception between the individual rights of zamindar and peasants.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Eka Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Unity Movement, was a peasant movement that took place in Awadh in the 1920s. The movement began in Lucknow in November 1921 and lasted until April 1922. It spread to the districts of Hardoi, Unnao, and Sitapur.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement\u0026rsquo;s objectives were:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Refusing to pay more than recorded rent\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Demanding receipts for rent paid\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Refusing to pay nazrana or to do begar (forced labor)\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe movement was initially started by Congress and the Khilafat movement, but was later led by Madari Pasi, a lower caste leader. The movement was part of a broader wave of peasant uprisings that occurred in the aftermath of World War I.\u003c/li\u003e\r\n\t\u003cli\u003eThe reasons for the revolt were rooted in the Awadh region\u0026rsquo;s deeply exploitative agrarian structure. One of the major reasons for the movement was higher rent, more than 50 per cent.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement was spontaneous and died out in a short time. However, Madari Pasi became a folk hero in the Awadh region from the very day the Eka movement was launched.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBirsa Munda :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a Munda tribal independence fighter and national hero who led the Munda Rebellion in the Bengal Presidency (now Jharkhand, then part of Bihar) during the British Raj.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion, also known as the Ulgulan or Great Tumult, took place from 1899\u0026ndash;1900.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion\u0026rsquo;s primary political goal was to restore the traditional land rights of tribal people.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe rebellion was caused by a number of factors, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. British land deals that destroyed the tribal customary land system\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Hindu landowners and lenders seizing control of tribal property\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Missionaries denouncing tribal traditional culture\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Unfair land grabbing practices by colonial and local authorities\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British strategy of enforcing grazing taxes, prohibiting shifting agriculture in the forests, and restricting tribal members\u0026rsquo; access to the area\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;The rebellion had a dual purpose:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;to revitalize the demoralized Adivasi community and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. to combat the dikus (both British and indigenous exploiters) while striving for Munda Disum (Munda rule/ country).\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBirsa Munda was born on November 15, 1875 at Ulihatu village under Bengal Presidency. A few months after the movement, Birsa was imprisoned by the British.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44266", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/sty n_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the correct chronological sequence of the following? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1997)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Wood\u0026rsquo;s Education Despatch\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Macaulay\u0026rsquo;s Minute on Education\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Sergeant Education Report\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Indian Education (Hunter Commission)\u003c/p\u003e\r\n\r\n\u003cp\u003eCodes :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMacaulay\u0026rsquo;s Minute on Education :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThomas Babington Macaulay, a British politician and historian, wrote Minute on Indian Education in 1835. The document was written for Lord William Bentinck, the governor general of British India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMacaulay\u0026rsquo;s proposals included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Educate a select few Indians:\u003c/strong\u003e These Indians would then educate the masses.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Create a class: \u003c/strong\u003eThis class of Indians would serve British interests and remain loyal to them.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Use English as the medium of instruction\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Teach Western education to Indians\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMacaulay\u0026rsquo;s Minute on Education marked a change from the indigenous traditional educational system to a formalized modern educational system. It also helped the English language spread throughout India.\u003c/li\u003e\r\n\t\u003cli\u003eMacaulay also inaugurated a national system of education, Western in outlook. As president of a commission on Indian jurisprudence, he drafted a penal code that later became the basis of Indian criminal law.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWood\u0026rsquo;s Despatch :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a policy document from 1854 that aimed to create an education system in India. The document was sent by Charles Wood, the President of the Board of Control of the British East India Company, to Lord Dalhousie, the then Governor-General of India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe document is known as the Magna Carta of English Education in India. Its objectives included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Educating Indians on Western culture\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Producing a class of public officials\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Promoting the moral and intellectual development of the next generation\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Enhancing Indians\u0026rsquo; practical and vocational skills\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe document also recommended:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Primary schools\u0026nbsp;to adopt vernacular languages\u003c/p\u003e\r\n\r\n\u003cp\u003e2. High schools to use anglo-vernacular languages as the medium of instructions.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Education Department be set up in every province\u003c/p\u003e\r\n\r\n\u003cp\u003e4. At least one government school be opened in every district\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Universities on the model of the London university be established in big cities like Bombay, Madras and Calcutta\u003c/p\u003e\r\n\r\n\u003cp\u003e6. The document also emphasized the importance of female education.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Hunter Commission 1882 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt tried to improve the Indian education system by developing proper infrastructure, improving primary education, and adopting a policy of religious neutrality.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Sergeant Scheme :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Report of the Sergeant Commission on Post-War Education Development in India, was a 1944 memorandum that outlined the future development of education and literacy in India. The British-run Government of India commissioned the memorandum.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44267", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSwaraj Party\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n eak-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A): Partition of Bengal in 1905 brought to an end the Moderates\u0026rsquo; role in the Indian freedom movement\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R): The Surat session of Indian National Congress separated the Extremists from the Moderates......... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1998)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe partition of Bengal in 1905 was a territorial reorganization of the Bengal Presidency. The British Raj authorities announced the partition on July 16, 1905. The partition separated the eastern areas, which were mostly Muslim, from the western areas, which were mostly Hindu. The plan was to create modern-day Bangladesh and Assam as East Bengal and make Dhaka the new capital.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe partition was opposed by :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIndian nationalists, who saw it as a challenge to Indian nationalism and a deliberate attempt to divide Bengal on religious grounds. The partition also animated the Muslims to form their own national organization along communal lines.\u003c/li\u003e\r\n\t\u003cli\u003eThe Early Nationalists, also known as the Moderates, were a group of political leaders in India active between 1885 and 1907.\u003c/li\u003e\r\n\t\u003cli\u003eSome of the prominent Moderate leaders include Dadabhai Naoroji, Womesh Chandra Bonnerjee, G Subramania Aiyer, Gopal Krishna Gokhale, Madan Mohan Malaviya, and Sir Surendranath Banerjee.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003cstrong\u003eThe Surat session of the Indian National Congress in 1907 split the party into two groups:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. the Extremists and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. the Moderates.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe split was caused by a disagreement over who should be the presidential candidate. The Extremists wanted Lala Lajpat Rai or Tilak, while the Moderates supported Rash Behari Ghosh. Lala Lajpat Rai eventually stepped down, and Rash Behari Ghosh became the President.\u003c/li\u003e\r\n\t\u003cli\u003eThe Surat split was a significant blow to the Indian National Congress. The differences between the Moderates and the Extremists presented an opportunity for the British.\u003c/li\u003e\r\n\t\u003cli\u003eThe Extremists were completely against British rule and wanted complete independence. The Moderates, on the other hand, wanted self-rule and greater autonomy and accepted nominal British rules. The Moderates believed that political connections with Britain were in India\u0026rsquo;s interest and that the time wasn\u0026rsquo;t ripe for a direct challenge to British rule.\u003c/li\u003e\r\n\t\u003cli\u003eThe extremists believed in self-reliance as a weapon against domination. They promoted Swadeshi and boycott of foreign goods.\u003c/li\u003e\r\n\t\u003cli\u003eThe Surat session was held on the banks of the Tapti river in Surat. The extremist camp was led by Lal Bal Pal and the moderate camp was led by Gopal Krishna.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44269", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBalkanize the Indian sub-continent\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !i  percentage of school-age children were already receiving instruction. The Governor General in Council would set the attendance percentage.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHowever, the bill was rejected for a number of reasons, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Local governments were not in favor of it.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Local bodies were not willing to levy educational cess.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. A section of educated Indians did not support the bill.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. There was still scope for extending primary education on voluntary lines.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn 1913, the government moved a resolution on Education Policy, but refused to take up the responsibility of compulsory education. The government did, however, accept the policy of removing illiteracy. It also urged provincial governments to provide free elementary education to the poorer and more backward sections.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44271", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\  break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the correct sequence of the following events? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1998)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Tilak\u0026rsquo;s Home Rule League\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Komagata maru Incident\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Mahatma Gandhi\u0026rsquo;s arrival in India\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below:\u003c/p\u003e\r\n\r\n\u003cp\u003eCodes:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Komagata Maru :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was incident occurred in 1914 when the Japanese steamship Komagata Maru attempted to dock in Vancouver, Canada with 376 prospective immigrants. The Canadian government refused to allow the passengers to disembark, and most were forced to return to Budge Budge, Calcutta. The incident is considered a stain on Canadian history and highlights the racist government policies of the time. The passengers were British subjects, but faced racism and hatred. The Canadian government enforced strict immigration laws that targeted people from Asian countries.\u003c/li\u003e\r\n\t\u003cli\u003eThe Komagata Maru incident is also the subject of the 1974 Indian Hindi-language film Jeevan Sangram.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMahatma Gandhi\u0026#39;s arrival in India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMahatma Gandhi returned to India on January 9, 1915, after living in South Africa for more than 20 years. He set sail from Cape Town on July 19, 1914, and arrived in Mumbai to a Apollo Bunder. large, cheering crowd at\u003c/li\u003e\r\n\t\u003cli\u003eGandhi\u0026#39;s arrival was a grand affair, with a large crowd welcoming him at the Apollo port (Wellington Pier) of Mumbai.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGandhi\u0026#39;s contributions to Indian politics include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Introducing non-violence as a tool for political protest\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Organizing mass movements to fight for Indian rights\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Helping to unite different religious and social groups in India\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn 2003, the Indian government chose January 9th as Pravasi Bharatiya Divas (Non-Resident Indian Day) to commemorate the contributions of the overseas Indian community to India\u0026#39;s development.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian Home Rule League :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was established by Bal Gangadhar Tilak in April 1916 at Belgaum. The league\u0026#39;s goal was to achieve self-government for India within the British Empire.\u003c/li\u003e\r\n\t\u003cli\u003eThe league had six branches, including one each in Central Provinces, Karnataka, Bombay, and Central Maharashtra, and two in Berar. The league\u0026#39;s branches in cities like Madras and Calcutta organized public meetings, processions, and rallies.\u003c/li\u003e\r\n\t\u003cli\u003eThe league\u0026#39;s achievements include creating a popular base through organizational links and a generation of nationalists.\u003c/li\u003e\r\n\t\u003cli\u003eThe Home Rule Movement lasted from 1916-1918 and is believed to have set the stage for the independence movement. In 1920, the All India Home Rule League changed its name to Swarajya Sabha.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44277", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA member of Congress Working Committee\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css w-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the correct sequence of the following events? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1998)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The August Offer\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The I.N.A trial\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Quit India Movement\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The Royal Indian Naval Ratings Revolt\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below:\u003c/p\u003e\r\n\r\n\u003cp\u003eCodes:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe August Offer :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a proposal made in 1940 by Lord Linlithgow, the Viceroy of India. The offer was a response to the Indian National Congress\u0026rsquo;s disappointment with the British involvement of India in World War I. The offer was presented at a conference in Simla and aimed to appease Indian sentiments and gain support for World War II.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe August Offer included the following promises:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Expanding the Executive Council of the Viceroy of India to include more Indians\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Establishing an advisory war council\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Giving full weight to minority opinion\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Recognizing Indians\u0026rsquo; right to frame their own constitution\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe offer was rejected by the Congress and the League. The Congress rejected the offer because they wanted complete independence, but were offered Dominionstatus instead. The League stated that they would accept nothing less than the country\u0026rsquo;s separation. The British later tweaked the offer and came up with the Cripps Proposal in 1942.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Quit India Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a civil disobedience campaign that began on August 8, 1942 and ended in 1945. The movement was launched by Mahatma Gandhi and the Indian National Congress (INC) to end British rule in India. The movement also went by the names India August Movement and August Kranti.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement\u0026rsquo;s slogans were \u0026ldquo;Quit India\u0026rdquo; and \u0026ldquo;Bharat Chodo\u0026rdquo;. Gandhi also gave the slogan \u0026ldquo;Do or die\u0026rdquo; to the people. The movement included protests and strikes.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement\u0026rsquo;s causes included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Second World War had started in 1939.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Japan, which was part of the Axis Powers that were opposed to the British in the war, were gaining onto the north-eastern frontiers of India.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British Government arrested Gandhi, Nehru, and many other leaders of the Indian National Congress the day after the movement\u0026rsquo;s launch. The British resorted to violent means to thwart the movement. sympathy for the defendants who were considered by some to be patriots of India. The three men tried in the 1945-1946 court martial were Shah Nawaz Khan, Dhillon, and Sahgal. The three INA members were found guilty of waging a war, but were not given the death sentence. Instead, they were dismissed from service and handed transportation for life, which was later remitted.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian National Army (INA) trials :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt were a series of court-martial proceedings held between November 1945 and May 1946. The trials were also known as the Red Fort trials, and were held at the Red Fort in Delhi. The trials were conducted against INA officers on charges of treason, torture, murder, and abetment to murder during World War II.\u003c/li\u003e\r\n\t\u003cli\u003eThe INA was formed by a group of Indians in Southeast Asia during World War II. The British wanted to show the fairness of their justice, so the trial was held in public. The trials attracted much publicity and public\u0026nbsp;sympathy for the defendants who were considered by some to be patriots of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe three men tried in the 1945-1946 court martial were Shah Nawaz Khan, Dhillon, and Sahgal. The three INA members were found guilty of waging a war, but were not given the death sentence. Instead, they were dismissed from service and handed transportation for life, which was later remitted.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Royal Indian Navy (RIN) revolt :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the 1946 Naval Uprising, was a failed insurrection by sailors, soldiers, police, and civilians against the British government in India in February 1946. The revolt began on February 18, 1946, when ratings on board ships and shore establishments in Bombay harbor protested general conditions, including food and living conditions. The revolt spread to Karachi and Calcutta, and ultimately involved over 20,000 sailors in 78 ships and shore establishments.\u0026nbsp;The British repressed the revolt with force, killing eight and wounding 33. The revolt was sparked by the rapid expansion of the RIN during World War II.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOther factors that contributed to the revolt include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;The British\u0026rsquo;s open trial of three Army officers of the INA\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The anger of Indian troops when they learned that the Azad Hind Fauj detainees were to be tried and executed in the Red Fort\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The demand for the release of Indian soldiers being imprisoned by British forces in Indonesia\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44281", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e ng\u003eThe mission was led by three British cabinet ministers:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Pethick Lawrence,\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Stafford Cripps, and\u003c/p\u003e\r\n\r\n\u003cp\u003e3. A.V. Alexander.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;The Cabinet Mission Plan proposed a complicated system for India with three tiers:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. the provinces,\u003c/p\u003e\r\n\r\n\u003cp\u003e2. provincial groupings, and\u003c/p\u003e\r\n\r\n\u003cp\u003e3. the center.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe center\u0026rsquo;s power was to be confined to foreign affairs, defense, currency, and communications. The provinces would keep all other powers and could establish three groups.\u003c/li\u003e\r\n\t\u003cli\u003eThe Cabinet Mission Plan also proposed that there be a Constituent Assembly to draft a constitution for India. The Constituent Assembly was to be elected by the provincial legislatures. The Cabinet Mission Plan was accepted by the Indian National Congress but rejected by the Muslim League. The Muslim League wanted a separate state for Muslims.\u003c/li\u003e\r\n\t\u003cli\u003eThe Cabinet Mission Plan failed to achieve its objectives, but it did lay the groundwork for the eventual transfer of power to India in 1947.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44291", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"t pan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003eWar \u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eCodes :\u003c/p\u003e\r\n\r\n\u003cp\u003eA B C D\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe First Anglo-Maratha War :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a conflict between the British East India Company and the Maratha Empire in India from 1775 to 1782. The war began with the Treaty of Surat on March 6, 1775 and ended with the Treaty of Salbai on May 17, 1782. The war was fought in between Surat and Poona, and the British lost, but both sides\u0026#39; positions were restored before the war.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Second Anglo-Mysore War :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a conflict between the British East India Company and the Kingdom of Mysore from 1780 to 1784. The war took place in India, South India, and the Indian subcontinent.\u003c/li\u003e\r\n\t\u003cli\u003eThe war began when Haider Ali defeated the English army and captured Arcot in 1781. The war was marked by bloody battles, with fortunes shifting between the two sides. In September 1780, Tipu defeated William Baillie at the Battle of Pollilur, and in February 1782, he defeated John Braithwaite at Kumbakonam. Both Baillie and Braithwaite were taken prisoner to Seringapatam.\u003c/li\u003e\r\n\t\u003cli\u003eThe war ended in March 1784 with the signing of the Treaty of Mangalore. The treaty included the reinstatement of each side\u0026#39;s territories.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe First Anglo-Burmese War :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the First Burma War, was a conflict between the British and Burmese empires that lasted from 1824 to 1826. The war was the first of three conflicts between the two countries in the 19th century.\u003c/li\u003e\r\n\t\u003cli\u003eThe war began on March 5, 1824, after clashes along the border in Arakan. The British wanted to expand their influence in British Bengal and find new markets for British manufacturing. The war ended in February 1826 with the Treaty of Yandabo, which gave the British East India Company victory. Burma lost territory it had previously conquered in Assam, Manipur, and Arakan.\u003c/li\u003e\r\n\t\u003cli\u003eThe war was the longest and most expensive in British Indian history. 15,000 European and Indian soldiers were killed, and the number of Burmese soldiers and civilians killed is unknown.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe First Anglo-Afghan War :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was fought from 1838 to 1842 between the British East India Company and the Emirate of Afghanistan. The war was initially successful for the British, but ended in one of the worst military disasters of the 19th century. The war cost the British in India 15 million pounds sterling and 20,000 lives.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe British used Afghanistan as a buffer state to protect all approaches to British India from a Russian invasion. The British, feeling that D\u014dst Mohammad was either hostile to them or unable to resist Russian penetration, moved to take a direct role in Afghan affairs.\u003c/li\u003e\r\n\t\u003cli\u003eThe Anglo-Afghan Wars took place between 1839 and 1919.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe three wars were:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. First Anglo-Afghan War (1838-43)\u003cbr /\u003e\r\n2. Second Anglo-Afghan War (1878-80)\u003cbr /\u003e\r\n3. Third Anglo-Afghan War (1919)\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe wars resulted in a botched boundary between Afghanistan and present-day Pakistan.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44297", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSatyendranath Tagore\u0026nbsp;\u003c/p /style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}  @font-face { font-family: \u0027serif\u0027;src: url(\u0027https://appx-content-v2.classx.co.in/fonts/serif.ttf\u0027) format(\u0027truetype\u0027); }\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eVinayak Damodar Savarkar is the author of The Indian War of Independence 1857, which was first published in 1909. The book is an Indian nationalist history of the 1857 revolt. Savarkar is also credited with first using the term \u0026ldquo;War of Independence\u0026rdquo; in his 1909 book.\u003c/li\u003e\r\n\t\u003cli\u003eKarl Marx also contributed to the development of modern communism. In 1857, Marx published an article titled \u0026ldquo;The\u0026nbsp;Indian Revolt\u0026rdquo; in the New-York Tribune.\u003c/li\u003e\r\n\t\u003cli\u003eBankim Chandra Chatterji\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003ewrote Ananda Math, a Bengali historical novel published in 1882. The novel is set during the Bengal famine of 1770 and is inspired by the Sannyasi Rebellion in the late 18th century. It is considered one of the most important novels in the history of Bengali and Indian literature.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Ananda Math has many themes, including:\u003c/li\u003e\r\n\t\u003cli\u003eFamine, Freedom struggle, Brotherhood, Bhakti (love) of Mother India, Feudal system, Patriotism, Nationalism, Sacrifice, Violence.\u003c/li\u003e\r\n\t\u003cli\u003eThe novel\u0026rsquo;s first English publication was titled The Abbey of Bliss.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe novel has been translated into English by many prominent people, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Nares Chandra Sen-Gupta in 1906\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Ghosh brothers Aurobindo and Barindrakumar in 1909\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Basanta Koomar Roy in 1941\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Julius Lipner in 2005\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Life Divine is a philosophical work by Sri Aurobindo. The book was first published in 1939.\u003c/li\u003e\r\n\t\u003cli\u003eIn The Life Divine, Aurobindo presents a theory of spiritual evolution that will lead to the transformation of humans and the advent of a divine life on Earth. The book is based on Aurobindo\u0026rsquo;s principles and philosophical work.\u003c/li\u003e\r\n\t\u003cli\u003eThe Life Divine first appeared serially in the monthly review Arya between August 1914 and January 1919.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eSadhana: \u003c/strong\u003eThe Realization of Life is written by Nobel Prize Laureate Rabindranath Tagore. The book is an introduction to India\u0026rsquo;s ancient spiritual heritage. It is a restatement of ancient Indian wisdom for modern times and a commentary on the Upanishads.\u003c/li\u003e\r\n\t\u003cli\u003eThe book is a repository of timeless wisdom from the East. It relates a theory of a few points of the teaching of Jesus Christ and Gautama Buddha. The narrative touchesmany bases dealing with the virtue of man, greed, love and compassion.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "
