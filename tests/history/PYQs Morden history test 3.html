<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Modern History PYQ Test 3</title>
<style>
:root{
  --accent:#2ec4b6;
  --accent-dark:#1da89a;
  --muted:#69707a;
  --success:#1f9e5a;
  --danger:#c82d3f;
  --bg:#f5f7fa;
  --card:#fff;
  --maxw:820px;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#111;padding-bottom:96px}
.container{max-width:var(--maxw);margin:auto;padding:10px 16px}
header{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.08);position:relative;z-index:10}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:12px}
h1{margin:0;color:var(--accent);font-size:18px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:background .18s}
.btn:hover{background:var(--accent-dark)}
.btn-ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);padding:8px 12px;border-radius:999px;font-weight:700;cursor:pointer}
.timer-text{color:var(--accent-dark);font-weight:700;font-size:18px;min-width:72px;text-align:right}
.toggle-pill{position:relative;width:90px;height:30px;background:#eaeef0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:13px;color:#444;font-weight:600}
.toggle-pill span{z-index:2;flex:1;text-align:center}
.toggle-pill::before{content:"";position:absolute;top:3px;left:3px;width:42px;height:24px;background:var(--accent);border-radius:999px;transition:.28s}
.toggle-pill.active::before{transform:translateX(45px);background:var(--accent-dark)}
.toggle-pill.active span:last-child{color:#fff}
.toggle-pill span:first-child{color:#fff}

/* quiz card */
.card{background:var(--card);border-radius:10px;padding:10px 12px;margin:12px 0;box-shadow:0 4px 10px rgba(0,0,0,0.05)}
.qbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qmeta{font-size:13px;color:var(--muted)}
.marking{font-size:13px;color:var(--muted)}
.qtext{font-size:16px;margin:6px 0}
.options{display:flex;flex-direction:column;gap:8px}
.opt{padding:10px;border:1px solid #e6eaec;border-radius:8px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .12s}
.opt:hover{border-color:#cfd8da}
.opt.selected{border-color:var(--accent)}
.opt.correct{border-color:var(--success);background:rgba(31,158,90,0.12)}
.opt.wrong{border-color:var(--danger);background:rgba(200,45,63,0.12)}
.custom-radio{display:none;height:16px;width:16px;border-radius:50%;border:2px solid #ccc}
.opt.selected .custom-radio{display:block;border:6px solid var(--accent)}
.opt.correct .custom-radio{display:block;border:6px solid var(--success)}
.opt.wrong .custom-radio{display:block;border:6px solid var(--danger)}
.explanation{margin-top:8px;padding:10px;border-radius:8px;background:#fbfdfe;border:1px solid #edf2f3;display:none;font-size:14px}

/* bottom nav */
.fbar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -3px 12px rgba(0,0,0,0.08);display:flex;justify-content:center;z-index:50}
.fbar-inner{display:flex;justify-content:center;align-items:center;gap:10px;max-width:var(--maxw);width:100%;padding:10px}
.fbar button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.fbar button:hover{background:var(--accent-dark)}

/* palette popup */
#palette{position:fixed;top:64px;right:14px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.12);padding:12px;display:none;gap:8px;flex-wrap:wrap;z-index:200;max-width:300px}
#palette .qbtn{width:44px;height:44px;border-radius:8px;border:1px solid #e3eaeb;background:#fbfdff;cursor:pointer;font-weight:700}
#palette .qbtn.answered{background:var(--accent);color:#fff;border:none}
#palette .qbtn.current{background:rgba(46,196,182,0.12);border:2px solid var(--accent)}
#palette-summary{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:300}
.modal-content{background:#fff;border-radius:12px;padding:18px;max-width:420px;width:92%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.18)}
.modal h3{margin:0 0 8px;color:var(--accent)}
.modal p{color:#333;margin:8px 0 12px;font-size:15px}
.modal .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border:none;padding:8px 14px;border-radius:999px;font-weight:700;cursor:pointer}

/* results */
.results{margin-top:12px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.stat{flex:1 1 120px;padding:10px;border-radius:10px;text-align:center;background:#f7fbfb;border:1px solid #e6eeed}
.stat h4{margin:0;color:var(--accent);font-size:13px}
.stat p{margin:6px 0 0;font-weight:700;font-size:18px}

@media(max-width:540px){
  .header-inner{padding:8px}
  .timer-text{font-size:16px}
  .fbar-inner{gap:8px;padding:8px}
  .fbar button{padding:8px 10px;font-size:13px}
}
</style>
</head>

003e\r\n\r\n\u003cp\u003e5. Build political unity amongst Muslims\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Use their influence to protect the caliphate\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Restore the Khilafat\u0026rsquo;s control over Muslim sacred places\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Give the Caliph sufficient territory to prevent him from defending Islamic faith\u003c/p\u003e\r\n\r\n\u003cp\u003e9. Keep the Arab Lands (Arabia, Syria, Iraq, and Palestine) under Muslim rule\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Khilafat movement was initially supported by Gandhi\u0026rsquo;s noncooperation movement.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1920, the movement published the Khilafat Manifesto, which called upon the British to protect the caliphate.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement fell apart after the abolition of the caliphate in 1924.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44210", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eHind Kesari\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:1 tyle\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3, 4, 2, 1\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the correct chronological sequence of the following stages in the political life of Mahatama Gandhi? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1993)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Champaran\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Ahmedabad Mill Strike\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Kheda\u003c/p\u003e\r\n\r\n\u003cp\u003e4.\u0026nbsp;Non-cooperation Movement\u003c/p\u003e\r\n\r\n\u003cp\u003eChoose the correct option from the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Champaran Satyagraha :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a farmer\u0026rsquo;s uprising that took place in the Champaran district of Bihar in 1917-1918. It was led by Mahatma Gandhi and is considered a historically important rebellion in the Indian independence movement.\u003c/li\u003e\r\n\t\u003cli\u003eThe Champaran Satyagraha began when farmers revolted against British power between 1914 and 1916. The farmers wereforced to grow indigo on a portion of their land, but they could not grow the food they needed and received little payment for it.\u003c/li\u003e\r\n\t\u003cli\u003eThe British also forced farmers by binding them in unfair contracts to grow indigo on their lands. Gandhi was persuaded by Pandit Raj Kumar Shukla to visit the region and try to organize mass uprisings by people to protest against injustice.\u003c/li\u003e\r\n\t\u003cli\u003eSatyagraha means clinging to truth, holding fast to truth, insistence on truth, or firm adherence to truth. Gandhiji described Satyagraha as \u0026ldquo;firmness in a good cause\u0026rdquo; in Indian opinion.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kheda Satyagraha :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a non-cooperation movement that took place in the Kheda district of Gujarat, India in 1918. The movement was led by Mahatma Gandhi and was a major revolt in the Indian independence movement.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement was a protest against the collection of taxes. The year 1918 had seen failed crops due to droughts. The law entitled farmers to remission if their produce was less than a quarter of their normal output.However, the government refused to grant any remission from paying land revenue.\u003c/li\u003e\r\n\t\u003cli\u003eThe peasants also refused to accept a 23% tax increase that was imposed on them despite a devastating crop failure and outbreaks of plague and cholera.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement was supported by residents of the district of all castes and races. Sardar Vallabhbhai Patel led the farmers in protest under Gandhi\u0026rsquo;s guidance. The movement is usually credited as the launch of Gandhi\u0026rsquo;s political career.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Ahmedabad Mill Strike of 1918 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a significant event in India\u0026rsquo;s freedom struggle. The strike was a result of textile mill workers protesting poor working conditions and the mill owners stopping plague bonuses.\u003c/li\u003e\r\n\t\u003cli\u003eThe strike became a major civil disobedience movement, and Mahatma Gandhi used non-violent tactics for the first time, including a hunger strikeand satyagraha.\u003c/li\u003e\r\n\t\u003cli\u003eThe strike took place in February and March of 1918, and was led by textile mill workers. The mill had around 40,000 laborers at the time. Gandhi was invited to the strike by Anasuya Ben Sarabhai and her brother Ambalal Sarabhai, a social reformer who had returned from England to settle the movement.\u003c/li\u003e\r\n\t\u003cli\u003eGandhi intervened to resolve the dispute between the workers and the mill owners, and started a fast to compel a compromise.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Non-Cooperation Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was\u0026nbsp;a nonviolent civil disobedience campaign launched in 1920 by Mahatma Gandhi.\u0026nbsp;The movement\u0026rsquo;s goal was to achieve Indian independence from British rule by persuading the British government to grant self-governance.\u0026nbsp;The movement lasted from September 1920 to February 1922. \u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe movement\u0026rsquo;s main objectives were to achieve \u0026ldquo;Poorna swaraj\u0026rdquo; through peaceful means and to restore the old status of the Caliph.\u0026nbsp;\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement was a response to several causes, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Jallianwala Bagh massacre\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Rowlatt Act\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Khilafat Movement\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The Government of India Act of 1919\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Resentment at the British after the war\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe movement\u0026rsquo;s driving force was Gandhi\u0026rsquo;s philosophy of Satyagraha, which emphasized non-violence and civil resistance.\u0026nbsp;\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement consisted of Indians:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Resigning their titles\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Boycotting government educational institutions, the courts, government service, foreign goods, and elections\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Eventually, refusing to pay taxes\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British government responded with severe repression, arresting thousands of protesters and imposing harshpunishments.\u0026nbsp;This led to further resentment and fueled the demand for independence.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44217", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePrathana Samaj\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !im x-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRamakrishna Mission\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eUplift of the backward classes was the main programme of the..........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1993)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Satyashodhak Samaj :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a social reform society that aims to established the society in Pune, India on uplift the backward classes. Jyotirao Phule September 24, 1873. The society\u0026#39;s purpose castes from exploitation and oppression. is to liberate the Shudra and Untouchable\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Satyashodhak Samaj\u0026#39;s mission is to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Provide education to the lower castes\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Increase social rights and political access for underprivileged groups\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Focus on women, Shudras, and Dalits\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe government of India has taken several measures to uplift backward classes, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Abolishing untouchability\u003cbr /\u003e\r\n2. Removing restrictions on access to temples, tanks, wells, shops, and more\u003cbr /\u003e\r\n3. Protecting from social evils and exploitation\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe government also has several programs to uplift the weaker section of society, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Pre/post Matric Scholarship for OBC/SC/ST Students\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Reservation or quota system in government jobs\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Scheduled Castes and the Scheduled Tribes \u0026quot;(Prevention of Atrocities) Act, 1989\u0026quot;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePrarthana Samaj translates to \u0026quot;Prayer Society\u0026rdquo; in Sanskrit :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a religious and social reform movement in Bombay, India, founded by Atmaram Pandurang and his brother movement\u0026#39;s goal was to have people believe in and worship only one God.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement became popular after Mahadev Govind Ranade joined. The movement was more concerned with social reforms than with religion.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome of its successes include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Anti-Brahminism\u003cbr /\u003e\r\n2. Self-respect marriages\u003cbr /\u003e\r\n3. Encouraging inter-caste and inter-religious marriages\u003cbr /\u003e\r\n4. Encouraging marriage ceremonies without Brahmin priest\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eArya Samaj :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu reform movement that was founded in 1875 by Swami Dayananda Saraswati. The name translates to \u0026quot;Society of Nobles\u0026quot; in Sanskrit. The movement\u0026#39;s goal is to reestablish the Vedas, the earliest Hindu scriptures, as revealed truth.\u003c/li\u003e\r\n\t\u003cli\u003eArya Samaj followers believe in one God, known as \u0026quot;Om,\u0026quot; who is omniscient, omnipresent, omnipotent, and the source of all justice, bliss, intelligence, and mercy. They also believe that the Vedas are infallible and the literal word of God.\u0026nbsp;\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement is based on two tenets:\u0026nbsp;\u003c/strong\u003e\u003cbr /\u003e\r\n1. monotheism\u003cbr /\u003e\r\n2. the infallible authority of the Vedas.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArya Samaj followers condemn idol worship and emphasize the Vedas as the primary source of knowledge. The movement promotes the principles of nokrishnotruth, righteousness , and the welfare of all.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRamakrishna Mission:\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSwami Vivekananda, the chief disciple the Indian Hindu spiritual guru Ramakrishna, founded the Ramakrishna Mission on May 1, 1897. The mission was originally called The Ramakrishna Mission Association.\u003c/li\u003e\r\n\t\u003cli\u003eThe mission is named after Ramakrishna and primarily promotes the Hindu philosophy of Vedanta-Advaita Vedanta and four yogic ideals. The mission played a significant role in the development of nationalistic awareness and the spiritual growth of Indians.\u003c/li\u003e\r\n\t\u003cli\u003eSwami Vivekananda said he wanted to \u0026quot;set in motion a machinery which will bring noblest ideas to the doorstep of even the poorest and the meanest\u0026quot;.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44218", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n n\u003cp\u003eWood\u0026rsquo;s Despatch of 1854\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe foundation of modern educational system in India was laid by...........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1993)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe foundation of India\u0026rsquo;s modern education system was laid by Macaulay\u0026rsquo;s Minutes of 1835. The Charter Act of 1813 was the first step towards modern education in India.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1854, Charles Wood prepared a Despatch on an educational system for India. This document was the first comprehensive plan for the spread of education in India. It is considered the \u0026ldquo;Magna Carta of English Education in India\u0026rdquo;. The Despatch declared that the aim of the Government\u0026rsquo;s educational policy was the teaching of Western Education.\u003c/li\u003e\r\n\t\u003cli\u003eLord Thomas Babington Macaulay brought the modern school system to India in the 1830s. The curriculum was confined to \u0026ldquo;modern\u0026rdquo; subjects such as science and mathematics. The Charter Act of 1813 : It is also known as the East India Company Act of 1813, was a law passed by the British Parliament.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Charter Act of 1813 included the following features:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Ended the Company\u0026rsquo;s trade monopoly:\u003c/strong\u003e The Company\u0026rsquo;s trade monopoly was ended, except for trade with China, tea, and opium.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Extended the Company\u0026rsquo;s rule:\u003c/strong\u003e The Company\u0026rsquo;s rule was extended for another 20 years.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Increased the Supreme Court\u0026rsquo;s authority:\u003c/strong\u003e The Supreme Court\u0026rsquo;s authority over those who were taxed was expanded.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Set the company\u0026rsquo;s dividend: \u003c/strong\u003eThe company\u0026rsquo;s dividend was fixed at 10.5 percent.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Empowered local governments: \u003c/strong\u003eIt empowered the local governments to tax people subject to the jurisdiction of the Supreme Court.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Allocated funds for education:\u003c/strong\u003e One lakh rupees was allocated for the progress of India\u0026rsquo;s education system.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Gave the Board of Control more authority: \u003c/strong\u003eThe Board of Control was given more authority.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e8. Allowed missionaries to preach: \u003c/strong\u003eChristian missionaries were permitted to preach religion in India and propagate English.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e9. Asserted the Crown\u0026rsquo;s sovereignty: \u003c/strong\u003eThe Act expressly asserted the Crown\u0026rsquo;s sovereignty over British India.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e10. Permitted the improvement of literary and scientific knowledge: \u003c/strong\u003e100,000 rupees annually was allotted for the improvement of literary and scientific knowledge\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWood\u0026rsquo;s Dispatch :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the informal name for a formal dispatch sent in 1854 by Sir Charles Wood to Lord Dalhousie, the Governor-General of India. Wood was the President of the Board of Control of the British East India Company.\u003c/li\u003e\r\n\t\u003cli\u003eThe dispatch is also known as the Magna Carta of English Education in India. It outlined a plan for expanding education in British India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe dispatch\u0026rsquo;s objectives included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Educating Indians on Western culture\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Producing a class of public officials\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Promoting the moral and intellectual development of the next generation\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Enhancing Indians\u0026rsquo; practical and vocational skills\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe dispatch suggested that:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Primary schools should adopt vernacular languages\u003c/p\u003e\r\n\r\n\u003cp\u003e2. High schools should use an Anglo vernacular medium\u003c/p\u003e\r\n\r\n\u003cp\u003e3. English should be the medium for college-level education\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe dispatch\u0026rsquo;s recommendations included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Establishing a Department of Public Instruction in each of Bengal\u0026rsquo;s five provinces\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Expanding mass education\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Establishing universities in the three Presidency towns of Calcutta, Bombay, and Madras\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe dispatch\u0026rsquo;s impact included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The establishment of universities in Bombay, Madras, and Calcutta in 1857\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The establishment of education departments in all provinces\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The establishment of Bethune School for women\u0026rsquo;s education\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Hunter Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was established in 1882 by Viceroy Lord Ripon to examine the state of education in India and recommend reforms.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe commission\u0026rsquo;s objectives were to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Assess the status of elementary education in the British territories\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Suggest ways to improve and extend elementary education\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Assess the work of religious missionaries in the field of education\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The commission was headed by William Wilson Hunter, an Indian Civil Service (ICS) officer and a member of Lord Ripon\u0026rsquo;s Executive council.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe commission had 20 members, including 7 Indian members. The commission tried to improve the Indian education system by developing proper infrastructure, improving primary education, and adopting a policy of religious neutrality.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44219", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eVallabhbhai Patel and Vinobha Bhave\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wr t}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThose who joined Mahatma Gandhi during the Champaran struggle included............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1994)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMahatma Gandhi was accompanied by a team of lawyers and other leaders during the Champaran Satyagraha in 1917:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Lawyers:\u003c/strong\u003e Brajkishore Prasad, Rajendra Prasad, Maulana Mazharul Haque, Anugrah Narayan Sinha, Babu Gaya Prasad Singh, Ramnavmi Prasad, and others including J. B. Kripalani\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Other leaders: \u003c/strong\u003eMahadev Desai, Narhari Parekh, and N.G. Ranga\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Champaran Satyagraha was a movement that gave direction to India\u0026rsquo;s youth and freedom struggle.\u003c/li\u003e\r\n\t\u003cli\u003eGandhi was invited to Champaran, Bihar by a local named Rajkumar Shukla to look into the issues of farmers.\u003c/li\u003e\r\n\t\u003cli\u003eThe government appointed a Commission of Inquiry to look into the issue and nominated Gandhi as one of the members. The Commission found the Planters guilty of exploitation.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome prominent women at the forefront of the movement included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Aruna Asaf Ali\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Kamala Devi\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Usha Mehta\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Sucheta Kripalani\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThousands of other women took part in the movement, which saw an estimated 100,000 protestors arrested.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44220", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eUtirat Singh\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\" u003cp\u003eThe first Indian ruler who joined the Sub sidiary Alliance was..........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1994)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Nizam of Hyderabad, Nizam Ali Khan (Asaf Jah II), was the first Indian ruler to join the Subsidiary Alliance in 1798.\u003c/li\u003e\r\n\t\u003cli\u003eThe alliance made Hyderabad the first princely state to become a British protectorate. Lord Wellesley (1798-1805) introduced the Subsidiary Alliance in 1798.\u003c/li\u003e\r\n\t\u003cli\u003eThe Subsidiary Alliance system was\u0026nbsp;a tributary alliance between the British East India Company and Indian states in South Asia.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe British government introduced the policy in 1798 to capture the sovereignty of princely states.\u0026nbsp;The system led to the British Empire in India and the loss of independence for many Indian states.\u0026nbsp;\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Subsidiary Alliance system had the following features:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. British :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British would protect Indian states against foreign attacks or internal revolts and promise non-interference in internal affairs.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Payment :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIndian rulers had to pay for the British army\u0026rsquo;s maintenance.\u0026nbsp;If they failed to make the payment, a portion of their territory would be taken away and ceded to the British.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTerms and conditions : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIndian rulers had to accept certain terms and conditions, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003ei. Keeping the company\u0026rsquo;s army at the capital of their state\u003c/p\u003e\r\n\r\n\u003cp\u003eii. Giving either money or territory to the company for the maintenance of the troops\u003c/p\u003e\r\n\r\n\u003cp\u003eiii. Expelling all other Europeans from their state\u003c/p\u003e\r\n\r\n\u003cp\u003eiv. Keeping a European official called \u0026ldquo;resident\u0026rdquo; at the capital of their state\u003c/p\u003e\r\n\r\n\u003cp\u003ev. Not negotiating with any other rulers without prior consent from the Governor-General\u003c/p\u003e\r\n\r\n\u003cp\u003evi. Not employ any European in their service without getting approval from the British\u003c/p\u003e\r\n\r\n\u003cp\u003evii. Not entering any political connection with any other Indian state without the permission of the British\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Subsidiary Alliance system led to the building of the British Empire in India and the loss of independence for many Indian states.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44222", "image_check": "0", "image_link_1": "", "i estion": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following upheavals took place in Bengal immediately after the Revolt of 1857?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;1994)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Indigo Disturbances, also known as the Indigo Rebellion or Neel Bidroha, occurred in Bengal during the late 1850s and early 1860s. The Indigo Rebellion was a peasant movement that began in 1859 when farmers rebelled against British planters. The planters forced the farmers to grow indigo instead of food crops under exploitative terms.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Sanyasi Rebellion :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the monk revolt, was a rebellion in Bengal, India from 1770 1777. The rebellion was led by sannyasis and sadhus in the forests of Murshidabad and Baikunthapur, Jalpaiguri, and was a challenge to British rule and exploitation. The rebellion\u0026rsquo;s goal was to raid English factories and government treasuries.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion began in 1750, but became violent in 1773 when Warren Hastings became the Governor-General of Bengal. In 1771, 150 unarmed sannyasis were killed by order of Warren Hastings. The rebellion was suppressed by Warren Hastings.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion is the subject of the 1882 Bengali fiction Anandamath by Bankim Chandra Chattopadhyay. The book is considered one of the most important novels in Bengali and Indian literature.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Santhal Rebellion :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Sonthal Rebellion or the Santhal Hool, was a peasant revolt that took place in 1855\u0026ndash;1856. It was the first peasant revolt in India.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eThe rebellion was led by the four Murmu brothers: \u003c/strong\u003eSidhu, Kanhu, Chand, and Bhairav. On June 30, 1855, the brothers mobilized around 60,000 Santhals and declared a rebellion against the East India Company (EIC). The rebellion began after a massive assembly of over 6,000 Santhals representing around 400 villages. The Santhals were a tribal community who lived in the regions of present-day Jharkhand and West Bengal.\u003c/li\u003e\r\n\t\u003cli\u003eThey were facing oppression and exploitation by moneylenders, landlords, and British colonial authorities. The British convinced the Santhals to clear forests and practice settled agriculture, and then took land away from them with the Permanent Land Settlement of 1793. The Santhals were also forced to rely on moneylenders, which led to a heavy debt burden and increasing poverty. The rebellion took place during Lord Dalhousie\u0026rsquo;s tenure (1848-1856).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Pabna Disturbances :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Pabna Revolt, was a peasant uprising that took place from 1873\u0026ndash;1876. The revolt began in the Yusufshahi Pargana of Pabna, which is now part of Bangladesh.\u003c/li\u003e\r\n\t\u003cli\u003eThe peasants, known as \u0026ldquo;Ryots\u0026rdquo; in the native language, revolted against the \u0026ldquo;zamindars\u0026rdquo; who oppressed them with high rents, evictions, and other levies. The peasants were forced to pay land taxes, rents, and other levies regardless of the year\u0026rsquo;s harvest, crop production rate, and low rainfall. In fact, the taxes were often doubled for the poor peasants.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pabna rebellion is considered a landmark because it brought about a change in perception between the individual rights of zamindar and peasants.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44224", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle ty iece for the Radical Democratic Party, which Roy founded.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe All India Kisan Sabha (AIKS) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a peasant front that advocates for farmers\u0026rsquo; rights and anti-feudal movements in India. It was founded in 1936 as the All India Kisan Congress at the Indian National Congress (INC) Lucknow Session.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe AIKS\u0026rsquo;s objectives include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Abolishing landlordism and distributing land to agricultural and other rural laborers\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Improving the standard of living of rural masses\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Ending the exploitation of agricultural and other rural laborers\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe AIKS is also known as the Akhil Bharatiya Kisan Sabha and is the peasant or farmers\u0026rsquo; wing of the Communist Party of India.\u003c/li\u003e\r\n\t\u003cli\u003eSahajanand Saraswati was the first president of the AIKS, and NG Ranga was the first secretary.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAnushilan Samiti :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a Bengali organization that operated in India in the early 20th century. The name translates to \u0026ldquo;Practice Association\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe Samiti was originally a youth society and gymnasium that engaged in traditional physical activities and social work.\u003c/li\u003e\r\n\t\u003cli\u003eIt was established in 1902 and lasted until 1930. The Samiti\u0026rsquo;s focus was on physical education and the moral development of its members.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the Samiti was also an underground society for anti-British revolutionaries. The group advocated for revolutionary violence to overthrow the British Empire in India.\u003c/li\u003e\r\n\t\u003cli\u003eThey wereinfluenced by Bankim Chandra Chatterjee\u0026rsquo;s Anandmath and the Italian Nationalist Giuseppe Mazzini. The Samiti was led by nationalists such as Aurobindo Ghosh.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44230", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ethe Gandhi-Irwin Pact\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img 1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Buxar :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was fought between the British East India Company and the combined armies of the Nawab of Bengal, the Nawab of Awadh, and the Mughal Emperor.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle took place on October 22\u0026ndash;23, 1764, in northeastern India. The British East India Company was led by Major Hector Munro.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle was a result of the Nawab of Bengal\u0026rsquo;s misuse of trade privileges and the East India Company\u0026rsquo;s colonialist ambitions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe battle resulted in the following:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Mir Qasim, Shuja-Ud-Daula, and Shah Alam-II lost the battle\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Major Hector Munro won a decisive battle\u003c/p\u003e\r\n\r\n\u003cp\u003e3. English became a great power in northern India\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe defeat of Mir Qasim marked the end of the Nawabs\u0026rsquo; rule.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Wandiwash :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was fought between the British and the French in 1760. The battle was part of the Third Carnatic War, which was fought between the British and French colonial empires from 1757 to 1763. The Third Carnatic War was part of the global Seven Years\u0026rsquo; War (1756\u0026ndash;63).\u003c/li\u003e\r\n\t\u003cli\u003eThe British, led by Lieutenant-General Sir Eyre Coote, defeated the French forces under Thomas-Arthur, Comte de Lally, at Vandavasi in the present day Tiruvannamalai district. The battle established British supremacy in India and helped to vanquish the native powers.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle also helped to cut off the vital sea link between the French possessions in India and France. The war concluded with the signing of the Treaty of Paris in 1763.\u003c/li\u003e\r\n\t\u003cli\u003eAs per the treaty, Pondicherry, Karaikal and Mahe were restored to the French under the protection of the English.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Chillianwala :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was fought on January 13, 1849 between the British East India Company (EIC) and the Sikh Empire. The battle was part of the Second Anglo-Sikh War (1848-9) and took place in the Chillianwala region of Punjab, which is now part of Pakistan.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle was bloody and indecisive, with the Sikh army forcing the British to retreat. The British lost several guns and men, which contributed to the loss of British prestige and morale. This loss of prestige is considered to be one of the factors that contributed to the Indian rebellion of 1857.\u003c/li\u003e\r\n\t\u003cli\u003eThe British forces were led by Lord Gough, while the Sikhs were led by Rajah Sher Singh. General Gough\u0026rsquo;s underestimation of the Sikhs, based on previous victories, led to a frontal assault instead of flanking maneuvers.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Kharda : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Battle of Khurla, was fought on March 11, 1795 between the Maratha Empire and the Nizam of Hyderabad. The Marathas won a decisive victory, and the Nizam was forced to cede large amounts of territory and pay a huge indemnity.\u003c/li\u003e\r\n\t\u003cli\u003eThis battle led to the Nizam becoming a British protectorate. The Battle of Kharda was significant because it was the last time the Maratha Confederacy united for a common cause.\u003c/li\u003e\r\n\t\u003cli\u003eThe Marathas and the Nizam had previously fought together against Tipu Sultan of Mysore. The battle took place in the present-day Ahmednagar District of Maharashtra.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44232", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ethe Portuguese\u0026nbsp;\u003c/p\u003e", "option_10": "", "option "\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4, 3, 2, 1\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the correct sequence of the following events?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;1995)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Lucknow Pact\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Introduction of Dyarchy\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Rowlatt Act\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The Partition of Bengal\u003c/p\u003e\r\n\r\n\u003cp\u003eChoose the correct answer from the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Partition of Bengal in 1905 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a territorial reorganization of the Bengal Presidency by the British Raj. The partition separated the largely Muslim eastern areas from the largely Hindu western areas. The partition was announced by Lord Curzon, the Viceroy of India at the time, and came into effect during his viceroyalty.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition left a significant minority of Hindus in East Bengal and Muslims in West Bengal. The Muslims supported the partition because they would have their own province, but the Hindus opposed it.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition marked the start of the Indian National Congress\u0026rsquo; transformation from a middle-class political organization into a wide-ranging growing movement.\u003c/li\u003e\r\n\t\u003cli\u003eThe partition brought the province to the brink of open rebellion. British officials argued that the province\u0026rsquo;s size made it difficult to handle and led to the marginalization of the poorer eastern part.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Lucknow Pact :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was an agreement signed in 1916 between the Indian National Congress and the All India Muslim League. The pact\u0026rsquo;s main goal was to increase the number of Indians in the country\u0026rsquo;s highest decision-making bodies.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe pact\u0026rsquo;s proposals included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Four-fifths of the provincial and central legislatures were to be elected on a broad franchise.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Half the executive council members, including those of the central executive council, were to be Indians elected by the councils themselves.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Religious minorities were to be represented in the provincial legislatures.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. One-third representation was to be given to Muslims in the Central Government.\u003c/p\u003e\r\n\r\n\u003cp\u003e5.\u0026nbsp;Separate electorates for all communities until a joint electorate was demanded by all.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe pact was largely responsible for by Mohammed Ali Jinnah, who was a member of both parties.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Rowlatt Act :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is officially known as the Anarchical and Revolutionary Crimes Act of 1919, was passed by the British government in March 1919.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act gave the British government the power to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Arrest anyone suspected of terrorist activities\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Detain people arrested for up to two years without trial\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Search places without a warrant\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Place severe restrictions on the freedom of the press\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe purpose of the Act was to curb the growing nationalist upsurge in the country. The act was named after Sir Sidney Rowlatt, the chairman of the committee that drafted it.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rowlatt Acts were a set of laws passed in February 1919 by the Imperial Legislative Council, the legislature of British India. The acts were intended to replace the Defence of India Act of 1915, which had been passed during wartime.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rowlatt Act led to nationwide unrest. Mahatma Gandhi called upon the people to perform satyagraha against the act. Rallies were organized in various cities. Workers went on strike in railways. Workshops and shops closed down.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDyarchy :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as diarchy, was a constitutional reform introduced in 1919 for the provinces of British India. It was a system of dual government that divided the powers of the provincial government into two categories:\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp; reserved and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. transferred.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Government of India Act of 1919 introduced dyarchy, which was a two person rule consisting of executivecouncillors and popular ministers. The governor would serve as the province\u0026rsquo;s executive head.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe reserved subjects included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Finance\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Irrigation\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Law and order\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Land revenue\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe transferred subjects included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Local government\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Health,\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Education,\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Excise,\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Industry.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDyarchy was a breakthrough in British Indian government and led to India\u0026rsquo;s full provincial autonomy in 1935 and independence in 1947.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44235", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSatyashodhak Samaj (Truth-seekers\u0026rsquo; Society) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a social reform society founded in 1873 by Jyotiba Phule in Pune, Maharashtra. The society\u0026rsquo;s mission was to improve the lives of Dalits and women through education and increased social and political rights.\u003c/li\u003e\r\n\t\u003cli\u003eThe society\u0026rsquo;s critiques of Brahmanical tradition in Maharashtra led to a peasant based mass movement against the shetji bhatji class of intelligentsia and the moneylender-landlord.\u003c/li\u003e\r\n\t\u003cli\u003eThe society\u0026rsquo;s leadership was made up of members of the lower classes, including malis, telis, wearers of saris, kunbis, and dhangars. Membership of the society was open to all castes, sects, and religions. The society organized a movement for the upliftment of tribals in Bihar, a temple entry movement in Gujarat, an anti-caste movement in Maharashtra, and a peasant movement in Punjab.\u003c/li\u003e\r\n\t\u003cli\u003eLala Lajpat Rai (1865-1928) helped establish the Dayananda Anglo-Vedic School in Lahore in 1886. He also established the National College in Lahore, where Bhagat Singh studied. Lajpat Rai was a committed educationist and a follower of Dayananda Sarasvati, the founder of the conservative Hindu society Arya Samaj.\u003c/li\u003e\r\n\t\u003cli\u003eHe was also a member of the Indian National Congress (INC) and participated in many political agitations in Punjab. In 1920, he was elected President of the Indian National Congress.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1921, he founded the Servants of the People Society, a non-profit welfare organization, in Lahore. Dadabhai Naoroji was a notable member of the Bombay Association, which was founded in 1852 by Jagannath Shankarshet. The Bombay Association was the first political organization in the Bombay Presidency. It was established to express public grievances against the British.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOther notable members of the Bombay Association included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Sir Jamshedji Jejibhai\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Naoroji Fursungi\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Vinayak Shankarshet\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Dr Bhau Daji Lad\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Bombay Presidency was a former province of British India that included much of western and central India, as well as parts of Pakistan and the Arabian Peninsula.\u003c/li\u003e\r\n\t\u003cli\u003eThe 39 Satyagraha Ashram was established in Wardha, Maharashtra in 1921 by Acharya Vinoba Bhave, a twentieth century sage.\u003c/li\u003e\r\n\t\u003cli\u003eThe ashram is now called the Mahila Ashram. In the 1920s, Acharya Vinoba Bhave set up a branch of the Satyagraha Ashram at Wardha at the request of Shri Jamanalal Bajaj.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "418", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44238", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/st c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Non-Cooperation Movement (1920) led to the growth of Hindu-Muslim unity. The movement also helped other social groups, such as students, peasants, women, and middle-class people.\u003c/li\u003e\r\n\t\u003cli\u003eThe Non-Cooperation Movement was a reaction to the British Indian government\u0026rsquo;s oppressive policies, such as the Rowlatt Act of 18 March 1919 and the Jallianwala Bagh of 13 April 1919. The movement saw participation from both Hindus and Muslims, showcasing communal harmony in the country.\u003c/li\u003e\r\n\t\u003cli\u003eThe Non-Cooperation Movement also established the popularity of the Congress Party among the people. As a result of this movement, people became conscious of their political rights.\u003c/li\u003e\r\n\t\u003cli\u003eThe Non-Cooperation Movement, launched by Mahatma Gandhi in 1921, is said to have removed fear of the British from the minds of the people. The Non-Cooperation Movement was a nonviolent political campaign that aimed to persuade the British government to grant self-governance, or swaraj, to India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement\u0026rsquo;s actions included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Indians resigning their titles\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Boycotting government institutions\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Refusing to pay taxes\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Boycotting British Institutes and commodities like government schools, government offices, courts and foreign goods\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe movement was called off in February 1922 after the Chauri Chaura incident in Uttar Pradesh.\u003c/li\u003e\r\n\t\u003cli\u003eOn February 5, 1922, a protest turned violent when protesting people set fire a police station, burning 22 policemen alive.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subje
