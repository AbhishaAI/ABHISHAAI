function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

ainst Viceroy Lord Linlithgow\u0026rsquo;s decision to involve India in World War II without the consent of the Indian people.\u003c/li\u003e\r\n\t\u003cli\u003eThe Congress ministries resigned in October and November 1939.\u003c/li\u003e\r\n\t\u003cli\u003eOn December 22, 1939, the Muslim League observed \u0026ldquo;Day of Deliverance\u0026rdquo; in protest of the Viceroy\u0026rsquo;s decision.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIn 1940, Viceroy Linlithgow made the August Offer, which included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Expanding the Executive Council of the Viceroy of India to include more Indians\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Establishing an advisory war council\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Giving full weight to minority opinion\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Recognizing Indians\u0026rsquo; right to frame their own constitution\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44407", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMotilal Nehru\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img d;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Wavell Plan, also known as the Shimla Conference, proposed the reconstitution of the Viceroy\u0026rsquo;s Executive Council in 1945. The plan suggested that all members of the Viceroy\u0026rsquo;s Executive Council, except the Viceroy and the Commander-in-Chief, would be Indians.\u003c/li\u003e\r\n\t\u003cli\u003eThe plan also suggested that all portfolios, including that of War Members, would be held by Indian leaders. The Simla conference was held in 1945 under the presidency of Lord Wavell and Indian political leaders.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Simon Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Indian Statutory Commission, was a group of seven British Parliament members who studied constitutional reform in India in 1927. The commission was appointed by the British Conservative government in November 1927 to report on the working of the Indian constitution. The commission\u0026rsquo;s chairman was Sir John Simon.\u003c/li\u003e\r\n\t\u003cli\u003eThe Simon Commission\u0026rsquo;s recommendations included giving more autonomy to Indian provincial governments, but keeping a veto for the Viceroy. The Simon Report was important in the constitutional discussion that led to the Government of India Act of 1935.\u003c/li\u003e\r\n\t\u003cli\u003eThe commission was boycotted by Indians because all its members were Englishmen and the commission had no Indian member. The slogan \u0026ldquo;Simon Go Back\u0026rdquo; became one of the most enduring slogans of the Indian freedom struggle.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Cripps Mission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a meeting between British government representatives and Indian leaders that took place from March 22 to April 11, 1942. The mission\u0026rsquo;s purpose was to secure Indian cooperation and support for the British war efforts in World War II. The mission\u0026rsquo;s proposals were constitutional and sought Indian support.\u003c/li\u003e\r\n\t\u003cli\u003eThe mission was organized by Sir Richard Stafford Cripps, a member of the War Cabinet.\u003c/li\u003e\r\n\t\u003cli\u003eThe mission failed and the issue of India\u0026rsquo;s constitution was postponed until the end of the war. The mission\u0026rsquo;s failure led to the Quit India Movement, a countrywide strike wave that involved workers, peasants, and states\u0026rsquo; peoples.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe mission\u0026rsquo;s proposals included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Establishing the Indian Union\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Allowing India to participate in international bodies and the United Nations\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Constituent Assembly would have members nominated by the Provincial Assemblies as well as the Princely States\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Any Province, which is not prepared to accept the new Constitution would have the right to sign a separate agreement with Britain regarding its future status\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Muslim League criticized the idea of a single Indian Union. They also stated that the proposals denied the Muslims the right to self-determination and the creation of Pakistan.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Cabinet Mission Plan :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a proposal put forward by the British Cabinet Mission in 1946 to address the issue of Indian independence. It recommended the creation of a united India with a federal structure, granting significant autonomy to provinces, while ensuring protections for minorities. However, it failed to gain acceptance from Indian political leaders and ultimately led to the partition of India and the creation of Pakistan.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44410", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLala Hardayal\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRashbehari Bose\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\ ces should be abolished and ministers should be made responsible to the provincial legislatures in all departments, including the department of law and order.\u003c/li\u003e\r\n\t\u003cli\u003eThe Governor was to retain the special powers for the safety and tranquility of the province and for the protection of the minorities.\u003c/li\u003e\r\n\t\u003cli\u003eHe would also have full powers of intervention in the event of a breakdown of the constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe Franchise was to be extended and legislatures were to be enlarged.\u003c/li\u003e\r\n\t\u003cli\u003eAt the center, a Federal assembly would be constituted on the basis of representation of the provinces and other areas as per the population.\u003c/li\u003e\r\n\t\u003cli\u003eThe council of state would continue as the Upper House but its members would be chosen not on the basis of the direct election but on the basis of indirect election by the Provincial councils.\u003c/li\u003e\r\n\t\u003cli\u003eNo change in the central executive.\u003c/li\u003e\r\n\t\u003cli\u003eThe All-India Federation was not considered a practical idea for immediate execution.\u003c/li\u003e\r\n\t\u003cli\u003eBurma should be separated from British India and should be provided a constitution of its own.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44429", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/s 6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements:\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2010)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Dr. Rajendra Prasad persuaded Mahatma Gandhi to come to Champaran to investigate the problem of peasants.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Acharya J. B. Kripalani was one of Mahatma Gandhi\u0026rsquo;s colleagues in his Champaran investigation.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe statement \u0026ldquo;Dr. Rajendra Prasad persuaded Mahatma Gandhi to come to Champaran to investigate the problem of peasants\u0026rdquo; is incorrect. In fact, Raj Kumar Shukla, a local farmer and indigo cultivator, convinced Gandhi to visit Champaran in 1917.\u003c/li\u003e\r\n\t\u003cli\u003eShukla invited Gandhi to Champaran to investigate the problems faced by the peasants and to begin a satyagraha movement. Gandhi\u0026rsquo;s colleagues in this movement included JB Kriplani, Rajendra Prasad, Mazhar-ulHaq, Mahadeo Desai, and Narhari Parekh.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1914 and 1916, farmers revolted against the government in indigo plant cultivation. The Champaran Satyagraha of 1917 was an important event in the Indian freedom struggle. It marked Gandhi\u0026rsquo;s first appearance in Indian politics as a leader of the masses.\u003c/li\u003e\r\n\t\u003cli\u003eAcharya J.B. Kripalani was a colleague of Mahatma Gandhi during the Champaran investigation. Kripalani was a prominent Indian educator, social activist, and politician who supported Gandhi\u0026rsquo;s ideology. The two met in Santiniketan after Gandhi\u0026rsquo;s return from South Africa.\u003c/li\u003e\r\n\t\u003cli\u003eKripalani was one of many fellow nationalists who supported and worked with Gandhi during the Champaran Satyagraha. Gandhi arrived in Champaran on April 10, 1917 with a team of lawyers, including Kripalani. The Lieutenant Governor in Council convened a Committee of Inquiry to investigate the agrarian situation in Champaran, and Gandhi was named as a member\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44436", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{ov 0% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe most common factor for tribal insurrection in India in the 19th century was the disruption of the old agrarian order of the tribal communities.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some other factors that contributed to tribal uprisings in the 19th century: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Land laws : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British land settlements and land laws created tensions in the tribal society.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Forest laws : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British enforcement of the Forest Act disrupted the way of life of tribal communities.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Agriculture :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe loss of agricultural land by the tribals, restrictions on the use of forest produce, and the introduction of money lenders contributed to tribal revolts.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Economy : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe fast changes made by the Britishers in the economy, government, and land revenue structure caused the agricultural society to be disrupted.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Non-tribals :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eNon-tribals had started entering forests and clearing land for settled agriculture, disturbing the lives of tribal communities.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Protection of traditions : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAnother major reason for tribal uprisings during colonial British rule was the protection of their traditions and customs.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44441", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat was the reason for Mahatma Gandhi to organise a satyagraha on behalf of the peasants of Kheda? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Administration did not suspend the land revenue collection in spite of a drought.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Administration proposed to introduce Permanent Settlement in Gujarat.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMahatma Gandhi organized a satyagraha in 1918 in the Kheda district of Gujarat to support peasants who were unable to pay land taxes due to crop failure and poverty.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe peasants were unable to pay the taxes because of:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Excessive taxes\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A plague outbreak that made them unable to work\u003c/p\u003e\r\n\r\n\u003cp\u003e3. A severe drought that led to crop failures\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Widespread distress among peasant communities\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSatyagraha is a form of nonviolent resistance or civil resistance that means \u0026ldquo;holding firmly to truth\u0026rdquo; or \u0026ldquo;truth force\u0026rdquo;. Gandhi developed the term and practiced it in the Indian independence movement and in his earlier struggles in South Africa for Indian rights.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Permanent Settlement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Permanent Settlement of Bengal, was an agreement between the East India Company and the landlords of Bengal in 1793. The agreement was part of the Cornwallis Code, a larger body of legislation that divided the East India Company\u0026rsquo;s service personnel into three branches.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Permanent Settlement had several features:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The agreement established a fixed amount of revenue to be collected from land.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The agreement stated that the amount to be given to the government was fixed permanently.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The agreement gave zamindars the power to collect revenue.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The agreement recognized zamindars as the permanent owners of the land.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. The agreement instructed zamindars to pay 89% of the annual revenue to the state and keep 11% as their share.\u003c/p\u003e\r\n\r\n\u003cp\u003e6. The agreement encouraged zamindars to invest in improving lands.\u003c/p\u003e\r\n\r\n\u003cp\u003e7. The agreement created an Indian landed class that supported British authority.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Permanent Settlement was first enacted in Bengal, Bihar, and Odisha in 1793 by the Governor-General Lord Cornwallis. It was later followed in the presidency of northern Madras and in the Varanasi district. The regulations remained in place until the Charter Act of 1833.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44442", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u0 , "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the period of Indian freedom struggle, which of the following was/were recommended by the Nehru report?\u0026nbsp; \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Complete Independence for India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Joint electorates for reservation of seats for minorities\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Provision of fundamental right for the people of India in the constitution.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Nehru Report, published in 1928, recommended a number of things, including: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Dominion status:\u003c/strong\u003e For India, similar to Canada and Australia\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Bill of Rights: \u003c/strong\u003eA strong bill that would guarantee freedom of speech, press, religion, and assembly\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Federal system: \u003c/strong\u003eA federal system of government with residuary powers at the center\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Joint electorates:\u003c/strong\u003e With reserved seats for minorities in legislatures\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. No state religion.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Equal rights: \u003c/strong\u003eFor men and women as citizens\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Reservations:\u003c/strong\u003e For minority seats, es pecially for Muslims and other mi norities\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e8. Official language: \u003c/strong\u003eIndian, written in Devanagari (Hindi/Sanskrit), Tamil, Kannada, Marathi, Telugu, Bengali, or Gujarati\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e9. Supreme Court: \u003c/strong\u003eThe establishment of a Supreme Court\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e10. Provinces: \u003c/strong\u003eDivided according to lan guage\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e11. English usage: \u003c/strong\u003eAuthorized\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Nehru Report was a response to a British challenge to create their own constitution. It was prepared by a committee of All Parties Conference, chaired by Motilal Nehru and with Jawaharlal Nehru as its secretary.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44443", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u ution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eUsha Mehta (1920-2000) was an Indian freedom fighter and Gandhian who is known for organizing the Congress Radio, also known as the Secret Congress Radio.\u003c/li\u003e\r\n\t\u003cli\u003eOn August 14, 1942, Mehta and some of her associates began the clandestine radio station, which went on air on August 27, 1942. The station was a vital communication tool during the Quit India movement, a key phase of the Indian independence struggle. The station\u0026rsquo;s messages included messages to students, workers, peasants, and Indian soldiers, directing them to participate in the Quit India Movement. The station also preached internationalism and spread the message of the Indian movement beyond the country.\u003c/li\u003e\r\n\t\u003cli\u003eMehta was born on March 25, 1920 in the village of Saras, near Surat in Gujarat. She was fluent in four languages, including English, Gujarati, Hindi, and Marathi. She adopted a Gandhian lifestyle by wearing only Khadi clothes and shunning luxuries.\u003c/li\u003e\r\n\t\u003cli\u003eSarojini Naidu represented Indian women at the Second Round Table Conference, which was held in London from September 7, 1931 to December 1, 1931. Naidu was a follower of Mahatma Gandhi and a participant in the national movement.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOther participants at the conference included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Muslims: \u003c/strong\u003eMd. Ali Jinnah, Aga Khan III, Muhammad Iqbal\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Hi s to cultivate the land and required lands to be surveyed and assessed before being taxed. The system was used in some parts of British India to collect revenue from cultivators.\u003c/li\u003e\r\n\t\u003cli\u003eIn the Ryotwari system, the government dealt directly with the cultivators, known as ryots, for revenue collection. The ryots were peasant cultivators who paid rent directly to the government. The land was taxed at a rate of 50% in dryland and 60% in wetland.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44446", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eNaoroji was an Indian nationalist and critic of British economic policy in India. Heput forward the drain theory in his book Poverty and UnBritish Rule in India.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44447", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u uestion_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBritish got Diwani\u0026rsquo;s rights of Bengal, Bihar, and Orissa in 1765.\u003c/li\u003e\r\n\t\u003cli\u003eThe major aim of the British East India Company was to increase their land revenue collection.\u003c/li\u003e\r\n\t\u003cli\u003eSo its policies were aimed at getting maximum income from land without caring of its consequences on cultivators and peasants.\u003c/li\u003e\r\n\t\u003cli\u003eThree major systems of land revenue collection existed in India - Zamindari, Ryotwari and Mahalwari\u003c/li\u003e\r\n\t\u003cli\u003eIt was the first battle of Panipat, 1526, that the Mughal Emperor Babur first used the artillery in North India - when he decisively defeated Ibrahim Lodi, the Afghan kings of Delhi.\u003c/li\u003e\r\n\t\u003cli\u003eAlthough the Mughal Emperor Babur is popularly credited with the introduction of the artillery in land warfare in India, evidence is now available that it was the Bahmani Kings who first used artillery in the Deccan in their wars against the Vijaynagar kingdom.\u003c/li\u003e\r\n\t\u003cli\u003eTobacco and Red Chillies were introduced by Portuguese not British\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44448", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_li 3e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following is/are the principal feature(s) of the Government of India Act, 1919? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Introduction of diarchy in the executive government of the provinces.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Introduction of separate communal electorates for Muslims.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Devolution of legislative authority by the centre to the provinces.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Government of India Act of 1919 introduced dyarchy, a system of dual government, for the provinces of British India. Dyarchy is a two-person rule consisting of executive councillors and popular ministers. The governor would serve as the province\u0026rsquo;s executive head.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act divided subjects into two categories:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. reserved and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. transferred.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eReserved subjects included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003ei) Finance\u003c/p\u003e\r\n\r\n\u003cp\u003eii) Irrigation\u003c/p\u003e\r\n\r\n\u003cp\u003eiii) Law and order\u003c/p\u003e\r\n\r\n\u003cp\u003eiv) Land revenue\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;Transferred subjects included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003ei) Local government\u003c/p\u003e\r\n\r\n\u003cp\u003eii) Health\u003c/p\u003e\r\n\r\n\u003cp\u003eiii) Education\u003c/p\u003e\r\n\r\n\u003cp\u003eiv) Excise\u003c/p\u003e\r\n\r\n\u003cp\u003ev) Industry.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe act also introduced bicameralism and direct election for the first time in India. It provided for the establishment of a public service commission which was set up in 1926.\u003c/li\u003e\r\n\t\u003cli\u003eThe Government of India Act, 1919 (GIAA) is a document that provides for the devolution of legislative authority from the central government to the provinces.\u003c/li\u003e\r\n\t\u003cli\u003eThe GIAA also expands the powers and responsibilities of the central and provincial legislatures.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe GIAA\u0026rsquo;s main features include: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Devolution of legislative authority :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe GIAA provides for the devolution of some legislative authority from the central government to the provincial governments. Separation of central and provincial subjects\u003c/li\u003e\r\n\t\u003cli\u003eThe GIAA loosens central control over the provinces by separating and demarcating the central and provincial subjects.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Expansion of legislatures :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe GIAA expands and reconstitutes both the Central and Provincial legislatures, giving them more powers and responsibilities.\u003c/li\u003e\r\n\t\u003cli\u003eThe GIAA also prohibits judicial review.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian Councils Act of 1909, also known as the Morley-Minto Reforms, introduced separate electorates for Muslims. Under this act, Muslim members were to be elected only by Muslim voters. The act is considered to have \u0026ldquo;legalized communalism\u0026rdquo; by introducing electorates based solely on religion.\u003c/li\u003e\r\n\t\u003cli\u003eThe separate electorate was extended to Sikhs, Indian Christians, Anglo-Indians, and Europeans by the Government of India Act of 1919.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44449", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wr 10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe distribution of powers between the Centre and the States in the Indian Constitution is based on the scheme provided in the..............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe distribution of powers between the center and the states in the Indian Constitution is based on the Government of India Act, 1935. The act is a detailed document with 321 sections and 10 schedules. The distribution of legislative powers is based on three lists under the Seventh Schedule.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003cstrong\u003eThe act also provides for a three-fold enumeration:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. federal\u003c/p\u003e\r\n\r\n\u003cp\u003e2. provincial\u0026nbsp;and\u003c/p\u003e\r\n\r\n\u003cp\u003e3. concurrent.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHowever, under the act, residuary powers are given to the governor-general of India, not the federal or provincial legislature.\u003c/li\u003e\r\n\t\u003cli\u003eThe Constitution of India was adopted by the Constituent Assembly on November 26, 1949 and came into force on January 26, 1950.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44450", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDifferent social reform groups or organizations of the Bengal region united to form a single body to discuss the issues of larger interest and to prepare appropriate petitions/ representations to the government.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndian National Congress did not want to include social reforms in its deliberations and decided to form a separate body for such a purpose.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBehramji Malabari and M.G. Ranade decided to bring together all the social reform groups of the country under one organization.\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone of the statements (a), (b) and (c) given above is correct in this context.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDuring the Indian freedom struggle, the National Social Conference was formed. What was the reason for its formation? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe National Social Conference was founded by M.G. Ranade and Raghunath Rao in December 1887. The conference was a social reform cell of the Indian National Congress, and met annually at the same time and place as the Congress.\u003c/li\u003e\r\n\t\u003cli\u003eThe conference\u0026rsquo;s first session was held in Madras in December 1887. The conference advocated for intercaste marriages and opposed kulinism and polygamy. It also launched the \u0026ldquo;Pledge Movement\u0026rdquo; to encourage people to prohibit child marriage.\u003c/li\u003e\r\n\t\u003cli\u003eThe conference\u0026rsquo;s purpose was to promote the discussion of social issues on a national scale. However, the conference\u0026rsquo;s reason for existence disappeared when the Congress appropriated much of its program and was led by a more capable and popular leader.\u003c/li\u003e\r\n\t\u003cli\u003eRanade was an Indian scholar, social reformer, judge, and author. He has been referred to as the \u0026ldquo;Father of Indian Economics\u0026rdquo; because of his unsuccessful efforts to persuade the British government to launch state welfare and industrialization programs.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44451", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"t tyle\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSuppression of the Khilafat Movement.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eImposition of restrictions on freedom of the press.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Rowlatt Act aimed at..............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Rowlatt Act was passed by the British government in March 1919 to limit the fundamental rights of Indian citizens and suppress political activities. The act gave the police the power to arrest anyone without cause.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rowlatt Act was met with opposition from Indians, who saw it as undemocratic and oppressive. The act also strengthened police powers and limited freedom of expression.\u003c/li\u003e\r\n\t\u003cli\u003eMahatma Gandhi called for a non-violent Satyagraha against the act, which began on April 6, 1919.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Khilafat Movement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a political campaign that ran from 1919\u0026ndash;1924. It was a pan-Islamic movement led by Indian Muslims to pressure the British government to preserve the Ottoman Sultan\u0026rsquo;s authority as Caliph of Islam. The movement\u0026rsquo;s goal was to save the Ottoman caliph as a symbol of unity among the Muslim community in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement was initially supported by Gandhi\u0026rsquo;s noncooperation movement. However, it fell apart after the abolition of the caliphate in 1924. The movement was abruptly called off on February 12, 1922, at Gandhiji\u0026rsquo;s insistence, proceeding with the news of the Chauri Chaura incident.\u003c/li\u003e\r\n\t\u003cli\u003eThe term \u0026ldquo;caliph\u0026rdquo; (khalifah in Arabic) is generally regarded to mean \u0026ldquo;successor of the prophet Muhammad,\u0026rdquo; while \u0026ldquo;caliphate\u0026rdquo; (khilafah in Arabic) denotes the office of the political leader of the Muslim community (ummah) or state.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Vernacular Press Act :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a law passed in 1878 in British India to limit the freedom of the Indian-language press. The act was also known as \u0026ldquo;The Gagging Act\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe act was proposed by Lord Lytton, who was the viceroy of India from 1876 1880. The act was intended to prevent the vernacular press from criticizing British policies, especially the opposition that grew during the Second Anglo-Afghan War (1878\u0026ndash;1880). The act did not apply to English-language publications.\u003c/li\u003e\r\n\t\u003cli\u003eThe act was modeled on the Irish Press laws and gave the government the power to censor reports and editorials in the Vernacular Press. The act also allowed the British government to confiscate newspaper assets, including printing presses and other media.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act violated freedom of expression in the following ways: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Censorship :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe government had the power to censor reports and editorials in the Vernacular Press.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Seizure :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIf a newspaper published a seditious report and did not heed an initial warning, the press was seized and the printing machinery confiscated.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44453", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} im  by Besant on the lines of the Irish Home Rule movement. The league focused its activities in Maharashtra, Karnataka, Central Province, and Berar, excluding Bombay. Joseph Baptista served as the President and N.C. Kelkar was appointed as the secretary of the movement.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement\u0026rsquo;s signature achievement was the Montague Declaration of 1917, which recognized the inclusion of more Indians in the government and the development of self-governing institutions.\u003c/li\u003e\r\n\t\u003cli\u003eThe Theosophical Society was founded in 1875 by Helena Petrovna Blavatsky, Henry Steel Olcott, William Quan Judge, and 16 others in New York City. The society\u0026rsquo;s headquarters were established in 1882 in Adyar, India, near Madras (now Chennai).\u003c/li\u003e\r\n\t\u003cli\u003eThe society\u0026rsquo;s main objectives were to promote the study of ancient religions and philosophies, and to form a universal brotherhood of man without distinction of race, color, or creed.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44462", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDirectly elected by the people of those Provinces\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003c "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eQueen Victoria\u0026rsquo;s Proclamation of 1858 had several objectives, including: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eEnd the East India Company\u0026rsquo;s rule :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe proclamation declared that India would be governed by the British Monarch, not the East India Company.\u003c/li\u003e\r\n\t\u003cli\u003eTransfer power to the British crown\u003c/li\u003e\r\n\t\u003cli\u003eThe proclamation aimed to end the company\u0026rsquo;s rule and transfer all powers to the British crown.\u003c/li\u003e\r\n\t\u003cli\u003ePlace the Indian administration under the British Crown\u003c/li\u003e\r\n\t\u003cli\u003eThe proclamation gave Queen Victoria control over India\u0026rsquo;s administration, including social and economic aspects.\u003c/li\u003e\r\n\t\u003cli\u003eDisclaim any intention to annex Indian States\u003c/li\u003e\r\n\t\u003cli\u003eThe proclamation reversed Lord Dalhousie\u0026rsquo;s pre-war policy of political unification through princely state annexation.\u003c/li\u003e\r\n\t\u003cli\u003eEnsure no further extension of territories in India\u003c/li\u003e\r\n\t\u003cli\u003eThe proclamation assured that there would be no further extension of territories in India.\u003c/li\u003e\r\n\t\u003cli\u003eGrant the same status to the Natives of India as the British people\u003c/li\u003e\r\n\t\u003cli\u003eThe proclamation focused on removing societal issues like racial discrimination.\u003c/li\u003e\r\n\t\u003cli\u003eAssure that the administration would not interfere in religious affairs\u003c/li\u003e\r\n\t\u003cli\u003eThe proclamation ensured that the administration would not interfere in religious affairs.\u003c/li\u003e\r\n\t\u003cli\u003eThe proclamation was a result of the Revolt of 1857, which is also known as India\u0026rsquo;s First War of Independence.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44464", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe First World War when Indian troops were needed by the British and the partition was ended.\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKing George V abrogated Curzon\u0026rsquo;s Act as the Royal Durbar in Delhi in 1911\u003c/p\u olution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Radcliffe Commission was established in June 1947 to demarcate the boundaries between India and Pakistan. The commission was formally known as the \u0026ldquo;Boundary Commission for the Partition of Bengal and Punjab\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003ePrior to independence, it was agreed to divide India into two parts, one for Hindus and the other for Muslims.\u003c/li\u003e\r\n\t\u003cli\u003ePakistan was given the provinces of Sindh and Baluchistan, both of which have a large Muslim population (over 70% and 90%, respectively).\u003c/li\u003e\r\n\t\u003cli\u003eThe provinces of Punjab and Bengal, on the other hand, had only a slight majority of Muslims, Even though Muhammad Ali Jinnah wanted these provinces to become part of Pakistan in their entirety, the Congress Party refused due to Hindu and Sikh sentiments.\u003c/li\u003e\r\n\t\u003cli\u003eThe Radcliffe Line, which divided India and Pakistan, was unveiled on August 17, 1947.\u003c/li\u003e\r\n\t\u003cli\u003eThe Radcliffe line runs from the Rann of Kutch in Gujarat to the international border in Jammu \u0026amp; Kashmir, separating India and Pakistan.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;India was divided into three sections by Radcliffe:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. West Pakistan\u003c/p\u003e\r\n\r\n\u003cp\u003e2. East Pakistan\u0026nbsp;and\u003c/p\u003e\r\n\r\n\u003cp\u003e3. India.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn June 1947, Sir Cyril Radcliffe was appointed Chairman of the two Border Commissions (one for Bengal and the other for Punjab).\u003c/li\u003e\r\n\t\u003cli\u003eThe commission was chaired by British lawyer Sir Cyril Radcliffe, who drew the Radcliffe Line based on religious demographics and geographical factors. The Radcliffe Line was revealed on August 17, 1947, and extends from the Rann of Kutch in Gujarat to the international border in Jammu in Jammu \u0026amp; Kashmir\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44468", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\
