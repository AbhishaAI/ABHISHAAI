ion_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Government of India Act of 1919 clearly defined..............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British Government declared for the first time on August 20, 1917, that its objective was the gradual introduction of responsible Government in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Government of India Act of 1919 was enacted, which came into force in 1921.\u003c/li\u003e\r\n\t\u003cli\u003eThis Act is also known as Montagu- Chelmsford Reforms (Montagu was the Secretary of State for India and Lord Chelmsford was the Viceroy of India).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe features of this Act were as follows:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt relaxed the central control over the provinces by demarcating and separating the central and provincial subjects.\u003c/li\u003e\r\n\t\u003cli\u003eThe central and provincial legislatures were authorized to make laws on their respective list of subjects.\u003c/li\u003e\r\n\t\u003cli\u003eThe structure of the government continued to be centralized and unitary.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eIt further divided the provincial subjects into two parts\u0026ndash;\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e1. transferred and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. reserved.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe transferred subjects were to be administered by the Governor with the aid of Ministers responsible to the legislative council.\u003c/li\u003e\r\n\t\u003cli\u003eThe reserved subjects were to be administered by the Governor and his executive council without being responsible to the legislative council.\u003c/li\u003e\r\n\t\u003cli\u003eThis dual scheme of governance was known as \u0026lsquo;dyarchy\u0026rsquo;\u0026ndash;a term derived from the Greek word diarche which means the double rule.\u003c/li\u003e\r\n\t\u003cli\u003eIt introduced, for the f irst time, bicameralism and direct elections in the country. The Indian legislative council was replaced by a bicameral legislature consisting of an Upper House (Council of State) and a Lower House (Legislative Assembly).\u003c/li\u003e\r\n\t\u003cli\u003eThe majority of members of both the Houses were chosen by direct election. It granted franchises to a limited number of people based on property, tax, or education.\u003c/li\u003e\r\n\t\u003cli\u003eIt required that the three of the six members of the Viceroy\u0026rsquo;s Executive Council (other than the Commander-in-Chief) were to be Indian.\u003c/li\u003e\r\n\t\u003cli\u003eIt extended the principle of communal representation by providing separate electorates for Sikhs, Indian Christians, Anglo-Indians, and Europeans.\u003c/li\u003e\r\n\t\u003cli\u003eIt created a new office of the High Commissioner for India in London and transferred to him some of the functions hitherto performed by the Secretary of State for India.\u003c/li\u003e\r\n\t\u003cli\u003eIt provided for the establishment of a public service commission.\u003c/li\u003e\r\n\t\u003cli\u003eHence, a Central Public Service Commission was set up in 1926 for recruiting civil servants. It separated, for the first time, provincial budgets from the Central budget and authorized the provincial legislatures to enact their budgets.\u003c/li\u003e\r\n\t\u003cli\u003eIt provided for the appointment of a statutory commission to inquire into and report on its working after ten years of its coming into force.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44470", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSwadeshi Movement\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"tex set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Cabinet Mission of 1946 recommended a federal government for India. The mission proposed a federal structure with a weak center and strong provinces to accommodate the diverse interests of India\u0026rsquo;s communities. The central government would have limited powers, and the rest would be given to the provincial governments.\u003c/li\u003e\r\n\t\u003cli\u003eThe Cabinet Mission also proposed a Constituent Assembly made up of representatives from the Provincial Assemblies and the Princely states. Each province would be given a number of seats based on its population.\u003c/li\u003e\r\n\t\u003cli\u003eA federal government disperses power among state and local governments and gives citizens more opportunities to participate in government. Some argue that a federal system is more administratively efficient than highly centralized governments.\u003c/li\u003e\r\n\t\u003cli\u003eThe Cabinet Mission did not address the issue of enlarging the powers of Indian courts.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, it did propose a constitutional framework for the formation of a constituent assembly, which would have the power to draft a constitution for an independent India\u003c/li\u003e\r\n\t\u003cli\u003eThe Cabinet Mission proposed that the Indian Civil Service (ICS) should be Indianized gradually over a period of ten years.\u003c/li\u003e\r\n\t\u003cli\u003eThe proposal was to increase the number of Indians in the ICS to 50% in 10 years.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", :100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSatya Shodhak Samaj organized..............\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;2016)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Satya Shodhak Samaj (Truth Seekers\u0026rsquo; Society) was a social reform society founded in 1873 by Jyotirao Phule. The organization\u0026rsquo;s goal was to liberate the lower castes from oppression and exploitation. The movement aimed to eradicate caste based discrimination and promote social equality.\u003c/li\u003e\r\n\t\u003cli\u003eThe organization\u0026rsquo;s leadership consisted of members of the lower classes, including malis, telis, wearers of saris, kunbis, and dhangars. The movement sought to create social awareness and promote the ideas of equality, liberty, and fraternity.\u003c/li\u003e\r\n\t\u003cli\u003eThe upper-caste leaders of Maharashtra disliked the Samaj\u0026rsquo;s friendly relations with Christian missionaries and its appeals to the British Raj.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAnti-Caste Movement in Maharashtra:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Satya Shodhak Samaj launched an anti-caste movement in Maharashtra to combat the social evils of casteism and untouchability.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement aimed to create social awareness among the masses and to promote the idea of equality, liberty, and fraternity.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement challenged the Brahminical hegemony and criticized the caste system, which had kept the lower castes in a state of subjugation for centuries.\u003c/li\u003e\r\n\t\u003cli\u003eIt advocated inter-caste marriages and the abolition of the caste system.\u003c/li\u003e\r\n\t\u003cli\u003eJyotirao Phule, the founder of the movement, emphasized the need for education and economic empowerment of the lower castes.\u003c/li\u003e\r\n\t\u003cli\u003eHe established schools and educational institutions for the education of Dalits and other marginalize communities.\u003c/li\u003e\r\n\t\u003cli\u003eHe also encouraged them to take up vocational training and learn new skills to improve their economic condition.\u003c/li\u003e\r\n\t\u003cli\u003eSatya Shodhak Samaj played a pivotal role in the social reform movement in Maharashtra and inspired many other social reformers like B.R. Ambedkar, who later became the architect of the Indian Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eSatya Shodhak Samaj was a significant social reform movement that contributed to the upliftment of the oppressed and marginalized sections of society.\u003c/li\u003e\r\n\t\u003cli\u003eThe anti-caste movement launched by the Samaj in Maharashtra challenged the caste system and advocated social equality and justice.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement had a profound impact on the social and political landscape of India and played a crucial role in the struggle for independence and social justice.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44478", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} 003cli\u003eIn 1942, Stafford Cripps, a member of the British War Cabinet, was sent to India to gain support from political leaders during World War II. The Cripps Mission\u0026rsquo;s plan was to grant India Dominion status after the war, which would have given India the same status as Canada, Australia, and New Zealand.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe plan also proposed:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A new Indian Union with Dominion status\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Equal treatment to Indians after the war\u003c/p\u003e\r\n\r\n\u003cp\u003e3. A Constitution-making body for India\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The British monarch as the head of state\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Cripps Plan was a compromise between the Indian National Congress\u0026rsquo;s demands for complete independence and the British desire to retain some control over India. The Congress was not convinced with the Cripps Proposals\u0026rsquo; promise of awarding India with a dominion status or allowing India to attain self-governance.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44482", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u0 03e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2017)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Factories Act, 1881 was passed with a view to fix the wages of industrial workers and to allow the workers to form trade unions.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. N. M. Lokhande was a pioneer in organizing the labour movement in British India.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above statements is/are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Factories Act, 1881 was passed to regulate working conditions in factories, ensure the health and safety of workers, and fix the working hours of women and children. The act did not mention fixed wages or the formation of trade unions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act\u0026rsquo;s other provisions include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. One hour of rest during working hours\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Fencing of dangerous machinery\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Prohibition of employment of children under seven years\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Reduced working hours for children below 12 years\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Four days leave in a month\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Working hours restricted to 9 hours per day for children\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Children under 18 must not work at night (i.e. after 8:30 p.m. and before 5:30 a.m.)\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Children (ages 9\u0026ndash;12) are limited to 48 hours per week\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Factories Act, 1881 was passed by the Governor General of India in Council on March 15, 1881.\u003c/li\u003e\r\n\t\u003cli\u003eNarayan Meghaji Lokhande (1848-1897) is known as the pioneer of the labor movement in India. He is also known as the \u0026ldquo;Father of the Trade Union Movement in India\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1890, Lokhande founded the Bombay Mill Hands Association, the first trade union in India. The association was created to improve the working conditions of mill workers in Bombay, who were often exploited by their employers. Lokhande is also known for his initiatives on caste and communal issues.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44485", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDivision of the central Legislature into two houses.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !import 3e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Butler Committee of 1927, also known as the Indian States Committee, was appointed to investigate and clarify the relationship between the British Raj and the rulers of Princely States. The committee\u0026rsquo;s main objective was to improve the relationship between the Government of India and the Indian States. The committee submitted its report in 1929.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian leaders felt that the British Government of India was not doing enough to protect the interests of the Indian States and that the relationship between the two was strained.\u003c/li\u003e\r\n\t\u003cli\u003eThe committee was chaired by Sir Harcourt Butler, a former Governor of the United Provinces, and included members from both India and Britain.\u003c/li\u003e\r\n\t\u003cli\u003eThe committee submitted its report in 1928, which recommended a number of changes to improve the relationship between the British Government of India and the Indian States.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Some of the recommendations made by the Butler Committee were: The creation of a new department to deal with the affairs of the Indian States.\u003c/li\u003e\r\n\t\u003cli\u003eThe appointment of a Commissioner for Indian States to oversee the relationship between the British Government of India and the Indian States.\u003c/li\u003e\r\n\t\u003cli\u003eThe establishment of a council of Indian princes to advise the British Government of India on matters relating to the Indian States.\u003c/li\u003e\r\n\t\u003cli\u003eThe granting of more autonomy to the Indian States in matters such as education, health, and public works.\u003c/li\u003e\r\n\t\u003cli\u003eOverall, the Butler Committee\u0026rsquo;s recommendations were aimed at improving the relationship between the British Government of India and the Indian States and giving the Indian States more autonomy in their affairs.\u003c/li\u003e\r\n\t\u003cli\u003eThe committee\u0026rsquo;s recommendations were implemented in the Government of India Act of 1935, which gave the Indian States more autonomy and created a new department to deal with the affairs of the Indian States.\u003c/li\u003e\r\n\t\u003cli\u003eThe committee was appointed by Lord Irwin, the viceroy of India in 1927. The committee consisted of Sir Harcourt Butler, Prof. W.S. Holdsworth, and S.C. Peel.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44487", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1-2-3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overfl n was formed by merging the Bengal British India Society and the Landholders\u0026rsquo; Society in 1851. The association\u0026rsquo;s goal was to convey Indian grievances to the British government. The association\u0026rsquo;s ideology was spread through the newspaper Hindu Patriot.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe association\u0026rsquo;s recommendations included :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Establishing a separate legislature\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Separating judicial functions from executive functions\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Reducing the salaries of higher officers\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Abolishing charges like Akbari, salt duty, and stamp duties\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Madras Mahajana Sabha was founded in 1884 by M. Veeraraghavachariar, G. Subramania Iyer, and P. Ananda Charlu. The organization was a regional political group and a precursor to the Indian National Congress. The Madras Mahajana Sabha\u0026rsquo;s objectives were to free India from British rule and address Indian issues.\u003c/li\u003e\r\n\t\u003cli\u003eThe Madras Mahajana Sabha was formerly known as the Madras Native Association, which was established in 1849 by Gazulu Lakshminarasu Chetty. The Madras Native Association\u0026rsquo;s main goal was to demand reforms in British administration and to protest any injustice done to Indians.\u003c/li\u003e\r\n\t\u003cli\u003eSurendranath Banerjee and Ananda Mohan Bose founded the Indian National Association, also known as the Indian Association, in 1876. The association was the first openly nationalist organization in British India.\u003c/li\u003e\r\n\t\u003cli\u003eThe association\u0026rsquo;s objectives were to \u0026ldquo;promote the political, intellectual, and material advancement of the people by every legitimate means\u0026rdquo;. The association was a preparatory agent for the Indian National Congress.\u003c/li\u003e\r\n\t\u003cli\u003eThe association was a nationalist political group that supported local self-government. It rivaled the British Indian Association, which it considered a reactionary body of landlords and industrialists. The association spread beyond Bengal to other parts of India but remained Bengali in character.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44489", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo maintain a large standing army at others expense\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo keep India safe from Napoleonic danger\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow- word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eResiduary powers :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThese are the powers that a government authority retains after delegating certain powers to other authorities. These powers are not mentioned in any subject of the constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe Government of India Act of 1935 gave residuary powers to the Governor General to ensure that the central government could make laws on matters not assigned to the provinces.\u003c/li\u003e\r\n\t\u003cli\u003eResiduary powers are powers that are not prohibited or explicitly given by law to any government body. They are given because it is impractical to detail every act allowed to be carried out by the state in legislation.\u003c/li\u003e\r\n\t\u003cli\u003eResiduary powers ensure that there are no ambiguities or overlaps in the jurisdiction of various authorities. They also act as a safeguard to prevent any gaps in governance.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThese powers included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Establishing an All-India Federation\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Provincial autonomy, with a Government responsible to an elected legislature\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Redistribution of provinces and the creation of two new provinces\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn conclusion, the Government of India Act of 1935 assigned the residuary powers to the Governor General to ensure that the central government had the power to make laws on matters that were not specifically assigned to the provinces.\u003c/li\u003e\r\n\t\u003cli\u003eThis helped in maintaining l Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Santhal Pargana was created in 1855 as a result of the Santhal Hul or Rebellion of 1854-55. The rebellion was led by the brothers Sido and Kanu, and was the first peasant revolt in India. The rebellion is thought to have been caused by the introduction of the Permanent Land Settlement of 1793.\u003c/li\u003e\r\n\t\u003cli\u003eThe Santhal Pargana was created by ceding 5,500 square miles from the districts of Bhagalpur and Birbhum. The Santhal Pargana was part of the Bengal Presidency and the undivided Bihar state.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1876, the British passed the Santhal Parganas Tenancy Act, which made it illegal for a Santhal to transfer land to a non Santhal. The act was passed in response to the Santhal rebellion of 1855 against the colonial government\u0026rsquo;s feudal land tenure systems.\u003c/li\u003e\r\n\t\u003cli\u003eThe act\u0026rsquo;s purpose is to protect the land rights of the Santhal community, which are being threatened by the encroachment of non-Santhal communities on their land.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe act has several features that differentiate it from most other tenancy laws in India:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Section 20 mandates that most of the land in the division is non-transferable by all means other than inheritance.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Section 42 empowers the sub divisional officer (SDO) to evict anyillegal possessor of agricultural land within their subdivision.\u003c/p\u003e", "solution_video": "", "sort ion_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn 1920, which of the following changed its name to \u0026ldquo;Swarajya Sabha\u0026rdquo;?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2018)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn 1920, the All India Home Rule League changed its name to Swarajya Sabha. The All India Home Rule League\u0026rsquo;s last meeting in 1920 ended with the election of Mahatma Gandhi as its president. The league also merged with the Indian National Congress within a year.\u003c/li\u003e\r\n\t\u003cli\u003eThe Swarajya Sabha was led by freedom fighters like Annie Besant and Bal Gangadhar Tilak.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHindu Mahasabha :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a political organization and Hindu nationalist organization in India. It was formed in the early 20th century to protect the interests of Hindus and establish a Hindu Rashtra in India. The organization\u0026rsquo;s basis is religious and cultural philosophy of Hinduism.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hindu Mahasabha was first established in the Punjab before 1914. It became active in the 1920s under the leadership of Pandit Mohan Malaviya (1861\u0026ndash;1946) and Lala Rajpat Rai (1865\u0026ndash;1928). The Mahasabha functioned mainly as a pressure group advocating the interests of orthodox Hindus before the British Raj and within the Indian National Congress.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hindu Mahasabha is rarely acknowledged as an important influence on the Rashtriya Swayamsevak Sangh (RSS).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe South Indian Liberal Federation :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Justice Party, was\u0026nbsp;a political party in British India\u0026rsquo;s Madras Presidency.\u0026nbsp;It was founded on November 20, 1916, by Dr. C. Natesa Mudaliar and T. M. Nair.\u0026nbsp;The party\u0026rsquo;s goal was to promote the interests of non-Brahmin Caste Hindus.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe Justice Party\u0026rsquo;s first publication, Justice, was released on February 26, 1917. The Tamil publication Dravidan began publishing in June.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eIn 1938, the Justice Party merged with another entity under Periyar\u0026rsquo;s leadership.\u0026nbsp;In 1944, the merged entity changed its name to Dravidar Kazhagam.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Servants of India Society :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Bharat Sevak Samaj, was founded in 1905 by Gopal Krishna Gokhale. The society\u0026rsquo;s purpose was to unite and train people of different religions and ethnicities in welfare work. It was the first secular organization in India to focus on social issues, emergency aid, literacy, and disadvantaged populations.\u003c/li\u003e\r\n\t\u003cli\u003eThe society\u0026rsquo;s campaigns promoted education, sanitation, health care, and protection from domestic abuse. It also fought against social evils like untouchability, discrimination, alcoholism, and poverty. The society\u0026rsquo;s work helped unite people during the Indian Independence movement.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44496", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width ents of Arabic, Sanskrit, and Persian, as well as law and civil engineering.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44497", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle ty g {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Swadeshi movement was a mass movement that lasted from 1905\u0026ndash;1908. It was a response to the British government\u0026rsquo;s decision to partition Bengal in 1905. The movement\u0026rsquo;s name comes from the idea of using products and services from one\u0026rsquo;s own country.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement\u0026rsquo;s goals were to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Boycott British goods and institutions\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Buy Indian products\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Support indigenous industries\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Promote traditional crafts\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Promote national education\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Improve the country\u0026rsquo;s economic and political conditions\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe movement also helped to shape Indian nationalism and instill a strong sense of nationalism and self-confidence in Indian people. Its impact can still be felt in India\u0026rsquo;s economic policies and social structures today.\u003c/li\u003e\r\n\t\u003cli\u003eNational Council of Education (NCE) was established in 1906 as part of the Swadeshi Movement. The NCE was founded by Indian nationalists like Satish Chandra Mukherjee, Rabindranath Tagore, and Aurobindo Ghosh.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe NCE\u0026rsquo;s goals were to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Promote science and technology as part of the swadeshi industrialization movement\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Promote education in India, Develop a national system of education\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Promote physical and moral education\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Provide for denominational religious education\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Emphasize knowledge like literature, history, and philosophy\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Incorporate with the best Oriental ideals of life and thought\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe NCE established the Bengal National College and Bengal Technical Institute, which later merged to form Jadavpur University. The NCE also spawned most of the national schools in Bengal, particularly in East Bengal.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44504", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-widt span style=\"font-size:10.0pt\"\u003e\u003cspan style=\"line-height:107%\"\u003eMovement\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #181717; width:95px; padding:1px 3px 0cm 6px; height:67px; border-top:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"center\" style=\"text-align:center; text-indent:0cm\"\u003eE. V. Ramaswami Naicker\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eWhich of the pairs given above is/are correctly matched?\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe All India Anti-Untouchability League :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a non-profit organization founded by Mahatma Gandhi in 1932. The organization\u0026rsquo;s goal was to end untouchability in India through truth and nonviolence. The organization is also known as the Harijan Sevak Sangh.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Harijan Sevak Sangh\u0026rsquo;s objectives were to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. End untouchability in Hindu society\u003c/p\u003e\r\n\r\n\u003cp\u003e2. End the incidental evils and disabilities suffered by the so-called untouchables\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe organization is headquartered at Kingsway Camp in Delhi, with branches in 26 states across India.\u003c/li\u003e\r\n\t\u003cli\u003eSahajanand Saraswati founded the All India Kisan Sabha (AIKS) in 1936. The AIKS is the farmers\u0026rsquo; wing of the Communist Party of India. The AIKS was formed to address the problems of farmers against the zamindari system.\u003c/li\u003e\r\n\t\u003cli\u003eThe AIKS\u0026rsquo;s agenda had a strong influence on the Congress manifesto for the 1937 provincial elections. As the movement moved away from the Congress, it was more dominated by Socialists and Communists. By May 1942, the Communist Party of India (CPI) had gained control of the AIKS in every state of India, including Bengal.\u003c/li\u003e\r\n\t\u003cli\u003eThe AIKS was formed at the Indian National Congress\u0026rsquo;s Lucknow session in April 1936.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe AIKS\u0026rsquo;s features included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A kisan manifesto\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A periodical launched under the direction of Indulal Yagnik\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eE.V. Ramaswamy Naicker, also known as Periyar, founded the Self-Respect Movement in 1925. The movement\u0026rsquo;s goal was to create a rational society without religion, caste, or god, and to give equal human rights to oppressed castes.\u003c/li\u003e\r\n\t\u003cli\u003ePeriyar was a vocal critic of texts like the Mahabharata, Ramayana, and Manusmriti, which he believed were used to subjugate women and reinforce the caste system. Periyar is also known as the \u0026ldquo;Father of the Dravidian movement\u0026rdquo;. The Self-Respect Movement and Dravidar Kazhagam were both started by Periyar. Many political parties in Tamil Nadu, including the Dravida Munnetra Kazhagam (DMK) and All India Anna Dravida Munnetra Kazhagam (AIADMK), have their origins in the Self-Respect Movement.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1968, the state of Tamil Nadu legalized the Self-Respect Marriage Law, also known as Suyamariyathai. This law allows two Hindus to marry without a Brahmin priest or elaborate rituals, in the presence of friends or relatives. The first self-respect marriage took place in 1928, officiated by Periyar himself. Periyar encouraged inter caste marriages based on equality and respect.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "420", "test_series_id": "19", "topic": ""}];

let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
