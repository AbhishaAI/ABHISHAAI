<main style="max-width: 950px; margin: 35px auto; padding: 0 25px; font-family: 'Georgia', serif; padding-bottom: 150px;">

function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

ia Company\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Mirasidar - Designated revenue payer to the State\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the pairs given above is/are correctly matched?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAurang is a Persian term that refers to a warehouse or workshop. It is a place where goods are collected before being sold.\u003c/li\u003e\r\n\t\u003cli\u003eIn the 1820s, many warehouses or aurangs of Indian woven cloth were abolished as British textiles became more competitive.\u003c/li\u003e\r\n\t\u003cli\u003eBanians (banias) were agents of the company. \u0026ldquo;A Banyan is a person by whom the English gentlemen in general conduct all their business.\u003c/li\u003e\r\n\t\u003cli\u003eHe is interpreter, head book-keeper, head secretary, head broker, the supplier of cash and cash-keeper, and in general also secretkeeper.\u003c/li\u003e\r\n\t\u003cli\u003eIn the history of India, a mirasidar is a landholder or landlord who is responsible for collecting and paying revenue to the state. Mirasidars are designated revenue payers to the state, particularly in the Tamil regions of South India.\u003c/li\u003e\r\n\t\u003cli\u003eMirasidars have hereditary rights to the land, known as mirasi rights. Under the ryotwari settlement system, the government recognizes mirasidars as the sole proprietors of land, dismissing tenants\u0026rsquo; rights.\u003c/li\u003e\r\n\t\u003cli\u003eMirasidars were responsible for collecting revenue from a particular area and paying it to the state during the Mughal period.\u003c/li\u003e\r\n\t\u003cli\u003eMirasidars are a handful of village elites who often belong to Brahman and other high castes. They assert their rights of ownership over the land of the entire village and control village affairs.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "421", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44508", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndian handicrafts were ruined.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle t tion_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following statements correctly explain the impact of the Industrial Revolution on India during the first half of the nineteenth century? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Industrial Revolution in India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt began in the mid-19th century, during British colonial rule. It was primarily focused on the textile industry, with the establishment of mills and factories in cities like Mumbai and Ahmedabad.\u003c/li\u003e\r\n\t\u003cli\u003eThe Industrial Revolution was a period of scientific and technological development in the 18th century that transformed largely rural, agrarian societies into industrialized, urban ones. The invention of machines reduced the need for manpower and led to the development of the factory system.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFactors that led to the Industrial Revolution in India include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Growing demand\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Availability of raw materials\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Advancements in transportation\u003c/p\u003e\r\n\r\n\u003cp\u003e4. British colonial rule\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Industrial Revolution entered India in 1854 when Bombay opened its first steam powered cotton mill in Asia. Initially, the growth was slow, and the expansion of these modernised cotton mills was not done until the 1870s and 1880s.\u003c/li\u003e\r\n\t\u003cli\u003eIndustrialization is the process of transforming the economy of a nation or region from a focus on agriculture to a reliance on manufacturing. Mechanized methods of mass production are an essential component of this transition.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Industrial Revolution had many impacts on India in the first half of the nineteenth century:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Handicrafts :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe influx of cheap, machine-made British goods into the Indian market severely impacted the traditional Indian handicrafts industry. Indian artisans could not compete with the price and volume of goods produced by the mechanized industries of Britain. Handloom weavers in India suffered greatly due to this.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Textiles :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eIndian textiles now had to face stiff competition from English textiles in the European and American markets. Heavy duties were imposed on imported Indian textiles in Britain.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. New industries :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eNew industries also started emerging in India, such as cotton and jute mills, iron and steel plants, chemical plants, cement plants, and mining industries\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "421", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44509", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePeasant resistance to the oppressive conduct of planters\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/ \r\n\u003cp\u003eThe Mappila Rebellion of 1921\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Indigo Revolt of 1859 \u0026ndash; 60\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBirsa Munda\u0026rsquo;s Revolt of 1899-1900\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the history of India,\u0026ldquo;Ulgulan\u0026rdquo; or the Great Tumult is the description of which of the following events? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026ldquo;Ulgulan\u0026rdquo; or the Great Tumult is the description of the Munda Rebellion, a 19th century tribal rebellion led by Birsa Munda. The rebellion took place in the region south of Ranchi in 1899-1900 and aimed to drive away the British and establish Munda Raj.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion was a response to land encroachment and forced conversion practices. The movement also sought to restore the traditional land rights of thetribals, which had been eroded by British land revenue policies and the activities of Christian missionaries.\u003c/li\u003e\r\n\t\u003cli\u003eThe tribal population in the region was already reeling under the effects of drought and famine, and was subjected to further exploitation, which led to their disenchantment with the British administration.\u003c/li\u003e\r\n\t\u003cli\u003eThe Munda Rebellion is also the subject of the 1977 historical fiction novel Aranyer Adhikar (Right to the Forest) by writer activist Mahasweta Devi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indigo Revolt :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Indigo Rebellion, was a peasant movement that took place in Bengal in 1859-60. The revolt was a violent rebellion by farmers against the British planters who controlled the indigo industry. The revolt began in the Nadia district in 1859 and spread to other districts in the 1860s.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indigo Revolt was a result of the British East India Company\u0026rsquo;s efforts to increase the demand for indigo to make blue cloth in Britain. The British forced farmers to grow indigo, which they received an advance amount for in exchange. However, the advance amount was not enough, leading to increasing debts. The farmers were also forced to grow indigo under unfavorable terms.\u003c/li\u003e\r\n\t\u003cli\u003eThe revolt was a nonviolent resistance, with the farmers in no possession of arms. The revolt ended in 1860 after the formation of an Indigo commission that offered reforms to the system. The government eventually announced that ryots could not be forced to grow indigo, and planters closed all of their factories.\u0026nbsp;\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Mappila Rebellion of 1921 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Moplah Rebellion or Malabar Rebellion, was a series of armed revolts by Mappila Muslims in the Malabar region of Kerala, India. The rebellion was a response to British colonial rule and upper caste Hindu landlords. The rebellion began on August 20, 1921 and lasted for over four months.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe rebellion was sparked by a number of factors, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Religious grievances :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Moplahs were angered by the perceived Hindu domination of the Malabar region. T hey were also alarmed by the growth of Hindu nationalism in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Oppressive agrarian system :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Mappillas rose against an oppressive agrarian system and fought bravely with crude weapons against a mighty empire.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion was led by Variyamkunnath Kunhamed Haji and Ali Musaliar. The British crushed the rebellion by the end of 1921, raising a special battalion, the Malabar Special Force for the riot.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mappila movement eventually merged with the ongoing Khilafat agitation. Leaders of the Khilafat-Non-Cooperation Movement such as Gandhi, Shaukat Ali, and Maulana Azad addressed Mappila meetings.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Revolt of 1857 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u0026nbsp;It is also known as the Indian Mutiny, was a widespread but unsuccessful rebellion against the British East India Company in India in 1857\u0026ndash;59. The revolt began on May 10, 1857 in Meerut, when Indian soldiers (sepoys) in the British East India Company\u0026rsquo;s army mutinied against their British commanders. The revolt spread to Delhi, Agra, Kanpur, and Lucknow, and was contained only with the rebels\u0026rsquo; defeat in Gwalior on June 20, 1858.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe revolt was caused by many factors, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Religious and social causes\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Racism or racial discrimination\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Exploitation of Indians\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Interference in religious and cultural affairs\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Torture of Indians\u003c/p\u003e\r\n\r\n\u003cp\u003e6. The introduction of the \u0026ldquo;Enfield\u0026rdquo; rifle\u003c/p\u003e\r\n\r\n\u003cp\u003e7. The Doctrine of Lapse, which allowed the British to annex any native state whose ruler died without a male heir\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe British granted amnesty to all rebels not involved in murder on November 1, 1858, but did not declare the hostilities to have formally ended until July 8, 1859.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "421", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44511", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-w ed in the Court of Appeal that such issues were not legal concerns within Hinduism.\u003c/li\u003e\r\n\t\u003cli\u003eRukhmabai (1864\u0026ndash;1955) was an Indian physician and feminist who was the second woman in India to receive a medical degree and practice medicine.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "421", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44512", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: ortant}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Gandhi-Irwin Pact included which of the following? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Invitation to Congress to participate in the Round Table Conference\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Withdrawal of Ordinances promulgated in connection with the Civil Disobedience Movement\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Acceptance of Gandhi\u0026rsquo;s suggestion for enquiry into police excesses.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Release of only those prisoners who were not charged with violence.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Gandhi-Irwin Pact, signed in 1931, included the following terms:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Government :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eWithdraw all ordinances and end prosecutions. Release all political prisoners, except those guilty of violence. Permit peaceful picketing of liquor and foreign cloth shops. Restore confiscated properties of the satyagrahis.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Gandhi :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePledge to give up the satyagraha campaign.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Irwin :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAgree to release those who had been imprisoned during the campaign and to allow Indians to make salt for domestic use.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Indian National Congress (INC) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAgree to take part in the Round Table Conference. Stop the civil disobedience movement.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe pact also included the following features:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Withdrawal of all ordinances that curbed the activities of the Congress.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Permitting the free collection or manufacture of salt by persons near the seacoast.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "421", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44513", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-wor m).\u003c/li\u003e\r\n\t\u003cli\u003eThe company was established in 1600 to trade with the East Indies, which included China, Southeast Asia, and the Indian subcontinent. The company\u0026rsquo;s factories were trading posts and warehouses that also served as political and diplomatic centers. In the early years of the company\u0026rsquo;s operations, the factories were mainly located on thewest coast of India, particularly in Gujarat and Surat.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "421", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44517", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{ n_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Montagu-Chelmsford Reforms of 1919 recommended granting voting rights to all the women above the age of 21.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Government of India Act of 1935 gave women reserved seats in the legislature.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe statement \u0026ldquo;The Montagu-Chelmsford Reforms of 1919 recommended granting voting rights to all the women above the age of 21\u0026rdquo; is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eThe Montagu-Chelmsford Reforms, also known as the Government of India Act of 1919, did not recommend granting voting rights to women. Instead, the reforms recommended the creation of a franchise commission to consider the issue of extending the franchise.\u003c/li\u003e\r\n\t\u003cli\u003eThe 1919 Act\u0026rsquo;s primary goal was to increase the participation of Indian people in government. The Act also established a Dual System of Government, which split all government-controlled activity into two categories.\u003c/li\u003e\r\n\t\u003cli\u003eGovernment of India Act of 1935 granted women 41 reserved seats in provincial legislatures and limited reservation in central legislatures. The seats were reserved for women on a communal basis, but women could also contest from any general seat.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Government of India Act of 1935 also:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Made 29 million men and 6 million women eligible to vote\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Established a reserve bank to control the flow of currency in the country\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Led to the foundation of the federal court in 1937\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHowever, the Constitution of India, when promulgated on January 26, 1950, did not have the 1935 Act\u0026rsquo;s provision for reservation of seats for women.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "42 \r\n\u003cp\u003eWith reference to 8th August 1942 in Indian history, which one of the following statements is correct? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe All India Congress Committee (AICC) adopted the \u0026ldquo;Quit India\u0026rdquo; resolution on August 8, 1942 at its Bombay session.\u003c/li\u003e\r\n\t\u003cli\u003eThe resolution was moved by Jawaharlal Nehru and seconded by Sardar Patel. The resolution stated that the British must immediately leave India.\u003c/li\u003e\r\n\t\u003cli\u003eMahatma Gandhi launched the \u0026ldquo;Quit India\u0026rdquo; movement at the Bombay session of the AICC.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement demanded an end to British rule in India during World War II. On the same day, Gandhi urged Indians to act as a free nation and follow non-violent civil disobedience.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement was caused by:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The failure of the Cripps Mission\u003c/p\u003e\r\n\r\n\u003cp\u003e2. India\u0026rsquo;s involvement in World War II without prior consultation\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The prevalence of anti-British sentiment\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement had the following successes:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The rise of future leaders\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Women\u0026rsquo;s participation\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The rise of nationalism\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The iconic \u0026ldquo;Quit India\u0026rdquo; slogan was coined by socialist\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Congress leader Yusuf Meher Ali in 1942.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement (b) is incorrect : \u003c/strong\u003eMore Indians were added to Viceroy\u0026rsquo;s executive council by Government of India Act 1919. First time, an Indian was added in this council by Government of India act 1909.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eStatement (c) is incorrect : \u003c/strong\u003eCongress resigned from ministries in 7 provinces in 1939 as they decided not to support war as India could not be party to a war for democratic freedom while that freedom was being denied to India.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Statement (d) is incorrect :\u003c/strong\u003e Yes, Cripps proposed a dominion status to India, but this was not related to 8 August 1942.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "421", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44519", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003csty ong of India\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003ePingali Venkayya is credited with designing the Indian national flag. Venkayya was a freedom fighter and member of the Indian independence movement. In 1921, he presented his design to Mahatma Gandhi, the leader of the All-India Congress. The Constituent Assembly of India adopted the flag on July 22, 1947.\u003c/li\u003e\r\n\t\u003cli\u003eVenkayya was born on August 2, 1876 in Bhatlapenumarru, Andhra Pradesh. He was a teacher, author, agriculturist, linguist, and party member. India observes National Flag Adoption Day on July 22nd each year.\u003c/li\u003e\r\n\t\u003cli\u003eBhogaraju Pattabhi Sitaramayya was a member of the Congress Working Committee when the Quit India Movement began in 1942. He was arrested along with the entire committee and imprisoned for three years without any outside contact in the fort in Ahmednagar, Maharashtra.\u003c/li\u003e\r\n\t\u003cli\u003eMadame H. P. Blavatsky and Colonel Henry Steel Olcott founded the Theosophical Society in 1875 and established its headquarters in Adyar, India in 1882.\u003c/li\u003e\r\n\t\u003cli\u003eThe Theosophical Society is an organization that promotes theosophy, which comes from the Greek word theosophia meaning \u0026ldquo;God\u0026rsquo;s wisdom\u0026rdquo;. The society advocates for a worldwide religion based on Buddhistic and Brahmanic teachings.\u003c/li\u003e\r\n\t\u003cli\u003eBlavatsky was a Russian and American author and mystic who became a leading theoretician of Theosophy. Olcott was an American military officer, journalist, lawyer, and Freemason who became the society\u0026rsquo;s first president.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "421", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44522", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_ , including Lord T.B. Macually as chairman.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Governor-General: \u003c/strong\u003eThe gover nor-general in India was the same as the governor-general in Bengal. Lord William Bentinck became the first Governor-General of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Legislative abilities: \u003c/strong\u003eThe adminis trations of Bombay and Madras were drained of their legislative abilities.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Abolition of Slavery: \u003c/strong\u003eThe Charter Act of 1833 ensured the decline of slavery in British India.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. British East India Company: \u003c/strong\u003eThe act ended the commercial activities of the British East India Company and made it a purely administrative body.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Trade relations:\u003c/strong\u003e The act suspended trade relations with China.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Laws: \u003c/strong\u003eThe act mandated that all laws enacted in India be submitted to the British Parliament.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e8. British colonization:\u003c/strong\u003e The act legal ized the British colonization of the country.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e9. English settlement: \u003c/strong\u003eThe act permit ted the English to settle freely in In dia.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "421", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44527", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img t:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003eunder The Arms (Amendment) Act, 2019\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eHow many of the above pairs are correctly matched?\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Official Secrets Act of 1923 is an anti-espionage law in India that dates back to the British colonial era. The act prohibits actions that support an enemy state\u0026rsquo;s attack against India and prohibits access to restricted government sites or authority. It also makes spying, sharing secret information, and unauthorized use of uniforms punishable offenses.\u003c/li\u003e\r\n\t\u003cli\u003eThe act states that actions that help an enemy state against India are strongly condemned. It also states that one cannot approach, inspect, or even pass over a prohibited government site or area.\u003c/li\u003e\r\n\t\u003cli\u003eThe act provides the framework for dealing with espionage, sedition, and other potential threats to the integrity of the nation. If found guilty, a person may get up to 14 years\u0026rsquo; imprisonment, a fine, or both.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian Evidence Act of 1872 is a set of rules that govern the admissibility of evidence in Indian courts. It was originally passed by the Imperial Legislative Council in 1872, during the British Raj.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Act recognizes several types of evidence, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Oral testimony, Documentary evidence, Physical evidence.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Act also states that any information contained in an electronic record is admissible in legal proceedings, without the need for the original device.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Act is important for a number of reasons, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It guarantees that only credible and admissible proof is given in court.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It protects the rights of witnesses and accused by defining the circumstances under which they can be forced to testify.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome of the cardinal principles of the law of evidence include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Evidence must be confined to the matter in issue.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Hearsay evidence must not be admitted.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Best evidence must be given in all cases.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Arms (Amendment) Act, 2019 ensures that those using firearms in a rash or negligent manner in celebratory gunfire, endangering human life or personal safety of others, shall be punishable with an imprisonment to two years or with fine which may extend to Rs one lakh or with both.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "421", "test_series_id": "19 \r\n\r\n\u003cp\u003e2. Defence and Foreign Affairs were kept under the control of the federal legislature.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "313", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe correct answer is (a) 1 only.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Government of India Act, 1935 was the most comprehensive constitutional reform introduced by the British in colonial India before independence. It indeed provided for the establishment of an All India Federation, which was to be based on the union of British Indian provinces and the princely states. However, this federation never actually came into existence because the princely states did not agree to join it. Therefore, statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eOn the other hand, statement 2 is incorrect because under the Act, Defence and Foreign Affairs were not under the control of the federal legislature. These subjects were considered \u0026ldquo;reserved subjects\u0026rdquo; and remained under the direct control of the Governor-General, who was responsible to the British government, not to the legislature. The federal legislatu const QUIZ_TITLE = "Modern History PYQ Test 6";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
