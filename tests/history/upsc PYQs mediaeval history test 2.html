_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRegarding the taxation system of Krishna Deva, the ruler of Vijayanagar, consider the following statements:\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2016)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The tax rate on land was fixed depending on the quality of the land.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Private owners of workshops paid an industries tax.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe tax rate on land was fixed depending on the quality of the land under the taxation system of Krishna Deva, the ruler of Vijayanagar.\u003c/li\u003e\r\n\t\u003cli\u003eThe quality of land was determined by its fertility, irrigation facilities, and productivity. Land that was more fertile and had better irrigation facilities was considered higher quality and taxed at a higher rate. Land that was less fertile or lacked proper irrigation facilities was considered lower quality and taxed at a lower rate.\u003c/li\u003e\r\n\t\u003cli\u003eKrishna Deva Raya introduced a system of land measurement and assessment, known as Karnam or Patwari system, to determine the quality and productivity of the land. The tax was usually collected in kind, such as crops or livestock, rather than in cash.\u003c/li\u003e\r\n\t\u003cli\u003eDuring the reign of Krishna Devaraya, the rate was fixed between one third and one sixth depending on the quality of the land.\u003c/li\u003e\r\n\t\u003cli\u003ePrivate owners of workshops paid an industries tax. This tax was called Shulka and was levied by Krishna Deva Raya.\u003c/li\u003e\r\n\t\u003cli\u003eThe tax was based on the size and type of the industry and the amount of revenue it generated. Krishna Deva Raya was the third monarch of the Tuluva dynasty and is considered oneof the greatest rulers in Indian history. He ruled the largest empire in India after the fall of the Islamic Delhi Sultanate.\u003c/li\u003e\r\n\t\u003cli\u003eThe villages were classified into eight types for tax purpose.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThey were:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1) The brahmadeya villages\u003c/p\u003e\r\n\r\n\u003cp\u003e2) The devadana villages\u003c/p\u003e\r\n\r\n\u003cp\u003e3) The mathapura villages\u003c/p\u003e\r\n\r\n\u003cp\u003e4) The sarvamanya villages\u003c/p\u003e\r\n\r\n\u003cp\u003e5) The kodagi lands\u003c/p\u003e\r\n\r\n\u003cp\u003e6) Rakta-kodagal lands\u003c/p\u003e\r\n\r\n\u003cp\u003e7) Guttagi lands\u003c/p\u003e\r\n\r\n\u003cp\u003e8) The rest of the villages or lands.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe first four types prevailed prior to the Vijayanagar times.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43785", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAgriculturists\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !import e Mughal army during military campaigns.\u003c/li\u003e\r\n\t\u003cli\u003eThe Banjaras originated in Rajasthan and are now found all over India. The majority of the Banjara population are Hindus.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43786", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKakinada\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMotupalli\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMachilipatnam (Masulipatnam)\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNelluru\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following was a very important seaport in the Kakatiya king dom?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2017)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMotupalli was a famous and important trading seaport for the Kakatiyas. The port was a hub for the export of goods like textiles, spices, pearls, and diamonds. The kingdom also imported goods like horses, elephants, and precious metals through this port.\u003c/li\u003e\r\n\t\u003cli\u003eMotupalli is a village in Chinaganjam Mandal, Prakasam District in the Indian state of Andhra Pradesh. It is the site of a historic port city, one of the most ancient in India, dating back to at least the 2nd century CE.\u003c/li\u003e\r\n\t\u003cli\u003eThe famous traveler Marco Polo also visited this port and wrote about the wealth of the Kakatiya kingdom in his travel journal.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kakatiya dynasty\u0026nbsp;:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey ruled the eastern Deccan region of India from the 12th to 14th centuries.\u0026nbsp;Their territory included much of present-day Telangana and Andhra Pradesh, and parts of eastern Karnataka, northern Tamil Nadu, and southern Odisha.\u0026nbsp;The Kakatiyas\u0026rsquo; capital was Orugallu, which is now known as Warangal.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe Kakatiya dynasty is known for its architectural and cultural contributions.\u0026nbsp;The most notable achievements are the construction of the Warangal Fort and the Thousand Pillar Temple.\u0026nbsp;The rulers also played a significant role in promoting Sanskrit literature and art during their reign.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe Kakatiya dynasty was founded by Betaraju, who took the name Prola Raja in the early 12th century.\u0026nbsp;His successor, Rudra Deva, expanded the dynasty\u0026rsquo;s territorythrough military conquests.\u0026nbsp;Ganapati Deva (1198-1262 AD) is considered the greatest ruler of the Kakatiya dynasty.\u0026nbsp;He brought most of the Telugu-speaking region under the Kakatiya influence by war or diplomacy.\u0026nbsp;He also turned Warangal into a center of culture, trade, and religion.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eIn the early 14th century, Muhammad bin Tughluq, the ruler of Delhi, defeated the Kakatiya Dynasty.\u0026nbsp;Following their defeat, the Kakatiya Dynasty lost their independence, and Warangal came under the direct control of the Delhi Sultanate.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003cstrong\u003eImportance of Motupalli Seaport :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Motupalli seaport was a major center of trade during the Kakatiya period.\u003c/li\u003e\r\n\t\u003cli\u003eIt was located on the east coast of India, near the mouth of the Krishna river.\u003c/li\u003e\r\n\t\u003cli\u003eThe seaport was well-connected to other parts of the kingdom through a network of roads and waterways.\u003c/li\u003e\r\n\t\u003cli\u003eThe port was a hub for the export of goods like textiles, spices, pearls, and diamonds.\u003c/li\u003e\r\n\t\u003cli\u003eThe kingdom also imported goods like horses, elephants, and precious metals through this port.\u003c/li\u003e\r\n\t\u003cli\u003eMotupalli was an important center of maritime trade because of its strategic location.\u003c/li\u003e\r\n\t\u003cli\u003eIt was situated close to the Bay of Bengal, which made it accessible to traders from Southeast Asia and China.\u003c/li\u003e\r\n\t\u003cli\u003eThe port was also connected to other parts of India through the Krishna river, which facilitated inland trade.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kakatiya rulers took several measures to develop and maintain the Motupalli seaport.\u003c/li\u003e\r\n\t\u003cli\u003eThey constructed warehouses, granaries, and other infrastructure to store goods and facilitate trade.\u003c/li\u003e\r\n\t\u003cli\u003eThe kingdom also had a well-organized system of taxation and regulation of trade, which helped in maintaining the port\u0026rsquo;s prosperity.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43787", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eFrancois Bernier\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle mage_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following foreign trav ellers elaborately discussed about dia monds and diamond mines of India?\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;2018)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eJean-Baptiste Tavernier (1605\u0026ndash;1689) was a 17th-century French traveler and gem merchant who extensively discussed diamonds and diamond mines in India. Tavernier was a pioneer of trade between Europe and Asia, and traveled to India six times between 1630 and 1668. He is best known for discovering or purchasing the 116-carat Tavernier Blue diamond in 1666, which he later sold to Louis XIV of France.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFran\u0026ccedil;ois Bernier (1620 - 1688):\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a French physician, historian, political philosopher, and traveler. He spent 12 years in India, where he served as a personal physician to Dara Shikoh, the eldest son of Emperor Shah Jahan. He also served as a scientist under Danishmand Khan.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBernier\u0026rsquo;s observations included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eA large portion of land was extremely fertile\u003c/li\u003e\r\n\t\u003cli\u003eThe kingdom of Bengal surpassed Egypt in agricultural production\u003c/li\u003e\r\n\t\u003cli\u003eMany parts of India were sufficiently populated\u003c/li\u003e\r\n\t\u003cli\u003eThe land was well tilled\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBernier also collected important information about various fields, including succession wars, the Mughal administrative system, revenue system, and the condition of farmers.\u003c/li\u003e\r\n\t\u003cli\u003eHe published the successful Travels in Moghul India and became part of a circle that included Racine and Boileau.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJean de Th\u0026eacute;venot (1633-1667) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a French traveler, linguist, botanist, and natural scientist. He was a curious observer who traveled through Asia and wrote extensively about his experiences.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1657, Th\u0026eacute;venot visited the Greek Islands, Egypt, and Sinai. He also made the Lent pilgrimage from Cairo to Jerusalem by caravan.\u003c/li\u003e\r\n\t\u003cli\u003eTh\u0026eacute;venot was born in Paris on June 16, 1633 and attended the College of Navarre. He is the nephew of the famous French cartographer Melchis\u0026eacute;dec Th\u0026eacute;venot (1620 1682), who is said to have influenced his interest in exploring the world.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBarth\u0026eacute;lemy Carr\u0026eacute; de Chambon (Abb\u0026eacute; Carr\u0026eacute;) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was born in 1636 or 1640. In 1672, the French minister of finance, Jean-Baptiste Colbert, sent Carr\u0026eacute; to India to expand the French political-economic network.\u003c/li\u003e\r\n\t\u003cli\u003eCarr\u0026eacute; traveled from Marseille, Alexandrette, Iran, Bandar-Abbas, Bijapur, and Madras. In 1674, he left Surat for France and arrived in Marseille in 1675.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43788", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\" \n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements:\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. In the revenue administration of Delhi Sultanate, the in-charge of revenue collection was known as \u0026lsquo;Amil\u0026rsquo;.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The lqta system of Sultans of Delhi was an ancient indigenous institution.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The office of \u0026lsquo;Mir Bakshi\u0026rsquo; came into existence during the reign of Khalji Sultans of Delhi.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe correct answer is (A) 1 Only.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 1 is correct. \u003c/strong\u003eThe Delhi Sultanate\u0026rsquo;s revenue machinery had local officers called \u0101mils (from Arabic \u0101mil, meaning agent/administrator) who were responsible for collecting revenue and remitting it to the treasury. In practice amils supervised revenue collection in assigned areas, leased out revenue in some cases, and acted as the state\u0026rsquo;s revenue agents \u0026mdash; so calling the in-charge of revenue collection an \u0026ldquo;Amil\u0026rdquo; is accurate.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 2 is incorrect. \u003c/strong\u003eThe iq\u1e6d\u0101\u02bf (iqta) system was not an indigenous ancient Indian institution but a land-assignment/ revenue-farming practice of Islamic polities that the early Muslim rulers in India adopted and adapted. The iqta system has roots in earlier Islamic/Caliphal practice (and was used by Ghaznavids, Ghurids and later Muslim rulers) and was introduced into the subcontinent under Muslim dynasties; it was therefore not an \u0026ldquo;ancient indigenous\u0026rdquo; institution of India.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 3 is incorrect. \u003c/strong\u003eThe office of Mir Bakshi is a title that became prominent and was institutionalized under the later Muslim imperial administration \u0026mdash; most notably the Mughals (Akbar systematized the Mir Bakhshi as the head of military affairs, recruitment, pay and intelligence). It was not an office created during the Khilji Sultans of Delhi; therefore the claim that Mir Bakshi originated under the Khiljis is wrong.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43790", "image_check": "0", "im  2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements:\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Saint Nimbarka was a contemporary of Akbar.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Saint Kabir was greatly influenced by Shaikh Ahmad Sirhindi.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSaint Nimbarka was not a contemporary of Akbar. Saint Nimbarka lived around the 13th century, while Akbar ruled in the 16th century.\u003c/li\u003e\r\n\t\u003cli\u003eSaint Nimbarka was a Telugu-speaking Brahman who flourished in the 13th century in South India. He was also called Nimbaditya or Niyamananda. He was a philosopher-saint and the founder of the Nimbarka Sampradaya.\u003c/li\u003e\r\n\t\u003cli\u003eThe Nimbarka Sampradaya is one of the four Vaishnava Sampradayas. It is also known as the Hamsa Sampradaya and the Sanakadi Sampradaya.\u003c/li\u003e\r\n\t\u003cli\u003eSaint Kabir (1398 or 1440-1518) was not influenced by Shaikh Ahmad Sirhindi (1564-1624/1625).\u003c/li\u003e\r\n\t\u003cli\u003eSirhindi was a prominent Islamic scholar and sufi of the 16th century, while Kabir was a 15th-century poet-saint and Bhakti movement figure.\u003c/li\u003e\r\n\t\u003cli\u003eKabir\u0026rsquo;s teachings were influenced by several religions, including old Brahmanic Hinduism, Hindu and Buddhist Tantrism, the teachings of Nath yogis, and the personal devotionalism from South India.\u003c/li\u003e\r\n\t\u003cli\u003eHe was also strongly influenced by Vaishnava Saint Swami Ramananda, the Hindu bhakti leader.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty  "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eTansen was the title given to him by Raja Vikramjit of Gwalior. Tansen was a court musician in the darbar of Raja Ramachandra of Bandavagarh (Rewa).\u003c/li\u003e\r\n\t\u003cli\u003eWhen Akbar heard of his prodigious talent, he sent a \u0026lsquo;firman\u0026rsquo; to the king asking for Tansen and made him one of the Navaratnas in his court. He gave him the title of \u0026lsquo;Mian\u0026rsquo;. Tansen is also known as the \u0026lsquo;Sangit Samrat\u0026rsquo;\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43792", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u0 n_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWho among the following Mughal Emperors shifted emphasis from illustrat ed manuscripts to album and individual portrait?\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eJahangir shifted the focus from illustrated manuscripts to chitradhara (album) and individual portraits.\u003c/li\u003e\r\n\t\u003cli\u003eJahangir was a fan of art and architecture. He commissioned, preserved, and cataloged many works of art. He also had a zoo where he documented each species of animal.\u003c/li\u003e\r\n\t\u003cli\u003eJahangir was exposed to European artworks through the Jesuits who visited his court. He encouraged his court painters to adopt European styles as well.\u003c/li\u003e\r\n\t\u003cli\u003eJahangir employed a large studio of artists who produced paintings influenced by European portrait styles.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mughal School of painting originated in the reign of Akbar in 1560 A.D.\u003c/li\u003e\r\n\t\u003cli\u003eMughal Paintings revolved around the themes of battles, hunting scenes, wildlife, portraits, etc.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHumayun (1508 - 1556) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was the second Mughal emperor of India. He ruled from 1530 to 1540 and again from 1555 until his death. His territory included what is now Pakistan, Bangladesh, Northern India, and Eastern Afghanistan.\u003c/li\u003e\r\n\t\u003cli\u003eHumayun was the son of Babur, the founder of the Mughal dynasty. He was known as an adventurer and was driven out of his capital, Delhi, by the Afghan usurper Sh\u0113r Shah of S\u016br. Humayun was considered an ethical ruler who had a policy of not attacking any Muslims.\u003c/li\u003e\r\n\t\u003cli\u003eHe was also known for his religious policy, which depicted him as a Sunni Muslim with an appreciation for Sufism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDuring his reign, he:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Besieged the fortress of Kalinjar in Bundelkhand\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Defeated the Afghans at Douhrua\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Drove out Sultan Mahmood Lodhi from Jaunpur\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Defeated Bahadur Shah of Gujarat\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHumayun died in Delhi on January 27, 1556 after tripping and fracturing his head while carrying books. He was known as \u0026ldquo;the luckless one\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAkbar (1556-1605) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eEmperor Akbar founded the city in the name of \u0026ldquo;ILLAHABAS\u0026rdquo; which later became ALLAHABAD.\u003c/li\u003e\r\n\t\u003cli\u003eHe introduced the new religion as Din Ilahi.\u003c/li\u003e\r\n\t\u003cli\u003eHe introduced the Mansabdari system.\u003c/li\u003e\r\n\t\u003cli\u003eAkbar defeated Hemu in the second battle of Panipat.\u003c/li\u003e\r\n\t\u003cli\u003eHe built Ibadat Khana in Fatehpur Sikri.\u003c/li\u003e\r\n\t\u003cli\u003eHe followed the policy of Sulh-i-kul.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJahangir (1605-1627) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eJahangir was the eldest son of Akbar.\u003c/li\u003e\r\n\t\u003cli\u003eJahangir executed the fifth Sikh Guru, Arjun Dev.\u003c/li\u003e\r\n\t\u003cli\u003eUnder Jahangir, Mughal paintings reached its zenith.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eShah Jahan (1627-1658) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was the son of Jahangir.\u003c/li\u003e\r\n\t\u003cli\u003eA French traveller, Tavernier visited during his reign.\u003c/li\u003e\r\n\t\u003cli\u003eDiwan-i-Khas and Diwan-i-Am, a hall of private and public audiences are built by Shah Jahan.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43793", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u00 erflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;In the 16th century, the Mughal emperor Akbar organized the empire into three administrative levels:\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e1.\u003cstrong\u003e Subah:\u003c/strong\u003e Roughly equivalent to a state or province.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u003cstrong\u003e Sarkar:\u003c/strong\u003e Roughly equivalent to a district.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. \u003cstrong\u003ePargana: \u003c/strong\u003eRoughly equivalent to a district subdivision.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Mughal empire was initially divided into 12 subahs, which were later expanded to 15 during Akbar\u0026rsquo;s reign. \u0026bull;\u003c/li\u003e\r\n\t\u003cli\u003eThe correct sequence in ascending order of size for medieval India is: Pargana, Sarkar, Suba.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eA Sarkar also included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A Shiqdar (military officer)\u003c/p\u003e\r\n\r\n\u003cp\u003e2. An Amin or Munsif (Civilian Judge)\u003c/p\u003e\r\n\r\n\u003cp\u003e3. One Fotahdar (treasurer)\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Two Karkuns (clerks or writers)\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43794", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003c width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 Only\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Indian history, which of the following statements is/are correct?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Nizamat of Arcot emerged out of Hyderabad State.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Mysore Kingdom emerged out of Vijaynagara Empire.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Rohilkhand Kingdom was formed out of the territories occupied by Ahmad Shah Durrani.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Nizamat of Arcot did not emerge from Hyderabad State. It was a political office in the Carnatic region, which was under the control of the Nawab of Arcot. The Nizamat of Arcot was established in the Carnatic region under the Mughals, and it was distinct from Hyderabad.\u003c/li\u003e\r\n\t\u003cli\u003eThe Nizam of Arcot emerged as an independent state after the decline of the Mughal Empire in the first half of the eighteenth century. It was a protected area for the Hyderabad state, but it did not get out of it. The\u003c/li\u003e\r\n\t\u003cli\u003eNizamat of Arcot was a British administrative division in south India, which was created in 1768. Arcot is a town and urban area of Ranipet district in the state of Tamil Nadu, India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mysore Kingdom emerged from the Vijayanagara Empire in the early 18th century. The Wodeyar dynasty ruled the Mysore Kingdom, which played a significant role in South India\u0026rsquo;s history.\u003c/li\u003e\r\n\t\u003cli\u003eThe Vijayanagara Empire was established in 1336 after rebellions against Tughluq rule in the Deccan. In 1565, the Deccan sultanates united and defeated the Vijayanagara Empire in the Battle of Talikota.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1704, Krishnaraja Wodeyar I declared independence from the Vijayanagara Empire and became the founder of the Mysore Kingdom. In 1761, Hyder Ali overthrew the regaining dynasty in Mysore and established his own control. In 1782, Tipu Sultan succeeded Hyder Ali.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rohilkhand Kingdom was not formed out of territories occupied by Ahmad Shah Durrani. The Rohilkhand Kingdom was established in the mid-18th century by Hafiz Rahmat Khan, a Rohilla Afghan. The Rohillas were Afghan settlers who established their dominance in the Rohilkhand region of North India before the invasions of Ahmad Shah Durrani.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rohilkhand region is located in present-day Uttar Pradesh and includes the cities of Amroha, Bareilly, Bijnore, Budaun, Khutar, Moradabad, Najibabad, Pilibhit, Rampur, Bahjoi, Kakrala, and Shahjahanpur. The kingdom covers an area of about 10,000 square miles, or 25,000 square kilometers, around the city of Bareilly.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43795", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3 Only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {  in the sport.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Astrology : \u003c/strong\u003eWomen were also skilled in astrology and were consulted for horoscopes and predictions.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Accounting :\u003c/strong\u003e Women in the empire were also trained in accounting and were responsible for managing the household finances.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eSoothsaying : \u003c/strong\u003eWomen were also skilled in soothsaying or predicting the future based on omens and signs.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eNuniz also wrote that women in the Vijayanagara Empire were employed in other roles, including:\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eDancers, Domestic servants, Palanquin bearers, Judges, Bailiffs, Watch women.\u003c/li\u003e\r\n\t\u003cli\u003eNuniz also wrote that women in the Vijayanagara Empire were trained in wrestling and were known to participate in the sport.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43796", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style % !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 Only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements:\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It was during the reign of Iltutmish that Chengiz Khan reached the Indus in pursuit of the fugitive Khawarezm prince.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It was during the reign of Muhammad bin Tughluq that Taimur occupied Multan and crossed the Indus.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. It was during the reign of Deva Raya II of Vijayanagara Empire that Vasco da Gama reached the coast of Kerala.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eChengiz Khan reached the Indus River in pursuit of the fugitive Khawarezm prince during the reign of Iltutmish.\u003c/li\u003e\r\n\t\u003cli\u003eChengiz Khan was the Mongol ruler who attacked the Khwarezmian Empire, which was located in present-day Iran and Central Asia. The Khwarezm prince, Jalal ad-Din Mingburnu, sought refuge in India, and Iltutmish allowed him to settle in India.\u003c/li\u003e\r\n\t\u003cli\u003eIltutmish was the Sultan of Delhi from 1211 to 1236. His reign is considered significant because it marked the rise of the first independent Turkish ruler in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe statement that Taimur occupied Multan and crossed the Indus during the reign of Muhammad bin Tughluq is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1398, Timur invaded India during the reign of Nasir-ud-Din Mahmud Shah Tughluq, the last ruler of the Tughlaq dynasty. On September 30, 1398, Timur crossed the Indus River and captured Multan in October.\u003c/li\u003e\r\n\t\u003cli\u003eTimur was a great patron of art and architecture, and his reign introduced the Timurid Renaissance. He reigned over a vast empire that included modern-day Turkey, Syria, Iraq, Kuwait, and Iran, as well as parts of Kazakhstan, Afghanistan, Russia, Turkmenistan, Uzbekistan, Kyrgyzstan, Pakistan, and India.\u003c/li\u003e\r\n\t\u003cli\u003eVasco da Gama reached the coast of Kerala in 1498, which was more than 50 years after the death of Deva Raya II. Deva Raya II ruled the Vijayanagara Empire from 1424 to 1446.\u003c/li\u003e\r\n\t\u003cli\u003eVasco da Gama was a Portuguese navigator who opened up the sea route from western Europe to the East in the late 15th and early 16th centuries. In 1498, he landed with 170 men at Kappad beach, near Kozhikode, Kerala.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43797", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003 "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSt. Francis Xavier was one of the first seven members of the Jesuit order. He was also a co-founder of the Society of Jesus.\u003c/li\u003e\r\n\t\u003cli\u003eXavier was a Spanish Jesuit missionary in the 1500s. He was born in 1506 in the Basque region of northern Spain. He is known for his missionary work in India, Southeast Asia, and Japan. He is also the patron saint of Roman Catholic missions.\u003c/li\u003e\r\n\t\u003cli\u003eXavier was known for his enthusiasm, passion, and charisma. He was also known for being decisive, cheerful, and practical. Xavier is honored by the Catholic Church, other Christian churches, and the Jesuit order.\u003c/li\u003e\r\n\t\u003cli\u003eHe arrived in Goa, India, on May 6, 1542. Over the next 12 years, Francis led a series of overseas missions, mainly in the Portuguese Empire of the time - Mozambique, Malacca and notably Goa.\u003c/li\u003e\r\n\t\u003cli\u003eHe was the first Christian missionary to travel Japan and on to Borneo and the Moluccan Islands.\u003c/li\u003e\r\n\t\u003cli\u003eOn December 3, 1552, Francis died of fever on the island of Sancian (Shangchuan, off the Chinese coast).\u003c/li\u003e\r\n\t\u003cli\u003eThe Feast of St. Francis Xavier is celebrated in Goa on December 3rd each year. It marks the death anniversary of the saint and is also known as the Goinchea Saibache Fest, or \u0026ldquo;Lord of Goa Festival\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe feast day commemorates St. Francis Xavier\u0026rsquo;s faith and missionary work in Europe and Asia. St. Francis Xavier is the patron saint of Goa, and festivities in Goa may begin as early as the end of November.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43798", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eClothing\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCoins\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} im \u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe first Mongol invasion of India happened in 1221, during the reign of Sultan Iltutmish, not Jalal-ud-din Khalji.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mongol Empire invaded the Indian subcontinent several times from 1221 to 1327.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1297, during the reign of Ala-ud-din Khalji, a Mongol assault led by Ghiyas ud-din Tughlaq marched up to Delhi and besieged the city.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mongols plundered the area around Delhi and besieged the fort for two months, but they were unable to capture it and withdrew.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mongols attacked Delhi twice during the reign of Alauddin Khalji, the Delhi Sultanate ruler. The first attack was in 1299 and the second was in 1302-03.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1299, the Mongols invaded India, led by Qutlugh Khwaja. The Mongols encamped at Kili, near Delhi, and the Delhi Sultan led an army to stop their advance. The Battle of Kili was fought between the Mongols and the Delhi Sultanate.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1303, the Mongols launched another invasion of the Delhi Sultanate.\u003c/li\u003e\r\n\t\u003cli\u003eThe Delhi Sultan was away at Chittor when the Mongols started their march, but he returned to Delhi in a hurry. In 1311, Alauddin Khalji ordered a massacre of the \u0 eak-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to Ramanuja, the best way to achieve salvation is through devotion to God, or bhakti. He believed that devotion was a disciplined practice that involved surrendering to God and serving Him. Ramanuja also advocated for surrender to God (prapatti) as a means to achieve moksha, or liberation from the cycle of birth and death.\u003c/li\u003e\r\n\t\u003cli\u003eRamanuja was born in Tamil Nadu in the 11th century and was influenced by the Alvars.\u003c/li\u003e\r\n\t\u003cli\u003eHe firmly believed that intense devotion to Vishnu was the best means to attainsalvation.\u003c/li\u003e\r\n\t\u003cli\u003eHe propounded the doctrine of Vishishtadvaita.\u003c/li\u003e\r\n\t\u003cli\u003eThe outdoor 216-ft Statue of Equality will be the world\u0026rsquo;s second tallest statue featuring a sitting posture.\u003c/li\u003e\r\n\t\u003cli\u003eIt is composed of \u0026lsquo;panchaloha\u0026rsquo;, a combination of five metals comprising gold, silver, copper, brass, and zinc.\u003c/li\u003e\r\n\t\u003cli\u003eBorn in 1017 in Sri Perumbudur, Tamil Nadu, Sri Ramanujacharya liberated millions from social, cultural, gender, educational and economic discrimination with the foundational conviction that every human is equal regardless of nationality, gender, race, caste, or creed.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43804", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{ov ;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following dynasties.........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2023)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Hoysala\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Gahadavala\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Kakatiya\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Yadava\u003c/p\u003e\r\n\r\n\u003cp\u003eHow many of the above dynasties established their kingdoms in early Eighth century AD?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Hoysala Dynasty :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a Kannadiga power that ruled most of what is now Karnataka between the 10th and 14th centuries. The dynasty is known for its temple architecture, including the Chennakesava Temple, Hoysaleswara Temple, and Kesava Temple.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hoysalas were initially subordinate to the Western Chalukyas until 1187, when Veera Ballala II freed them. The Hoysala Empire is remembered for its temple architecture.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hoysala Dynasty was founded by Sala, who was succeeded by Vinayaditya and Balalla I. The greatest ruler of the Hoysala dynasty was Vishnuvardhana (Bittideva). He defeated the Cholas in the battle of Talakadu, earning him the title Talkadugonda.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hoysala Empire King Ballal III resisted the Muslim invasion for nearly twenty years but was eventually killed in 1343 CE by Delhi Sultanate forces at the Battle of Madurai.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Gahadavala dynasty :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a Rajput dynasty that ruled parts of present-day Uttar Pradesh and Bihar from the 11th to 12th centuries. The dynasty\u0026rsquo;s capital was located in Banaras, and for a short time, they also controlled Kannauj. The dynasty was established by King Yashovigraha. The first Gahadavala king was Chandradeva, who ruled from 1089 1103.\u003c/li\u003e\r\n\t\u003cli\u003eThe dynasty\u0026rsquo;s dominance peaked under the reign of Govindachandra. The dynasty was overthrown by the invasions of Muhammad of Ghur. The Gahadavalas were succeeded by the Delhi Sultanate in the 12th century, when their last monarch Harishchandra was defeated in battle.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kakatiya dynasty :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a South Indian dynasty that ruled from the 12th to the 14th century. Their territory included most of present-day Telangana and Andhra Pradesh, as well as parts of eastern Karnataka, northern Tamil Nadu, and southern Odisha.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kakatiyas were known for their patronage of art, literature, and architecture, particularly in the form of temple construction. Their architecture is a fusion of Dravidian architecture and Nagara Bhumija styles.\u003c/li\u003e\r\n\t\u003cli\u003eThe name \u0026ldquo;Kakatiya\u0026rdquo; comes from the goddess Kakati, a mother goddess Durga, who was venerated by the dynasty. The Kakatiyas survived until the Turks\u0026rsquo; attack in the 14th century.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Yadava dynasty :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Seuna dynasty, was a Hindu dynasty that ruled the Deccanregion of South India from the 11th to the 14th centuries CE. The dynasty\u0026rsquo;s history dates back to the ninth century.\u003c/li\u003e\r\n\t\u003cli\u003eThe Yadava dynasty ruled for about 300 years as feudatories of the Rashtrakutas and the Chalukyas. The dynasty became paramount in the Deccan under Bhillama (c. 1187\u0026ndash;91), who founded Devagiri (later Daulatabad) as his capital.\u003c/li\u003e\r\n\t\u003cli\u003eAt its peak, the Yadava dynasty ruled a realm stretching from the Narmada river in the north to the Tungabhadra river in the south.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43805", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDevaraya I\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% ! const QUIZ_TITLE = "Medieval History PYQ Test 2";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
