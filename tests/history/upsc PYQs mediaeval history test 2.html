function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

e\r\n\t\u003cli\u003eBalban, also known as Ghiyas ud-Din Balban, was a prominent ruler of the Delhi Sultanate in medieval India. He ruled from 1265 to 1287 and was the last effective ruler of the Slave Dynasty.\u003c/li\u003e\r\n\t\u003cli\u003eBalban believed in the Persian Court model of Kingship and took up the title of Zil-i Ilahi. He also insisted on sijda (prostration) and paibos (kissing monarch\u0026rsquo;s feet) to emphasize that nobles were not equal to him.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTuti-e-Hind :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a title given to Amir Khusrau, which means \u0026ldquo;Parrot of India\u0026rdquo;. Khusrau is also known as the \u0026ldquo;voice of India\u0026rdquo; and the \u0026ldquo;father of Urdu literature\u0026rdquo;. Khusrau was a prominent figure in 13th century Indian music and is considered one of the four great pillars of Persian literature from the 14th century.\u003c/li\u003e\r\n\t\u003cli\u003eHe often described his poems as \u0026ldquo;pearls\u0026rdquo; and referred to himself as the \u0026ldquo;Parrot of India\u0026rdquo;. Alauddin Khalji, a great patron of art and literature, gave Khusrau the title of Tuti-e-Hind.\u003c/li\u003e\r\n\t\u003cli\u003eKhusrau was born in 1253 in the village of Patiali, which was then known as Mominpur or Mominabad, in the Etah district of Uttar Pradesh.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKaiser-i-Hind :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a title given to Mahatma Gandhi by the British government in 1915 for his work during the Boer War (1899-1902). The title was given by the emperor of India for public service between 1900-1947. Gandhi returned the medal in 1920 as part of a national campaign supporting the Khilafat Movement.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDin-i Ilahi :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Divine Faith, was a syncretic religion established by the Mughal emperor Akbar in 1582. The name translates to \u0026ldquo;Religion of God\u0026rdquo; or \u0026ldquo;Divine Faith\u0026rdquo; in Persian.\u003c/li\u003e\r\n\t\u003cli\u003eAkbar\u0026rsquo;s vision was to combine Islam and Hinduism into a single faith, while also incorporating elements of Christianity, Zoroastrianism, and Jainism. He was deeply interested in religious matters and established the Ibadat Khana, or \u0026ldquo;House of Worship\u0026rdquo;, in 1575. This academy provided a place for representatives of all major faiths to meet and discuss theological questions.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement was an ethical system that never had more than 19 adherents.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43713", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max ers of these Iqtas were the trustful agents of the Sultan.\u003c/li\u003e\r\n\t\u003cli\u003eThe Iqtadar central officer was directly answerable to the Sultan, which made it possible to maintain good central control. The system also increased performance and achievements since the top-performing commander received Iqta as payment.\u003c/li\u003e\r\n\t\u003cli\u003eThe Turkish rule in India, under the Delhi Sultanate, lasted for several centuries, from 1206 to 1526. The Turkish rule was eventually succeeded by the Mughal Empire, established by Babur in 1526.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43717", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 1 4 2\u0026nbsp;\u003c/p\u003e", "op  #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e5.\u0026nbsp; Accession of Akbar\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eCodes :\u003c/p\u003e\r\n\r\n\u003cp\u003eA B C D\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}  @font-face { font-family: \u0027serif\u0027;src: url(\u0027https://appx-content-v2.classx.co.in/fonts/serif.ttf\u0027) format(\u0027truetype\u0027); }\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}  @font-face { font-family: \u0027serif\u0027;src: url(\u0027https://appx-content-v2.classx.co.in/fonts/serif.ttf\u0027) format(\u0027truetype\u0027); }\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Battle of Haldighati :\u003cbr /\u003e\r\nIt was fought on June 18, 1576 between the forces of the Mughal emperor Akbar Pratap. The battle took place at Rakt Talaj and the Mewar forces led by Maharana in Khamnore, a mountain pass in the Aravalli mountain range that connects the Rajsamand and Pali districts of Rajasthan. The name Haldighati comes from the yellow-turmeric colored soil of the region,\u003c/p\u003e\r\n\r\n\u003cp\u003eThe battle was a defeat for the Mewar forces, but Maharana Pratap escaped and continued to resist the Mughal Empire. The battle is considered significant for the bravery shown by the Rajputs and Bhils, and for marking a turning point in Mughal expansion into Mewar.\u003c/p\u003e\r\n\r\n\u003cp\u003eNadir Shah\u0026#39;s capture of Delhi :\u0026nbsp;\u003cbr /\u003e\r\nIn 1739, the Iranian ruler Nadir Shah invaded the Mughal realm and captured the Mughal capital of Delhi.\u003c/p\u003e\r\n\r\n\u003cp\u003eNadir Shah\u0026#39;s army defeated the Mughals at the Battle of Karnal on February 24, 1739. The battle lasted less than three hours, and the Mughal emperor Muhammad Shah surrendered.\u003c/p\u003e\r\n\r\n\u003cp\u003eOn March 20, 1739, Nadir Shah entered Delhi with Muhammad Shah as his vassal. The city\u0026#39;s fortifications fired their guns in salute as the conqueror entered.\u003c/p\u003e\r\n\r\n\u003cp\u003eNadir Shah extracted a large tribute from the Mughal king and his nobles. He returned to Persia with a large amount of loot, including the peacock throne, the Koh-i-Noor diamond, and \u0026quot;700 elephants, 4,000 camels and 12,000 horses carrying wagons all laden with gold, silver and precious stones\u0026quot;.\u003c/p\u003e\r\n\r\n\u003cp\u003eDeath of Shivaji Maharaj :\u0026nbsp;\u003cbr /\u003e\r\nShivaji Maharaj died on April 3, 1680, at the age of 50, in the Raigad Fort. The cause of his death is disputed, but British records state that he died of bloody flux after being sick for 12 days.\u003c/p\u003e\r\n\r\n\u003cp\u003eShivaji was enthroned as an independent sovereign in 1674, marking the formal beginning of the Maratha empire. The empire formally existed from 1674 to 1818.\u003c/p\u003e\r\n\r\n\u003cp\u003eAccording to legend, Shivaji\u0026#39;s last word on his deathbed was \u0026quot;Sai\u0026quot;.\u003c/p\u003e\r\n\r\n\u003cp\u003eGrant of charter to East India Company :\u0026nbsp;\u003cbr /\u003e\r\nQueen Elizabeth I granted the East India Company a Royal Charter on December 631, 1600. The charter\u0026#39;s purpose was to facilitate trade in Africa and Asia and to counter competition from the Dutch East India Company.\u003c/p\u003e\r\n\r\n\u003cp\u003eThe charter granted the East India Company the sole right to trade with the East. The company established trading establishments on the east and west coasts of India and in Bengal. The company\u0026#39;s ships first arrived in India in 1608.\u003c/p\u003e\r\n\r\n\u003cp\u003eThe East India Company acted as a part-trade organization and part-nation-state for over two centuries. It made great progress in India, where it acquired trade privileges from India\u0026#39;s Mogul emperors.\u003c/p\u003e\r\n\r\n\u003cp\u003eAccession of Akbar :\u0026nbsp;\u003cbr /\u003e\r\nAkbar succeeded Humayun as Emperor of Hindustan on February 14, 1556, at the age of 13 years and 4 months. The coronation took place in Kalanaur, Punjab, on a newly constructed platform. Akbar was proclaimed Shahanshah, which is Persian for \u0026quot;King of Kings\u0026quot;.\u003c/p\u003e\r\n\r\n\u003cp\u003eAkbar was too young to rule, so Bairam Khan, his tutor and a loyal officer of Humayun, was appointed as his regent.\u003c/p\u003e\r\n\r\n\u003cp\u003eAkbar was born on October 15, 1542, in Umarkot, Sindh. He was Muslim, but he took an interest in the religions of his realm, including Hinduism, Zoroastrianism, and Christianity. He tried to consolidate his empire and promote religious tolerance.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43721", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", " idth:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eShamsa ud-din Iltutmish of the Delhi Sultanate introduced the Iqta system in India. The system was based on the ideas of Muhammad Ghori and was already used in Persia and the Middle East.\u003c/li\u003e\r\n\t\u003cli\u003eThe Iqta system was a powerful tool for centralization. It divided the empire\u0026#39;s area into portions, or \u0026quot;Iqta\u0026quot;, and gave them to the king\u0026#39;s troops, nobility, and officials. The system\u0026#39;s main function was to collect taxes by Muqtis/Iqtedars.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Iqta system had some pros and cons:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePros:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHelped strengthen the Turko-Afghan powers, allowed commanders to command duties, and maintained good central control.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eCons:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRan smoothly under strong Sultans, but problems arose under weak or greedy Sultans. After the passing of a powerful monarch, many Iqtadars would declare their freedom from the Sultan.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJagirdar System:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Delhi Sultanate introduced the jagirdar system in the early 13th century, and it continued during the Mughal Empire. The Jagirdari system was a land tenancy and feudal system.\u003c/li\u003e\r\n\t\u003cli\u003eThe Jagirdari system was part of the mansabdari system, which developed under Akbar.\u003c/li\u003e\r\n\t\u003cli\u003eThe system involved giving lands, or \u0026quot;jagirs\u0026quot;, to Mansabdars in place of salary. The officers who received the lands were called jagirdars. The position of jagirdars was not hereditary.\u003c/li\u003e\r\n\t\u003cli\u003eDuring the Mughal Empire, the jagirdar collected taxes, which paid his salary and the rest to the Mughal treasury. The administration and military authority was given to a separate Mughal appointee.\u003c/li\u003e\r\n\t\u003cli\u003eThe Jagirs were transferable, and no Jagirdar was given the same Jagir for a long time.\u003c/li\u003e\r\n\t\u003cli\u003eThe system is said to have contributed to the weakening of the Mughal state.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAmaram System :\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Vijayanagar Empire introduced the Amaram system. The Amaram system was a political innovation that involved granting land to military chiefs in exchange for their services. The land pieces were called Amaram. The top-grade officers of the army were known as Nayaks or Poligars.\u003c/li\u003e\r\n\t\u003cli\u003eThe Amara-Nayakas were military commanders who governed territories. They collected taxes and other dues from the area\u0026#39;s peasants, craftspeople, and traders. They kept some of the revenue for themselves and to maintain a set number of horses and elephants. In return, the Nayaks swore loyalty to the ruler and had to maintain a number of troops, horses, and elephants for the ruler\u0026#39;s service.\u003c/li\u003e\r\n\t\u003cli\u003eThe Amara-Nayaka system may have been influenced by the Delhi Sultanate\u0026#39;s data System.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMokasa System :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Marathas introduced the Mokasa system.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mokasa system was part of the chauth levy, which helped the Marathas expand beyond the territories of Shivaji. The chauth levy was 25% of the gross revenue or produce from hostile or alien states.\u003c/li\u003e\r\n\t\u003cli\u003eThe Marathas also levied a 10% tax on the collected chauth, called the sardeshmukhi.\u003c/li\u003e\r\n\t\u003cli\u003eThe Marathas were known for their commando actions and well-organized army. Shivaji, the founder of the Maratha Empire, emphasized disciplined training, quality weaponry, and strategic planning.\u003c/li\u003e\r\n\t\u003cli\u003eThe Marathas paid their ordinary soldiers in cash, but paid their military commander: and chiefs through jagir grants, also known as Mokasa or Saranjam. A Saranjam was a land grant given for military service or troop maintenance.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43735", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAditya I\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !i 81717; width:143px; padding:.60px 8px 0cm 5px; height:22px; border-top:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"tab-stops:center 55.45pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e4.\u0026nbsp; \u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp;\u0026nbsp; Cobbler \u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eCodes :\u003c/p\u003e\r\n\r\n\u003cp\u003eA B C D\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSaint Namdev :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a tailor by profession. He was a devotee of Lord Vitthala of Pandharpur and a member of the Varakari Sect.\u003c/li\u003e\r\n\t\u003cli\u003eNamdev was a well-known religious writer from Maharashtra and a companion saint poet of Saint Dnyaneshwar. He was one of the first writers to use the Marathi dialect in his work. He is considered to be a strong follower of the Bhagwat-Dharma, which has influence in Maharashtra and Punjab. Namdev is also known for introducing a tradition called Mahapurusha Sampradaya, which emphasized the cultural unity of the Marathas.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKabir (1398\u0026ndash;1518) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a weaver by profession. He was also a renowned 15th century Indian saint, poet, and social reformer.\u003c/li\u003e\r\n\t\u003cli\u003eKabir was born in Varanasi and raised by a Muslim couple who were also weavers. He became a disciple of the Hindu ascetic Ramananda, and is considered both a Sufi and Brahmin saint. Kabir\u0026rsquo;s poetry draws on both Hinduism and Islam, though he was critical of certain aspects of both faiths.\u003c/li\u003e\r\n\t\u003cli\u003eKabir is respected by Hindus, Muslims, and Sikhs. His writings influenced Hinduism\u0026rsquo;s Bhakti movement, a religious movement in the medieval period that brought religious reforms by adopting the method of devotion to achieve salvation.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRavidas (15th\u0026ndash;16th century) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a cobbler by profession. He was also a poet, devotee, and Gurmukh.\u003c/li\u003e\r\n\t\u003cli\u003eRavidas was born in Varanasi to an untouchable leather-working caste. He spent most of his life with Sufi saints, sadhus, and ascetics. His poems and songs often centered around his low social position.\u003c/li\u003e\r\n\t\u003cli\u003eRavidas was a prominent saint of the Indian Bhakti tradition. He became a disciple of Swami Ramananda of Varanasi and is said to have a direct intuitive vision of the Supreme self. Ravidassias Sikhs believe that Ravidas is their Guru (saint).\u003c/li\u003e\r\n\t\u003cli\u003eThe Khalsa Sikhs have traditionally considered him one of many bhagats (holy person).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSena Nhavi :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is also known as Sant Sena Maharaj, was a barber by profession. He was a member of the Varkari sect, which is dedicated to Lord Vithoba. He was also a disciple of Saint Ramananda.\u003c/li\u003e\r\n\t\u003cli\u003eSena Nhavi was a pious and God-loving man who lived near Pandharapur. He was so immersed in the worship of Lord Vitthal that he once incurred the wrath of a local king. According to legend, Lord Vitthal himself appeared to pacify the king and rescue Sena Nhavi.\u003c/li\u003e\r\n\t\u003cli\u003eIn an abhanga, Sena also refers to his profession as a barber. He sang that barbers are skilled in the \u0026ldquo;art of shaving\u0026rdquo; and support the four caste-system (Varna (Hinduism)).\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43740", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eHaider Ali\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Ariz-i-Mamalik or Dewan-i-Arz was the military department, and it was established much earlier, during the Slave dynasty, not by Alauddin Khilji. It existed during the reign of Balban, who served as Ariz-i-Mamalik before becoming Sultan.\u003c/li\u003e\r\n\t\u003cli\u003eAlauddin Khilji, however, reformed existing departments, especially those related to market control, intelligence, and military recruitment, but he did not establish a new Ariz\u0026rsquo;s department. \u003cstrong\u003eHence, statement (a) is incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe branding system of horses (Dagh system) was not introduced by Balban. It was introduced by Alauddin Khilji and later improved by Muhammad bin Tughlaq.\u003c/li\u003e\r\n\t\u003cli\u003eThis system ensured that soldiers did not present inferior or fake horses during inspections. Each horse was branded with a specific mark to prevent corruption in the army. Therefore, attributing this reform to Balban is wrong, as it rightly belongs to Alauddin Khilji.\u003cstrong\u003e Thus, statement (b) is incorrect.\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatement (c) is also incorrect :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003eAfter \u003cstrong\u003eMuhammad bin Tughlaq (ruled 1325\u0026ndash;1351 CE) \u003c/strong\u003edied, he was not succeeded by his uncle, but by his cousin Firoz Shah Tughlaq. Firoz Shah was the son of Rajab, who was Muhammad bin Tughlaq\u0026rsquo;s father\u0026rsquo;s younger brother. So, the correct relation between them is cousins, not uncle and nephew.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eFiroz Shah Tughlaq (ruled 1351\u0026ndash;1388 CE) \u003c/strong\u003eestablished a special department called Dewan-i-Bandagan, which managed the affairs of slaves (bandagan) under the Sultan. He is known to have kept thousands of slaves who were employed in administration, construction works, and royal service.\u003c/li\u003e\r\n\t\u003cli\u003eApart from this, he also established other departments like Dewan-i-Khairat (for charity and dowries for poor girls) and Dewan-i-Kohi (for agricultural development). His reign is noted for administrative reforms and public welfare measures rather than military conquest. \u003cstrong\u003eThus, statement d is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43746", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important 03c/p\u003e\r\n\r\n\u003cp\u003e4. The Qadiri order of sufis was first introduced in India by Shaikh Niamtulhha and Makhdum Muhammad Jilani\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of these statement are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eShaykh Ahmad Sirhindi (1564-1624) was an Indian Sufi scholar, mystic, and theologian. He was a contemporary of Akbar and Jahangir. He is credited with reviving orthodox Sunnite Islam in India, which was a reaction to the religioustendencies during the reign of the Mughal emperor Akbar.\u003c/li\u003e\r\n\t\u003cli\u003eNasiruddin Mahmud Chirag-Dehlavi was a 14th-century mystic poet and a Sufi saint of the Chishti Order. He was a disciple of Nizamuddin Auliya and later became his successor. Chiragh-e-Dehli translates to \u0026lsquo;The Illuminated Lamp of Delhi\u0026rsquo;.\u003c/li\u003e\r\n\t\u003cli\u003eAurangzeb being a contemporary of Shaikh Salim Chisti is incorrect. Shaikh Salim Chisti was a revered Sufi saint during Akbar`s reign, much before Aurangzeb\u0026rsquo;s time.\u003c/li\u003e\r\n\t\u003cli\u003eThe Qadiri order of Sufis being first introduced in India by Shaikh Niamtullah and Makhdum Muhammad Jilani is correct. They were instrumental in bringing this order of Sufism into India.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "del ak-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRamananda\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTulsidas\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWho among the following was the first Bhakti Saint to use Hindi for the propa gation of his message ?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRamananda (1360-1470) was the first Bhakti saint to use Hindi to spread his message. He was a devotional poet and saint of the Vaishnava sect in Northern India.\u003c/li\u003e\r\n\t\u003cli\u003eRamananda is known for communicating in vernacular Hindi and accepting disciples of all castes. He also accepted disciples without discrimination based on their gender, class, caste, or religion. Many of his disciples were Muslims.\u003c/li\u003e\r\n\t\u003cli\u003eRamananda is credited with popularizing the Bhakti movement in North India. He popularized the devotion of Ram and Sita. Kabir is one of his twelve most well-known students.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKabir (1440\u0026ndash;1518) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Indian poet and saint who is revered by Hindus, Muslims, and Sikhs. His writings influenced Hinduism\u0026rsquo;s Bhakti movement, and his verses are found in Sikhism\u0026rsquo;s scripture Guru Granth Sahib. Kabir\u0026rsquo;s work is read globally and has been alluded to in many Bollywood films.\u003c/li\u003e\r\n\t\u003cli\u003eKabir is considered both a Sufi and Brahmin saint. He is said to have been born in or near Benares to a family of Muslim weavers before becoming a disciple of the Hindu ascetic Ramananda.\u003c/li\u003e\r\n\t\u003cli\u003eKabir\u0026rsquo;s full name was Kabir Das.\u003c/li\u003e\r\n\t\u003cli\u003eThe religious community Kabir Pant defines Kabir as the creator of Sant Mat sects, which are spread across central and North India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTulsidas (1511-1623) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a Vaishnava Hindu poet and saint. His real name was Rambola Dubey. He is known for his devotion to the deity Rama. His main work, Ramcharitmanas, is a Hindi poem that is the most popular version of the story of Rama.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDadu Dayal (1544\u0026ndash;1603) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a poet-saint, religious reformer, and mystic in the Bhakti tradition from Gujarat, India. His name means \u0026ldquo;the brother of compassion\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eDadu Dayal was born in Ahmedabad in 1544 and settled in Rajasthan, where he became a traveling ascetic and religious preacher. He was a contemporary of Emperor Akbar, who is said to have been one of his followers. Dadu Dayal is known for speaking against formalism and priestcraft, and for opposing the Vedas and external form of worship. He attained Samadhi in Naraina in Jaipur district in 1601, and established the Dadupanth in his lifetime.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19",  the Cholas controlling parts of present-day Myanmar, Malaysia, and Indonesia. It also established the Chola Navy\u0026rsquo;s military capabilities and dominance in the region.\u003c/li\u003e\r\n\t\u003cli\u003eThe expedition is considered unusual and mysterious in South Asian history. It is the only large-scale long-distance naval attacklaunched from South Asia in recorded history.\u003c/li\u003e\r\n\t\u003cli\u003eThe Shailendra empire was based in Java and spread to other parts of Southeast Asia, including Sumatra, Bali, and parts of modern-day Malaysia and Thailand. The Shailendra dynasty declined in the 9th century, but their influence on Southeast Asian culture and religion continued.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43751", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eHe was treacherously stabbed to death by one of his ambitious\u0026nbsp;nobles\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAli Mardan Khan did not introduce the system of revenue farming in Bengal. Instead, Murshid Quli Khan, also known as Mohammad Hadi, is credited with introducing the system during his tenure as the first Nawab of Bengal from 1717\u0026ndash;1727.\u003c/li\u003e\r\n\t\u003cli\u003eThe revenue farming system was introduced during the reign of the Mughal emperor Jahandar Shah. Under this system, the revenue farmer kept nine-tenths of the collection as his collection charges and paid the government the remaining tenth.\u003c/li\u003e\r\n\t\u003cli\u003eMurshid Quli Khan also reorganized Bengal\u0026rsquo;s finances by transferring large parts of jagir lands into Khalisah lands. He also recruited revenue farmers and officials from local merchant-bankers and zamindars. Maharaja\u003c/li\u003e\r\n\t\u003cli\u003eRanjit Singh set up modern foundries to manufacture cannons at Lahore. Ranjit Singh was the founder and maharaja (1801\u0026ndash;39) of the Sikh kingdom of the Punjab. He invested in infrastructure in the 1800s, establishing raw materials mines, cannon foundries, gunpowder, and arm factories. He also employed educated Muslims from Lahore and nearby cities to help him set up the factories.\u003c/li\u003e\r\n\t\u003cli\u003eRanjit Singh also set up a series of gunpowder and shot (the precursor of the modern bullet) \u0026ldquo;karkhanas\u0026rdquo;. He employed Muslim gunners to man the foundries.\u003c/li\u003e\r\n\t\u003cli\u003eSawai Jai Singh II (1688-1743) had Euclid\u0026rsquo;s Elements of Geometry translated into Sanskrit. Sawai Jai Singh was a Rajput king and a scholar of mathematics and astronomy. He was also a town planner and built the city of Jaipur.\u003c/li\u003e\r\n\t\u003cli\u003eSawai Jai Singh also commissioned the Jantar Mantar observatories, which are a collection of large astronomical instruments used to calculate the movement of celestial bodies and local time.\u003c/li\u003e\r\n\t\u003cli\u003eTipu Sultan, a Muslim ruler, gave money for the construction of the goddess Sharda temple in Sringeri after it was looted by Maratha horsemen in 1791. The temple is now home to the damaged Sharada Image.\u003c/li\u003e\r\n\t\u003cli\u003eTipu Sultan\u0026rsquo;s close relationship with Sringeri began in 1785 when he issued a decree regranting the Shringeri Matha.\u003c/li\u003e\r\n\t\u003cli\u003eIn addition to funds, Tipu also sent a letter requesting the Jagadguru to perform Hindu worship and penance for \u0026ldquo;good showers and crops\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eTipu Sultan also donated a sandalwood idol of Sharada, a silver palanquin, and a spatika linga.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43753", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u0 ): He wanted to save the kingdom from further degenration and disintegration\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2003)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSaluva Narasimha Deva Raya, who served as a powerful general and minister under the weakening Sangama dynasty of the Vijayanagara Empire, did indeed put an end to the old dynasty and assumed the royal title around 1485 CE, thereby establishing the Saluva dynasty. \u003cstrong\u003eThis makes the Assertion (A) true.\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe empire during this period was facing political instability, internal revolts, and external invasions by the Bahmanis and Gajapatis, which created conditions ripe for a strong military leader to seize control.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the Reason (R) given \u0026mdash; that he took power to save the kingdom from further degeneration and disintegration \u0026mdash; is not fully supported by historical evidence.\u003c/li\u003e\r\n\t\u003cli\u003eAlthough Saluva Narasimha may have claimed to act in the interest of preserving the empire, there is no conclusive proof that this was his principal or only motivat h:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWho was the last ruler of the Tughlaq dynasty..............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eNasir-ud-Din Mahmud Shah Tughlaq (1394\u0026ndash;1413) was the last ruler of the Tughlaq dynasty. He was also known as Nasiruddin Mohammad Shah and the Darvesi King.\u003c/li\u003e\r\n\t\u003cli\u003eNasir-ud-Din Mahmud Shah Tughlaq was the last sultan of the Islamic Delhi Sultanate. In 1398, Timur invaded India during his reign, and the Tughlaq dynasty ended soon after. The next sultan of the Delhi Sultanate was the first of the Sayyid Dynasty.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFiroz Shah Tughlaq (1309 - 1388) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a Muslim ruler from the Tughlaq dynasty who ruled the Sultanate of Delhi from 1351 to 1388. He is known as the father of the irrigation approach in India and is considered the third and most powerful king of the Tughlaq dynasty.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some of his achievements:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Irrigation: \u003c/strong\u003eBuilt the biggest irrigation network of his time.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eQutub Minar: \u003c/strong\u003eRepaired the Qutub Minar after it was damaged by an earthquake.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Islamic Law:\u003c/strong\u003e Encouraged the study of Islamic Law and compiled many books on the subject.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Taxes:\u003c/strong\u003e Imposed taxes including Kharaj, Zakat, Kham, and Jaziya.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Infrastructure: \u003c/strong\u003eDeveloped infrastructure in his kingdom.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Inheritance: \u003c/strong\u003eProvided the principle of inheritance to the armed forces.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Land survey: \u003c/strong\u003eSurveyed all farmland in the kingdom.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Officer salaries: \u003c/strong\u003ePaid officers through land revenue income of towns instead of real money.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFiroz Shah Tughlaq also:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eForbade Muslim women from visiting holy people\u0026rsquo;s graves to pray. Demolished Hindu temples, as well as their books and literature.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eNasiruddin Nasrat Shah (1518\u0026ndash;1533) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was the second Sultan of Bengal and a member of the Hussain Shahi dynasty. He was born into a wealthy Sunni Muslim family and succeeded his father, Alauddin Husain Shah, in 1519.\u003c/li\u003e\r\n\t\u003cli\u003eNasrat Shah continued his father\u0026rsquo;s expansionist policies, but by 1526, he had to contend with the Mughal ascendency in the Battle of Ghaghra.\u003c/li\u003e\r\n\t\u003cli\u003eHe also extended his territory into Tirhut (northern Bihar) and established his headquarters at Hajipur. Nasrat Shah died in 1533.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43762", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: brea u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statement about Sikh Gurus..............\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Banda Bahadur was appointed as the military leader of the Sikhs By Guru Gobind Singh after Guru Ram Das\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Guru Arjan Dev became the Sikh Guru after Guru Ram Das\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Guru Arjan Dev gave to Sikhs their own sript Gurumukhi\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich one of the statement given above is/are correct ?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eGuru Gobind Singh, the tenth Sikh Guru, appointed Baba Banda Singh Bahadur as the military leader of the Sikhs in 1708.\u003c/li\u003e\r\n\t\u003cli\u003eBanda Bahadur was a prominent figure in Sikh history. In the early 18th century, Sikhs faced intense persecution under Mughal rule. Banda Bahadur and his forces fought a series of military campaigns against the Mughal rulers and their allies. In 1710, he captured the city of Sirhind, which was known for its brutal treatment of Sikhs.\u003c/li\u003e\r\n\t\u003cli\u003eBanda Bahadur was a follower of Guru Gobind Singh and converted from Hinduism to become a Sikh. He left home at the age of 15 after seeing a dying deer, and became a yogi. Guru Gobind Singh made him realize he was a Sikh and needed to fight for them.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBanda Bahadur fought in the following battles:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Battle of Sonipat\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Battle of Samana\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Battle of Kapuri\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Battle of Sadhaura\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Battle of Ropar (1710)\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Battle of Chappar Chiri\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Battle of Sirhind\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Battle of Saharanpur\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eGuru Arjan Dev became the fifth Sikh Guru after the death of his father, Guru Ram Das, in 1581.\u003c/li\u003e\r\n\t\u003cli\u003eGuru Arjan Dev was born on April 15, 1563 in Goindwal Sahib, India. He played a significant role in shaping Sikhism as a religion and a way of life.\u003c/li\u003e\r\n\t\u003cli\u003eHe was the first Guru to serve as both the temporal and spiritual head of the Sikhs. He also completed the Golden Temple at Amritsar, where all Sikhs could worship.\u003c/li\u003e\r\n\t\u003cli\u003eGuru Arjan Dev was executed by the fourth Mughal Ruler, Jahangir. After his execution, his son Hargobind became the sixth Guru in 1606.\u003c/li\u003e\r\n\t\u003cli\u003eGuru Angad Dev, the second Sikh Guru, invented the Gurmukhi script in the mid-16th century. The word \u0026quot;Gurmukhi\u0026quot; translates to \u0026quot;from the mouth of the guru\u0026quot;.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eGuru Angad Dev taught and spread the Gurmukhi script at the suggestion of Guru Nanak Dev, the founder of Sikhism.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eGuru Angad Dev developed the Gurmukhi script from the Landa scripts to correct inadequacies in the Lahnda script. The Gurmukhi script is predominantly used in present-day Punjab, India.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe Guru Granth Sahib, the holy book of the Sikh religion, is written in the Gurmukhi script.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43763", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eShankaracharya - Ramanuja - Chaitanya\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003 cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat was the immediate reason for Ahmad Shah Abdali to invade India and fight the third battle of Panipat?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2010)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAhmad Shah Abdali, also known as Ahmad Shah Durrani, invaded India in October 1759 to avenge the Marathas\u0026rsquo; expulsion of his viceroy, Timur Shah, from Lahore. The Marathas were gaining power in northern India and Abdali saw the expulsion as a direct challenge to his authority.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Battle of Panipat :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a series of three military engagements that took place in northern India in 1526, 1556, and 1761. The battles were fought at Panipat, a plain that was suitable for cavalry movements.\u003c/li\u003e\r\n\t\u003cli\u003eThe First Battle of Panipat took place on April 21, 1526. The battle was fought between the invading forces of Babur and the Lodi Empire. Babur\u0026rsquo;s forces defeated the much larger army of Ibrahim Lodi, Sultan of Delhi. The battle marked the beginning of the Mughal Empire and the end of the Delhi Sultanate.\u003c/li\u003e\r\n\t\u003cli\u003eBabur\u0026rsquo;s victory was due to his tactics and the use of guns. Babur\u0026rsquo;s new tactics included the Tulghuma and the Araba. The sound of the canons frightened Lodhi\u0026rsquo;s war elephants. The Lodi troops were also lacking in artillery skills.\u003c/li\u003e\r\n\t\u003cli\u003eThe Second Battle of Panipat took place on November 5, 1556. The battle was fought between the forces of Samrat Hem Chandra Vikramaditya, also known as Hemu, and the army of Akbar. The battle was a decisive victory for Akbar\u0026rsquo;s generals Khan Zaman I and Bairam Khan.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWhy All Battle Fought in Panipat Only?\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBattles were fought in Panipat due to its strategic location, political significance, and neutral ground status.\u003c/li\u003e\r\n\t\u003cli\u003ePanipat is located on the Grand Trunk Road, a trade route that connects Central Asia and the Indian subcontinent. It\u0026rsquo;s also 90 kilometers north of Delhi, which has been the seat of the Indian ruler since the Chauhan Vansh.\u003c/li\u003e\r\n\t\u003cli\u003ePanipat\u0026rsquo;s climatic conditions are also suitable for long battles, with a short rainy season and a long dry season.\u003c/li\u003e\r\n\t\u003cli\u003eThe battles of Panipat had a significant impact on India\u0026rsquo;s history and helped shape the country\u0026rsquo;s political and cultural landscape.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43772", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% g\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Buddha was by that time considered as one of the incarnation of Vishnu and thus became a part of Vaishnavism\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The invading tribes from central Asia till the time of last Gupta king adopted Hidusm and persecuted Buddhists\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Kings of Gupta dynasty were strongly opposed to Buddhism\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statement given above is/are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDuring the early medieval period, Buddhism began to lose its distinct identity as Buddha himself was absorbed into Hinduism. He was considered the ninth incarnation (avatar) of Lord Vishnu under Vaishnavism. This religious synthesis caused many followers to gradually merge back into Hinduism, leading to a decline in separate Buddhist institutions and teachings. Thus, this was one of the main reasons for the decline of Buddhism in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Central Asian tribes, such as the Kushanas and later the Huns, did invade India, but it is incorrect to say that they \u0026ldquo;adopted Hinduism and persecuted Buddhists.\u0026rdquo; In fact, some rulers like Kanishka (a Kushana king) were great patrons of Buddhism, and Buddhism flourished under them. Though the Huns did cause destruction, their attacks affected many religious centers in general and not only Buddhist ones. Hence, this statement is not entirely true.\u003c/li\u003e\r\n\t\u003cli\u003eThe Gupta kings were not opposed to Buddhism. They were primarily Hindus who followed Vaishnavism or Shaivism but were known for their religious tolerance. Buddhism and Jainism both received patronage during the Gupta period. Buddhist scholars like Vasubandhu and the flourishing of Nalanda University under Gupta rule show their liberal attitude. Therefore, it is wrong to say the Gupta rulers persecuted Buddhists or opposed Buddhism.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eOnly Statement 1 is correct\u003c/strong\u003e because the assimilation of Buddha into Hinduism as an avatar of Vishnu reduced Buddhism\u0026rsquo;s separate identity.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThus , the correct answer is (A) \u0026nbsp;1 Only\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43774", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} i question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe correct answer is (B) 2 and 3 only.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Meditation and control of breath:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis statement is not entirely correct for Sufi practices. Meditation and breath control (pranayama) are features more commonly associated with yogic and Hindu spiritual traditions. While Sufis did engage in meditation (muraqaba) and remembrance of God (zikr), their practices did not emphasize yogic breath control as a formal spiritual discipline. Hence, this statement is partially correct but not a defining Sufi feature, so it is excluded in the final answer.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Severe ascetic exercises in a lonely place:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis statement is correct.\u003c/li\u003e\r\n\t\u003cli\u003eSufi mystics often practiced asceticism (zuhd) and solitude (khalwa) to purify their souls and detach from worldly desires. They believed spiritual progress required living a simple, disciplined, and detached life. Many Sufis meditated and prayed in isolation to strengthen their connection with God. Hence, this statement accurately represents an important Sufi practice.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Recitation of holy songs to arouse a state of ecstasy in their audience:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis statement is correct.\u003c/li\u003e\r\n\t\u003cli\u003eSufis practiced sama\u0026lsquo; \u0026mdash; the recitation or singing of devotional songs, hymns, or poetry \u0026mdash; to create an atmosphere of spiritual ecstasy and divine love. This was meant to bring both the singer and listeners closer to God through intense emotional and spiritual experience.\u003c/li\u003e\r\n\t\u003cli\u003eIn India, this tradition evolved into qawwali, popularized by Chishti Sufis like Khwaja Moinuddin Chishti and Amir Khusrau. Hence, this is an authentic and famous Sufi practice.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "413", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43775", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n
