atus of a government official and military generals. Every civil and military officer was given a \u0026ldquo;mansab\u0026rdquo;, which determined their salaries and allowances.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mansabdari system allowed Akbar to maintain control over a large army and ensure a sense of loyalty among his officers. It also helped in the efficient collection of revenue and the smooth functioning of the empire.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43679", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1-2-3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: brea width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following European mis sions during the Mughal period............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1990)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Thomas Roe\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Tavernier\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Rudolf Acquaviva\u003c/p\u003e\r\n\r\n\u003cp\u003eThe correct chronological order of their visits is :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe correct chronological order of the European missions during the Mughal period is 3-1-2.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003cstrong\u003eSir Thomas Roe :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an English diplomat and member of the House of Commons who served as the first English ambassador to the Mughal court from 1615\u0026ndash;1619. His mission was to ensure the safety of the British East India Company\u0026rsquo;s factory in Surat.\u003c/li\u003e\r\n\t\u003cli\u003eRoe\u0026rsquo;s arrival in 1615 was a significant event in Indian history and the first step towards establishing the British East India Company as a power in the subcontinent. Roe was successful in securing a royal charter that gave the Company the freedom to trade throughout the Mughal territory.\u003c/li\u003e\r\n\t\u003cli\u003eRoe\u0026rsquo;s mission faced difficulties from the beginning due to the poor quality of gifts he brought for the emperor. He spent almost four years at the Mughal court, but returned to England in 1619 without the trade agreement he sought.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJean-Baptiste Tavernier (1605-1689) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a French gem merchant and traveler who visited India six times between 1630 and 1668. He is best known for discovering the 116-carat diamond.\u003c/li\u003e\r\n\t\u003cli\u003eTavernier\u0026rsquo;s second journey began in September 1638 and lasted until 1643. During this expedition, he traveled to the court of Mughal Emperor Shah Jahan and made his first trip to the diamond mines.\u003c/li\u003e\r\n\t\u003cli\u003eTavernier\u0026rsquo;s travels and experiences are described in his two-volume book Les six voyages de Jean Baptiste Tavernier (The six voyages of Jean Baptiste Tavernier), which was published in 1676. An abridged English translation of the book was published in 1677.\u003c/li\u003e\r\n\t\u003cli\u003eTavernier described the social life in India during the Mughal period as hierarchical, with status determined by caste and high social status for priests and kings. He also said that sati and child marriage were common practices.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRodolfo Acquaviva (2 October 1550 \u0026ndash; 25 July 1583) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Italian Jesuit missionary and priest in India who served the court of Akbar the Great from 1580 to 1583. He was killed in 1583 and beatified in 1893.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingpara 3cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 4 are correctly matched\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3 and 4 are correctly matched\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following pairs: Vaisnava Saints: Region of strong following : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1990)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Ramanujacharya : South India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Chaitanya : Central India\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Vallabhacharya : Gujarat and Brajarea\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Ramanand : North India\u003c/p\u003e\r\n\r\n\u003cp\u003eOf these pairs:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRamanujacharya, also known as Ramanuja, was born in 1017 CE in Sriperumbudur, a small village in Tamil Nadu. He was a Vedic philosopher, social reformer, and theologian who traveled across India advocating for equality and social justice. His ultimate goal was to incorporate the Vedic way of life into society.\u003c/li\u003e\r\n\t\u003cli\u003eRamanujacharya is considered the founder of the Vishishtadvaita philosophy.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHis philosophical theses include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Consciousness is always consciousness of some object distinguished by a characteristic\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Consciousness is itself a property\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Individuals are real\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRamanujacharya\u0026rsquo;s commentaries on the Vedas, Brahma-sutras, and Bhagavadgita provided an intellectual basis for the practice of bhakti (devotional worship).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eChaitanya Mahaprabhu :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ewas born in 1486 in Nabadwip, Nadia, West Bengal. Nabadwip is now in present-day West Bengal. Chaitanya was a Hindu mystic and a saint in the Krishna Bhakti cult. He is considered an incarnation of Lord Krishna and a proponent of the Vedantic philosophy of Achintya Bheda Abheda.\u003c/li\u003e\r\n\t\u003cli\u003eChaitanya\u0026rsquo;s mode of worshiping Krishna through dance and song had a significant impact on Vaishnavism in Bengal. He is also known for popularizing devotion to Lord Krishna.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eVallabhacharya :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ewas born in 1479 to a brahmin family in Nathdwara, Rajasthan, India. He is the founder of the Shuddhadvaita Vedanta philosophy and the Vallabhacharya devotional sect. Vallabhacharya is also known as the writer of sixteen \u0026ldquo;stotras\u0026rdquo; (tracts) and several commentaries on the Bhagawata Purana.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRamananda :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ewas a 14th-century Vaishnava devotional poet saint who lived in the Gangetic basin of northern India. He was also a North Indian Brahman (priest) who lived from around 1400 to 1470.\u003c/li\u003e\r\n\t\u003cli\u003eRamananda is also known as Swami Ramanand, Ramadatta, and Ramanand. He is credited for bringing the Ramanandi sect back to life. The Hindu tradition recognizes him as the founder of the Ramanandi Sampradaya, the largest monastic Hindu renunciant community in modern times.\u003c/li\u003e\r\n\t\u003cli\u003eRamananda was a vedanta teacher and a part of the bhakti movement. The word \u0026ldquo;bhakti\u0026rdquo; is Sanskrit for \u0026ldquo;devotion\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eRamananda established a Vaishnava religious school based on love and devotion. He traveled to several places in North India and popularized the worship of Rama and Sita.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43681", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eChaitanya\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\ e\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWho among the following, was known as a \u0026ldquo;Nirguna\u0026rdquo; reformer?\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1990)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eKabir and Nanak were the main proponents of Nirguna, a group of poet-saints who praised God without form or attributes.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eNirguna bhakti :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the worship of a formless God. The word \u0026ldquo;nirguna\u0026rdquo; comes from the Sanskrit words \u0026ldquo;nir\u0026rdquo;, which means \u0026ldquo;without\u0026rdquo;, and \u0026ldquo;guna\u0026rdquo;, which means \u0026ldquo;properties\u0026rdquo;. The term also includes the Sanskrit word \u0026ldquo;bhakti\u0026rdquo;, which means \u0026ldquo;devotion\u0026rdquo; or \u0026ldquo;faithfulness\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eNirguna bhakti is a part of the Bhakti movement, which has two divisions:\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e1. Nirguna and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Saguna.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSaguna worship is the worship of God with form, while Nirguna worship is the worship of God without form.\u003c/li\u003e\r\n\t\u003cli\u003eThe ultimate goal of Nirguna Bhakti is to achieve enlightenment or moksha, which is the liberation from the cycle of birth and death.\u003c/li\u003e\r\n\t\u003cli\u003eNirguna poet-saints rejected the Brahmins\u0026rsquo; supremacy, all caste-based customs, and the practice of idolatry. They valued personalencounters with God, and although they referred to him by various names and titles, their god was formless, everlasting, non incarnate, and ineffable.\u003c/li\u003e\r\n\t\u003cli\u003eNirguna Bhakti is devotion that lacks any desire for personal gain and is not motivated by any of the three gunas:\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e1. \u003cstrong\u003eSattva: \u003c/strong\u003ePurity, harmony, goodness\u003c/p\u003e\r\n\r\n\u003cp\u003e2. \u003cstrong\u003eRajas:\u003c/strong\u003e Passion, driven, egoistic\u003c/p\u003e\r\n\r\n\u003cp\u003e3. \u003cstrong\u003eTamas: \u003c/strong\u003eNegative, disorder, lethargy\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eKabir \u003c/strong\u003e(1440-1518) was a powerful figure in the 15th century monotheistic movements. He was a member of a weaver family who converted to Islam.\u003c/li\u003e\r\n\t\u003cli\u003eNirguna saints also opposed the caste system and religious discrimination. They encouraged religious tolerance and preached Hindu-Muslim unity.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDuring the Mughal period, the Zabti system was the standard system for assessing land and fixing revenue. Under this system, peasants were given the option to pay land revenue in cash or kind, whichever was more convenient. However, cash was the preferred method of payment.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Zabti system :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a land revenue system developed during the Mughal period in India. The system was also known as the Dahsala system and was introduced by Raja Todarmal, a minister for Akbar. The term \u0026ldquo;zabti\u0026rdquo; means \u0026ldquo;fixed\u0026rdquo; or \u0026ldquo;systematic\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Zabti system included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Cultivated yields\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Pricing of individual crops\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Measurement of the land\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Fixing the cash revenue of the crop yielding process\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Fixed rupees for payment in crop cultivation\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Fixed land rate of the cultivating system\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe system was developed by Akbar as a solution to the inefficient revenue syst ty and corruption of the nobility.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eAurangzeb\u0026rsquo;s policies: \u003c/strong\u003eThe empire faced the nature and policies of Aurangzeb, including his religious persecution of Hindus.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;The size of the empire:\u003c/strong\u003e The empire\u0026rsquo;s immense size resulted in thinning resources and weakening the center.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Regional powers: \u003c/strong\u003eThe empire faced challenges from regional powers. The Mughal Empire\u0026rsquo;s decline was ultimately sealed by British colonial expansion.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43686", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBhaga\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{ov =\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Qila-i-Kuhna Mosque, also known as the Mosque of the Old Fort, is a monument built by Sher Shah Suri in 1541. The mosque is located inside the Purana Qila (Old Fort) in Delhi, India.\u003c/li\u003e\r\n\t\u003cli\u003eSher Shah Suri built the mosque for his own use after defeating Humayun and capturing the fort and Agra city. The mosque is considered a symbol of his royal aspirations.\u003c/li\u003e\r\n\t\u003cli\u003eThe mosque is a large, single-aisled mosque that would have served as the sultan\u0026rsquo;s Jami, or Friday mosque.\u003c/li\u003e\r\n\t\u003cli\u003eThe prayer hall inside measures 51.20m by 14.90m and has five arched prayer niches or mihrabs set in its western wall.\u003c/li\u003e\r\n\t\u003cli\u003eThe mosque is considered an architectural marvel of the Pre-Mughal era and features a beautiful fusion of building materials such as red sandstone, granite, and marble.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Atala Masjid :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a 14th-century mosque in Jaunpur, Uttar Pradesh, India. Sultan Ibrahim Shah Sharki built it in 1408 AD, on the foundations laid by Sultan Firuz Shah Tughluq III in 1356.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBara Sona Masjid :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Baraduary Masjid, is a rectangular brick and stone structure in the Malda district of India. It\u0026rsquo;s the largest remaining structure in Gaur, a ruined city on the border of India and Bangladesh.\u003c/li\u003e\r\n\t\u003cli\u003eThe name Bara Sona Masjid translates to \u0026ldquo;Great Golden Mosque\u0026rdquo; because its domes were originally gilded with gold.\u003c/li\u003e\r\n\t\u003cli\u003eSultan Nusrat Shah built it in 1526 AD. The mosque is 50.4 meters by 22.8 meters and has 11 arched openings. It\u0026rsquo;s located on the western side of a raised quadrangle, with an entrance gateway and a lake facing it. The east and north gateways remain, forming an open entrance courtyard.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Quwwat-ul-Islam mosque :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Great Mosque of Delhi or the Qutub Mosque, is located in Delhi\u0026rsquo;s Qutub complex.\u003c/li\u003e\r\n\t\u003cli\u003eThe mosque\u0026rsquo;s name translates to \u0026ldquo;Glory of Islam\u0026rdquo;. The mosque\u0026rsquo;s construction began in 1197 by Qutb-ud-din Aibak, the founder of the Slave dynasty, and is made from the remains of 27 demolished Jain temples. The mosque\u0026rsquo;s architecture includes cloisters around a courtyard, an arched facade, and a sanctuary to the west. The mosque is built from red sandstone, gray quartz, and white marble, and is thought to be inspired by the iron \u0026ldquo;Pillar of the Law\u0026rdquo; that stands in the courtyard.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43695", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u0 ng. The festival is also known as Nowruz, and is celebrated in many countries, including Iran, Afghanistan, and India.\u003c/li\u003e\r\n\t\u003cli\u003eBalban introduced the festival to impress people with his wealth and power. The festival is a Zoroastrian tradition that dates back about 3,000 years. It was celebrated by Zoroastrians in Persia, who migrated to India in the 7th century.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43697", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eZiauddin Barani\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !i dth:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRashtrakutas\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMarathas\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the map given below:\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1994)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cimg height=\"271\" src=\"https://appx-content-v2.classx.co.in/paperimages/1750481468_1750481468532285_thump.png\" width=\"273\" /\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe shaded area in the map shows the kingdom of the :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Maratha Empire or the Maratha Confederacy was a power that dominated a large portion of the Indian subcontinent in the 18th century. The empire formally existed from 1674 with the coronation of Chhatrapati Shivaji and ended in 1818 with the defeat of Peshwa Bajirao II.\u003c/li\u003e\r\n\t\u003cli\u003eThe Maratha Empire brought an end to the chaos that prevailed in the Deccan Plateau, as a result of the expansion and advent of the Mughal Empire into south India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Satavahanas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was an ancient Indian dynasty that ruled from the mid-1st century BCE to the early 3rd century CE. The dynasty\u0026rsquo;s capital was Pratishthana (modern Paithan) in the Aurangabad district of Maharashtra. The Satavahanas ruled over present-day Andhra Pradesh, Maharashtra, and Telangana. They also ruled over parts of Gujarat, Karnataka, and Madhya Pradesh.\u003c/li\u003e\r\n\t\u003cli\u003eThe Satavahanas were the first native Indian kings to issue their own coins. The coins had the rulers\u0026rsquo; portraits on them and the coin legends were in Prakrit. Some reverse coin legends are in Tamil, Telugu, and Kannada. The most common feature of the Satavahanas\u0026rsquo; coinage is the arched hill or Hill Symbol, popularly known as Chaitya symbol.\u003c/li\u003e\r\n\t\u003cli\u003eThe Satavahanas\u0026rsquo; official language was Prakrit, but the script was Brahmi. The Satavahanas also used Sanskrit in political inscriptions, but rarely.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome important rulers of the Satavahana Dynasty include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eSimuka: \u003c/strong\u003eThe founder of the Satavahana Dynasty. He built Buddhist and Jain temples.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eSatakarni I:\u003c/strong\u003e The third king of the Satavahanas. He was the first to expand the empire through military conquests.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eVijaya Satakarni:\u003c/strong\u003e The last ruler of the Satvahana dynasty.\u003c/li\u003e\r\n\t\u003cli\u003eThe Satavahanas restored peace throughout the Deccan area after the Maurya dynasty and fought off foreign invasions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Chalukyas of Badami, also known as the Chalukyas of Vatapi :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a dynasty that ruled parts of Southern and Central India from 543 to 753 CE. Their capital was Vatapi, which is now known as Badami and is located in the Bijapur district of Karnataka.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chalukyas of Badami were the first of three related Chalukya dynasties. The other two dynasties were the Eastern Chalukyas and the Western Chalukyas. The Eastern Chalukyas ruled from the death of Pulakesin II in 642 AD until the 11th century. The Western Chalukyas were descendants of the Badami Chalukyas.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chalukyas of Badami ruled over an area that included the entire state of Karnataka and most of Andhra Pradesh. Their rule was a landmark in the history of Bagalkote.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chalukyas of Badami period was a time of Hindu culture and spirituality revival. The kings encouraged Vaishnavism, Shaivism, Shakta cults, and Jainism. Women were also respected in society. The Chalukyas came to an end in 753 AD when Kirtivarman II was deposed by Dantidurga.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Rashtrakutas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey were a royal dynasty that ruled parts of the Indian subcontinent from the 6th to the 10th century. The name \u0026ldquo;Rashtrakuta\u0026rdquo; is Sanskrit for \u0026ldquo;country\u0026rdquo; and \u0026ldquo;chieftain\u0026rdquo;. The Rashtrakutas were small clan heads in different parts of India during the time of the Mauryan Emperor Ashoka the Great (3rd century BCE).\u003c/li\u003e\r\n\t\u003cli\u003eThe Rashtrakutas were a powerful polity that controlled territories in north and south India for almost 200 years. The Rashtrakutas promoted and expanded north Indian traditions and policies in south India. The Rashtrakutas were a medieval Hindu dynasty that ruled much of the Deccan and southern India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rashtrakutas were officers of Rashtra (province) under the early Chalukyas of Badami. The Rashtrakutas had a monarch and feudatories based administration. The realm became more feudalized with each Rashtrakuta king\u0026rsquo;s reign.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rashtrakutas\u0026rsquo; contributions include the Kailasanatha temple at Ellora, the Kashivishvanatha temple, and the Jain Narayana temple at Pattadakal. The Kailasanatha temple is carved out of a massive block of rock and has figures of elephants and lions on the central face of the plinth.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kashivishvanatha temple and the Jain Narayana temple are both UNESCO World Heritage Sites.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": ha Confederacy. The Scindia clan established its rule over Gwalior, forming one of the strongest Maratha states in northern India during the 18th and 19th centuries.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eSimilarly, the Holkar dynasty, also a Maratha royal house, ruled as Maratha Rajas and later as the Maharajas of Indore in central India. They remained influential until 1818 when the Maratha Empire was annexed by the British.\u003c/li\u003e\r\n\t\u003cli\u003eThe Gaekwad (or Gaikwad) family, belonging to the Kunbi Maratha clan, ruled the princely state of Baroda in western India from the early 18th century until Indian independence in 1947. They were known for their administrative reforms and relative autonomy under British suzerainty.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bhosale family, another prominent Maratha clan, established their own branch at Nagpur, which became an important center of power in central India.\u003c/li\u003e\r\n\t\u003cli\u003eThe main line of the Bhosales produced Chhatrapati Shivaji Maharaj, the founder of the Maratha Empire, and his successors continued to rule as Chhatrapatis (emperors or maharajas) from their capital at Satara after the Mughal-Maratha struggles.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43705", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: b cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMarathas\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe \u0026lsquo;Modi scripts was employed in the document of the............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1995)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Modi script, also known as the Modi lipi, was used in the documents of the Marathas. The Maratha Empire existed from the 17th to the 19th centuries.\u003c/li\u003e\r\n\t\u003cli\u003eThe Modi script is a historical script used to write the Marathi language. It was primarily used for maintaining revenue and administrative records.\u003c/li\u003e\r\n\t\u003cli\u003eThe Modi script is a cursive script that was in use from the 15th century. It is sometimes used to write Konkani, Hindi, Gujarati, Kannada, Telugu, and Sanskrit.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;The Modi script was used to write documents related to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eLand revenue, Judiciary, Justice, Donation of land, Religious matters, Property matters, Jahagir vatan, Military orders.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Wodeyars, also known as the Wadiyars :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey were a South Indian Hindu royal family that ruled the Kingdom of Mysore from 1399 to 1947. The Wodeyars were originally based in Mysore city and were from the Urs clan. The word \u0026ldquo;Wadiyar\u0026rdquo; means \u0026ldquo;Lord\u0026rdquo; or \u0026ldquo;Lordship\u0026rdquo; in Kannada.\u003c/li\u003e\r\n\t\u003cli\u003eThe Wodeyars profited from the conflict between the Mughal Empire and the Marathas in the 17th century. In 1610, the Wodeyars seized Seringapatam (now Shrirangapattana) and later acquired Bangalore (now Bengaluru). The city of Mysore became the kingdom\u0026rsquo;s capital in 1799.\u003c/li\u003e\r\n\t\u003cli\u003eAfter the death of Tipu Sultan in 1799, the Wodeyars ruled as allies of the British crown from 1799 to 1947.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Zamorins :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey were a Hindu ruling dynasty that ruled over the Malabar coast for over a century. The Zamorins were the hereditary rulers of Calicut, a major trading center in southern India. The Zamorins lived in a large family residence called a kovilakom, which was similar to a palace. The Zamorins followed a matrilineal system, where the eldest member of the kovilakom became the Zamorin when the previous Zamorin passed away.\u003c/li\u003e\r\n\t\u003cli\u003eThe Zamorins originated in Nediyirippu in Eranad, which is now part of the Malappuram district in Kerala. The Zamorins dealt with Chinese, Arabs, Portuguese, and others during their reign. The final Zamorin of Calicut committed suicide by setting fire to his palace and burning himself alive inside it.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Hoysalas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey were a Kannadiga dynasty that ruled most of what is now Karnataka between the 10th and 14th centuries. The dynasty\u0026rsquo;s capital was Dwarasamudra (Halebeedu), and the Hoysalas ruled over much of South India for nearly 200 years.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hoysalas were feudatories of the Chalukyas of Kalyana. The dynasty was founded by Sala, who was succeeded by Vinayaditya and Balalla 1. The greatest ruler of the Hoysala dynasty was Vishnuvardhana (Bittideva), who defeated the Cholas in the battle of Talakadu.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hoysalas built many spectacular temples, both Hindu and Jain. The Vijayanagar dynasty succeeded the Hoysalas.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43706", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMuin-ud-din Chishti\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBaba Farid\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: d;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe sufi saint who maintained that devo tional music was one way of coming close to God was............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe sufi saint who maintained that devotional music was one way of coming close to God was Option 1: Muin-ud-din Chishti.\u003c/li\u003e\r\n\t\u003cli\u003eMuin-ud-din Chishti, also known as Khwaja Gharib Nawaz, was a prominentsufi saint of the Chishti order in India. He lived during the 12th and 13th centuries and is widely regarded as one of the most influential sufi saints in the subcontinent.\u003c/li\u003e\r\n\t\u003cli\u003eOne of the key aspects of Muin-ud-din Chishtis teachings was his emphasis on devotional music, specifically Qawwali. Qawwali is a form of mystical music and poetry that originated in the sufi tradition and is characterized by its vibrant melodies and spiritual lyrics. Chishti believed that through Qawwali, individuals could experience a profound connection with God and attain spiritual enlightenment.\u003c/li\u003e\r\n\t\u003cli\u003eChishtis approach to spirituality was inclusive and accessible to people from all walks of life. He believed that music had the power to uplift the soul, purify the heart, and create a deep sense of love and devotion for God. Qawwali gatherings, known as \u0026ldquo;sama,\u0026rdquo; were organized in his dargah (sufi shrine) in Ajmer, Rajasthan, where people would gather to listen to the melodious verses and experience spiritual ecstasy.\u003c/li\u003e\r\n\t\u003cli\u003eChishti`s teachings on the importance of devotional music were influenced by his belief in the power of sound and its ability to transcend worldly boundaries. He saw music as a means to dissolve the ego and achieve a state of spiritual union with the divine. Through the mesmerizing melodies and poetic expressions of Qawwali, Chishti encouraged his followers to embark on a journey of self-discovery and surrender themselves to the divine presence.\u003c/li\u003e\r\n\t\u003cli\u003eIt is worth mentioning that while other sufi saints, such as Baba Farid, Saiyid Muhammad Gesudaraz, and Shah Alam Bukhari, also made significant contributions to sufi traditions and spirituality, they may have emphasized different aspects or practices within the sufi path. However, in the context of the question, Muin-ud din Chishti is specifically associated with promoting devotional music as a means of approaching God.\u003c/li\u003e\r\n\t\u003cli\u003eIn summary, Muin-ud-din Chishti, also known as Khwaja Gharib Nawaz, maintained that devotional music, particularly Qawwali, was one way of coming close to God. His teachings on the transformative power of music continue to influence sufi traditions and inspire individuals to seek spiritual enlightenment through the medium of sound and devotion.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43707", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u0 const QUIZ_TITLE = "Medieval History PYQ Test 1";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
</body>
