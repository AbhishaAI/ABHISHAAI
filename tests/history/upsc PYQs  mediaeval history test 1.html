function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

ortant}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRamanand\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKabir\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAmong the following who was the propo nent of the \u0026lsquo;Bhakti Cult\u0026rsquo; from West Bengal? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1979)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eChaitanya Mahaprabhu (1486\u0026ndash;1534) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a Bengal-based saint and spiritual leader who popularized the Bhakti movement in Bengal. He was a devotee of Lord Krishna and popularized Vaishnava Bhakti by preaching the Bhagavad Gita and Bhagavata Purana.\u003c/li\u003e\r\n\t\u003cli\u003eChaitanya\u0026rsquo;s mode of worshipping Krishna with bhajan-kirtan and dance had a profound effect on Vaishnavism in Bengal.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bhakti movement was a religious movement in India that began in the 7th to 10th centuries CE. The movement focused on devotion to God and sought to reform religion across all levels of society. The word \u0026ldquo;Bhakti\u0026rdquo; is Sanskrit for \u0026ldquo;devotion\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe movement had several characteristics, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Monotheistic ideas\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Opposition to idol worship\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Emphasis on self-surrender\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Emphasis on the role of Gurus\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Promotion of universal fraternity\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Opposition to rituals, holy places, and rest periods\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Bhakti cult is characterized by the attitude of the soul towards the Supreme Being.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement cut across distinctions of high and low birth, the learned and the unlettered, and opened the gateway of spiritual realization to one and all.\u003c/li\u003e\r\n\t\u003cli\u003eThe main Bhakti cults are those of Shiva, Vishnu, and Shakti.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement became popular because it didn\u0026rsquo;t discriminate among worshippers or devotees.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bhakti movement began in South India by Alvaras and Nayanars. Alvaras are the devotees of Lord Vishnu and Nayanars are devotees of Lord Shiva. These devotees traveled to various places singing hymns in praise of their Gods.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRamanuja (1077 \u0026ndash; 1157) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is also known as Ramanujacharya, was an Indian Hindu philosopher, guru and a social reformer.\u003c/li\u003e\r\n\t\u003cli\u003eHe is noted to be one of the most important exponents of the Sri Vaishnavism tradition within Hinduism.\u003c/li\u003e\r\n\t\u003cli\u003eHis philosophical foundations for devotionalism were influential to the Bhakti movement.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRamananda (1400\u0026ndash;1470) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a North Indian Brahman (priest), vedanta teacher, and poet saint. He was also known as Ramadatta or Ramanand.\u003c/li\u003e\r\n\t\u003cli\u003eRamananda was a part of the bhakti movement, a Sanskrit word that means \u0026ldquo;devotion\u0026rdquo;. He is credited with reviving the Ramanandi sect and is considered a founder of the Bhakti tradition. Hindu tradition recognizes him as the founder of the Ramanandi Sampradaya, the largest monastic Hindu renunciant community today.\u003c/li\u003e\r\n\t\u003cli\u003eRamananda\u0026rsquo;s teachings were similar to those of Ramanujacharya, and he followed Ramanujacharya\u0026rsquo;s Vishishtadvaita philosophy. He taught in Hindi, condemned the caste system, and allowed people from all castes to join his sect.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKabir (1398\u0026ndash;1518 CE) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a prominent Indian poet, saint, and social reformer during the 15th and16th centuries. His writings influenced the Bhakti movement and are included in Sikhism\u0026rsquo;s scripture Guru Granth Sahib. Kabir\u0026rsquo;s verses are also found in the Satguru Granth Sahib of Saint Garib Das and the Kabir Sagar of Dharamdas.\u003c/li\u003e\r\n\t\u003cli\u003eKabir was a proponent of the Bhakti Movement, which sought to coordinate religions by offering a universal path for all people. He is also known for his ideas about social equality and a casteless society based on rationality. Kabir\u0026rsquo;s poetry and dohas have been analyzed to understand how his works have impacted India\u0026rsquo;s social and cultural domain.\u003c/li\u003e\r\n\t\u003cli\u003eKabir is revered by Hindus, Muslims, and Sikhs. He was born in 1440 in Varanasi, India and died in 1518 in Maghar.\u003c/li\u003e\r\n\t\u003cli\u003eKabir is said to have been raised in a Muslim weaving family known as Julahas, who lived in or around the city of Benares (Varanasi).\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43613", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img { n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBalban\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following Muslim rulers en forced price control system?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1979)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eAlauddin Khalji (1296\u0026ndash;1316)\u003c/strong\u003e was the first Muslim ruler to introduce price controls in India. He set prices for a variety of goods, including animals, cloth, grains, and slaves.\u003c/li\u003e\r\n\t\u003cli\u003eTo implement the price control system, Alauddin appointed a market inspector called Shahna-i-Mandi. The inspector\u0026rsquo;s job was to ensure that prices were not higher than the prescribed rates and to check the quality and quantity of the commodities sold in the market.\u003c/li\u003e\r\n\t\u003cli\u003eAlauddin also set up three markets in Delhi to control prices. He fixed the prices of the commodities and reduced their rates so that his soldiers could live comfortably.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eMuhammad bin Tughlaq (1290 - 1351) : \u003c/strong\u003eHe was the second sultan of the Tughlaq dynasty and the 18th ruler of the Delhi Sultanate. He ruled from 1325 to 1351 and was the eldest son of Ghiyath al Din Tughluq, the founder of the dynasty. Tughlaq is known for his wild policy swings, which left his subjects impoverished.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome of his policies included:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Trade and commerce: \u003c/strong\u003eTughlaq attempted to implement a new coinage policy, which caused a complete upheaval of trade and commerce.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Capital shift: \u003c/strong\u003eHe moved the capital from Delhi to Daulatabad, also known as Devagiri, in the Deccan area of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Taxes:\u003c/strong\u003e He raised taxes in the Doab region to fill the empty treasury.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eTughlaq also annexed several kingdoms into his territory and defeated the Mongols who attacked the Delhi sultanate. He was known for his support of Sufi saints and followed a policy of religious tolerance and patronage.\u003c/li\u003e\r\n\t\u003cli\u003eTughlaq died on March 20, 1351 while trying to chase and punish people for rebellion and their refusal to pay taxes in Sindh (now in Pakistan).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIltutmish (1211 - 1236) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was the third and greatest Delhi sultan of the Mamluk dynasty, or Slave dynasty. He is considered the founder of the Delhi Sultanate because he was the first Muslim ruler to rule from the city.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIltutmish\u0026rsquo;s achievements include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Strengthening and expanding the Muslim empire in northern India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Moving the capital from Lahore to Delhi\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Completing the Qutub Minar\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Introducing administrative reforms such as the Iqtadari system, the establishment of an army, the introduction of coins, and the formation of Chalisa Dal\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Carrying out expeditions on the Rajput states to extend his empire\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIltutmish was also known as Altamsh and Shams-al-D\u012bn Iltutmish. He was a Turkic slave born in Central Asia who was sold into slavery and eventually became a slave to Qutb al-D\u012bn Aibak. He married Aibak\u0026rsquo;s daughter and succeeded him in 1211.\u003c/li\u003e\r\n\t\u003cli\u003eIltutmish died in April 1236 and was buried in a tomb he had built for himself in Delhi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGhiyas-ud-din Balban (1216-1287) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a Sultan of the Mamluk (Slave) dynasty of Delhi. He ruled from 1266 to 1287 AD. Balban was known for his authoritarian rule, but also for flourishing architecture and culture. He built many Sufi shrines and invited many Sufi saints to Delhi.\u003c/li\u003e\r\n\t\u003cli\u003eBalban was a famous and one of the most powerful sultans of the Delhi Sultanate of India. His real name was Ulugh Khan and his famous titles were Nab\u0101b-e-Khud\u0101 (Acolyte of God), Jhil-e-Ell\u0101hi (Shadow of God), Khud\u0101-e-Vandg\u0101r (Devotee of God).\u003c/li\u003e\r\n\t\u003cli\u003eBalban was sold as a slave to the then-ruler Iltumish in 1232 CE, who later released him. He took the throne after the death of Sultan Nasiruddin Mahmud.\u003c/li\u003e\r\n\t\u003cli\u003eBalban\u0026rsquo;s reign was full of terror among the nobles and public equally. He successfully recaptured Bengal and fought the invasion of the Mongol forces.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eBalban\u0026rsquo;s main principles of the theory of Kingship were:\u003c/strong\u003e Kingship is the vice regency of God on earth. The king is the shadow of God.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43614", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle ": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe great Indian philosopher Shankara advocated Advaita. Advaita is a Hindu philosophy that states that the soul is identical with God. It is also known as the doctrine of the oneness of the individualsoul and the Supreme God.\u003c/li\u003e\r\n\t\u003cli\u003eShankara is considered one of the most influential Indian philosophers from the classical period. He is revered by Advaita Ved\u0101nta\u0026rsquo;s teaching tradition and monastic lineages, and continues to influence virtually all contemporary lineages today.\u003c/li\u003e\r\n\t\u003cli\u003eShankara is also credited with unifying and establishing the main currents of thought in Hinduism. He established the importance of monastic life as sanctioned in the Upanishads and Brahma Sutra.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDvaita :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Sanskrit word that means \u0026ldquo;duality\u0026rdquo; or \u0026ldquo;dualism\u0026rdquo;. It refers to a concept in which two truths or principles are completely separate and independent. Dvaita is a school of Vedanta, one of the six philosophical systems of Indian philosophy.\u003c/li\u003e\r\n\t\u003cli\u003eDvaita Vedanta states that god and individual souls are completely separate. For example, Dvaita posits more than one fundamental metaphysical principle to explain the universe or a fundamental distinction between the human souls and the Supreme Being.\u003c/li\u003e\r\n\t\u003cli\u003eDvaita is based on the teaching of one of the great saints of India in around 13th century, Sri Madhavacharya. Madhva, also known as Anandatirtha, lived from around 1199 to 1278 and came from the area of modern Karnataka state.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAltruism :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a selfless concern for the welfare of others. It is a core aspect of many religious traditions, including Hinduism.\u003c/li\u003e\r\n\t\u003cli\u003eAltruism is also a key aspect of many humanitarian and philanthropic causes.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome examples of altruism include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Helping others without expecting anything in return\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Forgoing things that may benefit oneself but may cost others\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Sharing scarce resources\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Helping others despite knowing the personal risks or costs involved\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBuddhism, which originated in India, also contributed to the spread of altruistic behavior to other species.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43618", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !importan th:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat was the important reason for the fall of Vijayanagar Empire?\u0026nbsp;\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1979)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Vijayanagara Empire was a medieval Hindu empire that ruled much of Southern India from 1336 to 1646.\u003c/li\u003e\r\n\t\u003cli\u003eThe empire\u0026rsquo;s power declined after a military defeat in 1565, and it is generally agreed that the empire\u0026rsquo;s fall was due to a combination of factors:\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eUnity among Muslim rulers: \u003c/strong\u003eThe sultans of Golconda and Ahmadnagar, who had lost much to Rama Raya, may have formed an alliance to destroy Vijayanagar\u0026rsquo;s power.\u003c/li\u003e\r\n\t\u003cli\u003eThe Battle of Talikota in 1565 is considered a major reason for the fall of the Vijayanagar Empire. The battle was fought between the Hindu king of the Vijayanagar Empire and the four Deccan Sultanates of Bidar, Bijapur, Ahmadnagar, and Golconda.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle resulted in the defeat of the Vijayanagara Empire, the capture and death of Rama Raya, and the destruction of much of the city of Vijayanagar.\u003c/li\u003e\r\n\t\u003cli\u003eThe Vijayanagar Empire was established in 1336 and was based in the Deccan region of southern India. The empire fell in 1678.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOther reasons for the decline of the Vijayanagara Empire include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Corruption\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Complacency\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Laziness\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Lack of coordination and understanding in the army\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Vijayanagara Empire was established in 1336 by the brothers Harihara I and Bukka Raya I of the Sangama dynasty. The empire\u0026rsquo;s capital was Vijayanagara, later renamed Hampi, and its extensive ruins are now a UNESCO World Heritage Site.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43620", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n 03eSimilarly, the Chola Empire in South India (9th\u0026ndash;13th century CE) was also known for its display of immense wealth and royal magnificence.\u003c/li\u003e\r\n\t\u003cli\u003eThe Cholas constructed grand temples such as the Brihadeeswarar Temple at Thanjavur, adorned with intricate sculptures and towering vimanas (temple towers). These temples were not only centers of worship but also symbols of royal power and economic strength.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chola kings organized grand rituals and donated immense wealth to temples in the form of gold, land, and jewels. Their art, architecture, and bronze sculptures reflected both religious devotion and a deliberate display of prosperity.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43622", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAkbar\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/cs u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhose name is associated with Fatehpur Sikri?\u0026nbsp;\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1980)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Mughal Emperor Akbar is associated with Fatehpur Sikri. Akbar founded the city in 1569 to commemorate his victory over Mewar. It served as the capital of the Mughal Empire from 1571 to 1585.\u003c/li\u003e\r\n\t\u003cli\u003eThe city is located in the Agra District of Uttar Pradesh, India, and is named after the village of Sikri that was previously located on the site. The city is predominantly made of red sandstone and is 37 kilometers from Agra.\u003c/li\u003e\r\n\t\u003cli\u003eAkbar also built the Buland Darwaza at Fatehpur Sikri to commemorate his victory.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBabur (1483-1530) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was the founder of the Mughal Empire in India and the first Mughal Emperor. His real name was Zahir-ud-Din Muhammad, which means \u0026ldquo;Defender of the Faith\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eBabur was a descendant of the great Turkic conqueror Timur and the great Mongol conqueror Genghis Khan. He was a Chagatai Turk, a branch of the Turks named after Genghis Khan\u0026rsquo;s second son.\u003c/li\u003e\r\n\t\u003cli\u003eBabur was a brilliant military strategist and a skilled tactician. He was also a poet and a writer.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBabur\u0026rsquo;s military conquests include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1504: \u003c/strong\u003eBabur occupied Kabul\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1524:\u003c/strong\u003e Babur occupied Lahore but had to retreat to Kabul after Daulat Khan turned against him\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1525: \u003c/strong\u003eBabur attacked and occupied Punjab again\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn the Battle of Ghagra in AD 1529, Babur defeated the Afghans on the banks of the river Ghagra after defeating the Rajputs. Babur\u0026rsquo;s power consequently encompassed nearly all of northern India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eShah Jahan (1592 - 1666) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was the fifth Mughal emperor of India, ruling from 1628 to 1658. He was a military commander and grandson of the Great Akbar. His birth name was Shahab-ud-din Muhammad Khurram.\u003c/li\u003e\r\n\t\u003cli\u003eShah Jahan is known for his contributions to Indian Mughal architecture, including the Taj Mahal, the Pearl Mosque, the Red Fort, and the Jama Masjid. These monuments combine Persian, Indian, and Islamic architectural styles. Shah Jahan was also a patron of poetry and literature flourished during his reign.\u003c/li\u003e\r\n\t\u003cli\u003eShah Jahan is also known for advocating for equality between Hindus and Muslims.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHumayun (1508 - 1556) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was the second Mughal emperor of India. He ruled from 1530 to 1540 and again from 1555 until his death in 1556. Humayun was the son and successor of Babur, the founder of the Mughal dynasty.\u003c/li\u003e\r\n\t\u003cli\u003eHumayun is also known as Nasir-ud-Din Muhammad. During his reign, he focused on architectural development instead of expanding his empire.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHumayun\u0026rsquo;s reign can be divided into two periods:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e(1) 1530-1540 AD :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHumayun was an inexperienced ruler who fought with his step-brothers. Sher Shah Suri attacked Mughal territories from Bengal.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e(2) 1555-1556 AD :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHumayun besieged the fortress of Kalinjar in Bundelkhand, defeated the Afghans at Douhrua, drove out Sultan Mahmood Lodhi from Jaunpur, and defeated Bahadur Shah of Gujarat.\u003c/li\u003e\r\n\t\u003cli\u003eHumayun was more of an adventurer than a consolidator of his empire. He was driven from his capital of Delhi by the Afghan usurper Sh\u0113r Shah of S\u016br. He had to leave India for Afghanistan and Iran.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43623", "image_ch  {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRevolts of various communities like Jats, Sikhs, Rajputs, etc.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAll of the above mentioned factors contributed to the downfall of the Mughal Empire.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following was the cause of disintegration of the Mughal Empire?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1980)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAll of the above factors contributed to the downfall of the Mughal Empire: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eForeign invasions :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe invasions of Nadir Shah and Ahmad Shah Abdali drained the Mughals\u0026rsquo; wealth and shook the empire\u0026rsquo;s stability.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWeak successors :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Mughals didn\u0026rsquo;t have a succession law, so when a ruler died, his brothers would fight for the throne. This weakened the empire, especially after Aurangzeb\u0026rsquo;s death.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAurangzeb\u0026rsquo;s policies :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHistorians disagree on Aurangzeb\u0026rsquo;s religious views, but some say he was intolerant and wanted to destroy other religions. Others say his constant conflicts with the Marathas and Sikhs weakened the empire.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eInefficient rulers :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSome say the inefficiency of the later Mughal rulers was the main reason for the empire\u0026rsquo;s fall.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOther factors that contributed to the decline of the Mughal Empire include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAurangzeb\u0026rsquo;s long war in the Deccan:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis strained the empire\u0026rsquo;s military and financial resources.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDemoralization of the Mughal army:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis was caused by financial difficulties from continuous wars.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDecline in efficiency of the Mughal administration:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe later Mughal emperors couldn\u0026rsquo;t control their powerful mansabdars.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43624", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\  "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich dynasty was well-known for excel lent village administration?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1980)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Uttaramerur inscriptions, written in Tamil and Granta script, provide details about the Chola administration. The inscriptions, which date from 919 921 AD, describe the functioning and constitution of the local sabha. They also provide information about the village administration, taxation, and land revenue under the Cholas.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chola dynasty was known for its excellent village administration. The Cholas were one of the longest ruling dynasties in South India\u0026rsquo;s history.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chola administrative system was known for its village autonomy, with Chola officials acting more as observers than administrators.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chola dynasty was also known for its local self-government. The king was the supreme authority of the state, and a Council of Ministers helped the king with state affairs.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Pandyas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey were an ancient Tamil dynasty that ruled over the southern part of the Indian subcontinent until the end of the 15th century. The Pandyas were one of the four great kingdoms of Tamilakam, along with the Pallavas, the Cholas, and the Cheras.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pandyas established their dynasty in southern Tamil Nadu by the end of the sixth century CE. Their main city was Madurai, where Tamil kings held three Sangam poetry academies. The Pandyas initially practiced Jainism, but later became Hindus, specifically Shaivas.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pandyas were excellent traders, with their trade routes extending from Vanish Cody and Pol Pod to Rome and Greece, and all the way up to China, Malaysia, and Maldives. They also produced the finest pearls along the South Indian coast.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pandyas were unable to oppose the Delhi Sultanate\u0026rsquo;s imperial desires\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Pallava dynasty :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey ruled a large portion of the Deccan, also known as Tondaimandalam, from 275 CE to 897 CE. The Pallavas were a powerful force in the South around the 4th century AD and were at the height of their power in the seventh century AD.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pallavas were patrons of art and architecture and are considered the originators of Dravidian style architecture.\u003c/li\u003e\r\n\t\u003cli\u003eSome of the best examples of Pallava art and architecture are the Kailasanathar Temple at Kanchipuram, the Shore Temple and the Pancha Rathas of Mahabalipuram.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Chalukya dynasty :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThese was a Hindu dynasty that ruled parts of central and southern India from the 6th to 12th centuries.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Chalukyas ruled as three related but separate dynasties: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Badami Chalukyas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe earliest Chalukya dynasty, which ruled from the mid-6th century. Their capital was Badami (Vatapi) in Karnataka. The Badami Chalukyas declined after the death of their greatest king, Pulakesin II, in 642 AD.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Western Chalukyas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRuled as emperors in the Deccan from 543 to 757 CE and again from about 975 to about 1189. Tailapa II (973-997 CE) is considered one of the founders of the Western Chalukya dynasty.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Eastern Chalukyas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRuled in Vengi (in eastern Andhra Pradesh state) from about 624 to about 1070.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chalukyas and the Pallavas were major kingdoms that ruled much of South India. The Chalukyas had their capital at the Raichur Doab located between the Krishna and Tungabhadra rivers.\u003c/li\u003e yle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat was not the most important feature of land revenue system of Akbar?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1980)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe land revenue system of Emperor Akbar, known as the Ain-i-Dahsala or Todar Mal Bandobast, was one of the most efficient and scientific revenue systems in medieval India.\u003c/li\u003e\r\n\t\u003cli\u003eIntroduced by Raja Todar Mal, Akbar\u0026rsquo;s finance minister, this system emphasized accurate land measurement, fair assessment, and proper classification of land according to fertility and productivity. The main features of Akbar\u0026rsquo;s revenue system included:\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Accurate measurement of land \u003c/strong\u003e\u0026ndash; Land was measured using standardized measuring rods called bamboo jaribs.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Classification of land \u003c/strong\u003e\u0026ndash; Land was categorized into three types (good, middling, and bad) based on fertility, and an average produce was calculated.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Fixation of revenue rates (dahsala system) \u003c/strong\u003e\u0026ndash; The average produce and prices of crops over ten years were used to fix a uniform rate of revenue, generally one-third of the produce, which could be paid in cash or kind.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Collection through local officers \u003c/strong\u003e\u0026ndash; Revenue collection was supervised by officials like amil, qanungo, and patwari at the local level, not directly by the central treasury.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eTherefore, the collection of land revenue directly at the central treasury was not an important feature of Akbar\u0026rsquo;s land revenue system, as revenue was collected at the village and district levels and only a portion eventually reached the imperial treasury. The emphasis was on systematic assessment and fair collection, not centralization of collection.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHence, the correct answer is (c) Collection of land revenue directly at the central treasury.\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMughal Emperor Akbar introduced the Mansabdari system in 1571. The system was used in early modern India and determined the rank and status of military generals and government officials.\u003c/li\u003e\r\n\t\u003cli\u003eThe word \u0026ldquo;mansab\u0026rdquo; is Arabic for \u0026ldquo;rank\u0026rdquo; or \u0026ldquo;position\u0026rdquo;. The system gave nobles the right to hold a revenue assignment, or jagir, for their services. The emperor had direct control over these nobles.\u003c/li\u003e\r\n\t\u003cli\u003eThe ranks were divided into Zat, Sawar, and Chehra. Mansabdars were military commanders, high civil and military officers, and provincial governors.\u003c/li\u003e\r\n\t\u003cli\u003eMansabdars whose rank was one thousand or below were called Amir, while those above 1,000 were called Amir-al Kabir.\u003c/li\u003e\r\n\t\u003cli\u003eUnder this system, every officer was assigned a rank, or mansab. The lowest rank was 10 and the highest was 5,000 during the early reign of Akbar. Later, Akbar raised the highest rank to 10,000 and then 12,000.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mansabdari system had 33 categories of Mansabdars. The lowest Mansabdar commanded ten soldiers, while the highest commanded 10,000. Only the royal family\u0026rsquo;s princes and the most powerful Rajput rulers received a mansab of 10,000.\u003c/li\u003e\r\n\t\u003cli\u003eAkbar\u0026rsquo;s Mansabdari and Jagirdari system strengthened the empire\u0026rsquo;s administration. Jahangir and Shah Jahan later introduced new systems into the original Mansabdari system.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43632", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_li 003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3, 4, 1\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the chronological order for the construction of the following is correct?\u0026nbsp;\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1982)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Taj Mahal\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Qutab Minar\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Fatehpur Sikri\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Agra Fort\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer from the codes given below\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eQutb-ud-din Aibak, the first Sultan and Muslim ruler of Delhi, built the Qutb Minar in 1192. The tower was completed in 1368 by Firoz Shah Tughlaq.\u003c/li\u003e\r\n\t\u003cli\u003eThe Qutb Minar is a UNESCO World Heritage Site and a symbol of victory built in the early 13th century. The 72.5 meter high tower is made of red sandstone and tapers from 2.75 meters in diameter at the top to 14.32 meters at the base.\u003c/li\u003e\r\n\t\u003cli\u003eThe Qutb Minar was damaged by lightning in 1326 and 1368, and was repaired by Muhammad-bin-Tughluq and Firuz Shah Tughluq. In 1503, Sikandar Lodi restored and enlarged the upper storeys.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mughal emperor Akbar built the Agra Fort between 1565 and 1573. The fort was built as a tribute to the Mughal empire\u0026rsquo;s splendor. It\u0026rsquo;s a crescent-shaped fortress made of sandstone with a 2.5-kilometer long enclosure wall.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mughal Emperor Akbar built Fatehpur Sikri, also known as the City of Victory, between 1572 and 1585. The city was the capital of the Mughal Empire from 1571 to 1585.\u003c/li\u003e\r\n\t\u003cli\u003eAkbar built the city to honor the Sufi saint Sheikh Salim Chisti. The emperor is said to have gone to Sikri to seek the saint\u0026rsquo;s blessing for a son. The city is made primarily of red sandstone and is located about 37 kilometers from Agra.\u003c/li\u003e\r\n\t\u003cli\u003eFatehpur Sikri is a complex of monuments and temples, all in a uniform architectural style.\u003c/li\u003e\r\n\t\u003cli\u003eThe complex includes the Jama Masjid, one of the largest mosques in India, and the Tomb of Salim Chishti. Other major attractions include the Buland Darwaza, the main gateway to the palace.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1986, Fatehpur Sikri was designated a UNESCO World Heritage Site.\u003c/li\u003e\r\n\t\u003cli\u003eThe Taj Mahal was built between 1631 and 1648 by Mughal emperor Shah Jahan in memory of his wife, Mumtaz Mahal. The construction of the mausoleum was mainly finished in 1643, but work on other parts of the project continued for another 10 years.\u003c/li\u003e\r\n\t\u003cli\u003eThe Taj Mahal is an ivory-white marble mausoleum on the south bank of the Yamuna river in Agra, India. It was commissioned in 1632 by Shah Jahan, who ruled from 1628 to 1658. The Taj Mahal is considered one of the world\u0026rsquo;s heritage masterpieces and the jewel of Muslim art in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe construction project employed around 20,000 artisans under the guidance of a board of architects led by Ustad Ahmad Lahori, the emperor\u0026rsquo;s court architect.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43634", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBhakti\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u0 raged temples to open their doors to everyone irrespective of caste or position in society.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDvaita and Advaita are two different philosophies:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Dvaita :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMeans duality, and is based on the idea that the creator and nature are two separate, eternal realities. Dvaita Vedanta originated in Southern India in the 13th century by Sri Madhvacarya. Dvaita Vedanta asserts that the world is real, and that everything, including the universe and God, is real. Dvaita Vedanta also states that souls and objects cannot exist without God, but that they are separate.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Advaita :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eMeans non-duality, and is based on the idea that there is only one supreme reality: \u003c/strong\u003eGod. Advaita Vedanta states that the self is identical with the ultimate reality, and that the soul is identical with God. Advaita propounds that the world is an illusion, and that all actions and emotions, including sorrow, are just false impressions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eVaishnavism :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a major form of modern Hinduismthat involves the worship of Vishnu and his incarnations (avatars).\u003c/li\u003e\r\n\t\u003cli\u003eVaishnavism is a \u0026ldquo;polymorphic monotheism\u0026rdquo; that recognizes many forms of one unitary divinity.\u003c/li\u003e\r\n\t\u003cli\u003eVaishnavism is mentioned in the Vedas, which were compiled around 1500 BCE. The writing of epics like the Mahabharata and Ramayana around 500 BCE later pushed the faith forward.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eVaishnavism is characterized by: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Worship :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eVaishnavism is the worship and acceptance of Vishnu as the supreme manifestation of the divine.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Polymorphic monotheism :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eVaishnavism is a theology that recognizes many forms of one original deity.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Bhakti yoga :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBhakti yoga requires practicing devotion to the Supreme deity that\u0026rsquo;s based on a sincere desire to please, rather than the hope of reward or the fear of punishment.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Eternal beings :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eVaishnavism acknowledges that all living beings are eternal persons, and that all life\u0026rsquo;s problems are rooted in the individual soul\u0026rsquo;s forgetfulness of his or her relationship with God.\u003c/li\u003e\r\n\t\u003cli\u003eA devotee of Vishnu is called a Vaishnava.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43640", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap ;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe First Battle of Panipat :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt took place on April 21, 1526, near the village of Panipat in present-day Haryana, India. The battle was fought between the forces of Babur and the Lodi Empire, and marked the beginning of the Mughal Empire.\u003c/li\u003e\r\n\t\u003cli\u003eBabur\u0026rsquo;s forces defeated the larger army of Ibrahim Lodi, Sultan of Delhi, due to Babur\u0026rsquo;s tactics and the use of guns.\u003c/li\u003e\r\n\t\u003cli\u003eBabur\u0026rsquo;s new tactics included the Tulghuma and the Araba, and the sound of the canons frightened Lodhi\u0026rsquo;s war elephants. Babur also used field fortifications and the firepower of gunpowder. The Second and Third Battles of Panipat took place in 1556 and 1761.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Second Battle of Tarain :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was fought in 1192 between the Ghurid forces of Muhammad Ghuri and the Rajput Confederacy of Prithviraj Chauhan. The battle took place near Tarain, which is now known as Taroari in Haryana, India.\u003c/li\u003e\r\n\t\u003cli\u003eThe battle resulted in the defeat of the Rajputs. This was the first time that a non Indian and non Hindu power emerged in Indian subcontinent. Finally this battle paved the way for Sultan rule in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe First Battle of Tarain was fought in 1191, in which the Chahamana king Prithviraj Chauhan defeated the Ghurid sultan Mu\u0026rsquo;izz al-Din.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe British East India Company (EIC) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was established on December 31, 1600, when Queen Elizabeth I granted it a Royal Charter. The company was a joint stock company owned by British aristocrats and merchants. It was originally chartered as the \u0026ldquo;Governor and Company of Merchants of London trading into the East Indies\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe EIC was established to trade with East and Southeast Asia and India. The company initially traded with maritime Southeast Asia, but later traded with China and India. The company was originally created to participate in the East Indian spice trade, but later added items such as cotton, silk, tea, and opium.\u003c/li\u003e\r\n\t\u003cli\u003eThe EIC dominated much of the Indian subcontinent between 1611 and 1858. In 1651, the company set up the first English factory on the banks of the river Hugli in Bengal. By 1696, the company began building a fort around the Hugli settlement.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1690, the company bought the Sultanate, Gobindapur, and Kolkata to build factories. In 1717, the Mughal Empire issued a Farman, or trade license, to the company. The EIC was dissolved in 1874.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43646", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003  "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe following are the rulers of the slave dynasty..........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1984)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Ghiyas-ud-din Balban\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Iltutmish\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Qutb-ud-din Aibak\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Nasir ud-din Mahmud\u003c/p\u003e\r\n\r\n\u003cp\u003eThe correct order in which these sultans ruled over India is :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eQutb-ud-din Aibak \u0026ndash; First ruler of the Slave Dynasty (1206\u0026ndash;1210 CE):\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eQutb-ud-din Aibak was originally a Turkish slave of Muhammad Ghori. After Ghori\u0026rsquo;s death in 1206, Aibak declared himself the ruler of Delhi, becoming the founder of the Mamluk (Slave) Dynasty and the first Sultan of Delhi.\u003c/li\u003e\r\n\t\u003cli\u003eHe is remembered for initiating the construction of the Qutub Minar and building Quwwat-ul-Islam Mosque. His rule was short (only four years), as he died in 1210 CE after falling from a horse while playing polo.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIltutmish \u0026ndash; Second ruler (1211\u0026ndash;1236 CE):\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAfter Aibak\u0026rsquo;s death, Iltutmish, his son-in-law and one of his trusted slaves, ascended the throne. He was the real consolidator of the Delhi Sultanate. Iltutmish repelled both internal revolts and external threats, including Mongol invasions.\u003c/li\u003e\r\n\t\u003cli\u003eHe also made Delhi the capital of his empire (instead of Lahore) and introduced a silver coin called Tanka and a copper coin called Jital. Importantly, he secured Caliphal recognition for his rule, strengthening his legitimacy as Sultan.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eNasir-ud-din Mahmud \u0026ndash; Third ruler (1246\u0026ndash;1266 CE):\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eNasir-ud-din Mahmud was the son of Iltutmish and ruled as a nominal Sultan, while actual power was held by his capable minister, Ghiyas-ud-din Balban, who served as Naib (Deputy Sultan). Nasir-ud-din Mahmud was known for his piety and devotion to religion. His reign was largely peaceful due to Balban\u0026rsquo;s strong administrative control behind the throne.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGhiyas-ud-din Balban \u0026ndash; Fourth ruler (1266\u0026ndash;1287 CE):\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAfter Nasir-ud-din Mahmud\u0026rsquo;s death, Balban took the throne and ruled with an iron hand. He was a strong and autocratic ruler who believed in maintaining strict discipline and the dignity of the monarchy. His reign marked the height of centralized power in the Mamluk Dynasty. He suppressed rebellions, strengthened the spy system (barid), and introduced the idea of \u0026ldquo;Divine Kingship\u0026rdquo; \u0026mdash; portraying the Sultan as the shadow of God (Zill-e-Ilahi).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTherefore, the correct chronological order of these rulers is:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eQutb-ud-din Aibak \u0026rarr; Iltutmish \u0026rarr; Nasir-ud-din Mahmud \u0026rarr; Ghiyas-ud-din Balban, which corresponds to the sequence 3 \u0026ndash; 2 \u0026ndash; 4 \u0026ndash; 1.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43647", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !impor
