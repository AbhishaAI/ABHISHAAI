e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following statements re garding Adi Shankaracharya is/are correct?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1985)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eI. He was one of the greatest Hindu scholars\u003c/p\u003e\r\n\r\n\u003cp\u003eII. He was born in Kerala\u003c/p\u003e\r\n\r\n\u003cp\u003eIII. First ever Indian feature film in Sanskrit was made after his name\u003c/p\u003e\r\n\r\n\u003cp\u003eIV. The above feature film was adjudged the best film for the year 1983\u003c/p\u003e\r\n\r\n\u003cp\u003eV. He wrote a commentary on the Upanishads\u003c/p\u003e\r\n\r\n\u003cp\u003eOf these statements :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;All statements about Adi Shankaracharya are correct:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was one of the greatest Hindu scholars\u003c/li\u003e\r\n\t\u003cli\u003eHe was born in Kerala\u003c/li\u003e\r\n\t\u003cli\u003eFirst ever Indian feature film in Sanskrit was made after his name\u003c/li\u003e\r\n\t\u003cli\u003eThe above feature film was adjudged the best film for the year 1983\u003c/li\u003e\r\n\t\u003cli\u003eHe wrote a commentary on the Upanishads\u003c/li\u003e\r\n\t\u003cli\u003eAdi Shankaracharya (788\u0026ndash;820 CE) was an Indian Vedic scholar and teacher who lived in the 8th century CE. He is considered one of India\u0026rsquo;s greatest philosophers. His writings are based on the Advaita Vedanta school of Hinduism.\u003c/li\u003e\r\n\t\u003cli\u003eAdi Shankaracharya is credited with unifying and establishing the main currents of thought in Hinduism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHe is also known for:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Establishing the importance of monastic life\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Establishing four mathas in Sringeri, Dwarka, Puri, and Badrinath\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Traveling across India to spread his philosophy through debates and discourses\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Believing that the Upanishads are the only way to gain knowledge of Brahman\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Believing that yoga could help people acquire moksha knowledge\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe first Sanskrit film ever made was Adi Shankaracharya in 1983 by G.V. Iyer. It won four awards at the 31st National Film Awards, including Best Film, Best Screenplay, Best Cinematography, and Best Audiography.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43648", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 4 2 5\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e5 2 1 4\u0026nbsp;\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-widt cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eCodes: ABCD :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAmir Khusrau (1253 - 1325) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a poet, historian, and Sufi musician and scholar from the 13th and 14th centuries. He is known as one of the four great pillars of Persian literature from the 14th century.\u003c/li\u003e\r\n\t\u003cli\u003eKhusrau is credited with combining Persian, Arabic, Turkic, and Indian singing traditions to create qawwali, a type of Sufi devotional song. He is also credited with inventing Tarana and Trivat.\u003c/li\u003e\r\n\t\u003cli\u003eKhusrau is known as \u0026ldquo;Tuti-e-Hind\u0026rdquo;, or \u0026ldquo;Indian Nightingale\u0026rdquo;, in the Indian music industry. His most famous work, the khamsa known as khusro ka khamsa, was composed during the reign of Alau-din Khilji.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKabir :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a famous 15th century Hindi poet, was born in 1425 AD in Varanasi. He was a weaver who rejected the external forms of worship of both Islam and Brahminical Hinduism. His teachings were based on a rejection of major religious traditions and he believed in Hindu-Muslim unity.\u003c/li\u003e\r\n\t\u003cli\u003eKabir\u0026rsquo;s teachings influenced Guru Nanak, who founded Sikhism in the 15th century. Kabir contributed 217 songs to the Sikh holy book, the Guru Granth Sahib, more than any other Guru.\u003c/li\u003e\r\n\t\u003cli\u003eKabir\u0026rsquo;s legacy continues through the Kabir Panth, a religious community that recognizes him as its founder.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAbul Fazl (1551 - 1602) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Indian historian, writer, and politician who lived during the 16th century. He was a friend and counselor to the Mughal emperor Akbar, and served as the empire\u0026rsquo;s grand vizier from 1579 until his death in 1602.\u003c/li\u003e\r\n\t\u003cli\u003eAbul Fazl is considered one of India\u0026rsquo;sgreatest historians. He wrote a detailed history of Akbar\u0026rsquo;s reign, known as Akbarnama, which includes A\u0026rsquo;in-i Akbari. A\u0026rsquo;in-i Akbari is a primary source for Akbar\u0026rsquo;s administrative institutions and explains the Mughal concept of kingship.\u003c/li\u003e\r\n\t\u003cli\u003eAbul Fazl was born in Agra to the Indian scholar and teacher Shaikh Mubarak. Shaikh Mubarak educated Abul Fazl in the Islamic sciences, Greek philosophy, and mysticism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSant Tukaram Maharaj (1608\u0026ndash;1650) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a 17th century Marathi poet and saint. He was a devotee of Vitthal, a form of Lord Krishna, and a member of the Bhakti movement in Maharashtra. Tukaram is known for his devotional poetry and community-oriented worship with spiritual songs called kirtans.\u003c/li\u003e\r\n\t\u003cli\u003eTukaram was born in 1608 in the village of Dehu, which is now part of the city of Pune. He lived with Maratha ruler Shivaji Maharaj and saints such as Eknath and Ramdas.\u003c/li\u003e\r\n\t\u003cli\u003eTukaram\u0026rsquo;s poetry is compiled in the Marathi language work Tukaram Gatha, which was likely composed between 1632 and 1650.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43649", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe village was the basic unit of Chola administration.\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type w-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone of the above.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following statements is correct?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1985)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe correct statement is (a) The village was the basic unit of Chola administration:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Chola village administration was well developed and systematic. The village (ur) was the basic unit of local administration, followed by the sub-region (nadu) and district (kottam). Groups of villages formed larger units called \u0026ldquo;Nadu\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe village council and the nadu performedadministrative functions such as dispensing justice and collecting taxes.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chola kingdom was divided into provinces called mandalams. The mandalams were further divided into valanadus. Each valanadu consisted of a certain number of villages.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chola kingdom rose in the 9th century. Some famous Chola kings include Karikala Chola, Rajaraja Chola, Rajendra Chola, and Kulothunga Chola I.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chola dynasty ruled South India from the 9th to the 13th centuries. The dynasty\u0026rsquo;s decline began in the 12th century and continued into the 13th century.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chola empire was completely destroyed in 1310 when Malik Kafur, a general in Alauddin Khilji\u0026rsquo;s army, invaded South India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Chola dynasty\u0026rsquo;s decline was caused by a number of factors, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Lack of resources\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Inefficiency\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Corruption\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Succession rivalries\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Infiltration of armed forces\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Increasing corruption and continuous expeditions\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Local chiefs gaining power\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Cholas were one of the richest and strongest imperial forces of the time, but they were unable to regain their previous position.\u003c/li\u003e\r\n\t\u003cli\u003eRajaraja Chola I (985-1014 CE) and his son Rajendra Chola are considered to be the best-remembered Chola kings.\u003c/li\u003e\r\n\t\u003cli\u003eRajaraja Chola I is considered one of the greatest rulers in Indian history. He is known for his military conquests, architectural achievements, and patronage of the arts and sciences. During his rule, the Chola kingdom grew into an extensive and well-knit empire.\u003c/li\u003e\r\n\t\u003cli\u003eRajendra Chola\u0026rsquo;s major achievement was capturing regions in north India. He took the title \u0026ldquo;gangaikonda\u0026rdquo; in memory of this conquest. He also developed a new capital called \u0026ldquo;gangaikonda cholapuram\u0026rdquo; and built a large Shiva temple.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43650", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u0 00% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAmir Khusrau (1253 - 1325) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a poet, historian, and Sufi musician and scholar from the 13th - 14th centuries. He is known as one of the four great pillars of Persian literature from the 14th century.\u003c/li\u003e\r\n\t\u003cli\u003eKhusrau is credited with combining Persian, Arabic, Turkic, and Indian singing traditions to create qawwali, a type of Sufi devotional song. He is also credited with inventing Tarana and Trivat.\u003c/li\u003e\r\n\t\u003cli\u003eKhusrau is known as \u0026ldquo;Tuti-e-Hind\u0026rdquo;, or \u0026ldquo;Indian Nightingale\u0026rdquo;, in the Indian music industry. His most famous work, the khamsa known as khusro ka khamsa, was composed during the reign of Alau-din Khilji.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDin-i Ilahi :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is also known as Divine Faith, was a religious movement created by the Mughal emperor Akbar in 1582. The name Din-i Ilahi is Persian for \u0026ldquo;Divine Faith\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement was an ethical system that combined Islam and Hinduism into one faith, but also added aspects of Christianity, Zoroastrianism, and Jainism. Akbar\u0026rsquo;s goal was to bring people together through a religion that served only one God.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement was an elite religious movement that never had more than 19 adherents. It did not last long or have many followers. However, it did cause conflict between the Mughal emperor and the Indian Islamic community.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Qutb Minar :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Qutb Minar, a 72.5 meter high tower made of red sandstone, was built in the early 13th century. The tower is located a few kilometers south of Delhi.\u003c/li\u003e\r\n\t\u003cli\u003eThe Qutb Minar was built by Qutb-ud din Aibak, the first Sultan and Muslim ruler of Delhi, in 1192. Construction was completed in 1368 by Firoz Shah Tughlaq.\u003c/li\u003e\r\n\t\u003cli\u003eThe tower is a mix of polygonal and circular shapes and is made of red and buff sandstone, with some marble in the upper stories. It\u0026rsquo;s thought that the tower is named after Qutb-ud-din Aibak, who started it. However, it\u0026rsquo;s also possible that it\u0026rsquo;s named after Khwaja Qutbuddin Bakhtiar Kaki, a 13th-century sufi saint.\u003c/li\u003e\r\n\t\u003cli\u003eThe Qutb Minar was damaged by lightning in 1326 and 1368, and was repaired by the rulers of the day.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eChand Bardai :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a poet from medieval India who lived from 1149\u0026ndash;1200. His epic poem Prithviraj Raso is considered one of the first works in Hindi literature. The earliest manuscript of the poem dates to the 12th century.\u003c/li\u003e\r\n\t\u003cli\u003eThe poem is about the 12th-century Indian Rajput king Prithviraj Chauhan. It describes the love and abduction of Raja Jai Chandra\u0026rsquo;s daughter of Kannauj by Prithviraj Chauhan.\u003c/li\u003e\r\n\t\u003cli\u003eSome scholars date the oldest version of the poem to the 13th century, while the earliest extant copy dates back to the 16th century.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": " portant}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A): Akbar introduced Din-i-Il lahi which became more popular.\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R): Din-i-Illahi was a religious order, suitable for the people of all religions.\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1985)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAkbar, the Mughal emperor, did not found Din-i-Ilahi. However, he did initiate a syncretic religious movement called Din-i-Ilahi in the late 16th century. The movement was not very popular and did not have a lasting impact.\u003c/li\u003e\r\n\t\u003cli\u003eDin-i-Ilahi was a new religion that combined Islam and Hinduism into one faith, while also incorporating aspects of Christianity, Zoroastrianism, and Jainism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe term Din-i-ilahi translates to \u0026ldquo;Divine faith\u0026rdquo;. The movement was not successful for a few reasons:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Akbar\u0026rsquo;s successors were not as liberal and tolerant as he was, so they did not promote it.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. More orthodox Muslims were not ready to accept other religious practices.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The movement was not suitably projected to the masses.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDin-i-Ilahi was open to all, and had good features of all religions. It had no religious sculptures, rituals, religious places of worship, or priestly class. Akbar used to give a Mantra in the ear of the person who wanted to join it.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43654", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eif A and R both are correct and R is the correct explanation of A\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle low-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eif A is correct but R is incorrect\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A): The Cholas had a conquest of Southeast asia.\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R): They had developed a very strong fleet.\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1985)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n ": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following is wrongly matched?\u0026nbsp;\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1986)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAbu\u0026rsquo;l-Fazl ibn Mubarak :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ealso known as Abul Fazl, wrote Akbarnama between 1590 and 1596.\u003c/li\u003e\r\n\t\u003cli\u003eAkbarnama is a three-part biography of the third Mughal Emperor, Akbar, who ruled from 1556\u0026ndash;1605. Akbar himself commissioned the work, which is the official chronicle of his reign.\u003c/li\u003e\r\n\t\u003cli\u003eAbul Fazl was the grand vizier of Emperor Akbar from the time of his appointment until his death in 1602. In 1602, Prince Salim ordered Abul Fazl\u0026rsquo;s murder, believing him to be an obstacle to his becoming emperor.\u003c/li\u003e\r\n\t\u003cli\u003eAfter Akbar\u0026rsquo;s death in 1605, the manuscript was passed down to his son Jahangir, who ruled from 1605\u0026ndash;1627, and then to his grandson Shah Jahan, who ruled from 1628\u0026ndash;1658.\u003c/li\u003e\r\n\t\u003cli\u003eBaburnama, also known as Tuzuk-i-Babari, is an autobiography written by Zahiruddin Muhammad Babur (1483-1530).\u003c/li\u003e\r\n\t\u003cli\u003eBabur was the founder of the Mughal Empire in India and wrote his memoirs in his native Chagatai Turkic. The book is considered the first true work of Islamic autobiography.\u003c/li\u003e\r\n\t\u003cli\u003eBabur was a talented writer who also wrote many poems.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to modern scholars, no other eastern prince has written such a vivid, interesting, and truthful account of his own life as Babur.\u003c/li\u003e\r\n\t\u003cli\u003eThe book includes illustrations, some of which are contemporary views of places Babur describes. Other illustrations are taken from an illustrated copy of theBaburnama prepared for Babur\u0026rsquo;s grandson, the Mughal Emperor Akbar.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKalhana :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ea Kashmiri Pundit, wrote Rajatarangini (River of Kings) between 1148 and 1149.\u003c/li\u003e\r\n\t\u003cli\u003eThe epic poem was written in Sanskrit and is a historical chronicle of early India. The name Kalhana means \u0026ldquo;Knower of Meaning\u0026rdquo; or \u0026ldquo;Reader\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eIn his compositions, Kalhana references ancient epics, including the Mahabharata, the Ramayana, and the Vikramankadevacharita of Bilhana.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMalik Muhammad Jayasi (1477\u0026ndash;1542) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ewrote the epic poem Padmavat in 1540.\u003c/li\u003e\r\n\t\u003cli\u003eJayasi was an Indian Sufi poet and pir who wrote in the Awadhi language and the Persian Nastal\u012bq script.\u003c/li\u003e\r\n\t\u003cli\u003ePadmavat is a famous piece of Sufi literature that tells the fictional story of the Delhi Sultan Alauddin Khalji\u0026rsquo;s desire for Padmavati, the Queen of Chittor. While Alauddin Khalji and Padmavati\u0026rsquo;s husband Ratan Sen are historical figures, Padmavati may be fictional.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAbdul Hamid Lahori :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ewrote Badshahnama in 1648.\u003c/li\u003e\r\n\t\u003cli\u003eThe book is a contemporary chronicle that Shah Jahan commissioned to celebrate his reign and dynasty. The book\u0026rsquo;s purpose was to establish the political and ideological legitimacy of the emperor\u0026rsquo;s rule.\u003c/li\u003e\r\n\t\u003cli\u003eBadshahnama is a genre of works that serve as the official history of the Mughal Emperor Shah Jahan\u0026rsquo;s reign. The book is written in three volumes, each covering a ten-year period. The first volume is based on Qazvini\u0026rsquo;s work but contains more details. The second volume covers the next ten years of Shah Jahan\u0026rsquo;s reign.\u003c/li\u003e\r\n\t\u003cli\u003eLahori was a traveler and historian during Shah Jahan\u0026rsquo;s reign who later became a court historian for the emperor.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43658", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{ 03c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBalban\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWho inscribed the name of Khalifa of Baghdad on his coins?\u0026nbsp;\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1986)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIltutmish was the first Sultan to inscribe the name of the Caliph of Baghdad on his coins.\u003c/li\u003e\r\n\t\u003cli\u003eIltutmish was the third Mamluk king to rule the former Ghurid territories in northern India. He was the first Muslim ruler of Delhi and is considered the founder of the Delhi Sultanate.\u003c/li\u003e\r\n\t\u003cli\u003eIltutmish was the first Turkish ruler to introduce a purely Arabic coinage. His silver coin, the tanka, weighed 175 grains and had an Arabic inscription on it. The tanka and the copper Jital were the two basic coins of the Sultanate period.\u003c/li\u003e\r\n\t\u003cli\u003eThe Caliph may have recognized Iltutmish\u0026rsquo;s authority in India because he saw Iltutmish as an ally against his Khwarazmian rival. The Khalifa of Baghdad also bestowed the title Sultan-i-Azam on Iltutmish, which increased his position in the Muslim world.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAlauddin Khilji (1296-1316) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a powerful Muslim ruler and Sultan of Delhi from the Khilji dynasty. He was the nephew and son-in-law of Jalaluddin Khilji, the founder of the dynasty. Khilji is considered one of the greatest rulers in Indian history.\u003c/li\u003e\r\n\t\u003cli\u003eHe expanded the Delhi Sultanate beyond North India, conquering Gujarat and the South. He also defended his kingdom against Mongol invasions at Jaran-Manjur, Sivistan, Kili, Delhi, and Amroha.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKhilji is also known for:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eKeeping a description of all soldiers in his army\u003c/li\u003e\r\n\t\u003cli\u003ePosting spies throughout the empire to prevent rebellions\u003c/li\u003e\r\n\t\u003cli\u003eBeing personally involved in the 1301 AD conquest against the King of Ranthambore, Hamir Deva\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eKhilji was poisoned with wine by MalikKafoor, who was plotting to kill him and steal the throne of Delhi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eQutb-ud-din Aibak (1150\u0026ndash;1210) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was the first Sultan of the Delhi Sultanate and the founder of the Mamluk Dynasty. He was born in Turkestan to Turkic parents and sold into slavery as a child. He was raised in Persia and eventually became a slave of Muhammad of Ghor, who appointed him to a military position.\u003c/li\u003e\r\n\t\u003cli\u003eAibak was a general in the Ghurid army in India during the late 1100s and early 1200s. He was a fierce warrior who skillfully oversaw many battles during his life. He ruled until his death in 1210 from injuries he received during a polo match. He was laid to rest near the Anarkali bazaar in Lahore.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGhiyas ud din Balban (1216\u0026ndash;1287) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a sultan of the Mamluk dynasty of Delhi who ruled from 1266\u0026ndash;1287. He was also known as Ulugh Khan, and his titles included Nab\u0101b-e-Khud\u0101 (Acolyte of God), Jhil-e-Ell\u0101hi (Shadow of God), and Khud\u0101 e-Vandg\u0101r (Devotee of God).\u003c/li\u003e\r\n\t\u003cli\u003eBalban was a powerful sultan who is known for his strict and authoritarian rule, but also for his patronage of art and culture. He was born Bahauddin and was originally a slave purchased by Iltutmish. He quickly rose through the ranks and led successful military campaigns.\u003c/li\u003e\r\n\t\u003cli\u003eBalban\u0026rsquo;s reign was marked by terror among the nobles and public. He successfully recaptured Bengal and fought off the Mongol invasion. In 1285, he arranged a military defense line across the Beas River as part of his \u0026ldquo;blood and iron\u0026rdquo; fortification chain strategy.\u003c/li\u003e\r\n\t\u003cli\u003eBalban believed that the king was the representative of God on earth and that kingship was a divine institution. He believed that it was the king\u0026rsquo;s superhuman awe and status that ensured people\u0026rsquo;s obedience.\u003c/li\u003e\r\n\t\u003cli\u003eBalban was succeeded by Muiz ud din Qaiqubad, who was killed by his wazir in 1290.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43659", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eJayapala met his enemy Sabuktigin\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max- _image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWho among the following accepted Din-i- Ilahi?\u0026nbsp;\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1987)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBirbal was the first Hindu and the only Hindu courtier of Akbar to accept Din-i Ilahi.\u003c/li\u003e\r\n\t\u003cli\u003eDin-i-Ilahi was a religion founded by the Mughal Emperor Akbar. The main goal of Din-i-Ilahi was to promote morality, ethics, and kindness among Muslims.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOther followers of Din-i-Ilahi during Akbar\u0026rsquo;s time include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Shaikh Mubarak\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Shaikh Faizi\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Jafar Beig\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Qasim Khan\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Abu\u0026rsquo;l-Fazl ibn Mubarak\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Azam Khan\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Abdus Samad\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Mulla Shah Muhammad Shahadad\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRaja Man Singh I (1550 - 1614) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a Rajput ruler and the 24th Maharaja of Amber from 1589 to 1614. He was also a member of Akbar\u0026rsquo;s court and one of the \u0026ldquo;nine jewels\u0026rdquo; (Nauratan).\u003c/li\u003e\r\n\t\u003cli\u003eMan Singh was a trusted general of Akbar and fought in many battles, including the Battle of Haldighati against Maharana Pratap in 1576. He also served as the Subahdar of Bengal for three terms from 1595 to 1606 and the Subahdar of Kabul from 1585 to 1586.\u003c/li\u003e\r\n\t\u003cli\u003eMan Singh was appointed governor of Bihar and later of Bengal. He chose the site for his capital in 1595\u0026ndash;96 because of its strategic command of the Teliagarh Pass and the Ganges River.\u003c/li\u003e\r\n\t\u003cli\u003eRaja Vikramjit of Gwalior gave Tansen the title Tansen. Tansen was an Indian musician, poet, and vocalist who was born around 1500 in Behata or Gwalior, India. He was a court musician in the darbar of Raja Ramachandra of Bandavagarh (Rewa).\u003c/li\u003e\r\n\t\u003cli\u003eTansen is an important figure in the North Indian tradition of Hindustani classical music. He is known for his dhrupad and raga compositions, and for his vocal performances. Akbar, the emperor,considered Tansen one of the Navaratnas Nine Ministers (the nine jewels) and gave him the title Mian, an honorific, meaning learned man.\u003c/li\u003e\r\n\t\u003cli\u003eTansen was said to have married Akbar\u0026rsquo;s daughter Mehrunissa. He has five children, Surat Sen, Sarat Sen, Tarang Khan, Bilwas Khan, and Saraswati, who all became accomplished musicians.\u003c/li\u003e\r\n\t\u003cli\u003eTansen died at the age of 83, around 1589, and was buried at Gwalior next to the tomb of Mohammad Ghaus. Many musicians make pilgrimages to his tomb to seek his blessings.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRaja Todar Mal (1500 - 1589) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was the Finance Minister (Diwan-i Ashraf) of the Mughal Empire during the reign of Akbar I. He was also the Vakil-us Sultanat (Counsellor of the Empire) and Joint Wazir.\u003c/li\u003e\r\n\t\u003cli\u003eTodar Mal is known for introducing a new revenue system called zabt and a taxation system called dahshala. He surveyed crop yields and prices from 1570\u0026ndash;1580, and based on this information, he fixed taxes on each crop in cash.\u003c/li\u003e\r\n\t\u003cli\u003eThe dahsala system was used in most of Akbar\u0026rsquo;s empire, including Lahore, Allahabad, Malwa, and Gujarat. It was considered one of the most effective and efficient revenue and record systems.\u003c/li\u003e\r\n\t\u003cli\u003eTodar Mal was also one of the nine jewels of Akbar. He was a Khatri Rajput who served in his youth under the administration of Sher Shah Suri.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43668", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text 100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eChaitanya Mahaprabh\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWho among the following Bhakti lead ers used the medium of dance and songs (Kirtans) to make one feel the personal presence of god near him?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1988)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eChaitanya Mahaprabhu was a 15th centuryBhakti leader who used dance and songs (kirtans) to make people feel the presence of God. He was a popular Vaishanv saint and reformer from Bengal who believed that God could be realized through love, devotion, song, and dance.\u003c/li\u003e\r\n\t\u003cli\u003eMahaprabhu\u0026rsquo;s style of worshipping Krishna through dance and song had a significant impact on Bengali Vaishnavism. He popularized Vaishnava Bhakti by preaching the Bhagavad Gita and Bhagavata Purana. The Bhakti movement spread throughout India in the second millennium.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome other famous saints from the Bhakti movement include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAdi Shankracharya, Meera Bai, Sant Gyaneshwar, Sant Tukaram, Bhakta Kanakadasa, Purandara dasa, Bhakta Khumbhar, Basvanna, Akka Mahadevi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSrimanta Sankaradeva (1449\u0026ndash;1568) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a 15th\u0026ndash;16th century Assamese polymath. He was a saint-scholar, poet, playwright, dancer, actor, musician, artist, and social-religious reformer.\u003c/li\u003e\r\n\t\u003cli\u003eSankaradeva is considered one of the leading proponents of Vaishnavism in Assam in the late 15th century. His teachings, known as the Bhagavati dharma, are based on the Bhagavad Gita and the Bhagavata Purana. They focus on absolute surrender to the supreme deity, in this case, Lord Vishnu.\u003c/li\u003e\r\n\t\u003cli\u003eSankaradeva\u0026rsquo;s Bhakti movement aimed to provide spiritual education to all people of society. He influenced two medieval kingdoms, the Koch and the Ahom kingdoms. The assembly of devotees he founded evolved into monastic centers known as Sattras. These remain important socio-religious institutions in Assam and, to a lesser extent, North Bengal.\u003c/li\u003e\r\n\t\u003cli\u003eSankaradeva also began the practice of setting up namghars or houses of recitation and prayer.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eChandidas (1339\u0026ndash;1399) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a medieval Bengali poet from India, or possibly more than one. He wrote over 1250 poems related to the love of Radha and Krishna in medieval Bengali\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJnanadeva (1275 - 1296) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a 13th-century Marathi poet, philosopher, and mystic. He was a key figure in the Bhakti movement, a spiritual revival in medieval India that focused on devotion to the god Krishna.\u003c/li\u003e\r\n\t\u003cli\u003eJnanadeva is also known as Jnaneshwar, Dnyandev, Mauli, and Sant Dnyaneshwar. He is considered a major figure in Marathi literature, and his philosophy is based on the concept of \u0026ldquo;Jnana\u0026rdquo; or \u0026ldquo;Self-Realization\u0026rdquo;. His poetic works and philosophy are still studied and revered today.\u003c/li\u003e\r\n\t\u003cli\u003eJnanadeva is known for composing the Bhavarthadipika, a Marathi oral verse translation and commentary on the Bhagavadgita. The Bhavarthadipika is also known as the Jnaneshvari. Jnanadeva also wrote a commentary on the Bhagavad Gita called Gnaneswari.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43669", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !i sh who constructed three more stories. The last two storeys were completed by Firoz Shah Tuglak.\u003c/li\u003e\r\n\t\u003cli\u003eGol Gumbaz is the mausoleum of king Mohammed Adil Shah, Sultan of Bijapur. The tomb is located in Vijayapura, Karnataka. It was started in 1626 and completed in 1656. The name is based on Gola gummata derived from Gol Gombadh meaning \u0026ldquo;circular dome\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eBuland Darwaza or the loft gateway was built by the great Mughal emperor, Akbarin 1601 CE at Fatehpur Sikri. Akbar built the Buland Darwaza to commemorate his victory over Gujarat.\u003c/li\u003e\r\n\t\u003cli\u003eThe Moti Masjid is a white marble mosque inside the Red Fort complex in Delhi, India. The name translates into English as \u0026ldquo;Pearl Mosque.\u0026rdquo; Located to the west of the Hammam and close to the Diwan-e Khas, it was built by the Mughal emperor Aurangzeb from 1659-1660.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43673", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eHyderabad\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{ 026rsquo;s long history includes a mosque on its top floor for more than 425 years.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFatehpur Sikri :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a small city in India\u0026rsquo;s Agra district, located 37 kilometers west of Agra. It was built by the Mughal emperor Akbar in the 16th century to honor the Sufi saint Sheikh Salim Chisti. Fatehpur Sikri is a UNESCO World Heritage Site and is known as the \u0026ldquo;city of victory\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eFatehpur Sikri is the first planned city by the Mughals and was the capital of the Mughal Empire from 1572 to 1585. The city is made up of a complex of temples and monuments, including the Jama Masjid mosque, one of India\u0026rsquo;s largest mosques.\u003c/li\u003e\r\n\t\u003cli\u003eThe city\u0026rsquo;s architecture is a testimony to the Mughal Empire\u0026rsquo;s architectural achievements, and features sloping tile roofs that are a stone translation of village hut roofs.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43674", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:1 1717; border-left:1px solid #181717\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003eD. Nanak \u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #181717; width:145px; padding:.113px 8px 0cm 5px; height:22px; border-top:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e4. Punjab \u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eselect the correct answer using the codes given below:\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eNamdev (1270 - 1350) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a Marathi Vaishnav saint from Narsi, Hingoli, Maharashtra. He was a leading poet-saint of the Indian medieval period, who wrote in the Marathi language. Namdev is also known as Nam Deo, Saint Namdev, or Sant Namdev.\u003c/li\u003e\r\n\t\u003cli\u003eNamdev was born to a religious artisan (tailor/calico-printer) Hindu family in the Marathi-speaking region (modern Maharashtra) of the then Deccan state. He was influenced by Vaishnavism and rose to prominence in India for his devotional hymns set to music (bhajan-kirtans).\u003c/li\u003e\r\n\t\u003cli\u003eNamdev\u0026rsquo;s life is shrouded in mystery. However, some say that Namdev, with other ascetics, visited all parts of the country and arrived in Punjab.\u003c/li\u003e\r\n\t\u003cli\u003eHe reached Village Ghuman, where Gurdwara Darbar Sahib is situated and resided for over 17 Years.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eChaitanya Mahaprabhu :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was born in 1486 in Nabadwip, Nadia, West Bengal. Nabadwip is now in present day West Bengal.\u003c/li\u003e\r\n\t\u003cli\u003eChaitanya was a Hindu mystic and a saint in the Krishna Bhakti cult. He is considered an incarnation of Lord Krishna and a proponent of the Vedantic philosophy of Achintya Bheda Abheda.\u003c/li\u003e\r\n\t\u003cli\u003eChaitanya\u0026rsquo;s mode of worshiping Krishna through dance and song had a significant impact on Vaishnavism in Bengal. He is also known for popularizing devotion to Lord Krishna.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSurdas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is a 15th century North Indian poet and devotee of the Bhakti Movement. He is known for his lyrics about Krishna, which are considered to be some of the best examples of Brajbhasa, a literary dialect of Hindi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGuru Nanak :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ethe first Sikh Guru, was born on April 15, 1469 in the village of R\u0101i Bhoi K\u012b Talvand\u012b, which is now Nankana Sahib, Pakistan.\u003c/li\u003e\r\n\t\u003cli\u003eNanak was born into a Hindu merchant caste and worked as a storekeeper until a spiritual experience led him to leave his job and family. He is said to have been curious about philosophical questions, such as the meaning of life and religion, from an early age.\u003c/li\u003e\r\n\t\u003cli\u003eNanak is buried by Muslims and cremated by Sikhs and Hindus.\u003c/li\u003e\r\n\t\u003cli\u003eA Gurdwara is located at his death place on the banks of the Ravi river in Pakistan, which is a sacred site for all, especially Sikhs.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43675", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGujarat kingdom\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{ove  "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMahmud Gawan was the Prime Minister in...........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1989)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMahmud Gawan (1411\u0026ndash;1481) was the prime minister of the Bahmani Sultanate of Deccan.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bahmani Kingdom was a Persianized Muslim state in South India that existed from 1347\u0026ndash;1527 AD.\u0026nbsp;It was the first independent Islamic kingdom in South India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bahmani Kingdom was founded by Ala-ud-Din Hasan Bahman Shah, also known as Zafar Khan. The kingdom\u0026rsquo;s capital was first Gulbarga, and later Bidar.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bahmani Kingdom was divided into many provinces called Tarafs. Each Taraf was controlled by a governor called a Tarafdar or Amir. The Sultans followed a Feudal type of administration. The Bahmani Sultans adopted the administrative structure of the Delhi Sultanate.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bahmani Kingdom was often at war with the neighboring Hindu Kingdom of Vijayanagara. The kingdom\u0026rsquo;s power reached its peak under Mahmud Gawan, who served as a prime minister and general to several sultans. Gawan extended the empire by reconquering Goa, which was under the Vijayanagar Empire.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Bahmani Kingdom declined due to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Constant war: \u003c/strong\u003eThe Bahmani and Vijaynagara rulers were frequently at war.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eWeak successors:\u003c/strong\u003e After the death of Muhammad Shah-III, the successors were weak and inefficient.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eForeign nobles:\u003c/strong\u003e Foreign nobles and regional rival rulers were heavy on the Bahmani Kings.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Bahmani Sultanate gradually broke up into five independent kingdoms:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Bijapur,\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Ahmadnagar,\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Berar,\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Golkonda,\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Bidar.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eGawan was a Persian merchant and military officer in the Bahamani military. He was appointed as Vakil-i-Sultanate in 1463 and served as prime minister for 20 years. Gawan was an able administrator who divided provinces into eight administrative units. He also founded the Madrasa of Mahmud Gawan, an Islamic college in Bidar, Karnataka, India in the 1460s.\u003c/li\u003e\r\n\t\u003cli\u003eGawan was executed by Muhammad Shah III, but the Sultan regretted it until his death in 1482.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Gujarat Sultanate :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a medieval Indian kingdom established in the 15thcentury. It was primarily located in the present-day state of Gujarat, India.\u003c/li\u003e\r\n\t\u003cli\u003eZafar Khan (Muzaffar Shah) established the Gujarat Sultanate after declaring independence from the Sultanate at the end of the 14th century. Zafar Khan was appointed governor of Gujarat in 1391. He defeated Farhat-ul-Mulk near Anhilwada Patan and made the city his capital.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome of the major dynasties that ruled Gujarat include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eChavda dynasty:\u003c/strong\u003e Ruled in the 8th century and founded Champaner\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eGurjara Pratiharas: \u003c/strong\u003eRuled from the 8th to the 9th century\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eMuslim rule: \u003c/strong\u003eRuled for four centuries after Allauddin Khilji\u0026rsquo;s invasion in 1297 AD\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kingdom of Mysore :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a southern Indian kingdom that was founded in 1399. It was located at the meeting point of the Eastern and Western Ghats. The kingdom was ruled by the Wadiyar dynasty from 1399 to 1950, with a brief hiatus in the late 1700s.\u003c/li\u003e\r\n\t\u003cli\u003eThe kingdom was a feudatory of the Vijayanagara Empire until 1565. In 1565, Mysore became an independent state under the Hindu Wodeyar dynasty. In 1761, Hyder Ali overthrew the dynasty and established his own control over the state. In 1782, Tipu Sultan succeeded Hyder Ali.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe kingdom\u0026rsquo;s history includes:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Literature:\u003c/strong\u003e The kingdom\u0026rsquo;s era is considered an important age of Kannada literature.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Music:\u003c/strong\u003e The kingdom was a center of Carnatic music.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Architecture:\u003c/strong\u003e The kingdom\u0026rsquo;s architecture includes palaces, courtly buildings, and temples.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kingdom of Kashmir :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a princely state that was under the British East India Company\u0026rsquo;s rule from 1846 to 1858.\u003c/li\u003e\r\n\t\u003cli\u003eKashmir was ruled by Hindu dynasties until 1346, when it came under Muslim rule. The Muslim period lasted nearly five centuries, ending when Kashmir was annexed to the Sikh kingdom of the Punjab in 1819 and then to the Dogra kingdom of Jammu in 1846.\u003c/li\u003e\r\n\t\u003cli\u003eThe first Muslim ruler of Kashmir was Shah Mir, who inaugurated the Shah Mir dynasty in 1339. The Mughal Empire ruled Kashmir from 1586 until 1751, and the Afghan Durrani Empire ruled from 1747 until 1819. During the Hindu period, Hinduism and Buddhism developed in Kashmir.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43676", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/ 03cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSufism is a mystical form of Islam that emphasizes spiritual closeness with God and introspection. It\u0026rsquo;s also known as Islamic mysticism or asceticism.\u003c/li\u003e\r\n\t\u003cli\u003eSufis reject outward religiosity and emphasize love and devotion to God. They also emphasize compassion towards all fellow human beings.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSufism\u0026rsquo;s practices include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Prescribed daily prayers\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Ritual chanting of God\u0026rsquo;s attributes (zhikr)\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Veneration of saints\u003c/p\u003e\r\n\r\n\u003cp\u003e4. An emphasis on personal and emotional religious experiences\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Renunciation of worldly things\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Purification of the soul\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Mystical contemplation of God\u0026rsquo;s nature\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Seeking spiritual learning known as tariqa\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSufis believe that God\u0026rsquo;s essence is seen in the existent human being, as God is the object and human beings the mirrors. This means that since humans are mere reflections of God there can be no distinction or separation between the two.\u003c/li\u003e\r\n\t\u003cli\u003eThe term \u0026ldquo;Sufi\u0026rdquo; is probably derived from the Arabic word \u0026ldquo;suf\u0026rdquo; which means \u0026ldquo;one who wears wool\u0026rdquo;. This is because woollen clothes were generally associated with ascetics.\u003c/li\u003e\r\n\t\u003cli\u003eSufi orders are brotherhoods or mystical orders that have been present in Muslim societies for more than 12 centuries. They are deeply embedded in the cultures of many Muslim communities in Europe.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAll of the following are popular Sufis:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Rabia alAdawiyya alQaysiyya: \u003c/strong\u003eA Muslim saint and Sufi mystic who is also known as Hazrat Bibi Rabia Basri\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Mansur alHallaj: \u003c/strong\u003eA Persian mystic poet and teacher of Sufism who is known for saying \u0026ldquo;I am the Truth\u0026rdquo;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Al-Ghazali: \u003c/strong\u003eA well-known and influential Persian Muslim philosopher of the Sunni Islam\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Mansur alHallaj : \u003c/strong\u003eis considered by some to be the most famous Sufi. He was executed in Baghdad in 922, and his death is considered a watershed moment in Sufism.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43677", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{ove portant}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following is located in Aurangabad?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1989)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "311", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Bibi Ka Maqbara, or \u0026ldquo;Tomb of the Lady\u0026rdquo;, is located in Aurangabad, Maharashtra, India. It was built in 1660 by the Mughal emperor Aurangzeb to honor his first wife, Dilras Banu Begum. The tomb is said to resemble the Taj Mahal.\u003c/li\u003e\r\n\t\u003cli\u003eThe Tomb of Aurangzeb is located in Khuldabad, Aurangabad district, Maharashtra.\u003c/li\u003e\r\n\t\u003cli\u003eShah Jahan\u0026rsquo;s tomb is located in the Taj Mahal in Agra, India. The Taj Mahal is a white marble mausoleum built between 1631 and 1648 by the Mughal emperor Shah Jahan in memory of his wife, Mumtaz Mahal.\u003c/li\u003e\r\n\t\u003cli\u003eThe tomb is located on a plinth\u003c/li\u003e\r\n\t\u003cli\u003ewith a minaret at each corner of the square garden, known as the Persian \u0026ldquo;char bagh\u0026rdquo;. The graves of Shah Jahan and Mumtaz Mahal are located underground, beneath two \u0026ldquo;false\u0026rdquo; tombstones, and are asymmetrically placed in the center of the monument.\u003c/li\u003e\r\n\t\u003cli\u003eAkbar\u0026rsquo;s tomb is the mausoleum of the Mughal emperor Akbar. It\u0026rsquo;s located in Sikandra, a suburb of Agra, Uttar Pradesh, India.\u003c/li\u003e\r\n\t\u003cli\u003eAkbar himself is believed to have chosen the site of the tomb and planned the structure during his lifetime. Akbar\u0026rsquo;s son, Jahangir, finished the tomb in 1613, using red sandstone and marble. The tomb is pyramidal in shape and has five storeys.\u003c/li\u003e\r\n\t\u003cli\u003eBabur\u0026rsquo;s tomb is located in the Gardens of Babur, Kabul, Afghanistan. The tomb is a square structure with four narrow arched openings, carved latticework, and a taller central arch. The tomb also has a rectangular plan, raised platform, arch shape, and minarets attached at the corners.\u003c/li\u003e\r\n\t\u003cli\u003eBabur was the first Mughal emperor and died in Agra in 1530 from an unknown illness. He was initially buried in Agra, but his widow transferred his body to Bagh-e Babur around 1544.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "412", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43678", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAkbar\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-
