\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eMahabalipuram\u003c/strong\u003e (also known as Mamallapuram) is famous not for Buddhist but for Pallava period Hindu art and architecture. It is located on the Coromandel Coast of Tamil Nadu. The site contains magnificent rock-cut temples, monolithic rathas (chariots), and bas-relief sculptures, such as the famous \u0026ldquo;Descent of the Ganga\u0026rdquo; or \u0026ldquo;Arjuna\u0026rsquo;s Penance.\u0026rdquo; These belong to the Dravidian architectural tradition and were primarily dedicated to Hindu deities like Shiva and Vishnu. Hence, Mahabalipuram represents Hindu Pallava art, not Buddhist art.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eKanchi,\u003c/strong\u003e also in Tamil Nadu. It is one of the seven sacred cities (Sapta Puri) in Hindu tradition and a major center of Hinduism and Jainism. Although Kanchi once had some Buddhist influence in early centuries, it is mainly known for Hindu temples such as Kailasanatha Temple, Vaikunta Perumal Temple, and Ekambareswarar Temple, built under the Pallavas and later Cholas. Therefore, its art is Hindu in nature, not primarily Buddhist.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eThe Vijayanagar Empire \u003c/strong\u003e(14th\u0026ndash;16th centuries CE) was a Hindu kingdom in South India, with its capital at Hampi (present-day Karnataka). Vijayanagar art and architecture flourished under rulers like Krishnadevaraya and are characterized by Dravidian-style temples, gopurams (gateway towers), and mandapas (pillared halls). The art here is Hindu, not Buddhist, and represents the renaissance of Hindu culture in southern India during the medieval period.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eAmravati\u003c/strong\u003e (in modern Andhra Pradesh) is one of the most significant Buddhist art centers in India. The site is home to the Amravati Stupa, also known as the Mahachaitya, dating from around the 2nd century BCE to 3rd century CE during the Satavahana period. The stupa was richly decorated with limestone reliefs depicting scenes from the life of the Buddha and Jataka tales. The Amravati school of art represents a distinctive style of early Indian Buddhist sculpture \u0026mdash; characterized by elegant human figures, dynamic postures, and narrative reliefs. It heavily influenced the later Gandhara and Sanchi art traditions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThus, the correct answer is (D) Amravati.\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43836", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAsvaghosa\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u ng the veena, sitar, and Swarabat, a musical instrument played by a Keralite woman.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAmrita Sher-Gil (1913\u0026ndash;1941) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eShe was a Hungarian-Indian painter who is considered a pioneer of modern Indian art. Her work is known for combining Eastern and Western influences, and for exploring female themes.\u003c/li\u003e\r\n\t\u003cli\u003eSher-Gil\u0026rsquo;s work is considered modern and Indian, and her visual language introduced new elements to modern Indian art. She is known for her handling of oil, which opened up new possibilities for future artists.\u003c/li\u003e\r\n\t\u003cli\u003eShe also had first-hand experience with European modern art trends, such as Impressionism and post\u0026ndash;Impressionism.\u003c/li\u003e\r\n\t\u003cli\u003eSher-Gil\u0026rsquo;s painting \u0026ldquo;The Story Teller\u0026rdquo; is part of the National Gallery of Art\u0026rsquo;s collection in Washington DC.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJamini Roy :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eShe was an Indian painter who was a pupil of Abanindranath Tagore. His work is known for its bright colors, bold brushstrokes, and use of traditional Bengali folk motifs.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRavi Shankar (1920-2012) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Indian musician and composer who played the sitar, an Indian stringed instrument. Shankar was a master of the sitar and is considered the world\u0026rsquo;s best known expert of North Indian classical music. He was also the founder of India\u0026rsquo;s National Orchestra and helped Westerners appreciate Indian music.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414 e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e4. Rabanindra Nath \u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e\u0026nbsp; Tagore\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #181717; width:137px; padding:.113px 8px 0cm 5px; height:41px; border-top:none; border-right:1px solid #181717; border-left:none\"\u003e\r\n\t\t\t\u003cp align=\"center\" style=\"margin-left:2px; text-align:center; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e\u0026nbsp;Painting\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eOf these pairs:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSubramania Bharati (1882-1921) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a Tamil poet, journalist, writer, social reformer, and Indian independence activist. He is considered a pioneer of modern Tamil poetry and one of the greatest Tamil literary figures of all time.\u003c/li\u003e\r\n\t\u003cli\u003eBharati was a lyrical poet whose works include Kannan Pattu, Nilavum Vanminum Katrum, Panchali Sabatam, and Kuyil Pattu. He also spent many years as a journalist, writing articles in multiple languages about Indian and world events. In 1906, he became the editor of the Tamil magazine India, which was published in Chennai and later moved to Pondicherry.\u003c/li\u003e\r\n\t\u003cli\u003eBharati was also a polyglot, fluent in many languages including Sanskrit, English, Hindi, Telugu, French, and Arabic.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHe was against the caste system and declared that there were only two castes:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. men and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. women.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was also opposed to child marriage and would immediately teach his poems to his wife and daughters.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSir Mokshagundam Visvesvaraya (1861 - 1962) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a civil engineer, economist, statesman, and nation-builder. He is known as the \u0026ldquo;Father of Indian Economic Planning\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eVisvesvaraya was an expert in irrigation design, reservoirs, dams, drinking water supply, and drainage schemes. As Chief Engineer of Mysore state, he led large-scale public works that expanded infrastructure like roads, dams, and power generation.\u003c/li\u003e\r\n\t\u003cli\u003eVisvesvaraya was also a strong supporter of technical education and industrialization. He set up schools and engineering institutions, and invented block irrigation.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1955, Visvesvaraya was awarded the Bharat Ratna, India\u0026rsquo;s highest civilian award, for his contributions to engineering and public service. His birthday, September 15, is celebrated as Engineer\u0026rsquo;s Day in India, Sri Lanka, and Tanzania.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJamsetji Nusserwanji Tata (1839 - 1904) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Indian industrialist and philanthropist who founded the Tata Group, India\u0026rsquo;s largest conglomerate company.\u003c/li\u003e\r\n\t\u003cli\u003eTata was a patriot and humanist who believed that his business would enrich India. He is known as the \u0026ldquo;father of Indian industrialization\u0026rdquo;. His ambitious endeavors helped India become an industrialized nation and catapult it into the league of industrialized countries.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRabindranath Tagore (1861 - 1941) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a Bengali poet, painter, composer, and writer who was active during the Bengal Renaissance. He was the first non European writer to win the Nobel Prize for Literature in 1913.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTagore\u0026rsquo;s works include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDrama, Short stories, Novels, Poetry, Songs (Rabindra Sangeet), Filmography, Art works.\u003c/li\u003e\r\n\t\u003cli\u003eTagore is celebrated as one of the greatest luminaries in the history of Indian literature and cultural renaissance. He introduced new prose and verse forms and the use of colloquial language into Bengali literature. He also wrote the national anthems for India and Bangladesh.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43841", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 5 3 2\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overfl /li\u003e\r\n\t\u003cli\u003eAccording to Nagarjuna, everything in the universe is devoid of intrinsic nature (\u015a\u016bnya) \u0026mdash; existence is dependent and relational, not absolute.\u003c/li\u003e\r\n\t\u003cli\u003eHis principal text, the M\u016blamadhyamakak\u0101rik\u0101 (Fundamental Verses on the Middle Way), explains that ultimate reality is beyond dualistic thinking \u0026mdash; neither existence nor non-existence.\u003c/li\u003e\r\n\t\u003cli\u003eThe \u0026ldquo;Middle Way\u0026rdquo; avoids both extremes: eternalism (believing things permanently exist) and nihilism (believing nothing exists).\u003c/li\u003e\r\n\t\u003cli\u003eNagarjuna\u0026rsquo;s ideas deeply shaped later Buddhist thought, influencing the Mahayana and Tibetan traditions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eLakulisha :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eLakulisha (also written Lakul\u012b\u015ba or Nakulisha) lived around the 2nd century CE and was one of the earliest exponents of Shaivism (worship of Lord Shiva). He is believed to be the 28th incarnation of Lord Shiva according to the Kurma Purana and other Shaivite texts.\u003c/li\u003e\r\n\t\u003cli\u003eHe is associated with the P\u0101\u015bupata sect, one of the oldest Shaiva ascetic orders.\u003c/li\u003e\r\n\t\u003cli\u003eThe term P\u0101\u015bupata comes from Pashupati, a form of Shiva as \u0026ldquo;Lord of Beings.\u0026rdquo;\u003c/li\u003e\r\n\t\u003cli\u003eThe Pashupata philosophy focused on ascetic discipline, renunciation, yoga, and devotion (bhakti) to Shiva.\u003c/li\u003e\r\n\t\u003cli\u003eLakulisha emphasized self-control, meditation, and detachment from worldly pleasures as the means to attain liberation (moksha).\u003c/li\u003e\r\n\t\u003cli\u003eHis followers, known as Pashupatas, practiced rituals involving ashes, sacred chants, and strict celibacy.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSankara (Adi Shankaracharya) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAdi Shankaracharya (788\u0026ndash;820 CE) was a towering Indian philosopher and theologian who consolidated the doctrine of Advaita Vedanta (\u0026ldquo;non-dualism\u0026rdquo;). He hailed from Kerala and, in a short lifespan, revitalized Hinduism at a time when Buddhism and ritualism were widespread.\u003c/li\u003e\r\n\t\u003cli\u003eAdvaita Vedanta teaches that the ultimate reality (Brahman) is the only truth \u0026mdash; \u0026ldquo;Brahma Satyam Jagat Mithya\u0026rdquo; \u0026mdash; meaning, Brahman alone is real; the world is an illusion (maya).\u003c/li\u003e\r\n\t\u003cli\u003eThe individual soul (Atman) is identical to Brahman \u0026mdash; liberation comes through realization of this oneness.\u003c/li\u003e\r\n\t\u003cli\u003eShankara\u0026rsquo;s commentaries on the Upanishads, Bhagavad Gita, and Brahma Sutras gave the philosophy a systematic form.\u003c/li\u003e\r\n\t\u003cli\u003eHe established four mathas (monastic centers) \u0026mdash; at Sringeri, Dwaraka, Puri, and Badrinath \u0026mdash; to preserve and propagate Vedanta.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBasava (Basaveshwara)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBasaveshwara, or Basava (12th century CE), was a great social reformer, poet, and philosopher from Karnataka. He initiated the Vira Saiva or Lingayat movement, which brought a revolutionary transformation to medieval South Indian society.\u003c/li\u003e\r\n\t\u003cli\u003eThe Vira Saiva (Veerashaiva or Lingayat) movement emphasized devotion to Lord Shiva in the form of the personal Ishtalinga worn by each follower.\u003c/li\u003e\r\n\t\u003cli\u003eBasava opposed caste discrimination, ritualism, temple domination, and promoted equality and inner purity.\u003c/li\u003e\r\n\t\u003cli\u003eHis teachings, written in Kannada as \u0026ldquo;Vachanas\u0026rdquo;, emphasize work as worship, social equality, and direct relationship with God without priestly intermediaries.\u003c/li\u003e\r\n\t\u003cli\u003eThe movement encouraged women\u0026rsquo;s participation and upheld moral integrity and selfless service.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTherefore the correct answer is (A) 4 5 3 2.\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43842", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 2 4 5\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e *{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Rajarani Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu temple in Bhubaneswar, India, built in the 11th century. It\u0026rsquo;s known for its intricate sculptures and ornate architecture.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is unique because it doesn\u0026rsquo;t have a presiding deity today. Historians believe that it was originally called Indresvara temple and was dedicated to Lord Shiva. The temple is locally known as the \u0026ldquo;love temple\u0026rdquo; because it contains carvings of women and couples.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Konark Sun Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Konark Sun Temple is also known as the Black Pagoda. It is a 13th-century Hindu temple in Konark, Odisha, India. The temple is dedicated to the Hindu sun god Surya, and is considered a pinnacle of Hindu Orissan architecture.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple\u0026rsquo;s name comes from the Sanskrit words Kona (angle) and Arka (sun). The temple is associated with the legend of Samba, the son of Krishna, who was cured of leprosy by the sun god\u0026rsquo;s blessings.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is known for its sculptural innovations and the quality of its carvings. It features 24 wheels, representing the wheels of Surya\u0026rsquo;s sun chariot. The 12 wheels represent the 12 months of the year, and the 8 spokes represent the 8 prahars or time divisions of the day.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Lepakshi murals :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are made of lime powder, red ochre, and liquid molasses mixed with sandy clay from riverbeds. They depict the social and religious life of the period, including various occupations.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome famous paintings from Lepakshi include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Shiva as bridegroom\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Royal Hermit\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Eight handed Lord Shiva\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Shiva with attendants\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe murals are located on the ceiling of the main mandapa, the antarala, and other shrines. The mural of Vatapatrasaayi on the eastern side of the Naatyamandapa is considered an example of the Vijayanagara style paintings.\u003c/li\u003e\r\n\t\u003cli\u003eThe word Lepakshi means painted eye. The Veerabhadra Temple was built in 1530 AD by Virupanna Nayaka and Viranna, brothers who were Governors under the Vijayanagar Empire.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHoysaleswara temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also referred simply as the Halebidu temple, is a 12th-century Hindu temple dedicated to the god Shiva.\u003c/li\u003e\r\n\t\u003cli\u003eIt is the largest monument in Halebidu, a town in the state of Karnataka, India and the former capital of the Hoysala Empire. The temple was built on the banks of a large man-made lake, and sponsored by King Vishnuvardhana of the Hoysala Empire. Its construction started around 1121 CE and was complete in 1160 CE.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43843", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u reak-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn which one of the following periods were the rockcut \u0026ldquo;Hindu\u0026rdquo; temples a characteristic feature of architecture?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1990)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSungas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Sunga period (c. 185\u0026ndash;73 BCE) followed the Mauryan Empire. The Sunga rulers were known for reviving Brahmanical (Hindu) traditions, but the architectural style of this period was largely associated with Buddhist stupas and railings, not Hindu temples.\u003c/li\u003e\r\n\t\u003cli\u003eMajor developments included additions to the stupa at Bharhut and Sanchi, where elaborate stone railings, gateways, and narrative sculptures depicting Jataka stories were carved.\u003c/li\u003e\r\n\t\u003cli\u003eWhile Hindu art revived under the Sungas, rock-cut Hindu temples had not yet emerged during this period.\u003c/li\u003e\r\n\t\u003cli\u003eHence, the Sunga period is significant for Buddhist sculpture and stupa decoration, not for rock-cut Hindu temple architecture.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSatavahanas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Satavahana dynasty (c. 1st century BCE \u0026ndash; 2nd century CE) ruled in the Deccan region. Their architecture was predominantly Buddhist in nature.\u003c/li\u003e\r\n\t\u003cli\u003eThe most famous examples are the rock-cut Buddhist caves at Karle, Nasik, Bhaja, and Ajanta in Maharashtra, which contain chaityas (prayer halls) and viharas (monastic dwellings).\u003c/li\u003e\r\n\t\u003cli\u003eThese structures were carved into rock but were not Hindu temples; they were primarily Buddhist sanctuaries.\u003c/li\u003e\r\n\t\u003cli\u003eThe Satavahanas did encourage some early Brahmanical art, but the fully developed rock-cut Hindu temple architecture appeared later, under the Pallavas.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, the Satavahanas are associated with Buddhist rock-cut architecture, not Hindu temples.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePallavas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Pallava dynasty (6th\u0026ndash;9th centuries CE) in South India marked a turning point in Indian temple architecture, especially with the emergence of rock-cut Hindu temples.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pallavas were the first rulers to create large-scale rock-cut shrines dedicated to Hindu deities, combining indigenous Dravidian styles with earlier cave architecture.\u003c/li\u003e\r\n\t\u003cli\u003eUnder kings like Mahendravarman I and Narasimhavarman I (Mamalla), temples evolved from simple rock-cut cave shrines to magnificent structural stone temples.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eExamples:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eRock-cut temples:\u003c/strong\u003e Mandagapattu Temple (Mahendravarman I), Mahishasuramardini Cave, and Varaha Cave in Mahabalipuram (Mamallapuram).\u003c/li\u003e\r\n\t\u003cli\u003eMonolithic rathas (chariots): The famous Five Rathas (Pancha Rathas) at Mahabalipuram.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStructural temples: \u003c/strong\u003eThe Shore Temple, representing the transition from rock-cut to free-standing stone temples.\u003c/li\u003e\r\n\t\u003cli\u003eThese monuments were primarily Hindu temples dedicated to Shiva, Vishnu, and Durga.\u003c/li\u003e\r\n\t\u003cli\u003eHence, the Pallava period is the correct answer, as rock-cut Hindu temples became a distinct and defining feature of architecture during their reign.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eCholas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Chola dynasty (9th\u0026ndash;13th centuries CE) came after the Pallavas and perfected structural temple architecture, not rock-cut temples.\u003c/li\u003e\r\n\t\u003cli\u003eThe Cholas constructed grand, free-standing temples made of stone rather than carving them from rock.\u003c/li\u003e\r\n\t\u003cli\u003eTheir architecture represented the culmination of the Dravidian style with tall vimanas (temple towers), elaborate sculptures, and vast courtyards.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFamous examples include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;Brihadeeswara Temple at Thanjavur (built by Raja Raja Chola I)\u003c/li\u003e\r\n\t\u003cli\u003eGangaikonda Cholapuram Temple \u0026nbsp;\u0026bull; Airavateswara Temple.\u003c/li\u003e\r\n\t\u003cli\u003eThese are structural masterpieces \u0026mdash; not rock-cut temples \u0026mdash; marking the maturity of South Indian temple architecture.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTherefore, the correct answer is (C) Pallavas.\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43844", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBhaskaracharya-Ashtanga Sangraha\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} \"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSri Harsha-Naishadha Charita\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following pairs is correctly matched?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1991)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBhaskaracharya :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e(also known as Bhaskara II, c. 1114 CE) was one of ancient India\u0026rsquo;s greatest mathematicians and astronomers, belonging to the later classical period. His most famous works are \u0026ldquo;Lilavati\u0026rdquo; and \u0026ldquo;Bijaganita\u0026rdquo;, both part of his larger treatise Siddhanta Shiromani, which deals with arithmetic, algebra, geometry, and astronomy.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the Ashtanga Sangraha is not his work \u0026mdash; it is a medical treatise on Ayurveda written by Vagbhata, a scholar of the 7th century CE, who was an authority on Indian medicine.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBhatti :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBhatti (7th century CE) was a Sanskrit poet known for composing the \u0026ldquo;Bhattikavya\u0026rdquo; or \u0026ldquo;R\u0101va\u1e47avadha\u0026rdquo;, a unique poem that narrates the story of the Ramayana while simultaneously serving as a grammatical text illustrating Panini\u0026rsquo;s rules of Sanskrit grammar.\u003c/li\u003e\r\n\t\u003cli\u003eThe work \u0026ldquo;Shishupala Vadha\u0026rdquo; (The Slaying of Shishupala) was actually composed by Magha, not Bhatti.\u003c/li\u003e\r\n\t\u003cli\u003eShishupala Vadha is a classical Sanskrit mahakavya (epic poem) that describes the slaying of King Shishupala by Lord Krishna.\u003c/li\u003e\r\n\t\u003cli\u003eIt is celebrated for its complex use of language and poetic devices, similar to Kalidasa\u0026rsquo;s style.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHemachandra :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHemachandra (1089\u0026ndash;1172 CE) was a renowned Jain scholar, grammarian, and polymath from Gujarat, patronized by King Kumarapala of the Solanki dynasty. His most famous works include:\u003c/li\u003e\r\n\t\u003cli\u003e\u0026ldquo;Siddha-Hema-Shabdanushasana\u0026rdquo; (a Sanskrit grammar text)\u003c/li\u003e\r\n\t\u003cli\u003e\u0026ldquo;Trishashti Shalaka Purusha Charita\u0026rdquo; (a Jain legendary history)\u003c/li\u003e\r\n\t\u003cli\u003e\u0026ldquo;Yoga Shastra\u0026rdquo; and \u0026ldquo;Abhidhanachintamani\u0026rdquo; (a lexicon).\u003c/li\u003e\r\n\t\u003cli\u003eHowever, \u0026ldquo;Kathasaritsagara\u0026rdquo; (Ocean of the Streams of Stories) was not written by Hemachandra \u0026mdash; it was composed by Somadeva, a Kashmiri Shaivite Brahmin in the 11th century CE.\u003c/li\u003e\r\n\t\u003cli\u003eKathasaritsagara is a monumental collection of Indian folk tales, legends, and moral stories compiled from the lost Brihatkatha by Gunadhya.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSri Harsha :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe also known as Harsha or Harsha Deva. He was a celebrated Sanskrit poet and dramatist who lived around the 12th century CE. He was different from King Harshavardhana of the 7th century. Sri Harsha\u0026rsquo;s most famous poetic work is the \u0026ldquo;Naishadha Charita\u0026rdquo; (Story of Nala and Damayanti), one of the Pancha Mahakavyas (five great epics) of classical Sanskrit literature.\u003c/li\u003e\r\n\t\u003cli\u003eNaishadha Charita narrates the love story of King Nala of Nishadha and Princess Damayanti, drawn from the Mahabharata.\u003c/li\u003e\r\n\t\u003cli\u003eIt is admired for its rich poetic diction, intricate use of meters, deep emotional expression, and mastery over Sanskrit literary conventions.\u003c/li\u003e\r\n\t\u003cli\u003eSri Harsha also wrote the plays Ratnavali, Priyadarsika, and Nagananda, often associated with King Harsha, but \u0026ldquo;Naishadha Charita\u0026rdquo; is firmly attributed to Sri Harsha the poet.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThus, the correct answer is D\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43845", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKangra School\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:1 img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe well-known painting \u0026lsquo;Bani Thani\u0026rsquo; belongs to the.............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1991)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe painting \u0026ldquo;Bani Thani\u0026rdquo; is part of the Kishangarh School of Indian painting. The Kishangarh School emerged in the 18th century in the Princely State of Kishangarh, which is located in Central Rajasthan.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kishangarh style of painting is a combination of Mughal and local styles. The theme of this style is the representation of the affection between Krishna and Radha.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026ldquo;Bani Thani\u0026rdquo; is an Indian miniature painting created by Nihal Chand from the Marwar school of Kishangarh. The painting depicts a woman who is elegant and graceful. The subject of the painting, Bani Thani, was a singer and poet in Kishangarh during the rule of Sawant Singh. Her portrait is often compared with that of the Mona Lisa.\u003c/li\u003e\r\n\t\u003cli\u003eThe artists used paper, fine cloth, wooden base, marble, ivory panels, and even leather for this art. On any of these mediums, Bani Thani is painted using vegetable and minerals colors, and even pure silver and gold is used to make the miniature rich and abundant.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKangra painting :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the pictorial art of Kangra, named after the Kangra State, a former princely state of Himachal Pradesh, which patronized the art. It became prevalent with the fading of Basohli school of painting in mid 18th century, and soon produced such a magnitude in paintings both in content as well as volume, that the Pahari painting school, came to be known as Kangra paintings.\u003c/li\u003e\r\n\t\u003cli\u003ePahari paintings, as the name suggests, were paintings executed in the hilly regions of India, in the sub-Himalayan state of Himachal Pradesh. It is in the development and modification of Pahari paintings, that the Kangra School features. Under the patronage of Maharaja Sansar Chand (c.1765\u0026ndash;1823), it became the most important center of Pahari painting.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Bundi School :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an important school of the Rajasthani style of Indian miniature painting that lasted from the 17th to the end of the 19th century in this princely state of Bundi ruled by Hadoti Rajputs.\u003c/li\u003e\r\n\t\u003cli\u003eOne of the earliest examples of the Bundi Paintings is the Chunar Ragamala painted in 1561. Bundi paintings emphasized on hunting, court scenes, festivals, processions, life of nobles, lovers, animals, birds and scenes from Lord Krishna\u0026rsquo;s life.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Jaipur School of painting :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Rajasthani school of painting that originated in the early 17th century in the old capital of the state of Amber. The school\u0026rsquo;s art developed between the late 16th and early 18th century and has elements of both the Rajasthani style and the Mughal style.\u003c/li\u003e\r\n\t\u003cli\u003eThe Jaipur School inherited the cultural legacy of the Amber style. The art developed under the close affiliation between the rulers of Jaipur and the Mughals. The artistspainted sets based on Rasikapriya, Gita Govinda, Baramasa and Ragamala, where the hero\u0026rsquo;s figure is in striking resemblance with the king.\u003c/li\u003e\r\n\t\u003cli\u003eThe school reached its apex under the reign of Sawai Pratap Singh in the 18th century. Suratkhana, or the painting department, created miniatures for the Bhagavata Purana, Ramayana, Ragamala, and many other portraits.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43846", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:10 003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAdi Shankaracharya is said to have established four monasteries in the four directions of India in the ninth century:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Jyotirmath:\u003c/strong\u003e In the north, in Uttara khand\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Sringeri: \u003c/strong\u003eIn the south\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Puri: \u003c/strong\u003eIn the east, in Odisha\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Dwarka: \u003c/strong\u003eIn the west, in Gujarat\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe monasteries were established to spread the philosophy of Advaita Vedanta and the concept of Sanatana dharma. The monasteries\u0026rsquo; establishment was a significant factor in the development of Shankara\u0026rsquo;s teachings into India\u0026rsquo;s leading philosophy.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kanchi Mutt is not one of the four monasteries, but it is still revered as it was the Hindu seer\u0026rsquo;s home.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWho was Adi Shankaracharya?\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAdi Shankara (788\u0026ndash;820 CE) was an Indian philosopher, theologian, and Vedic scholar who is considered one of the most influential figures in Indian philosophy.\u003c/li\u003e\r\n\t\u003cli\u003eShankara is best known for his philosophy of Advaita Vedanta, which teaches that there is a single reality. His writings focus on the identity of the Self (Atman) and Brahman. He believed that knowledge is the only thing that can save people from suffering.\u003c/li\u003e\r\n\t\u003cli\u003eShankara\u0026rsquo;s works include commentaries on the Brahma-sutra, the principal Upanishads, and the Bhagavadgita. He is also believed to be an avatar of Lord Shiva and founded four mathas, which are believed to have helped in the histori ajuraho temples :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is in Madhya Pradesh, India which is built in the Nagara style. The temples are a UNESCO World Heritage Site and are known for their Nagara-style architectural symbolism and erotic sculptures. The temples were built between 950 and 1050 by the Chandela dynasty.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe temples are divided into three clusters:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Eastern,\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Western, and\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Southern Khajuraho.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe temples are dedicated to Hinduism and Jainism, with the Hindu temples dedicated to Lord Shiva and Lord Vishnu.\u003c/li\u003e\r\n\t\u003cli\u003eThe temples are made up of a sanctum, a narrow ante-chamber, a transept, additional halls, a mandapa or nave, and an ambulatory passage.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Brihadeeswara Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was built by Chola emperor Rajaraja I between 1003 and 1010 CE in the Dravidian architectural style. The temple is dedicated to Lord Shiva and is located in Thanjavur, Tamil Nadu, India.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is a UNESCO World Heritage Site and is considered a testament to the Chola dynasty\u0026rsquo;s artistic and architectural achievements. The temple\u0026rsquo;s walls feature inscriptions that detail the ruler\u0026rsquo;s gifts to the temple.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Hoysaleswara Temple in Halebidu :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an example of Hoysala architecture. Hoysala architecture is a Hindu temple building style that developed between the 11th and 14th centuries in the region of Karnataka. The temple\u0026rsquo;s architecture is a fusion of Hoysala and Dravidian styles.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hoysala Empire was founded by Nripa Kama II, who reigned from 1026 CE to 1047 CE. Other examples of Hoysala architecture include the Chennakesava Temple at Belur and the Kesava Temple at Somanathapura. In 2023, these three temples were given UNESCO world heritage site status.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSeven Pagodas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Mamallapuram or Mahabalipuram, is a structural temple built in the Dravidian style of architecture. The temple is made of granite blocks and dates back to the 8th century AD.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pallava dynasty ruled the area from the 6th to 9th centuries CE and built the monuments at Mamallapuram.\u003c/li\u003e\r\n\t\u003cli\u003eThe monuments include rock-cut cave temples, monolithic free-standing rathas, open air-bas-relief, and structural temples. The Shore Temple is a free-standing rock cut structural temple in the Dravidian style. Dravidian temples are usually enclosed by an outer wall with a large gateway tower. The Shore Temple has an octagonal neck topped by a round finial.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43854", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003 tyle\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following is a historical work by Hemachandra?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1992)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;Acharya Hemachandra was a Jain scholar, poet, and polymath who wrote several historical works, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Kumarpal Charita: \u003c/strong\u003eA biography of the Indian king Kumarapala\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Trishashti shalaka purusha charitra:\u003c/strong\u003e An epic Sanskrit poem about the lives of 63 Jain figures\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Dvyashraya Kavya: \u003c/strong\u003eAn epic about the history of the Chaulukya dynasty\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHemachandra also wrote Sanskrit and Prakrit grammars, textbooks on science and Indian philosophy, and several other poems.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePrabandha Chintamani :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a collection of semi-historical biographical narratives, or prabandhas, written in Sanskrit. It was compiled in 1304 CE by Jain scholar Merutunga in the Vaghela kingdom, which is present-day Gujarat.\u003c/li\u003e\r\n\t\u003cli\u003eThe book is an important text in Jain literature and provides details about the political and cultural life of the 14th century. It also includes dates for the accession of the kings of Anhilvada over a period of about 400 years.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKarnataka Bhasha Bhushana :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a 12th century work on Kannada grammar by Nagavarmma. The title translates to \u0026ldquo;Ornament of the Karnataka language\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eNagavarma is considered the greatest Kannada grammarian and is also known for his works Kavyavalokana, Vastukosa, and Varadhamanapurana. Karnataka Bhasha Bhushana is a 170-page hardcover book published in 2020 by Lewis Rice. It includes 280 sutras and romanized verses with appended Kannada.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSamarangana Sutradhara :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an 11th-century poetic treatise on classical Indian architecture. The title translates literally to \u0026ldquo;an architect of human dwellings\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe treatise is written in Sanskrit and attributed to the Paramar King Bhoja of Dhar, Madhya Pradesh. It is composed in poetic verses, detailing the theory and practice of Hindu temple architecture in north, west and south India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe treatise covers a wide range of topics, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eTown planning, House architecture, Temple architecture, Sculpture, Iconography, Iconometry, Iconoplastic art, Mudras, Creation-theory, Geography.\u003c/li\u003e\r\n\t\u003cli\u003eThe treatise is made up of 83 chapters, 7,500 verses, and an introduction, Sanskrit text, and verse-by-verse English translation.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43860", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3, 2, 1 and 4\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 4, 3 and 2\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-w e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following pairs of famous sayings and their sources is correctly matched?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1992)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026ldquo;Vasudhaiva Kutumbakam\u0026rdquo; :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an ancient Indian phrase that means \u0026ldquo;the world is one family\u0026rdquo;. It has been a guiding principle for the Indian family system since ancient times. The phrase has become amantra in India\u0026rsquo;s diplomatic lexicon, and many Indian leaders, including Jawaharlal Nehru and Narendra Modi, have used it to explain the country\u0026rsquo;s global outlook.\u003c/li\u003e\r\n\t\u003cli\u003eThe phrase is from the Maha Upanishad. The theme and the logo for India\u0026rsquo;s G20 Presidency from December 1, 2022, till November 30, 2023 has a mention of \u0026ldquo;Vasudhaiva Kutumbakam\u0026rdquo; or \u0026ldquo;One Earth One Family-One Future\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026ldquo;Yogakshemam Vahamyaham\u0026rdquo; :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Sanskrit slogan that means \u0026ldquo;Your welfare is our responsibility\u0026rdquo;. It is the guiding philosophy of the Life Insurance Corporation of India (LIC). The slogan is derived from the 22nd verse of the 9th chapter of the Bhagavad Gita. In the verse, Lord Krishna says, \u0026ldquo;I personally take care of the well-being and protection of those who wholeheartedly surrender to me with unwavering faith\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSatyameva Jayate :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe national motto of India, which translates to \u0026ldquo;truth alone triumphs\u0026rdquo;. It is a part of a mantra from the Hindu scripture Mundaka Upanishad, the concluding part of the sacred Hindu Vedas. The motto is inscribed in Devanagari script at the base of the Lion Capital of Ashoka and is an integral part of the Indian national emblem. It was adopted as the national motto of India on January 26, 1950, the day India became a republic.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSatyam Shivam Sundaram :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a phrase that means truth, goodness, and beauty. It is a core value in the Vedas, Upnishads, Epics, and Puranas. It is said that truth, beauty, and joy are the forms of divinity.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43862", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks":  img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBharatnatyam\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThillana is a format of............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1992)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThillana is a format of Bharatanatyam, a classical Indian dance form that originated in Tamil Nadu. It is a rhythmic dance that is performed at the end of a Bharatanatyam recital.\u003c/li\u003e\r\n\t\u003cli\u003eThillana is a pure dance form that focuses on the use of intricate footwork and rhythmic movements. It is a presentation style in Bharatanatyam where a host of dancers perform together, exploring the extent of strong kinetics. This style requires exemplary skills in terms of rhythm, timing, and synchronization.\u003c/li\u003e\r\n\t\u003cli\u003eThillana is a small composition sung towards the end of a Carnatic concert. It is one of the most anticipated pieces in the recital. Thillanas are popular because of their use of Jathis, which are syllables with fast pace and mathematical patterns.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKathak :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is one of the eight major forms of Indian classical dance. The origin of Kathak is traditionally attributed to the traveling bards in ancient northern India known as Kathakar or storytellers.\u003c/li\u003e\r\n\t\u003cli\u003eThe term Kathak is derived from the Sanskrit word Katha which means \u0026ldquo;story\u0026rdquo;, and Kathakar which means \u0026ldquo;the one who tells a story\u0026rdquo;, or \u0026ldquo;to do with stories\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eWandering Kathakar communicated stories from the great epics and ancient mythology through dance, songs and music.\u003c/li\u003e\r\n\t\u003cli\u003eKathak dancers tell various stories through their hand movements and extensive footwork, their body movements and f lexibility but most importantly through their facial expressions. Kathak often has a strong beat, and can be danced in many taals. Kathak evolved during the Bhakti movement, particularly by incorporating the childhood and stories of the Hindu god Krishna, as well as independently in the courts of north Indian kingdoms.\u003c/li\u003e\r\n\t\u003cli\u003eDuring the period of Mughal rule, the emperors were patrons of Kathak dance and actively promoted it in their royal courts.\u003c/li\u003e\r\n\t\u003cli\u003eKathak performances include Urdu ghazaland commonly used instruments brought during the Mughal period. As a result, it is the only Indian classical dance form to feature Persian elements.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKuchipudi :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a classical Indian dance form that combines Nritta (pure dance), Nritya (expressional dance), and Natya (drama). It\u0026rsquo;s characterized by intricate footwork, graceful movements, and subtle facial expressions.\u003c/li\u003e\r\n\t\u003cli\u003eKuchipudi is named after the village of Kuchipudi in Andhra Pradesh, where it was f irst performed. It originated in the 17th century with the creation of the dance drama Bhama Kalapam by Sidhyendra Yogi. The dance-drama is about Satyabh\u0101ma, the jealous wife of the god Krishna.\u003c/li\u003e\r\n\t\u003cli\u003eKuchipudi is different from the other five classical dance styles in India because it includes singing. It was originally only practiced by men, but later women were allowed to participate.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOdissi :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a classical Indian dance form that originated in the temples of Odisha. It is one of the eight classical dances of India.\u003c/li\u003e\r\n\t\u003cli\u003eOdissi is characterized by its graceful movements and lyrical quality. It is usually performed to Orissa classical music, a traditional style of Indian classical music that originated in the state of Odisha.\u003c/li\u003e\r\n\t\u003cli\u003eOdissi is based on the classical Natya Shastra and the Abhinaya Darpana. It is considered a dance of love that touches on the human and divine aspects of life.\u003c/li\u003e\r\n\t\u003cli\u003eOdissi dance is considered to be one of the most complex forms of classical dances. It keeps different body parts in sync and strengthens the lower half of your body, especially muscles of your thighs and calves.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome features of Odissi dance include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1.\u0026nbsp;Hasta mudra:\u003c/strong\u003e Or hand gestures play a significant role in Odissi dance.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Rhythm: \u003c/strong\u003eThe rhythm is referred to as tala in India.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Body movement:\u003c/strong\u003e Body movement and facial expression help to express the narrative.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe earliest form of Odissi is said to be the Odhra Magadha, which is a southeastern style of classical dance.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBharatanatyam :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a classical dance form from Tamil Nadu, India. It is known for its grace, purity, and sculpturesque poses. Bharatanatyam is recognized by the Sangeet Natak Akademi and expresses South Indian religious themes and spiritual ideas, particularly of Shaivism and in general of Hinduism.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43863", "image_check": "0", "i ndi School\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eJaipur School\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe well known painting, Bani Thani\u0026rsquo; belongs to the............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1992)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe painting \u0026ldquo;Bani Thani\u0026rdquo; is part of the Kishangarh School of Indian painting. The Kishangarh School emerged in the 18th century in the Princely State of Kishangarh, which is located in Central Rajasthan.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kishangarh style of painting is a combination of Mughal and local styles. The theme of this style is the representation of the affection between Krishna and Radha.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026ldquo;Bani Thani\u0026rdquo; is an Indian miniature painting created by Nihal Chand from the Marwar school of Kishangarh. The painting depicts a woman who is elegant and graceful. The subject of the painting, Bani Thani, was a singer and poet in Kishangarh during the rule of Sawant Singh. Her portrait is often compared with that of the Mona Lisa.\u003c/li\u003e\r\n\t\u003cli\u003eThe artists used paper, fine cloth, wooden base, marble, ivory panels, and even leather for this art. On any of these mediums, Bani Thani is painted using vegetable and minerals colors, and even pure silver and gold is used to make the miniature rich and abundant.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKangra painting :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the pictorial art of Kangra, named after the Kangra State, a former princely state of Himachal Pradesh, which patronized the art. It became prevalent with the fading of Basohli school of painting in mid 18th century, and soon produced such a magnitude in paintings both in content as well as volume, that the Pahari painting school, came to be known as Kangra paintings.\u003c/li\u003e\r\n\t\u003cli\u003ePahari paintings, as the name suggests, were paintings executed in the hilly regions of India, in the sub-Himalayan state of Himachal Pradesh. It is in the development and modification of Pahari paintings, that the Kangra School features. Under the patronage of Maharaja Sansar Chand (c.1765\u0026ndash;1823), it became the most important center of Pahari painting.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Bundi School :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an important school of the Rajasthani style of Indian miniature painting that lasted from the 17th to the end of the 19th century in this princely state of Bundi ruled by Hadoti Rajputs.\u003c/li\u003e\r\n\t\u003cli\u003eOne of the earliest examples of the Bundi Paintings is the Chunar Ragamala painted in 1561. Bundi paintings emphasized on hunting, court scenes, festivals, processions, life of nobles, lovers, animals, birds and scenes from Lord Krishna\u0026rsquo;s life.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Jaipur School of painting :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Rajasthani school of painting that originated in the early 17th century in the old capital of the state of Amber. The school\u0026rsquo;s art developed between the late 16th and early 18th century and has elements of both the Rajasthani style and the Mughal style.\u003c/li\u003e\r\n\t\u003cli\u003eThe Jaipur School inherited the cultural legacy of the Amber style. The art developed under the close affiliation between the rulers of Jaipur and the Mughals. The artists painted sets based on Rasikapriya, Gita Govinda, Baramasa and Ragamala, where the hero\u0026rsquo;s figure is in striking resemblance with the king.\u003c/li\u003e\r\n\t\u003cli\u003eThe school reached its apex under the reign of Sawai Pratap Singh in the 18th century. Suratkhana, or the painting d p: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSamarangana Sutradhara :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a 11th-century poetic treatise written in Sanskrit by Paramara King Bhoja of Dhar, who lived from 1000-1055 AD. The work is an encyclopedic study of classical Indian architecture, also known as Vastu Shastra. The word Samarangana literally means \u0026quot;architect of human dwellings\u0026quot; and refers to the planning of towns and villages, the construction of houses, halls, palaces, and various machines.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMattavilasaprahasana :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMahendravarman I (571-630CE) wrote the Sanskrit play Mattavilasa Prahasana in the early seventh century. The play\u0026#39;s title translates to \u0026quot;A Farce of Drunken Sport\u0026quot;.\u003c/li\u003e\r\n\t\u003cli\u003eMattavilasa Prahasana is a Buddhist text that discusses the decline of Buddhism in Tamizhakam. Mahendravarman I was a Pallava King who also expanded the Pallava Kingdom and introduced many ornate temples and monuments in southern India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe M\u0026auml;nasoll\u0101sa:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Abhilashitartha\u003c/li\u003e\r\n\t\u003cli\u003eChintamani, is a Sanskrit text written by the Kalyani Chalukya king Someshvara III in the early 12th century. The book is also known as a manual of instruction for kings,\u003c/li\u003e\r\n\t\u003cli\u003eSomeshvara III ruled over the Karnataka-Andhra regions from 1126-1138. The book
