*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJagannath Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an important Hindu temple in Puri, Odisha, that is dedicated to Jagannath, a form of Vishnu. The temple is part of the Char Dham pilgrimages, which also include Badrinath, Dwaraka, and Rameswaram.\u003c/li\u003e\r\n\t\u003cli\u003eThe state government of Odisha has decided to use facial recognition technology based on artificial intelligence (AI) at the Jagannath Temple in Puri to prevent stampedes and track criminals.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Konark Sun Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Konark Sun Temple is also known as the Black Pagoda. It is a 13th-century Hindu temple in Konark, Odisha, India. The temple is dedicated to the Hindu sun god Surya, and is considered a pinnacle of Hindu.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOrissan architecture :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe temple\u0026rsquo;s name comes from the Sanskrit words Kona (angle) and Arka (sun). The temple is associated with the legend of Samba, the son of Krishna, who was cured of leprosy by the sun god\u0026rsquo;s blessings.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is known for its sculptural innovations and the quality of its carvings. It features 24 wheels, representing the wheels of Surya\u0026rsquo;s sun chariot. The 12 wheels represent the 12 months of the year, and the 8 spokes represent the 8 prahars or time divisions of the day.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKandariya Mahadeva Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu temple in the Khajuraho Group of Monuments in the Chhatarpur district of Madhya Pradesh, India. Built between 1025-1050 AD, the temple is the largest and most ornate in the medieval temple group. It\u0026rsquo;s also known as the \u0026ldquo;Great God of the Cave\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is dedicated to Lord Shiva and is considered one of the best examples of temples preserved from the medieval period in India. It\u0026rsquo;s built in the shape of a steep mountain, with 84 mini shikharas on the roof to represent the minor mountain peaks around Mount Meru.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe temple\u0026rsquo;s main features include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A marble shivalingam in the sanctum\u003c/p\u003e\r\n\r\n\u003cp\u003e2. About 870 sculptures, including erotic statues\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Nagara-style architectural symbolism\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe temple complex is spread over 6 square kilometers (2.3 sq mi) in the Khajuraho village, to the west of the Vishnu temple.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eChausath Yogini Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Golaki Math, is a Hindu temple in Bhedaghat, Madhya Pradesh. It is a popular heritage tourism attraction and is often considered part of Jabalpur sightseeing.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is a circular structure with a diameter of 130 feet and an inner diameter of 116 meters. It has 64 small shrines, each dedicated to one of the yoginis. The main shrine is dedicated to the goddess Durga, who is considered to be the chief among the yoginis. The temple also has 84 cells that form a full circle.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is built in the 11th century A.D. and is located on a hilltop in Bhedaghat. Around 150 steep steps lead to the shrine, which is at a good height.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43870", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMegasthenes\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eFa-Hien\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overf _3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026ldquo;Live well, as long as you live. Live well even by borrowings, for, once cremated, there is no \u0026lsquo;return.\u0026rdquo; This rejection of after-life in an aphorism of the.............\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1994)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eCharvaka, also known as Lokayata, is an ancient school of Indian materialism. Charvaka holds direct perception, empiricism, and conditional inference as proper sources of knowledge, embraces philosophical skepticism and rejects ritualism, and supernaturalism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kapalika sect :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey were a group of Shaivite ascetics who practiced a tantric form of Saivism from the 8th to the 13th century. The name \u0026ldquo;Kapalika\u0026rdquo; literally means \u0026ldquo;skull-men\u0026rdquo; because they carried a skull-topped staff and a cranium begging bowl.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kapalika sect are known for their esoteric rituals, which allegedly included animal and human sacrifice. However, there is no evidence for the latter. Some members of the Kapalika-s are thought to have written the Bhairava Tantra-s, including the Kaula Tantra-s subdivision.The Kapalika sect are one of the more radical sects to have existed.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSunyavada, or the \u0026ldquo;Doctrine of Void\u0026rdquo;:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the philosophy of Nagarjuna, a Buddhist monk who lived from 150 to 250 CE. Sunyavada is a major school of Buddhism, and Nagarjuna is considered the first to systematically expound it.\u003c/li\u003e\r\n\t\u003cli\u003eNagarjuna\u0026rsquo;s philosophy is based on the Buddhist theory of \u0026ldquo;dependent origination\u0026rdquo; (pratitya-samutpada). This doctrine states that whatever exists, exists as being dependent on its causes and conditions. Nagarjuna\u0026rsquo;s central concept is the \u0026ldquo;emptiness (sunyata) of all things (dharmas)\u0026rdquo;. This concept points to the ever-changing and therefore never fixed nature of all phenomena.\u003c/li\u003e\r\n\t\u003cli\u003eNagarjuna\u0026rsquo;s arguments cover a number of topics, including knowledge.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHe listed four epistemic instruments:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. perception,\u003c/p\u003e\r\n\r\n\u003cp\u003e2. inference,\u003c/p\u003e\r\n\r\n\u003cp\u003e3. recognition of likeness, and\u003c/p\u003e\r\n\r\n\u003cp\u003e4. something else.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to Kumarajiva, Nagarjuna was born at the foot of an Arjuna tree to a brahmin family in South India. He excelled in the traditional religious and secular subjects studied by the Indian priestly caste and by the age of twenty was renowned for his learning.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Ajivikas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey were an ancient Indian philosophical sect and ascetic movement that lasted until the 14th century. The Ajivikas believed that everything is predetermined by fate, and that human actions have no consequence. They also believed in karma and liberation.\u003c/li\u003e\r\n\t\u003cli\u003eThe Ajivikas were a rival to Buddhism and Jainism, and were popular during the reign of the Mauryan Emperor Bindusara. The Ajivikas believed in rebirth and a doctrine of reanimation, which is the idea that one person\u0026rsquo;s soul can be reanimated in the dead bodies of others.\u003c/li\u003e\r\n\t\u003cli\u003eThe Ajivikas were founded by Goshala Maskariputra, a friend of Mahavira, the 24th Tirthankara. The name Ajivika may mean \u0026ldquo;following the ascetic way of life\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43875", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} ;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following temples figured in the news regarding the institution of the Devadasis?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Jagannath Temple in Puri has been historically associated with the institution of the Devadasis. The Devadasi system became prevalent from the Chola period, when temples became large complexes that required a large number of permanent women workers.\u003c/li\u003e\r\n\t\u003cli\u003eIn the Jagannath Temple, Devadasis would dance in the main hall after Lord Jagannatha gave Darshana to the devotees. The Devadasis would perform pure dance, accompanied by musicians and the Rajaguru (the court guru). The audience could watch the Devadasis dance.\u003c/li\u003e\r\n\t\u003cli\u003eThe Jagannath Temple administration attempted to enroll fresh Devadasis to keep the 800-year-old tradition alive, but the effort failed due to nationwide protest and because no girl volunteered. In 2021, Parasmani Devi, the last surviving \u0026ldquo;devadasi\u0026rdquo; of the Shri Jagannath Temple, died at the age of 90.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJagannath Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an important Hindu temple in Puri, Odisha, that is dedicated to Jagannath, a form of Vishnu. The temple is part of the Char Dham pilgrimages, which also include Badrinath, Dwaraka, and Rameswaram.\u003c/li\u003e\r\n\t\u003cli\u003eThe state government of Odisha has decided to use facial recognition technology based on artificial intelligence (AI) at the Jagannath Temple in Puri to prevent stampedes and track criminals.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePashupatinath Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu temple in Kathmandu, Nepal. It\u0026rsquo;s located on both sides of the Bagmati River, on the eastern outskirts of Kathmandu.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is dedicated to Pashupati, a form of Shiva. It is considered one of the holiest Hindu shrines in Nepal and was classified as a World Heritage Site in 1979.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKandariya Mahadeva Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu temple in the Khajuraho Group of Monuments in the Chhatarpur district of Madhya Pradesh, India. The temple is dedicated to Lord Shiva and is known for its elaborate Nagara style architecture.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple\u0026rsquo;s name means \u0026ldquo;the Great God of the Cave\u0026rdquo;. It\u0026rsquo;s the largest and most ornate temple in the medieval temple group, and is considered one of the best examples of medieval temples in India. The temple is built in the shape of a steep mountain, with 84 mini shikharas on its roof representing the minor peaks around Mount Meru. The temple\u0026rsquo;s 30.5-meter-long structure was built between 1025 and 1050 and represents the high point of Chandela architecture.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Chausath Yogini temple in Morena :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an 11th-century temple located in Mitaoli village, 40 km from Gwalior. The temple is also known as Ekattarso Mahadeva Temple.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to an inscription from 1323 CE, the temple was built by King Devapala of the Kachchhapaghata dynasty. The temple is made of sand and granite stones and has a circular shape with a 130 m outer wall and 116 m inner wall. Some say it is a beautiful piece of heritage and a good place to visit.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43878", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style le\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTreta, Dvapara, Kali and Krita\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAccording to ancient Indian cosmogonic ideas the sequential order of the cycle of four acons (Yugas) is............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to ancient Indian cosmogonic ideas, the sequential order of the cycle of four aeons (yugas) is Krita, Treta, Dvapara, and Kali.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKrita Yuga :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the first and best of the four yugas, or world ages, in a Yuga Cycle. It is also known as Satya Yuga, or the Golden Age.\u003c/li\u003e\r\n\t\u003cli\u003eKrita Yuga lasts for 1,728,000 years, with 400 years each of the beginning and end transitions (sandhyas), making it 4,800 years.\u003c/li\u003e\r\n\t\u003cli\u003eKrita Yuga is an age of perfection, truth, and goodness. It is named as such because there was only one religion, all men were saintly, and therefore they were not required to perform religious ceremonies.\u003c/li\u003e\r\n\t\u003cli\u003eDuring Krita Yuga, the process of self realization is meditation on Visnu. The average life span at the beginning of the yuga is 100,000 years.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTreta Yuga :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the second of four yugas in a Yuga Cycle. The word \u0026ldquo;Treta Yuga\u0026rdquo; means \u0026ldquo;three collections\u0026rdquo; or \u0026ldquo;age of three\u0026rdquo;. It lasts for 1,296,000 years, which is three times the length of the Kali Yuga.\u003c/li\u003e\r\n\t\u003cli\u003eTreta Yuga is preceded by the Satya Yuga and followed by the Dvapara Yuga. According to Hindu mythology, the events of the Ramayana take place in Treta Yuga.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOther important events that occur during Treta Yuga include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The appearance of agriculture and mining\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The rise of Lord Rama as a beacon of righteousness\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The appearance of three avatars of Lord Vishnu, i) Vamana, ii) Parashurama, and iii) Rama, respectively\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The building of great and tall stone structures across the earth\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDvapara Yuga :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the third and third-best of the four yugas in a Yuga Cycle. It lasts for 864,000 years.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to the Puranas, this yuga ended when Krishna returned to his eternal home in Vaikuntha.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some other characteristics of Dvapara Yuga:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1.\u0026nbsp;Religion: \u003c/strong\u003eReligion is based on two principles: honesty and compassion.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Energy:\u003c/strong\u003e This age is referred to as the age of energy because in this age we are better able to understand and har ness energy than in Kali Yuga.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Technology:\u003c/strong\u003e Technology is booming and all sorts of new religions, philos ophies, and scientific discoveries are popping up.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Ego: \u003c/strong\u003eThe ego in Dvapara Yuga is en ergized.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKali Yuga :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the fourth and final Yuga in the cycle of ages. It is believed to have begun in 3102 BCE and last for 432,000 years.\u003c/li\u003e\r\n\t\u003cli\u003eKali Yuga is known as the age of darkness, ignorance, and devastation. It is believed to be the present age, full of conflict and sin.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome characteristics of the Kali Yuga include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;1.\u0026nbsp;An increase in diseases and disorders\u003c/p\u003e\r\n\r\n\u003cp\u003e2. People accept harsh and cruel conditions as basic to life\u003c/p\u003e\r\n\r\n\u003cp\u003e3. People will indulge in trade and commercial activity, even though having the outward appearance of saints\u003c/p\u003e\r\n\r\n\u003cp\u003e4. A man will be friends only with his wife\u003c/p\u003e\r\n\r\n\u003cp\u003e5. People will exhibit ingenuity and skill in engineering\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eNear the end of Kali Yuga, a cataclysm and a re-establishment of dharma occur to usher in the next cycle\u0026rsquo;s Krita (Satya) Yuga.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43879", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOutcastes among the Rajputs\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\" -width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe term apabhramsa was used in medieval Sanskrit texts to denote..............\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe term apabhramsa was used in medieval Sanskrit texts to describe the Prakrit languages that evolved from Sanskrit. The term comes from Sanskrit, where \u0026ldquo;apa\u0026rdquo; means \u0026ldquo;away\u0026rdquo; or \u0026ldquo;off\u0026rdquo; and \u0026ldquo;bhramsa\u0026rdquo; means \u0026ldquo;deviation\u0026rdquo; or \u0026ldquo;corruption\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eApabhramsa is a term that is collectively provided to the dialects that deviate from Sanskrit. It literally means \u0026ldquo;corrupt\u0026rdquo; or \u0026ldquo;non-grammatical language\u0026rdquo;, that which deviates from the norm of Sanskrit grammar.\u003c/li\u003e\r\n\t\u003cli\u003eApabhramsa was used to den nbsp;(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMauryan Scupltures :\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Mauryan period (4th\u0026ndash;2nd century BCE) is best known for its highly polished stone sculptures, especially the Ashokan pillars and animal capitals (like the famous Lion Capital of Sarnath). The Mauryan artists worked primarily with Chunar sandstone, a fine-grained, buff-colored stone from near Varanasi.\u003c/li\u003e\r\n\t\u003cli\u003eMauryan art is noted for its mirror-like polish and symbolic simplicity rather than for naturalism. While Mauryan sculptors achieved great mastery in stone finishing, they did not use green schist. Their medium was sandstone, not schist or granite.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMathura Sculptures :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Mathura School of Art developed around the 2nd century BCE to 3rd century CE in the region of Uttar Pradesh, particularly Mathura. It represented the indigenous Indian style of sculpture \u0026mdash; robust, sensuous, and spiritually expressive.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mathura artists used reddish or pinkish spotted sandstone, obtained locally from the Sikri quarries near Mathura. The sculptures from this school often depict Buddha, Jain Tirthankaras, and Hindu deities with round faces, thick bodies, and smooth modeling, reflecting vitality and earthly warmth.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBharhut Sculptures :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Bharhut Stupa in Madhya Pradesh represents early Sunga period (2nd century BCE) Buddhist art. It is famous for its railing and gateway sculptures, which depict scenes from the Jataka tales, symbolic motifs, and narrative reliefs.\u003c/li\u003e\r\n\t\u003cli\u003eThe stone used in Bharhut sculptures was reddish-brown sandstone, a local material. The carvings are more linear and detailed, with figures that are symbolic rather than naturalistic. The use of schist was unknown in this school \u0026mdash; the artists relied on sandstone typical of Central India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGandhara Sculptures :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Gandhara School of Art (1st century BCE \u0026ndash; 5th century CE) flourished under the Kushanas, particularly Kanishka, in regions covering northwestern India and Afghanistan \u0026mdash; mainly Taxila, Peshawar, and Bamiyan.\u003c/li\u003e\r\n\t\u003cli\u003eThe Gandhara artists combined Indian religious themes (especially Buddhism) with Greek and Roman artistic techniques \u0026mdash; a style known as Greco-Buddhist art. The figures display naturalistic human anatomy, wavy hair, calm expressions, and flowing drapery reminiscent of Greek sculptures.\u003c/li\u003e\r\n\t\u003cli\u003eImportantly, Gandhara sculptures were carved predominantly out of green schist (chlorite schist) and sometimes gray-blue mica schist, available in the Swat and Peshawar regions. This stone gave the sculptures a distinctive smoothness and durability, ideal for fine detailing.\u003c/li\u003e\r\n\t\u003cli\u003eCommon themes included the life of the Buddha, Bodhisattvas, and other Buddhist motifs, depicted with exceptional realism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThus, the correct answer is D.\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43881", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNaqqual : Bihar\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/styl  folk theater, men are cast in the major roles, but in tamasha, the leading female role is played by a woman.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAnkia Nat :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a one-act play that originated in Assam, India. It is performed in the style of an opera and depicts events from the life of Krishna. The plays are written in a language called Brajavali, which is an artificial Assamese Maithili mixed language.\u003c/li\u003e\r\n\t\u003cli\u003eAnkia Nat is said to have been invented by the medieval saint and social reformer Srimanta Sankardeva and his disciple Mahadeva in the 16th century.\u003c/li\u003e\r\n\t\u003cli\u003eThe plays are a combination of pre-modern Assamese puppet dances, Ozha-Pali, and other Indian theatrical institutions. They also incorporate Sanskrit play techniques and practices.\u003c/li\u003e\r\n\t\u003cli\u003eAnkia Nat plays typically combine live instruments, singers, dance, and elaborate costumes. In Assam, Ankia Nat is also known as Bhaona.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBaha :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Bah\u0026aacute;\u0026rsquo;\u0026iacute; teachings offer a perspective on art and its practice. The teachings say that art is a reflection of God\u0026rsquo;s names, the Fashioner, and the creative process. Bah\u0026aacute;\u0026rsquo;\u0026iacute;s believe that creating art is an act of worship. T hey also say that true art is a reflection of divine inspiration.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bah\u0026aacute;\u0026rsquo;\u0026iacute; community values artistic expression. They encourage artists to help ennoble the human soul and to give creative expression to their beliefs. Bah\u0026aacute;\u0026rsquo;\u0026iacute;s also believe that gifted people in music, drama, and visual arts can exercise their talents in ways that serve the community.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43882", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGuru Amar Das : Miri and Piri\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGuru Arjan Dev : Adi Granth\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap rrectly matched?\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe correct pair is Guru Arjan Dev and Adi Granth.\u003c/li\u003e\r\n\t\u003cli\u003eGuru Arjan Dev, the fifth Guru of Sikhism, compiled the Adi Granth, also known as the Guru Granth Sahib. Guru Arjan Devlived from 1563\u0026ndash;1606 and was executed by the Emperor.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMiri and Piri :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are two swords worn by the sixth Sikh Guru, Hargobind Singh Ji.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe swords represent temporal and spiritual power, respectively:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Miri:\u003c/strong\u003e Comes from the Perso-Arabic word \u0026ldquo;Amir\u0026rdquo; or \u0026ldquo;Emir\u0026rdquo; and means po litical power.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Piri: \u003c/strong\u003eComes from the Perso-Arabic word \u0026ldquo;Pir\u0026rdquo; and means spiritual power.\u003c/li\u003e\r\n\t\u003cli\u003eThe concept of \u0026ldquo;The Mir and the Pir\u0026rdquo; (temporal power and spiritual authority) was introduced by Hargobind, who is also known as Miri Piri de Malik, meaning \u0026ldquo;the King of the temporal and spiritual powers\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe concept of Miri-Piri is a political spiritual doctrine in Sikhism that is rooted in both the worldly and the timeless, and in sovereignty beyond the nation-states.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDal Khalsa :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was the name of the combined military forces of 11 Sikh misls that operated in the 18th century (1735\u0026ndash;1799) in the Punjab region. The military force was established by Nawab Kapur Singh in the mid 1730s.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eManji :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA Sikh religious administrative unit, similar to a parish or diocese, founded by the third Guru of Sikhism, Guru Amar Das. The Manji system is a system where Guru Amar Das divided the spiritual realm into 22 parts, called Manji, and appoints a Sikh to preach sermons in each part.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43883", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe three main musical gharanas prevalent in India\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Nagara, the Dravida and the Vesara are..............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Nagara, Dravida, and Vesara are three main styles of Hindu temple architecture in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Nagara style :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu style of temple architecture that originated in northern India. It\u0026rsquo;s popular in Northern, Western, and Eastern India, especially in the regions around Malwa, Rajputana, and Kalinga.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some features of the Nagara style:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Raised plinth :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe temple is built on a raised stone platform with steps leading up to it.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Garbha griha\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe garbha griha, or sanctum sanctorum, is the most sacred part of the temple. It\u0026rsquo;s a perfect square and houses the image or idol of the main deity.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Shikhara :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe most distinguishable aspect of Nagara style temples is the towering shikhara, or \u0026ldquo;mountain peak\u0026rdquo;, that towers over the garbha griha. The earliest temples have just one shikhara, but later temples have several. The garbhagriha is always located directly under the tallest tower.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Kalasha :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe shikhara is topped by a bulbous finial called a kalasha.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Plan :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe plan of a Nagara style of temple is four sided, but the whole temple plan could be oblong.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Subdivisions :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThere are many subdivisions of nagara temples depending on the shape of the shikhara.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some examples of Nagara style temples:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1.\u0026nbsp;Kandariya Mahadeva Temple:\u003c/strong\u003e Located in Khajuraho, Madhya Pradesh\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Jagdish Temple:\u003c/strong\u003e Located in Udaipur, Rajasthan\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Khajuraho temple complex: \u003c/strong\u003eA UNESCO World Heritage Site\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Konark Sun Temple: \u003c/strong\u003eA UNESCO World Heritage Site\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Mahabodhi Temple:\u003c/strong\u003e A UNESCO World Heritage Site\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Sun Temple in Modhera, Gujarat: \u003c/strong\u003eAn example of Nagara-style temple architecture\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Ossian Temple in Gujarat:\u003c/strong\u003e An exam ple of Nagara-style temple architecture\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDravidian architecture :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a style of temple architecture that originated in South India during the Gupta period. It\u0026rsquo;s one of the three main styles of Indian temple architecture, along with the Nagara and Vesara styles.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some features of Dravidian architecture:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1.\u0026nbsp;Compound wall: \u003c/strong\u003eThe temple is sur rounded by a compound wall.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Gopuram:\u003c/strong\u003e The entrance gateway is located in the center of the front wall.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Vimana:\u003c/strong\u003e The main temple tower is a stepped pyramid that rises geomet rically. The vimana is also known as the gopuram or shikhara. It\u0026rsquo;s typically adorned with intricate carvings and sculptures, and often has multiple tiers.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Pillars and pilasters:\u003c/strong\u003e The temple has pillars and pilasters.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Curved top: \u003c/strong\u003eThe temple has a curved top.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Boundary walls: \u003c/strong\u003eThe temple has boundary walls.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Water tank: \u003c/strong\u003eThe temple enclosure has a water tank.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e8. Panchayatan style:\u003c/strong\u003e The temple grounds are designed in the pancha yatan style, with a main temple and four smaller shrines.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSome examples of Dravidian temples include the Brihadeeshwara temple at Thanjavur and the Gangaikondacholapuram temple.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Vesara style of temple architecture :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a combination of the Dravidian and Nagara styles of temple architecture. It\u0026rsquo;s a hybrid form of Indian temple architecture, with the plan and shape of South Indian temples and the details of North Indian temples.\u003c/li\u003e\r\n\t\u003cli\u003eThe Vesara style is said to have originated in the mid-seventh century A.D. with the later Chalukya rulers. The word \u0026ldquo;Vesara\u0026rdquo; is derived from the Sanskrit word vishra, which means \u0026ldquo;an area to walk for a long time\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome features of the Vesara style include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Dravidian vimana\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Nagara-type faceted walls\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Selective merging of the\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Nagara and Dravida orders\u003c/p\u003e\r\n\r\n\u003cp\u003e5. A star-shaped plan\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Projecting angles in circles with centers in the middle of the shrine and mandap\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Pillars, doorways, ceilings are decorated with intricate carvings\u003c/p\u003e\r\n\r\n\u003cp\u003e8. A usually pyramidal tower, similar to the Dravida style, but may lack the stepped appearance seen in pure Dravida architecture\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSome famous temples of Vesara style are the Kailashnath temple, Ellora, Chennakesava temple, Virupaksha temple, and Ladkhan temple.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43884", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eJnana\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003c , and that one\u0026rsquo;s present life is a result of one\u0026rsquo;s past actions. Therefore, one must perform actions in accordance with dharma to ensure a good future and ultimately attain liberation.\u003c/li\u003e\r\n\t\u003cli\u003eThe goal of Mimamsa is to provide enlightenment on dharma. Dharma is understood as the set of ritual obligations and prerogatives that, if properly performed, maintains the harmony of the world and furthers the personal goals of the performer.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43885", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePahari\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u e type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Mughal School of Painting formed the spinal column of the various schools of Indian miniature art. Which one of the following painting styles was not affected by Mughal painting?\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Kalighata painting style was not affected by Mughal painting.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mughal School of Miniature Painting was a significant development in the 16th century in the northern Indian subcontinent. The school was a combination of Persian and Indian miniature painting styles. It is considered a landmark in the history of Indian painting.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Mughal School of Painting influenced many Indian miniature art schools, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Pala School of Miniature Painting\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Jaina School of Miniature Painting\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Rajasthan School of Miniature Painting\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Orissa School of Miniature Painting\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Pahari School of Miniature Painting\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Deccan School of Miniature Painting\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKalighat paintings :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are a traditional Indian art form that originated in Kolkata in the 19th century. They are known for their bright colors, bold outlines, and stylized elongated eyes.\u003c/li\u003e\r\n\t\u003cli\u003eKalighat paintings are a religious art form that depicts mythological stories, figures of Hindu gods and goddesses, and scenes from everyday life and society. The paintings are made on mill-paper treated with a paste of lime, on which watercolors are dabbed using a large brush or a rag.\u003c/li\u003e\r\n\t\u003cli\u003eKalighat paintings are also known as Kalighat Patachitra and are developed by Jamini Roy. The paintings were originally made to be sold as souvenirs to people who came to the Kalighat Temple.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome famous Kalighat painting artists include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eBhawanipur Sitaldas: Known for his portraits of women and scenes from everyday life\u003c/li\u003e\r\n\t\u003cli\u003eGobardhan Bhattacharya: Known for his depictions of the gods and goddesses of the Hindu pantheon, as well as scenes from mythology\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePahari painting :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a style of miniature painting and book illustration that originated in the Himalayan foothills of India between the 17th and 19th centuries. The word \u0026ldquo;pahari\u0026rdquo; comes from the Hindi word pahar, which means \u0026ldquo;mountain\u0026rdquo;. Pahari paintings are similar in style and color to Rajput paintings.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePahari paintings are characterized by:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Delicate lines\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Vibrant colors like yellow, red, and blue\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Individualistic characteristics in painting\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Depiction of nature, architecture, figural types, facial features, and costumes\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Preference for particular colors\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePahari paintings are closely related to R\u0101jasthan\u012b painting and share with the R\u0101jput art of the North Indian plains a preference for depicting legends.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePahari paintings include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Radha and Lord Krishna\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Jayadev\u0026rsquo;s \u0026lsquo;Gita-Govinda\u0026rsquo;\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Bhagavata Purana\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Two Madhumalati manuscripts\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Shangri Ramayana\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Jasrota paintings\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRajasthani painting :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a style of miniature painting that developed in the 16th\u0026ndash;19th century in the independent Hindu states of Rajasthan in western India. It evolved from Western Indian manuscript illustrations, but Mughal influence became evident in the later years of its development.\u003c/li\u003e\r\n\t\u003cli\u003eRajasthani paintings are most representative of the Hindu Rajputana and are also called Hindu style. They successfully depict the religious beliefs of the people of that time as well as it portrays the insights of the social life of the people at the time of medieval period.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThere are three kinds of Rajasthani paintings:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Phad: \u003c/strong\u003eA scroll painting done on long cloth panels depicting folk and his toric stories in a narrative style. Phad paintings are created on hand-woven coarse cotton cloth, which is soaked overnight to thicken the threads.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Pichwai: \u003c/strong\u003eDone on cloth.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Miniature:\u003c/strong\u003e Done on specially treated paper in vegetable dyes.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRajasthani paintings are usually made in tempera medium, or water color. The painting style uses semi precious stones like agate, blood stone, amethyst, citrine, carnelian, jade, tiger, malachite, and others.These semi precious stones are carefully selected, and grounded to a paste to act as paint.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKangra paintings :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are a type of Pahari painting that are named after the former princely state of Kangra in Himachal Pradesh.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKangra paintings are characterized by:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Soft colors, including cool blues and greens\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Lyrical treatment of themes\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Identical style to the portraits of Raja Sansar Chand of Kangra\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43886", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAryabhata\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eVarahmira\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBhaskara 1\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAn unknown Indian\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eZero was invented by.............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe concept of zero as a digit is believed to have originated in India in the 5th century. The mathematician and astronomer Aryabhata is often associated with inventing the number zero.\u003c/li\u003e\r\n\t\u003cli\u003eIn the 7th century, Brahmagupta developed the earliest known methods for using zero in calculations. He named zero \u0026ldquo;shunya\u0026rdquo; or \u0026ldquo;sunya\u0026rdquo;, which is the Sanskrit word for emptiness or nothingness.\u003c/li\u003e\r\n\t\u003cli\u003eBrahmagupta also demonstrated that zero can be reached through calculation. He wrote these rules in his book Brahmasphutasiddhanta. Brahmagupta and others used small dots under numbers to show a zero placeholder. They also viewed the zero as having a null value, called \u0026ldquo;sunya\u0026rdquo;. Brahmagupta was also the first to show that subtracting a number from itself results in zero.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eVarahamihira (505\u0026ndash;587) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Indian astronomer, mathematician, and astrologer. He was also known as Varaha or Mihira.\u003c/li\u003e\r\n\t\u003cli\u003eVarahamihira is known for writing the Pancha-Siddhantikaa (\u0026ldquo;Five Treatises\u0026rdquo;), a compilation of Greek, Egyptian, Roman, and Indian astronomy. He also discovered a version of Pascal\u0026rsquo;s triangle and worked on magic squares.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eVarahamihira\u0026rsquo;s mathematical accomplishments include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Discovering trigonometric formulas\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Improving the precision of Aryabhata\u0026rsquo;s sine tables\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Defining the algebraic properties of zero and negative numbers\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eVarahamihira was also a physician. Some mathematicians believed he had a strong knowledge of predictive calculations and zodiac signs. He is also known for predicting that there was water on Mars.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBhaskara I (600 - 680) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Indian astronomer and mathematician who lived around 629. He is considered the most important scholar of Aryabhata\u0026rsquo;s astronomical school.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBhaskara I is known for:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Helping to spread the mathematical work of Aryabhata\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Being the first mathematician to use the Hindu decimal method to write numbers\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Working on the Sine Function, giving a more accurate value for Sine\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Authoring two treatises and commentaries to the work of Aryabhata I\u003c/p\u003e\r\n\r\n\u003cp\u003e5. His works include the Mahabhaskariya, the Laghubhaskariya, and the Aryabhatiyabhasya\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBhaskara I is considered one of the most renowned Indian mathematicians, along with Brahmagupta. Both made significant contributions to the study of fractions.\u003c/li\u003e\r\n\t\u003cli\u003eBhaskara I is also the name of India\u0026rsquo;s first experimental remote sensing satellite, built by ISRO. It was named after the 7th century Indian mathematician Bhaskara-I, not to be confused with the 12th-century mathematician Bhaskara-II.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test portant} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGol Gumbaz, Bijapur\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following monuments has a dome which is said to be one of the largest in the world?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Gol Gumbaz in Bijapur, India is said to have one of the largest domes in the world. It is the largest dome in India and the fourth largest in the world. The dome is so large that it doesn\u0026rsquo;t need pillars for support.\u003c/li\u003e\r\n\t\u003cli\u003eThe Gol Gumbaz is a 17th-century mausoleum that houses the remains of Mohammad Adil Shah, the seventh sultan of the Adil Shahi dynasty. The architect Yaqut of Dabul completed the tomb in 1656.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Gol Gumbaz has several notable features, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eEchoes :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe dome\u0026rsquo;s acoustics are such that every sound echoes seven times in the central chamber.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWhispering Gallery :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Whispering Gallery is a space where even the faintest sounds can be heard clearly from 37 meters away.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eShape :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe dome is perfectly hemispherical, which allows sound waves to pass through it unhindered.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe tomb of Sher Shah Suri :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is located in Sasaram, Bihar, India. It was commissioned by the emperor himself and completed in 1545, about three months after his death. The tomb is a mausoleum that is considered a majestic example of ancient architecture. It features elements of Indo-Islamic architecture, including high domes, pillars, and large open courtyards, as well as hints of Afghan architecture.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJama Masjid :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Masjid-i-Jahanuma, is a mosque in Old Delhi, India. It was built between 1644 and 1656 by Mughal emperor Shah Jahan, who also built the Taj Mahal and the Red Fort.\u003c/li\u003e\r\n\t\u003cli\u003eJama Masjid is the largest mosque in India and can accommodate 25,000 people in its courtyard. It is an example of Mughal architecture and is made of red sandstone and marble. The mosque was the imperial mosque of the Mughal emperors until the end of the empire in 1857.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Tomb of Ghiyas-ud-din Tughlaq :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a fortress-like complex that dates back to the 1300s. It\u0026rsquo;s located in southern Delhi, near Tughlaqabad Fort. The tomb is set in a pentagonal enclosure surrounded by high walls.\u003c/li\u003e\r\n\t\u003cli\u003eThe tomb was originally surrounded by a pond and connected to the fort by a causeway. The causeway is 229 meters long and is supported by 26 arched piers. The tomb is now separated from the fort by a dry artificial lake.\u003c/li\u003e\r\n\t\u003cli\u003eThe tomb is entered through a high red sandstone gateway with steps. The mausoleum is a single-domed square tomb that\u0026rsquo;s about 8 meters by 8 meters. The walls are sloping and have parapets. The western side has three elaborately carved minarets. The 30-foot square hall\u0026rsquo;s walls are decorated with white marble and sandstone.\u003c/li\u003e\r\n\t\u003cli\u003eThe tomb has underground cells that are accessed from a peripheral corridor. The cells are now guarded by wire mesh doors for security.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43889", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBharatanatyam\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/sty
