    <div>

<main style="max-width: 950px; margin: 35px auto; padding: 0 25px; font-family: 'Georgia', serif; padding-bottom: 150px;">

            <div id="analysis-text-content" style="font-size: 1.35rem; line-height: 1.9; color: #1b1b1b; font-weight: 500;"></div>

    <div style="display: flex; justify-content: space-between; margin-top: 50px;">
        <button onclick="navigate(-1)" style="background: transparent; color: #1b1b1b; border: 3px solid #1b1b1b; padding: 18px 45px; cursor: pointer; font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; transition: 0.3s;">PREVIOUS</button>
<button onclick="navigate(1)" style="background: #1b1b1b; color: #fdf6e3; border: none; padding: 18px 45px; cursor: pointer; font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">NEXT QUESTION</button>

function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

ma. It\u0026rsquo;s a highly stylized form of performance art that combines dance, music, and acting to tell stories from Indian mythology.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some other Indian dance dramas:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBharatanatyam is a classical dance form from Tamil Nadu, India. It is recognized by the Sangeet Natak Akademi and is a way to express South Indian religious themes and spiritual ideas.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBharatanatyam has seven styles, or Margam, in its order of performance:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Pushpanjali,\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Alarippu,\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Jatiswaram,\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Shabdam,\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Varnam,\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Padam,\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Tillana.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere\u0026rsquo;s some information about some of these styles: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eVarnam :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA complex part of the Bharatanatyam repertoire, often performed as the centerpiece of a performance. It consists of jathis, pallavi, anupallavi, muktayi swaram, charanam, and chittaswaras.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThere are two types of varnam:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003etaana varnam and\u003c/li\u003e\r\n\t\u003cli\u003epada varnam.\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAlarippu :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe first dance piece that Bharatanatyam dancers learn and perform. The word \u0026ldquo;Alarippu\u0026rdquo; is Tamil for \u0026ldquo;to bloom\u0026rdquo;. The Alarippu is the beginning of a performance, consisting of a set of movements set to a beat. It is often used as a warm-up for the dancer.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTillana :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA musical composition that is often used in Bharatanatyam. It is usually performed towards the end of a recital.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePadam :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eUsually slow moving songs with a depth of musical intricacies. Padams may have a protagonist such as a Nayaka, a Nayika, or a Sakhi.\u003c/li\u003e\r\n\t\u003cli\u003eBharatanatyam originated in the Natyashastra, an ancient treatise on theater written by the mythic priest Bharata. It was originally a temple dance for women, and is often used to express Hindu religious stories and devotions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOdissi :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA dance-drama that finds its inception in the Natya Shastra by Bharatmuni. It expresses themes, stories, and spiritual ideas related particularly to Vaishnavism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eManipuri :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA dance-drama with central themes based on the love stories of Lord Krishna and Radha.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43811", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !importan  "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSultanates of Delhi have taken which of the following in their buildings from the ancient architecture?\u0026nbsp; \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1980)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Sultanates of Delhi incorporated arched openings and domes, or gumbaz, from ancient architecture into their buildings. The Delhi Sultanate\u0026rsquo;s architecture also incorporated Indian and Turkish styles, with Islamic elements like arches, domes, and minarets, and Indian elements like chhatris and jharokhas.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sultanates of Delhi avoided decorative figures in their architecture due to Islamic prohibitions against anthropomorphic representations.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sultanates of Delhi\u0026rsquo;s architecture is characterized by the use of red sandstone and marble. Red sandstone was used for the construction of walls, domes, and minarets, while marble was used for intricate carvings and calligraphy.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMehrab :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a semicircular niche in a mosque\u0026rsquo;s wall that indicates the direction of the Kaaba in Mecca. Muslims face the qibla, or the direction of the Kaaba, when praying. The wall that contains a mehrab is called the qibla wall.\u003c/li\u003e\r\n\t\u003cli\u003eA mehrab is often the most decorated part of a mosque, and is often embellished with inscriptions from the Qur\u0026rsquo;an. It is an architectural and symbolic focal point of religious buildings.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Gol Gumbaz :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a 17th-century mausoleum in Bijapur, Karnataka, India. It\u0026rsquo;s the tomb of Mohammed Adil Shah, the seventh sultan of the Adil Shahi dynasty, who ruled from 1627\u0026ndash;1657. The Gol Gumbaz is India\u0026rsquo;s largest dome structure.\u003c/li\u003e\r\n\t\u003cli\u003eThe Gol Gumbaz is made of decorated plasterwork and dark grey basalt. It has a square building with a circular drum over the top that rests a majestic dome. The dome is perfectly hemispherical in shape, allowing an unhindered, clean line of passage to the sound waves.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Gol Gumbaz has two notable attractions:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Central chamber:\u003c/strong\u003e Every sound is echoed seven times in this chamber.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Whispering Gallery:\u003c/strong\u003e Even small sounds can be heard clearly in this gallery.\u003c/p\u003e", "soluti e\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePandyas\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMahabalipuram temples were built by............\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1981)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Pallava kings carved the Group of Monuments at Mahabalipuram into rock along the Coromandel coast in the 7th and 8th centuries. The site is a UNESCO World Heritage site.\u003c/li\u003e\r\n\t\u003cli\u003eThe temples at Mahabalipuram portray events from the Mahabharata.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThey include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Ratha cave temples :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBuilt by Pallava king Narasimhavarman I in the 7th and 8th centuries, these monolithic temples are called Ratha (chariot) because they resemble processional chariots.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Seven pagodas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBuilt by Pallava kings Narasimhavarman - I, Paramesvarman, and Narasimhavarman II in the 7th and 8th centuries.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Panch Rathas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBuilt by Narasimhavarman I between the 7th and 8th centuries, these temples are built in the shape of pagodas and look very similar to Buddhist shrines.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Shore temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBuilt with blocks of granite in the 8th century AD, this temple is a place of worship, Hindu temple, and tourist attraction. The Group of Monuments at Mahabalipuram has 40 ancient monuments, including one of the largest open air rock reliefs in the world.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Cheras, Cholas, and Pandyas :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey were known as the \u0026ldquo;muvendar\u0026rdquo;, which is a Tamil word meaning \u0026ldquo;three chiefs\u0026rdquo;. The three dynasties ruled over the Tamil people during ancient and medieval India.\u003c/li\u003e\r\n\t\u003cli\u003eThe three dynasties were based in the interior of Tamil Nadu, with their capitals in Karur, Madurai, and Uraiyur respectively. The Pandyas were the first Tamil ruling chieftains to be mentioned, appearing in Greek writings in the fourth century BCE. The Cholas became prominent in the 10th through 13th centuries, ruling the eastern coast of southern India and Sri Lanka.\u003c/li\u003e\r\n\t\u003cli\u003eThe Cheras, Cholas, and Pandyas were friendly with each other and are considered to be the traditional Tamil siblings.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43815", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRabindra Nath Tagore\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u00 solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Saka era is believed to have been founded by King Kanishka of the Kushan dynasty in 78 AD.\u003c/li\u003e\r\n\t\u003cli\u003eThe Saka calendar has 12 months, each with 30\u0026ndash;31 days, and 365 days in total. The calendar is based on a luni solar reckoning of time and follows the tropical Zodiac signs. The first month of the Saka Samvat is Chaitra, which begins on March 22.During a leap year, Chaitra begins on March 21.\u003c/li\u003e\r\n\t\u003cli\u003eThe Saka calendar is similar to the Gregorian calendar, which also has 12 months and 365 days.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian National Calendar, based on the Saka era, was adopted by the Parliament of India in 1957. The calendar starts from the month of Chaitra, which falls on March 22 each year, except for leap years, when it falls on March 21. The calendar has a duration of 365 days.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe months of the Saka calendar are:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. \u003cstrong\u003eChaitra: \u003c/strong\u003eMarch 21\u0026ndash;April 20\u003c/p\u003e\r\n\r\n\u003cp\u003e2. \u003cstrong\u003eVaishakha:\u003c/strong\u003e April 21\u0026ndash;May 21\u003c/p\u003e\r\n\r\n\u003cp\u003e3. \u003cstrong\u003eJyeshtha: \u003c/strong\u003eMay 22\u0026ndash;June 21\u003c/p\u003e\r\n\r\n\u003cp\u003e4. \u003cstrong\u003eAshadha: \u003c/strong\u003eJune 22\u0026ndash; l ideas. It\u0026rsquo;s based on the principles of the Natya Shastra, an ancient Sanskrit text. Odissi performances have been used to express ideas of Vaishnavism, as well as other traditions related to Hindu deities and goddesses.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to legend, the poetic verses of Jaidev\u0026rsquo;s Gita Govindam were sung in front of Lord Jagannatha at the Jagannatha Temple in Puri to please him. These verses became the musical base for Odissi dance.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBharatanatyam :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a classical dance form that originated in the Tanjore district of Tamil Nadu, India.\u003c/li\u003e\r\n\t\u003cli\u003eBharatanatyam is one of the oldest and most popular classical dances in India. It is often used to tell Hindu religious stories and devotions. The dance form is based on the Natyashastra, an ancient treatise on theater written by the mythic priest Bharata.\u003c/li\u003e\r\n\t\u003cli\u003eBharatanatyam expresses South Indian religious themes and spiritual ideas, particularly of Shaivism and in general of Hinduism. The dance\u0026rsquo;s music is based on Carnatic classical music, and the chief musical instruments are the \u0026lsquo;Mridangam\u0026rsquo; and a pair of cymbals. The verses recitedduring performance are in Sanskrit, Tamil, Kannada, and Telugu.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKuchipudi :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a classical Indian dance that originated in the village of Kuchipudi in the state of Andhra Pradesh. The dance is named after the village, and is one of eight major Indian classical dances.\u003c/li\u003e\r\n\t\u003cli\u003eThe dance originated in the 17th century with the creation of the dance-drama Bhama Kalapam by Sidhyendra Yogi. Bhama Kalapam is a story about Satyabh\u0101ma, the jealous wife of the god Krishna.\u003c/li\u003e\r\n\t\u003cli\u003eKuchipudi is different from the other five classical dance styles in India because it includes singing. The dance has its roots in the ancient Hindu Sanskrit text of Natya Shastra.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43819", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone is correct\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e e following is correct?\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1983)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Shore temple of : Pallavas Mahabalipuram\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Kailasa temple of Ellora : Rashtrakutas\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Khajuraho temples : Chandellas\u003c/p\u003e\r\n\r\n\u003cp\u003eCodes :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Shore Temple of Mamallapuram :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a free-standing temple complex built in the 8th century AD by the Pallava dynasty. The temple is located on the Bay of Bengal in Mahabalipuram, India, about 60 kilometers (37 miles) south of Chennai. The Shore Temple is a rock-cut and free-standing temple complex that is an important symbol of Pallava political and economic strength. It is the oldest structural temple of significance in South India and is part of the renowned UNESCO World Heritage site - Group of Monuments at Mahabalipuram.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is built with blocks of granite and features architectural and sculptural excellence of the Pallava dynasty.\u003c/li\u003e\r\n\t\u003cli\u003eIt demonstrates the progression from rock-cut structures to free-standing structural temples and displays all the elements of mature Dravidian architecture.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is threatened by the sea, salt-laden winds, and water spray.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kailasa Temple:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu temple in Ellora, Maharashtra, India. It\u0026#39;s located in the Sahyadri Hills, about 15 miles northwest of Aurangabad.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple was built between 756 and 773 AD by the Rashtrakuta king Krishna I (757-72 AD). It was originally named Krishneshvara after the king, but is now known as Kailasa. The temple is carved into the vertical basalt cliffs of the Sahyadri Hills and is the sixteenth cave in the 32 cave temples and monasteries that make up the Ellora Caves.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is designed to look like Mount Kailash, the home of Shiva. It\u0026#39;s 32 meters high and 78 meters long, and is considered the largest monolithic rock-cut monument in the world.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Khajuraho Group of Monuments :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a UNESCO World Heritage Site in the Chhatarpur district of Madhya Pradesh, India. The temples are famous for their nagara-style architectural symbolism and erotic sculptures.\u003c/li\u003e\r\n\t\u003cli\u003eThe temples were built during the Chandella dynasty, which reached its peak between 950 and 1050. The group includes about 20 temples in three distinct groups. The largest and grandest temple is the Kandariya Mahadeva, which is attributed to king Ganda (AD 1017-29). Other examples include Vamana, Adinatha, Javari, Chaturbhuj, and Duladeo.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43820", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 3 2 4\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 3 1 4\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Indian musician and composer who played the sitar, an Indian stringed instrument. He was a master of the sitar, and is considered the world\u0026rsquo;s best-known expert of North Indian classical music.\u003c/li\u003e\r\n\t\u003cli\u003eShankar is also the founder of the National Orchestra of India, and was influential in stimulating Western appreciation of Indian music. In 1999, he was awarded India\u0026rsquo;s highest civilian honor, the Bharat Ratna.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRaja Ravi Varma (1848\u0026ndash;1906) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is a painter and printmaker who plays the veena. His work often features music, including in the painting Saraswati, which depicts the Hindu goddess of knowledge, music, art, wisdom, and nature playing the veena.\u003c/li\u003e\r\n\t\u003cli\u003eVarma\u0026rsquo;s prints often depict Hindu gods and goddesses in scenes adapted from the Mahabharata, the Ramayana, and the Puranas. His paintings and prints are known for using European techniques to exquisitely render Indian subjects.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eUstad Alla Rakha Qureshi (1919 - 2000) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is also known as Alla Rakha, was an Indian tabla player. He was a specialist in Hindustani classical music and was a regular accompanist of sitar player Pandit Ravi Shankar. Alla Rakha is credited with introducing the tabla to the Western audience.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAli Akbar Khan (1922\u0026ndash;2009) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Indian Hindustani classical musician who was known for his virtuosity playing the sarod. The sarod is a 25-stringed, fretless instrument.\u003c/li\u003e\r\n\t\u003cli\u003eAli eak-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEllora\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following places is not associated with the growth of art?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1984)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAmarnath is not associated with the growth of art. Amarnath is a Hindu shrine and cave temple in Jammu and Kashmir, India. The cave is located at an altitude of 5,486 meters above sea level, about 48 kilometers from Pahalgam.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;The cave is only accessible during the July-August months, and there are two routes to reach it:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Baltal or\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Pahalgam.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Baltal route is shorter but steeper, while the Pahalgam route is longer but preferred by most devotees.\u003c/li\u003e\r\n\t\u003cli\u003eThe Amarnath cave is home to Lord Shiva, and is considered one of the major Hindu Dhams. The cave contains a naturally formed ice-lingam that is said to wax and wane with the moon. Devotees undertake the Amarnath Yatra, a 45-day journey, to see the ice-lingam.\u003c/li\u003e\r\n\t\u003cli\u003eThe Yatra is considered difficult\u0026nbsp;especially for children and the elderly, due to cold weather conditions. The trek involves reaching a higher elevation than Kedarnath, and requires proper acclimatization to avoid altitude sickness.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Shore Temple in Mahabalipuram, India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a free-standing temple complex built from granite blocks in the 8th century AD. It\u0026rsquo;s located on the Coromandel Coast ofthe Bay of Bengal, about 37 miles south of Chennai, Tamil Nadu.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple complex is a symbol of Pallava political and economic strength. It\u0026rsquo;s one of the oldest examples of Dravida architecture, and is an architectural example of Rajasimha\u0026rsquo;s time. The temple is also one of the oldest examples of rock-cut temples and shrines in the world.\u003c/li\u003e\r\n\t\u003cli\u003eThe Shore Temple is threatened by the sea, salt-laden winds, and water spray.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Ajanta Caves :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are a series of 29 rock-cut Buddhist caves in the Sahyadri ranges of Maharashtra, India. The caves were excavated from around 200 BC to 650 AD and are considered to be among the earliest Buddhist architectures.\u003c/li\u003e\r\n\t\u003cli\u003eThe caves are located on the Waghora river, near Aurangabad, in a horseshoe-shaped bend of rock surface that overlooks the river. The valley\u0026rsquo;s location provided a calm environment for Buddhist monks during the rainy seasons.\u003c/li\u003e\r\n\t\u003cli\u003eThe caves are known for their carvings and sculptures that depict the life of Buddha, as well as their frescoes. The caves are considered to be the beginning of classical Indian art, and are an example of ancient Buddhist rock-cut architecture.\u003c/li\u003e\r\n\t\u003cli\u003eThe caves are divided into two phases and are numbered thirty in total. Four of the caves were used as prayer halls, and 25 were used as residential caves.\u003c/li\u003e\r\n\t\u003cli\u003eThe Ajanta Caves were discovered in 1819 by British Army officers hunting tigers in the gorge of the Waghora River.\u003c/li\u003e\r\n\t\u003cli\u003eTours often include both cave systems and operate from the city of Aurangabad, which is about 100 kilometers (62 mi) to the south.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Ellora Caves :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are a multi-religious, rock-cut cave complex in the Aurangabad District of Maharashtra, India. The caves are located in the wall of a basalt cliff, not far from Aurangabad.\u003c/li\u003e\r\n\t\u003cli\u003eThe caves date back to the Rashtrakutadynasty, around 1,500 years ago. They are a UNESCO World Heritage Site, maintained by the Archaeological Survey of India (ASI).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe caves are famous for: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Rock-cut architecture :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Ellora Caves are considered some of the finest examples of rock-cut ar chitecture in the world.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Inscriptions :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;The caves contain inscriptions dating from the 6th century CE onwards.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Tolerance :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;The caves illustrate the spirit of toler ance, characteristic of ancient India, which permitted three religions to es tablish their sanctuaries in one place.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Kailasa :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;The Ellora Caves are famous for the largest single monolithic excavation in the world, the great Kailasa (Cave 16).\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The caves contain 34 monasteries and temples, extending over more than 2 km. Of the 34 caves, 12 are Buddhist, 17 Hindu and 5 Jain.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43822", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "op  classics by directors like Satyajit Ray. He has won National Film Award for Best Choreography, Filmfare Award for Best Choreography and Sangeet Natak Akademi Award for Dance - Kathak.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSanjukta Panigrahi (24 August 1944 \u0026ndash; 24 June 1997):\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eShe was a dancer from India, who was the foremost exponent of Indian classical dance Odissi. Sanjukta was the first Odia woman to embrace this ancient classical dance at an early age and ensure its grand revival.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eT. Balasaraswati (1918-1984) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eShe was an Indian dancer and singer who specialized in the Karnatak (South Indian) tradition of Bharatnatyam. She was one of the most prominent exponents of the bharata natyam style of classical dance in the 20th century.\u003c/li\u003e\r\n\t\u003cli\u003eBalasaraswati was born in Madras (now Chennai) on May 13, 1918 into a family that was steeped in classical music and dance. She began training in dance at age four with Kandappa Pillai, and lessons in Carnatic music were mandatory. Balasaraswati\u0026rsquo;s work created a revolution in traditional music and dance for bharatnatyam, a combination of music and dance.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSonal Mansingh :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eShe is a prominent Indian classical dancer who specializes in Bharatanatyam and Odissi.\u003c/li\u003e\r\n\t\u003cli\u003eFor her contributions towards promoting \u0026lsquo;Classical dances\u0026rsquo;, she has received accolades from many national and international organizations.\u003c/li\u003e\r\n\t\u003cli\u003eShe was the youngest recipient of Padma Bhushan in 1992.\u003c/li\u003e\r\n\t\u003cli\u003eIn 2003, Sonal became word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWrite the following in chronological order : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1984)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Puri - Jagannath temple\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Meenakshi temple\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Mahabalipuram temples\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Qutab Minar\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer from the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Shore Temple in Mahabalipuram, India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a structural temple complex carved from rock and located on the Bay of Bengal. The temple is an example of Dravida architecture, which is one of the oldest examples of Dravida architecture.\u003c/li\u003e\r\n\t\u003cli\u003eThe Shore Temple is built with granite blocks and dates back to the 8th century AD. It\u0026rsquo;s an important symbol of the Pallava political and economic strength at the time of its creation. The temple is also one of the oldest structural temples of significance in South India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Shore Temple is threatened by the sea, salt-laden winds, and water spray.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJagannath Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an important Hindu temple in Puri, Odisha, that is dedicated to Jagannath, a form of Vishnu. The temple is part of the Char Dham pilgrimages, which also include Badrinath, Dwaraka, and Rameswaram.\u003c/li\u003e\r\n\t\u003cli\u003eThe state government of Odisha has decided to use facial recognition technology based on artificial intelligence (AI) atthe Jagannath Temple in Puri to prevent stampedes and track criminals.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Qutb Minar :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a UNESCO World Heritage Site, was built in the early 13th century by Qutb-ud din Aibak and Iltutmish. The first Sultan and Muslim ruler of Delhi, Qutb-ud-din Aibak, built the tower as a victory tower and possibly a watchtower.\u003c/li\u003e\r\n\t\u003cli\u003eQutb-ud-din Aibak laid the foundation of the Minar in 1199 for the mu\u0026rsquo;azzin (crier) to give calls for prayer. His successor and son-in-law, Shamsu\u0026rsquo;d-Din Iltutmish (AD 1211-36), added three more storeys to the first storey.\u003c/li\u003e\r\n\t\u003cli\u003eThe Qutb Minar is a 72.5 meter high red sandstone tower that tapers from 2.75 meters. It\u0026rsquo;s part of a large complex of structures in Delhi, India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Meenakshi Amman Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Arulmigu Meenakshi Sundareswarar Temple, is a Hindu temple in Madurai, Tamil Nadu, India. It is located on the southern bank of the Vaigai River.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is dedicated to the goddess Meenakshi and her consort, Sundareshwarar. According to legend, the temple was built in the 6th century CE by the Pandya king, Kulasekara Pandya, who prayed to Lord Shiva for a child.\u003c/li\u003e\r\n\t\u003cli\u003eThe Meenakshi Temple complex is one of the largest and oldest temple complexes in India. It is considered to be more than 2,500 years old. The temple is a popular pilgrimage site and attracts tourists from all over the world.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple features the Ayaram Kal Mandapa, which is a 1,000 pillar mandapan with 985 pillars perfectly aligned in straight rows. The temple also has mundu bombs, which are spectacular pillars carved out of a single piece of rock, mostly granite or charnockite.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43824", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !import ed the world\u0026rsquo;s best-known expert of North Indian classical music.\u003c/li\u003e\r\n\t\u003cli\u003eShankar is also the founder of the National Orchestra of India, and was influential in stimulating Western appreciation of Indian music. In 1999, he was awarded India\u0026rsquo;s highest civilian honor, the Bharat Ratna.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eUstad Alla Rakha Qureshi (1919 - 2000) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is also known as Alla Rakha, was an Indian tabla player. He was a specialist in Hindustani classical music and was a regular accompanist of sitar player Pandit Ravi Shankar. Alla Rakha is credited with introducing the tabla to the Western audience.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMadurai Shanmukhavadivu Subbulakshmi (1916-2004) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eShe was a Carnatic singer and actress from Tamil Nadu. She was the first musician to receive the Bharat Ratna, India\u0026rsquo;s highest civilian honor, and the first Indian musician to receive the Ramon Magsaysay award.\u003c/li\u003e\r\n\t\u003cli\u003eSubbulakshmi was a singer who sung in many languages. Her first performance was at the Madras Music Academy and her first recording was released when she was 10 years old. She also acted in movies, including the 1945 film Meera, which she starred in and sang all the songs in. The film was so well-received that it was remade in Hindi in 1947, making Subbulakshmi a national icon.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43826", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003c wood for the body, neck, and peg box. The resonator has a stretched membrane, usually goatskin, and a horn bridge where the strings rest. The strings are plucked with a small plectrum, which can be a feather or a hammer. The fingerboard is covered with a smooth metal plate that makes it easy to slide from note to note.\u003c/li\u003e\r\n\t\u003cli\u003eThe sarod is known for its deep, weighty, introspective sound, in contrast with the sweet, overtone-rich texture of the sitar.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAli Hussain :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe taught how to play the instrument, shehnai, at Sangeet Research Academy, Calcutta beginning in 1974. He was regularly featured on All India Radio and Indian Television. He holds the distinction of composing the signature tune for Indian Television with Pandit Ravi Shankar in 1973.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHariprasad Chaurasia :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is an Indian classical flautist who plays the flute in the Hindustani classical tradition.\u003c/li\u003e\r\n\t\u003cli\u003eChaurasia was born on July 1, 1938 in Allahabad, United Provinces, British India (now in Uttar Pradesh, India). He began learning vocal music at age 15 and then played the flute under the guidance of Bholanath Prasanna of Varanasi for eight years. In 1957, he began working as a composer and performer at All India Radio, Cuttack, Odisha.\u003c/li\u003e\r\n\t\u003cli\u003eChaurasia\u0026rsquo;s performances and compositions have brought global recognition to the bansuri, a simple side blown bamboo flute. He has significantly expanded the expressive possibilities of classical North Indian flute-playing through his masterful blowing technique.\u003c/li\u003e\r\n\t\u003cli\u003eChaurasia received the Sangeet Natak Akademi award in 1984 and India\u0026rsquo;s second highest civilian award, Padma Vibhushan in 2000.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eUstad Alla Rakha Qureshi (1919 - 2000) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is also known as Alla Rakha, was an Indian tabla player. He was a specialist in Hindustani classical music and was a regular accompanist of sitar player Pandit Ravi Shankar. Alla Rakha is credited with introducing the tabla to the Western audience.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43827", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAkbar\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003 \r\n\r\n\u003cp\u003e3. Solanki school.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSome examples of the Odisha school of Nagara style architecture include Lingaraj in Bhubaneswar, Jagannath in Puri, and Surya in Konark.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kandariya Mahadeva Temple in Khajuraho is typical of Central Indian Nagara-style temple architecture.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43829", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eManipuri\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\ option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich among the following is a folk dance of India?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1988)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFolk dance :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a type of dance that reflects the life of a country or region\u0026rsquo;s people. It is a vernacular expression of a culture\u0026rsquo;s past or present. Folk dances are often performed at festivals, cultural gatherings, or agricultural events.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some common characteristics of folk dance:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Performed by nonprofessionals:\u003c/strong\u003e Folk dances are usually performed by people without professional dance training.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003ePerformed to traditional music: \u003c/strong\u003eFolk dances are often performed to traditional folk music.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eDeveloped without a choreographer:\u003c/strong\u003e Folk dance has developed without a choreographer.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Inherit tradition:\u003c/strong\u003e The way they are done is strongly about inherited tradition rather than making changes.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eTransmitted from generation to generation: \u003c/strong\u003eFolk dance is transmitted from generation to generation with increasing secularization.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGarba :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a folk dance of India. It is a popular dance from the state of Gujarat. Garba is performed by women in a circular pattern, mainly during the nine nights of the Navaratri festival. The dance is connected to Shakti-Puja, or the worship of power, and is believed to have originated from the worship of the goddess Jagdamba.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKathakali :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a classical dance form that tells and honors stories through dance. It was traditionally used to perform stories from the Mahabharata and Ramayana, but now performs a variety of stories.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKathakali is an interpretative dance, with characters divided into three types:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. satvika\u003c/p\u003e\r\n\r\n\u003cp\u003e2. rajasika\u0026nbsp;and\u003c/p\u003e\r\n\r\n\u003cp\u003e3. tamasika\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eManipuri dance :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a classical dance form that originated in the northeastern state of Manipur, India. It\u0026rsquo;s one of six classical dance styles in India and is also known as Manipuri Raas Leela.\u003c/li\u003e\r\n\t\u003cli\u003eThe dance is associated with rituals and traditional festivals in Manipur. It\u0026rsquo;s performed on religious occasions and in temples, and often has devotional themes.\u003c/li\u003e\r\n\t\u003cli\u003eManipuri dance is characterized by a variety of forms that are linked to folk tradition and ritual.\u003c/li\u003e\r\n\t\u003cli\u003eThe dance is accompanied with devotional music created with many instruments, with the beat set by cymbals (kartal or manjira) and double-headed drum (pung or Manipuri mrdanga) of sankirtan. The major instruments used in classical Manipuri dance are the flute and the drum.\u003c/li\u003e\r\n\t\u003cli\u003eThe dance gives Manipuri its undulating and soft appearance. The foot movements are viewed as part of a composite movement of the whole body. The dancer puts his or her feet down, even during vigorous steps, with the balls of the feet touching the ground first.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMohiniyattam :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a classical solo dance form that originated in Kerala, India. The name translates to \u0026ldquo;the dance of Mohini,\u0026rdquo; the celestial enchantress from Hindu mythology. Mohiniyattam is a subgenre of dance called lasya that is performed in the Kaisiki vritti, or graceful style. The dance is based on the Natya Shastra by Bharata Muni.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMohiniyattam is characterized by:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Graceful, swaying movements\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Soft footwork\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Important hand gestures\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Subtle facial expressions\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Delicate footsteps\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Erotic depictions of divine love\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDancers wear white or cream sarees with gold or colored brocade in the fringes, and also wear gold jewelry.\u003c/li\u003e\r\n\t\u003cli\u003eMohiniyattam performances excel in the Ekaharya Abhinaya form, which is a solo expressive dance performance aided by singing and music.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43830", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u stion_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAli Akbar Khan (1922\u0026ndash;2009) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Indian Hindustani classical musician and master of the sarod. The sarod is a 25-stringed, fretless instrument.Khan is also known as Khansahib and is considered a \u0026ldquo;musician\u0026rsquo;s musician\u0026rdquo;. He began his musical training at age three, learning vocal music, drums, and eventually the sarod. He was known for his knowledge and artistry.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eYehudi Menuhin (1916-1999) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was a British violinist and conductor. He is considered one of the greatest violinists of the 20th century.\u003c/li\u003e\r\n\t\u003cli\u003eMenuhin was a virtuoso violinist who was known for having a taste for the best violins in the world.\u003c/li\u003e\r\n\t\u003cli\u003eHe was also known for breaking down musical barriers. For example, he would jam with St\u0026eacute;phane Grappelli and conduct the Berlin Philharmonic with his feet.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRavi Shankar (1920-2012) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe was an Indian musician and composer who played the sitar, an Indian stringed instrument. He was a master of the sitar, and is considered the world\u0026rsquo;s best-known expert of North Indian classical music.\u003c/li\u003e\r\n\t\u003cli\u003eShankar is also the founder of the National Orchestra of India, and was influential in stimulating Western appreciation of Indian music. In 1999, he was awarded India\u0026rsquo;s highest civilian honor, the Bharat Ratna.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHariprasad Chaurasia :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is an Indian classical flautist who plays the bansuri, a simple side-blown bamboo flute. He was born in Allahabad, British India (now in Uttar Pradesh, India) on July 1, 1938. Chaurasia is a music director and is associated with the Hindustani classical tradition. His performances and compositions have brought global recognition to the bansuri.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43832", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !importa portant}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following are features of Mughal Style of architecture?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1988)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Curvilinear roof\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Flat roof\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Domes\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Arches\u003c/p\u003e\r\n\r\n\u003cp\u003eChoose the correct answer from the codes given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eWhile the curvilinear roof is primarily a Bengal architectural form (common in Bengali temples), it did influence later Mughal architecture, especially in eastern India and Bengal.\u003c/li\u003e\r\n\t\u003cli\u003eUnder Mughal rule, Bengal Subah developed a regional Mughal style that assimilated local Hindu and Bengali features, including the bangla or do-chala (curved) roof. These curved roofs appeared in Mughal garden pavilions and tomb canopies in places like Fatehpur Sikri and Lahore, symbolizing the fusion of local and Persian-Islamic traditions.\u003c/li\u003e\r\n\t\u003cli\u003eHence, although the early imperial Mughal style (Akbar, Shah Jahan) was dominated by domes and arches, the curvilinear roof became a recognized feature of the provincial Mughal style.\u003c/li\u003e\r\n\t\u003cli\u003eFlat roofs were not a key or celebrated feature of Mughal monuments. They appeared in some utilitarian buildings but never defined the Mughal architectural essence, which emphasized elevation, curvature and symmetry.\u003c/li\u003e\r\n\t\u003cli\u003eDomes (gumbads) were among the most striking features of Mughal architecture.\u003c/li\u003e\r\n\t\u003cli\u003eHumayun\u0026rsquo;s Tomb, Taj Mahal, and Jama Masjid exemplify their grandeur.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mughal bulbous dome with a lotus finial and double-dome construction became iconic.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThus, domes reflect both structural mastery and the symbolic spiritual perfection of Mughal design.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArches (mehraabs) were integral to Mughal architecture, inspired by Persian-Islamic styles.\u003c/li\u003e\r\n\t\u003cli\u003eThey served both aesthetic and structural roles \u0026mdash; enabling vast openings and framing decorated surfaces with calligraphy or pietra dura work.\u003c/li\u003e\r\n\t\u003cli\u003eThe horse-shoe or pointed arch became a defining element of Mughal mosques, forts, and palaces (e.g., Agra Fort, Red Fort, Fatehpur Sikri).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTherefore the correct answer is (C) 1, 3 and 4.\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43833", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"
