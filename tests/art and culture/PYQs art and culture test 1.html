unt": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe famous dialogue between Nachiketa and Yama is mentioned in the Kathopanishad. The Kathopanishad is one of the 108 Upanishads and consists of two chapters, each divided into three sections. The first chapter is considered to be older than the second.\u003c/li\u003e\r\n\t\u003cli\u003eThe story of Nachiketa and Yama is a legendary one. Nachiketa is the son of Sage Vajasravasa, who meets Yama, the deity of death. The dialogue between Nachiketa and Yama is about the transmigration of the soul.\u003c/li\u003e\r\n\t\u003cli\u003eThe story of Nachiketa and Yama is a powerful one that has been told and retoldfor centuries. It is a story that teaches us about the importance of life and death, and the journey of the soul.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Chandogya Upanishad :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Sanskrit religious text that is part of the Chandogya Brahmana of the Sama Veda of Hinduism. It is one of the oldest Upanishads, and is the second largest in size, after the Brhadaranyaka Upanishad.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chandogya Upanishad is a philosophical exposition on the relationship between the self (atman) and the universe (brahman). It is a representation of the ancient Indian school of philosophy, spirituality, and knowledge. The story of the Chandogya Upanishad tells of a father teaching his son about the ultimate truth of Hinduism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Mundaka Upanishad :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an ancient philosophical text written in Sanskrit and Vedic Sanskrit. It is part of the Atharva Veda and is one of the most widely translated Upanishads.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mundaka Upanishad is a collection of philosophical poems that teach meditation and spiritual knowledge. It is presented as a dialogue between sage Saunaka and sage Angiras.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Upanishad is divided into three sections:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. First part: \u003c/strong\u003eDiscusses higher and low er knowledge\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Second part: \u003c/strong\u003eDescribes the true nature of the Self and Brahman, and the path to knowing Brahman\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3.\u0026nbsp;Third part: \u003c/strong\u003eExpands on the first two sections\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe word Mundaka is Sanskrit and means \u0026ldquo;shaved\u0026rdquo; or \u0026ldquo;shorn\u0026rdquo;. It may refer to knowledge that shaves away ignorance.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mundaka Upanishad describes Brahman as the source of all creation, eternal, and beyond the grasp of the limited human intellect. Understanding and realizing the nature of Brahman is central to spiritual growth and self-realization.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kathopanishad :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an ancient Hindu text written in Sanskrit. It is one of the mukhya Upanishads, which are part of the Vedas. The Kathopanishad is part of the last eight short sections of the Katha school of the Krishna Yajurveda. It is also known as K\u0101thaka Upanishad and is listed as number 3 in the Muktika canon of 108 Upanishads.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kathopanishad is a mystical text that offers insights into the nature of life, death, and the eternal quest for knowledge. It is a narrative-style text that captivates readers with its timeless wisdom. The Kathopanishad begins with a katha, or story, of a young boy who is ready to face the Lord of Death in his quest for Truth. The main theme of one of the songs of Sri Swami Sivanandaji Maharaj is \u0026ldquo;Die to live\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kenopanishad :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Vedic Sanskrit text that is part of the Sama Veda. It is listed as the second Muktik\u0101, the canon of the 108 Upanishads of Hinduism.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kenopanishad is a philosophical dialogue between a student and a spiritual teacher. It explores the nature of Brahman, the ultimate reality, and the means to attain self-realization and transcendence. The Kenopanishad also describes an incident in the lives of celestial beings that teaches a significant lesson.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kenopanishad deals with the nature of the highest reality, Brahman, and establishes that this highest reality is not what can come within the scope of our ordinary knowledge.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43892", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\ mg {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKharoshti\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following scripts of ancient India was written from right to left?\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1997)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kharosthi script :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was written from right to left and is one of the ancient scripts of India. It was developed between the 4th and 3rd century BCE in present-day northern Pakistan. The Kharosthi script was used to represent a form of Prakrit, an Indo-Aryan language. It is also known as the \u0026ldquo;Indo-Bactrian\u0026rdquo; script.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kharosthi script is associated with Aramaic and is a sister script of Brahmi. Some inscriptions show the Kharosthi script written from left to right.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Brahmi script :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a writing system that originated in ancient India and is still used today in parts of Asia. It is an abugida, which uses diacritical marks to connect vowels to consonant symbols.\u003c/li\u003e\r\n\t\u003cli\u003eThe Brahmi script is the ancestor of many modern Indian scripts, including Devanagari. It is also the ancestor of hundreds of scripts in Southeast and East Asia.\u003c/li\u003e\r\n\t\u003cli\u003eThe Brahmi script is believed to have originated in the 8th or 7th century BC and may have been introduced to India by Semitic people. One theory is that Brahman scholars adapted the Semitic script to fit the phonetics of Sanskrit and Prakrit.\u003c/li\u003e\r\n\t\u003cli\u003eThe Brahmi script is semialphabetic, with each consonant having either an inherent \u0026ldquo;a\u0026rdquo; sound or a diacritic mark to indicate another vowel. Initial vowels have separate characters.\u003c/li\u003e\r\n\t\u003cli\u003eThe first phase of the Brahmi script is known as A\u015bokan Br\u0101hm\u012b and was used from about the 3rd century BCE to the end of the first century BCE.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eNandinagari :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Brahmic script that is a derivative of the N\u0101gar\u012b script, which appeared in the 7th century AD. The script was used in South India from the 8th to 19th centuries to write Sanskrit manuscripts and inscriptions about philosophy, science, and the arts.\u003c/li\u003e\r\n\t\u003cli\u003eNandinagari is closely related to the Devanagari script. The N\u0101gar\u012b scriptevolved into Devanagari and Nandinagari scripts by the end of the first millennium CE.\u003c/li\u003e\r\n\t\u003cli\u003eThe N\u0101gar\u012b script has roots in the ancient Brahmi script family.\u003c/li\u003e\r\n\t\u003cli\u003eThe earliest evidence of using modern standardized Devanagari is presumed to exist by around 1000 CE.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Sharada script :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an ancient writing system that was used to write Sanskrit and Kashmiri languages between the 8th and 12th centuries. It is a descendant of the Brahmi script and is slightly similar to the Devanagari script.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sharada script originated in the 8th century AD and evolved from the Gupta script of North India. The earliest inscriptions in Sharada script are dated to 804 AD and were found in Kashmir and northeastern Punjab.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sharada script is taught in Hindu schools in Kashmir but is not used in printing books. Today, very few people of the Kashmiri Pandit community use Sharada for religious texts. However, pundits in Kashmir still use the script to make birth horoscopes.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43893", "image_check": "0", "image_link_1": "", "image_ break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u015a\u016bdraka, an Indian king and playwright, wrote Mrichchhakatika (The Little Clay Cart) in the 2nd century BCE. It is considered one of the earliest Indian plays written in Sanskrit.\u003c/li\u003e\r\n\t\u003cli\u003eMrichchhakatika is about a young man named Charudatta and his love for Vasantasena, a rich courtesan. The play explores universal aspects of human nature, such as love, desire, morality, and the complexities of relationships. It also offers a window into the cultural and societal norms of ancient India.\u003c/li\u003e\r\n\t\u003cli\u003eThe play is filled with characters like gamblers, thieves, and courtesans. According to the play, it is not the social status of the person that makes them noble, rather it is their virtue and behavior.\u003c/li\u003e\r\n\t\u003cli\u003eHorace Hayman Wilson, a surgeon general in the East India Company, translated Mrichchhakatika into English in 1826. It was later translated into French, German, and other Indian languages.\u003c/li\u003e\r\n\t\u003cli\u003eA\u015bvaghosa wrote Buddhacharita in the early second century CE. The poem is a Sanskrit mahakavya style epic about the life of Gautama Buddha. The title translates to \u0026quot;Acts of the Buddha\u0026quot;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAsvaghosa :\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAsvaghosa was a Buddhist philosopher, dramatist, poet, musician, and orator from India. He is believed to have been the first Sanskrit dramatist and is considered the greatest Indian poet before K\u0101lid\u0101sa.\u003c/li\u003e\r\n\t\u003cli\u003eBuddhacharita is a poetic narrative of the Buddha\u0026#39;s life and is considered one of the finest examples of Buddhist literature. The poem is made up of 28 cantons and describes the Buddha\u0026#39;s life from birth to death. The poem begins with a description of the Buddha\u0026#39;s birth.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eVishakhadatta :\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eVishakhadatta wrote the Sanskrit play Satta Mudrarakshasa. The title translates to \u0026quot;The Signet of the Minister\u0026quot;. The play is about the rise to power of King Chandragupta Maurya in India. It is a historical play that provides insights into the political situation in ancient India during the reign of Chandragupta Maurya.\u003c/li\u003e\r\n\t\u003cli\u003eThe play is set between the 4th and 8th centuries BC. It tells the story of how Chandragupta Maurya ascended the throne of Magadha after defeating the Nandas. The title refers to the signet ring of Rakshasa, which is stolen by Chanakya\u0026#39;s spy. Chanakya uses the ring to forge a letter that sows suspicion between Rakshasa and Malayaketu.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBanabhatta :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is also known as Bana, wrote Harshacharita in the 7th century CE. Banabhatta was a Sanskrit writer and the court poet of the Indian emperor Harsha. Harshacharita is a biography of Harsha, and its title translates to \u0026quot;The deeds of Harsha\u0026quot;.\u003c/li\u003e\r\n\t\u003cli\u003eHarshacharita is written in an elaborate style of poetic prose, with eight chapters that describe the emperor\u0026#39;s life. The biography provides valuable information about the period, though some say it exaggerates in the emperor\u0026#39;s favor.\u003c/li\u003e\r\n\t\u003cli\u003eBanabhatta also wrote Kadambari and Parvathy Parinayam.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": " ax-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFolk dance:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a type of dance that expresses a expression. It is a way to connect with and culture\u0026#39;s past or present through vernacular express a group\u0026#39;s cultural roots.\u003c/li\u003e\r\n\t\u003cli\u003eFolk dances are often performed at festivals, cultural gatherings, or agricultural events, They are usually performed by people without professional dance training and to traditional folk music.\u003c/li\u003e\r\n\t\u003cli\u003eFolk dances are not a universal genre of dance. They have no universal movement, figure, form, style, or function when compared from one culture to another.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Korku tribe :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey performs the Chatkora and Gadli dances in Madhya Pradesh. The Korku are a Munda ethnic group that live in the Khandwa, Burhanpur, Betul, and Chhindwara districts of Madhya Pradesh. They also live in the adjoining areas near the Melghat Tiger Reserve of Maharashtra.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Jhumar dance :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a popular folk dance from the state of Haryana, India. The dance is also known as the \u0026quot;Hariyanvi Gidda\u0026quot; and is mainly performed by young married women. The dance is named after the Jhumar ornament and is performed to the beats of instruments like the dholak and thali.\u003c/li\u003e\r\n\t\u003cli\u003eThe Jhumar dance often depicts romantic themes, with performers expressing and delicate gestures. This style of Jhumar dance is particularly popular during weddings and other joyous occasions.\u003c/li\u003e\r\n\t\u003cli\u003eThe Jhumar dance originated from Balochistan and Multan.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eOther folk dances from Haryana include: Ras Leela, Phalgun Dance, Ghumar Dance.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Thali dance :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a folk dance from Jammu and Kashmir. Artists perform the traditional Thali dance in the Ramban district of Jammu and Kashmir.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTerah Taali dance :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Terah Taali dance is a folk dance from Rajasthan. The name Terah Taali means \u0026quot;13 claps\u0026quot;. The Kamad community performs this dance, mainly women who sit on the ground while performing.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMukna :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a folk wrestling dance from the state of Manipur in India. It\u0026#39;s a combination of wrestling and judo, and is popular in Imphal, Thoubal, and Bishnupur. Mukna is often played on the final day of the Lai Haraoba festival, which is part of its ceremonial functions.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43898", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": actices under the British Raj. The play was published in Dhaka in 1860 under a pseudonym.\u003c/li\u003e\r\n\t\u003cli\u003eThe play is said to have moved Reverend James Long, a clergyman from the Church Missionary Society, who translated it into English and published it. Long was then tried by the English government and sentenced to one month in jail for his protest against the exploitation of indigo farmers.\u003c/li\u003e\r\n\t\u003cli\u003eVijay Tendulkar wrote the 1972 Marathi play Ghashiram Kotwal. The play is a political satire and historical drama that explores the theme of how powerful men create ideologies to serve their own purposes, and then destroy them when they are no longer useful.\u003c/li\u003e\r\n\t\u003cli\u003eGhashiram Kotwal is set in Maharashtra in the late 18th century and tells the story of a power struggle based on caste ascendancy in politics. The play is based on the lives of Nana Phadnavis, a prominent minister in the court of the Peshwa of Pune, and Ghashiram Kotwal, the city\u0026rsquo;s police chief.\u003c/li\u003e\r\n\t\u003cli\u003eTendulkar (1928\u0026ndash;2008) was a pioneer of modern Marathi plays. His works are known for their strong socio-political commentary and for depicting the harsh realities of life.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome of the themes that appear frequently in his plays include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Gender discrimination\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Sexual norms\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Violence\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Social issues\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Power and morality\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eNabanna is a Bengali play written by Bijon Bhattacharya about the 1943 Bengal famine. The play was first staged in 1944 by the Indian People\u0026rsquo;s Theatre Association (IPTA) and again in 1948 by Bohurupee.\u003c/li\u003e\r\n\t\u003cli\u003eThe play tells the story of the villagers of Aminpur, who are already struggling with food shortages and land sharks when a tidal wave destroys their crops and homes. The play is considered a watershed moment in Indian theater, marking a departure from commercial theater.\u003c/li\u003e\r\n\t\u003cli\u003eIn the initial productions, the playwright himself played a character who has gone insane after years of famine and the death of his two sons. Parsi theater influenced the production, organization, and concept of Urdu theater in India.\u003c/li\u003e\r\n\t\u003cli\u003eParsi theater also influenced Gujarati and Hindi theater. Parsi theater absorbed elements of traditional and folk performing arts, such as music, mime, and comic interludes.\u003c/li\u003e\r\n\t\u003cli\u003eParsi theater was also influenced by Indo Persian/Islamicate culture. Until the early 20th century, Urdu was the most commonly used language in Parsi theater.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43901", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3 and 4\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e itional dance form from Kerala, India. It is a highly refined monologue where the performer narrates episodes from Hindu epics and stories from the Puranas. The dance is accompanied by cymbals and a copper drum called the mizhavu.\u003c/li\u003e\r\n\t\u003cli\u003eChakiarkoothu is believed to have been introduced to Kerala by early Aryan immigrants. It is performed by the members of the Chakiar caste and can only be staged inside temples and witnessed by the Hindus of the higher castes.\u003c/li\u003e\r\n\t\u003cli\u003eThe costume for Chakiarkoothu includes a special headgear shaped like a snake\u0026rsquo;s head. The dancer\u0026rsquo;s body is smeared with a paste of sandalwood and Vibhuthi and his face is made very catchy with vibrant colors.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003ePainkulam Raman Chakyar : \u003c/strong\u003e(1905-1980) was the first to stage Chakiarkoothu at a function, bringing it to the general public. He was instrumental in getting it included in the curriculum of Kalamandalam.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "414", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43902", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
