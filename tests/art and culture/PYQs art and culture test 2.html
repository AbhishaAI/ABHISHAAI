function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">

                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

u003cli\u003eThe statement \u0026ldquo;The status of Gomateshwara at Sravanabelagola represents the last Tirthankara of Jains\u0026rdquo; is not correct.\u003c/li\u003e\r\n\t\u003cli\u003eThe Gomateshwara statue, also known as Bahubali statue, is a 57-foot (17 m) high monolithic statue on Vindhyagiri Hill in the town of Shravanbelagola in the Indian state of Karnataka. It is a significant Jain pilgrimage site. The statue was built in deference to Jain deity Bahubali, who is said to have lived many millions of years ago.\u003c/li\u003e\r\n\t\u003cli\u003eTawang Monastery is the largest Buddhist monastery in India and is located in the valley of the Tawang Chu in Arunachal Pradesh. It is located near the Chinese and Bhutanese border. Tawang is a major holy site for Tibetan Buddhists because it is the birthplace of the sixth Dalai Lama.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chandela dynasty built the Khajuraho temples between 950 and 1050. The Chandela dynasty ruled the region of present-day Madhya Pradesh, India, from the 9th to 13th centuries.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chandela dynasty\u0026rsquo;s construction activity began almost immediately afterthey rose to power. The construction of the Khajuraho temples was initiated by the Chandela ruler, King Yasovarman. Most temples were built during the reigns of the Hindu kings Yashovarman and Dhanga.\u003c/li\u003e\r\n\t\u003cli\u003eThe Khajuraho temple site had 85 temples by the 12th century, spread over 20 square kilometers. Of these, only about 25 temples have survived, spread over six square kilometers.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chandela dynasty is a Rajput clan found in North India. They are regarded to be Chandravanshi, which means the descendants of Soma.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hoysaleshwara temple in Hoysaleswara, India is dedicated to Lord Shiva. It\u0026rsquo;s also known as the Halebidu temple.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple was built between 1120 and 1150 by King Vishnuvardhana during the reign of the Hoysala Empire. It\u0026rsquo;s a double temple, with each side having a sanctum that contains a linga. Lingas are non-figural forms with a rounded top that represent Shiva\u0026rsquo;s divine presence.\u003c/li\u003e\r\n\t\u003cli\u003eThe exterior walls of the temple are divided into three parts, with the bottom part featuring eight sculptural friezes. The friezes depict elephants, lions, vines, horses, narratives, makaras, and hamsas.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple also has many sculptures dedicated to Vaishnavism.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43913", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly 1\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e *{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements:\u0026nbsp;\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2003)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Kitab-I-Nauras, a collection of songs in praise of Hindu deities and Muslim saints, was written by Ibrahim Adil Shah II.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Amir Khusrau was the originator in India of the early form of the musical style known as Qawali.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of these statements is/are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eKitab-I-Nauras is a collection of songs in praise of Hindu deities and Muslim saints written by Ibrahim Adil Shah II.\u003c/li\u003e\r\n\t\u003cli\u003eIbrahim Adil Shah II was a king of the Bijapur Sultanate and a member of the Adil Shahi dynasty in the late 16th century.\u003c/li\u003e\r\n\t\u003cli\u003eHe was also a ruler who was deeply interested in music. Kitab-I-Nauras is a book of 59 songs and 17 couplets written in Dakhni Urdu. The songs are set to various musical modes or Ragas. The book also includes the theory of nine Ragas, which is important in Indian aesthetics.\u003c/li\u003e\r\n\t\u003cli\u003eSome verses in Kitab-I-Nauras explore love poetry, while others describe the beauty of music or ragas as personifications. The book also includes verses where Ibrahim refers to Ganesha and Saraswati as his spiritual mother and father.\u003c/li\u003e\r\n\t\u003cli\u003eAmir Khusrau is known as the \u0026ldquo;father of qawwali\u0026rdquo;. Qawwali is a devotional singing style of the Sufis in the Indian subcontinent. Khusrau is also credited with introducing the ghazal style of song into India. Both styles are still widely practiced in India and Pakistan.\u003c/li\u003e\r\n\t\u003cli\u003eKhusrau was a 13th century Sufi musician, poet, and scholar associated with the royal courts of emperors. He is known for his prolific output, introducing many new genres into the North Indian classical tradition. Khusrau\u0026rsquo;s original songs are still the core of the classical qawwali repertoire.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43914", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following statements if NOT correct?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2003)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBankim Chandra Chatterjee composed the national song of India, Vande Mataram, in Sanskrit and Sanskritized Bengali in the 1870s.\u003c/li\u003e\r\n\t\u003cli\u003eThe poem was included in his 1882 Bengali novel Anandamath. In 1896, Rabindranath Tagore first sang the poem at the Indian National Congress session. In 1937, the Congress adopted the first two verses of the poem as the national song of India.\u003c/li\u003e\r\n\t\u003cli\u003eVande Mataram was a source of inspiration for Indians during the struggle for freedom. It has equal status with Jana-gana-mana.\u003c/li\u003e\r\n\t\u003cli\u003eThe national calendar based on the Saka Era, with Chaitra as its first month and a normal year of 365 days was adopted from 22 March 1957 along with the Gregorian calendar.\u003c/li\u003e\r\n\t\u003cli\u003eThe Constituent Assembly of India adopted the design of the national flag on July 22, 1947. The flag became official when India became a republic.\u003c/li\u003e\r\n\t\u003cli\u003eThe flag is a horizontal tricolour with equal proportions of deep saffron (Kesari) at the top, white in the middle, and dark green at the bottom. In the center of the white band is a navy-blue wheel with 24 spokes that represents the chakra. The wheel\u0026rsquo;s design is based on the wheel that appears on the abacus of the Sarnath Lion Capital of Ashoka.\u003c/li\u003e\r\n\t\u003cli\u003eThe Ashoka Chakra was suggested by B.R. Ambedkar to honor the warrior-turned pacifist Buddhist emperor Ashoka. The chakra was modeled after the \u0026ldquo;wheel of dharma,\u0026rdquo; a religious motif from Hinduism, Jainism, and especially Buddhism.\u003c/li\u003e\r\n\t\u003cli\u003eThe National Anthem of India Jana-gana mana, composed originally in Bengali by Rabindranath Tagore, was adopted in its Hindi version by the Constituent Assembly as the National Anthem of India on 24 January 1950. It was first sung on 27 December 1911 at the Kolkata Session of the Indian National Congress.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43916", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "optio ri calendar, began in 622 CE. The Islamic New Year is celebrated in 622 CE, the year when the Prophet Muhammad and his followers migrated from Mecca to Medina. The word \u0026ldquo;Hijra\u0026rdquo; is Arabic for \u0026ldquo;migration\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43918", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3 and 4\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 4\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements:\u0026nbsp;\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Champaner-Pavagadh Archaeological Park\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Chhatrapati Shivaji Railway Station, Mumbai\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Mamallapuram\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Sun Temple (Konark Temple)\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above are included in the World Heritage List of UNESCO :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Champaner - Pavagadh Archaeological Park :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a UNESCO World Heritage Site located in the Panchmahal district of Gujarat, India. It features a variety of archaeological, historical, and cultural heritage properties.\u003c/li\u003e\r\n\t\u003cli\u003eThe park is located around the historical city of Champaner, which was founded in the eighth century by Vanraj Chavda, the king of the Chavda Dynasty. The Pavagadh hill was a famous Hindu fortress under the Solanki kings of Gujarat, followed by Khichi Chauhans.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eChhatrapati Shivaji Maharaj Terminus, also known as VT or CSMT :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a historic railway station in Mumbai, India. It\u0026rsquo;s a UNESCO World Heritage Site and one of the cleanest stations on Indian Railways.\u003c/li\u003e\r\n\t\u003cli\u003eThe station was designed by British architect Frederick William Stevens and Axel Haig in the Italian Gothic style. Construction began in 1878 and the station opened on June 20, 1887. The station is an example of Victorian Gothic Revival architecture, blending with Indian traditional architecture.\u003c/li\u003e\r\n\t\u003cli\u003eIt\u0026rsquo;s also known for its decorations, which include a statue of progress, busts of the railway company\u0026rsquo;s directors, and statues of a British lion.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMamallapuram :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Mahabalipuram, is\u0026nbsp;a city in Tamil Nadu, India.\u0026nbsp;It is located on a strip of land between the Bay of Bengal and the Great Salt Lake.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eMamallapuram is known for its temples and monuments built by the Pallava dynasty in the 7th and 8th centuries.\u0026nbsp;The monuments are an example of Dravidian temple architecture and Pallava art.\u0026nbsp;The Group of Monuments at Mahabalipuram is a UNESCO World Heritage site.\u0026nbsp;\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Konark Sun Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a 13th-century Hindu temple in Konark, Odisha, India. It\u0026rsquo;s a UNESCO World Heritage Site and is known for its architecture and stone carvings.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is dedicated to the Hindu sun god Surya, and is an example of Kalinga architecture. It\u0026rsquo;s about 35 kilometers northeast of Puri city on the coastline.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple\u0026rsquo;s name comes from the Sanskrit words Kona (angle) and Arka (sun). The temple features 24 wheels, representing the wheels of Surya\u0026rsquo;s chariot. The 12 wheels represent the 12 months of the year, and the 8 spokes represent the 8 time divisions of the day.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43919", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eChina\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMyanmar\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important px; padding:.113px 8px 0cm 5px; height:45px; border-top:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"margin-left:11px; text-align:left; text-indent:-8.5pt\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003eAndhra Pradesh \u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eVikramashila :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a Buddhist monastery and one of the most important centers of learning in India during the Pala Empire. The monastery is located at the site of Antichak village, Bhagalpur district in Bihar.\u003c/li\u003e\r\n\t\u003cli\u003eThe monastery was constructed between the 9th and 12th centuries AD. The monastery is a huge square structure with 208 cells, 52 on each side, that open into a common verandah. The monastery gradually became a center for Tantric Buddhism.\u003c/li\u003e\r\n\t\u003cli\u003eThe Vikramshila Museum is located 36 km east of the Bhagalpur district in the village of Antichak. The museum was established in 2004 and exhibits antiquities recovered from excavations by the Archaeological Survey of India (ASI). According to legend, Khilji forces mistook the university for a fortress and burned it down.\u003c/li\u003e\r\n\t\u003cli\u003eThe site was forgotten for centuries until Lakshmikanta Mishra discovered bricks and structures in a mound at Antichak Village.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHemkund Sahib :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Gurudwara Sri Hemkunt Sahib Ji, is a Sikh place of worship and pilgrimage site in Chamoli, Uttarakhand, India. It\u0026rsquo;s located at an altitude of around 4,329 meters on the banks of Hemkund Lake.\u003c/li\u003e\r\n\t\u003cli\u003eHemkund Sahib is dedicated to Guru Gobind Singh, the tenth Sikh Guru, and is mentioned in the Dasam Granth. It\u0026rsquo;s believed that Guru Gobind Singh spent 10 years meditating at the site. For many Sikhs, visiting Hemkund Sahib is a way to connect with their guru and receive his blessings.\u003c/li\u003e\r\n\t\u003cli\u003eHemkund Sahib is a popular center of Sikh pilgrimage, with thousands of devotees visiting each summer.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Udayagiri Caves :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are a complex of 20 rock-cut caves in Vidisha, Madhya Pradesh. The caves are primarily Hindu temple architecture from the early 3rd century CE to the 5th century CE. They are known for being some of India\u0026rsquo;s oldest Hindu structures and contain some of the oldest surviving Hindu temples and iconography. The caves are also known as the Sunrise Caves and are a stunning representation of the Gupta Empire\u0026rsquo;s architectural and artistic achievements.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Amaravati Stupa :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a ruined Buddhist stupa in the village of Amaravathi, Palnadu district, Andhra Pradesh, India. It was likely built in phases between the third century BCE and about 250 CE. The stupa was one of the biggest in Andhra Pradesh with a probable diameter of 50 meters and a height of 27 meters.\u003c/li\u003e\r\n\t\u003cli\u003eThe stupa was an important monastic center until the 14th century AD. It fell into disuse and was covered in dust and debris over time. In 1797, Colonel Colin Mackenzie discovered and made\u0026nbsp;the stupa famous. After its discovery, several European officials showed interest in the sculptures found at the site and even tried to excavate the structure. The Amaravati Stupa is protected by the archaeological Survey of India.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43923", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSri Mariamman Temple\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyl ": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe initial design and construction of which massive temple took place during the reign of Suryavarman II?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2006)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Angkor Wat temple in Cambodia :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was built during the reign of King Suryavarman II, who ruled from 1113 c. 1150. The temple\u0026rsquo;s initial design and construction took place from 1122\u0026ndash;1150 CE, over a period of 28 years.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is dedicated to Lord Vishnu and is the world\u0026rsquo;s largest religious structure. Suryavarman II, a religious reformer and temple builder, intended the temple to be the supreme abode for Vishnu. The temple is a break from the Shaiva tradition of previous kings.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSri Mariamman Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu temple in Singapore\u0026rsquo;s Chinatown district. It\u0026rsquo;s the oldest Hindu temple in Singapore, built in 1827 by immigrants from South India. The temple is dedicated to Goddess Mariamman, who is known for her ability to cure epidemic illnesses and diseases.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Batu Caves Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Sri Subramaniar Swamy Temple, is the main attraction of the Batu Caves. It is a Hindu temple and tourist attraction with intricate carvings and sculptures. Some say the temple is a focal point for spiritual worship and cultural celebrations.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kamakhya Temple at Nilachal hills in Guwahati, Assam :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is one of the oldest and most revered centres of Tantric practices, dedicated to the goddess Kamakhya. The temple is the center of the Kulachara Tantra Marga and the site of the Ambubachi Mela, an annual festival that celebrates the menstruation of the goddess.\u003c/li\u003e\r\n\t\u003cli\u003eStructurally, the temple is dated to the 8th-9th century with many subsequent rebuildings and the final hybrid architecture defines a local style called Nilachal. It is also one among the oldest 4 of the 51 pithas in the Shakta tradition.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43924", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "n  "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following revolts was made famous by Bankim Chandra Chatterjee in his novel Anand Math?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2006)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBankim Chandra Chattopadhyay\u0026rsquo;s 1882 novel Ananda Math is based on the Sannyasi Rebellion, which took place from 1763 1800. The novel is considered a significant work in Bengali and Indian literature, and its first English publication was titled The Abbey of Bliss.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sannyasi Rebellion was a civil uprising led by religious monks and dispossessed zamindars. The rebellion was a response to the famine of 1770 and the British East India Company\u0026rsquo;s harsh economic policies. The Sanyasis fought back by attacking thecompany\u0026rsquo;s factories and state depositories. The rebellion was eventually crushed under the leadership of Warren Hastings.\u003c/li\u003e\r\n\t\u003cli\u003eAnanda Math also includes the song \u0026ldquo;Vande Mataram\u0026rdquo;, which is considered India\u0026rsquo;s national song.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Bhil uprising :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a tribal uprising that took place in 1818 in the Dhula district of Maharashtra. The uprising was a response to the East India Company\u0026rsquo;s exploitation and denial of traditional forest rights to the Bhil community. The Bhil uprising was one of the first uprisings by a tribal group in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe British responded to the uprising by sending a force to suppress the rebellion. As part of the peace settlement, the British gave concessions to various taxes and returned forest rights.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bhils continued their uprisings until 1838, when a massive uprising took place and was subdued by force. In 1879, the Bhils revolted again by killing some moneylenders who had exploited them economically.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Rangpur Dhing :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a rebellion that took place in the Rangpur district of Bengal in 1783. The rebellion was a protest by peasants and zamindars against the East India Company\u0026rsquo;s high revenue demands. The uprising began on January 18, 1783, and lasted for five weeks.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion is considered the first major uprising against Company rule in Bengal. The rebellion brought to light the weaknesses of the ijardari system, and the government made some reforms to the farming system.\u003c/li\u003e\r\n\t\u003cli\u003eThe rebellion started under the leadership of Dhiraj Narayan.\u003c/li\u003e\r\n\t\u003cli\u003eThe peasants and zamindars took control of the Parganas of Kakina, Kazirhat, and Tepa. They attacked courts, looted grains, and released prisoners. The uprising also spread to Dinajpur.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBishnupur Rebellion :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn 1787, Bishnupur and Birbhum were united to form a separate administrative unit, with the headquarters moved to Suri. This led to a rebellious situation.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1788\u0026ndash;1790, the peasant masses joined bandits in a long and violent rebellion against the East India Company\u0026rsquo;s oppressive rule. By November 1789, the English had lost control of Bishnupur, and the East India Company had suffered significant financial losses.\u003c/li\u003e\r\n\t\u003cli\u003eTowards the end of the 18th century, parts of the district were affected by the Chuar rebellion. The Chuar Rebellion was at its peak in 1798\u0026ndash;99 under the leadership of Durjan Singh, Lal Singh, and Mohan Singh, but was crushed by the British Company\u0026rsquo;s forces.\u003c/li\u003e\r\n\t\u003cli\u003eBishnupur is a city and municipality in the Bankura district of West Bengal, India. It is known for its terracotta temples, historic Radha Krishna temples, and the Baluchari sarees.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43926", "image_check": "0", "image_link_1": "", "image_ h festivals. In 2023, Gatka was officially included in the 37th National Games, scheduled to be held in Goa in October.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMadhubani painting :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Mithila art, originated in the Madhubani district of the Mithila region of Bihar, India.\u003c/li\u003e\r\n\t\u003cli\u003eThe paintings are known for their line drawings filled with bright colors and patterns. They also use natural dyes and pigments for an eye-catching finish.\u003c/li\u003e\r\n\t\u003cli\u003eThe paintings are traditionally created by women from many communities in the Mithila region. Madhubani is also a major export center for these paintings.\u003c/li\u003e\r\n\t\u003cli\u003eMadhubani is a town in the district of the same name in Bihar. The name Madhubani means \u0026ldquo;Forest of Money\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Singhey Khababs Sindhu Festival :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Sindhu Darshan Festival, is a three-day festival in Leh, Ladakh, India. It\u0026rsquo;s celebrated annually on the full moon day of Guru Purnima, which is in June. The festival is held on the banks of the Indus River, which is known as the Sindhu River in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe festival\u0026rsquo;s purpose is to promote tourism in the Ladakh region and to highlight the Indus River as a symbol of India\u0026rsquo;s cultural identity. It\u0026rsquo;s also considered a symbol of India\u0026rsquo;s unity and communal harmony.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43936", "image_check": "0", "image_link_1" anapati on one side and Durga on the other.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Rajarani Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an 11th-century Hindu temple in Bhubaneswar, India. It\u0026#39;s also known as the \u0026quot;love temple\u0026quot; because of its carvings of couples and women. The temple is built in the Kalinga architectural style and is known for its architecture.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is located in the Khurda district, northeast of Lingaraj temple.\u0026nbsp;\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kandariya Mahadeva Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu temple in the Khajuraho Group of Monuments in Madhya Pradesh, India.\u003c/li\u003e\r\n\t\u003cli\u003eIt\u0026#39;s considered one of the best examples of medieval temples in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple was built between 1025-1050 AD. It\u0026#39;s the largest and most ornate temple in the Khajuraho complex, with about 870 sculptures. The temple is built in the shape of a steep mountain, with 84 mini shikharas on the roof to represent the minor mountain peaks around Mount Meru. The temple\u0026#39;s name means \u0026quot;the Great God of the Cave\u0026quot;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBhimeshvara Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is located in Nilagunda, in the Davangere district of Karnataka, India. The temple is sometimes confused with other temples in the state.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple was constructed in the 11th century AD during the rule of the Chalukyas of Kalyana.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "del ak-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNasik caves\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThere are only two known examples of cave paintings of the Gupta period in ancient India. One of these is paintings of Ajanta caves. Where is the other surviving example of Gupta paintings?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2010)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe other surviving example of Gupta paintings is the\u0026nbsp; Bagh caves, which are located in Madhya Pradesh.\u0026nbsp;The Bagh caves are a group of nine rock-cut monuments near Gwalior.\u0026nbsp;They are considered an extension of the Ajanta school, and are similar in design, execution, and decoration.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe paintings display the distinctive Gupta artistic style, with their elegant figures, vibrant colors, attention to detail, and narrative depictions.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eThe Gupta period is generally regarded as a classic peak and golden age of North Indian art for all the major religious groups.\u0026nbsp;The period saw the emergence of the iconic carved stone deity in Hindu art.\u0026nbsp;\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eEllora Caves :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are a series of 34 rock-cut temples in the Charanandri hills of Maharashtra, India. The caves were built between 600 and 1000 CE and contain inscriptions from the 6th century CE onwards. The caves are a UNESCO World Heritage Site and are also known as verul caves.\u003c/li\u003e\r\n\t\u003cli\u003eThe caves are a multi-religious complex that showcases the spirit of tolerance and co-existence that was characteristic of ancient India.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The caves are home to three religions: Buddhism, Jainism, and Brahminism, and illustrate the spirit of tolerance that allowed these religions to establish their sanctuaries and communities in one place.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Lomas Rishi Cave :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a man-made sanctuary cave in the Barabar Caves complex in the Jehanabad district of Bihar, India. The cave is located on the southern side of the Barabar Hills, about 19 kilometers from Gaya.\u003c/li\u003e\r\n\t\u003cli\u003eThe Lomas Rishi Cave is one of four Barabar Caves, which are the oldest surviving rock-cut caves in India. The caves are carved from granite and date back to the 3rd century BC, during the Mauryan Empire. The name \u0026ldquo;baraabar\u0026rdquo; means \u0026ldquo;on par with one another\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe Lomas Rishi Cave has two rooms, an arch-like fa\u0026ccedil;ade, and an elaborately decorated door with a row of elephants and makara (crocodile) motifs. The entrance is shaped like an elephant\u0026rsquo;s back. The cave is unfinished and has no inscription of Ashoka.\u003c/li\u003e\r\n\t\u003cli\u003eThe caves were donated as dwellings to Ajivika ascetics, an ancient Indian religion that vanished after the 14th century.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eNasik caves :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are a group of 23 rock - cut caves located on Trirashmi hill in Nasik, Maharashtra. The caves were carved between the 1st century BCE and the 3rd century CE, and additional sculptures were added up to about the 6th century. The caves reflect the Hinayana sect of Buddhism.\u003c/li\u003e\r\n\t\u003cli\u003eThe caves are also known as Pandavleni caves or Trirashmi caves. They are locatedon the north face of a hill called Trirasmi in ancient times, 8 km southwest of Nasik town. The caves are built on the Trirasmi hill about 3004 feet above the sea.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pandavleni Caves were built by Buddhist monks who sought solace and enlightenment in these serene surroundings. The location provides a serene and peaceful atmosphere, making it conducive to meditation and contemplation.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", " d an eternal dharma with the tirthankaras guiding every time cycle of the cosmology. The three main pillars of Jainism are ahims\u0101 (non violence), anek\u0101ntav\u0101da (non-absolutism), and aparigraha (asceticism).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJain monks take five main vows:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. ahims\u0101 (non-violence),\u003c/p\u003e\r\n\r\n\u003cp\u003e2. satya (truth),\u003c/p\u003e\r\n\r\n\u003cp\u003e3. asteya (not stealing),\u003c/p\u003e\r\n\r\n\u003cp\u003e4. brahmacharya (chastity), and\u003c/p\u003e\r\n\r\n\u003cp\u003e5. aparigraha (non-possessiveness).\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThese principles have affected Jain culture in many ways, such as leading to a predominantly lacto-vegetarian lifestyle.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43941", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThree main racial groups of the Indian subcontinent.\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u0  "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Nagara, the Dravida and the Vesara are the...........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Nagara, Dravida, and Vesara are three main styles of Hindu temple architecture in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Nagara style :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu style of temple architecture that originated in northern India. It\u0026rsquo;s popular in Northern, Western, and Eastern India, especially in the regions around Malwa, Rajputana, and Kalinga.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some features of the Nagara style: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Raised plinth :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe temple is built on a raised stone platform with steps leading up to it.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Garbha griha :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe garbha griha, or sanctum sanctorum, is the most sacred part of the temple. It\u0026rsquo;s a perfect square and houses the image or idol of the main deity.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Shikhara :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe most distinguishable aspect of Nagara style temples is the towering shikhara, or \u0026ldquo;mountain peak\u0026rdquo;, that towers over thegarbha griha. The earliest temples have just one shikhara, but later temples have several. The garbhagriha is always located directly under the tallest tower.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Kalasha :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe shikhara is topped by a bulbous finial called a kalasha.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Plan :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe plan of a Nagara style of temple is four sided, but the whole temple plan could be oblong.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Subdivisions :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThere are many subdivisions of nagara temples depending on the shape of the shikhara.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some examples of Nagara style temples:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eKandariya Mahadeva Temple:\u003c/strong\u003e Lo cated in Khajuraho, Madhya Pradesh\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eJagdish Temple:\u003c/strong\u003e Located in Udaipur, Rajasthan\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eKhajuraho temple complex: \u003c/strong\u003eA UNESCO World Heritage Site\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eKonark Sun Temple:\u003c/strong\u003e A UNESCO World Heritage Site\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eMahabodhi Temple: \u003c/strong\u003eA UNESCO World Heritage Site\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eSun Temple in Modhera, Gujarat: \u003c/strong\u003eAn example of Nagara-style temple architecture\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eOssian Temple in Gujarat:\u003c/strong\u003e An exam ple of Nagara-style temple architecture\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDravidian architecture :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a style of temple architecture that originated in South India during the Gupta period. It\u0026rsquo;s one of the three main styles of Indian temple architecture, along with the Nagara and Vesara styles.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some features of Dravidian architecture:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Compound wall: \u003c/strong\u003eThe temple is sur rounded by a compound wall.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2.\u0026nbsp;Gopuram:\u003c/strong\u003e The entrance gateway is located in the center of the front wall.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Vimana: \u003c/strong\u003eThe main temple tower is a stepped pyramid that rises geomet rically. The vimana is also known as the gopuram or shikhara. It\u0026rsquo;s typically adorned with intricate carvings and sculptures, and often has multiple tiers.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Pillars and pilasters: \u003c/strong\u003eThe temple has pillars and pilasters.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Curved top:\u003c/strong\u003e The temple has a curved top.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Boundary walls: \u003c/strong\u003eThe temple has boundary walls.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Water tank: \u003c/strong\u003eThe temple enclosure has a water tank.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e8. Panchayatan style:\u003c/strong\u003e The temple grounds are designed in the panchayatan style, with a main temple and four smaller shrines.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSome examples of Dravidian temples include the Brihadeeshwara temple at Thanjavur and the Gangaikondacholapuram temple.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Vesara style of temple architecture :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a combination of the Dravidian and Nagara styles of temple architecture. It\u0026rsquo;s a hybrid form of Indian temple architecture, with the plan and shape of South Indian temples and the details of North Indian temples.\u003c/li\u003e\r\n\t\u003cli\u003eThe Vesara style is said to have originated in the mid-seventh century AD\u0026nbsp;with the later Chalukya rulers. The word \u0026ldquo;Vesara\u0026rdquo; is derived from the Sanskrit word vishra, which means \u0026ldquo;an area to walk for a long time\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome features of the Vesara style include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Dravidian vimana\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Nagara-type faceted walls\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Selective merging of the Nagara and Dravida orders\u003c/p\u003e\r\n\r\n\u003cp\u003e4. A star-shaped plan\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Projecting angles in circles with centers in the middle of the shrine and mandap\u003c/p\u003e\r\n\r\n\u003cp\u003e6.\u0026nbsp; Pillars, doorways, ceilings are decorated with intricate carvings\u003c/p\u003e\r\n\r\n\u003cp\u003e7. A usually pyramidal tower, similar to the Dravida style, but may lack the stepped appearance seen in pure Dravida architecture\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSome famous temples of Vesara style are the Kailashnath temple, Ellora, Chennakesava temple, Virupaksha temple, and Ladkhan temple.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43942", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u00 idth:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the history of Ancient India, which of the following was/were common to both Buddhism and Jainism?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Avoidance of extremities of penance and enjoyment\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Indifference to the authority of Vedas\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Denial of the efficacy of rituals\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBuddhism and Jainism share many similarities, including: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Karma :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions believe in karma, which is the attachment of positive and negative forces to the soul.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Salvation :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions believe that salvation can only be achieved through nirvana.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Helping others :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions believe in helping others and teaching their values to others.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Materialistic world :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions teach to stay away from the materialistic world and desires.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Moral lives :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions give importance to the moral lives of people.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Harm to humans :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe teachings of Jainism and Buddhism condemn all sorts of harm meted to humans or living beings.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Non-violence :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions believe and propagate non violence, good social conduct, charity, and generosity.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e8. Atheism :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions are atheistic in the sense that they don\u0026rsquo;t believe in there\u0026rsquo;s a creator god or any super being.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e9. Common background :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions have a common background associated with the Aryan Culture.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e10. Against Veda :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions were against Vedas and the Vedic culture as well as against Brahmanism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e11. Denial of efficiency of rituals :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions deny the efficiency of rituals.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e12. Only those who left their homes could gain true knowledge :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth religions believe that only those who left their homes could gain true knowledge.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e13. Non injury to animal life.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBuddhism and Jainism also share some other similarities, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Both religions emerged as a new religious ideas from late 6th century BCE.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Both religions preached Satya, Ahimsa, Brahmacharya, and detachment from the materialistic world.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43945", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBuddha\u0026rsquo;s calling of the Earth to watch over Mara and to prevent Mara from disturbing his meditation.\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyl {overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth statements (a)and (b) are correct in this context.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLord Buddha\u0026rsquo;s image is sometimes shown with the hand gesture called \u0026ldquo;Bhumisparsha mudra\u0026rdquo;. It symbolises.........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Bhumisparsha mudra is a hand gesture that symbolizes the Buddha\u0026rsquo;s enlightenment. It\u0026rsquo;s formed by extending the five fingers of the right hand to touch the ground. The left hand rests on the lap.\u003c/li\u003e\r\n\t\u003cli\u003eThe mudra represents the moment of the Buddha\u0026rsquo;s enlightenment, when he summoned the earth goddess, Sthavara, to witness his attainment of enlightenment. It also symbolizes the Buddha\u0026rsquo;s calling of the Earth to witness his purity and chastity despite the temptations of Mara.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bhumisparsha mudra also commemorates the Buddha\u0026rsquo;s victory over the temptation by the demon-king Mara. In Buddhist art, mudras are a set of hand gestures and finger positions that serve as symbols representing the Buddha\u0026rsquo;s various roles and states of mind.\u003c/li\u003e\r\n\t\u003cli\u003eMudras are symbolic or ritual gestures or poses in Hinduism, Jainism, and Buddhism. They are spiritual gestures employed in the iconography and spiritual practice of Indian religions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome mudras of Buddha : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Dhyana mudra :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eOne of the five common mudras in Buddhist art. It refers to the prince Siddhartha meditating under the pipal tree before he achieved enlightenment.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Abhaya mudra :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis mudra is made with the open palm of the right hand, extending outwards at the chest level or slightly higher. Translated from Sanskrit as fearlessness, it signifies \u0026ldquo;stop\u0026rdquo;. This means to end fears and phobias that can cloud your mind.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Dharmachakra mudra :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis mudra is a reference to the Buddha\u0026rsquo;s first sermon at Sarnath. It gets its name from its association with the eponymous dharmachakra or \u0026ldquo;wheel of law\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Varada mudra :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAlso known as the \u0026ldquo;Favourable Mudra\u0026rdquo; or the Mudra of granting wishes/mercy. This mudra has also been depicted in various Buddha statues.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Vitarka mudra :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis mudra symbolizes the pursuit of knowledge. Vastu Shastra suggests that placing a Buddha statue with the Vitarka mudra on your library, work, or study desk can help you attain excellence in work and academic pursuits.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Anjali mudra :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis mudra denotes welcome, prayer, and devotion motion.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Uttarabodhi mudra :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis mudra denotes the supreme enlightenment through connecting oneself with divine universal energy. It is performed with the help of both the hands, which are placed at the heart with the index fingers touching and pointing upwards and the remaining fingers intertwined.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43946", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-w
