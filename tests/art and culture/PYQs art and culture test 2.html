n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAvalokiteshvara :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Buddhist deity and bodhisattva, or \u0026ldquo;buddha-to-be\u0026rdquo;. The name Avalokiteshvara comes from the Sanskrit words avalokita, meaning \u0026ldquo;to look on from above,\u0026rdquo; and ishvara. Avalokiteshvara is associated with compassion and the benevolent protection of the world.\u003c/li\u003e\r\n\t\u003cli\u003eAvalokiteshvara is often depicted with a small seated Buddha in his headdress. He may also be depicted with 1,000 arms and 1,000 eyes in each hand. In one image, Avalokiteshvara is seated on a lion throne and dressed in jewels. Above his head is a parasol, which is an ancient symbol of royal status. Beside his head are lotus borne stupas, topped with sun and crescent moons. At his left knee is his protective attendant, who holds a thunderbolt, or vajra.\u003c/li\u003e\r\n\t\u003cli\u003eAvalokiteshvara is primarily associated with Mahayana, or \u0026ldquo;Greater Vehicle\u0026rdquo;, Buddhism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eLokesvara :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is another name for Avalokiteshvara, a bodhisattva in Buddhism. Avalokiteshvara means \u0026ldquo;lord who looks down\u0026rdquo; or \u0026ldquo;the lord of the world\u0026rdquo;. In Sanskrit, Avalokiteshvara is also known as Padmapani, which means \u0026ldquo;holder of the lotus\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePadmapani :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is another name for Avalokiteshvara, the bodhisattva of infinite mercy. Padmapani literally means \u0026ldquo;lotus bearer\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003ePadmapani is often depicted with a lotus flower in one hand and a vase in the other, symbolizing purity and abundance. He is usually depicted with a lowered hand in the boon-granting gesture (varadamudra) while his raised hand holds the stem of a white lotus (padma) that blooms above his shoulder.\u003c/li\u003e\r\n\t\u003cli\u003ePadmapani is a favored form of Avalokiteshvara, the embodiment of Buddhist compassion.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePadmapani may also refer to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A painting in the Ajanta Caves, which date from the 2nd century BC\u003c/p\u003e\r\n\r\n\u003cp\u003e2. An epithet of Brahman\u003c/p\u003e\r\n\r\n\u003cp\u003e3. A name of Buddha\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43986", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eChalukya\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\ \u003e\r\n\u003cp\u003eVijayanagara\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBuilding \u0026lsquo;Kalyana Mandapam\u0026rsquo; was a notable feature in the temple construction in the kingdom of............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eKalyana Mandapas were a notable feature of the Vijayanagara Empire\u0026rsquo;s temple construction. The Vijayanagara Empire was established in 1336 AD by Harihara and Bukka.\u003c/li\u003e\r\n\t\u003cli\u003eKalyana Mandapas are open pavilions built to celebrate divine weddings. They are used for ceremonies that symbolize the marriage of the temple\u0026rsquo;s divinity to their consort. The interior of a Kalyana Mandapa is surrounded by columns and has a central platform for sacred dances.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mandapas are built on square or polygonal plinths with carved friezes thatare four to five feet high. They have ornate stepped entrances on all four sides with miniature elephants or with Yali balustrades (parapets). The Mantapas are supported by ornate pillars.\u003c/li\u003e\r\n\t\u003cli\u003eThe tradition of Kalyana Mandapams is thought to have started during the reign of the Vijayanagara Empire and has been passed down through generations.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe architecture of the Vijayanagara Empire :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a blend of Hindu, Islamic, and local traditions. It\u0026rsquo;s often characterized as Dravida style, but has distinct features that set it apart. This unique style is referred to as the Provida style.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe architecture is characterized by:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Terracotta and stone decorations\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Graceful arches and vaults\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Intricate carvings and reliefs\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Large multi-purpose halls (mandapas)\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Tall entrance towers (Gopurams)\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe architecture can be broadly classified into religious, courtly, and civic architecture. The Vijayanagara Empire\u0026rsquo;s architectural achievements reflect the era\u0026rsquo;s cultural syncretism.\u003c/li\u003e\r\n\t\u003cli\u003eThe capital city of Vijayanagara has over 1,600 surviving monuments. These monuments are divided into three general zones :\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eFortified urban core\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Sacred center\u003c/li\u003e\r\n\t\u003cli\u003eSuburban settlements\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe city\u0026rsquo;s most famous monument is the Sun Temple, the largest religious structure in South India.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43987", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{ove  and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements:\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Deification of the Buddha.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Trading the path of Bodhisattvas.\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Image worship and rituals.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above is/are the feature/ features of Mahayana Buddhism?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWhat is Mahayana Buddhism?\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMahayana Buddhism is a Sanskrit term that translates to \u0026ldquo;great vehicle\u0026rdquo;. It refers to a wide range of Buddhist teachings and practices.\u003c/li\u003e\r\n\t\u003cli\u003eMahayana Buddhism teaches that a path to awakening is a path to the awakening of all sentient beings. It also teaches that the craving for permanence in an impermanent world can only lead to suffering.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMahayana Buddhism has three main aspects:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Sutra: \u003c/strong\u003eThe importance of sutras\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Bodhisattvas:\u003c/strong\u003e The significance of bodhisattvas and the religious com munities they lead\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Meditation: \u003c/strong\u003eThe importance of med itation, which is sometimes accompa nied by the recitation of sutras\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMahayana Buddhism also includes the belief that the primary purpose of Buddhism is to spread happiness and compassion to everyone in the world.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMahayana Buddhism is characterized by a number of features, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Deification of the Buddha\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Treading the path of Bodhisattvas\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Image worship and rituals\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Complex ritualism\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Paradoxical metaphysics\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Universal ethics\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Statues of the Buddha\u003c/p\u003e\r\n\r\n\u003cp\u003e8. The worship of Bodhisattva\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMahayana Buddhism also includes the following characteristics:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eGiving, Morality, Patience, Energy, Meditation, Wisdom.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43988", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAjanta Caves lie in the gorge of the Waghora river.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSanchi Stupa lies in the gorge of the Chambal river.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePandu-Lena Cave Shrines lie in the gorge of the Narmada river.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAmaravati Stupa lies in the gorge of the Godavari river.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following statements is correct?\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAjanta Caves are located in the gorge of the Waghora river. The caves are carved into the cliff face on the south side of the U-shaped gorge. The gorge contains several waterfalls that can be heard from outside the caves when the river is high.\u003c/li\u003e\r\n\t\u003cli\u003eThe Ajanta Caves are a group of 30 rock-cut Buddhist cave monuments that date back to the 2nd century BCE to the 6th century CE. The caves are located in the Sahyadri hills and are famous for their rock-cut sculptures and paintings that depict the life and teachings of Buddha. The Ajanta Caves are a UNESCO World Heritage site and a major tourist attraction in India.\u003c/li\u003e\r\n\t\u003cli\u003eSanchi Stupa is not located in the gorge of the Chambal River. It is located in an upland plateau region west of the Betwa River in west-central Madhya Pradesh.\u003c/li\u003e\r\n\t\u003cli\u003eSanchi Stupa is a group of Buddhist monuments that was designated a UNESCO World Heritage site in 1989. The stupa is believed to have been originally built in the 3rd century BC by Ashoka to enshrine the relics of Buddha.\u003c/li\u003e\r\n\t\u003cli\u003ePandu-Lena Cave Shrines are not located in the gorge of the Narmada River. They are located on the north face of the Trirasmi hill, about 8 kilometers southwest of Nashik city. The caves are also known as the Pandavleni Caves, Trirashmi Caves, Tirthankar Leni, Panch Pandav, and Pandav Leni Jain Cave.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pandu-Lena Cave Shrines are a group of 24 rock-cut caves that were designated a UNESCO World Heritage Site in 1989. The caves are a complex of ancient rock-cut sculptures that were excavated by Jain saints around 2,000 years ago. The caves contain shrines, cisterns, rare inscriptions, and carved figures of Buddha and Bodhisattva.\u003c/li\u003e\r\n\t\u003cli\u003eAmaravati Stupa is located in the gorge of the Krishna River, not the Godavari River. The stupa is located in the village of Amaravathi, Andhra Pradesh, on the banks of the Krishna River.\u003c/li\u003e\r\n\t\u003cli\u003eThe Amaravati Stupa is a Buddhist site that dates back to the 3rd century BCE, during the reign of Emperor Ashoka. The stupa was once one of the largest in India, but only remnants remain today. The stupa is taller than the Sanchi stupa and has a huge circular dome and high platforms that extend in the four cardinal directions.\u003c/li\u003e\r\n\t\u003cli\u003eThe Amaravati Stupa was once a large monastic vihara, or \u0026ldquo;university\u0026rdquo;, but is now submerged under a lake. Many remains were relocated to an island in the lake, but most sculptures are now in museums.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43989", "image_check": "0", 003e3. It was meant to promote the Vaishnava cult in the region.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Its design has given rise to a popular belief that it was the inspiration behind the Indian Parliament building.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eChausath Yogini Temple, also known as Ekattarso Mahadeva Temple, is an 11th century temple in Morena district, Madhya Pradesh. It\u0026rsquo;s located on a hill in the villageof Mitaoli, about 25 miles from Gwalior.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple has a central shrine of the Yogini and 64 subsidiary shrines of Shiva on an outer circle. An inscription from 1323 CE (Vikram Samvat 1383) states that the Kachchhapaghata king Devapala built the temple.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kachchhapaghata Dynasty ruled the northwestern parts of Madhya Pradesh from the 10th to 12th centuries. According to an inscription, the temple was built by Maharaja Devapala of the Kachchapagata dynasty in 1323 CE.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple\u0026rsquo;s design has led to the popular belief that it inspired the construction of the Indian Parliament building.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chausath Yogini Temple was not meant to promote the Vaishnava cult in the region. As mentioned earlier, the temple is dedicated to the 64 Yoginis, who are considered to be a manifestation of the goddess Durga.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43990", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe earliest Dharmashastra texts written in aphoristic (sutra) style.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePhilosophical schools that did not accept the authority of Vedas.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width: !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the religious history of India, consider the following statements:\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Sthaviravadins belong to Mahayana Buddhism.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Lokottaravadin sect was an offshoot of the Mahasanghika sect of Buddhism.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The deification of Buddha by Mahasanghikas fostered Mahayana Buddhism.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSthaviravadins, also known as Theravadins, do not belong to Mahayana Buddhism. They are followers of the Theravada school of Buddhism, which is considered the oldest surviving branch of Buddhism. Theravada Buddhism is prevalent in Sri Lanka, Myanmar, Thailand, Cambodia, and Laos.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTheravada Buddhism :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eEmphasizes the original teachings of Buddha and the path to individual enlightenment. Sthaviravadins emphasize the original teachings of the Buddha and the attainment of individual liberation (arhatship) through meditation and ethical conduct.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mahasanghika sect was an early Buddhist school in ancient India. The name translates to \u0026ldquo;the Great Assembly\u0026rdquo;of monks. The sect\u0026rsquo;s original center was in Magadha, but it also had important centers in Mathura and Karli.\u003c/li\u003e\r\n\t\u003cli\u003eThe Lokottaravadin sect was one of several sub-sects that emerged from the Mahasanghika sect over time.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mahasanghikas believed in multiple buddhas who were supramundane (lokottara) and that Gautama Buddha was only an apparition. They also patronized Mahayana Buddhism.\u003c/li\u003e\r\n\t\u003cli\u003eIn 100 A.D., during the reign of Kanishka, a major split occurred within the Mahasanghika sect.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThis split resulted in the emergence of two sects:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Hinayana, or the Lesser Vehicle, and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Mahayana, or the Greater Vehicle.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Mahasanghikas believed in the concept of Buddha-nature, which is the idea that all beings have the potential to become Buddhas. They also believed in the deification of the Buddha and the worship of Bodhisattvas.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mahasanghikas introduced the concept of the Buddha as a transcendent and almost divine figure, which differed from the earlier portrayal of the Buddha as a more human figure.\u003c/li\u003e\r\n\t\u003cli\u003eMahayana Buddhism believes in the existence of multiple Buddhas who have attained enlightenment and are worshipped as divine beings. This is different from Theravada Buddhism, which emphasizes the historical Buddha, Siddhartha Gautama, as the only Buddha.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43992", "image_check": "0",  "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBhilsa is in the state of Madhya Pradesh, India. The city was originally called Besnagar, then Bhilsa (or Bhelsa), and is now known as Vidisha. The name \u0026ldquo;Vidisha\u0026rdquo; comes from the nearby river \u0026ldquo;Bais\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eVidisha is the administrative headquarters of the Vidisha District, which is located in central India. The city is 62.5 kilometers northeast of Bhopal, the state capital.\u003c/li\u003e\r\n\t\u003cli\u003eDwarasamudra, also known as Dorasamudra, is a town in the Hassan District of Karnataka, India. It was the capital of the Hoysala Empire from 1062 until the end of the dynasty. In 1311, the Delhi Sultanate defeated the Hoysala Empire in a siege at Dwarasamudra.\u003c/li\u003e\r\n\t\u003cli\u003eOn 18 September 2023, three Hoysala temples in Karnataka were declared UNESCO World Heritage Sites. The temples are located in Belur, Halebid, and Somanathapur.\u003c/li\u003e\r\n\t\u003cli\u003eGirinagar, also known as Girnar or Revatak Parvata, is a group of mountains in the Junagadh district of Gujarat, India. The mountains are sacred and older than the Himalayas.\u003c/li\u003e\r\n\t\u003cli\u003eGirnar is a significant pilgrimage site for Hindus, who gather here during the Girnar Parikrama festival. The mountain is covered with 866 Hindu and Jain temples that are spread over its summit. Pilgrims climb the 10,000 stone steps to the summit, which can take a full day.\u003c/li\u003e\r\n\t\u003cli\u003eSthanesvara, also known as Thanesar, is located in the Kurukshetra district of Haryana, India. It is a historic city and Hindu pilgrimage center located on the banks of the Saraswati River.\u003c/li\u003e\r\n\t\u003cli\u003eSthanesvara is a place of religious and historical importance. The ancient Sthaneshwar Mahadev Temple, dedicated to Shiva, is located in Thanesar. It is said that the Pandavas and Krishna prayed to Shiva at this temple and received his blessings forvictory in the Mahabharata battle.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43993", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: bre "font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003e3.\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #181717; width:83px; padding:.113px 2px 0cm 5px; height:41px; border-top:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003eUpasaka \u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #181717; width:166px; padding:.113px 2px 0cm 5px; height:41px; border-top:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"margin-left:34px; text-align:left; text-indent:-25.5pt\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003eLay\u0026nbsp; follower\u0026nbsp;of\u0026nbsp;\u0026nbsp;Buddhism\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eWhich of the pairs given above are correctly matched?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eParivrajaka is a Sanskrit word that translates to \u0026ldquo;a wanderer\u0026rdquo;. It refers to a class of Indian religious mendicants who have traveled around India.\u003c/li\u003e\r\n\t\u003cli\u003eParivrajakas are also known as Bhikshus, which means \u0026ldquo;mendicants\u0026rdquo; or \u0026ldquo;those who begged\u0026rdquo;. They leave their homes and wander from village to village and forest to forest.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Some famous examples of Parivrajakas include: Vardhamana Mahavira, Gauthama Buddha, Makhkhali Goshala, Ajita Keshkambalin.\u003c/li\u003e\r\n\t\u003cli\u003eThe Parivrajaka dynasty was spread across the Bundelkhand region. King Hastin, the son of King Devaday, was the most popular king of the Parivrajaka dynasty, ruling from 475 to 517 AD.\u003c/li\u003e\r\n\t\u003cli\u003eShramanas were monks who practiced Buddhism or Jainism and lived a strict and self-denying lifestyle. They are also known as ascetics and renouncers. The Sramana movement is considered the origin of Buddhism and Jainism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eShramana practices include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Rejecting elaborate rituals: Shra manas believed that commoners felt left out of elaborate rituals.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Criticizing sacrificial worship: Shra manas believed in Ahimsa, or non-violence.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Establishing viharas: Shramanas built monasteries where they medi tated.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Building stupas: Shramanas built dome-like monuments where common people could connect with the Buddhist religion.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Simplifying the meaning of truth: Shramanas sought to simplify the meaning of truth, like Buddha\u0026rsquo;s Four Noble Truths.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Sramana tradition has three major branches in ancient India. In the early stages of Hinduism\u0026rsquo;s development, Brahmins and Shramanas were sworn enemies.\u003c/li\u003e\r\n\t\u003cli\u003eAn upasaka is a lay devotee of Gautama Buddha. The term comes from Sanskrit and means \u0026ldquo;servant\u0026rdquo;. In Buddhism, an upasaka is not a member of a monastic order.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIn Southeast Asia, the term upasaka more often refers to a pious person who:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Visits the local monastery on holy days\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Takes special vows\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Goes to the three refuges\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Observes precepts\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Earns his livelihood by honest means\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eUpasaka shares an important symbiotic relationship with the monastic community. The monks provide a full-time example of ethical orthopraxis whereas the lay devotees serve them with food and gifts.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43994", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003 \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Nettipakarana\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Parishishta Parvan\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Avadanasataka\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Trishashtilakshana Mahapurana\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above are Jaina texts?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Nettipakarana is a Buddhist scripture that is sometimes included in the Khuddaka Nikaya of Theravada Buddhism\u0026rsquo;s Pali Canon. The text\u0026rsquo;s main theme is Buddhist Hermeneutics, which it achieves by systematizing the Buddha\u0026rsquo;s teachings.\u003c/li\u003e\r\n\t\u003cli\u003eThe Nettipakarana is a guide to help those who already understand the teaching present it to others. The Netti methods were taught by the Buddha\u0026rsquo;s disciple Kaccana (also Katyayana or Kaccayana). The text describes itself as being composed by Kaccana.\u003c/li\u003e\r\n\t\u003cli\u003eParishishta Parvan is a 12th-century Sanskrit mahakavya by Hemachandra. It is also known as the Sthaviravalicharitra and is a biography that details the histories of the earliest Jain teachers.\u003c/li\u003e\r\n\t\u003cli\u003eThe book also provides a detailed description of various aspects of Chandragupta\u0026rsquo;s life, including his conversion to Jainism. For example, according to the book, the name of Bindusara\u0026rsquo;s mother was Durdhara. The book was largely produced as a biography of Chanakya or Kautilya.\u003c/li\u003e\r\n\t\u003cli\u003eAvadanasataka, which literally translates to \u0026ldquo;one hundred stories\u0026rdquo;, is a Sanskrit anthology of 100 Buddhist legends. The stories are about deeds and their results in subsequent lifetimes. They are organized into ten \u0026ldquo;books\u0026rdquo; that portray the truth of the doctrine of karma (action) and the power of religious d\u0100na (giving), faith, and more.\u003c/li\u003e\r\n\t\u003cli\u003eThe Avadanasataka is thought to date to the same time as the Ashokavadana. It may be from the Mulasarvastivada school.\u003c/li\u003e\r\n\t\u003cli\u003eThe Avadanasataka is similar to other texts that describe past deeds or past lives held in other traditions in the region, such as the Puranas, the Dasam Granth, Janamsakhis of Sikhism, and the Kalpa S\u016btra of Jainism.\u003c/li\u003e\r\n\t\u003cli\u003eTrishashtilakshana Mahapurana is a major Jain text that was written in the 9th century CE. It is a summary of the Sanskrit writings Adipurana and Uttarapurana.\u003c/li\u003e\r\n\t\u003cli\u003eThe text is a Jaina work that deals with the life of Lord Mahavira. The text was written by Acharya Jinasena during the rule of Rashtrakuta ruler Amoghavarsha. It was completed by his pupil Gunabhadra.\u003c/li\u003e\r\n\t\u003cli\u003eThe text is also known as Chavundaraya Purana. It was written in 978 CE by Chavundaraya, a famous Ganga minister and army commander.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43996", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003csty re of South India, dating from around 300 BCE to 300 CE. The word \u0026ldquo;Sangam\u0026rdquo; translates to \u0026ldquo;association\u0026rdquo;. The literature is thought to have been produced in three literary academies, or chankams, in Madurai, India, from the 1st to the 4th century CE.\u003c/li\u003e\r\n\t\u003cli\u003eSangam literature does make references to the social classification of Varna, which was a system of social classification in ancient India based on occupation and birth.\u003c/li\u003e\r\n\t\u003cli\u003eSangam literature is a significant phase in the history of ancient South India. It is characterized by its rich poetic tradition and insights into the cultural and social life of the time.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe literature includes:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Tolkappiyam:\u003c/strong\u003e Considered the first Tamil literary work. It divides poetry into two categories:\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eAham and\u003c/li\u003e\r\n\t\u003cli\u003ePuram.\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Ettuttokai: \u003c/strong\u003eA classical Tamil poetic work consisting of eight works long and short.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Ainkurunuru: \u003c/strong\u003eAn anthology of poetry.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Kuruntokai: \u003c/strong\u003eAn anthology of poetry.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Narrinai: \u003c/strong\u003eAn anthology of poetry.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSangam literature is one of the main sources used for documenting the early history of the ancient Tamil country. It provides elaborate information about flourishing indoor Roman trade.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "top border-bottom:1px solid #181717; width:122px; padding:.60px 2px 0cm 5px; height:41px; border-top:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"margin-left:8px; text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003eKalsi\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #181717; width:124px; padding:.60px 2px 0cm 5px; height:41px; border-top:none; border-right:1px solid #181717; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"left\" style=\"margin-left:8px; text-align:left; text-indent:0cm\"\u003e\u003cspan style=\"font-size:12pt\"\u003e\u003cspan style=\"line-height:107%\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan style=\"color:#181717\"\u003eKarnataka\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eHow many pairs given above are correctly matched?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Dhauli Major Rock Edict is an edict that describes Ashoka\u0026rsquo;s remorse for past violence and his resolve to promote peace and moral conduct.\u003c/li\u003e\r\n\t\u003cli\u003eThe edict is engraved on a rock on the side of the road that leads to the top of Dhauli hill, near Bhubaneswar. The edicts include Nos. I-X, XIV, and two separate Kalinga Edicts.\u003c/li\u003e\r\n\t\u003cli\u003eDhauli is located in the ancient territory of Kalinga, which is now the state of Orissa. Emperor Ashoka Maurya conquered Kalinga in about 260 BC, with a terrible loss of life. After the conquest, Ashoka repented of the violence and converted to Buddhism. The Dhauli Stupa serves as a reminder of Ashoka\u0026rsquo;s change of heart and his efforts to promote Buddhism and a more humane society.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Erragudi rock edict :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is located in the Kurnool district of Andhra Pradesh. The site includes major and minor rock inscriptions, and is considered an important treasure of the Mouryan king Ashoka (269-231 BCE). The inscriptions are in Brahmi script and Prakrit language, and advocate for obedience to parents and elders, kindness to living beings, and speaking the truth.\u003c/li\u003e\r\n\t\u003cli\u003eThe Erragudi site is the only known location where the Minor Rock-edicts and the fourteen main Rock-edicts are found together. The Archaeological Survey of India (ASI) is protecting the site and developing it as a tourist spot.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Jaugada Rock Edict :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a series of 14 edicts inscribed on a rock face in the Ganjam district of Odisha, India. The edicts are engraved in Brahmi script and Prakrit language and date back to around 250 BCE.\u003c/li\u003e\r\n\t\u003cli\u003eThe edicts contain information about administrative policies based on Ashoka\u0026rsquo;s humanitarian considerations.\u003c/li\u003e\r\n\t\u003cli\u003eThe edicts are located on a central rock in the compound, along with Separate Edicts 1\u0026amp;2. The configuration is similar to the nearby Dhauli Edicts of Ashoka.\u003c/li\u003e\r\n\t\u003cli\u003eJaugada is an ancient fort that served as a Mauryan fortified capital of the Kalinga province. In Odia language, Jau means Lac, and Gada means fort.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kalsi rock edicts :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are a set of 14 inscriptions by Emperor Ashoka, written in Pali and Brahmi on a solid quartz rock in north-western India. The edicts are located near the Greco-Bactrian Kingdom and its capital, Ai Khanoum. The main face of the rock contains the first 12 edicts and part of the 13th.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to the Archaeological Survey of India (ASI), the edicts reflect Ashoka\u0026rsquo;s commitment to non-violence, his concern for the welfare of his subjects, and his humane approach to internal administration. The Kalsi rock edict of Ashoka mentions the Greek kings Antiochus and Ai-Khanoum, which may have influenced Ashoka\u0026rsquo;s writings.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44000", "image_check": "0", "image_link_1": "", "image_link_2": "", "imag d Ghazni in the 11th century.\u003c/li\u003e\r\n\t\u003cli\u003eA description of the temple by Al-Biruni, an Arab traveller, was so glowing that it prompted a visit in 1024 by a most unwelcome tourist \u0026ndash; the legendary looter Mahmud of Ghazni from Afghanistan.\u003c/li\u003e\r\n\t\u003cli\u003eThe modern temple was reconstructed with the resolve of Sardar Patel who visited the ruins of Somnath temple on November 13 1947. The then-President of India, Dr. Rajendra Prasad, did the Pran-Pratistha at the existing temple on 11 May 1951.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eList of 12 Jyotirling Temples in India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Somnath Temple, Gujarat\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Mallikarjuna Temple, Andhra Pradesh\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Mahakaleshwar Temple, Madhya Pradesh\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Omkareshwar Temple and Mamleshwar Temple, Madhya Pradesh\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Baidyanath Dham, Jharkhand\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Bhimashankar Temple, Maharashtra\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Ramanathaswamy Temple, Rameshwaram\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Nageshwar Temple, Gujarat\u003c/p\u003e\r\n\r\n\u003cp\u003e9. Kashi Vishwanath Temple, Uttar pradesh\u003c/p\u003e\r\n\r\n\u003cp\u003e10. Trimbakeshwar Temple, Maharashtra\u003c/p\u003e\r\n\r\n\u003cp\u003e11. Kedarnath Temple, Uttarakhand\u003c/p\u003e\r\n\r\n\u003cp\u003e12. Grishneshwar Temple, Maharashtra\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44001", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003 ": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe word \u0026ldquo;stupa\u0026rdquo; is Sanskrit for \u0026ldquo;heap\u0026rdquo; or \u0026ldquo;pile\u0026rdquo;. Stupas are believed to have originated as pre-Buddhist burial mounds, where \u015bramanas were buried in a seated position called chaitya.\u003c/li\u003e\r\n\t\u003cli\u003eStupas are a significant form of Buddhist architecture. They are generally considered to be sepulchral monuments, which are places of burial or receptacles for religious objects. At their simplest, stupas are dirt burial mounds faced with stone.\u003c/li\u003e\r\n\t\u003cli\u003eThe oldest Buddhist stupa is the \u0026ldquo;Great Stupa\u0026rdquo; at Sanchi, which was commissioned in the 3rd century BCE by the emperor Ashoka the Great of the Maurya Empire.\u003c/li\u003e\r\n\t\u003cli\u003eStupas are dome-shaped structures that contain relics and serve as places of worship and meditation. The relics are typically associated with the Buddha or other major figures in Buddhism, and may include the bodily remains of Buddhist monks or items they used.\u003c/li\u003e\r\n\t\u003cli\u003eStupas are monuments that house sacred relics, such as the remains of Buddhist monks or items they used. The hemispherical shape of the stupa is thought to have come from pre-Buddhist burial mounds in India. The shape of the stupa is also associated with the Buddhist goal of release from the cycles of suffering and rebirth.\u003c/li\u003e\r\n\t\u003cli\u003eStupas are also used as a focal point for Buddhist devotion and meditation. They represent various elements, including the Buddha, the path to Enlightenment, a mountain, and the universe.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBuddhist stupas can be divided into five types based on their function:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Relic stupas: \u003c/strong\u003eContain the remains of Buddha, his disciples, and lay saints\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Object stupas: \u003c/strong\u003eContain objects that belonged to or were used by Buddha and his disciples, such as robes and begging bowls\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Commemorative stupas:\u003c/strong\u003e Commem orate major events in the lives of Bud dha and his disciples\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Symbolic stupas:\u003c/strong\u003e Represent aspects of Buddhist teachings\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Votive stupas: \u003c/strong\u003eSmall temples that have a votive offering function\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44002", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/st const QUIZ_TITLE = "Art \u0026 Culture PYQ Test 2";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
