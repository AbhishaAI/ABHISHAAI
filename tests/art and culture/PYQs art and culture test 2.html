/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following Bhakti Saints............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Dadu Dayal\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Guru Nanak\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Tyagaraja\u003c/p\u003e\r\n\r\n\u003cp\u003eWho among the above was/were preaching when the Lodi dynasty fell and Babur took over?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eGuru Nanak Dev was born in 1469. Babur defeated Ibrahim Lodi in 1526.\u003c/li\u003e\r\n\t\u003cli\u003eWhen Babur took over and established the Mughal dynasty Nanak was travelling to different parts of India and preaching Sikhism.\u003c/li\u003e\r\n\t\u003cli\u003eBabur once met Guru Nanak during one of his travel.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome important Bhakti saints: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRamanuja :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA well-known Bhakti saint from Tamil Nadu in the 11th century. He is known for his \u0026ldquo;Vishishtadvaita\u0026rdquo; philosophy and preached about salvation through devotion to Lord Vishnu.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eVallabhacharya :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA prominent Bhakti saint and philosopher. His devotees built a temple in Champaranya, where he was born, which is now a pilgrimage site.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGuru Nanak :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA highly influential Bhakti saint who incorporated ideas from both Hinduism and Islam. His teachings include the importance of reciting God\u0026rsquo;s name with devotion and the need for a Guru for salvation.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eEknath :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA popular and important Bhakti saint from Maharashtra who lived in the 16th century. He was also a prolific writer and social reformer.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRamananda :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA 15th century Bhakti saint from Prayag who is considered the first great Bhakti saint of North India. He believed in two principles: perfect love for God and human brotherhood.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDadu Dayal :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA well-known Bhakti saint from the Hindu tradition of North India. His compositions aimed to bring Hinduism and Islam closer together.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMirabai :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA popular Bhakti saint and devotee of Lord Krishna. She was a medieval Hindu spiritual poet from a royal family in Rajasthan. Her hymns dedicated to Lord Krishna are still popular and revered in north India.\u003c/li\u003e\r\n\t\u003cli\u003eBhakti saints often expressed their sentiments through song, poetry, and music, and often attracted thousands of followers. They largely rejected the hereditary caste system and its emphasis on prescribed ritual. Instead, they stressed the need for morality, purity of heart, and an attitude of selfless service.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43947", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyl 3e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following describes best the concept of Nirvana in Buddhism?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe concept of Nirvana in Buddhism is best described as the extinction of the flame of desire.\u003c/li\u003e\r\n\t\u003cli\u003eNirvana is the earliest and most common term used to describe the goal of the Buddhist path. It means the extinction of craving, or the extinction of the fires of attachment, aversion, and ignorance.\u003c/li\u003e\r\n\t\u003cli\u003eIn the Buddhist tradition, Nirvana is described as the extinguishing of the fires that cause rebirths and associated suffering.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Buddhist texts identify these \u0026ldquo;three fires\u0026rdquo; or \u0026ldquo;three poisons\u0026rdquo; as:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Raga: Greed, sensuality\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Dvesha: Aversion, hate\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Avidya or moha: Ignorance, delusion\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eNirvana is not a place but an experience and could be attained in this life.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;The four stages of achieving Nirvana are:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Stream enterer,\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Once returner,\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Non returner,\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Fully enlightened.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe stages are determined by how many of the 10 fetters (sanyojanas) the practitioner has eradicated.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bodhi Tree is a Buddhist symbol of enlightenment. It represents the place where the Buddha attained Nirvana or Enlightenment. The original Bodhi tree is a fig that stands in Bhod Gaya, India, and is a sacred pilgrimage site.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43950", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\ ion_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to Jain doctrines, the surest way to annihilate karma is to practice penance. Penance is a means to purify the soul and eradicate karmas. It involves self-discipline, self-control, and self-mortification.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to Jain teachings, the cycle of birth and rebirth is shaped through karma.\u003c/li\u003e\r\n\t\u003cli\u003eAsceticism and penance are required to free oneself from the cycle of karma. This can be achieved only by renouncing the world; therefore, monastic existence is a necessary condition of salvation.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to Jainism, souls exist in all living things, including plants, animals, and humans. Jain doctrine also states that souls exist in non-living entities, such as rocks, water, and even the tiniest particles.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to Jainism, karma is a subtle matter that infiltrates the soul and obscures its natural qualities. It\u0026rsquo;s also thought of as a kind of pollution that taints the soul with various colors.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43951", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: br  "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the context of the cultural history of India, a pose in dance and dramatics called \u0026lsquo;Tribhanga\u0026rsquo; has been a favourite of Indian artists from ancient times till today.\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich one of the following statements best describes this pose?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eTribhanga is a standing body position in traditional Indian art and classical dance forms. It is a three-fold bending of the body, with the torso deflecting in one direction and the head and hips deflecting in the opposite direction. The body is oppositely curved at the waist and neck, giving it a gentle \u0026ldquo;S\u0026rdquo; shape.\u003c/li\u003e\r\n\t\u003cli\u003eThe word Tribhanga comes from Sanskrit, with tri meaning \u0026ldquo;three\u0026rdquo; and bhanga meaning \u0026ldquo;attitude\u0026rdquo; or \u0026ldquo;posture\u0026rdquo;. It is considered the most graceful and sensual of the Odissi positions.\u003c/li\u003e\r\n\t\u003cli\u003eTribhanga is also used in some traditional Indian sculptures. It has been a favorite of Indian artists from ancient times.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43952", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width dth:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following historical places: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Ajanta Caves\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Lepakshi Temple\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Sanchi Stupa\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above places is/are also known for mural paintings?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMural Paintings :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe mural is the only form of painting that is truly three-dimensional since it modifies and partakes a given space.\u003c/li\u003e\r\n\t\u003cli\u003eMural paintings are applied on drywall with the major use of egg, yolk, oil, etc.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eNotable examples :\u003c/strong\u003e Ajanta Caves, Bagh Caves, Sittanavasal Caves, Armamalai Cave (Tamil Nadu), Kailasa temple (Ellora Caves).\u003c/li\u003e\r\n\t\u003cli\u003eMurals from this period depict mainly religious themes of Buddhist, Jain, and Hindu.\u003c/li\u003e\r\n\t\u003cli\u003eDepict a large number of incidents from the life of the Buddha (Jataka Tales).\u003c/li\u003e\r\n\t\u003cli\u003eExclusively Buddhist, excepting decorative patterns on the ceilings and the pillars.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Ajanta Caves :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are a series of 29 rock-cut Buddhist caves in the Sahyadri ranges of Maharashtra,India.\u003c/li\u003e\r\n\t\u003cli\u003eThe caves were excavated from around 200 BC to 650 AD and are considered to be among the earliest Buddhist architectures. The caves are located on the Waghora river, near Aurangabad, in a horseshoe-shaped bend of rock surface that overlooks the river. The valley\u0026rsquo;s location provided a calm environment for Buddhist monks during the rainy seasons.\u003c/li\u003e\r\n\t\u003cli\u003eThe caves are known for their carvings and sculptures that depict the life of Buddha, as well as their frescoes. The caves are considered to be the beginning of classical Indian art, and are an example of ancient Buddhist rock-cut architecture.\u003c/li\u003e\r\n\t\u003cli\u003eThe caves are divided into two phases and are numbered thirty in total. Four of the caves were used as prayer halls, and 25 were used as residential caves.\u003c/li\u003e\r\n\t\u003cli\u003eThe Ajanta Caves were discovered in 1819 by British Army officers hunting tigers in the gorge of the Waghora River.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eLepakshi Temple:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is located in Andhra Pradesh, India, is a 16th-century temple dedicated to Lord Shiva. It is known for its intricate carvings and mural paintings.\u003c/li\u003e\r\n\t\u003cli\u003eThe mural paintings at Lepakshi Temple depict scenes from Hindu mythology and showcase the exquisite craftsmanship of the Vijayanagara Empire. These paintings are characterized by vibrant colors, intricate detailing, and a unique blend of South Indian and Vijayanagara art styles.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSanchi Stupa :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is located in Madhya Pradesh, India, is one of the oldest stone structures in India and is a UNESCO World Heritage Site. It was built by Emperor Ashoka in the 3rd century BCE to enshrine the relics of Lord Buddha. While Sanchi Stupa is primarily known for its architectural significance and Buddhist symbolism, it does not have mural paintings.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43953", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\ 1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Saka era is believed to have been founded by King Kanishka of the Kushan dynasty in 78 AD.\u003c/li\u003e\r\n\t\u003cli\u003eThe Saka calendar has 12 months, each with 30\u0026ndash;31 days, and 365 days in total. The calendar is based on a luni solar reckoning of time and follows the tropical Zodiac signs. The first month of the Saka Samvat is Chaitra, which begins on March 22.During a leap year, Chaitra begins on March 21.\u003c/li\u003e\r\n\t\u003cli\u003eThe Saka calendar is similar to the Gregorian calendar, which also has 12 months and 365 days.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian National Calendar, based on the Saka era, was adopted by the Parliament of India in 1957. The calendar starts from the month of Chaitra, which falls on March 22 each year, except for leap years, when it falls on March 21. The calendar has a duration of 365 days.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe months of the Saka calendar are:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Chaitra: \u003c/strong\u003eMarch 21\u0026ndash;April 20\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Vaishakha:\u003c/strong\u003e April 21\u0026ndash;May 21\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Jyeshtha: \u003c/strong\u003eMay 22\u0026ndash;June 21\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Ashadha:\u003c/strong\u003e June 22\u0026ndash;July 22\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Shravana: \u003c/strong\u003eJuly 23\u0026ndash;August 22\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6 rvived for centuries by performing music and receiving patronage from wealthy merchants. Their name means \u0026ldquo;those who ask for alms\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePietra dura :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a decorative art technique that involves inlaying cut and polished stones to create images. It\u0026rsquo;s also known as parchin kari in the Indian subcontinent.\u003c/li\u003e\r\n\t\u003cli\u003eShah Jahan introduced the technique during his reign, which is known as the Golden Age of Mughal Architecture. The Taj Mahal, finished in 1643, is a famous example of pietra dura. Other examples include the Agra Fort and the Red Fort in Delhi.\u003c/li\u003e\r\n\t\u003cli\u003eThe technique involves cutting, fitting, and polishing semi-precious stones like agate, jasper, lapislazuli, and jade. The stones are then placed in depressions carved into marble or sandstone to create ornate patterns. The final step is washing, scrubbing, and polishing to give the stones a pristine look.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43958", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow- 03c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Tamil,\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Telugu,\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Sanskrit,\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Kannada,\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Malayalam,\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Odia.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThese languages are considered classical because they have a rich literary tradition, a vast amount of ancient literature, and an independent literary tradition. Sanskrit is the oldest of the classical languages.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe criteria for declaring a language as classical in India are based on:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Antiquity\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Rich literary tradition\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Historical influence\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Linguistic distinctiveness\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Active cultural practice\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe recognition aims to honor and preserve the invaluable linguistic and cultural heritage of a language.\u003c/li\u003e\r\n\t\u003cli\u003eThe six classical languages are listed in the Eighth Schedule of the Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43959", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n ndian philosophy are:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Vaishesika,\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Nyaya,\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Samkhya,\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Yoga,\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Purva Mimansa,\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Vedanta or Uttara Mimansa.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThese systems are also known as the six orthodox schools of Hindu philosophy, or shatdarshanas. They are considered \u0101stika philosophical traditions, which means they accept the Vedas as an important source of knowledge.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe six systems are said to have been founded by the following sages:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Vaishesika:\u003c/strong\u003e Konada\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Nyaya: \u003c/strong\u003eGotama\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Samkhya:\u003c/strong\u003e Kapila\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Yoga: \u003c/strong\u003ePatanjali\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Purva Mimansa:\u003c/strong\u003e Jaimini\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Vedanta:\u003c/strong\u003e Vyasa\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThese philosophies still guide scholarly discourse in India. Most of these schools of thought believe in the theory of Karma and rebirth.\u003c/li\u003e\r\n\t\u003cli\u003eThe pair that does not form part of the six systems of Indian philosophy is Lokayata and Kapalika.\u003c/li\u003e\r\n\t\u003cli\u003eLokayata, also known as Charvaka, is a materialist school of philosophy that rejects the authority of the Vedas. It holds that only matter exists and that consciousness is a byproduct of matter.\u003c/li\u003e\r\n\t\u003cli\u003eKapalika is a tantric school of philosophy that focuses on the worship of the god Shiva. It is known for its extreme practices, such as the use of human skills in rituals.\u003c/li\u003e\r\n\t\u003cli\u003eSince both Lokayata and Kapalika reject the authority of the Vedas, they are not considered part of the six orthodox systems of Indian philosophy.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43960", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKatha Upanishad\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eChandogya Upanishad\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAitareya Upanishad\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMundaka Upanishad\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe national motto of India, \u0026lsquo;Satyameva Jayate\u0026rsquo; inscribed below the Emblem of India is taken from...........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe national motto of India, \u0026ldquo;Satyameva Jayate\u0026rdquo;, is taken from the Mundaka Upanishad. The motto is inscribed below the abacus in the national emblem of India in Devanagari script. It means \u0026ldquo;Truth Alone Triumphs\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe Mundaka Upanishad is a poetic verse style upanishad with 64 verses. It is listed as number 5 in the muktika canon of 108 upanishads of Hinduism. The Mundaka Upanishad is an ancient Sanskrit Vedic text, embedded inside Atharva Veda.\u003c/li\u003e\r\n\t\u003cli\u003eIndia adopted \u0026ldquo;Satyameva Jayate\u0026rdquo; as its national motto on January 26, 1950, the day India became a republic. Freedom fighter Madan Mohan Malaviya is credited with popularizing the slogan.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Kathopanishad :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an ancient Hindu text written in Sanskrit. It is one of the mukhya Upanishads, which are part of the Vedas. The Kathopanishad is part of the last eight short sections of theKatha school of the Krishna Yajurveda. It is also known as K\u0101thaka Upanishad and is listed as number 3 in the Muktika canon of 108 Upanishads.\u003c/li\u003e\r\n\t\u003cli\u003eThe Kathopanishad is a mystical text that offers insights into the nature of life, death, and the eternal quest for knowledge. It is a narrative-style text that captivates readers with its timeless wisdom. The Kathopanishad begins with a katha, or story, of a young boy who is ready to face the Lord of Death in his quest for Truth. The main theme of one of the songs of Sri Swami Sivanandaji Maharaj is \u0026ldquo;Die to live\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Chandogya Upanishad :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Sanskrit religious text that is part of the Chandogya Brahmana of the Sama Veda of Hinduism. It is one of the oldest Upanishads, and is the second largest in size, after the Brhadaranyaka Upanishad.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chandogya Upanishad is a philosophical exposition on the relationship between the self (atman) and the universe (brahman). It is a representation of the ancient Indian school of philosophy, spirituality, and knowledge. The story of the Chandogya Upanishad tells of a father teaching his son about the ultimate truth of Hinduism.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Aitareya Upanishad :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Mukhya Upanishad associated with the Rigveda. It\u0026rsquo;s written by Aitareya Mahidasa and is made up of the fourth, fifth, and sixth chapters of the second book of Aitareya Aranyaka.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Aitareya Upanishad is a philosophy of the Vedic religion that includes topics such as:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The soul\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Creation\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Birth and rebirth\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The importance of food\u003c/p\u003e\r\n\r\n\u003cp\u003e5. The manifestation of the Brahman\u003c/p\u003e\r\n\r\n\u003cp\u003e6. The ultimate path for salvation\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Aitareya Upanishad also discusses three philosophical themes:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The world and man are creations of the Atman (Universal Self)\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Atman has three births\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Consciousness is the essence of Atman\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Aitareya Upanishad is famous for containing one of the most famous expressions of the Vedanta, \u0026ldquo;Prajnanam Brahma\u0026rdquo; (Knowledge is Brahman/god/ divine/holy).\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43961", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", " ption_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the famous Sattriya dance, consider the following statements:\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Sattriya is a combination of music, dance and drama.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It is a centuries-old living tradition of Vaishnavites of Assam.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. It is based on classical Ragas and Talas of devotional songs composed by Tulsidas, Kabir and Mirabai.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSattriya is a dance-drama performance art that originated in the 15th century in the Krishna-centered Vaishnavism monasteries of Assam. It was introduced by the Vaishnava saint and reformer of Assam, Mahapurusha Sankaradeva, as a medium for propagating the Vaishnava faith. In 2000, the Sangeet Natak Akademi recognized Sattriya as a classical dance.\u003c/li\u003e\r\n\t\u003cli\u003eSattriya is based on devotional songs composed by Sankardeva. It consists of dhemali, drum playing, known as gayan bayan, where several men play drums, in various talas (rhythms) and also use hand gestures. The themes performed are mostly on Radha Krishna and other myths.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43962", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{ } img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGarba :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a dance that originated in the Indian state of Gujarat. The word \u0026ldquo;garba\u0026rdquo; is derived from the Sanskrit term Garbha.\u003c/li\u003e\r\n\t\u003cli\u003eGarba is a community circle dance that is performed at festivals and other special occasions in Gujarat. The traditions of the Garba dance date back to at least the 15th century and are a part of the worship of the goddess Devi.\u003c/li\u003e\r\n\t\u003cli\u003eGarba is often performed during the Navratri (Dussehra) festival. During the dance, both men and women wear colorful costumes and jewelry. Many traditional garbas are performed around a centrally lit lamp or a picture or statue of the Hindu goddess Durga.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMohiniyattam :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a classical solo dance form that originated in the state of Kerala, India. The name translates to \u0026ldquo;the dance of Mohini\u0026rdquo;, the celestial enchantress from Hindu mythology.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe dance is characterized by:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Graceful, swaying movements\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Soft footwork\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Important hand gestures\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Subtle facial expressions\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMohiniyattam is one of two classical dance forms that originated in Kerala, the other being Kathakali. The dance\u0026rsquo;s origin and popularity are closely linked to the great Tamil dance master Vadivelu, one of the Thanjavur quartets.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eYakshagana :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a traditional Indian dance-drama and theater form that is most strongly associated with the state of Karnataka. It is a unique combination of dance, music, song, scholarly dialogues, and colorful costumes.\u003c/li\u003e\r\n\t\u003cli\u003eYakshagana is a temple art form that depicts mythological stories and Puranas. It is performed with massive headgears, elaborate facial make-up, and vibrant costumes and ornaments.\u003c/li\u003e\r\n\t\u003cli\u003eYakshagana is traditionally presented from dusk to dawn. The plot of the hexagonal dance revolves around the Hindu epics Ramana and navarata.\u003c/li\u003e\r\n\t\u003cli\u003eYakshagana is usually recited in Kannada, but it is also performed in Malayalam and Tulu. The accompanying orchestra includes percussion instruments like chenda, maddalam, jagatta, or chengila (cymbals) and chakratala or elathalam (small cymbals).\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43963", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyl e among the following was made earliest?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Rock-cut Elephant at Dhauli :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a sculpture of an elephant carved from a large boulder in Dhauli, Odisha. It isconsidered one of the earliest examples of rock-cut architecture in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe sculpture is believed to have been created during the reign of Ashoka (272 231 BC). It is notable for its naturalistic style and is one of the oldest monuments with sculpted elephant faces facing east.\u003c/li\u003e\r\n\t\u003cli\u003eThe sculpture was discovered in 1837 by Markham Kittoe, a British colonial officer. The significance of the\u003c/li\u003e\r\n\t\u003cli\u003eDhauli elephant has never been explained to some. Dhauli is a small hill near the capital city of Odisha, Bhubaneswar. It is home to many historical events, including the Shanti Stupa and the rock edicts of the Indian emperor Ashoka. The Dhauli hill is also presumed to be the area where the Kalinga War was fought.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Lingaraja Temple :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Hindu temple in Bhubaneswar, Odisha, India. It\u0026rsquo;s one of the oldest and largest temples in the city, and is considered a masterpiece of the Kalinga style of architecture.\u003c/li\u003e\r\n\t\u003cli\u003eThe temple is dedicated to Shiva, who is worshipped as Harihara, a combination of Vishnu and Shiva. It was built in the 11th century by King Lalatendu Keshari, and is believed to be around 1,000 years old. T he temple is built in the Kalinga tradition using red sandstone and laterite.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMahabalipuram :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a coastal resort town in Tamil Nadu, India, has many rock-cut monuments. The Group of Monuments at Mahabalipuram is a UNESCO World Heritage site.\u003c/li\u003e\r\n\t\u003cli\u003eThe Pallava kings carved these monuments into rock along the Coromandel coast in the 7th and 8th centuries.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Varaha panel :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a sculpted panel in the Udayagiri Caves in Madhya Pradesh, India. The panel is in Cave 5, a shallow niche that\u0026rsquo;s more like a cave. It\u0026rsquo;s a depiction of Vishnu\u0026rsquo;s Varaha avatar, the third of Vishnu\u0026rsquo;s 10 incarnations, rescuing Earth from a demon.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43967", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}  : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eKalamkari painting is a type of hand painted cotton textile that originated in the Indian state of Andhra Pradesh. The name comes from the Persian words kalam, which means pen, and kari, which means craftsmanship.\u003c/li\u003e\r\n\t\u003cli\u003eKalamkari is an ancient style of painting that involves 23 steps and only uses natural dyes. The colors are made from natural dyes and the pens are made from pointed bamboo. The colors used are earthy tones of reds, blues, greens, yellows, and browns. Women are depicted in shades of yellow, gods in blue, and demons in red and green.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThere are two distinctive styles of Kalamkari art in India:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003col\u003e\r\n\t\u003cli\u003eSrikalahasti style and\u003c/li\u003e\r\n\t\u003cli\u003eMachilipatnam style.\u003c/li\u003e\r\n\u003c/ol\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn recent years, there has been a revival of interest in Kalamkari paintings, with artists experimenting with new techniques and designs.\u003c/li\u003e\r\n\t\u003cli\u003eSome signs of an authentic Kalamkari saree include crooked lines, smudged paint, and small stains. The smell of milk is also a prominent factor as it is involved in the process of making Kalamkari sarees.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43968", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u0 he Gond and Korku tribes of Madhya Pradesh\u0026rsquo;s Betul and Harda districts celebrate Hari Jiroti, a month-long festival of greenery, during which they plant saplings of fruit-bearing trees. The festival coincides with their traditional festivals of Hari and Jiroti.\u003c/li\u003e\r\n\t\u003cli\u003ePlanting fruit-bearing trees is important for ecological balance and for the economic and nutritional benefit of the communities.\u003c/li\u003e\r\n\t\u003cli\u003eIndia also celebrates Van Mahotsav, or \u0026ldquo;Forest festival\u0026rdquo;, an annual one-week tree planting festival that takes place in the first week of July. Van Mahotsav originated in July 1947 after a successful tree plantation drive in Delhi.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eFor instance : \u003c/strong\u003eBhutia and Lepcha communities in Sikkim plant trees to prevent soil erosion and preserve the fragile ecosystem of the region.\u003c/li\u003e\r\n\t\u003cli\u003eIrula and Toda tribes in Tamil Nadu practice traditional farming methods that involve cultivating indigenous crops, using natural fertilizers, and conserving water resources.\u003c/li\u003e\r\n\t\u003cli\u003eSahariya and Agariya communities in Rajasthan and Gujarat respectively practice rainwater harvesting techniques to sustain agriculture and mitigate the impact of droughts.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43971", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\ idth:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRatnavali\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following books of ancient India has the love story of the son of the founder of the Shunga dynasty? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2016)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSvapnavasavadattam (Sanskrit: \u0026ntilde;d\u0026szlig;ZdmgdX\u0026Icirc;m\u0026aring;, Svapnav\u0101savadattam) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a six-act Sanskrit play written by the ancient Indian poet Bh\u0101sa. The play\u0026rsquo;s title translates to The Dream of Vasavadatta in English.\u003c/li\u003e\r\n\t\u003cli\u003eThe play\u0026rsquo;s plot is based on the romantic narrative of King Udayana of Vatsa and Vasavadatta, the daughter of the ruler of Avanti.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMalavikagnimitra :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Sanskrit play written by Kalidasa in the 5th century CE. The title translates to \u0026ldquo;Malavika and Agnimitra\u0026rdquo;. The play is about the love story of Agnimitra, the Shunga Emperor, and the handmaiden of his chief queen. The play is set in a harem and has a playful and comical tone.\u003c/li\u003e\r\n\t\u003cli\u003eThe play is based on some events from the reign of Pushyamitra Shunga, the founder of the Sunga dynasty. The play also describes the Rajsuya sacrifice performed by Pushyamitra Shunga.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMeghadoota :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a lyric poem written by K\u0101lid\u0101sa, a Sanskrit poet. The poem is about a yaksa, a benevolent nature spirit, who is exiled by his master to a remote region for a year. The yaksa asks a cloud to deliver a message of love to his wife in the Himalayan city of Alaka.\u003c/li\u003e\r\n\t\u003cli\u003eThe poem explores the theme of love as cosmic love, not just as human love and separation. The second part of the poem, known as the Uttaramegha, describes Alaka, the condition of the cloud\u0026rsquo;s wife, and the message itself.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRatnavali (Precious Garland) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a Sanskrit drama about a beautiful princess named Ratnavali, and a great king named Udayana. It is attributed to the Indian emperor Harsha (606\u0026ndash;648).\u003c/li\u003e\r\n\t\u003cli\u003eIt is a Natika in four acts. One of the first textual references to the celebration of Holi, the festival of Colours have been found in this text.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43972", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u0 l figure of the Buddha Amitabha atop his head.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43976", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflo dth:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the religious history of India, consider the following statements:\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2017)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Sautrantika and Sammitiya were the sects of Jainism.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Sarvastivadin held that the constituents of phenomena were not wholly momentary, but existed forever in a latent form.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSautrantika and Sammitiya are Buddhist philosophical schools, not Jainism.\u003c/li\u003e\r\n\t\u003cli\u003eThe word \u0026ldquo;Sautrantika\u0026rdquo; means \u0026ldquo;a follower of the sutras\u0026rdquo;. Sautrantika is a school of Buddhism that developed within the Sarvastivada sect. The name Sautr\u0101ntika literally means \u0026ldquo;the conclusions of the sutras\u0026rdquo;. The 3rd century Indian Kum\u0101ral\u0101ta, a native of Taxila, is considered the founder of the Sautr\u0101ntika school.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;Jainism has been divided into two major sects:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Svetambara and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Digambara.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe division occurred in 298 BC due to a famine in Magadh. A group led by Bhadrabahu and Chandragupta Maurya moved to South India (Shravan Belgola).\u003c/li\u003e\r\n\t\u003cli\u003eSarvastivadin Buddhist school of thought believed that the constituents of phenomena existed forever in a latent form.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sarvastivadin school believed that dharmas, or phenomena, existed at all times: past, present, and future. They considered everything empirical to be impermanent, but believed that dharma factors were realities that existed eternally. The Sarvastivadins believed that dharmas functioned momentarily, producing the empirical phenomena of the world, which is illusory.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sarvastivadin school was one of the most influential Buddhist monastic groups, flourishing throughout North India and Central Asia until the seventh century. It was the most influential school of Hinayana in India, and had an important influence on Mahayana thought as well.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43978", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"te verted to Islam. The festival is also dedicated to Lord Jhulelal, the water deity and preferred deity of the Sindhi people.\u003c/li\u003e\r\n\t\u003cli\u003eDuring the festival, Sindhi Hindus fast for 40 days to observe penance. They also offer an Akho, a mixture of raw rice, green cardamoms, sugar, and a bit of turmeric, with Palav/Pryaer every day by visiting a water body.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Nanda Raj Jaat Yatra :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a festival celebrated by the Garhwali and Kumauni people in the Chamoli district of Uttarakhand. The festival is held once every 12 years and lasts for three weeks.\u003c/li\u003e\r\n\t\u003cli\u003eThe yatra begins at Kurur village, near Nandprayag, and ends at Homkund. The yatra is about 280 kilometers long and includes the villages of Nauti and Karnprayag. The yatra is accompanied by the chanting of \u0026ldquo;Jai Maa Nanda Devi\u0026rdquo; and traditional folk songs. The yatra ends with a grand yagna and other religious ceremonies.\u003c/li\u003e\r\n\t\u003cli\u003eThe festival honors the Great Nanda Devi, the chief deity of the Garhwal and Kumaon divisions of Uttarakhand.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePandharpur Wari or (Vari) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an annual pilgrimage to Pandharpur\u003c/li\u003e\r\n\t\u003cli\u003eThe seat of the god Vithoba in Maharashtra, in honour of the deity. Palakhi is carrying the paduka (foot prints) of various saints most notably Dnyaneshwar and Tukaram from the Warkari sect are taken from their respective shrines to Pandharpur.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": " a Kritis are devotional songs in praise of Lord Krishna.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Tyagaraja created several new ragas.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Annamacharya and Tyagaraja are contemporaries.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Annamacharya Keertanas are devotional songs in praise of Lord Venkateshwara.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct? (2018)\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "312", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMost of Tyagaraja\u0026rsquo;s compositions are devotional songs, but they are mostly dedicated to Lord Rama, not Lord Krishna.\u003c/li\u003e\r\n\t\u003cli\u003eTyagaraja was a composer of devotional songs, or kritis, in the 18th and 19th centuries. He is known for creating several new ragas, including Chintamani, Gowrimanohari, and Varali.\u003c/li\u003e\r\n\t\u003cli\u003eTyagaraja was an ardent devotee of Lord Rama. In his honor, he wrote numerous musical operas, and about twenty four thousand songs. Scholars are skeptical about numbers like these, as there is no biographical evidence to support such claims.\u003c/li\u003e\r\n\t\u003cli\u003eTyagaraja (c. 1767\u0026ndash;1847 CE) is known for creating several new ragas, including Chintamani, Gowrimanohari, and Varali. He is also known for creating musical innovations, such as using a structured variation of musical lines within a performance.\u003c/li\u003e\r\n\t\u003cli\u003eAnnamacharya lived from 1408\u0026ndash;1503, wh ndscapes.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThus, the elegant portrayal and emotional depth of \u0026ldquo;Bani Thani\u0026rdquo; \u0026mdash; often called the \u0026ldquo;Mona Lisa of India\u0026rdquo; \u0026mdash; are distinctive of the Kishangarh School, making option the correct answer\u003c/strong\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43983", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_3": by a drum or dholak. The art form tells the stories of the heroic battle of Khonjom, which took place in April 1891 between the people of Manipur and the British empire.\u003c/li\u003e\r\n\t\u003cli\u003eThe Khongjom Parba is a significant part of Manipur\u0026rsquo;s intangible heritage. It emerged after the Anglo-Manipuri War of 1891, and has been around for 122 years. The ballad praises the heroes of the war who sacrificed their lives for Manipur.\u003c/li\u003e\r\n\t\u003cli\u003eKhongjom Parba artists are expected to be skilled Dhalak players and well-versed in narrative craft.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThang-Ta :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a martial arts dance from Manipur, India. The word \u0026ldquo;thang\u0026rdquo; means sword and \u0026ldquo;ta\u0026rdquo; means spear in the Manipuri language. The spear can be used in its non-missile form while in close or thrown from afar.\u003c/li\u003e\r\n\t\u003cli\u003eThang-Ta is a weapon-based Indian martial art created by the Meitei of Manipur. It has a connection to certain war-dances, such as thangkairol (sword dance) and khosarol (spear dance). Martial artists used to perform many ritualistic dances in Manipur, such as the spear dance for funerals or the sacred thengou dance.\u003c/li\u003e\r\n\t\u003cli\u003eThang-Ta survived during the period of Manipur\u0026rsquo;s integration with the Indian Union in 1949, where the art was shown in festivals and performance platforms abroad.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43984", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {ma css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Sthanakvasi sect belongs to Jainism.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sthanakvasi sect is a modern subsect of the Shvetambara sect of Jainism. The name Sthanakvasi comes from the sect\u0026rsquo;s preference for performing religious duties at a secular place, such as a monks\u0026rsquo; meetinghouse, rather than at a temple. The Sthanakvasi sect rejects idolatry and believes that the soul is \u0026ldquo;without form\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sthanakvasi sect is also sometimes called the Dhundhia, which is Sanskrit for \u0026ldquo;searchers\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "415", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "43985", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAvalokiteshvara\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\
