, "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Parliament cannot enlarge the jurisdiction of the Supreme Court of India as its jurisdiction is limited to that conferred by the Constitution\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The officers and servants of the Supreme Court and High Courts are appointed by the concerned Chief Justice and the administrative expenses are charged on the Consolidated Fund of India.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eStatement 1 claims that Parliament cannot enlarge the jurisdiction of the Supreme Court as its jurisdiction is limited to that conferred by the Constitution. This statement is incorrect. Article 138 of the Indian Constitution provides that Parliament may, by law, extend the jurisdiction of the Supreme Court.\u003c/li\u003e\r\n\t\u003cli\u003eStatement 2 states that the officers and servants of the Supreme Court and High Courts are appointed by the concerned Chief Justice and the administrative expenses are charged on the Consolidated Fund of India. This statement is correct.\u003c/li\u003e\r\n\t\u003cli\u003eAs per Article 146 for the Supreme Court and Article 229 for High Courts of the Constitution, the Chief Justice has the power to appoint officers and servants of the court. Also, their administrative expenses are indeed charged on the Consolidated Fund of India.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44852", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Part IX of the Constitution of India contains provisions for Panchayats and was inserted by the Constitution (73rd Amendment) Act, 1992\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Part IX A of the Constitution of India contains provisions for municipalities and the Article 243 Q envisages two types of municipalities Municipal Council and a Municipal Corporation for every state\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe 73rd Constitutional Amendment Act, 1992 came into force on 24th April 1993 and added Part IX (Articles 243 to 243-O) to the Constitution. This part deals exclusively with Panchayati Raj Institutions (PRIs) in rural areas.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIt gave constitutional status to the Panchayati Raj system and provided for:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThree-tier structure \u0026mdash; Gram Panchayat, Panchayat Samiti, and Zila Parishad.\u003c/li\u003e\r\n\t\u003cli\u003eRegular elections every 5 years.\u003c/li\u003e\r\n\t\u003cli\u003eReservation of seats for SCs, STs, and women.\u003c/li\u003e\r\n\t\u003cli\u003eState Election Commission\u003c/li\u003e\r\n\t\u003cli\u003eState Finance Commission.\u003c/li\u003e\r\n\t\u003cli\u003eHence, Statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eWhile it is true that Part IX-A of the Constitution (Articles 243P to 243ZG) deals with Municipalities, the second part of the statement is wrong because Article 243Q actually provides for three types of municipalities, not two.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAccording to Article 243Q(1):\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Nagar Panchayat \u0026mdash; for a transitional area (from rural to urban)\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Municipal Council \u0026mdash; for a smaller urban area\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Municipal Corporation \u0026mdash; for a larger urban area.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eTherefore, there are three types of municipalities, not two as stated in the question. Also, the Constitution does not say there must be one of each type \u0026quot;for every state\u0026quot; \u0026mdash; their establishment depends on the population and local needs, as decided by the State Legislature. Hence, Statement 2 is incorrect. Thus, the correct answer is (A) Only 1.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44853", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} im /style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Article 371A to 371J were inserted in the Constitution of India to meet regional demands of Nagaland, Assam, Manipur, Andhra Pradesh, Sikkim, Mizoram, Arunachal Pradesh and Goa.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Constitution of India and the United States of America can envisage a dual policy (The Union and the States) but a single citizenship.\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;A naturalized citizen of India can never be deprived of his citizenship.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticles 371A\u0026ndash;371J provide special provisions for certain states like Nagaland, Assam, Manipur, Andhra Pradesh, Sikkim, Mizoram, Arunachal Pradesh, Goa, and Karnataka to meet their regional and cultural demands. These articles were added at different times under Part XXI of the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eIndia has a dual polity (Union and States) but single citizenship for all Indians. The USA, however, has dual citizenship (both federal and state). Hence, it is wrong to say both have single citizenship.\u003c/li\u003e\r\n\t\u003cli\u003eA naturalized citizen of India can be deprived of citizenship under the Citizenship Act, 1955 if obtained by fraud, disloyalty, or certain crimes.\u003c/li\u003e\r\n\t\u003cli\u003eHence, the claim that he \u0026ldquo;can never lose citizenship\u0026rdquo; is false. Therefore, only Statement 1 is correct and the answer is (d) 1 only.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44854", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type ow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Constitution of India has 25 parts. World\u0026rsquo;s lengthiest written constitution had 395 articles in 22 parts and 8 schedules at the time of commencement. Now Constitution of India has 448 articles in 25 parts and 12 schedules.\u003c/li\u003e\r\n\t\u003cli\u003eThere are 101 amendments have been made in the Indian constitution upto 2016. Ninth schedule was added by the 1st Amendment (1951) to protect the laws included in it from judicial scrutiny on the ground of violation of fundamental rights.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, in 2007, the Supreme Court ruled that the laws included in this schedule after April 24, 1973, are now open to judicial review. The 10th Schedule to the Indian Constitution, that is popularly referred to as the \u0026lsquo;Anti-Defection Law\u0026rsquo; was inserted by the 1985 Amendment to the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eIn short, defection is an act by a member of a particular party of disowning his loyalty towards that particular party and pledging allegiance to another party.\u003c/li\u003e\r\n\t\u003cli\u003e11th Schedule of Indian Constitution was added in 1992 by the 73rd Constitution Amendment Act. This schedule contains 29 subjects. This schedule covers important topics such as Panchayat\u0026rsquo;s powers, rural development, poverty alleviation, market, roads and drinking water etc.\u003c/li\u003e\r\n\t\u003cli\u003eTwelfth Schedule of the Indian constitution contains the powers, authority and responsibilities of Municipalities. This schedule has 18 items. Twelfth Schedule was added by the 74th Amendment Act of 1992.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44855", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Disputes with mobile cellular companies\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Motor accident cases\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Pension cases\u003c/p\u003e\r\n\r\n\u003cp\u003eFor which of the above are Lok Adalats held?\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Lok Adalat (People\u0026rsquo;s Court) is an alternative dispute resolution mechanism established under the Legal Services Authorities Act, 1987. It is designed to provide speedy, inexpensive, and amicable settlement of disputes through compromise and mutual consent, outside the regular court system.\u003c/li\u003e\r\n\t\u003cli\u003eLok Adalats are organized regularly by the State Legal Services Authorities, District Legal Services Authorities, and other bodies to dispose of cases that can be settled without lengthy legal procedures. Consumer-related disputes such as billing issues, network complaints, or service deficiencies involving telecom and mobile companies can be taken up in Lok Adalats, provided both parties agree to settle the matter.\u003c/li\u003e\r\n\t\u003cli\u003eThese fall under consumer disputes, which Lok Adalats frequently handle as part of public utility services or consumer forums. \u003cstrong\u003eSo, statement 1 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eOne of the most common types of cases handled by Lok Adalats is Motor Accident Claims Tribunal (MACT) cases. These involve compensation claims for injuries or death caused by road accidents. Lok Adalats are empowered to settle these cases through mutual agreement between victims and insurance companies, ensuring faster and fairer compensation without delay in regular courts. \u003cstrong\u003eSo, statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eLok Adalats also handle service-related and pension disputes, especially those involving retired government employees awaiting benefits or arrears. Such cases, when not highly contentious and where legal issues are minor, can be amicably resolved through Lok Adalats to ensure quick relief to senior citizens. \u003cstrong\u003eHence, statement 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44856", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEmpowering the Centre to levy and appropriate service tax\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{over e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2006)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. There is no provision in the Constitution of India to encourage equal pay for equal work for both men and women.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The constitution of India does not define backward classes.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003csty important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements:\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2006)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Rajya Sabha alone has the power to declare that it would be in national interest for the Parliament to legislate with respect to a matter in the State List.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Resolution approving the Proclamation of Emergency are passed only by the Lok Sabha.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eUnder Article 249, the Rajya Sabha (Council of States) has a special power to enable the Parliament (Union) to make laws on matters in the State List if it declares it by a resolution. Such a resolution must be passed by a two-thirds majority of members present and voting in the Rajya Sabha.\u003c/li\u003e\r\n\t\u003cli\u003eOnce the Rajya Sabha passes this resolution, Parliament gets the power to legislate on that State subject for a period of one year, which can be renewed further. The Lok Sabha has no such power; it is exclusively vested in the Rajya Sabha. \u003cstrong\u003eThus, Statement 1 is correct.\u003c/strong\u003e The 2nd statement refers to Article 352 (National Emergency), Article 356 (President\u0026rsquo;s Rule), and Article 360 (Financial Emergency).\u003c/li\u003e\r\n\t\u003cli\u003eIn all these cases, the Proclamation of Emergency made by the President must be approved by both Houses of Parliament \u0026mdash; Lok Sabha and Rajya Sabha \u0026mdash; within a stipulated time (usually one month for National Emergency and two months for the others).\u003c/li\u003e\r\n\t\u003cli\u003eHence, it is not only the Lok Sabha, but both the Lok Sabha and the Rajya Sabha that must pass the resolution to approve an Emergency proclamation. \u003cstrong\u003eTherefore, Statement 2 is incorrect.\u0026nbsp;\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44862", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word; ption_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2006)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A person who has held office as a permanent Judge of a High Court cannot plead or act in any court or before any authority in India except the Supreme Court.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;A person is not qualified for appointment as a Judge of a High Court in India unless he has for at least five years held a judicial office in the territory of India\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFirst statement is incorrect.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe constitution says that once a high court judge has retired, he cannot practice law in any court or before any authority in India except the Supreme Court and the other High Courts. This means that a retired High Court judge cannot practice in lower courts and same high court from which he has retired.\u003c/li\u003e\r\n\t\u003cli\u003eThis also implies that at present, the Constitution neither prohibits judges of the Supreme Court or the High Court from taking any post-retirement job nor restricts the power of the government to appoint any retired judges to commissions and/or tribunals.\u003c/li\u003e\r\n\t\u003cli\u003eAn interesting thing is that government generally uses the retired higher judiciary judges as heads of various commissions. There has been a demand from certain sections of the society that there should be a \u0026ldquo;cool off \u0026ldquo; period of two years for the retired judges before they are installed in other offices.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSecond statement is also incorrect.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 217 says, a person shall not be qualified for appointment as a Judge of a High Court unless he is a citizen of India and has for at least ten years held a judicial office in the territory of India; or has for at least ten years been an advocate of a High Court or of two or more such Courts in succession.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44863", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{ c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one among the following commissions was set up in pursuance of a definite provision under an Article of the Constitution of India? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2006)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Election Commission of India (ECI) is a constitutional body that was established under Article 324 of the Constitution of India. The ECI is responsible for conducting free and fair elections in the country.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe ECI\u0026rsquo;s responsibilities include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Overseeing the entire electoral process\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Preparing electoral rolls\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Declaring election results\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Delimiting constituencies\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Issuing voter identity cards\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe ECI is an all-India body, meaning it is common to both the Central government and the State governments. However, the ECI is not responsible for elections to panchayats and municipalities in the states.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe University Grants Commission (UGC) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a statutory body that coordinates, determines, and maintains higher education standards in India. It was established by the Government of India in 1956 under the UGC Act. The UGC operates under the Ministry of Education and has six regional offices in Bangalore, Bhopal, Guwahati, Hyderabad, Kolkata, and Pune.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe UGC\u0026rsquo;s functions include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Promoting and coordinating university education\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Determining and maintaining standards of teaching, examination, and research\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe National Human Rights Commission (NHRC) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a statutory body of the Government of India that was established in 1993. The NHRC\u0026rsquo;s mission is to protect and promote human rights. The NHRC is responsible for the protection and promotion of human rights defined as \u0026ldquo;Rights Relating To Life, liberty, equality and dignity of the individual guaranteed by the constitution or embodied in the international covenants and enforceable by courts in India\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe NHRC consists of a Chairperson, five full-time Members, and seven deemed Members. The chairman and members hold office for a term of three years or until they attain the age of 70 years, whichever is earlier. The NHRC\u0026rsquo;s headquarters are located at New Delhi.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Central Vigilance Commission (CVC) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a statutory body in India that was established in 1964 to address governmental corruption. The CVC is independent of any executive authority and is responsible for monitoring all vigilance activity under the Central Government.\u003c/li\u003e\r\n\t\u003cli\u003eThe CVC also advises various authorities in Central Government organizations on planning, executing, reviewing, and reforming their vigilance work. The CVC is responsible for inquiring into offenses that are alleged to have been committed under the Prevention of Corruption Act, 1988.\u003c/li\u003e\r\n\t\u003cli\u003eThe Central Government must consult the CVC when making rules or regulations governing the vigilance or disciplinary matters relating to public services and posts.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44864", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle t of the government to perform its duties.\u003c/li\u003e\r\n\t\u003cli\u003eIt can also be used to encourage or increase the question of public concern for equality and human rights. Before the 1980s, the Supreme Court of India only heard cases from parties directly or indirectly affected by the defendant. PIL allows people who are not directly involved in a case to bring matters of public interest to the court.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome steps for filing a PIL include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Making an informed decision to file a case\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Consulting all affected interest groups who are possible allies\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePIL actions may sometimes give rise to the problem of competing rights. For example, when a court orders the closure of a polluting industry, the interests of the workmen and their families who aredeprived of their livelihood may not be taken into account by the court.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44868", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n e Union extends to the giving of directions to any State to observe such canons of financial propriety as may be specified in the directions, any such directions may also include, A provision required the reductionof salaries and allowances of all or any class of person serving a State or the union.\u003c/li\u003e\r\n\t\u003cli\u003eA provision requiring all Money Bills or other Financial Bills to be reserved for the consideration of the President after they are passed by the legislature of the State.\u003c/li\u003e\r\n\t\u003cli\u003eA proclamation issued under Article 360 will remain in force for two months, unless before the expiry of the period it is approved by both the Houses of the parliament. Once approved it remains in force till revoked by the President. No emergency under Article 360 has been issued so far.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44870", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eB. N. Rao\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u age_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2007)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The mode of removal of a Judge of a High Court in India is same as that of removal of a Judge of the Supreme Court\u003c/p\u003e\r\n\r\n\u003cp\u003e2. After retirement from the office, a permanent Judge of a High Court cannot plead or act in any court before any authority in India.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatement 1 is Correct.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe mode of removal of a Judge of a High Court in India is indeed the same as that of a Judge of the Supreme Court.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to the Constitution of India, Judges of the High Court and Supreme Court can be removed only through the process of impeachment. Impeachment is a lengthy and detailed process involving charges of proved misbehavior or incapacity.\u003c/li\u003e\r\n\t\u003cli\u003eThe procedure for removal of a Judge is governed by Article 124(4) for the Supreme Court and Article 217 for the High Courts.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe process of removal involves the following steps:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A motion to impeach a Judge must be initiated in either the Lok Sabha (the lower house of Parliament) or the Rajya Sabha (the upper house of Parliament).\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The motion must be supported by at least 100 members in the Lok Sabha or 50 members in the Rajya Sabha.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. If the motion is admitted, a committee is formed to investigate the charges against the Judge.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The committee submits its report to the Parliament.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. If the committee finds the Judge guilty of the charges, the motion for removal is taken up for consideration in the house where it was initiated.\u003c/p\u003e\r\n\r\n\u003cp\u003e6. The motion must be passed by a special majority of at least two-thirds of the total members present and voting.\u003c/p\u003e\r\n\r\n\u003cp\u003e7. After the motion is passed in one house, it is sent to the other house for consideration.\u003c/p\u003e\r\n\r\n\u003cp\u003e8. If the motion is passed by both houses with the requisite majority, the President of India removes the Judge from office.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatement 2 is incorrect.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAfter retirement from the office, a permanent Judge of a High Court can indeed plead or act in any court or before any authority in India, subject to certain restrictions.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, it is important to note that retired Judges are generally prohibited from practicing in the same High Court from which they retired. The restriction on practicing in the same High Court is to ensure that retired Judges do not exert undue influence or interfere with the functioning of the judiciary.\u003c/li\u003e\r\n\t\u003cli\u003eIt also helps maintain the independence and impartiality of the judiciary. Retired Judges can choose to practice in other courts, including lower courts or other High Courts, provided they meet the necessary qualifications and adhere to the rules and regulations governing legal practice.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44876", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth A and R are individually true and R is the correct explanation of A.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2 03cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eUnder Section 21 of the Legal Services Authorities Act, 1987, the award (decision) of a Lok Adalat is given the status of a decree of a civil court.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThis means:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eOnce both parties agree to the settlement and the Lok Adalat passes an award, that award is final, binding, and enforceable on both sides. No appeal can be made against a Lok Adalat award in any court of law, as it is passed based on mutual consent of the disputing parties.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, if any party is not satisfied or believes that the case was not settled by consent, they can file a fresh suit in a regular court \u0026mdash; but not an appeal against the award. Hence, Statement 1 is correct. Lok Adalats deal with civil, matrimonial, family, and compoundable criminal cases \u0026mdash; that is, cases that can be settled amicably between parties.\u003c/li\u003e\r\n\t\u003cli\u003eFamily and matrimonial disputes, such as maintenance, divorce by mutual consent, custody, or property division, are very much covered under Lok Adalats, as long as both sides agree to a settlement. Therefore, this statement is wrong. Therefore the correct answer is (A) 1 only.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_seri break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn India, if a religious sect/community is given the status of a national minority, what special advantages it is entitled to? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It can establish and administer exclusive educational institutions.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The President of India automatically nominates a representative of the community to Lok Sabha.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. It can derive benefits from the Prime Minister\u0026rsquo;s 15-Point Programme.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIn India, if a religious sect/community is given the status of a national minority, it is entitled to the following special advantages:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It can establish and administer exclusive educational institutions. According to Article 30 of the Indian Constitution, all minorities, whether based on religion or language, have the right to establish and administer educational institutions of their choice. This helps in preserving and promoting their culture and providing education to their community members.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It can derive benefits from the prime minister\u0026rsquo;s 15-point programme. The Prime Minister\u0026rsquo;s 15-Point Programme for the Welfare of Minorities is an initiative by the Government of India that aims toimprove the socio-economic conditions of minorities, ensure their equitable share in economic activities, and enhance their opportunities for education and employment.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe programme includes various schemes and measures, such as scholarships, skill development, financial assistance, and infrastructure development, which are specifically targeted towards the upliftment of minority communities. Statement 2 is incorrect, because the president of India does not automatically nominate a representative of the community to the Lok Sabha.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the president can nominate two members of the Anglo-Indian community to the Lok Sabha if he/she believes that the community is not adequately represented in the house. This provision, however, was not extended after January 2020.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44902", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo vote in public elections\u003c/ 3cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eUnder the Constitution of India, which one of the following is not a Fundamental Duty? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eTo vote in public elections is not a fundamental duty. The Swaran Singh Committee is related to the Fundamental Duties in India. On the recommendation of the Swaran Singh Committee, 11 Fundamental Duties were added to the Indian Constitution. Article 51A deals with the Fundamental Duties in the Indian Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe Fundamental Duties in the Indian Constitution were added by the 42nd Constitutional Amendment Act 1976. The concept of fundamental duties of the Indian constitution was borrowed from the USSR(Union of Soviet Socialist Republics).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThere are 11 fundamental duties, they are:-\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Abide by the Constitution and respect national flag \u0026amp; National Anthem.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Follow ideals of the freedom struggle.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Protect sovereignty \u0026amp; integrity of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Defend the country and render national services when called upon.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Sprit of a common brotherhood.\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Preserve composite culture.\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Preserve the natural environment.\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Develop a scientific temper.\u003c/p\u003e\r\n\r\n\u003cp\u003e9. Safeguard public property.\u003c/p\u003e\r\n\r\n\u003cp\u003e10. Strive for excellence.\u003c/p\u003e\r\n\r\n\u003cp\u003e11. Duty for all parents/guardians to send their children in the age group of 6-14 years to school.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44903", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e* ery level. \u003cstrong\u003eHence, statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eReservation of Seats :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDuration of Panchayats - The act provides for a five-year term of office to the panchayat at every level.\u003c/li\u003e\r\n\t\u003cli\u003eState Election Commission - The superintendence, direction and control of the preparation of electoral rolls and the conduct of all elections to the panchayats shall be vested in the state election commission. \u003cstrong\u003eHence, statement 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eFinance Commission - The governor of a state shall, after every five years, constitute a finance committee to review the financial position of the panchayats.\u003c/li\u003e\r\n\t\u003cli\u003eEvery state shall constitute at the District level, a District planning committee to consolidate the plans prepared by panchayats and municipalities in the District and to prepare a draft development plan for District as a whole. This provision is mandated by the 74th constitutional amendment act, 1992. This provision deals with the Urban Local bodies, Article 243-ZD.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44909", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cs le\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe distribution of powers between the Centre and the States in the Indian Constitution draws its inspiration primarily from the Government of India Act, 1935, which was the most comprehensive constitutional framework introduced by the British in pre-independent India.\u003c/li\u003e\r\n\t\u003cli\u003eThe 1935 Act established provincial autonomy and introduced a federal system by dividing powers between the Centre (Federation) and the Provinces (States) through three legislative lists \u0026mdash; the Federal List, Provincial List, and Concurrent List. This exact structure was later adopted, with modifications, in the Seventh Schedule of the Indian Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMorley\u0026ndash;Minto Reforms, 1909 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Indian Councils Act of 1909, it primarily focused on increasing Indian participation in the legislative councils and introducing communal representation (separate electorates for Muslims). It did not deal with Centre\u0026ndash;State relations or power distribution, hence not the basis of federal structure.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMontagu\u0026ndash;Chelmsford Reforms, 1919 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt introduced the system of Dyarchy in the provinces \u0026mdash; dividing provincial subjects into transferred and reserved categories.\u003c/li\u003e\r\n\t\u003cli\u003eAlthough it was a step toward decentralization, it did not create a true federal distribution of powers. Hence, while it laid some groundwork, it was not the direct basis of the current constitutional scheme.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Indian Independence Act, 1947 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was the law that granted independence to India and Pakistan. It did not provide any detailed scheme of power distribution between Centre and States.\u003c/li\u003e\r\n\t\u003cli\u003eInstead, it merely marked the legal end of British rule and empowered the Constituent Assembly to draft the Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44910", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 4 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} 003cp\u003e1. Securing for citizens of India a uniform civil code.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Organizing village Panchayats\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Promoting cottage industries in rural areas\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Securing for all the workers reasonable leisure and cultural opportunities\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above are the Gandhian Principles that are reflected in the Directive Principles of State Policy?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Gandhian Principles that are reflected in the Directive Principles of State Policy are Organizing village Panchayats and Promoting cottage industries in rural areas. The Directive Principles of the State Policy (DPSPs) lay down the guidelines for the state and are reflections of the overall objectives laid down in the Preamble of the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eDPSPs are incorporated to attain the ultimate ideals of preamble i.e. Justice, Liberty, Equality, and fraternity. The Directive Principles of State Policy of India are the guidelines or 15 principles given to the federal institutes governing the State of India, to be kept in citation while framing laws and policies.\u003c/li\u003e\r\n\t\u003cli\u003eThese provide Part IV of the Constitution of India, are not enforceable by any court, but the principles laid down therein are considered in the governance of the country, making it the duty of the State to apply these principles in making laws to establish a just society in the country.\u003c/li\u003e\r\n\t\u003cli\u003eThe principles have been inspired by the Directive Principles given in the Constitution of Ireland which is related to social justice, economic welfare, foreign policy, and legal and administrative matters\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44911", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type nvironment including forests, lakes, rivers and wild life and to have compassion for living creatures;\u003c/p\u003e\r\n\r\n\u003cp\u003e(h) To develop the scientific temper, humanism and the spirit of inquiry and reform;\u003c/p\u003e\r\n\r\n\u003cp\u003e(i) To safeguard public property and to abjure violence;\u003c/p\u003e\r\n\r\n\u003cp\u003e(j) To strive towards excellence in all spheres of individual and collective activity so that the nation constantly rises to higher levels of endeavor and achievement;\u003c/p\u003e\r\n\r\n\u003cp\u003e(k) To provide opportunities for education to his child or ward between the age of six and fourteen years. This duty was added by the 86th Constitutional Amendment Act, 2002.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44912", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo allow a discussion on a definite matter of urgent public importance\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% 03cli\u003eNone of the above statements are correct Union Territories (Delhi and Pondicherry) are represented in the Rajya Sabha. \u003cstrong\u003eHence the statement 1 is Incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eIt is not within the purview of the Chief Election Commissioner to adjudicate election disputes. It is the Supreme Court and High Court which look into the disputes. \u003cstrong\u003eHence the statement 2 is Incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eAccording to the Constitution of India, the Parliament consists of the Lok Sabha the Rajya Sabha, and the President of India. \u003cstrong\u003eHence the statement 3 is Incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44914", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css
