</div>
<div style="position: fixed; bottom: 20px; width: 100%; pointer-events: none; z-index: 1001; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box;">

        <button onclick="document.getElementById('contact-menu').toggleAttribute('hidden')"

            CONTACT US
        </button>
        <div id="contact-menu" hidden style="background: #1b1b1b; border: 2px solid #b8860b; padding: 10px; margin-top: 10px; border-radius: 5px;">

<header style="position: sticky; top: 0; z-index: 1000; background: #1b1b1b; color: #fdf6e3; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #b8860b; box-shadow: 0 5px 15px rgba(0,0,0,0.4); font-family: 'Georgia', serif;">
    <div>
        <div style="font-weight: 900; letter-spacing: 2px; font-size: 1.6rem; color: #b8860b;">ABHISHA AI</div>
        <div style="font-size: 0.9rem; color: #fff; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold;">
            CANDIDATE: <span id="user-display-name">---</span>
        </div>
    </div>
    <div style="display: flex; gap: 10px; font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: 900;">
        <div style="background: rgba(184, 134, 11, 0.2); padding: 8px 14px; border-radius: 4px; border: 1px solid #b8860b;">ACC: <span id="rt-accuracy">100</span>%</div>
        <div style="background: rgba(184, 134, 11, 0.2); padding: 8px 14px; border-radius: 4px; border: 1px solid #b8860b;">T: <span id="rt-timer">0</span>s</div>
        <div style="background: rgba(0, 0, 0, 0.3); padding: 8px 14px; border-radius: 4px; border: 1px solid #5d4037;">Q: <span id="rt-progress">1/100</span></div>

<div id="quote-strip" style="background: #fffdf5; padding: 18px; text-align: center; font-style: italic; border-bottom: 2px solid #e0d5b3; color: #4a3728; font-weight: 800; font-family: 'Georgia', serif; font-size: 1.4rem; line-height: 1.4;"></div>

<main style="max-width: 950px; margin: 35px auto; padding: 0 25px; font-family: 'Georgia', serif; padding-bottom: 150px;">
    <div style="background: #ffffff; border: 1px solid #dcd1b3; padding: 50px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); border-radius: 5px; position: relative;">
        <div id="q-text-display" style="font-size: 1.7rem; line-height: 1.8; font-weight: 900; color: #111; margin-bottom: 35px; padding-bottom: 20px; border-bottom: 2px solid #f0e6cc;"></div>
        <div id="opt-grid-display" style="display: grid; gap: 20px;"></div>
        <div id="analysis-panel" style="display: none; margin-top: 40px; padding: 30px; background: #fdfaf2; border-left: 10px solid #b8860b; border-radius: 0 5px 5px 0;">
            <div style="font-weight: 900; color: #b8860b; margin-bottom: 12px; letter-spacing: 2px; font-size: 1.3rem;"> ABHISHA AI INSIGHTS</div>
            <div id="analysis-text-content" style="font-size: 1.35rem; line-height: 1.9; color: #1b1b1b; font-weight: 500;"></div>
            
    </div>

    <div style="display: flex; justify-content: space-between; margin-top: 50px;">
        <button onclick="navigate(-1)" style="background: transparent; color: #1b1b1b; border: 3px solid #1b1b1b; padding: 18px 45px; cursor: pointer; font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; transition: 0.3s;">PREVIOUS</button>
<button onclick="navigate(1)" style="background: #1b1b1b; color: #fdf6e3; border: none; padding: 18px 45px; cursor: pointer; font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">NEXT QUESTION</button>

    </div>
</main>

function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Indian Public Finance, consider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Disbursements from Public Accounts of India are subject to the Vote of Parliament.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Indian Constitution provides for the establishment of a Consolidated Fund, a Public Account and a Contingency Fund for each State.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Appropriations and disbursements under the Railway Budget are subject to the same form of parliamentary control as other appropriations and disbursements\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Public Account of India (Article 266(2)) includes money that the Government holds in trust for others, such as:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eProvident funds, Small savings, Postal insurance, Judicial deposits, etc. These funds do not belong to the government; they belong to individuals or other bodies. Since the government merely acts as a banker or trustee, the withdrawals from the Public Account are not subject to the vote of Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eOnly withdrawals from the Consolidated Fund of India require prior parliamentary approval through an Appropriation Act. Hence, Statement 1 is wrong.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eUnder Articles 266 and 267, every State has:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Consolidated Fund of the State \u0026mdash;\u003c/strong\u003e for all revenues received by the State Government, loans raised, and repayment of loans.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Contingency Fund of the State \u0026mdash; \u003c/strong\u003eto meet unforeseen or urgent expenditures without prior legislative approval (Article 267(2)).\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Public Account of the State \u0026mdash;\u003c/strong\u003e for funds held in trust (like State PF, local bodies\u0026rsquo; deposits, etc.).\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSo, the Constitution clearly provides for all three types of funds for both the Union and each State. Hence, Statement 2 is correct. Earlier, there used to be a separate Railway Budget (merged with the General Budget in 2017).\u003c/li\u003e\r\n\t\u003cli\u003eHowever, even before the merger, the Railway Budget was presented to Parliament and required parliamentary approval just like the General Budget. The appropriation process, voting on demands for grants, and audit control by the CAG applied equally to both.\u003c/li\u003e\r\n\t\u003cli\u003eThus, whether in the General or Railway Budget, parliamentary control and financial procedures are identical. Hence, Statement 3 is correct.\u003cstrong\u003e Hence, the correct answer is (B) 2 and 3.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44834", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width t can summon the House after prorogation. According to Article 83(2) of the Constitution of India, the term of the Lok Sabha is five years from the date of its first meeting, unless it is dissolved earlier. At the end of the five-year period, the Lok Sabha is automatically dissolved by efflux of time, even if no formal order of dissolution is issued by the President.\u003c/li\u003e\r\n\t\u003cli\u003eThe Speaker of Lok Sabha continues to hold office even after the dissolution of the House. The Speaker remains in office until immediately before the first meeting of the newly constituted Lok Sabha. During this period, the Speaker does not preside over the sessions of the House, but performs certain functions such as maintaining the office and carrying out administrative duties.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44835", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-wi ortant} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Fourth Schedule of the Constitution of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt allocates the seats in the Rajya Sabha to states and union territories. The allocation is based on the population of each state.\u003c/li\u003e\r\n\t\u003cli\u003eThe Fourth Schedule corresponds with articles 4 and 80 of the constitution. Article 80 of the Constitution states that the Rajya Sabha has a maximum strength of 250 members. Of these, 12 members are nominated by the President and 238 are representatives of the states and union territories.\u003c/li\u003e\r\n\t\u003cli\u003eThe distribution of powers between the Union and the States is covered in the Seventh Schedule of the Constitution of India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Seventh Schedule is made up of three lists that divide powers and responsibilities between the union and state legislatures:\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eList I: The Union List\u003c/li\u003e\r\n\t\u003cli\u003eList II: The State List \u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eList III: The Concurrent List\u003c/li\u003e\r\n\t\u003cli\u003eThe Parliament has the sole authority to create laws for any of the matters listed in List I.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe State List includes items such as:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eProduction, transport, manufacture, and sale of intoxicating liquors, Public health, Agricultural education and research, State public services.\u003c/li\u003e\r\n\t\u003cli\u003eThe 22 official languages of India are listed in the 8th Schedule of the Indian Constitution. These languages are covered in Articles 343 to 351 of Part XVII of the Constitution. When the Constitution was being drafted, only 14 languages were included in the 8th Schedule. Amendments have since added Sindhi, Konkani, Manipuri, Nepali, Bodo, Dogri, Maithili, and Santhali.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 22 languages in the 8th Schedule are:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAssamese, Bengali, Gujarati, Hindi, Kannada, Kashmiri, Konkani, Malayalam, Manipuri, Marathi, Nepali, Oriya, Punjabi, Sanskrit, Sindhi, Tamil, Telugu, Urdu, Bodo, Santhali, Maithili, Dogri.\u003c/li\u003e\r\n\t\u003cli\u003eThe Fifth and Sixth Schedules of the Indian Constitution both deal with theadministration of tribal and scheduled areas. However, the Sixth Schedule is specific to the autonomous tribal areas in the four northeastern states of Assam, Meghalaya, Tripura, and Mizoram.\u003c/li\u003e\r\n\t\u003cli\u003eThe Fifth Schedule applies to tribal areas in various states of India, excluding those four states. The Fifth Schedule provides protection to tribal populated regions of the country known as Scheduled Areas. It also includes provisions relating to the administration and control of scheduled areas and scheduled tribes.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sixth Schedule provides legislative, administrative, judicial, and financial powers in the Tribal Areas of Assam, Meghalaya, Mizoram, and Tripura. It also deals with the details of the mechanism and institutions essential for governance of the autonomous districts in those states.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "diffic le type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following statements is not correct............ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to Rule 198(1), a member gives written notice of intention to move a no-confidence motion, but the member is not required to state any specific grounds or reasons for the motion. The motion simply expresses lack of confidence in the Council of Ministers as a whole. So, grounds or reasons are not required to be set out in the notice. Hence, this statement is not correct \u0026mdash; and therefore the right answer.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rules of Procedure do not prescribe any detailed conditions of admissibility for such a motion, other than the requirement that it must be supported by at least 50 members when leave to move the motion is sought (as per Rule 198(3)). This ensures that the motion is not frivolous, but otherwise, there are no additional procedural or content-based restrictions. \u003cstrong\u003eHence, statement (b) is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eOnce the Speaker admits a no-confidence motion and finds that at least 50 members support it, Rule 198(4) specifies that the motion must be discussed within 10 days from the date on which the leave was granted. This is to ensure that the confidence of the House is tested without undue delay and that the government\u0026rsquo;s legitimacy is promptly confirmed or denied. \u003cstrong\u003eHence, statement (c) is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe Council of Ministers is collectively responsible only to the Lok Sabha under Article 75(3) of the Constitution, not to the Rajya Sabha. Therefore, a no-confidence motion can only be moved and passed in the Lok Sabha, and not in the Rajya Sabha. While Rajya Sabha can hold discussions or debates on government functioning, it cannot remove the government by a no-confidence motion.\u003cstrong\u003e Hence, statemnet (d) is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44838", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-widt 3e\r\n\u003cp\u003eRajya Sabha alone\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe resolution for removing the Vice- President of India can be moved in the...........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn India, Vice-President has the second highest office in the country. Article 63 of the Indian Constitution mentions the post of Vice-President The resolution for removing the Vice President of India can be moved in the Council of States (Rajya Sabha). The resolution must be passed by a majority of the Rajya Sabha members and agreed to by the House of the People (Lok Sabha).\u003c/li\u003e\r\n\t\u003cli\u003eThe Vice-President of India cannot be formally impeached, unlike the President. The Vice-President is also the ex-officioChairman of the Council of States, or Rajya Sabha. Notably, the Constitution does not list grounds for removal. Supreme Court can also remove the Vice President for committing electoral malpractices and not fulfilling the eligibility criteria for the Rajya Sabha member while in office as per Article 71(1) of the constitution.\u003c/li\u003e\r\n\t\u003cli\u003eAs per Article 71(1), it is also the duty of the Supreme Court to examine the doubts raised in connection with the conduct of a Vice President and remove the Vice President if found committing contempt of the constitution. Hence, it is clear that the resolution for removing the Vice President of India can be moved to Rajya Sabha only.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44839", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u00 e type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following tasks : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Superintendence, direction and conduct of free and fair elections.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Preparation of electoral rolls for all elections to the Parliament, State Legislatures and the Office of the President and the Vice President.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Giving recognition to political parties and allotting election symbols to political parties and individuals contesting the election.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Proclamation of final verdict in the case of election disputes.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above are the functions of the Election Commission of India?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe correct option is (a) Only 1, 2 and 3.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eElection Commission is not the authority to proclaim final verdict in the centre of election dispute. It goes to judiciary (High Court).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Election Commission of India (ECI) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a constitutional body that was established on January 25, 1950. Article 324 of the Constitution of India gives the ECI the power to regulate, direct, and control elections to parliament, state legislatures, and the offices of president and vice-president. The ECI also advises on the disqualification of sitting members of Parliament and State Legislatures.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe ECI\u0026rsquo;s functions include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Directing and controlling: The entire process of conducting elections\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Implementing the Code of Conduct: And punishing any candidate or party that violates it\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Preparing electoral rolls: And updating the voter\u0026rsquo;s list\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Allowing symbols to political parties: And giving recognition to the national, state, and regional parties\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Setting limits on poll expenses\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Issuing directives to parties, candidates, and election machinery\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Conveying zero tolerance: Towards the use of children in election related work or campaign activities\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44840", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !impo ak-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The highest deciding body for planning in India is the Planning Commission of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Secretary of the Planning Commission of India is also the Secretary of National Development Council.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Constitution includes economic and social planning in the Concurrent List in the Seventh Schedule of the Constitution of India.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Planning Commission of India was once the highest deciding body for planning in India, but it is no longer active. The Parliament is now the highest decision making body for planning in India, followed by the National Development Council and the Planning Commission.\u003c/li\u003e\r\n\t\u003cli\u003eThe Planning Commission was established in 1950 to oversee India\u0026rsquo;s economic and social development. It was an advisory body that reported directly to the Prime Minister of India. The Planning Commission\u0026rsquo;s objectives were to improve the standard of living for the people of India by increasing production, using the country\u0026rsquo;s resources efficiently, and providing employment opportunities for all.\u003c/li\u003e\r\n\t\u003cli\u003eThe secretary of the Planning Commission is also the secretary of the National Development Council (NDC). The Planning Commission also provides administrative assistance to the NDC. The NDC is India\u0026rsquo;s highest decision making body for progressive matters. It was established in 1952 and is presided over by the Prime Minister of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe NDC is not a constitutional or statutory body, but is considered an executive body. The Constitution of India includes economic and social planning in the Concurrent List in the Seventh Schedule. This means that both the Central Government and the State Governments can make laws and policies related to economic planning.\u003c/li\u003e\r\n\t\u003cli\u003eThe Seventh Schedule of the Indian Constitution comprises three lists, which are Union, Concurrent and State lists. The Concurrent List has 52 subjects enumerated under it.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44841", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 355\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 356\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following Articles of the Constitution of India says that the executive power of every State shall be so exercised as not to impede or prejudice the exercise of the executive power of the Union? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Article 257 of the Constitution of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt states that the executive power of every state should be exercised in a way that doesn\u0026rsquo;t impede or prejudice the executive power of the Union. Article 257 also deals with the Union\u0026rsquo;s control over states in certain cases.\u003c/li\u003e\r\n\t\u003cli\u003eArticles 256 and 257 are important for ensuring the Union and states exercise executive power harmoniously. They also enforce the principle of Union supremacy by providing appropriate directions when there are irreconcilable differences on important issues.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2.\u0026nbsp;Article 258 of the Indian Constitution :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt gives the President the power to give functions to a state government or its officers. These functions can be conditional or unconditional, and relate to any matter that the Union\u0026rsquo;s executive power extends to. According to Article 258, the President can only do this if the Government of a State consents to it.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Article 355 of the Indian Constitution :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt states that it is the Union\u0026rsquo;s duty to protect states from internal disturbance and external aggression. It also requires the Union to ensure that the government of each state is carried out in accordance with the Constitution\u0026rsquo;s provisions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Article 356 of the Indian Constitution :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt gives the President the power to suspend a state government and impose President\u0026rsquo;s Rule. This is done when the President is satisfied that the state government cannot continue as per the provisions of the Constitution. This provision is also known as State Emergency.\u003c/li\u003e\r\n\t\u003cli\u003eIt allows the President to take control of the administration of a state if there is a failure of constitutional machinery. Article 356 was first used in 1951 when President\u0026rsquo;s Rule was imposed in Punjab.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44843", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Appropriation Bill must be passed by both the Houses of Parliament before it can be enacted into law\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u style\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Indian Parliament, which one of the following is not correct :\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe correct answer is (C).\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eFinance Bill is required for proposing new taxes but no another Bill/Act is required for making changes in the rates of taxes which are already under operation.\u003c/li\u003e\r\n\t\u003cli\u003eThe Appropriation Bill is a bill that authorizes the Indian government to withdraw funds from the Consolidated Fund of India for use during the financial year. The Appropriation Bill must be passed by both the Houses of Parliament before it can be enacted into law.\u003c/li\u003e\r\n\t\u003cli\u003eThe Finance Bill is a bill that proposes new taxes or changes in the rates of existing taxes. The Finance Bill must also be passed by both the Houses of Parliament before it can be enacted into law. However, no other Bill/Act is required for making changes in the rates of taxes which are already under operation.\u003c/li\u003e\r\n\t\u003cli\u003eThe rates of existing taxes can be changed by a simple executive order. According to Article 110 of the Constitution, a money bill can only be introduced in the Lok Sabha with the prior recommendation of the President.\u003c/li\u003e\r\n\t\u003cli\u003eA money bill is a government bill that deals with financial matters like public expenditure and taxation. Only a minister is allowed to introduce a money bill in the Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eOnce a money bill has been passed by the Lok Sabha, it is sent to the Rajya Sabha for consideration. After a money bill has been passed and reaches the President, the President cannot withhold their assent to it.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44844", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 24\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 45\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 330\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 368\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich Article of the Constitution of India says, \u0026lsquo;No child below the age of fourteen years shall be employed to work in any factory or mine or engaged in any other hazardous employment\u0026rsquo;? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Article 24 of the Constitution of India says, \u0026lsquo;No child below the age of fourteen years shall be employed to work in any factory or mine or engaged in any other hazardous employment.\u0026rsquo;\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis article prohibits the employment of children in factories, mines, and other hazardous occupations. This article was adopted on December 3, 1948.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e2. Article 45 of the Indian Constitution is about providing free and compulsory education for children. The article states that the state should try to provide free and compulsory education for all children up to the age of 14 years within 10 years of the constitution\u0026rsquo;s commencement.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Article 330 of the Indian Constitution reserves seats for Scheduled Castes and Scheduled Tribes in the House of the People.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe article reserves seats for:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Scheduled Castes\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Scheduled Tribes, except for the Scheduled Tribes in Assam\u0026rsquo;s autonomous districts\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Scheduled Tribes in Assam\u0026rsquo;s autonomous districts.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe special provisions of Article 330 do not apply to the Scheduled Tribes of Nagaland, Meghalaya, Arunachal Pradesh, and Mizoram. This is because these states have a majority tribal population.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 330 was amended in 1956, 1973, and 2001 to include Union Territories, calculation of reserved seats in autonomous districts of Assam, and the meaning of population.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e4. Article 368 of the Indian Constitution is about the power of Parliament to amend the Constitution and the procedure for doing so. It is included in part XX of the Constitution. Article 368 allows Parliament to amend the Constitution by adding, changing, or repealing any provision.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIt also provides for two types of amendments:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Special majority of Parliament\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Special majority of Parliament and ratification of half of the state\u0026rsquo;s legislatures by a simple majority\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAn amendment can only be initiated by introducing a bill in either House of Parliament (Lok Sabha and Rajya Sabha). The bill must be passed by a total majority and by a majority of at least two-thirds of the people present and voting in both houses. If there is disagreement between the two houses, there is no provision for a joint sitting.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "di  type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA is false but R is true\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A) : The Central Rural Sanitation Programme was launched in 1986 to improve the quality of life of rural people in India. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eReason(R) : Rural sanitation is a subject in the Concurrent List in the Constitution of India\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Central Rural Sanitation Programme (CRSP) was launched in 1986 to improve the quality of life of rural people in India and to provide privacy and dignity to women.\u003c/li\u003e\r\n\t\u003cli\u003eThe CRSP was India\u0026rsquo;s first nationwide program for rural sanitation. It was supply-driven, highly subsidized, and emphasized toilet construction.\u003c/li\u003e\r\n\t\u003cli\u003eRural sanitation is a subject in the Concurrent List in the Constitution of India. This means that both the Union and state governments can make laws for rural sanitation.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, if there is a conflict, the laws made by the Central Government will take precedence. Sanitation is also part of the \u0026lsquo;Directive Principles of State Policy\u0026rsquo; (DPSP) in Part IV of the Constitution. Article 47 of the DPSP states that it is the government\u0026rsquo;s duty to raise the standard of living.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44846", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eK.V.K. Sundaram\u0026nbsp;\u003c/p\u003e", "option_10": "", "op ant} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4-3-2-1\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2-3-4-1\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4-1-2-3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following events: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2004)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Fourth general elections in India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Formation of Haryana State\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Mysore named as Karnataka State\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Meghalaya and Tripura become full States\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich one of the following is the correct chronological order of the above?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHaryana was carved out of the larger Punjab State on 1st November 1966 by the Punjab Reorganisation Act, 1966. This was done on linguistic lines to create a separate Hindi-speaking state. Hence, this is the first event chronologically. The Fourth Lok Sabha elections were held in February\u0026ndash;March 1967.\u003c/li\u003e\r\n\t\u003cli\u003eThese were significant because, for the first time, the Congress party faced serious setbacks in several states and at the Centre. This event came right after Haryana\u0026rsquo;s formation, so it\u0026rsquo;s the second in order.\u003c/li\u003e\r\n\t\u003cli\u003eBoth Meghalaya and Tripura (along with Manipur) became full-fledged states on 21st January 1972 under the North-Eastern Areas (Reorganisation) Act, 1971.\u003c/li\u003e\r\n\t\u003cli\u003eEarlier, Meghalaya was an autonomous state within Assam (from 1970 to 1972). Hence, this is the third event chronologically. The State of Mysore was officially renamed Karnataka on 1st November 1973 through the Mysore State (Alteration of Name) Act, 1973. This was the final event among the four. Therefore, this comes last.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44849", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u0026nbsp;\u003c/p\u003e", "option_1 pe=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2005)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. There are 25 High Courts in India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Punjab, Haryana and the Union Territory of Chandigarh have a common High Court.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. National Capital Territory of Delhi has a High Court of its own.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe institution of the high court originated in India in 1862 when the high courts were set up at Calcutta, Bombay and Madras.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1866, a fourth high court was established at Allahabad. According to exam year, there were 24 high courts in the country. Punjab, Haryana and the Union Territory of Chandigarh have a common high court.\u003c/li\u003e\r\n\t\u003cli\u003eDelhi is the only union territory that has a high court of its own (since 1966). The Parliament can extend the jurisdiction of a high court to any union territory or exclude the jurisdiction of a high court. The territorial jurisdiction of a common high court is co-terminus with the territories of the concerned states and union territory.\u003c/li\u003e\r\n\t\u003cli\u003eThe Andhra Pradesh High Court and the Telangana High Court were established on January 1, 2019, making them the newest high courts in India.Currently, India has 25 high courts. The oldest high courts are the Bombay High Court, Madras High Court, and Kolkata High Court, which were established in 1862.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44850", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} im 03e2. Right to Property is a legal right but not a Fundamental Right.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Article 300 A was inserted in the Constitution of India by the Congress Government at the Centre by the 44th Constitutional Amendment.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 301 pertains to Freedom of Trade, Commerce and Intercourse. In the original constitution right to property was a Fundamental Right under Article 19(1) (f).\u003c/li\u003e\r\n\t\u003cli\u003eBut 44th Amendment Act, 1978 omitted sub clause f, and inserted Article 300A to make right to property a legal right. The Government at that time was Janta Party government.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44851", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u0
