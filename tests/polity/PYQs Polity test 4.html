 Lok Sabha Speaker, consider the following statements:\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. He/She holds the office during the pleasure of the President.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;He/She need not be a member of the House at the time of his/her election but has to become a member of the House within six months from the date of his/ her election.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. If he/she intends to resign, the letter of his/her resignation has to be addressed to the Deputy Speaker.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIf the Speaker intends to resign, the letter of his resignation is to be addressed to the Deputy Speaker and not the President. The Speaker is elected by the Lok Sabha from amongst its members (as soon as may be, after its first sitting).\u003c/li\u003e\r\n\t\u003cli\u003eWhenever the office of the Speaker falls vacant, the Lok Sabha elects another member to fill the vacancy. The date of election of the Speaker is fixed by the President. Usually, the Speaker remains in office during the life of the Lok Sabha.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHowever, he has to vacate his office earlier in any of the following three cases:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. If he ceases to be a member of the Lok Sabha;\u003c/p\u003e\r\n\r\n\u003cp\u003e2. If he resigns by writing to the Deputy Speaker; and\u003c/p\u003e\r\n\r\n\u003cp\u003e3. If he is removed by a resolution passed by a majority of all the members of the Lok Sabha.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSuch a resolution can be moved only after giving 14 days\u0026rsquo; advance notice. It should be noted here that whenever the Lok Sabha is dissolved, the Speaker does not vacate his Office and continues till the newly- elected Lok Sabha meets.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44915", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\ C Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Recommendations of the Union Finance Commission\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Report of the Public Accounts Committee\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Report of the Comptroller and Auditor General\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The Report of the National Commission for Scheduled Castes\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to the Constitution of India, The Report of the Public Accounts Committee is not a duty of the President of India to cause to be laid before the Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThe Public Accounts Committee examines the accounts showing the appropriation of the sums granted by Parliament to meet the expenditure of the Government of India, the Annual Finance Accounts of the Government of India and such other accounts laid before the House as the Committee may think fit.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44916", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break 3e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA deadlock between the Lok Sabha and the Rajya Sabha calls for a joint sitting of the Parliament during the passage of............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Ordinary Legislation\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Money Bill\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Constitution Amendment Bill\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using codes the given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eJoint Sitting - Article 108 of the Indian Constitution provides for a joint sitting of both Houses of Parliament.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAccordingly, a joint session can be summoned when :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. If after a bill is passed by one House and transmitted to the other House \u0026ndash;\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The other House rejects this bill, or\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Houses do not agree on the amendments made to the bill, or\u003c/p\u003e\r\n\r\n\u003cp\u003e4. More than six months elapse with the bill being received by the other House without it being passed.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Then, the President can summon a joint sitting unless the bill had elapsed because of the Lok Sabha\u0026rsquo;s dissolution.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eException - The joint sitting is held to resolve the deadlock over the ordinary or the finance bills only. But joint sitting cannot be held in the case of Money bills or constitutional amendment bills.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eImportant Point - The joint sitting of the Parliament:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is called by the President (Article 108). It is presided over by the Speaker. In his absence, it is presided over by the Deputy Speaker of the Lok Sabha, or in his absence, the Deputy-Chairman of the Rajya Sabha presides.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chairman doesn\u0026rsquo;t preside over the joint session. If any of the above officers are not present then any other member of the Parliament can preside by consensus of both the House.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44917", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link /style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003emust be a member of the Lok Sabha\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Prime Minister of India, at the time of his/her appointment............\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn a parliamentary system of government provided by the constitution, the President is the nominal executive authority and the Prime Minister is the real executive authority.\u003c/li\u003e\r\n\t\u003cli\u003eIn other words, the President is the \u0026lsquo;Head of the State\u0026rsquo; while the Prime Minister is the \u0026lsquo;Head of the Government.\u0026rsquo; There is no specific procedure for the selection and appointment of the Prime Minister in the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe Prime Minister shall be appointed by the President, Article 75 of the Indian Constitution states. The Delhi High Court in 1980 held that for a person there is no need to prove his majority in the Lok Sabha before getting appointed as the Prime Minister.\u003c/li\u003e\r\n\t\u003cli\u003eThe President shall first appoint him and then ask him to prove his majority in the Lok Sabha within a specific period of time.\u003c/li\u003e\r\n\t\u003cli\u003eThe Supreme Court in 1997 held that a person can be appointed as Prime Minister for six months, if he becomes a member of either House of Parliament otherwise he ceases to be the Prime Minister. Constitutionally, the Prime Minister may be a member of either House of Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eFor example, Indira Gandhi, Deve Gowda, Manmohan Singh were the members of the Rajya Sabha. So, the correct answer is Option A.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44918", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\ \r\n\r\n\u003cp\u003e\u003cstrong\u003eOriginal jurisdiction to decide the disputes arising between different units of the Indian Federation like:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Centre and one or more states; or\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Centre \u0026amp; any state(s) on one side and one or more states on the other; or\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Two or more states.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eOriginal jurisdiction of the Supreme Court extends to any dispute between the Government of India and one or more States.\u003c/li\u003e\r\n\t\u003cli\u003eBetween the Government of India and any State or States on one side and one or more States on the other or between two or more States, if insofar as the dispute involves any question (whether of law or of fact) on which the existence or extent of a legal right depends.\u003c/li\u003e\r\n\t\u003cli\u003eIn addition, Article 32 of the Constitution of India gives an extensive original jurisdiction to the Supreme Court in regard to enforcement of Fundamental Rights.\u003c/li\u003e\r\n\t\u003cli\u003eIt is empowered to issue directions, orders or writs, including writs in the nature of habeas corpus, mandamus, prohibition, quo warranto and certiorari to enforce them.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44919", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the provision to safeguard the autonomy of the Supreme Court of India? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. While appointing the Supreme Court Judges, the President of India has to consult the Chief Justice of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Supreme Court Judges can be removed by the Chief Justice of India only.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The salaries of the Judges are charged on the Consolidated Fund of India to which the legislature does not have to vote.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. All appointments of officers and staffs of the Supreme Court of India are made by the Government only after consulting the Chief Justice of India.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe independence of the Supreme Court is safeguarded by ensuring that the process of appointing judges is not entirely in the hands of the executive.\u003c/li\u003e\r\n\t\u003cli\u003eThe President of India, while appointing judges to the Supreme Court, is constitutionally required to consult the Chief Justice of India. This consultation ensures that the judiciary has a voice in the selection of its own members, reducing the possibility of political influence.\u003c/li\u003e\r\n\t\u003cli\u003eOver time, this evolved into the Collegium System, where appointments are made on the recommendation of a group of senior judges headed by the Chief Justice. Hence, this provision acts as an important safeguard to the Court\u0026rsquo;s autonomy. Thus, Statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eJudges of the Supreme Court cannot be removed by the Chief Justice of India alone. The Constitution provides a very strict and elaborate procedure for the removal of judges to protect their independence.\u003c/li\u003e\r\n\t\u003cli\u003eA judge can be removed only by the President of India after an address passed by both Houses of Parliament with a special majority and only on proven grounds of misbehaviour or incapacity. This ensures that no single authority, not even the Chief Justice, can arbitrarily remove a judge, thereby maintaining judicial autonomy. Thus, Statement 2 is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eThe salaries, allowances, and pensions of Supreme Court judges are charged on the Consolidated Fund of India.\u003c/li\u003e\r\n\t\u003cli\u003eSince such expenditures are charged, they are not subject to vote in Parliament, meaning legislators cannot reduce or alter them during the annual budget. This financial independence is a vital constitutional safeguard because it prevents the executive or legislature from influencing the judiciary through monetary control. It ensures that judges can perform their duties without fear of financial pressure or retaliation. Thus, Statement 3 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eUnder Article 146 of the Constitution, the power to appoint officers and staff of the Supreme Court lies with the Chief Justice of India or an officer appointed by him, not with the government. This provision ensures that the judiciary remains administratively independent, even in matters of internal management and staffing. The statement given reverses the actual constitutional arrangement by implying that the government makes appointments after consulting the Chief Justice, which is wrong. Thus, Statement 4 is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, statements 1 and 3 are correct because they accurately describe constitutional provisions that safeguard the autonomy and independence of the Supreme Court of India.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44920", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width: u003cli\u003ePlacing the Annual Financial Statement (Budget) before Parliament allows members to examine the government\u0026rsquo;s income and expenditure proposals. It is mandated by Article 112 of the Constitution and ensures parliamentary scrutiny of the executive\u0026rsquo;s financial policies. \u003cstrong\u003eThus, Statement 1 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eAccording to Article 114, money can be withdrawn from the Consolidated Fund of India only after Parliament passes the Appropriation Bill. This rule prevents the government from spending public money without legislative approval.\u003cstrong\u003e Thus, Statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe system of supplementary grants, additional grants, and vote-on-account also ensures parliamentary control. These allow the government to seek extra funds or temporary approval from Parliament when necessary. \u003cstrong\u003eThus, Statement 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe idea of a Parliamentary Budget Office for mid-year or periodic review of government expenditure does not exist in India. Although committees like the PAC and Finance Committee review spending, there is no such formal office yet. \u003cstrong\u003eThus, Statement 4 is incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe Finance Bill is introduced in Parliament to give effect to the government\u0026rsquo;s taxation proposals. It must be approved by Parliament before any new taxes or changes in tax rates take effect. \u003cstrong\u003eThus, Statement 5 is correct.\u003c/strong\u003e \u003cstrong\u003eHence, the correct option is (a) 1, 2, 3 and 5 only.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answ idth:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3 only\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following bodies does not/ do not find mention in the Constitution? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. National Development Council\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Planning Commission\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Zonal Councils\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eNational Development Council (NDC):\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt\u0026nbsp;was established in 1952 by an executive order of the Government of India. It was created to strengthen and coordinate the efforts of the Centre and the States in planning and development. Since it was not set up under any constitutional provision or law passed by Parliament, it is called an extra-constitutional and non-statutory body.\u003c/li\u003e\r\n\t\u003cli\u003eIt worked as an advisory body to the Planning Commission and included the Prime Minister, Union Ministers, and Chief Ministers of all States. Thus, the NDC is an extra-constitutional body not mentioned in the Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePlanning Commission:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Planning Commission was formed in 1950 by an executive resolution of the Government of India, based on the recommendation of the Advisory Planning Board (1946). It was neither created by the Constitution nor by an Act of Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eIt was responsible for formulating India\u0026rsquo;s Five-Year Plans and national development policies. In 2015, it was replaced by NITI Aayog, which is also an executive body. Therefore, the Planning Commission was an extra-constitutional and non-statutory body not mentioned in the Constitution. Thus, the Planning Commission is also not mentioned in the Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eZonal Councils:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Zonal Councils, unlike the above two, were established under the States Reorganisation Act of 1956. They are statutory bodies, not constitutional ones, since their creation is based on a law passed by Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThey aim to promote inter-state cooperation and coordination between the Centre and States. Even though they are not part of the Constitution, they have a legal (statutory) basis. Thus, the Zonal Councils are not extra-constitutional, but statutory bodies.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44925", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo provide self-governance\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\ ditional Forest Dwellers (Recognition of Forest Rights) Act, 2006, who shall be the authority to initiate the process for determining the nature and extent of individual or community forest rights or both? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eUnder the Scheduled Tribes and Other Traditional Forest Dwellers (Recognition of Forest Rights) Act, 2006, the Gram Sabha is the authority that initiates the process for determining the nature and extent of individual or community forest rights or both.\u003c/li\u003e\r\n\t\u003cli\u003eIt identifies the rights holders, verifies the claims, and passes resolutions which are then forwarded to the Sub-Divisional Level Committee for further action. This ensures that the process starts at the grassroots level, with direct involvement of the forest-dwelling community.\u003c/li\u003e\r\n\t\u003cli\u003eThus, statement (d) Gram Sabha is correct. The State Forest Department (a) only provides technical support, District Collector (b) approves claims later, and Tahsildar/Block Officer (c) assists administratively \u0026mdash; none of them initiate the process. Thus, (a), (b), and (c) are incorrect.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_i  break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eUnder Article 368(2), Parliament can amend the constitution by passing a Bill in each House by a majority of the total membership of that House and by a majority of not less than two-thirds of the members of that House present and voting.\u003c/li\u003e\r\n\t\u003cli\u003eThose provisions of the Constitution which are related to the federal structure of the polity can be amended by a special majority of the Parliament and also with the consent of half of the state legislatures by a simple majority.\u003c/li\u003e\r\n\t\u003cli\u003eIf one or some or all the remaining states take no action on the bill, it does not matter; the moment half of the states give their consent, the formality is completed. There is no time limit within which the states should give their consent to the bill\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44930", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn India, the same person cannot be reme Court are appointed by the President. This option is incorrect because the High Court Judges are also appointed by the President as in the case of Judges of the Supreme Court. But, the procedure is slightly different.\u003c/li\u003e\r\n\t\u003cli\u003eThe appointment of Chief Justice of High Court is dealt with in Article 217 of the Constitution which states that he is appointed by the President in consultation with the Chief justice of India as well as the Governor of the state in question.\u003c/li\u003e\r\n\t\u003cli\u003eThe collegium headed by the Chief Justice of India gives recommendations for the appointment of High Court Judges. In the cases a Union Territory having a legislative setup the Chief Minister is appointed by the Lt. Governor on the basis of majority support.\u003c/li\u003e\r\n\t\u003cli\u003eThis option is also incorrect because the Section 45 in the Government of Union Territories Act, 1963 states that the Chief Minister must be appointed by the President.Rest of the Ministers is appointed by the President on the advice of the Chief Minister.\u003c/li\u003e\r\n\t\u003cli\u003eThus, the only correct statement is No procedure has been laid down in the Constitution of India for the removal of a Governor from his/her post.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44931", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003  secures the Social, Economic, and Political Justice of its people. The Preamble of the Indian Constitution gives Liberty of Thought, Expression, Belief, Faith, and Worship to its people. The Preamble of the Indian Constitution gives Equality of Status and Opportunity to its people.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDIRECTIVE PRINCIPLES OF STATE POLICY (DPSP):\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThese are the 15 guidelines given to the federal institutes governing the State of India that are to be kept under consideration while forming the laws.\u003c/li\u003e\r\n\t\u003cli\u003eThese are moral obligations and not the legal bindings on the state authorities. Articles 36-51 in Part IV of the Indian Constitution contain the DPSP. Borrowed from the Irish Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eAs per Article 38 of the DPSP, the state shall strive to promote the welfare of the people of India by securing and protecting their Social, Economic, and Political justice.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44932", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !imp 3e\r\n\u003cp\u003eFundamental Rights and Fundamental Duties\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAccording to the Constitution of India, which of the following are fundamental for the governance of the country? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Constitution itself declares that the Directive Principles of State Policy are fundamental to the governance of the country. These are the constitutional instructions or recommendations to the State in legislative, executive, and administrative matters. \u003cstrong\u003eHence option 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAdditional Information :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Socialistic Principles:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eto promote the welfare of the people by securing a social order permeated by social, economic, and political justice and to minimize inequalities in income, status, facilities and opportunities. (Art 38) to secure\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e(a)\u0026nbsp;the right to adequate means of livelihood for all citizens;\u003c/p\u003e\r\n\r\n\u003cp\u003e(b) the equitable distribution of material resources of the community for common good;\u003c/p\u003e\r\n\r\n\u003cp\u003e(c) prevention of concentration of wealth and means of production;\u003c/p\u003e\r\n\r\n\u003cp\u003e(d) equal pay for equal work for men and women;\u003c/p\u003e\r\n\r\n\u003cp\u003e(e) preservation of the health and strength of workers and children against forcible abuse; and\u003c/p\u003e\r\n\r\n\u003cp\u003e(f) opportunities for the healthy development of children.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e(Art 39) to promote equal justice and to provide free legal aid to the poor.\u003c/li\u003e\r\n\t\u003cli\u003e(Art 39A) to secure the right to work, to education and to public assistance in cases of unemployment, old age, sickness and disablement.\u003c/li\u003e\r\n\t\u003cli\u003e(Art 41) to make provision for just and humane conditions for work and maternity relief.\u003c/li\u003e\r\n\t\u003cli\u003e(Art 42) to secure a living wage, a decent standard of living and social and cultural opportunities for all workers.\u003c/li\u003e\r\n\t\u003cli\u003e(Art 43) to take steps to secure the participation of workers in the management of industries.\u003c/li\u003e\r\n\t\u003cli\u003e(Art 43A) to raise the level of nutrition and the standard of living of people and to improve public health.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. (Art 47) The Gandhian Principles\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBased on Gandhian ideology, these include\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003ei. Organizing village Panchayats and endowing them with necessary powers and authority to enable them to function as units of self government. (Art 40)\u003c/p\u003e\r\n\r\n\u003cp\u003eii. Promoting cottage industries on an individual or co-operation basis in rural areas. (Art 43)\u003c/p\u003e\r\n\r\n\u003cp\u003eiii. Promoting voluntary formation, autonomous functioning, democratic control, and professional management of co-operative societies. (Art 43B)\u003c/p\u003e\r\n\r\n\u003cp\u003eiv. Pomoting the educational and economic interests of SCs, STs and other weaker sections of the society and protecting them from social injustice and exploitation. (Art 46)\u003c/p\u003e\r\n\r\n\u003cp\u003ev. Prohibiting the consumption of intoxicating drinks and drugs which are injurious to health. (Art 47)\u003c/p\u003e\r\n\r\n\u003cp\u003evi. Prohibiting the slaughter of cows, calves and other milch and drought cattle and improving their breeds. (Art 48)\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Liberal-Intellectual Principles:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThese principles represent the ideology of liberalism and direct the state to\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003ei. Secure for all citizens a uniform civil code. (Art 44)\u003c/p\u003e\r\n\r\n\u003cp\u003eii. To provide early childhood care and education for all children until they complete the age of 6 years. (Art 45)\u003c/p\u003e\r\n\r\n\u003cp\u003eiii. To organise agricultural and animal husbandry on modern and scientific lines. (Art 48)\u003c/p\u003e\r\n\r\n\u003cp\u003eiv. To protect and improve the environment and to safeguard forests and wildlife. (Art 48A)\u003c/p\u003e\r\n\r\n\u003cp\u003ev. To protect monuments, places and objects of artistic or historic interest which are declared to be of national importance. (Art 49)\u003c/p\u003e\r\n\r\n\u003cp\u003evi. To separate the judiciary from the executive in the public services of the state. (Art 50)\u003c/p\u003e\r\n\r\n\u003cp\u003evii. To promote international peace and security and maintain just and honourable relations between nations; to foster respect for international law and treaty obligations, and to encourage settlement of international disputes by arbitration. (Art 51)\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "425", "test_series_id": "19", "topic": ""}];
const QUIZ_TITLE = "Indian Polity PYQ Test 4";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
