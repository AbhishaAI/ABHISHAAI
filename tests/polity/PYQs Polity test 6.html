function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

!important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements in respect of Bharat Ratna and Padma Awards...........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Bharat Ratna and Padma Awards are titles under the Article 18(1) of the Constitution of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Padma Awards, which were instituted in the year 1954, were suspended only once.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The number of Bharat Ratna Awards is restricted to a maximum of five in a particular year.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above statements are not correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePadma Awards :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Padma Awards are one of the highest civilian honors of India announced annually on the eve of Republic Day.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Awards are given in three categories:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Padma Vibhushan (for exceptional and distinguished service)\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Padma Bhushan (distinguished service of higher order)\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Padma Shri (distinguished service)\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe award seeks to recognize achievements in all fields of activities or disciplines where an element of public service is involved.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBharat Ratna :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the highest civilian award in the country.\u003c/li\u003e\r\n\t\u003cli\u003eIt is awarded in recognition of exceptional service/performance of the highest order in any field of human endeavor.\u003c/li\u003e\r\n\t\u003cli\u003eIt is treated on a different footing from Padma Award.\u003c/li\u003e\r\n\t\u003cli\u003eThe recommendations for Bharat Ratna are made by the Prime Minister to the President of India. No formal recommendations for Bharat Ratna are necessary.\u003c/li\u003e\r\n\t\u003cli\u003eThe first-ever Indian to receive this award was the famous scientist, Dr. Chandrasekhara Venkata Raman.\u003c/li\u003e\r\n\t\u003cli\u003eThe award was started by former President Dr. Rajendra Prasad on January 2nd, 1954, are announced every year on the occasion of Republic Day except for brief interruption(s) during the years 1978 and 1979, 1993 to 1997, 2020, and 2021. it is suspended many times. \u003cstrong\u003eHence, Statement 2 is incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe number of Bharat Ratna Awards is restricted to a maximum of three in a particular year. It was awarded to four people in the same year only once in 1999. \u003cstrong\u003eHence, Statement 3 is incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe Bharat Ratna can also be awarded to non-Indians as there is no written rule against the same. Mother Teresa, a naturalized Indian citizen was conferred with the award in 1980. Non-Indians, Khan Abdul Ghaffar Khan and Nelson Mandela have also been awarded the Bharat Ratna.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe constitutional validity of the National Awards :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn 1996, the Supreme Court upheld the constitutional validity of the National Awards - Bharat Ratna, Padma Vibhushan, Padma Bhushan, and Padma Sri.\u003c/li\u003e\r\n\t\u003cli\u003eIt ruled that these awards do not amount to \u0026lsquo;titles\u0026rsquo; within the meaning of Article 18 which prohibits only hereditary titles of nobility. \u003cstrong\u003eHence, Statement 1 is incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45036", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. \u0026lsquo;Right to the City\u0026rsquo; is an agreed human right and the UN-Habitat monitors the commitments made by each country in this regard.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. \u0026lsquo;Right to the City\u0026rsquo; gives every occupant of the city the right to reclaim public spaces and public participation in the city.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. \u0026lsquo;Right to the City\u0026rsquo; means that the State cannot deny any public service or facility to the unauthorized colonies in the city.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRight to the city is a holistic approach to improving the quality of everyday life in cities.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 1 is correct :\u003c/strong\u003e The right to the city is at the heart of the New Urban Agenda agreed at Habitat III.\u003c/li\u003e\r\n\t\u003cli\u003eUN-Habitat partners with national and local governments, academia, civil society and the private sector in the implementation and monitoring of the commitment made under the New Urban Agenda and SDG 11.\u003c/li\u003e\r\n\t\u003cli\u003eThe Universal Declaration of Human Rights commits to social justice through the promotion, defense and fulfillmentof all human rights related to habitat, including the Human Right to Adequate Housing, Land and the Right to the City in every region of the world.\u003c/li\u003e\r\n\t\u003cli\u003eThere is also a \u0026ldquo;World Charter for the Right to the City\u0026rdquo; which provides a progressive framework to rethink cities and urbanization.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 2 is correct : \u003c/strong\u003eThe Right to the City is the right of all inhabitants (present and future, permanent and temporary) to inhabit, use, occupy, produce, transform, govern and enjoy cities, towns and human settlements that are just, inclusive, safe, sustainable and democratic, defined as common goods for enjoying life with dignity and peace.\u003c/li\u003e\r\n\t\u003cli\u003eThe right to the city further implies responsibilities on governments and people to claim, defend, and promote this right.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThis right claims for :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The social function of the city\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Quality public spaces\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Sustainable and inclusive rural-urban linkages\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Inclusive economies\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Inclusive citizenship\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Enhanced political participation\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Non-discrimination\u003c/p\u003e\r\n\r\n\u003cp\u003e8. Gender equality\u0026nbsp;and\u003c/p\u003e\r\n\r\n\u003cp\u003e9. Cultural diversity\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 3 is incorrect : \u003c/strong\u003eThe \u0026lsquo;Right to the City\u0026rsquo; does not mean the guarantee of any public service or facility to the unauthorized colonies in a city.\u003c/li\u003e\r\n\t\u003cli\u003eIt guarantees the common goods and services which are essential for the quality of life.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45037", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_ }\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to India, consider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Judicial custody means an accused is in the custody of the concerned magistrate and such accused is locked up in police station, not in Jail.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. During judicial custody, the police officer in charge of the case is not allowed to interrogate the suspect without the approval of the court.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe provisions for custody in India are governed by Section 167 of the Code of Criminal Procedure.\u003c/li\u003e\r\n\t\u003cli\u003eA person may be held in the custody of the police or in judicial custody.\u003c/li\u003e\r\n\t\u003cli\u003eThe first thing that happens to a suspect on arrest is that he is taken into police custody, following which he is taken before a magistrate.\u003c/li\u003e\r\n\t\u003cli\u003eFrom there, he may either be remanded to judicial custody or be sent back into police custody.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 1 is incorrect :\u003c/strong\u003e Police Custody means that police has the physical custody of the accused while Judicial Custody means an accused is in the custody of the concerned Magistrate.\u003c/li\u003e\r\n\t\u003cli\u003eIn Police custody, the accused is lodged in police station lockup while in Judicial Custody, he is locked up in the jail.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 2 is correct : \u003c/strong\u003eDuring Judicial Custody, the police officer in charge of the case is not allowed to interrogate the suspect.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the court may allow the interrogations to be conducted if it opines the interrogation being necessary under the facts produced before the court.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, during police custody, the police officer in charge of the case, may interrogate the suspect.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45038", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003csty ion of the sentence. The release is conditional, usually subject to behaviour, and requires periodic reporting to the authorities for a set period.\u003c/li\u003e\r\n\t\u003cli\u003eParole is not a right and is given to a prisoner for a specific reason, such as a death in the family or a wedding of a blood relative. If the competent authority is satisfied on valid grounds the release of a prisoner on parole would not be against the interest of society or the prison administration.\u003c/li\u003e\r\n\t\u003cli\u003eThe provision of Parole is a privilege/ concession but not a right of any convicted prisoner. \u003cstrong\u003eHence, Statement 1 is incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eIt may be denied to a prisoner even when he makes out a sufficient cause if the competent authority is satisfied that releasing the convict would not be in the interest of society.\u003c/li\u003e\r\n\t\u003cli\u003eParole is considered a reformative process and was introduced to humanize the prison system.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026lsquo;Prisons\u0026rsquo; is a State subject under the State List of the Seventh Schedule of the Constitution. \u003cstrong\u003eHence, Statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eAlso, The Prisons Act says that only states can make rules regarding the release of prisoners on furlough, parole, and remission, as part of the correctional process in jail reforms.\u003c/li\u003e\r\n\t\u003cli\u003eStates can make their rules on furlough, parole, and remission based on this modern prison manual.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45039", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e ities were dependent for a variety of needs, including livelihood, habitation and other socio-cultural needs.\u003c/li\u003e\r\n\t\u003cli\u003eThe Ministry of Tribal Affairs is the nodal agency to ensure effective implementation of the Scheduled Tribes and Other Traditional Forest Dwellers (Recognition of Forest Rights) Act, 2006\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45040", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 14\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 28\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 32\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 44\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA legislation which confers on the executive or administrative authority an unguided and uncontrolled discretionary power in the matter of application of law violates which one of the following Articles of the Constitution of India? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eLegislation that confers on the executive or administrative authority an unguided or uncontrolled discretionary power in the matter of the application of law or allows it to select cases violates Art. 14.\u003c/li\u003e\r\n\t\u003cli\u003eIn Jayantilal Kalidas Mehta vs The State of Maharashtra 1970 case, some sections were contended that gave unguided, uncontrolled and arbitrary powers to the collector, which were violating Article 14 of the constitution.\u003c/li\u003e\r\n\t\u003cli\u003eEvery discretionary power is not necessarily discriminatory.\u003c/li\u003e\r\n\t\u003cli\u003eEquality is not violated by mere conferment of discretionary power.\u003c/li\u003e\r\n\t\u003cli\u003eIt is violated by the arbitrary exercise of power.\u003c/li\u003e\r\n\t\u003cli\u003eThis is the theory of guided power.\u003c/li\u003e\r\n\t\u003cli\u003eIf the power is exercised arbitrarily the courts would correct it.\u003c/li\u003e\r\n\t\u003cli\u003eThe court exercises control over the delegation of discretionary powers to the administration by adjudicating upon the constitutionality of the law under which such powers are delegated concerning the fundamental rights enunciated in Part III of the Indian Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, if the law confers vague and wide discretionary power on any administrative authority, it may be declared ultra vires Article 14, Article 19, and other provisions of the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 14 of the Constitution guarantees equality before the law but the courts have permitted reasonable classification to be made.\u003c/li\u003e\r\n\t\u003cli\u003eWhere the law is valid under the article, a discriminatory action would still be violative of the equality clause. \u003cstrong\u003eHence, Option 1 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eWe can also get the right answer by using the elimination method, Art. 28, and Art.44 are unrelated to the question and Art. 32 is to protect the FR of the citizens.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45041", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe independence of judiciary is safeguarded.\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Union Legislature has elected representat s obtained the citizenship by fraud 2. he has shown disloyalty to the Constitution of India 3. he has unlawfully traded or 4. communicated with the enemy during a war; 5. he has, within five years after registration or naturalisation, been imprisoned in any country for two years; and 6. he has been ordinarily resident out of India for seven year continuously.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45045", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA committed judiciary\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u 003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following factors constitutes the best safeguard of liberty in a liberal democracy? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe separation of powers is a fundamental principle of democratic governance that divides the government into three branches:\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e1. The legislative\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Executive\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Judiciary\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eEach branch has its own distinct powers and responsibilities, which serve as a check and balance against the abuse of power.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some reasons why the separation of powers is considered the best safeguard of liberty in a liberal democracy:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Protects against tyranny :\u003c/strong\u003e When power is concentrated in one person or group, there is a risk of tyranny and abuse of power. \u2219 The separation of powers ensures that no single branch of government has too much power and that each branch can act as a check on the others.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Promotes accountability : \u003c/strong\u003eWhen power is divided among different branches of government, it makes it easier to hold each branch accountable for its actions. \u2219 This is because each branch has a specific role and responsibility, and can be held accountable for any failures or abuses of power.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3.\u0026nbsp;Ensures fairness : \u003c/strong\u003eThe separation of powers ensures that the government acts fairly and impartially without showing favoritism or bias towards any particular group or individual.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Protects individual rights : \u003c/strong\u003eThe separation of powers helps to protect individual rights and liberties by preventing the government from overstepping its bounds and infringing on those rights.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45046", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !importa rap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eParliamentary sovereignty is a principle of the UK constitution.\u003c/li\u003e\r\n\t\u003cli\u003eIt makes Parliament the supreme legal authority in the UK, which can create or end any law.\u003c/li\u003e\r\n\t\u003cli\u003eGenerally, the courts cannot overrule its legislation and no Parliament can pass laws that future Parliaments cannot change.\u003c/li\u003e\r\n\t\u003cli\u003eIndian Parliament is not a sovereign body like the British Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian Parliament may, in exercise of its constituent power, amend by way of addition, variation or repeal any provision of the Constitution in accordance with the procedure laid down for the purpose.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the Parliament cannot amend those provisions which form the \u0026lsquo;basic structure\u0026rsquo; of the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThis was ruled by the Supreme Court in the Kesavananda Bharati case (1973).\u003c/li\u003e\r\n\t\u003cli\u003eIn India, matters related to the constitutionality of an amendment of an act of the Parliament are referred to the Constitution Bench by the Supreme Court.\u003c/li\u003e\r\n\t\u003cli\u003eA Constitution Bench is a bench of the Supreme Court having five or more judges on it.\u003c/li\u003e\r\n\t\u003cli\u003eThese benches are not a routine phenomenon. A vast majority of cases before the Supreme Court are heard and decided by a bench of two judges (called a Division Bench), and sometimes of three.\u003c/li\u003e\r\n\t\u003cli\u003eConstitution Benches are set up when the case involves a substantial question of law pertaining to the interpretation of the Constitution (Article 145(3) of theConstitution, which mandates that such matters be heard by a bench of not less than five judges).\u003c/li\u003e\r\n\t\u003cli\u003ePresently, Constitution Benches are set up on an ad hoc basis as and when the need arises.\u003c/li\u003e\r\n\t\u003cli\u003eThe idea behind a Constitution Bench is clear: it is constituted in rare cases to decide important questions of fact or legal and/or constitutional interpretation.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45047", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 Only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: br  it must be pursuing a legitimate state purpose; and\u003c/li\u003e\r\n\t\u003cli\u003eThird, it must be proportionate i.e., such state action- both in its nature and extent, must be necessary in a democratic society and the action ought to be the least intrusive of the available alternatives to accomplish the ends.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45049", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 Only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 Only\u003c/p\u003e", "option_3": rtant}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Pursuant to the report of H.N. Sanyal Committee, the Contempt of Courts Act, 1971 was passed.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Constitution of India empowers the Supreme Court and the High Courts to punish for contempt of themselves.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Constitution of India defines Civil Contempt and Criminal Contempt.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. In India, the Parliament is vested with the powers to make laws on Contempt of Court.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eContempt of Courts :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA committee was set up in under the chairmanship of the late H N Sanyal, the then additional solicitor general.\u003c/li\u003e\r\n\t\u003cli\u003eThe committee made a comprehensive examination of the law and problems relating to contempt of court in the light of the position obtained in our own country and various foreign countries. Pursuant to the recommendations made by the H N Sanyal Committee, the Contempt of Courts Act, was passed.\u003c/li\u003e\r\n\t\u003cli\u003eThe Supreme Court and the High Courts of India have been empowered with the power to penalize for Contempt of Court under Articles 129 \u0026amp; 215 of the Constitution of India respectively.\u003c/li\u003e\r\n\t\u003cli\u003eThe Constitution of India does not define Civil Contempt and/or Criminal Contempt.\u003c/li\u003e\r\n\t\u003cli\u003eThe parliament is vested with powers to make laws on Contempt of Court.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45051", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow- erflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to India, consider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Government law officers and legal firms are recognised as advocates, but corporate lawyers and patent attorneys are excluded from recognition as advocates.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Bar Councils have the power to lay down the rules relating to legal education and recognition of law colleges.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct ?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn India, the term \u0026ldquo;legal professionals\u0026rdquo; refers only to those \u0026ldquo;advocates\u0026rdquo; who are law graduates and have been enrolled in state bar councils (SBCs).\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 1 is not correct: \u003c/strong\u003eAn emerging class of legal professionals engaged with various law-related activities\u0026mdash;such as government law officers, corporate lawyers, law firms, law professors, legal researchers, and patent attorneys\u0026mdash;have been excluded from recognition as advocates.\u003c/li\u003e\r\n\t\u003cli\u003eThird, the judiciary has clarified the otherwise undefined concept of \u0026ldquo;practice of law\u0026rdquo; to include all forms of legal activities, including both litigious and non-litigious work, such as appearing in court, drafting, giving opinions, performing transactional work, consulting, arbitrating, mediating, f iling vakalatnamas (power of attorney), and working as legal officers.\u003c/li\u003e\r\n\t\u003cli\u003eThus, \u0026ldquo;advocates\u0026rdquo; enrolled in bar councils enjoy exclusive monopoly over the right to practise law in all courts, tribunals, and other authorities in India.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 2 is correct:\u003c/strong\u003e The Advocates Act, 1961, enacted with the objective of creating \u0026ldquo;a unified Bar for the whole country with monopoly in legal practice and autonomy in matters of professional management,\u0026rdquo; conferred the Bar Council of India (BCI) and SBCs with the power to self-regulate the profession and lay down rules relating to admission and enrolment, conditions of practice, standards of professional conduct and etiquette, disciplinary proceedings, legal education, recognition of law colleges, and welfare activities.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45052", "image_check": "0", "image_link_1": "", "image_link  {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A bill amending the Constitution requires a prior recommendation of the President of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;When a Constitution Amendment Bill is presented to the President of India, it is obligatory for the President of India to give his/her assent.\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;A Constitution Amendment Bill must be passed by both the Lok Sabha and the Rajya Sabha by a special majority\u0026nbsp;and there is no provision for joint sitting.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct ?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe bill can be introduced either by a minister or by a private member and does not require prior permission of the president.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bill does not require prior permission of the president. An amendment of the Constitution can be initiated only by the introduction of a bill for the purpose in either House of Parliament and not in the state legislatures.\u003c/li\u003e\r\n\t\u003cli\u003eThe President can not exercise his veto powers wrt Constitution amendment bill.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eValue Addition :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIf the bill seeks to amend the federal provisions of the Constitution, it must also be ratified by the legislatures of half of the states by a simple majority, that is, a majority of the members of the House present and voting.\u003c/li\u003e\r\n\t\u003cli\u003eAfter duly passed by both the Houses of Parliament and ratified by the state legislatures, where necessary, the bill is presented to the president for assent.\u003c/li\u003e\r\n\t\u003cli\u003eThe president must give his assent to the bill. He can neither withhold his assent to the bill nor return the bill for reconsideration of the Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eAfter the president\u0026rsquo;s assent, the bill becomes an Act (i.e. a constitutional amendment act) and the Constitution stands amended in accordance with the terms of the Act.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45053", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u00 w-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Council of Ministers is a constitutional body.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 74 of the Constitution provides that there shall be a Council of Ministers with the Prime Minister at the head to aid and advise the President who shall, in the exercise of his functions, act in accordance with such advice.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, its classification is not mentioned in the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe classification of the central council of ministers into a three-tier body (Cabinet Ministers, Ministers of State, and Deputy Ministers) is based on British parliamentary conventions.\u003c/li\u003e\r\n\t\u003cli\u003eThe 91st Amendment, 2003 to the Constitution introduced Article 75(1A), which states that the Union Council of Ministers cannot exceed more than 15 percent of the number of MPs in the Lok Sabha.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45054", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !im "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following is/are the exclusive power(s) of Lok Sabha? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. To ratify the declaration of Emergency\u003c/p\u003e\r\n\r\n\u003cp\u003e2. To pass a motion of no-confidence against the Council of Ministers\u003c/p\u003e\r\n\r\n\u003cp\u003e3. To impeach the President of India\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given \u0026lsquo; below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe proclamation of Emergency must be approved by both the Houses of Parliament within one month from the date of its issue.\u003c/li\u003e\r\n\t\u003cli\u003eIf approved by both the Houses of Parliament, the emergency continues for six months, and can be extended to an indefinite period with an approval of the Parliament for every six months.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 75 (3) provides clearly that the Council of Ministers shall be collectively responsible to the House of the People.\u003c/li\u003e\r\n\t\u003cli\u003eSo, only Lok Sabha can pass a no-confidence motion against the Council of Ministers. As per Article 61, when President is to be impeached for violation of the Constitution, the charges can be initiated by either House of Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThe impeachment resolution needs to be passed by a majority of two-thirds of the total membership in each house.\u003c/li\u003e\r\n\t\u003cli\u003eThus, it is not an exclusive power of the Lok Sabha.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45055", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !im owing statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The law specifies that a nominated legislator cannot join any political party within six months of being appointed to the House.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The law does not provide any time frame within which the presiding officer has to decide a defection case.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct ?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Tenth Schedule contains the following provisions with respect to the disqualification of members of Parliament and the state legislatures on the ground of defection.\u003c/li\u003e\r\n\t\u003cli\u003eA nominated member of a House becomes disqualified for being a member of the House if he joins any political party after the expiry of six months from the date on which he takes his seat in the House.\u003c/li\u003e\r\n\t\u003cli\u003eThis means that he may join any political party within six months of taking his seat in the House without inviting this disqualification. \u003cstrong\u003eHence statement 1 is incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eAny question regarding disqualification arising out of defection is to be decided by the presiding officer of the House.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to the law, the Presiding Officers have no time limit in which to deliberate on a plea for disqualification.\u003c/li\u003e\r\n\t\u003cli\u003eThe courts can also only intervene after the officer has made a decision, therefore the petitioner\u0026rsquo;s only choice is to wait until the officer has reached a decision. \u003cstrong\u003eHence statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45056", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e* f India submits his resignation when the Government which appointed him resigns.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 76 of the constitution provides for the office of Attorney General of India and he is the highest law officer in the country.\u003c/li\u003e\r\n\t\u003cli\u003eThe Solicitor General of India assists Attorney General to fulfil his official duties and responsibilities.\u003c/li\u003e\r\n\t\u003cli\u003eIn the performance of his official duties, the Attorney General (AG) has the right of audience in all courts in the territory of India.\u003c/li\u003e\r\n\t\u003cli\u003eFurther, he has the right to speak and to take part in the proceedings of both the Houses of Parliament or their joint sitting and any committee of the Parliament of which he may be named a member, but without a right to vote.\u003c/li\u003e\r\n\t\u003cli\u003eHe enjoys all the privileges and immunities that are available to a member of Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThe Solicitor General of India is not allowed to participate in the meetings of the Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThe term of office of the AG is not fixed by the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eFurther, the Constitution does not contain the procedure and grounds for his removal.\u003c/li\u003e\r\n\t\u003cli\u003eHe holds office during the pleasure of the president. This means that he may be removed by the president at any time.\u003c/li\u003e\r\n\t\u003cli\u003eHe may also quit his office by submitting his resignation to the president. Conventionally, he resigns when the government (council of ministers) resigns or is replaced, as he is appointed on its advice.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45057", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle typ  Government Company.\u003c/p\u003e\r\n\r\n\u003cp\u003e(3) Any public minded person can, be a petitioner to move the Court to obtain the writ of Quo Warranto.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMandamus is a command issued by the court to a public official asking him to perform his official duties that he has failed or refused to perform.\u003c/li\u003e\r\n\t\u003cli\u003eIt can also be issued against any public body, a corporation, an inferior court, a tribunal, or a government for the same purpose.\u003c/li\u003e\r\n\t\u003cli\u003eIt is usually not usable against a private entity unless it is entrusted with a public duty.\u003c/li\u003e\r\n\t\u003cli\u003eAs explained above, Mandamus can be used against a government corporation and/or company.\u003c/li\u003e\r\n\t\u003cli\u003eQuo Warranto is issued by the court to enquire into the legality of the claim of a person to a public office.\u003c/li\u003e\r\n\t\u003cli\u003eHence, it prevents illegal usurpation of public office by a person.\u003c/li\u003e\r\n\t\u003cli\u003eUnlike the other writs, this can be sought by any interested person and not necessarily by the aggrieved person.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "427", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45058", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 and 4 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{ ter.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 93 provides for \u0026ldquo;The House of the People shall, as soon as may be, choose two members of the House to be respectively Speaker and Deputy Speaker thereof and, so often as the office of Speaker and Deputy Speaker becomes vacant, the House shall choose another member to be Speaker or Deputy Speaker, as the case may be.\u0026rdquo;\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 1 is correct: \u003c/strong\u003eBeing an important constitutional office, the election is usually held on next sitting after Speaker selection as President fixes date for Speaker election and after being elected the Speaker fixes the date for Deputy Speaker election \u003cstrong\u003eStatement 2 is not correct: \u003c/strong\u003eThere is no mandatory provision that the election of a candidate as Deputy Speaker of Lok Sabha shall be from either the principal opposition party or the ruling party.\u003c/li\u003e\r\n\t\u003cli\u003eIt is by convention that position of Deputy Speaker is offered to opposition party in India.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eStatement 3 is correct: \u003c/strong\u003eThe Deputy Speaker has the same power as of the Speaker when presiding over the sitting of the House and no appeal lies against his rulings.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_v
