function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

ice whereby one person might be able to vote multiple times in an election. It is not to be confused with a\u0026nbsp;plurality voting system which does not necessarily involve plural voting.\u0026nbsp;Weighted voting is a generalisation of plural voting.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44735", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3 and 4\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img { urther explain their nomenclature.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatutory Body:-\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ethey are those bodies which are created by a law passed by the parliament which explicitly mentions the objectives for creation, their composition, Powers.\u003c/li\u003e\r\n\t\u003cli\u003eSuch bodies are subject to change by a respective change in the law governing them. Other examples are - National Human Rights Commission, Lokpal, CBI, Zonal Council.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eExecutive bodies:-\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ethey are those bodies which are created by an executive order i.e. order of a ministry of union or state. Such bodies have no constitutional or law backing them. One very infamous body was Planning commission (now replaced by NITI aayog).\u003c/li\u003e\r\n\t\u003cli\u003eOther such bodies are UIDAI (Aadhar card), which when faced controversy is undergoing shift to statutory body.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e(1) The National Development Council (NDC) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was not provided for in the Constitution; it was set up by an executive order in 1952. It was meant to strengthen and mobilize the effort and resources of the nation in support of the Five-Year Plans and to promote cooperation between the Centre and the States.\u003c/li\u003e\r\n\t\u003cli\u003eSince it was created by an executive resolution (not a constitutional or statutory provision), it is called an extra-constitutional and extralegal body.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e(2) The Governors\u0026rsquo; Conference :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also an extra-constitutional and informal platform where the President and the Governors discuss national and administrative issues for better coordination between the Centre and the States.\u003c/li\u003e\r\n\t\u003cli\u003eIt has no mention in the Constitution or in any law, and therefore it is also an extra-constitutional and extralegal device for cooperation.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e(3) The Zonal Councils :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey were established under the provisions of the States Reorganisation Act, 1956, which came into effect on 1st November 1956. They were created to promote cooperation and coordination among States and between the Centre and the States \u0026mdash; especially after the reorganisation of states on a linguistic basis.\u003c/li\u003e\r\n\t\u003cli\u003eThe Zonal Councils are not mentioned anywhere in the Constitution of India. They were not created under any Article of the Constitution, but rather by an Act of Parliament (a statute). Hence, they are called extra-constitutional bodies \u0026mdash; meaning, they exist outside the framework of the Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e(4) The Inter-State Council :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a constitutional body established under Article 263 of the Indian Constitution. Its purpose is to facilitate coordination between States and between the Centre and the States.\u003c/li\u003e\r\n\t\u003cli\u003eHence, it is not extra-constitutional \u0026mdash; it is explicitly provided for in the Constitution. \u003cstrong\u003eHence the correct answer is A.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAgricultural income-tax is assigned to the State Governments by........... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1995)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Finance Commission (Article 280) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a constitutional body that recommends the distribution of financial resources between the Centre and the States \u0026mdash; such as the division of taxes and grants-in-aid. However, it does not assign taxes to either level of government.\u003c/li\u003e\r\n\t\u003cli\u003eIt only recommends how proceeds of certain central taxes (like income tax, excise, etc.) should be shared. The power to assign or allocate taxes lies directly in the Constitution itself, particularly under the Seventh Schedule.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe National Development Council (NDC) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an extra-constitutional body created in 1952 to promote cooperation between the Centre and States in planning matters.\u003c/li\u003e\r\n\t\u003cli\u003eIts main function was to discuss plans and policies for economic development, not to deal with tax assignment or revenue distribution. Therefore, the NDC has no role in assigning taxes such as agricultural income-tax.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Inter-State Council :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was established under Article 263 of the Constitution, aims to discuss, investigate, and recommend on issues of inter-State relations, coordination, and disputes. It is a deliberative and advisory body, not a fiscal or revenue-distributing body.\u003c/li\u003e\r\n\t\u003cli\u003eThe Constitution itself makes clear provisions regarding taxation powers between the Union and the States.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eUnder the Seventh Schedule, The State List (List II) includes Entry 46:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u0026ldquo;Taxes on agricultural income.\u0026rdquo; Thus, agricultural income-tax is a State subject, and the power to levy, collect, and retain this tax is assigned directly to the States by the Constitution. This means States like Tamil Nadu, Kerala, and Assam have their own Agricultural Income Tax Acts.\u003c/li\u003e\r\n\t\u003cli\u003eHence, agricultural income tax is assigned to the States not by any institution or body, but by constitutional division of powers.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": e_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following are the States in which the Lokayukta Act includes the Chief Minister in its ambit? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1995)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Chief Minister is included in the jurisdiction of the Lokayukta in the following states:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;Himachal Pradesh, Andhra Pradesh, Madhya Pradesh, Gujarat, Rajasthan, Karnataka.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Chief Minister is not included in the jurisdiction of the Lokayukta in the following states:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;Maharashtra, Uttar Pradesh, Bihar, Orissa.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Lokpal and Lokayukta Act of 2013 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt established the Lokpal and Lokayukta institutions to investigate corruption allegations against public officials. The Lokpal investigates corruption at the national level, while the Lokayukta performs the same function at the state level.\u003c/li\u003e\r\n\t\u003cli\u003eThe Act requires each state to appoint a Lokayukta, similar to the Lokpal, to investigate corruption complaints against government officers. The institution should have both judicial and non-judicial members.\u003c/li\u003e\r\n\t\u003cli\u003eThe Lokayukta has a fixed tenure and must perform its functions independently and impartially. In most states, the Lokayukta\u0026rsquo;s term of office is five years or 65 years of age, whichever is earlier. The Lokayukta can initiate an investigation against the Chief Minister with the Assembly\u0026rsquo;s prior approval.\u003c/li\u003e\r\n\t\u003cli\u003eThe Act\u0026rsquo;s objective is to check corruption in India. It provides an effective way to counter corruption at all levels of government and brings transparency and accountability to the system.\u003c/li\u003e\r\n\t\u003cli\u003eIn 2022, Maharashtra became the first state to pass the Lokayukta Bill, which brings the Chief Minister and council of ministers under the ambit of the anti-corruption ombudsman.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bill gives additional powers to the Lokayukta to direct state agencies to probe public servants, including the Chief Minister and state ministers.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44748", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c onal jurisdiction\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe power of the Supreme Court of India to decide disputes between the Centre and the States falls under its........ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Supreme Court of India\u0026rsquo;s power to decide disputes between the Centre and the States is covered under its \u0026ldquo;original jurisdiction\u0026rdquo;. This is according to Article 131 of the Constitution of India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Supreme Court has six types of jurisdiction:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Original\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Appellate\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Advisory\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Review\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Inherent\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Extraordinary.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. \u0026ldquo;Original jurisdiction\u0026rdquo; ;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;It refers to the power of a court to hear a case first, before any other court. It means the power to hear and determinea dispute in the first instance.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The Supreme Court (SC) has original jurisdiction to decide disputes arising between different units of the Indian Federation.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThis includes:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Centre and one or more states\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Centre and any state(s) on one side and one or more states on the other\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Two or more states\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Supreme Court of India is the final authority to ensure that the division of powers as specified in the constitution is obeyed by both the Union and the State governments.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Advisory Jurisdiction :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Supreme Court\u0026rsquo;s advisory jurisdiction is when a constitutional body or lower court seeks advice from a higher court on a legal matter.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 143 of the Indian Constitution gives the Supreme Court advisory jurisdiction. This allows the President to ask for the Supreme Court\u0026rsquo;s opinion on any issue of law or matter of public importance.\u003c/li\u003e\r\n\t\u003cli\u003eFor example, the President can ask the Court\u0026rsquo;s opinion on treaties and agreements made before the Constitution was framed. The views taken by the Court are not binding on the President and it is not law within Article 141.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Appellate Jurisdiction :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Supreme Court of India has a broad appellate jurisdiction over all courts and tribunals in the country. This means that the Supreme Court can review appeals from lower courts and change or review the decisions made by those court.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Inherent jurisdiction :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a legal term that refers to a court\u0026rsquo;s power to make decisions when there is no specific law or statute that addresses the issue. It\u0026rsquo;s a broad doctrine that allows a court to control its own processes and procedures.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Review Jurisdiction :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to Article 137 of the Constitution of India, the Supreme Court has the power to review any of its judgments or orders. The Supreme Court\u0026rsquo;s review powers enable it to modify a judgment suffering from mistakes.\u003c/li\u003e\r\n\t\u003cli\u003eParties who are dissatisfied by the outcome of a Supreme Court judgment, can seek a review of it under Article 137 of the Constitution. A review petition must be filed within 30 days of pronouncement of the judgement.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Extraordinary jurisdiction :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a power that allows the Supreme Court of India to grant special leave to appeal from any judgment, decree, determination, sentence, or order passed by any court or tribunal in the territory of India. This power is not limited to any particular subject matter or court.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44749", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e21\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e14\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break ms\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to the Constitution of India, the term \u0026ldquo;district judge\u0026rdquo; does not include a tribunal judge. Tribunal judges oversee specific areas of law and handle specialized or technical matters. Their activities are not confined to a specific geographical jurisdiction like a district.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to the Constitution of India, a person to be eligible for appointment as a District Judge should be an advocates or a pleader of seven years\u0026rsquo; standing or more.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTribunals in India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are quasi-judicial bodies that resolve disputes related to administration, taxation, environment, and securities. They are adjudicatory bodies that serve as an alternative to the traditional court system.\u003c/li\u003e\r\n\t\u003cli\u003eTribunals are established by law and are intended to provide a faster adjudication platform than traditional courts. They also provide expertise on certain subject matters.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome examples of tribunals in India include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Central Administrative Tribunal (CAT)\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Income Tax Appellate Tribunal (ITAT)\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Customs, Excise and Service\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Tax Appellate Tribunal (CESTAT)\u003c/p\u003e\r\n\r\n\u003cp\u003e5. National Green Tribunal (NGT)\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Competition Appellate Tribunal\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Debts Recovery Tribunal\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eTribunals have certain powers, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Discovery and production of documents\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Reception of evidence on affidavits\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Requisitioning of public records from any court or office\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Issuing of any commission for the examination of witnesses.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Tribunal Reforms Bill, 2021 was passed in both Houses of the Parliament in August 2021. The bill replaced the ordinance which had been introduced in February 2021.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSessions judge :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHe is a judge who presides over a sessions court. The sessions court is the most powerful court in a district for criminal cases.\u003c/li\u003e\r\n\t\u003cli\u003eThe district and sessions judge is often referred to as \u0026ldquo;district judge\u0026rdquo; when presiding over civil matters and \u0026ldquo;sessions judge\u0026rdquo; when presiding over criminal matters. The district and sessions judge works directly under the control of the governor of the state.\u003c/li\u003e\r\n\t\u003cli\u003eThe CrPC enables sessions judges to pass any sentence authorized by law. The high court may appoint a sessions judge of one sessions division to also be an additional sessions judge of another division.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subjec nd 3 are correct\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone is correct\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: No one can be compelled to sing the National Anthem since........... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It will be violative of the Right to freedom of speech and expression.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It will be violative of the Right to freedom of conscience and practise and propagation of religion.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. There is no legal provision obliging any one to sing the National Anthem.\u003c/p\u003e\r\n\r\n\u003cp\u003eOf these statements\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 19(1)(a) of the Constitution guarantees the freedom of speech and expression. The right includes the freedom not to speak or express oneself.\u003c/li\u003e\r\n\t\u003cli\u003eForcing someone to sing would be a violation of this freedom. The Court observed that remaining silent during the anthem as a matter of conscience is also a form of expression protected by Article 19(1)(a).\u003c/li\u003e\r\n\t\u003cli\u003eArticle 25 protects the freedom of conscience and the right to freely profess, practice, and propagate religion.\u003c/li\u003e\r\n\t\u003cli\u003eIn the Bijoe Emmanuel case, the Court recognised that the students\u0026rsquo; refusal to sing was based on sincere religious belief, not disrespect. Therefore, compelling them to sing would violate their freedom of conscience and religion.\u003c/li\u003e\r\n\t\u003cli\u003eThere is no law in India\u0026mdash;including the Prevention of Insults to National Honour Act, 1971\u0026mdash;that makes it mandatory for anyone to sing the National Anthem. The law only prohibits intentional disrespect (such as insulting gestures or acts) during its playing or singing.\u003c/li\u003e\r\n\t\u003cli\u003eThus, standing respectfully without singing is fully lawful and acceptable. All three statements (1, 2, and 3) are correct.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44756", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth A and R are true and R is the correct explanation of A\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle tyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe 73rd Amendment of the Indian Constitution : It was passed in 1992 and came into effect on April 24, 1993. The amendment added Part IX to the Constitution, \u0026ldquo;The Panchayats\u0026rdquo;, and the Eleventh Schedule. The Eleventh Schedule contains 29 functional items of the panchayats.\u003c/li\u003e\r\n\t\u003cli\u003eThe amendment empowers state governments to formalize gram panchayats and help them operate as units of self governance. It also provides constitutional sanction to establish \u0026ldquo;democracy at the grassroots level as it is at the state level or national level\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe amendment includes the following provisions:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Reservations of at least one-third of the total number of seats for scheduled castes and scheduled tribes in every panchayat\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The chairperson of panchayats at the intermediate and district levels shall be elected directly by the people\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe amendment does not apply to the states of Nagaland, Meghalaya, and Mizoram and certain other areas.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 74th Constitutional Amendment Act (74th CAA) of 1992 came into effect on June 1, 1993 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Nagarpalika Act. The 74th CAA provides a framework for decentralizing powers and authorities to municipal bodies at different levels. It also introduced the concept of local self government and municipality in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe 74th CAA provides constitutional status to Urban Local Bodies (ULBs). It also established two new tiers of government at the local level: the Panchayat Raj and the Nagar Palika.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome provisions of the 74th CAA include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Seats for SC and ST are reserved in proportion to their population.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Women are allocated 1/3 of the total number of seats.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe state legislature has the authority to adopt any provision for backward-class reservation in municipalities at any level.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44762", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe United Kingdom\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img { _image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe concept of Public Interest Litigation originated in........... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1997)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe concept of Public Interest Litigation (PIL) originated in the United States in the 1960s. The term PIL became popular in the mid-1980s.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePublic Interest Litigation (PIL) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a legal action filed in the Indian courts to protect the public\u0026rsquo;s rights and promote the general welfare. The concept of PIL originated from the power of judicial review.\u003c/li\u003e\r\n\t\u003cli\u003eTo file a PIL, the petitioner must be acting in good faith and have a legitimate stake in the outcome of the case. The court may also exercise suo moto cognizance. The concept of \u0026ldquo;Locus Standi\u0026rdquo; has been relaxed in the case of PILs.\u003c/li\u003e\r\n\t\u003cli\u003eThis allows the court to look into grievances filed on behalf of those who are poor, illiterate, deprived, or disabled and are unable to approach the courts themselves.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThere are two types of PIL:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Representative Social Action\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Citizen Social Action Justice Bhagwati, who was Chief Justice of India from 1985 to 1986, is known as the father of PIL in India.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome examples of successful PIL cases include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Bonded labor\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Neglected children\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Exploitation of temporary workers\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Brutal acts against women\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Environmental pollution\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Food adulteration\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Preservation of culture and legacy\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Supreme Court of India has the discretionary authority to issue any decrees or orders that may be required to provide full justice.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44763", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u00 img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth A and Rare true, but R is not a correct explanation of A\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA is true, but R is false\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA is false, but R is true\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A) : Willful disobedience or noncompliance of Court Orders and use of derogatory language about judicial behaviour amounts to Contempt of Court.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R) : Judicial activism cannot be practised without arming the judiciary with punitive powers to punish contemptuous behaviour.\u003c/p\u003e\r\n\r\n\u003cp\u003eIn the context of the above two statements, which one of the following is correct?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;1997)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eContempt of court is a crime that involves disrespecting or disobeying a court of law and its officers. It can also include conduct that interferes with the orderly administration of justice.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eExamples of contempt of court include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Disrupting court proceedings\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Interfering with attempts to obtain evidence\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Destroying evidence\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Disobeying a court order\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Intimidating witnesses\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Being impolite to legal authorities in the courtroom\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Rebelliously failing to follow a court order\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn India, the Parliament has the power to make laws on contempt of court. The Contempt of Courts Act, 1971 defines contempt of court as civil contempt or criminal contempt.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eCivil contempt of court :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt occurs when someone fails to comply with a court order, which can harm the justice system or a private individual or party.\u003c/li\u003e\r\n\t\u003cli\u003eCivil contempt of court carries quasi-criminal penalties, rather than direct criminal penalties. Criminal contempt of court is behavior that disrespects, offends, or disobeys the authority of a court. It can occur directly or indirectly, in the presence of the court or outside of it.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some examples of criminal contempt of court:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Insulting the judge\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Creating a disturbance at trial\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Disrupting court proceedings\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Interfering with attempts to obtain evidence\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eCriminal contempt can also include any act or publication that:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Scandalizes the court\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Prejudices any judicial proceeding\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Interferes with the administration of justice in any other manner\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eJudicial activism :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a legal term that describes when judges make rulings based on their personal or political views, rather than on current legislation.\u003c/li\u003e\r\n\t\u003cli\u003eIt can also refer to when judges let their personal feelings influence a conviction or sentence. Judicial activism is a controversial topic.\u003c/li\u003e\r\n\t\u003cli\u003eSome opponents say it overrides the federal government\u0026rsquo;s checks and balances. The phrase \u0026ldquo;judicial activism\u0026rdquo; may have been coined by American historian Arthur M. Schlesinger, Jr. in a 1947 article.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44773", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSecond Schedule\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following Schedules of the Constitution of India contains provisions regarding Anti-Defection Act? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1998)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. The Tenth Schedule of the Constitution of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Anti-Defection Law, contains provisions regarding anti defection. The 52nd Constitutional Amendment Act of 1985 added the Tenth Schedule to the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe Anti-Defection Law aims to prevent political defections, which can undermine the principles of Indian democracy. The law disqualifies legislators who violate the will of their political party.\u003c/li\u003e\r\n\t\u003cli\u003eIt also aims to strengthen democracy by making parliamentarians more loyal to the political parties they were aligned with when elected.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Anti-Defection Law disqualifies elected members who:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Voluntarily join a party other than their own\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Vote against any direction issued by their political party, unless they have prior permission from the party\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Speaker or Chairman of the respective Legislative house decides on disqualification arising out of defection.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. The Second Schedule of the Indian Constitution :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIt covers the allowances, privileges, and emoluments of the following:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The President of India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Governors of Indian States\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Speaker of Lok Sabha and Deputy Speaker of Lok Sabha\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The Chairman of Rajya Sabha and Deputy Chairman of Rajya Sabha\u003c/p\u003e\r\n\r\n\u003cp\u003e5. The Speaker and Deputy Speaker of Legislative Assemblies of Indian States\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;The Second Schedule also includes provisions for the President, Vice President, Council of Ministers, and more.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. The Fifth Schedule of the Indian Constitution :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt deals with the management and administration of Scheduled Areas and Scheduled Tribes where tribal communities are in a majority. The Fifth Schedule aims to hold the state accountable for the advancement of tribals\u0026rsquo; educational and economic objectives.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Fifth Schedule protects tribal interests in the states of:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAndhra Pradesh, Telangana, Gujarat, Jharkhand, Chhattisgarh, Himachal Pradesh, Madhya Pradesh, Maharashtra, Odisha, Rajasthan.\u003c/li\u003e\r\n\t\u003cli\u003eThe Fifth Schedule does not apply to the states of Assam, Meghalaya, Tripura, and Mizoram.\u003c/li\u003e\r\n\t\u003cli\u003eTribal advisory councils (TACs) are constitutional bodies formed under the Fifth Schedule to deal with welfare and advancement of scheduled tribes in states.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. The Sixth Schedule of the Indian Constitution :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a special provision that allows for the administration of tribal areas in Assam, Meghalaya, Tripura, and Mizoram. xThe Sixth Schedule was enacted in 1949 to protect indigenous and tribal groups.\u003c/li\u003e\r\n\t\u003cli\u003eThe Sixth Schedule allows for the creationof autonomous District Councils (ADCs) in certain tribal areas. These ADCs have the power to make laws on a range of subjects, including land allotment, water course use, and property inheritance.\u003c/li\u003e\r\n\t\u003cli\u003eThe administrative powers and functions of these District Councils and Regional Councils vary from state to state. Most of these autonomous district councils are located in North East India, with the exception of two in Ladakh and one in West Bengal.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. The Eighth Schedule of the Constitution of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt lists the official languages of the Republic of India. The Eighth Schedule originally included 14 languages, but the 71st Amendment in 1992 added three more languages, and the 92nd Amendment in 2003 added four more languages.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 22 languages included in the Eighth Schedule are:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAssamese, Bengali, Gujarati, Hindi, Kannada, Kashmiri, Konkani, Malayalam, Manipuri, Marathi, Nepali, Oriya, Punjabi, Sanskrit, Sindhi, Tamil, Telugu, Urdu, Bodo, Santhali, Maithili, Dogri.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Eighth Schedule also includes constitutional provisions relating to other languages, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAngika, Banjara, Bazika, Bhojpuri, Bhoti, Bhotia, Bundelkhandi, Chhattisgarhi, Dhatki.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44774", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026nbsp;Rajasthan\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/ ine the constitutionality of any law or action. If the court finds that a law or action is inconsistent with the Constitution, it can declare it unconstitutional and inapplicable.\u003c/li\u003e\r\n\t\u003cli\u003eThe concept of judicial review originated in the United States and was adapted for India. It was first established in India in the 1951 case of Shankari Prasad v. Union of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe judiciary is one of three organs of government in India, along with the legislature and the executive. The legislature makes laws, the executive implements them, and the judiciary ensures that the laws are not in conflict with the Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBicameral legislature :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a law-making body with two separate assemblies, chambers, or houses. The two assemblies must agree when new laws are made.\u003c/li\u003e\r\n\t\u003cli\u003eBicameral legislatures are more common in federal, large, and presidential states.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome examples of countries with bicameral legislatures include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe United States, Australia, Brazil, Canada, Germany, India.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44776", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\" 6rsquo;t define the term \u0026ldquo;minority\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, Article 29 of the Constitution grants protection to religious and linguistic minorities. It also states that any section of citizens in India with a distinct language, script, or culture have the right to preserve it.\u003c/li\u003e\r\n\t\u003cli\u003eLinguistic minorities are defined as those who live in India, or any part of it, and have a distinct language or script. Articles 350A and 350B define linguistic minorities.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe six religions in India that have been given minority status are:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1 Muslims\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Christians\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Sikhs\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Jains\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Buddhists\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Zoroastrians.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44778", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements about the recent amendments to the Election Law by the Representation of the People (Amendment) Act, 1996..............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1999)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e(1) Any conviction for the offence of insulting the Indian National flag or the Constitution of India shall entail disqualification for contesting elections to Parliament and State Legislatures for six years from the date of conviction.\u003c/p\u003e\r\n\r\n\u003cp\u003e(2) There is an increase in the security deposit which a candidate has to make to contest the election to the Lok Sabha.\u003c/p\u003e\r\n\r\n\u003cp\u003e(3) A candidate cannot now stand for election from more than one Parliamentary constituency.\u003c/p\u003e\r\n\r\n\u003cp\u003e(4) No election will now be countermanded on the death of a contesting candidate.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Representation of the People (Amendment) Act, 1996 introduced a new provision stating that anyone convicted under the Prevention of Insults to National Honour Act, 1971 (which penalizes insult to the national flag or Constitution) will be disqualified for six years from the date of conviction from contesting elections to Parliament or State Legislatures. This amendment was meant to uphold the dignity of national symbols. \u003cstrong\u003eThus, statement 1 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe 1996 Amendment Act increased the security deposit amounts for contesting elections to both the Lok Sabha and State Legislative Assemblies. This was done to discourage non-serious candidates from filing nominations.\u003c/li\u003e\r\n\t\u003cli\u003eFor example, the Lok Sabha deposit was raised from \u20b9500 to \u20b910,000 for general candidates, and from \u20b9250 to \u20b95,000 for Scheduled Castes/Scheduled Tribes candidates. \u003cstrong\u003eThus, statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThis statement is wrong because the 1996 amendment did not prohibit multiple constituency contests. A candidate was still allowed to contest from a maximum of two constituencies (as per Section 33(7) of the Representation of the People Act, 1951).\u003c/li\u003e\r\n\t\u003cli\u003eThe restriction to only one constituency came much later \u0026mdash; it has been recommended by the Election Commission but not implemented in the 1996 amendment. \u003cstrong\u003eSo, statement 3 is incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eBefore the 1996 amendment, if a candidate died after nominations were finalized, the election was countermanded (cancelled) and re-conducted later.\u003c/li\u003e\r\n\t\u003cli\u003eThe 1996 amendment changed this rule, stating that elections would no longer be countermanded on the death of a candidate; instead, the poll would continue with the remaining candidates. This ensured that elections would not be delayed unnecessarily.\u003cstrong\u003e Thus, statement 4 is correct.\u003c/strong\u003e \u003cstrong\u003eTherefore the correct answer is B.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44779", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 alone\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r
