: "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe purpose of the inclusion of Directive principles of state policy in Indian Constitution is to establish............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Directive Principles of State Policy (DPSP) are included in the Indian Constitution to establish social and economic democracy. The principles aim to establish a welfare state where citizens are guaranteed basic rights and are protected from exploitation.\u003c/li\u003e\r\n\t\u003cli\u003eThe DPSP are mentioned in Part IV of the Indian Constitution, from Article 36 to Article 51. They are different from fundamental rights, which are enforceable by the courts.\u003c/li\u003e\r\n\t\u003cli\u003eThe DPSP are not enforceable by the courts, but they are considered to be important. They are instructions to the government to take positive action.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe DPSP are classified into three categories:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Socialist principles\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Liberal and intellectual principles\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Gandhian principles\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome examples of the DPSP include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Article 40: \u003c/strong\u003eOrganize village panchayats to function as units of self-government\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Article 44:\u003c/strong\u003e Secure a uniform civil code for all citizens\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Article 45:\u003c/strong\u003e Provide early childhood care and education for all children until they are six years old\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe DPSP also include Articles 23 and 24, which protect children from trafficking, forced labor, and hazardous work. Articles 39, 41, 45, and 46 also require the state to work for children\u0026rsquo;s welfare.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44810", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cs option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements with reference to India..........\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Chief Election Commissioner and other Election Commissioners enjoy equal powers but receive unequal salaries\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Chief Election Commissioner is entitled to the same salary as in provided to a judge of the Supreme Court\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Chief Election Commissioner shall not be removed from his office except in like manner and on like grounds as a judge of the Supreme Court\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The term of office of the Election Commissioner is five years from the date he assumes his office or till the day he attains the age of 62 years,\u003c/p\u003e\r\n\r\n\u003cp\u003ewhichever is earlier Which of these statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Correct Answer is (b) 2 and 3.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 324 of the Constitution provides that the power of superintendence, direction and control of elections to parliament, state legislatures, the office of president of India and the office of vicepresident of India shall be vested in the election commission.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eArticle 324 of the Constitution has made the following provisions with regard to the composition of the election commission:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Election Commission shall consist of the chief election commissioner and such number of other election commissioners, if any, as the president may from time to time fix. The appointment of the chief election commissioner and other election commissioners shall be made by the president.\u003c/li\u003e\r\n\t\u003cli\u003eThe chief election commissioner and the two other election commissioners have equal powers and receive equal salaries, allowances and other perquisites, which are similar to those of a judge of the Supreme Court. They hold office for a term of six years or until they attain the age of 65 years, whichever is earlier.\u003c/li\u003e\r\n\t\u003cli\u003eThe chief election commissioner is provided with the security of tenure. He cannot be removed from his office except in same manner and on the same grounds as a judge of the Supreme Court.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44811", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_ reak-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Indian Polity, which one of the following statements is correct? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe correct statement among the given options is (b) President can make ordinance only when either of the two Houses of Parliament is not in session.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe explanation for this statement is given below:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Planning Commission:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a non constitutional and non-statutory body that was responsible for formulating five-year plans for socio-economic development of the country. It was replaced by NITI Aayog in 2015. It was not accountable to Parliament as it was not a constitutional body.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. President can make ordinance:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe President of India has the power to promulgate ordinances (temporary laws) when either of the two Houses of Parliament is not in session.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the ordinance must be approved by the Parliament within six weeks of reassembling. If the Parliament fails to do so, the ordinance becomes void.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Minimum age for a Supreme Court Judge:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to Article 124 of the Constitution of India, a person can be appointed as a Judge of the Supreme Court only if he/she is a citizen of India and has been a judge of a High Court or two or more such courts in succession for at least five years or has been an advocate of a High Court or two or more such courts in succession for at least ten years. There is no minimum age prescribed for appointment as a Judge of the Supreme Court.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. National Development Council:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was a constitutional body that was constituted of the Prime Minister, Union Cabinet Ministers, Chief Ministers of all States and Union Territories, and members of the Planning Commission. It was responsible for formulating and reviewing development plans and policies. However, it was replaced by the Governing Council of NITI Aayog in 2015.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44813", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:10 3e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Finance Commission recommends the principles governing the grants-in aid of the revenues to the states out of the Consolidated Fund of India. The President of India constitutes the Finance Commission every five years or earlier if necessary.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Commission\u0026rsquo;s duties include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Recommending the distribution of tax revenues between the Union and the States\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Recommending the principles governing the grants-in-aid of the revenues of the States\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Recommending measures to increase the resources of the State\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA grant-in-aid is money from a central or state government for a specific project. The government and legislature usually decide that the recipient should be publicly funded but operate independently from the state.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Inter-State Council :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a body that promotes collaboration and cooperation between central and inter-state activities. It was established in 1990 under Article 263 of the Constitution of India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe council\u0026rsquo;s role is to:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Investigate and discuss issues of common interest between the Union and states, or among states\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Identify and investigate possible problems between states\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Share solutions to conflicts\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe council is made up of the Prime Minister as chairman and the Chief Ministers of all states as members. The council has met 12 times since its inception.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, some say the council lacks the technical and management experts and autonomy needed for effective functioning. Others say the council is less participatory and cooperative because civil society is not present or engaged.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Union Ministry of Finance:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt implements the financial recommendations and manages the actual disbursement of funds, but it does not decide or recommend the principles of grants-in-aid.\u003c/li\u003e\r\n\t\u003cli\u003eIt acts as the executive body that executes the financial arrangements approved by the Parliament or recommended by the Finance Commission. So, it only manages the money, not the principles of its distribution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Public Accounts Committee (PAC) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a committee of members of parliament that audits the revenue and expenditure of the Government of India. The committee is constituted by the Parliament of India each year.\u003c/li\u003e\r\n\t\u003cli\u003eThe PAC\u0026rsquo;s main function is to examine the audit report of the Comptroller and Auditor General (CAG) and submit its report to the parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThe committee also examines the value for money of public spending and holds the government and its civil servants accountable for the delivery of public services.\u003c/li\u003e\r\n\t\u003cli\u003eThe PAC is made up of 22 members, 15 of whom are elected by the Lok Sabha and 7 of whom are appointed by the Rajya Sabha. Every member of Parliament elected in both the Lok Sabha and the Rajya Sabha serves on the committee for a year.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44814", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e39th\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e40th\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e42nd\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e44th\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following amendments to the Indian Constitution empowers the President to send back any matter for reconsideration by the Council of Ministers? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe 44th Amendment to the Indian Constitution, passed in 1978, gives the President the power to send matters back to the Council of Ministers for reconsideration. This amendment also restored certain fundamental rights that were suspended during the Emergency period (1975-77).\u003c/li\u003e\r\n\t\u003cli\u003eThe 44th Amendment states that the President can send advice back for reconsideration once. If the Council of Ministers sends the same advice again, the President must accept it. The 44th Amendment also protects individuals from the future tendency of the majority to grant rights.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 39th Amendment of the Constitution of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as The Constitution (Thirty Ninth Amendment) Act, 1975, was enacted on August 10, 1975. The amendment was passed during the Emergency of 1975 1977.\u003c/li\u003e\r\n\t\u003cli\u003eThe amendment made the election of the President, the Vice President, the Prime Minister, and the Speaker of the Lok Sabha beyond the scrutiny of the Indian courts.\u003c/li\u003e\r\n\t\u003cli\u003eIt also granted the Prime Minister immunity from the electoral laws applicable prior to the amendment. The amendment was passed in response to the Allahabad High Court\u0026rsquo;s judgment which had quashed Mrs. Indira Gandhi\u0026rsquo;s election on grounds of electoral malpractice.\u003c/li\u003e\r\n\t\u003cli\u003eThe Supreme Court declared the amendment unconstitutional in the Keshvananda Bharti Case and the Menaka Gandhi Case.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 40th Amendment of the Indian Constitution :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was enacted in 1976 and went into effect on May 27, 1976. The amendment gave Parliament the power to define India\u0026rsquo;s territorial seas, continental shelf, exclusive economic zone (EEZ), and maritime zones. It also amended article 297 of the Constitution to state that all lands, minerals, and other resources within the EEZ belong to the Union.\u003c/li\u003e\r\n\t\u003cli\u003eThe 40th Amendment also included 64 additional central and state laws related to land reforms. These laws were part of the ninth schedule of the amendment. The 42nd Amendment of the Indian Constitution was passed in 1976 during a period of emergency in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe 42nd Amendment gave primacy to the Directive Principles, by stating that \u0026ldquo;no law implementing any of the Directive Principles could be declared unconstitutional on the grounds that it violated any of the Fundamental Rights\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe amendment made several changes to the constitution, including: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Changing the description of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe amendment changed the description of India from a \u0026ldquo;sovereign democratic republic\u0026rdquo; to a \u0026ldquo;sovereign, socialist secular democratic republic\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Adding new terms :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe amendment introduced the terms \u0026ldquo;Integrity\u0026rdquo;, \u0026ldquo;Socialist\u0026rdquo;, and \u0026ldquo;Secular\u0026rdquo; to the constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Reorganizing the Seventh Amendment :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe amendment reorganized the Seventh Amendment to move subjects like education, forestry, and wildlife protection from the State list to the Concurrent list.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Limiting the powers of the court :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe amendment denied the Supreme Court the power to consider the constitutional validity of state law. It also granted the Supreme Court the exclusive jurisdiction to determine the constitutional validity of central law.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Making the President bound by the advice of the Cabinet :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe amendment made the President bound by the advice of the Cabinet.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Adding new principles of state policy : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe amendment added four new principles of state policy, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003ei) Ensuring opportunities for the healthy development of children\u003c/p\u003e\r\n\r\n\u003cp\u003eii) Promoting equal justice and providing free legal aid to the poor\u003c/p\u003e\r\n\r\n\u003cp\u003eiii) Ensuring the participation of workers in the management of industries\u003c/p\u003e\r\n\r\n\u003cp\u003eiv) Protecting and improving the environment and safeguarding forests and forest animals.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Adding fundamental duties of citizens :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe amendment added ten fundamental duties of citizens to the Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44815", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u \u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Article 15: \u003c/strong\u003eProhibition of discrimination\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Article 16:\u003c/strong\u003e Equality of opportunity in matters of public employment\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Article 17:\u003c/strong\u003e Abolition of untouchability\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Article 18: \u003c/strong\u003eAbolition of titles\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticles 14, 15, and 16 represent the general principles of equality before law and non discrimination. Articles 17 and 18 seek to further the cause of social equality.\u003c/li\u003e\r\n\t\u003cli\u003eThe right to equality is a fundamental principle that ensures fairness and equal treatment for all. It means that every individual, regardless of their background, should be treated the same under the law.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44816", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ecannot be extended under any circumstances\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle typ e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe 93rd Amendment Act of 2005 to the Indian Constitution added a clause to Article 15. This clause allows the government to make special provisions for the advancement of socially and educationally backward classes of citizens. This includes the scheduled castes and scheduled tribes.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 93rd Amendment Act also:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Provides for the admission of backward classes in educational institutions\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Makes free and compulsory education for children between the ages of 6 and 14, a fundamental right\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Brings private colleges and unaided education institutions under the government\u0026rsquo;s reservation policy\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe 93rd Amendment Act was passed by Parliament in 2006.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44819", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 142\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img { w-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following High Courts has the Territorial Jurisdiction over Andaman and Nicobar Islands? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2003)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Calcutta High Court has jurisdiction over the Andaman and Nicobar Islands. The Calcutta High Court is India\u0026rsquo;s oldest high court, established in 1862. It also has jurisdiction over the state of West Bengal. The Indian Constitution\u0026rsquo;s Articles 214\u0026ndash;231 cover the High Courts, their organization, and powers.\u003c/li\u003e\r\n\t\u003cli\u003eIndia has 25 High Courts. These courts are the highest courts in their respective states and union territories. They have jurisdiction over all civil and criminal matters within their jurisdiction. The oldest High Courts in India are Bombay, Madras, and Kolkata, established in 1862. The newest High Courts are Andhra Pradesh and Telangana, established in 2019.\u003c/li\u003e\r\n\t\u003cli\u003eThree High Courts have jurisdiction over more than one state. The Union Territories of Delhi, Jammu \u0026amp; Kashmir, and Ladakh have their own High Courts. The other five Union Territories come under the jurisdiction of different State High Courts.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some high courts in India and the states they cover:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Kerala High Court: \u003c/strong\u003eThe highest court for the state of Kerala, and also decides cases from the Union Territory of Lakshadweep.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Madras High Court: \u003c/strong\u003eThe high court of the Indian state of Tamil Nadu.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Punjab and Haryana High Court:\u003c/strong\u003e A common institution that caters to both these states.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Bombay High Court:\u003c/strong\u003e Has jurisdiction over the Indian states of Maharashtra, Goa, and the Union Territories of Daman and Diu and Dadra and Nagar Haveli.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. Karnataka High Court: \u003c/strong\u003eThe highest court of judicature in the state.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Chhattisgarh High Court: \u003c/strong\u003eHas jurisdiction over the state of Chhattisgarh.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Kolkata High Court : \u003c/strong\u003eThe court\u0026rsquo;s jurisdiction covers the state of West Bengal and the Union Territory of the Andaman and Nicobar Islands.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e8. Guwahati High Court :\u003c/strong\u003e Has jurisdiction over the following states:\u0026nbsp;Assam, Arunachal Pradesh, Nagaland, Mizoram.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44821", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img { 0% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2003)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1 The joint sitting of the two houses of the Parliament in India is sanctioned under Article 108 of the Constitution\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The first joint sitting of Lok Sabha and Rajya Sabha was held in the year 1961\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The second joint sitting of the two Houses of Indian Parliament was held to pass the Banking Service Commission (Repeal) Bill\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of these statements is/are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA joint sitting of Parliament is a constitutional provision that resolves a deadlock between the two Houses of Parliament over Ordinary or Finance bill. Joint sittings cannot be held for money bills or constitutional amendment bills.\u003c/li\u003e\r\n\t\u003cli\u003eThe President of India can call a joint sitting of Parliament, and the Speaker of the Parliament presides over it.\u003c/li\u003e\r\n\t\u003cli\u003eThe first joint sitting of the Indian Parliament was held on May 18, 1961 to consider the Dowry Prohibition Bill.\u003c/li\u003e\r\n\t\u003cli\u003eThe joint sitting was called because there was a disagreement between the Lok Sabha and Rajya Sabha over some amendments to the bill.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eA joint session can be summoned when:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. One House passes a bill and transmits it to the other House\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The other House rejects the bill\u003c/p\u003e\r\n\r\n\u003cp\u003e3. An ordinary bill has been rejected by any house of the parliament and if more than six months have elapsed\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe bill is passed by a simple majority of a joint sitting.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAs of July 31, 2023, a joint session has been called only three times:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Dowry Prohibition Act, 1961\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Banking Service Commission Act (Repeal), 1978\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Prevention of Terrorism Act, 2002\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44824", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eFirst Amendment\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEighth Amendment\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"tex ge_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following Articles of the Indian Constitution provides that \u0026lsquo;It shall be the duty of the Union to protect every State against external agression and internal disturbance? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2003)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 355 of the Indian Constitution states that it is the Union\u0026rsquo;s duty to protect every state from internal disturbance and external aggression. The article also states that the Union must ensure that the government of each state is carried out in accordance with the provisions of the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 355 also allows the extension of the Union\u0026rsquo;s executive powers in any state. It also states that the powers of the state legislature can be exercised by or under the authority of the parliament.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 325 of the Indian Constitution states that no one can be excluded from a special electoral roster based on caste, race, religion, or sex. This means that everyone is eligible for inclusion in a special electoral roll for any constituency.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 275 of the Constitution of India provides grants-in-aid to states that Parliament determines are in need of assistance. The grants are paid out of the Consolidated Fund of India each year, and different sums may be fixed for different states. The primary purpose of Article 275 is to promote the welfare of the Scheduled Tribes in that State or raise the administration level of the Scheduled Areas.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 215 of the Constitution of India states that every High Court is a court of record. This means that High Courts have the power to correct records, including reviewing their own judgments and orders. This power also includes correcting errors that are apparent on the face of the records.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44826", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\ % !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatement 1 is incorrect.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe value of the vote of an elected Member of Legislative Assembly (MLA) in the electoral college for the Presidential Election in India is not determined by the state\u0026rsquo;s population divided by the number of elected MLAs.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eThe value of the vote of an MLA is determinedby the formula: \u003c/strong\u003eTotal Value of MLAs\u0026rsquo; Votes = State Population / (Number of Elected MLAs of the state X 1000). The population of the state is divided by the total number of elected MLAs in the state multiplied by 1000, not 100.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatement 2 is correct.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe value of the vote of an elected Member of Parliament (MP) in the electoral college for the Presidential Election is determined by dividing the total value of the votes of the elected MLAs by the total number of elected MPs. This ensures that each MP\u0026rsquo;s vote carries equal weight in the election.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatement 3 is incorrect. \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eIn the most recent Presidential elections (like 2022), the total members of the Electoral College were:\u003c/strong\u003e 776 MPs (543 Lok Sabha + 233 Rajya Sabha), and 4,033 MLAs, making a total of 4,809 members. Even in earlier elections, the total has always been below 5000, so this statement is factually wrong.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44831", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe President of India\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Chief Justice of India\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\ const QUIZ_TITLE = "Indian Polity PYQ Test 3";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
