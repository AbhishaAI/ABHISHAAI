3c/style\u003e\r\n\u003cp\u003eConsider the following statements: An amendment of the Constitution of India can be initiated by the............ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1999)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e(1) Lok Sabha\u003c/p\u003e\r\n\r\n\u003cp\u003e(2) Rajya Sabha\u003c/p\u003e\r\n\r\n\u003cp\u003e(3) State Legislatures\u003c/p\u003e\r\n\r\n\u003cp\u003e(4) President\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above statements is/are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA minister or private member can initiate an amendment to the Constitution of India by introducing a bill in either House of Parliament. This can be done in the Lok Sabha or the Rajya Sabha, but not in the state legislatures.\u003c/li\u003e\r\n\t\u003cli\u003eThe bill must then pass in each House by a majority of the total membership and a majority of at least two-thirds of the members present and voting. If the amendment seeks to change the Constitution\u0026rsquo;s federal character, it must also be ratified by the legislature of all the states of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe procedure for amending the Constitution is laid out in Article 368 in Part XX. The Indian Constitution borrowed the provision for this procedure from the South African Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44780", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 4\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements regarding the National Human Rights Commission of India............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1999)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e(1) Its Chairman must be a retired Chief Justice of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e(2) It has formations in each state as State Human Rights Commission.\u003c/p\u003e\r\n\r\n\u003cp\u003e(3) Its powers are only recommendatory in nature.\u003c/p\u003e\r\n\r\n\u003cp\u003e(4) It is mandatory to appoint a woman as a member of the Commission.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe National Human Rights Commission (NHRC) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a statutory body of the Government of India that was established in 1993. The NHRC\u0026rsquo;s mission is to protect and promote human rights. The NHRC is responsible for the protection and promotion of human rights, which are defined as \u0026ldquo;Rights Relating To Life, liberty, equality and dignity of the individual\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThese rights are guaranteed by the constitution or embodied in the international covenants and enforceable by courts in India. The NHRC is located at New Delhi.\u003c/li\u003e\r\n\t\u003cli\u003eThe Commission consists of a Chairperson, five full-time Members, and seven deemed Members. The chairman and members hold office for a term of three years or until they attain the age of 70 years, whichever is earlier.\u003c/li\u003e\r\n\t\u003cli\u003eThe NHRC is in conformity with the Paris Principles, adopted at the first international workshop on national institutions for the promotion and protection of human rights held in Paris in October 1991.\u003c/li\u003e\r\n\t\u003cli\u003eArun Kumar Mishra is the chairperson of the National Human Rights Commission of India. The chairperson of the National Human Rights Commission (NHRC) must be a former or current judge of the Supreme Court of India. The NHRC also includes one member who is or has been a Supreme Court judge, and one member who is or has been a High Court Chief Justice.\u003c/li\u003e\r\n\t\u003cli\u003eThe president can remove the chairperson or any member of the NHRC from office if they are found to be incapable or have misbehaved. As of December 2018, 26 states have set up State Human Rights Commissions (SHRCs). The NHRC has requested all states, including Uttaranchal and Jharkhand, to set up SHRCs.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe following states have not constituted SHRCs:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArunachal Pradesh, Goa, Haryana, Meghalaya, Mizoram, Nagaland, Tripura, Uttarakhand. The National Human Rights Commission (NHRC) has recommendatory powers. The NHRC\u0026rsquo;s decisions are only recommendatory, and governments are not required to implement them.\u003c/li\u003e\r\n\t\u003cli\u003eThe Protection of Human Rights Act, 1993, specifies that it is mandatory that at least one member of the NHRC should be a woman. This provision ensures that there is gender diversity in the commission and that women\u0026rsquo;s human rights issues are adequately represented.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44781", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eFreedom of trade and profession\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEquality before the Law\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eProtection of life and personal liberty\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eFreedom of religion\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBritish citizen staying in India cannot claim Right to.............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1999)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eA British citizen staying in India : \u003c/strong\u003ecannot claim the right to freedom of trade and profession. This is because it is not guaranteed to non-citizens.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Fundamental rights available only to the citizens are:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe following articles include the fundamental rights available only to the citizens of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 15, Article 16, Article 19, Article 29, and Article 30.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eArticle 15 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe act is about prohibiting discrimination and equality of opportunity for citizens. It prohibits discrimination against Indians based on religion, race, caste, sex, or place of birth. It makes it mandatory to treat all Indians equally.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eArticle 16:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis article is about equal employment opportunities for all. It provides equal opportunity in matters of public employment regardless of caste, religion, or sex.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eArticle 19:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis article is about the protection of the freedom of citizens. It gives every citizen the right to freedom of speech and expression, assembly peaceably, to form associations, protection against arrest and detention in certain cases, and protection against defamation.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eArticle 29:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis article protects the rights of minorities. It gives minorities the right to establish and administer educational institutions of their choice. It also provides that a religious institution would continue to receive government aid even if the state does not recognise it.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eArticle 30:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis article allows all religious denominations and sections of people to establish and administer free and charitableinstitutions for providing relief to the poor, education, and medical relief.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Fundamental Rights available to both citizens and foreigners are:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 14 \u0026ndash; Equality before the law and equal protection of laws.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 20 \u0026ndash; Protection in respect of conviction for offenses.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 21 \u0026ndash; Protection of life and personal liberty.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 21A \u0026ndash; Right to elementary education.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 22 \u0026ndash; Protection against arrest and detention in certain cases.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 23 \u0026ndash; Prohibition of traffic in human beings and forced labor.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 24 \u0026ndash; Prohibition of employment of children in factories etc.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 25 \u0026ndash; Freedom of conscience and free profession, practice, and propagation of religion.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 26 \u0026ndash; Freedom to manage religious affairs.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 27 \u0026ndash; Freedom from payment of taxes for promotion of any religion.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 28 \u0026ndash; Freedom from attending religious instruction or worship in certain educational institutions.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44782", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width: ing the floor\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Speaker can ask a member of the House to stop speaking and let another member speak. This phenomenon is known as.............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2000)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eYielding the floor is when the Speaker of the House asks a member to stop speaking and allows another member to speak.\u003c/li\u003e\r\n\t\u003cli\u003eIn some legislative bodies, this practice is allowed, but it is not allowed in deliberative assemblies unless specifically authorized in the rules.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDecorum in parliament :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt refers to the rules and traditions that ensure debate proceeds in a civil and orderly manner. The Speaker is responsible for maintaining the dignity and decorum of the House.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, members themselves must also take responsibility for their behavior and conduct their business in an appropriate fashion.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome examples of decorum in parliament include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Members should enter and leave the Chamber with decorum and in such a manner as not to disturb the proceedings of the House.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Members should bow to the Chair while entering or leaving the House and also before taking or leaving their seats.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. MPs must not use unparliamentary language.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. MPs may not read their speeches.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. A Member must be in his or her place to take part in any proceedings in the House and address his or her remarks to the Chair.\u003c/p\u003e\r\n\r\n\u003cp\u003e6. A Member, Delegate, or Resident Commissioner who desires to speak or deliver a matter to the House shall rise and respectfully address the Speaker.\u003c/p\u003e\r\n\r\n\u003cp\u003e7. \u0026ldquo;Crossing the floor\u0026rdquo;\u0026mdash;Passing between the member addressing the House and the Chair is considered a breach of Parliamentary etiquette.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eCrossing the floor :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt refers to when a member of parliament refuses to vote with their own party and instead votes with the opposing side. This can happen when a question is being decided in parliament and a vote is taken. Parliamentary parties usually vote as a team, with all members voting the same way.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eInterpellation :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a formal request from a parliament to its government. It\u0026rsquo;s a process where questions are formally asked of a government minister in parliament.\u003c/li\u003e\r\n\t\u003cli\u003eInterpellation is different from question time because it often involves a separate procedure. It can also be known as question hour.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44783", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePlanned Development\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-wid t, as opposed to top-down approaches that are often imposed by governments or other external agencies. The passage emphasizes the importance of instilling a sense of partnership and cooperative performance in workers.\u003c/li\u003e\r\n\t\u003cli\u003eThis is because Community Development is a collaborative process that requires the participation of all members of the community. When workers feel like they are partners in the development process, they are more likely to be motivated and engaged.\u003c/li\u003e\r\n\t\u003cli\u003eThis can lead to better outcomes for the community as a whole. The passage also highlights the importance of including women in the development process. Women often play a vital role in community life, but they are often marginalized from decision-making processes.\u003c/li\u003e\r\n\t\u003cli\u003eBy including women in Community Development, we can ensure that their needs and perspectives are taken into account. This can lead to more equitable and sustainable development outcomes.\u003c/li\u003e\r\n\t\u003cli\u003eIn conclusion, the passage relates to Community Development and the importance of instilling a sense of partnership and cooperative performance in workers, including women.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44784", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overf 003c/li\u003e\r\n\t\u003cli\u003eThe Chief Election Commissioner of India is in charge of the Election Commission of India, a body having constitutional jurisdiction to supervise free and fair elections for the office of President and Vice-President as well as for state and federal legislatures.\u003c/li\u003e\r\n\t\u003cli\u003eTo guarantee effective business operations in Ministries and Departments, the Cabinet Secretariat oversees the Government ofIndia (Transaction of Business) Rules, 1961 and the Government of India (Allocation of Business) Rules, 1961.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eOrder of precedence :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe protocol list or hierarchy of significant posts, known as the Order of Precedence of the Republic of India lists functionaries and officials in order of their rank and office within the Indian government.\u003c/li\u003e\r\n\t\u003cli\u003eThe Ministry of Home Affairs is in charge of upholding the order, which was established by the President of India through the Office of the President of India.\u003c/li\u003e\r\n\t\u003cli\u003eIt does not reflect the Indian presidential succession or the Constitution\u0026rsquo;s co equal status of the separation of powers; it is simply used to denote ceremonial procedure and has no legal standing.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44785", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle ty  the Union Government and its primary lawyer at the Supreme Court of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe President of India appoints the Attorney General on the advice of the Union Cabinet. The Attorney General holds office duringthe pleasure of the President and may be removed by the President at any time. The Constitution does not fix the term of the office or state the procedures and grounds for removal. The Attorney General can also resign by submitting their resignation to the President.\u003c/li\u003e\r\n\t\u003cli\u003eThe Attorney General is responsible for assisting the government in all its legal matters. The Attorney General advises the union government on all legal matters and represents the Union Government in the Supreme Court of India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;To become the Attorney General of India, a person must meet the following qualifications:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Be an Indian citizen\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Have served as a judge in a high court for at least five years, or as an advocate in a high court for at least ten years\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Be an eminent jurist, in the opinion of the President\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe 16th Attorney General of India is R Venkataramani, who succeeded to the office on October 1, 2022. His predecessor was K. K. Venugopal.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44786", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: 03cstrong\u003eThe 73rd Amendment Act includes the following provisions:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Reservation of seats for women, Scheduled Castes, and Scheduled Tribes in Panchayats\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Three-tier system\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Reservation of SC/ST/OBCs\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Direct elections\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Minimum age qualification for election to PRIs of 21 years\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Indirect election of intermediate and district level chairmen\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Tenure of five years\u003c/p\u003e\r\n\r\n\u003cp\u003e8. State Finance Commission (SFC) to be appointed every five years for review\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe 73rd Amendment Act also prohibits judges from interfering with local elections. It also bars courts from challenging laws about the delineation of constituencies and allotment of seats. The 73rd Amendment Act brought the Panchayati Raj System to rural India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 74th Constitutional Amendment Act (74th CAA) of 1992 came into effect on June 1, 1993 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Nagarpalika Act. The 74th CAA provides a framework for decentralizing powers and authorities to municipal bodies at different levels.\u003c/li\u003e\r\n\t\u003cli\u003eIt also introduced the concept of local self government and municipality in India. The 74th CAA provides constitutional status to Urban Local Bodies (ULBs).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIt also established two new tiers of government at the local level:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. the Panchayat Raj and\u003c/p\u003e\r\n\r\n\u003cp\u003e2. the Nagar Palika.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSome provisions of :100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA. Zila Parishads at the sub-divisional level \u0026rarr; Assam (2) In Assam, the Panchayati Raj structure differs slightly from the regular three-tier system. Here, the Zila Parishad functions at the sub-divisional level, not strictly at the district level as in other states. Assam\u0026rsquo;s local body system has evolved based on administrative convenience, hence this match.\u003c/li\u003e\r\n\t\u003cli\u003eB. Mandal Praja Parishad \u0026rarr; Andhra Pradesh (1) In Andhra Pradesh, the intermediate tier of Panchayati Raj is known as the Mandal Praja Parishad, instead of the commonly used \u0026ldquo;Panchayat Samiti.\u0026rdquo; The 73rd Amendment allows states to name their institutions differently, and Andhra Pradesh adopted this terminology.\u003c/li\u003e\r\n\t\u003cli\u003eC. Tribal Councils \u0026rarr; Mizoram (3) Mizoram is a Sixth Schedule area, where traditional tribal self-governance institutions function instead of the regular Panchayati Raj system. Local governance is carried out through Autonomous District Councils and Tribal Councils, which manage local affairs in accordance with tribal customs.\u003c/li\u003e\r\n\t\u003cli\u003eD. Absence of Village Panchayats \u0026rarr; Meghalaya (4) In Meghalaya, there are no traditional Village Panchayats as found in other states. Instead, governance in rural areas is handled by traditional tribal institutions such as Dorbar Shnongs, Syiems, and Nokmas under the Sixth Schedule framework. Thus, the state shows an absence of the formal Panchayati Raj system. \u003cstrong\u003eThus, the correct answer is (D) 2 1 3 4.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44793", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGoa attained full statehood in 1987\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDiu is an island in the Gulf of Khambhat\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle typ u003eEXPLANATION : (D) The Indian Constitution does not define the term \u0026ldquo;minority\u0026rdquo;. However, it does outline the rights of minorities, which are based on religion or language. The National Commission for Minorities (NCM) is a statutory body established by the Indian parliament in 1992. The NCM was established on May 17, 1993, and the first statutory commission was set up on that day. The National Commission for Minorities Act of 1992 identifies the following communities as minorities: \u2219 Muslims, Sikhs, Christians, Buddhists, Jains, Zoroastrians (Parsis). According to the 2011 Census, minorities make up about 19.3% of India\u0026rsquo;s population. According to the 2011 census, the smallest religious minority in India is Jains, making up 0.4% of the population. According to the Exam year, the Zoroastrians are the smallest religious minority in India. They are concentrated in Maharashtra. The Constitution of India recognizes and protects religious and linguistic minorities. Article 29 of the Constitution protects the interests of minority groups. It gives citizens with a distinct language, script, or culture the right to preserve their culture, language, and script. It also gives linguistic minorities the right to establish their own educational institutions. Article 30 of the Constitution gives religious and linguistic minorities the right to establish and administer educational institutions of their choice. It also protects minority-managed educational institutions from discrimination in receiving aid from the state. An ethnic, religious, or linguistic minority is any group of people who make up less than half of a state\u0026rsquo;s population. The members of these groups share common characteristics of culture, religion, or language.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "d ", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn what way does the Indian Parliament exercise control over the administration? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2001)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) T he Indian Parliament exercises control over the administration through a number of methods, including: 1. 2. 3. 4. 5. Parliamentary Committees: The Indian Constitution mentions two types of Parliamentary Committees: 1. 2. Standing Committees and Ad-hoc Committees. Periodic reports: The Parliament requires administrators to submit periodic reports. Consultative Committees: The Parliament uses Consultative Committees of different ministries to exercise control. Questions: Members of Parliament (MPs) hold the executive accountable by asking questions and supplementary questions. Adjournment motion: Matters of urgent importance can be raised in Adjournment motion.Other parliamentary devices: These include:Question hour, Zero hour, Half-an-hour discussion, Short duration discussion, Calling attention motion, No-confidence motion, Censure motion. T he Parliament does not directly compel the execu 3e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIf a new State of the Indian Union is to be created, which one of the following Schedules of the Constitution must be amended? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2001)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A)T he First Schedule of the Indian Constitution must be amended to create a new state in the Indian Union. T he First Schedule lists the names, territories, and capitals of India\u0026rsquo;s existing states and union territories. It also includes any changes to their borders and the laws used to make those changes. To amend the First Schedule, a special majority is required in both houses of Parliament. This means that the amendment must be supported by a majority of the total membership of each house and by a majority of not less than two-thirds of the members present and voting. 1. T he Second Schedule of the Indian Constitution covers the salaries, allowances, and additional grants for the following officials:President of IndiaGovernors of Indian States Speaker and Deputy Speaker of Lok Sabha Chairman and Deputy Chairman of Rajya Sabha Speaker and Deputy Speaker of Legislative Assemblies of Indian States T he Second Schedule also lists the emoluments for holders of constitutional offices, such as the salaries of the President, Vice President, Ministers, Judges, and Comptroller and Auditor-General of India.T he third schedule of the Indian Constitution contains the forms of oath and affirmation for: 1. 2. 3. 4. 5. 6. 7. 8. 9. Union Ministers of India Parliament Election Candidates Members of Parliament (MPs) Supreme Court Judges Comptroller and Auditor General State Ministers State Legislature Elections Candidates State Legislature Members High Court JudgesIt does not contain oaths and affirmations for the President of India and Governors of States. The Fifth Schedule of the Indian Constitution : It deals with the management and administration of Scheduled Areas and Scheduled Tribes where tribal communities are in a majority. The Fifth Schedule aims to hold the state accountable for the advancement of tribals\u0026rsquo; educational and economic objectives. The Fifth Schedule protects tribal interests in the states of: Andhra Pradesh, Telangana, Gujarat, Jharkhand, Chhattisgarh, Himachal Pradesh, Madhya Pradesh, Maharashtra, Odisha, Rajasthan. The Fifth Schedule does not apply to the states of Assam, Meghalaya, Tripura, and Mizoram. Tribal advisory councils (TACs) are constitutional bodies formed under the Fifth Schedule to deal with welfare and advancement of scheduled tribes in states. The Sixth Schedule of the Indian Constitution : It is a special provision that allows for the administration of tribal areas in Assam, Meghalaya, Tripura, and Mizoram. The Sixth Schedule was enacted in 1949 to protect indigenous and tribal groups. The Sixth Schedule allows for the creation of autonomous District Councils (ADCs) in certain tribal areas. These ADCs have the power to make laws on a range of subjects, including land allotment, water course use, and property inheritance. The administrative powers and functions of these District Councils and Regional Councils vary from state to state. Most of these autonomous district councils are located in North East India, with the exception of two in Ladakh and one in West Bengal.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44797", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 4\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 4\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style ution, which deals with the Official Language. Article 350 of the Indian Constitution : It states that any person can submit a representation to a Union or State authority or officer in any language used in the Union or State. The draft article was adopted without debate on September 14, 1949. Article 351 : It states that, it is the duty of the Union to encourage the spread of the Hindi language to make it lingua franca (a shared language of communication used by people who are speakers of different languages) in India without interfering with its genius, style and expressions.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44800", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt lists the distribution of power between the Union and the States\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt contains the languages listed in the Constitution\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow- an Constitution is a key part of the document that governs India\u0026rsquo;s political framework. It primarily deals with the distribution of seats in the Council of States, also known as the Rajya Sabha, among the various States and Union Territories. The Fourth Schedule contains the number of seats represented in the Rajya Sabha from each State and Union Territory. The allocation is based upon the population of states and UTs. The Constitution of India has 12 Schedules. The Constitution (Seventy fourth Amendment) Act, 1992 added the Schedules of the Indian Constitution.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44801", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eTo audit and report on all expenditure from the Consolidated Fund of India\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo audit and report on all expenditure from the Contingency Funds and Public Accounts\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo audit and report on all trading. manufacturing, profit and loss accounts\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo control the receipt and issue of public money, and to ensure that the public revenue is lodged in the exchequer\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following duties is NOT performed by the Comptroller and Auditor General of India? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2001)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (D)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Comptroller and Auditor General (CAG) of India is an independent constitutional authority established under Article 148 to 151 of the Constitution. The CAG acts as the guardian of the public purse and ensures accountability of the executive to the legislature in matters of public finance. His main function is to audit the accounts of the Union and the States and report to the President or Governors, who then place these reports before the . The CAG audits and reports on all expenditures from the Consolidated Fund of India, which includes all revenues received by the Government of India, loans raised, and money received in repayment of loans. This is explicitly mentioned in Article 149 of the Constitution and the CAG\u0026rsquo;s (Duties, Powers and Conditions of Service) Act, 1971. In addition to the Consolidated Fund, the CAG also audits the Contingency Fund of India (used for urgent, unforeseen expenditures) and the Public Account of India (which holds funds such as provident funds, judicial deposits, etc.). Thus, this is also a function legally assigned to the CAG. The CAG is empowered to audit the accounts of government departments engaged in commercial or manufacturing activities, such as government companies or corporations. He prepares and submits reports on their trading, manufacturing, profit, and loss accounts to ensure transparency and accountability. To control the receipt and issue of public money, and to ensure that the public revenue is lodged in the exchequer \u0026mdash; This function belongs to the executive branch (mainly the Finance Ministry and Treasury officers), not to the CAG. The CAG\u0026rsquo;s role is not to control financial transactions in real time but to audit them after they occur \u0026mdash; i.e., he performs a post-facto audit. Therefore, while the CAG ensures that funds are used properly and in accordance with law, he does not control or supervise the day-to-day receipt and expenditure of government money. Thus, the correct answer is D.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44802", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e5 1 4 2\u003c/p\u003e", "opt t\"\u003e\u003cspan style=\"color:#231f20\"\u003eAccepting the rec- ommendations of the Tenth Finance \u003cspan style=\"letter-spacing:-.1pt\"\u003eCommision\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\t\u003ctr\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #231f20; width:29px; padding:0cm 0cm 0cm 0cm; height:80px; border-top:none; border-right:1px solid #231f20; border-left:1px solid #231f20\" valign=\"top\"\u003e\r\n\t\t\t\u003cp class=\"TableParagraph\"\u003e\u0026nbsp;\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #231f20; width:121px; padding:0cm 0cm 0cm 0cm; height:80px; border-top:none; border-right:1px solid #231f20; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp class=\"TableParagraph\"\u003e\u0026nbsp;\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #231f20; width:24px; padding:0cm 0cm 0cm 0cm; height:80px; border-top:none; border-right:1px solid #231f20; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"center\" class=\"TableParagraph\" style=\"text-align:center; margin-top:2px\"\u003e\u003cspan style=\"font-size:11pt\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan lang=\"EN-US\" style=\"font-size:12.0pt\"\u003e\u003cspan style=\"color:#231f20\"\u003e\u003cspan style=\"letter-spacing:-.25pt\"\u003e5.\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #231f20; width:134px; padding:0cm 0cm 0cm 0cm; height:80px; border-top:none; border-right:1px solid #231f20; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp align=\"center\" class=\"TableParagraph\" style=\"margin-top:2px; margin-right:7px; margin-left:8px; text-align:center\"\u003e\u003cspan style=\"font-size:11pt\"\u003e\u003cspan style=\"line-height:14.0pt\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan lang=\"EN-US\" style=\"font-size:12.0pt\"\u003e\u003cspan style=\"color:#231f20\"\u003eAccording to the status of National Capital Territory to Delhi\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eCodes: A B C D\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Correct Answer is (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 69th Amendment Act of 1991 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt gave the Union Territory of Delhi a special status by designating it the National Capital Territory of Delhi. The amendment also established a 70-member legislativeassembly and a 7-member council of ministers for Delhi. The amendment also designated the administrator of Delhi as the Lieutenant Governor (LG).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 75th Amendment of the Indian Constitution :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eWhich was enforced on May 15, 1994, modifies Article 323B. It establishes State level Rent Tribunals to limit the jurisdiction of all courts, except the Supreme Court, under Article 136 of the Constitution. T he 75th Amendment also addresses rent, its regulation and control, and tenancy issues, including the right, title, and interest of landlords and tenants.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 80th Amendment to the Indian Constitution :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eOfficially known as the Constitution (Eightieth Amendment) Act, 1999, was enacted to implement the Tenth Finance Commission\u0026rsquo;s recommendation to streamline the tax systems. The amendment\u0026rsquo;s goal is to collect and distribute all taxes between the states and the federal government. The 80th Amendment made changes to article 270, which relates to the divisible pool.\u003c/li\u003e\r\n\t\u003cli\u003eAfter the amendment, Article 270 provides for sharing all the taxes and duties referred to in the Union list. The 80th Amendment Act also enacted an alternative scheme of devolution of revenue for sharing taxes between the Union and the State.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe 83rd Constitutional Amendment Act, 2000 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt\u0026nbsp;was enacted to introduce a special exception for the State of Arunachal Pradesh in the matter of reservation of seats for Scheduled Castes (SCs) in Panchayati Raj Institutions.\u003c/li\u003e\r\n\t\u003cli\u003eNormally, under Article 243D(1) of the Constitution (inserted by the 73rd Amendment, 1992), it is mandatory to reserve seats for Scheduled Castes (SCs) and Scheduled Tribes (STs) in every Panchayat at all levels \u0026mdash; in proportion to their population in the area. This ensures representation of weaker sections in local governance.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, in the case of Arunachal Pradesh, this provision was found to be unnecessary and practically inapplicable, because the Scheduled Caste population in the state is almost negligible (less than 0.1%).\u003c/li\u003e\r\n\t\u003cli\u003eOn the other hand, almost the entire population of the state belongs to various Scheduled Tribes \u0026mdash; meaning reservation for SCs would serve no real purpose and would complicate local governance.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44803", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 4\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow  "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe correct answer is option (A) - A: 1, B: 2, C: 3, D: 4.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Indian Constitution is a comprehensive document that outlines the structure, powers, and functions of the government. It consists of various articles that deal with different aspects of governance.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eA. Article 54:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eElection of the President of India. This article deals with the election process of the President of India.\u003c/li\u003e\r\n\t\u003cli\u003eIt specifies that the President shall be elected by an electoral college consisting of the elected members of both houses of Parliament and the elected members of the Legislative Assemblies of the States.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eB . Article 75:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAppointment of the Prime Minister and Council of Ministers. Article 75 deals with the appointment of the Prime Minister and the Council of Ministers.\u003c/li\u003e\r\n\t\u003cli\u003eIt states that the President shall appoint the Prime Minister, who is usually the leader of the majority party in the Lok Sabha. The Prime Minister, in turn, recommends recommends the names of other members to be appointed as Ministers.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eC. Article 155:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAppointment of the Governor of a state. This article deals with the appointment of the Governor of a state.\u003c/li\u003e\r\n\t\u003cli\u003eIt states that the Governor of a state shall be appointed by the President of India. The Governor acts as the constitutional head of the state and represents the President at the state level.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eD. Article 164:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAppointment of the Chief Minister and Council of Ministers of a state. Article 164 deals with the appointment of the Chief Minister and the Council of Ministers of a state.\u003c/li\u003e\r\n\t\u003cli\u003eIt states that the Chief Minister is appointed by the Governor of the state and the other Ministers are appointed by the Governor on the advice of the Chief Minister.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44805", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\ 03e\r\n\u003cp\u003eContingency Fund of the State\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe salaries and allowances of the Judges of the High Court are charged upon the........... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to the Department of Justice, the salaries and allowances of High Court Judges are charged to the Consolidated Fund of the States. However, their pensions are charged to the Consolidated Fund of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe High Court Judges (Salaries and conditions of service) Act, 1954 regulates the salaries and certain conditions of service of the Judges of High Courts.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe allowances of High Court Judges generally include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Medical facilities\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp; Housing\u003c/p\u003e\r\n\r\n\u003cp\u003e3. A phone\u003c/p\u003e\r\n\r\n\u003cp\u003e4. A car\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Leaves\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. The Consolidated Fund of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a government account that records the government\u0026rsquo;s revenue and expenses. It is established under Article 266(1) of the Indian Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe fund includes:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Revenue from income tax, customs, central excise, and non-tax revenue\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Interest earned\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Money borrowed by the government\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Consolidated Fund of India pays for:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Salaries and allowances for the Chairman and Deputy Chairman of the Rajya Sabha and the Speaker and Deputy Speaker of the Lok Sabha\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Salaries, allowances, and pensions for the Supreme Court\u0026rsquo;s judges\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Pensions for the High Courts\u0026rsquo; judges\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. The Contingency Fund of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a fund used to meet unforeseen expenditures during a national crisis, such as a natural disaster. The fund is created as an imprest account, and is at the disposal of the President. The Indian Constitution\u0026rsquo;s Article 267(1) authorizes the establishment of the Contingency Fund of India.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1950, the Indian Parliament enacted the Contingency Fund of India Act. The fund is held by a Secretary to the Government of India in the Ministry of Finance on behalf of the President. Advances can only be made from the fund to meet unforeseen expenditures pending authorization by Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eIn the 2021-2022 Budget, the Government of India proposed increasing the Contingency Fund of India from Rs 500 crore to Rs 30,000 crore.\u003c/li\u003e\r\n\t\u003cli\u003eThe Contingency Fund of the State (Article 267(2)) serves the same purpose at the state level \u0026mdash; it is used to meet unforeseen expenditures pending legislative approval.\u003c/li\u003e\r\n\t\u003cli\u003eSalaries of High Court judges are permanent and predictable expenditures, not contingent, so they come from the Consolidated Fund, not the Contingency Fund.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44806", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e l Rights (Articles 29\u0026ndash;30).\u003c/li\u003e\r\n\t\u003cli\u003eIt ensures that no citizen is denied access to educational institutions based on identity factors. This provision applies to all citizens, not just minorities, and promotes non-discrimination in education. So, B \u0026rarr; 4. Article 30(1) provides special rights to minorities\u0026mdash;both religious and linguistic\u0026mdash;to preserve their culture through education.\u003c/li\u003e\r\n\t\u003cli\u003eThis right enables them to establish schools or colleges that reflect their values and traditions. So, C \u0026rarr; 3. Originally, Article 31 guaranteed the Right to Property as a fundamental right. Article 31(1) stated that property could only be taken by lawful means. However, after the 44th Constitutional Amendment Act, 1978, the Right to Property was removed from Fundamental Rights and placed under Article 300A in Part XII as a legal right. Still, Article 31(1) historically had this wording. So, D \u0026rarr; 1. \u003cstrong\u003eThus, the correct answer is (A) 2 4 3 1.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44808", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !imp ve_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following rights was described by Dr BR Ambedkar as the heartand soul of the Constitution?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDr. B.R. Ambedkar, the chairman of the drafting committee for the Indian Constitution, described the Right to Constitutional Remedies as the \u0026ldquo;heart and soul\u0026rdquo; of the Constitution. Ambedkar believed that this right is the \u0026ldquo;heart and soul\u0026rdquo; of the Constitution because it gives citizens the ability to seek redress through the courts if their rights are violated.\u003c/li\u003e\r\n\t\u003cli\u003eThe Right to Constitutional Remedies is Article 32 of the Indian Constitution. It gives citizens the right to approach the Supreme Court or the High Court of the state to restore their fundamental rights if they are violated.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe right to freedom of religion :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the right to choose a religion and worship without interference. It also includes the freedom to change one\u0026rsquo;s religion or beliefs. The right to freedom of religion is described in Articles 25, 26, 27, and 28 of the Indian constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe constitution also mandates a secular state, requires the state to treat all religions impartially, and prohibits discrimination based on religion.\u003c/li\u003e\r\n\t\u003cli\u003eIn 2021, the Karnataka Legislative Assembly passed the Karnataka Protection of Right to Freedom of Religion Act.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe right to property :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a legal right that ensures that no person can be deprived of their property withoutlegal authority. It is enshrined in Article 300-A of the Indian Constitution, which was added in 1978.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe right to equality : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a fundamental right in India that ensures that the government does not deny any person equality before the law or equal protection of the laws. This means that the laws apply equally to all, regardless of a person\u0026rsquo;s status.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "424", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44809", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{ov
