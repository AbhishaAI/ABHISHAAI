        <div id="q-text-display" style="font-size: 1.7rem; line-height: 1.8; font-weight: 900; color: #111; margin-bottom: 35px; padding-bottom: 20px; border-bottom: 2px solid #f0e6cc;"></div>

function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

3c/li\u003e\r\n\t\u003cli\u003eA Money Bill can only be introduced in the Lok Sabha on the recommendation of the President. Also, the bill has to be introduced by a minister only. After the Money Bill gets passed in the Lower House (i.e. Lok Sabha)of the Parliament, it is sent to the Upper House (i.e. Rajya Sabha) for its consideration. Rajya Sabha has limited powers in case of a Money Bill, as it cannot reject or amend a Money Bill, it can only make its recommendations.\u003c/li\u003e\r\n\t\u003cli\u003eAlso, The Rajya Sabha has to return the bill to the Lok Sabha within 14 days. If Rajya Sabha fails to return the bill within the stipulated time, then the bill is deemed to have passed by both the houses in its original form. Lok Sabha has the right to either accept or reject all the recommendations made by Rajya Sabha.\u003c/li\u003e\r\n\t\u003cli\u003eThe bill shall be deemed to have passed in either case, the only difference being- if Lok Sabha accepts the recommendations, the bill will be passed in the modified form and if Lok Sabha rejects the recommendations, the bill will be passed in its original form.\u003c/li\u003e\r\n\t\u003cli\u003eFinally, the bill is presented to the President. He may either give his assent or withhold his assent to the bill, but cannot return the bill.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44934", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !im ap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Constitution of India provides for a federal system of government of the country. It has divided powers (legislative, executive, and financial) between the union and the states.\u003c/li\u003e\r\n\t\u003cli\u003eArticles 245 to 255 in Part XI of the Constitution deal with the legislative relations between the union and the states.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBesides these, there are some other constitutional provisions dealing with the same subject.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;The constitution empowers parliament to make laws on any matter in-state list under five extraordinary circumstances\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Rajya Sabha passes the resolution\u003c/p\u003e\r\n\r\n\u003cp\u003e3. National emergency States make a request\u003c/p\u003e\r\n\r\n\u003cp\u003e4.\u0026nbsp;To implement international agreements\u003c/p\u003e\r\n\r\n\u003cp\u003e5. During the president\u0026rsquo;s rule\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Indian Constitution also divides the legislative powers between the center and the states with respect to both the territory and the subjects of legislation like any other Federal Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe Parliament can alone make \u0026lsquo;extra territorial legislation\u0026rsquo; thus the laws of the Parliament are applicable to the Indian citizens and their property in any part of the world. Subject to the provisions of the Constitution, a state legislature may make laws for the whole or any part of the state to which it belongs.\u003c/li\u003e\r\n\t\u003cli\u003eIt is not possible for a state legislature to enlarge its territorial jurisdiction under any circumstances, except when the boundaries of the state ortant}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements:\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Parliamentary Committee on Public Accounts\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Consists of not more than 25 Members of the Lok Sabha\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Scrutinizes appropriation and finance accounts of the Government\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Examines the report of the Comptroller and Auditor General of India\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Committee on Public Accounts consists of 22 members in total\u0026mdash;15 members are elected by the Lok Sabha and 7 members by the Rajya Sabha. Hence, the statement mentioning 25 members and only from the Lok Sabha is wrong. Thus, statement 1 is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eOne of the main functions of the Public Accounts Committee is to examine the appropriation accounts (which show how the money granted by Parliament has been spent) and the finance accounts of the Government of India. It ensures that public money is used efficiently and for the intended purposes. Thus, statement 2 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eThe PAC examines the reports submitted by the CAG to ensure that expenditure conforms to Parliament\u0026rsquo;s decisions and that there is no misuse of funds. It acts as a vital link between the CAG and Parliament in financial oversight. Thus, statement 3 is correct. \u003cstrong\u003eTherefore, the correct answer is 2 and 3 only.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44937", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !import ype=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePrinciples implied institutionally in the parliamentary government in the context of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Members of the cabinet are members of the parliament:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn the parliamentary system of government in India, it is a fundamental principle that members of the cabinet are also members of the parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThis means that ministers who hold important portfolios in the government are elected representatives who have been chosen by the people through the electoral process.\u003c/li\u003e\r\n\t\u003cli\u003eThis principle ensures that the executive branch of the government is accountable to the legislative branch and maintains a close connection with the people.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Ministers hold the office till they enjoy confidence in the parliament:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAnother important principle of the parliamentary government in India is that ministers hold office as long as they enjoy the confidence of the parliament. This means that the ministers are accountable to the parliament for their actions and policies.\u003c/li\u003e\r\n\t\u003cli\u003eIf a minister loses the confidence of the majority of the members of parliament, they are required to resign from their position. This principle ensures that the government remains accountable to the elected representatives and reflects the will of the people.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Cabinet is headed by the head of the state:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\ n\r\n\u003cp\u003e5. The Parliament\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePlanning in India is a crucial aspect of the country\u0026#39;s development process. Several institutions and bodies work together to plan and implement various policies and schemes.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Finance Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis body is not associated with planning. It is a constitutional body (Article 280) responsible for recommending the distribution of financial resources between the Centre and the States.\u003c/li\u003e\r\n\t\u003cli\u003eIts function is related to fiscal federalism and revenue sharing, not planning or development programs. Thus, statement 1 is incorrect.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe National Development Council (NDC) :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThis body e Governor what he/ she would like to do.\u003c/li\u003e\r\n\t\u003cli\u003eGovernor appoints ministers on the recommendation of Chief minister and do not have discretion on this aspect. And Making the rules to conduct the business of the State Government is also not under his description.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44946", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: br rticle 77\u003c/strong\u003e of the Indian Constitution includes \u0026ldquo;Conduct of Business of the Government of India\u0026rdquo;. It says that \u0026ldquo;The President shall make rules for the more convenient transaction of the business of the Government of India, and for the allocation among Ministers of the said business\u0026rdquo;. Hence statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eThe Clause (1) of Article 77\u003c/strong\u003e of the Indian Constitution include that \u0026ldquo;All executive action of the Government of India shall be expressed to be taken in the name of the President\u0026rdquo;. Hence statement 2 is not correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eThe Clause (2) of Article 77\u003c/strong\u003e of the Indian Constitution includes that \u0026ldquo;Orders and other instruments made and executed in the name of the President shall be authenticated in such manner as may be specified in rules to be made by the President, and the validity of an order or instrument which is so authenticated shall not be called in question on the ground that it is not an order or instrument made or executed by the President\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44948", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word; e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eArticle 75 \u003c/strong\u003eof the Indian Constitution specifies that the council of ministers shall be collectively responsible to the House of the People. A Motion of No-Confidence can be introduced in the Lok Sabha only. Hence statement 2 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eArticle 118 \u003c/strong\u003eof the Indian Constitution permits both houses (Lok Sabha and Rajya Sabha) of Parliament to make its own rules for its functioning. There is no mention of \u0026ldquo;no-confidence\u0026rdquo; motion in the Articles of Indian Constitution. Hence statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eRule 198 of Lok Sabha\u003c/strong\u003e mentions the procedure for a motion of no-confidence. Once a notice is given, the speaker reads it in the House and asks those who are in favour of it. In case there are 50 MPs in favour, a date for discussing the motion is assigned.\u003c/li\u003e\r\n\t\u003cli\u003eThe vote has to take place within 10 days of the notice, if the majority of the members vote in favour of the motion then the motion is passed and the government in power has to vacate the office.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44949", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width yle\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eEstimates Committee :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt has 30 members and all these members are from Lok Sabha. This committee tries to report the economy and efficiency in expenditures. The members are elected by Lok Sabha members from amongst themselves every year by principles of proportional representation by means of a single transferable vote so that all parties get a due presentation in it.\u003c/li\u003e\r\n\t\u003cli\u003eA minister cannot be elected as member / Chairman of the estimates committee. The Committee on Public Accounts has 22 members of which 15 are from Lok Sabha while 7 from Rajya Sabha. A minister cannot be a member of PAC.\u003c/li\u003e\r\n\t\u003cli\u003eThe Chairman of PAC is appointed by Speaker from its members. The chairman of PAC is from opposition by convention. PAC examines the three audit reports of CAG submitted to President viz. audit report on appropriation accounts, an audit report on financial accounts, and the audit report on public undertakings.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Committee on Public Undertakings :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eCommittee on Public Undertakings has 22 members from both the houses of parliament {15 from Lok Sabha and 7 from Rajya Sabha}. The chairman of this committee, appointed by the Lok Sabha speaker is always from Lok Sabha.\u003c/li\u003e\r\n\t\u003cli\u003eA minister cannot become chairman of this committee also committed to Public Undertakings examines the reports and accounts of public undertakings and also the CAG audit reports on public undertakings.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Committee on Petitions :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth Lok Sabha and Rajya Sabha have their Committee on Petitions. While the Lok Sabha committee has 15 members, Rajya Sabha has 10 members. The members of these committees are nominated by Speaker / Chairman as the case may be.\u003c/li\u003e\r\n\t\u003cli\u003eThe major function of this committee is to examine every petition referred to it and if the petition complies with the rules to direct that it be circulated.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44950", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:10 yle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe power of the Supreme Court of India to decide disputes between the Centre and the States falls under its.......... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe power of the Supreme Court of India to decide disputes between the center and the states falls under its original jurisdiction. Original jurisdiction means the power to hear and determine a dispute in the first instance. It is under Article 131 of the Indian Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Supreme Court has been given exclusive original jurisdiction which extends to disputes:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. between the Government of India and one or more States\u003c/p\u003e\r\n\r\n\u003cp\u003e2. between the Government of India and one or more States on one side and one or more States on the other\u003c/p\u003e\r\n\r\n\u003cp\u003e3. between two or more States.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eHowever, this jurisdiction shall not extend to a dispute arising out of the treaty, agreement, etc. Which is in operation and excludes such jurisdiction. The jurisdiction is extremely wide, provided the dispute is a justiciable one.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAdvisory Jurisdiction :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is under Article 143 of the Constitution. The Supreme Court has special advisory jurisdiction in matters which may specifically be referred to it by the President of India under Article 143 of the Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAppellate Jurisdiction :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Supreme Court has also a very wide appellate jurisdiction over all Courts and Tribunals in India in as much as it may, in its discretion, grant special leave to appeal under Article 136 of the Constitution from any judgment, decree, determination, sentence, or order in any cause or matter passed or made by any Court.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWrit Jurisdiction :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA person whose right is infringed by an arbitrary administrative action may approach the Court for an appropriate remedy. The Constitution of India, under Articles 32 and 226 confers writ jurisdiction on Supreme Court and High Courts, respectively for enforcement/protection of fundamental rights of an Individual.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": " \"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe ideal of \u0026lsquo;Welfare State\u0026rsquo; in the Indian Constitution is enshrined in its.......... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe welfare state is a concept of government in which the state plays a key role in the protection and promotion of the economic and social well-being of its citizens.\u003c/li\u003e\r\n\t\u003cli\u003eThe government ensures the availability of a social security net which may include education, housing, sustenance, healthcare, etc. The Indian Constitution declares the concept of the welfare state in the Directive Principles of State Policy (DPSP).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eImportant Points : \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDPSP :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePart IV of the Indian Constitution deals with Directive Principles of our State Policy (DPSP). DPSP constitutes a comprehensive socio-economic program for a modern democratic state. The idea of Directive Principles of State Policy has been taken from the Irish Republic.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFundamental Rights :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePart III of the Indian Constitution talks about Fundamental Rights. There are seven categories of Fundamental Rights (FR) which are covered from Articles 12-35. Fundamental rights are the basic human rights enshrined in the Constitution of India which are guaranteed to all citizens.\u003c/li\u003e\r\n\t\u003cli\u003eThey are applied without discrimination on the basis of race, religion, gender, etc. Significantly, fundamental rights are enforceable by the courts, subject to certain conditions. Preamble enshrines the ideals and philosophy of the constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe preamble gives an idea about the following :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e(1) the source of the constitution,\u003c/p\u003e\r\n\r\n\u003cp\u003e(2) the nature of the Indian state\u003c/p\u003e\r\n\r\n\u003cp\u003e(3) a statement of its objectives, and\u003c/p\u003e\r\n\r\n\u003cp\u003e(4) the date of its adoption.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSeventh Schedule :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe seventh schedule under Article 246 of the constitution deals with the division of powers between the union and the states. It contains three lists: Union List, State List and Concurrent List.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44956", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} te Policy. DPSP are ideals which are meant to be kept in mind by the state when it formulates policies and enacts laws.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThere are various definitions to Directive Principles of State which are given below:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are an \u0026lsquo;instrument of instructions\u0026rsquo; which are enumerated in Government of India Act, 1935 They seek to establish economic and social democracy in the country DPSPs are ideals which are not legally enforceable by the courts for their violation\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44957", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r 3e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Legislative Council of a State in India can be larger in size than half of the Legislative Assembly of that particular State.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Governor of a State nominates the Chairman of Legislative Council of that particular State.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to Article 171(1) of the Indian Constitution, the total number of members in the Legislative Council of a State shall not exceed one-third of the total number of members in the Legislative Assembly of that State, and shall not be less than 40 (except in Jammu and Kashmir, which has a special provision).\u003c/li\u003e\r\n\t\u003cli\u003eHence, the size of the Legislative Council can never be larger than half of the Legislative Assembly; it is limited to a maximum of one-third. Thus, statement 1 is incorrect. The Chairman of the Legislative Council is elected by the members of the Council themselves from among their members, as per the procedure laid down in Article 182 of the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe Governor does not have any role in appointing or nominating the Chairman; the Governor only nominates certain members to the Legislative Council under Article 171(5) (persons with special knowledge or practical experience in literature, science, art, cooperative movement, and social service). Thus, statement 2 is also incorrect.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44958", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLok Sabha is elected directly by the people\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap ": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThere is a Parliamentary System of Government in India because the............ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe correct answer is (d) Council of Ministers is responsible to the Lok Sabha. India has a Parliamentary System of Government, which is based on the principle of collective responsibility.\u003c/li\u003e\r\n\t\u003cli\u003eIn this system, the Council of Ministers, headed by the Prime Minister, is collectively responsible to the Lok Sabha (the Lower House of Parliament). This means that the government remains in power as long as it enjoys the confidence of the majority in the Lok Sabha.\u003c/li\u003e\r\n\t\u003cli\u003eIf the Lok Sabha passes a no-confidence motion, the Council of Ministers must resign. This feature clearly distinguishes a parliamentary system from a presidential one, where the executive is independent of the legislature. The other options do not define the parliamentary system.\u003c/li\u003e\r\n\t\u003cli\u003eThe fact that the Lok Sabha is elected directly by the people only indicates democracy, not necessarily a parliamentary form. The power of Parliament to amend the Constitution relates to legislative authority, and the Rajya Sabha being undissolved is a structural feature of the Parliament, not a defining element of the parliamentary system.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44959", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": " ": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Rajya Sabha has no power either to reject or to amend a Money Bill.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Rajya Sabha cannot vote on the Demands for Grants.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Rajya Sabha cannot discuss the Annual Financial Statement.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Rajya Sabha has no power to reject or amend a Money Bill. It can only make recommendations to the Lok Sabha, which the Lok Sabha may accept or reject, and the Bill must be returned within fourteen days. Hence, this makes the Rajya Sabha\u0026rsquo;s role in Money Bills only advisory. Thus, statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rajya Sabha also cannot vote on the Demands for Grants, as this power lies solely with the Lok Sabha. The Demands for Grants form part of the Annual Financial Statement, and only the directly elected House has the authority to vote on the expenditure of public funds. Thus, statement 2 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the Rajya Sabha is allowed to discuss the Annual Financial Statement and can make observations or suggestions, though it cannot vote on it. This gives it a limited role in financial discussions but no control over financial decisions. Thus, statement 3 is incorrect. Therefore, the correct answer is (B) 1 and 2 only.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44960", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\ -word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAbsolute majority of the Houses\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhen a bill is referred to a joint sitting of both the Houses of the Parliament, it has to be passed by........... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to Article 108 of the Indian Constitution, when a joint sitting of both Houses of Parliament is held to resolve a deadlock on an ordinary bill, the bill is passed by a simple majority \u0026mdash; that is, by a majority of the members present and voting at the sitting. This means that if more members vote in favour of the bill than against it, the bill is considered passed.\u003c/li\u003e\r\n\t\u003cli\u003eThe simple majority rule applies to most ordinary legislative matters in Parliament. Thus, option (a) is correct. The Constitution of India does not require any three-fourths majority for the passage of a bill, whether in a normal sitting or a joint sitting. Such a high majority requirement is not applicable even for constitutional amendments, which need only a special two-thirds majority under Article 368. Hence, this option does not apply to any legislative process in Parliament. Thus, option (b) is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eThe two-thirds majority applies only to Constitutional Amendment Bills under Article 368, not to ordinary bills or joint sittings. Joint sittings are convened only to resolve disagreements over ordinary bills, and those are decided by a simple majority. Hence, a two-thirds majority is not required here. Thus, option (c) is incorrect. An absolute majority means more than 50% of the total membership of the House, irrespective of how many members are present.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, in a joint sitting, only a simple majority of members present and voting is needed to pass the bill. Therefore, this option does not represent the rule for joint sittings. Thus, option (d) is incorrect. Therefore, the correct answer is A.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": e Civil Services Board.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to Article 53(1) of the Constitution of India, the executive power of the Union is vested in the President of India and is exercised by him either directly or through officers subordinate to him in accordance with the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe Prime Minister is the head of the Council of Ministers and advises the President, but the executive power itself is constitutionally vested in the President. Thus, statement 1 is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eThe Civil Services Board (CSB) deals with the transfer, posting, and tenure of senior civil servants. The Cabinet Secretary is the ex-officio Chairman of this Board, not the Prime Minister.\u003c/li\u003e\r\n\t\u003cli\u003eThe Board generally includes senior officials such as the Secretary (Personnel) and other high-ranking officers of the government. Thus, statement 2 is incorrect. \u003cstrong\u003eTherefore, the answer is Neither 1 nor 2.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "  including bills, motions,resolutions, notices, petitions and so on pending before it or its committees lapse.\u003c/li\u003e\r\n\t\u003cli\u003eThey (to be pursued further) must be reintroduced in the newly constituted Lok Sabha. However, some pending bills and all pending assurances that are to be examined by the Committee on Government Assurances do not lapse on the dissolution of the Lok Sabha.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe position with respect to lapsing of bills is as follows:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A bill pending in the Lok Sabha lapses (whether originating in the Lok Sabha or transmitted to it by the Rajya Sabha).\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A bill passed by the Lok Sabha but pending in the Rajya Sabha lapses.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. A bill not passed by the two Houses due to disagreement and if the president has notified the holding of a joint sitting before the dissolution of Lok Sabha, does not lapse.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. A bill pending in the Rajya Sabha but not passed by the Lok Sabha does not lapse.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. A bill passed by both Houses but pending assent of the president does not lapse.\u003c/p\u003e\r\n\r\n\u003cp\u003e6. A bill passed by both Houses but returned by the president for reconsideration of Houses does not lapse.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44967", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003c ction Commission of India :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Election Commission of India is a constitutional body that conducts elections to the Lok Sabha, Rajya Sabha, State Legislative Assemblies, and the offices of the President and Vice-President of India. It is a three-member body consisting of the Chief Election Commissioner and two Election Commissioners.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the number of Election Commissioners can be increased to five as per the Constitution. The Election Commission is an independent body and is not answerable to the Union Ministry of Home Affairs or any other government authority.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eUnion Ministry of Home Affairs:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Union Ministry of Home Affairs is a government ministry responsible for internal security, law and order, and disaster management in India. It does not decide the election schedule for the conduct of general elections and bye-elections. The Election Commission is responsible for preparing the election schedule.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDisputes relating to splits/mergers of recognised political parties:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Election Commission is responsible for resolving disputes relating to splits and mergers of recognised political parties. If a political party has split into two or more factions, the Election Commission decides which faction can use the party name and symbol in elections.\u003c/li\u003e\r\n\t\u003cli\u003eSimilarly, if two or more political parties have merged, the Election Commission decides which party name and symbol will be used in elections. Therefore, the correct option is (d) 3 only,as the first statement is incorrect and the second statement is not true.\u003c/li\u003e\r\n\u003c/ul\u003e 03e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe federating units have been given unequal representation in the Rajya Sabha.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is the result of an agreement among the federating units.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following is not a feature of Indian federalism?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2016)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Constitution establishes an independent judiciary headed by the Supreme Court, with security of tenure for judges, provisions for judicial review of legislation, and separation of the judiciary from the executive in important respects.\u003c/li\u003e\r\n\t\u003cli\u003eThe Supreme Court and high courts regularly interpret the Constitution and protect federal rights, so an independent judiciary is indeed a feature of Indian federalism. Thus (a) is correct (it is a feature).\u003c/li\u003e\r\n\t\u003cli\u003eThe Constitution explicitly divides legislative subjects into the Union List, State List and Concurrent List and assigns residuary powers to the Centre; administrative and financial powers are also allocated.\u003c/li\u003e\r\n\t\u003cli\u003eWhile the distribution is asymmetric (with many strong Centre-leaning provisions), the Constitution does provide a formal, written division of powers. Therefore the presence of a (written) division of powers is a feature of Indian federalism. Thus (b) is correct (it is a feature).\u003c/li\u003e\r\n\t\u003cli\u003eThe Rajya Sabha (Council of States) represents the states, but representation is not strictly equal \u0026mdash; larger states have many more members than small states. This unequal representation is built into the design (it is not equal-per-state like the U.S. Senate), so unequal representation of federating units in the Rajya Sabha is indeed a feature of how Indian federalism is structured. Thus (c) is correct (it is a feature).\u003c/li\u003e\r\n\t\u003cli\u003eClassical federations (like Switzerland) result from an agreement/compact among formerly independent units; however, India\u0026rsquo;s federation was created by the Constituent Assembly and by the Constitution enacted by that assembly \u0026mdash; not by a treaty or agreement among independent states.\u003c/li\u003e\r\n\t\u003cli\u003eThe Indian Union is therefore not primarily a \u0026ldquo;coming together\u0026rdquo; federation born of an agreement among sovereign units; rather it is a federation established by a single constituent authority. Thus (d) is not a feature.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44971", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u  {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ea band of dedicated party workers.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDemocracy\u0026rsquo;s superior virtue lies in the fact that it calls into activity............ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2017)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe correct answer is (a) the intelligence and character of ordinary men and women. Democracy\u0026rsquo;s superior virtue lies in the fact that it awakens and utilizes the intelligence, character, and moral sense of ordinary citizens in the functioning of the government.\u003c/li\u003e\r\n\t\u003cli\u003eUnlike monarchy or dictatorship, where power is concentrated in the hands of one person or a few elites, democracy rests on the active participation and collective wisdom of the people.\u003c/li\u003e\r\n\t\u003cli\u003eIt encourages individuals to think, judge, and act responsibly in public affairs, making them both the source and guardians of political power.\u003c/li\u003e\r\n\t\u003cli\u003eOption (b), which mentions \u0026ldquo;the methods for strengthening executive leadership,\u0026rdquo; is incorrect because democracy does not seek to enhance the authority of the executive; rather, it limits and regulates it through accountability and checks and balances.\u003c/li\u003e\r\n\t\u003cli\u003eOption (c), \u0026ldquo;a superior individual with dynamism and vision,\u0026rdquo; is wrong because such concentration of power reflects autocracy, not democracy, which values equality and collective decision-making.\u003c/li\u003e\r\n\t\u003cli\u003eOption (d), \u0026ldquo;a band of dedicated party workers,\u0026rdquo; is also incorrect because democracy\u0026rsquo;s strength lies in the participation of the entire population, not just a small political group.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, the true virtue of democracy lies in calling into activity the intelligence and character of ordinary men and women, making option (a) the correct answer.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"ans  where the state\u0026rsquo;s power overrides personal freedoms.\u003c/li\u003e\r\n\t\u003cli\u003eIn contrast, a true constitutional government exists to protect citizens\u0026rsquo; rights and freedoms from misuse of power by the state.\u003c/li\u003e\r\n\t\u003cli\u003eStatement 2 says that a constitutional government \u0026ldquo;places effective restrictions on the Authority of the State in the interest of individual liberty.\u0026rdquo;\u003c/li\u003e\r\n\t\u003cli\u003eThis is correct because the very essence of constitutionalism lies in limiting government powers through legal and institutional checks, ensuring that individual freedoms are preserved. Therefore, statement 2 is correct. \u003cstrong\u003eThus, the correct answer is (B) 2 only.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44974", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLiberty of thought\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% ! \"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Preamble to the Constitution of India reflects the mind and ideals of the framers of the Constitution. It expresses the philosophy, vision, and objectives that the Constituent Assembly sought to achieve through the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eOften described as the \u0026ldquo;identity card\u0026rdquo; or \u0026ldquo;key to the Constitution,\u0026rdquo; the Preamble embodies the guiding principles of justice, liberty, equality, and fraternity, which form the foundation of India\u0026rsquo;s democratic system.\u003c/li\u003e\r\n\t\u003cli\u003eIt reveals the purpose behind the Constitution \u0026mdash; to establish a sovereign, socialist, secular, and democratic republic, ensuring dignity of the individual and unity and integrity of the nation.\u003c/li\u003e\r\n\t\u003cli\u003eOption (b) The Fundamental Rights is incorrect because these deal with the rights and freedoms guaranteed to citizens, not the overall philosophy or intent of the framers.\u003c/li\u003e\r\n\t\u003cli\u003eOption (c) The Directive Principles of State Policy are guidelines to the government for establishing social and economic democracy but do not represent the framers\u0026rsquo; general outlook or vision in entirety.\u003c/li\u003e\r\n\t\u003cli\u003eOption (d) The Fundamental Duties were added later by the 42nd Amendment in 1976 and hence do not reflect the original mind of the Constitution\u0026rsquo;s makers.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, the mind of the makers of the Constitution of India is best reflected in the Preamble, which serves as the soul and guiding spirit of the entire document.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", -word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLegal Right\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRight to vote and to be elected in India is a........... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2017)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026lsquo;The right to Vote\u0026rsquo; in India is a Constitutional right. The rights that are enshrined in the Indian Constitution and conferred on the citizens of India, and do not fall under the domain of Part III, are known as constitutional rights.\u003c/li\u003e\r\n\t\u003cli\u003eThe Right To Vote is guaranteed by the Constitution of India under Article 326 of the Indian Constitution. Every citizen has to attain the age of 18 to exercise this particular right. Full voting rights were guaranteed to the citizens of India under the concept of \u0026lsquo;Universal Suffrage\u0026rsquo; in 1950.\u003c/li\u003e\r\n\t\u003cli\u003eThe 61 st constitutional amendment of 1988 reduced the voting age for elections to Lok Sabha and State Legislative Assemblies from 21 to 18 years.However, unlike Fundamental rights, Constitutional rights do not apply to everyone.\u003c/li\u003e\r\n\t\u003cli\u003eThey are applicable on certain grounds. If any law shows inconsistency with the Constitutional rights, the law itself is declared null and void.\u003c/li\u003e\r\n\t\u003cli\u003eFundamental rights are the basic rights guaranteed by the Constitution to every citizen irrespective of caste, creed, religion, sex, or place of birth. However, some Fundamental Rights include foreigners.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44977", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u
