ortant}\r\n\u003c/style\u003e\r\n\u003cp\u003eRights, not Duties, are important for the advancement of the personality of the citizen.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDuties, not Rights, are important for the stability of the State.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the context of India, which one of the following is the correct relationship between Rights and Duties? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2017)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRelationship between Rights and Duties in India. In India, the relationship between Rights and Duties is that they are correlative with each other.\u003c/li\u003e\r\n\t\u003cli\u003eThis means that every right has a corresponding duty and every duty has a corresponding right. This relationship is enshrined in the Constitution of India, which recognizes both Rights and Duties as important for the well-being of society.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eImportance of Rights :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eRights are important because they protect the individual from the arbitrary exercise of power by the State. They ensure that every citizen has the freedom to express their opinions, practice their religion, and pursue their goals without fear of persecution or discrimination.\u003c/li\u003e\r\n\t\u003cli\u003eThe Constitution of India guarantees several fundamental rights, such as the right to equality, freedom of speech and expression, and the right to life and liberty.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eImportance of Duties :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDuties, on the other hand, are important for the stability of the State. They ensure that every citizen contributes to the welfare of society and respects the rights of others.\u003c/li\u003e\r\n\t\u003cli\u003eThe Constitution of India also recognizes several fundamental duties, such as the duty to uphold the Constitution, respect the national flag and anthem, and promote harmony and the spirit of common brotherhood among all citizens.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eCorrelative Relationship :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe correlative relationship between Rights and Duties means that every right comes with a corresponding duty. For example, the right to free speech comes with the duty to use that right responsibly and not to incite violence or hatred.\u003c/li\u003e\r\n\t\u003cli\u003eSimilarly, the right to education comes with the duty to attend school regularly and work hard to achieve academic excellence.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eConclusion :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn conclusion, the relationship between Rights and Duties in India is that they are correlative with each other. Both Rights and Duties are essential for the well-being of society, and every citizen has a responsibility to respect the rights of others while exercising their own rights responsibly.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": " w-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIndia has first past the post system of election for Lok Sabha or State Assembly, wherein a candidate who wins the election may not (need to) get majority (50%+1) votes.\u003c/li\u003e\r\n\t\u003cli\u003eAlso, the constitution of India has adopted the system of territorial representation for the election of members to the Lok Sabha or State Assembly. Under this system, MP or MLA represents a geographical area known as a constituency.\u003c/li\u003e\r\n\t\u003cli\u003eFrom each constituency, only one representative is elected. Hence such a constituency is known as a single-member constituency. In this system, a candidate who secures the majority of votes is declared elected. Hence, statement 1 is not correct.\u003c/li\u003e\r\n\t\u003cli\u003eTill 10th Lok Sabha, both the Deputy Speaker and the Speaker were usually from the ruling party. From the 11th Lok Sabha, there has been a consensus that the post of Deputy Speaker goes to the main opposition party and the Speaker comes from the ruling party (or ruling alliance). Meaning it\u0026rsquo;s an \u0026lsquo;informal consensus\u0026rsquo; among political parties and not Constitutional provision.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44985", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u _image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following are not necessarily the consequences of the proclamation of the President\u0026rsquo;s rule in a State? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2017)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Dissolution of the State Legislative Assembly\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Removal of the Council of Ministers in the State\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Dissolution of the local bodies\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eProclamation of President rule :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 356 states that the President\u0026rsquo;s Rule can be imposed on any state of India on the grounds of the failure of the constitutional machinery.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThis is of two types :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003ea)\u0026nbsp;If the President receives a report from the state\u0026rsquo;s Governor or otherwise is convinced or satisfied that the state\u0026rsquo;s situation is such that the state government cannot carry on the governance according to the provisions of the Constitution,\u003c/p\u003e\r\n\r\n\u003cp\u003eb) President\u0026rsquo;s Rule can be imposed if any state fails to comply with all directions given by the Union on matters it is empowered to.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eWhen the President\u0026rsquo;s Rule is imposed in a state, the President dismisses the state council of ministers headed by the chief minister.\u003c/li\u003e\r\n\t\u003cli\u003eThe state governor, on behalf of the President, carries on the state administration with the help of the chief secretary of the state or the advisors appointed by the President.\u003c/li\u003e\r\n\t\u003cli\u003eHence Removal of the Council of Ministers in the State is definitely the consequence of proclamation. Hence options 2 is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eDuring the president\u0026rsquo;s rule is in operation, the state executive is dismissed and the state legislature and local bodies are either suspended or dissolved. So dissolution is not \u0026lsquo;necessarily\u0026rsquo; the consequence.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44986", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: br % !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the Parliament of India, consider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2017)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A private member\u0026rsquo;s bill is a bill presented by a Member of Parliament who is not elected but only nominated by the President of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Recently, a private member\u0026rsquo;s bill has been passed in the Parliament of India for the first time in its history\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "" n is accepted, the normal business of the House is set aside and the matter is discussed.\u003c/li\u003e\r\n\t\u003cli\u003eThe Council of Ministers is accountable to the Parliament, and through the adjournment motion, the Parliament can question, criticize, or censure the actions or policies of the Council of Ministers.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Question hour :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDuring the Question hour, Members of Parliament can ask questions to the Ministers on matters related to their respective ministries.\u003c/li\u003e\r\n\t\u003cli\u003eThis provides an opportunity for the Parliament to seek clarifications from the Council of Ministers on various issues.\u003c/li\u003e\r\n\t\u003cli\u003eThe Council of Ministers is required to provide accurate and truthful answers to the questions asked by the Members of Parliament.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Supplementary questions:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMembers of Parliament can ask supplementary questions to seek further clarifications on the answers provided by the Ministers during the Question hour.\u003c/li\u003e\r\n\t\u003cli\u003eThis provides an opportunity for the Members of Parliament to probe deeper into the issues and seek more detailed information from the Council of Ministers.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eConclusion :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThus, the Parliament of India exercises control over the functions of the Council of Ministers through various means, including the adjournment motion, Question hour, and supplementary questions.\u003c/li\u003e\r\n\t\u003cli\u003eThese mechanisms ensure that the Council of Ministers remains accountable to the Parliament and that the Parliament can effectively scrutinize the actions and policies of the Council of Ministers.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44991", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ethe power of the Judiciary to pronounce upon the constitutionality of laws and executive orders.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ethe power of the Judiciary to question the wisdom of the laws enacted by the Legislatures.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\ image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eJudicial review is an important aspect of the Indian Constitution. It is the power of the judiciary to pronounce upon the constitutionality of laws and executive orders.\u003c/li\u003e\r\n\t\u003cli\u003eThis means that the judiciary can review the actions of the legislative and executive branches of government to ensure that they are in line with the Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003ePowers of the Judiciary :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe judiciary in India has been granted the power of judicial review to protect the fundamental rights of citizens. This power is essential to maintain the rule of law and ensure that the government does not infringe upon the rights of citizens.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eConstitutionality of Laws and Executive Orders :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe power of judicial review allows the judiciary to examine the constitutionality of laws and executive orders. If a law or executive order is found to be unconstitutional, the judiciary can strike it down. This ensures that the government does not violate the Constitution and the rights of citizens.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eRole of the Judiciary :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe judiciary plays an important role in upholding the Constitution and protecting the rights of citizens. It acts as a check on the power of the le ng\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA Money Bill is a type of bill introduced in the Indian Parliament which deals with financial matters, such as taxation, government expenditure, and borrowing. Money Bills are defined under Article 110 of the Indian Constitution.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some facts about Money Bills: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eProvisions of a Money Bill :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA bill shall be deemed to be a Money Bill if it contains only provisions relating to imposition, abolition, remission, alteration, or regulation of any tax. A Money Bill also has provisions for the custody of the Consolidated Fund of India or the Contingency Fund of India. A Money Bill deals with the regulation of borrowing of money or giving of any guarantee by the Government of India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIncorrect statement :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA Money Bill is concerned with the appropriation of moneys out of the Contingency Fund of India. (This statement is incorrect.) The correct statement is that a Money Bill is not concerned with the appropriation of moneys out of the Contingency Fund of India. The Contingency Fund of India is a fund established to meet unforeseen expenditures by the government.\u003c/li\u003e\r\n\t\u003cli\u003eAny bill that seeks to appropriate money out of the Contingency Fund of India cannot be deemed as a Money Bill. The reason for this is that Money Bills are a special category of bills that can only be introduced in the Lok Sabha (the lower house of Parliament), and are subject to a special procedure under the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe Rajya Sabha (the upper house of Parliament) has no power to amend or reject a Money Bill; it can only recommend changes, which the Lok Sabha may or may not accept. Since the Contingency Fund of India is not related to taxation, expenditure, or borrowing, it cannot be included in a Money Bill.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44994", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the election of the President of India, consider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2018)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The value of the vote of each MLA varies from State to State.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The value of the vote of MPs of the Lok Sabha is more than the value of the vote of MPs of the Rajya Sabha.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe election of the President of India is a complex process that involves the participation of both the elected representatives of the people and the members of the State Legislative Assemblies.\u003c/li\u003e\r\n\t\u003cli\u003eThe process is governed by the provisions of the Constitution of India and the Presidential and Vice-Presidential Elections Act, 1952.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatement 1:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe value of the vote of each MLA varies from State to State. This statement is correct. The value of the vote of each MLA in the Presidentialelection is determined by the population of the State and the number of seats it has in the Legislative Assembly.\u003c/li\u003e\r\n\t\u003cli\u003eThe more populous States have a higher number of MLAs and, therefore, a higher value of the vote. For example, the value of the vote of an MLA in Uttar Pradesh is 208, while in Sikkim it is only 7.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatement 2:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe value of the vote of MPs of the Lok Sabha is more than the value of the vote of MPs of the Rajya Sabha.This statement is incorrect. The value of the vote of each MP in the Presidential election is the same, irrespective of whether the MP is from the Lok Sabha of the Rajya Sabha.\u003c/li\u003e\r\n\t\u003cli\u003eThe total value of the votes of all MPs is equal to the product of the total number of MPs and the value of each vote, which is currently set at 708.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eConclusion:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn conclusion, statement 1 is correct, while statement 2 is incorrect. The value of the vote of each MLA varies from State to State, while the value of the vote of each MP, whether from the Lok Sabha or the Rajya Sabha, is the same.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44995", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p \u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eLaw and liberty are two concepts that are often in tension with each other. While laws are necessary to maintain order and protect citizens\u0026rsquo; rights, they can also limit individual freedom.\u003c/li\u003e\r\n\t\u003cli\u003eOn the other hand, liberty is essential for personal autonomy and self-determination, but without laws, chaos and anarchy can prevail. Out of the given options, option \u0026lsquo;B\u0026rsquo; is the most appropriate relationship between law and liberty.\u003c/li\u003e\r\n\t\u003cli\u003eWhen there are no laws, people can do whatever they want, which can lead to violence, exploitation, and oppression. Without laws, there can be no guarantee of safety, security, and justice. Therefore, without laws, there can be no real liberty.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, too many laws can also limit individual freedom and creativity. When there are too many restrictions, people may feel suffocated, and their potential may not be fully realized.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, there should be a balance between laws and liberty. Laws should be designed to protect individual rights and freedoms while ensuring social harmony and public welfare.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eConclusion:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn conclusion, law and liberty are essential for a just and democratic society. However, the relationship between them is complex and involves trade-offs between individual and collective interests.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, laws should be carefully crafted, and their implementation should be monitored to ensure that they do not unduly restrict individual freedom and autonomy.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted" tant}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAccording to Article 361:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eNo criminal proceedings whatsoever shall be instituted or continued against the President, or the Governor of a State, in any court during his term of office. (Hence statement 1 is correct) No process for the arrest or imprisonment of the President, or the Governor of a State, shall issue from any court during his term of office.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAccording to Article 158:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Governor shall not be a member of either House of Parliament or of a House of the Legislature of any State specified in the First Schedule, and if a member of either House of Parliament or of a House of the Legislature of any such State is appointed Governor, he shall be deemed to have vacated his seat in that House on the date on which he enters upon his office as Governor.\u003c/li\u003e\r\n\t\u003cli\u003eThe Governor shall not hold any other office of profit. The Governor shall be entitled without payment of rent to the use of his official residences and shall be also entitled to such emoluments, allowances and privileges as may be determined by Parliament by law and, until provision in that behalf is so made, such emoluments, allowances and privileges as are specified in the Second Schedule. The emoluments and allowances of the Governor shall not be diminished during his term of office.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44998", "image_check": "0", "image_link_1": "", "image_link_2": "", "image xt/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following are regarded as the main features of the \u0026ldquo;Rule of Law\u0026rdquo;? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2018)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Limitation of powers\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Equality before law\u003c/p\u003e\r\n\r\n\u003cp\u003e3. People\u0026rsquo;s responsibility to the Government\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Liberty and civil rights\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the government that is responsible to the people and not the vice versa. (Hence statement 3 is not correct) The term \u0026ldquo;rule of law\u0026rdquo; is originated from England and India has adopted the concept.\u003c/li\u003e\r\n\t\u003cli\u003eThe basic features of Rule of Law as per Dicey: Law does not recognize any special rights for any individual or group of individuals.\u003c/li\u003e\r\n\t\u003cli\u003eLaw does not recognize any distinction between one individual and the other on the basis of religion, race, sex, etc. Hence statement 2 is correct. None is punished without proper trial.\u003c/li\u003e\r\n\t\u003cli\u003eAll will be tried by the same court under the same law. Rule of Law is to safeguard and advance the political and civil rights of the individual in a free society. Hence statement 4 is correct\u003c/li\u003e\r\n\t\u003cli\u003eThe rule of law does not give scope to absolute and arbitrary powers to the executive.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44999", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ethe Assembly of the State is automatically dissolved.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ethe powers of the Legislature of that State shall be exercisable by or under the authority of the Parliament.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArticle 19 is suspended in that State.\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ethe President can make laws relating to that State.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIf the President of India exercises his power as provided under Article 356 of the Constitution in respect of a particular State, then............ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2018)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 356 of the Indian Constitution is also known as \u0026ldquo;President\u0026rsquo;s Rule.\u0026rdquo;\u003c/li\u003e\r\n\t\u003cli\u003eIt grants the President of India the authority to take direct control of a state\u0026rsquo;s administration if the state government is unable to function according to the provisions of the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThis usually happens when the state government loses its majority in the legislative assembly or when there is a breakdown of the Constitutional machinery in the state.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWhen the President exercises this power, the following things happen:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Article 19 is NOT suspended in that state. This provision guarantees the right to freedom of speech and expression, and assembly, among others.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe President\u0026rsquo;s Rule does not automatically lead to the suspension of these fundamental rights in the affected state.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e2. The assembly of that state is NOT dissolved automatically. Instead, the President may either suspend or dissolve the state legislative assembly. \u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe decision to dissolve the assembly or keep it in suspended animation depends on the specific situation and the President\u0026rsquo;s discretion.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e3. The President does NOT get the powers of the state high courts. The judiciary remains independent and continues to function as usual.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;The high courts and the Supreme Court still retain their power of judicial review over the actions taken by the President and the central government during President\u0026rsquo;s Rule.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e4. Parliament assumes the power to legislate on subjects in the state list.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;This means that during President\u0026rsquo;s Rule, the Parliament can make laws on any subject that falls under the jurisdiction of the state government.\u003c/li\u003e\r\n\t\u003cli\u003eThe central government, acting through the President, takes over the state\u0026rsquo;s executive powers, and Parliament assumes the role of the state legislature.\u003c/li\u003e\r\n\t\u003cli\u003eIn summary, when the President of India exercises his power under Article 356 in respect of a particular state, Parliament assumes the power to legislate on subjects in the state list.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45000", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCommittee on Government Assurances\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: o-thirds of total members of that House present and voting.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Judges Enquiry Act (1968) regulates the procedure relating to the removal of a judge of the Supreme Court by the process of impeachment. Hence, statement 3 is correct. A removal motion signed by 100 members (in the case of Lok Sabha) or 50 members (in the case of Rajya Sabha) is to be given to the Speaker/Chairman.\u003c/li\u003e\r\n\t\u003cli\u003eThe Speaker/Chairman may admit the motion or refuse to admit it. Hence statement 1 is not correct. If it is admitted, then the Speaker/Chairman is to constitute a three-member committee to investigate into the charges.\u003c/li\u003e\r\n\t\u003cli\u003eThe committee should consist of (a) the chief justice or a judge of the Supreme Court, (b) a chief justice of a high court, and (c) a distinguished jurist. If the committee finds the judge to be guilty of misbehaviour or suffering from an incapacity, the House can take up the consideration of the motion.\u003c/li\u003e\r\n\t\u003cli\u003eAfter the motion is passed by each House of Parliament by special majority, an address is presented to the president for removal of the judge. Hence, Statement 4 is correct.Statement 1 is incorrect and 4 is correct by elimination we can see that only option C is correct.\u003c/li\u003e\r\n\t\u003cli\u003eFinally, the president passes an order removing the judge. Statement 2 is not correct: The constitution nowhere defines the term \u0026ldquo;incapacity and proved misbehaviour\u0026rdquo;\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45008", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eJawaharlal Nehru\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLal Bahadur Shastri\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\" cation) Act, 1959 exempts several posts from disqualification. Like\u0026ndash;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e(i) Ministers of State and Deputy Ministers\u003c/p\u003e\r\n\r\n\u003cp\u003e(ii) Parliamentary Secretaries and Parliamentary Under Secretaries\u003c/p\u003e\r\n\r\n\u003cp\u003e(iii) Deputy Chief Whips in Parliament\u003c/p\u003e\r\n\r\n\u003cp\u003e(iv) Vice-Chancellors of Universities\u003c/p\u003e\r\n\r\n\u003cp\u003e(v) Officers in the National Cadet Corps, and the Territorial Army\u003c/p\u003e\r\n\r\n\u003cp\u003e(vi) the Chairman and members of Advisory\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eCommittees set up by the Government when they are not entitled to any fee or remuneration other than compensatory Etc. Hence, Statement 1 is correct.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatement 2:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt has been amended 5 times since its formulation 1960, 19992,1993,2006 and 2013. \u003cstrong\u003eHence, statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eStatement 3 :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe law or the constitution of India does not clearly define what constitutes an office of profit but the definition has evolved over the years with interpretations made in various court judgments. \u003cstrong\u003eHence Statement 3 is incorrect. \u003c/strong\u003eBy this information we can eliminate option b, c and d\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45010", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003 d the Scheduled Tribes and Other Traditional Forest Dwellers (Recognition of Forest Rights) Act, 2006 or any other relevant statutory acts protecting the interests of tribals.\u003c/li\u003e\r\n\t\u003cli\u003eUnder the Fifth Schedule, the Governor may by public notification, direct that any particular Act of Parliament or of the Legislature of the State shall or shall not apply to a Scheduled Area or any part thereof in the State\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45011", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe decisions taken by the. Election Commission of India while discharging its duties cannot be challenged in any court of law.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Supreme Court of India is not constrained in the exercise of its powers by the laws made by Parliament.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the event of grave financial crisis in the country, the President of India can declare Financial Emergency without the counsel from the Cabinet.\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eState Legislatures cannot make laws on certain matters without the concurrence of Union Legislature.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the Constitution of India, prohibitions or limitations or provisions contained in ordinary laws cannot act as prohibitions or limitations on the constitutional powers under Article 142. It could mean which one of the following? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 142 of the Constitution of India empowers the Supreme Court to pass any decree or order necessary for doing \u0026ldquo;complete justice\u0026rdquo; in any matter pending before it. This means that the Court\u0026rsquo;s constitutional powers under Article 142 override ordinary laws when required to ensure justice.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, prohibitions or limitations contained in ordinary laws cannot restrict or limit the constitutional authority granted to the Supreme Court by Article 142.\u003c/li\u003e\r\n\t\u003cli\u003eThe intent is to allow the apex court to transcend procedural or statutory constraints to uphold justice in exceptional circumstances.\u003c/li\u003e\r\n\t\u003cli\u003eHence, option (b) correctly reflects the meaning of the statement in the question.\u003c/li\u003e\r\n\t\u003cli\u003eOption (a) is incorrect because the decisions of the Election Commission of India can indeed be reviewed by courts under judicial review; it is not beyond legal scrutiny.\u003c/li\u003e\r\n\t\u003cli\u003eOption (c) is incorrect because the President cannot declare a Financial Emergency without the written advice of the Council of Ministers as per Article 74.\u003c/li\u003e\r\n\t\u003cli\u003eOption (d) is incorrect because it deals with legislative relations between the Union and States, which is unrelated to the powers of the Supreme Court under Article 142.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45012", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img ve proceedings across the Union and State legislatures.\u003c/li\u003e\r\n\t\u003cli\u003eArticle 208(1) allows a House of the State Legislature to make its own rules, but until such rules are made, the rules of the Lok Sabha are followed with necessary modifications. Thus, statement 2 is correct.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45013", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAll political parties in the Parliament are represented in the Government\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Government is responsible to the Parliament and can be removed by it\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Government is elected by the people and can be removed by them\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Government is chosen by the Parliament but cannot be removed by it before completion of a fixed term\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA Parliamentary System of Government is one in which.......... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA parliamentary system of government is a form of government where the executive branch is accountable to the legislature.\u003c/li\u003e\r\n\t\u003cli\u003eIn this system, the head of the government is usually a member of the legislature, and is appointed by the head of state or elected by the members of the legislature.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFeatures of Parliamentary System :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe main features of a parliamentary system of government are: \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Executive Branch:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe executive branch of the government is responsible to the legislature. The head of the government is usually a member of the legislature, and is appointed by the head of state or elected by the members of the legislature.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Legislature:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe legislature is the main law-making body of the government. It is responsible for passing laws and scrutinizing the government\u0026rsquo;s policies and actions.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Responsible Government:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn a parliamentary system, the government is responsible to the legislature. This means that the government must answer to the legislature for its actions, and can be removed from office if it loses the confidence of the legislature.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Separation of Powers:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe executive, legislature, and judiciary are separate branches of government, with their own powers and responsibilities.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, the executive is accountable to the legislature, and the judiciary is independent of the other two branches.\u003c/li\u003e\r\n\t\u003cli\u003eOption B is the correct answer because in a parliamentary system of government, the government is responsible to the parliament and can be removed by it. This means that the government must answer to the parliament for its actions, and can be removed from office if it loses the confidence of the parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThis is a key feature of parliamentary democracy, and ensures that the executive is accountable to the people through their elected representatives.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video" logies is the final goal of a stateless society.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGandhism:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eGandhism is a philosophy developed by Mahatma Gandhi, an Indian nationalist leader who led the Indian independence movement against British rule. Gandhism emphasizes non-violent resistance or civil disobedience as a means of social and political change.\u003c/li\u003e\r\n\t\u003cli\u003eGandhism advocates for a decentralized and self-sufficient economic system based on local production and Consumption. Gandhism emphasizes the importance of moral values such as truth, non-violence, and compassion.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMarxism:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMarxism is a political and economic theory developed by Karl Marx and Friedrich Engels. Marxism emphasizes the role of class struggle in history and advocates for the overthrow of the capitalist system.\u003c/li\u003e\r\n\t\u003cli\u003eMarxism advocates for a centralized and planned economy based on public ownership of the means of production.\u003c/li\u003e\r\n\t\u003cli\u003eMarxism emphasizes the importance of material conditions and economic determinism in shaping social and political relations.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFinal goal of a stateless society:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBoth Gandhism and Marxism share the finalgoal of a stateless society, where there is no government or ruling class. Gandhism sees the stateless society as a natural outcome of a decentralized and self-sufficient economic system based on local production and consumption.\u003c/li\u003e\r\n\t\u003cli\u003eMarxism sees the stateless society as a natural outcome of the overthrow of the capitalist system and the establishment of a socialist society based on public ownership of the means of production.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45017", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAn agency for widening the scope of parliamentary democracy\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAn agency for strengthening the structure of federalism\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-wid 3e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich reference to the provisions contained in Part IV of the Constitution of India, which of the following statements is/are correct? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. They shall be enforceable by courts.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. They shall not be enforceable by any court\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The principles laid down in this part are to influence the making of laws by the State.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe phrase \u0026lsquo;Directive Principles of State Policy\u0026rsquo; denotes the ideals that the State should keep in mind while formulating policies and enacting laws. These are the constitutional instructions or recommendations to the State in legislative, executive and administrative matters.\u003c/li\u003e\r\n\t\u003cli\u003eThe Directive Principles resemble the \u0026lsquo;Instrument of Instructions\u0026rsquo; enumerated in the Government of India Act of 1935.\u003c/li\u003e\r\n\t\u003cli\u003eIn the words of Dr. B.R. Ambedkar, \u0026lsquo;the Directive Principles are like the instrument of instructions, which were issued to theGovernor General and to the Governors of the colonies of India by the British Government under the Government of India Act of 1935.\u003c/li\u003e\r\n\t\u003cli\u003eWhat is called Directive Principles is merely another name for the instrument of instructions. The only difference is that they are instructions to the legislature and the executive\u0026rsquo;.\u003c/li\u003e\r\n\t\u003cli\u003eThe Directive Principles constitute a very comprehensive economic, social and political programme for a modern democratic State. They aim at realizing the high ideals of justice, liberty, equality and fraternity as outlined in the Preamble to the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThey embody the concept of a \u0026lsquo;welfare state\u0026rsquo; and not that of a \u0026lsquo;police state\u0026rsquo;, which existed during the colonial era.\u003c/li\u003e\r\n\t\u003cli\u003eIn brief, they seek to establish economic and social democracy in the country. The Directive Principles are non-justiciable in nature, that is, they are not legally enforceable by the courts for their violation. Therefore, the government (Central, state and local) cannot be compelled to implement them.\u003c/li\u003e\r\n\t\u003cli\u003eNevertheless, the Constitution (Article 37) itself says that these principles are fundamental in the governance of the country and it shall be the duty of the State to apply these principles in making laws. \u003cstrong\u003eHence, statements 2 and 3 are correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sor ": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eEvery citizen who is 18 years old on the qualifying date (January 1 of the year in case) unless disqualified, is eligible to be enrolled as a voter. An individual who is not an MLA can become a minister if he gets himself elected to the State Legislature within six months from the date of his appointment.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, while the voting age is at 18 years, a person can be an MLA only after 25 years of age. Section 8 of RPA, 1951 states the grounds for disqualification on conviction of certain offenses pursuant to Section 8 of RPA, 1951.\u003c/li\u003e\r\n\t\u003cli\u003eThe convicted candidate is disqualified from being a member of either house of Parliament or State Legislature from the date of such conviction till the stated time. This is not permanent.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "426", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45021", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/sty
