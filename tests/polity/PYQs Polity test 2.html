function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

p\u003e\u003cstrong\u003eThey are a way to enforce the rights of the people and to compel authorities to fulfill their duties.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Habeas Corpus :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is the greatest hallmark of personal liberty.\u003c/li\u003e\r\n\t\u003cli\u003eHabeas Corpus is a fundamental right in the Constitution that protects against unlawful and indefinite imprisonment. It is a writ that requires an arrested person to be presented in front of a judicial magistrate to ensure they are not detained under unlawful grounds.\u003c/li\u003e\r\n\t\u003cli\u003eHabeas Corpus has historically been an important instrument to safeguard individual freedom against arbitrary executive power. The Court has described the writ of habeas corpus as a great constitutional privilege or the first security of civil liberty.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Mandamus Writ :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA writ of mandamus is a formal legal document that orders a government official or lower court to do something. The word mandamus comes from Latin and means \u0026ldquo;we command\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. What is Certiorari Writ :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA writ of certiorari is a legal term that means \u0026ldquo;to be more fully informed\u0026rdquo;. It is a higher court\u0026rsquo;s acceptance of a petition to review a lower court\u0026rsquo;s ruling. The higher court may then quash the lower court\u0026rsquo;s decision.\u003c/li\u003e\r\n\t\u003cli\u003eThe word certiorari comes from Latin Law. A writ of certiorari orders a lower court to provide its case record so that the higher court can review it.\u003c/li\u003e\r\n\t\u003cli\u003eThe Supreme Court grants certiorari in cases involving constitutional issues, compelling interests, or relevant social issues.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. What is Quo Warranto Writ?\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA quo warranto writ is a court order that asks a public official to demonstrate the authority they have for holding their position.\u003c/li\u003e\r\n\t\u003cli\u003eIf the court determines that the official is not qualified for their position, they may be removed. A quo warranto writ also allows citizens to question the legality of a public appointment.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e5. What is Prohibition Writ?\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA writ of prohibition is a legal remedy that prevents a lower court, administrative body, or tribunal from exceeding its jurisdiction or acting unlawfully. It is also known as a \u0026ldquo;Stay Order\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eA writ of prohibition is issued by a higher court to a lower court or tribunal after the lower courts have declared their judgments. It directs a subordinate to stop doing something the law prohibits.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44634", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u  policies :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;The NDC promotes standard economic policies in important areas.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e6. Ensuring balanced development :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;The NDC ensures the balanced and rapid development of all parts of the country.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e7. Acting as a bridge :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe NDC acts as a bridgebetweentheUnionGovernment,the Planning Commission, and the State Governments.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e8. Coordinating policies :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe NDC helps coordinate policies and programs of plans and other matters of national importance.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The NDC is an apex body that approves f ive-year plans. It was established on August 6, 1952, and is headquartered in New Delhi. The Prime Minister heads the NDC.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44637", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !i ill again without making any changes after the President sends it back for reconsideration, the President must give assent to the bill. The President can return a bill to the Lok Sabha for reconsideration if it is not amoney bill.\u003c/li\u003e\r\n\t\u003cli\u003eHowever, if the bill is passed again by the Parliament, with or without amendments, the President must give assent to the bill. The President also cannot return a Money Bill to the House for reconsideration. The President must also give assent to a Constitutional Amendment Bill.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWhat is Veto Power of President?\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eA veto is the power to refuse to approve or admit something, or to refuse assent to a legislative bill. It can also refer to the power of a government branch to cancel or postpone the decisions of another branch. For example, a president or governor can use their veto power to reject bills passed by the legislature.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe President of India has three types of veto powers: \u003c/strong\u003eAbsolute veto, Suspensive veto, Pocket veto.\u003cstrong\u003e \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Absolute veto :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a veto that cannot be overridden.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Suspensive veto :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a veto that temporarily suspends a law until the legislature reconsiders it. A suspensive veto can be overridden by a simple majority.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Pocket veto :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a legislative maneuver that allows a president or other official wi p\u003e\r\n\r\n\u003cp\u003e2. the Rajya Sabha.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe President of India acts as the head of both houses.\u003c/li\u003e\r\n\t\u003cli\u003eThe Constitution Makers opted for a Federal form of Government due to India\u0026rsquo;s linguistic and regional diversity.\u003c/li\u003e\r\n\t\u003cli\u003eJudicial powers of the parliament includes the power to impeach the President for violation of the Constitution, the power to remove the judges of Supreme Court and High Court on the grounds of proved misbehaviour and incapacity, the power to remove the Vice President etc.\u003c/li\u003e\r\n\t\u003cli\u003eCertain consequential powers are also vested in the Parliament so as to protect the privileges and immunities vested in it. It includes the power of the legislature to punish any person, whether he is a member or not, for the breach of privilege or for contempt of the house.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44662", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{ove 26ndash; Corrupt Practices under the RPA, 1951:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. Bribery \u0026mdash; \u003c/strong\u003eincludes giving or offering money, gifts, or any kind of gratification to induce a person to vote or not to vote. So, Statement 1 (Giving gifts to voters to induce them to vote) = Corrupt practice.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. Undue Influence \u0026mdash;\u003c/strong\u003e includes direct or indirect interference with the free exercise of electoral rights, including appeals to religion, caste, race, or community to gain votes. Hence, Statement 2 (Appealing for votes on the grounds of caste or religion) = Corrupt practice.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. Publication of false statements \u0026mdash;\u003c/strong\u003e making or publishing false statements of fact about a candidate\u0026rsquo;s personal character or conduct with intent to influence election results. Therefore, Statement 3 (False character assassination of other candidates) = Corrupt practice.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. Propagation and glorification of sati \u0026mdash;\u003c/strong\u003e is indeed a punishable offence, but under a different law:\u003cstrong\u003e \u003c/strong\u003eThe Commission of Sati (Prevention) Act, 1987. It is not included under Section 123 of the RPA. So, Statement 4 is not a corrupt practice under the election law. \u003cstrong\u003eThus, the correct answer is (C) 1,2 and 3.\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44681", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 4 are correct\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4 are correct\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3 are correct\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 4 are correct\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements regarding a Noconfidence Motion in the Parliament............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1990)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. There is mention of a No-confidence Motion in the Constitution of India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A period of six months must lapse between the introduction of one No- confidence motion and the other.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. At least 100 members must support a Motion of No-confidence before it is introduced in the House.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. A motion of No confidence can be introduced in the Lok Sabha only\u003c/p\u003e\r\n\r\n\u003cp\u003eOf these statements:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAlthough the Constitution does not directly use the term \u0026ldquo;No-confidence Motion\u0026rdquo;, Article 75(3) clearly states that \u0026ldquo;the Council of Ministers shall be collectively responsible to the House of the People.\u0026rdquo; This article implies the concept of a no-confidence motion \u0026mdash; because the Council of Ministers must resign if it loses the confidence of the Lok Sabha. \u003cstrong\u003eHence, statement 1 is considered correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThere is no six-month interval requirement specified in the Constitution or in the Lok Sabha Rules for successive no-confidence motions in the Lok Sabha. (Some legislatures elsewhere or some local rules may prescribe time-gaps, which creates confusion in secondary sources, but Lok Sabha practice/rules do not impose a fixed six-month ban between successive no-confidence motions.) \u003cstrong\u003eHence, statement 2 is incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eThe threshold for admission of a no-confidence motion in the Lok Sabha is 50 members (not 100). If at least 50 MPs indicate support when the Speaker reads the motion, the Speaker may allow the motion to be taken up for discussion. \u003cstrong\u003eHence, statement 3 is incorrect.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eUnder Rule 198 of the Rules of Procedure and Conduct of Business in the Lok Sabha, a No-confidence Motion can be moved only in the Lok Sabha, because the Council of Ministers is collectively responsible only to the Lok Sabha (not to the Rajya Sabha). The Rajya Sabha may discuss government functioning but cannot remove the government through a no-confidence motion.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, statement 4 is fully correct. \u003cstrong\u003eTherefore the final answer is (D) 1 and 4 only.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44682", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth A and R are true and R is the correct explanation of A.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth A and R are true but R is not a correct\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA is true but R is false.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA is false but R is true\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A) : Equality before the law is not applicable to the President of India. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1990)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R) : The President of India enjoys special powers and privileges under the Constitution.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eEquality before the law is not applicable to the President of India. This statement is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eIn a democratic society like India, the principle of equality before the law applies to all individuals, including the President of India.\u003c/li\u003e\r\n\t\u003cli\u003eThe President is not immune from the law and is subject to the same legal obligations and rights as any other citizen.\u003c/li\u003e\r\n\t\u003cli\u003eWhile the President enjoys certain immunities and privileges in the performance of their official duties, equality before the law remains a fundamental principle.\u003c/li\u003e\r\n\t\u003cli\u003eThe President of India enjoys special privileges under the Constitution of India.\u003c/li\u003e\r\n\t\u003cli\u003eThis statement is correct.\u003c/li\u003e\r\n\t\u003cli\u003eThe President of India does have certain special privileges and immunities granted by the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThese privileges are associated with the President\u0026rsquo;s role as the head of state and include immunity from legal proceedings for official acts, the right to address and attend sessions of Parliament, and the right to be consulted by the government on various matters.\u003c/li\u003e\r\n\t\u003cli\u003eThese privileges are designed to ensure the effective functioning and independence of the President\u0026rsquo;s office.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44683", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNation\u0026rsquo;s population as per the latest census by the number of Lok Sabha members\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003csty ap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBooth capturing is not mentioned or defined in the Constitution of India. It is defined under Section 135A of the Representation of the People Act, 1951, which was inserted by the Representation of the People (Amendment) Act, 1989 \u0026mdash; not by the 61st Constitutional Amendment (1989). \u003cstrong\u003eHence, statement 1 is factually wrong.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eAccording to Section 135A(1) (a), booth capturing includes seizing or taking possession of a polling station or ballot boxes by force to disrupt or prevent the proper conduct of elections. \u003cstrong\u003eThus, statement 2 correctly\u003c/strong\u003e describes one of the main forms of booth capturing.\u003c/li\u003e\r\n\t\u003cli\u003eSection 135A(1) (b) of the same Act states that booth capturing also includes threatening or intimidating voters to prevent them from exercising their right to vote.\u003cstrong\u003e Hence, statement 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eSection 135A(2) clearly declares booth capturing as a cognizable offence (i.e., police can arrest without a warrant) and makes it punishable with imprisonment for up to one year, or fine, or both.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, statement 4 is correct. \u003cstrong\u003eHence the answer is (A) 2, 3 and 4 are correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44696", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3  law gives political parties more control over their members. Some argue that defections can undermine the stability of the cabinet, which relies on the support of elected legislators.\u003c/li\u003e\r\n\t\u003cli\u003eThe Tenth Schedule defines \u0026ldquo;defection\u0026rdquo; as \u0026ldquo;to abandon a position or association, often to join an opposing group\u0026rdquo;.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eAccording to the anti-defection law in India, an elected member of Parliament may be disqualified on the ground of defection if:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. They voluntarily give up their membership of a political party\u003c/p\u003e\r\n\r\n\u003cp\u003e2. They vote or abstain from voting in the House contrary to the direction of their political party\u003c/p\u003e\r\n\r\n\u003cp\u003e3. They are elected as an independent candidate, but join a political party after the election\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDefection is defined as the conscious abandonment of allegiance or duty.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44704", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cs e\r\n\r\n\u003cp\u003e1. Supreme Court of India is free from the control and influence of legislature and executive\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Subordinate courts are at the head of the judicial hierarchy of the state.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Chief Justice and other judges of the High Court are appointed by the Governor in consultation with the Chief Justice of India\u003c/p\u003e\r\n\r\n\u003cp\u003e4. A High Court can withdraw a case from a subordinate court and can deal with the case itself if it is satisfied that the case involves a substantial point of constitutional Law\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to the Constitution of India, the judiciary is independent of the executive and legislative branches of government.\u003c/li\u003e\r\n\t\u003cli\u003eThe Supreme Court of India is free from the control and influence of the legislature and executive. The judiciary has the power of judicial review over the actions of the executive and the legislature.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eHere are some other facts about the judiciary in India:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Supreme Court\u0026rsquo;s decisions are binding on all courts within India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Supreme Court has original, appellate, writ, and advisory jurisdiction.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The President appoints the Chief Justice of a High Court after consulting with the Chief Justice of India and the Governor of the concerned state.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The President also appoints the judges of the High Court, but consults with the Chief Justice of the concerned high court.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. The district court is presided over by a District Judge appointed by the Governor with the consultation of the High Court.\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Decisions of the district court are subject to appeal to the High Court.\u003c/p\u003e\r\n\r\n\u003cp\u003e7. A High Court can withdraw a case from a subordinate court and can deal with the case itself if it is satisfied that the case involves a substantial point of constitutional Law\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44705", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither the finance commissions nor the planning commission is a constitutional body\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe scope of the Finance Commission is limited to a review of the revenue segment of the budget while the planning commission takes an overall review embracing both capital and revenue requirements of the states.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNo one can be a member of both the finance commission and planning commission at the same time.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThere is no overlapping of work and responsibility of the Finance Commission and those of the planning commission.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the followiing statements is correct? \u003cstrong\u003e(UPSC Prelims 1993)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe scope of the Finance Commission is limited to a review of the revenue segment of the budget while the planning commission takes an overall review embracing both capital and revenue requirements of the states.\u003c/li\u003e\r\n\t\u003cli\u003eThe bodies whose formation is prescribed by the constitution of India itself are known as Constitutional Bodies. The major responsibility that has been endowed upon the constitutional bodies is to take care of the law and order of the country.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIndia has around 20 constitutional bodies. Some important are mentioned below :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Election Commission of India\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Union Public Service Commission of India\u003c/p\u003e\r\n\r\n\u003cp\u003e3. State Public Service Commission of India\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Finance Commission\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Goods and Services Tax Council\u003c/p\u003e\r\n\r\n\u003cp\u003e6. National Commission for SCs\u003c/p\u003e\r\n\r\n\u003cp\u003e7. National Commission for STs\u003c/p\u003e\r\n\r\n\u003cp\u003e8. National Commission for BCS\u003c/p\u003e\r\n\r\n\u003cp\u003e9. Comptroller and Auditor General of India\u003c/p\u003e\r\n\r\n\u003cp\u003e10. Attorney General of India\u003c/p\u003e\r\n\r\n\u003cp\u003e11. Special Officer for Linguistic Minorities\u003c/p\u003e\r\n\r\n\u003cp\u003e12. Advocate General of State\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eDifference Between Planning and Finance Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Planning Commission and the Finance Commission are both institutions in India. The Planning Commission is a non statutory institution, while the Finance Commission is a constitutional body.\u003c/li\u003e\r\n\t\u003cli\u003eThe Planning Commission is responsible for developing policies and plans for the country\u0026rsquo;s development and advising the Government of India. The Planning Commission works under the guidance of the National Development Council (NDC).\u003c/li\u003e\r\n\t\u003cli\u003eThe Finance Commission decides how central taxes are shared between the states and the center. The Finance Commission also suggests ways to improve the finances of local bodies in the state.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44706", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDhebar Commission\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eKalelkar Commission\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKher Commission\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRajamannar Commission\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe abolition of the I.A.S. and the I.P.S. has been recommended by the............ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1993)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Rajamannar Commission, appointed in 1969, recommended abolishing the IAS, IPS, and IFS. The commission believed that these services interfered with the center\u0026rsquo;s day-to-day administration of the states.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe commission also recommended:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Granting states residuary powers\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Transferring some subjects from the Union and Concurrent Lists to the State List\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Establishing an Inter-State council\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Making the Finance Commission a permanent body\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Deleting Articles 356, 357, and 365, which deal with the President\u0026rsquo;s rule\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Replacing the Planning Commission with a statutory body\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Urging mandatory discussions with states before making decisions that affect their interests\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Rajamannar Committee also emphasized that the state\u0026rsquo;s governor should not consider himself an agent.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Dhebar Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt was established in 1961 to suggest ways to improve the administration of policies and programs for scheduled tribal areas.\u003c/li\u003e\r\n\t\u003cli\u003eThe commission\u0026rsquo;s chairman was Shri U. N. Dhebar.\u003c/li\u003e\r\n\t\u003cli\u003eThe commission\u0026rsquo;s findings, published in 1960\u0026ndash;1961, indicated that some tribes were developing at different rates than others. In response, the fourth Five Year Plan created a sub-category within the Scheduled Tribe grouping called \u0026ldquo;Primitive Tribal Group\u0026rdquo;.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1973, the commission created a separate category for Primitive Tribal Groups (PTGs), which are less developed tribal groups. In 2006, the Government of India renamed the PTGs as Particularly Vulnerable Tribal Groups (PVTGs).\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe criteria for identifying PVTGs include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A pre-agriculture level of technology\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A stagnant or declining population\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Extremely low literacy\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe central government has recognized 75 tribal communities as PVTGs based on the recommendations of the Dhebar Commission. PVTGs reside in 18 states and one union territory.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKalelkar Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the First Backward Classes Commission, was established in 1953. The commission was formed by a presidential order under Article 340 of the Constitution of India. The commission was chaired by journalist and social reformerKaka Kalelkar and presented its report in 1955.\u003c/li\u003e\r\n\t\u003cli\u003eThe commission was tasked with investigating the conditions of socially and educationally backward classes in India and making recommendations for action.\u003c/li\u003e\r\n\t\u003cli\u003eThe commission believed that social equality in India could only be achieved by eliminating caste distinctions and social discrimination.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eKher Commission :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as the Linguistic Provinces Commission, was established in 1948 to address the issue of linguistic states. The commission was appointed by the President of India to study and make recommendations regarding the use of an official language for the Indian government.\u003c/li\u003e\r\n\t\u003cli\u003eThe commission was headed by Shri Bal Gangadhar Kher, a prominent political leader and the Chief Minister of Bombay (now known as Mumbai) at the time.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to Article 343, the official language of the Union will be Hindi and the script Devanagari. Article 345 asks each state to legally adopt one or more languages spoken in their state along with Hindi as their official languages.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44707", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ehe himself is a candidate\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ehe is yet to prove his majority on the f loor of the Lower erflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ethe Indian Post Office (Amendments) Bill\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ethe Dowry Prohibition Bill\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe only instance when the President of India exercised his power of veto related to.............\u003cstrong\u003e (UPSC Prelims\u0026nbsp;1993)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e1. \u003c/strong\u003eThe President of India, Zail Singh, used a pocket veto to prevent the Indian Post Office (Amendment) Bill from becoming law. A pocket veto is when the President indefinitely postpones action on a bill and does not send it back to Parliament.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe President\u0026rsquo;s veto allows them to review acts passed by Congress and block measures they find unconstitutional, unjust, or unwise.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e2. The Hindu Code Bill :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a series of laws passed in the 1950s that aimed to reform and codify Hindu personal law in India. The laws replaced religious law with a common law code.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe bills include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Hindu Marriage Act, 1955\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Hindu Succession Act, 1956\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Hindu Minority and Citizenship Act, 1956\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The Hindu Adoptions and Maintenance Act, 1956\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Hindu Code Bill debate influenced the distribution of rights and resources within Indian families. It also enabled Indian society to align with its development model of modernization and planned economic progress.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Hindu Code Bill provisions include:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Women\u0026rsquo;s absolute share in property\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The elimination of caste restrictions in matters of marriage and adoption\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The elimination of polygamy and overture of monogamy.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBhimrao Ambedkar presented the draft in October 1947 in the Constituent Assembly and Nehru supported him.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e3. The PEPSU Appropriation Bill :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a bill that authorizes the government to withdraw funds from the Consolidated Fund of the State of Patiala and East Punjab States. The bill was introduced on March 28, 1953.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e4. The Dowry Prohibition Act, 1961:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is an Indian law that prohibits the giving or receiving of a dowry. The law was enacted on May 1, 1961.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to the law, a dowry is any property, goods, or money given by either party to a marriage, or by the parents of either party. This can also include anything given in connection with the marriage.\u003c/li\u003e\r\n\t\u003cli\u003eThe law makes it an offense to both give and take dowry. The punishment for giving or receiving dowry is a minimum of five years in prison and a fine of more than \u20b915,000, or the value of the dowry, whichever is higher.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44709", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img { bsp;1993)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (D)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIndia follows the system of single citizenship, meaning all Indians are citizens of India only, not of any state. In contrast, the United States has dual citizenship \u0026mdash; a person is both a citizen of the United States and of the individual state where they reside. Therefore, this feature is not common to both federations.\u003c/li\u003e\r\n\t\u003cli\u003eIndia\u0026rsquo;s Constitution divides powers between the Union and States into three lists \u0026mdash; Union, State, and Concurrent Lists (Seventh Schedule).\u003c/li\u003e\r\n\t\u003cli\u003eHowever, in the United States, the Constitution provides only a two-fold distribution of powers: powers of the Federal Government and the States; there is no \u0026ldquo;Concurrent List\u0026rdquo; as such. Hence, this feature is unique to India, not shared by the U.S. In the United States, there is a dual judiciary \u0026mdash; separate federal courts and state courts functioning independently of each other.\u003c/li\u003e\r\n\t\u003cli\u003eBut in India, we have a single integrated judiciary, with the Supreme Court at the top, followed by High Courts and Subordinate Courts, ensuring uniform interpretation of laws. So, this feature also differs between the two systems.\u003c/li\u003e\r\n\t\u003cli\u003eBoth India and the United States have a federal Supreme Court vested with the power to interpret the Constitution and settle disputes between the Union and the States.\u003c/li\u003e\r\n\t\u003cli\u003eIn India, this power arises from Articles 131 and 143, while in the U.S., it comes from the judicial review powers of the Supreme Court (established through Marbury v. Madison, 1803).\u003c/li\u003e\r\n\t\u003cli\u003eThus, this feature \u0026mdash; a federal Supreme Court acting as the guardian of the Constitution \u0026mdash; is common to both federations. \u003cstrong\u003eThus, the correct answer is D.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44713", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDisputes between the Centre and the States\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDisputes between the States interse\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eProtection of the Fundamental Rights\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eProtection against the violation of the Constitution\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following comes under the jurisdiction of both the High Courts and the Supreme Court? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1993)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eProtection of fundamental rights is a jurisdiction that both the Supreme Court and the High Courts share.\u003c/li\u003e\r\n\t\u003cli\u003eThe Supreme Court and the High Courts are both authorized to issue writs for the enforcement of fundamental rights.\u003c/li\u003e\r\n\t\u003cli\u003eThis means that the Constitution gives citizens the right to approach any court if their fundamental rights are violated. The Supreme Court has a wider jurisdiction than the High Courts when it comes to issuing writs.\u003c/li\u003e\r\n\t\u003cli\u003eDisputes between states also fall under the jurisdiction of both the Supreme Court and the High Courts.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eFundamental rights :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey are basic human rights that are guaranteed to all citizens of India. They are enshrined in the Constitution of India and are applied without discrimination on the basis of race, religion, gender, and more.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThere are six fundamental rights in the Indian Constitution. They are mentioned below along with the constitutional articles related to them:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Right to Equality (Article 14-18)\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Right to Freedom (Article 19-22)\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Right against Exploitation (Article 23-24)\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Right to Freedom of Religion (Article 25-28)\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Cultural and Educational Rights (Article 29-30)\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Right to Constitutional Remedies (Article 32)\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe fundamental rights are covered in Articles 12\u0026ndash;35 of the Constitution. They are enforceable by the courts, subject to certain conditions.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1978, the 44th constitutional amendment removed the Right to Property from the list of Fundamental Rights. This was because the right created problems in attaining the goal of socialism and equitable distribution of wealth.\u003c/li\u003e\r\n\t\u003cli\u003eFundamental rights are the standards to which everyone must be treated equally and respectfully in society. They are essential to society because they lay down the bare minimum standard of which a person has.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44714", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"t nged or destroyed by Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThis gives the courts extra power to review and strike down any constitutional amendments and acts enacted by Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eIn 1973, the Supreme Court of India ruled in the case of Kesavananda Bharati v. State of Kerala that the Parliament cannot change the basic structure of the Constitution.\u003c/li\u003e\r\n\t\u003cli\u003eThe court\u0026rsquo;s decision established the basic structure doctrine, which states that the Constitution\u0026rsquo;s fundamental features cannot be amended or abrogated by Parliament.\u003c/li\u003e\r\n\t\u003cli\u003eThe basic structure doctrine also states that although the Constitution, including Fundamental Rights, is amendable by Parliament, the basic structure cannot be abrogated by a constitutional amendment.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWhat is Basic Structure?\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a fundamental framework and set of principles that cannot be changed or amended by Parliament. The concept of the basic structure came about in 1973 in the landmark judgment of Kesavananda Bharati vs State of Kerala.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe basic structure includes:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe supremacy of the Constitution, The rule of law, Independence of the judiciary\u003c/li\u003e\r\n\t\u003cli\u003eDoctrine of separation of powers, Sovereign democratic republic, The parliamentary system of government, The principle of free and fair elections, Welfare state, Federalism, Secularism, The protection of fundamental rights.\u003c/li\u003e\r\n\t\u003cli\u003eThe basic structure also includes the separation of powers among the legislative, executive, and judicial branches. Amendments that concentrate power excessively in one branch are subject to judicial scrutiny.\u003c/li\u003e\r\n\t\u003cli\u003eThe Supreme Court added free and fair elections, sovereign, democratic, and republican structure to the basic structure in the 1993 Kihoto Hollohan Case.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44722", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\" n_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssertion (A) : In India, the political parties which formed the governments represented the majority of seats secured in the elections to the House of the People at the Centre and the Legislative Assemblies in the States but not the majority of votes.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eReason (R) : The elections based on the majority vote system decide the result on the basis of relative majority of votes secured.(352)\u003c/p\u003e\r\n\r\n\u003cp\u003eIn the context of the above statements, which one of the following is correct?\u003cstrong\u003e (UPSC Prelims 1994)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "304", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eEXPLANATION : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIndia follows the First-Past-The-Post (FPTP) or simple majority voting system in which the candidate who secures the highest number of votes in a constituency wins, regardless of whether they get an absolute majority (i.e., more than 50% of total votes cast).\u003c/li\u003e\r\n\t\u003cli\u003eAs a result, a political party can win a majority of seats in Parliament or the State Assembly without actually securing a majority of total votes at the national or state level.\u003c/li\u003e\r\n\t\u003cli\u003eFor example, in many general elections, the ruling party at the Centre received only about 35\u0026ndash;40% of the total votes, yet gained more than half the seats. Hence Assertion is correct.\u003c/li\u003e\r\n\t\u003cli\u003eThe \u0026ldquo;majority vote system\u0026rdquo; referred to here is actually the plurality system (or relative majority system) used in India.\u003c/li\u003e\r\n\t\u003cli\u003eUnder this system, the winner is the candidate who gets more votes than any other competitor, not necessarily more than half the votes. Hence Reason is correct.\u003c/li\u003e\r\n\t\u003cli\u003eThus, because India uses this relative majority system, political parties can secure a majority of seats without majority of votes, as explained in the Assertion. Therefore, both A and R are true, and R is the correct explanation of A.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "423", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "44731", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \
