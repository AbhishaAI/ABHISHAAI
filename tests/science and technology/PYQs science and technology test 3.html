xt/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements :\u0026nbsp;\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eDNA Barcoding can be a tool to...............\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Assess the age of a plant or animal.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Distinguish among species that look alike.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Identify undesirable animal or plant materials in processed foods.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDNA barcoding is the identification of a species by the characteristic sequence of a standard short section of DNA in its genome.\u003c/li\u003e\r\n\t\u003cli\u003eDNA barcoding is done by comparing an individual DNA sequence with a referencelibrary of such DNA sections (called sequences).\u003c/li\u003e\r\n\t\u003cli\u003eThe introduction of DNA barcoding represents a promising approach for food authentication, being broadly applied in fish species.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;DNA barcoding has been successful when applied to seafood because the number of species is high in comparison to other animal sources, such as cattle, sheep, goat, and horse, enhancing the effectiveness of the approach.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;DNA barcoding techniques were used to explore the composition of roasted barley tea (Hordeum vulgare), which was exported to a certain country from China but then returned, due to the detection of other undesirable plant components present.\u003c/li\u003e\r\n\t\u003cli\u003eContaminants were found. \u003cstrong\u003eHence option 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eDNA barcoding will allow users to efficiently recognize known species and speed the discovery of species yet to be found in nature.\u003c/li\u003e\r\n\t\u003cli\u003eThere have been reports of DNA barcodes used in distinguishing species of tropical Lepidoptera (an order of insects that includes butterflies and moths which are similar).\u003c/li\u003e\r\n\t\u003cli\u003eDNA barcodes effectively distinguish among species in three Lepidoptera families from Area de Conservaci\u0026oacute;n Guanacaste in northwestern Costa Rica. \u003cstrong\u003eHence option 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eHowever, DNA barcoding is not known to be used for the assessment of age of living organisms.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47627", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003 idth:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2023)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Carbon fibres are used in the manufacture of components used in automobiles and aircrafts.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Carbon fibres once used cannot be recycled.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is fare correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;Carbon fibres can be defined as fibres with a carbon content of 90% or above.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;They are produced by the thermal conversion of organic fibres with a lower carbon content such as polyacrylonitrile (PAN) containing several thousand f ilaments with diameters between 5 and 10 \u0026mu;m.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Aerospace and automobiles were some of the first industries to adopt carbon fibre.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The high modulus of carbon fibre makes it suitable structurally to replace alloys such as aluminium and titanium.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The weight savings carbon fibre provides is the primary reason carbon fibre has been adopted by the aerospace industry. So, statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Currently, the most common recycling process used to recover carbon fibre from composite waste is pyrolysis, where high heat basically burns off the resin.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Solvolysis, which uses a solvent to dissolve the resin, has long been claimed to offer superior properties.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;However, one of the main challenges to date has been obtaining recycled carbon fibre keeping the same mechanical properties as virgin carbon fibre. So, statement 2 is not correctTherefore, option (a) is the correct answer.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47628", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow- y pollution : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2023)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Gold mining activity is a source of mercury pollution in the world.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Coal-based thermal power plants cause mercury pollution.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. There is no known \u0026middot;safe level of exposure to mercury.\u003c/p\u003e\r\n\r\n\u003cp\u003eHow many of the above statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMercury (Hg) is a global pollutant that affects human and ecosystem health. We synthesize understanding of sources, atmosphere -land-ocean Hg dynamics and health effects, and consider the implications of Hg-control policies.\u003c/li\u003e\r\n\t\u003cli\u003ePrimary anthropogenic Hg emissions greatly exceed natural geogenic sources, resulting in increases in Hg reservoirs and subsequent secondary Hg emissions that facilitate its global distribution.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The ultimate fate of emitted Hg is primarily recalcitrant soil pools and deep ocean waters and sediments.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;One major source of mercury emissions is small-scale gold mining that occurs in many countries.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Artisanal gold mining currently contributes more than 35 per cent of all global mercury emissions created by people.\u003cstrong\u003e So, statement 1 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eCoal-based thermal power plants are a known source of mercury pollution. When coal is burned to generate electricity, trace amounts of mercury present in coal can be released into the atmosphere as emissions. These emissions contribute to mercury pollution. \u003cstrong\u003eSo, statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eAcute or chronic mercury exposure can cause adverse effects during any period of development.\u003c/li\u003e\r\n\t\u003cli\u003eMercury is a highly toxic element; there is no known safe level of exposure.\u003c/li\u003e\r\n\t\u003cli\u003eIdeally, neither children nor adults should have any mercury in their bodies because it provides no physiological benefit. \u003cstrong\u003eSo, statement 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eTherefore, option c is the correct answer\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47634", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly one\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type= important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation: (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003ePer- and polyfluoroalkyl substances (PFAS) are chemicals that resist grease, oil, water, and heat which are used in stain- and water-resistant fabrics and carpeting, cleaning products, paints, and fire-fighting foams. Certain PFAS are also authorised by the FDA for limited use in cookware, food packaging, and food processing equipment.\u003c/li\u003e\r\n\t\u003cli\u003ePFAS are found majorly in drinking water, foods, food packaging materials and other consumer products. \u003cstrong\u003eHence, statement 1 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eChemically, PFAS have a carbon-fluorine bond, which is very strong and therefore, they do not degrade easily. \u003cstrong\u003eHence, statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eAccumulation of certain PFAS has also been shown through blood tests to occur in humans and animals. Over time, people may take in more of the chemicals than they excrete, a process that leads to bioaccumulation in bodies. \u003cstrong\u003eHence, statement 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47640", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u00 t/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to radioisotope thermoelectric generators (RTGs), consider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2024)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. RTGs are miniature fission reactors.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. RTGs are used for powering the onboard systems of spacecrafts.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. RTGs can use Plutonium-238, which is a by-product of weapons development.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;Radioisotope Thermoelectric Generators (RTGs) are lightweight, reliable, compact and having longevity also durable power systems that support spacectraft systems. They are also known as \u0026ldquo;nuclear batteries\u0026rdquo;. \u003cstrong\u003eHence, statement 1 is not correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;RTGs are mainly used where solar power is impractical, such as deep space exploration. RTGs have been successfully employed by US spacecraft for eg Voyage Cassini and Curiosity. \u003cstrong\u003eHence, statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;RTGs provide electrical power using heat from the natural radioactive decay of plutonium-238, in the form of plutonium oxide and then they are converted into electric energy. \u003cstrong\u003eHence, statement 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Hence, option (b) is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003e\u0026nbsp;Which one of the following is synthesised in human body that dilates blood vessels and increases blood flow?\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e(a) Nitric oxide\u003c/p\u003e\r\n\r\n\u003cp\u003e(b) Nitrous oxide\u003c/p\u003e\r\n\r\n\u003cp\u003e(c) Nitrogen dioxide\u003c/p\u003e\r\n\r\n\u003cp\u003e(d) Nitrogen pentoxide\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eNitric oxide is an essential molecule required for health. NO is synthesized in human body. Nitric oxide performs function of vasodilator which helps the blood vessels to relax and expand.\u003c/li\u003e\r\n\t\u003cli\u003eThis effect allows blood, nutrients, and oxygen to flow freely to every part of the body. But when nitric oxide production is decreased, your health can become deterioted.\u003c/li\u003e\r\n\t\u003cli\u003eFor this purpose it is important to achieve and maintain optimal levels of nitric oxide in the body. Nitric oxide dilates blood vessels, raising blood supply and lowering blood pressure.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eHence, option (a) is correct.\u00 ement.\u003c/p\u003e\r\n\r\n\u003cp\u003eIII. It will provide benefits only in aviation but not in other modes of transportation.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003e\u003cstrong\u003eExplanation: (d) I and II only\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eStatement I is correct: GAGAN (GPS Aided GEO Augmented Navigation) is designed to provide additional accuracy, integrity, and reliability to GPS signals, improving positioning services.\u003c/li\u003e\r\n\t\u003cli\u003eStatement II is correct: By improving navigation accuracy, GAGAN enables more efficient and uniform air traffic management, especially in congested or difficult terrains.\u003c/li\u003e\r\n\t\u003cli\u003eStatement III is incorrect: While GAGAN was primarily developed for aviation, it is also beneficial for other sectors like railways, maritime, agriculture, and surveying.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}];
const QUIZ_TITLE = "Sci \u0026 Tech PYQ Test 3";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
