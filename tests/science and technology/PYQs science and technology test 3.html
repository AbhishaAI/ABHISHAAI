function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Nuclear Suppliers Group (NSG) is a group of nuclear supplier countries that seeks to contribute to the non-proliferation of nuclear weapons through the implementation of two sets of Guidelines for nuclear exports and nuclear-related exports.\u003c/li\u003e\r\n\t\u003cli\u003eThe NSG Guidelines also contain the so-called \u0026ldquo;Non-Proliferation Principle,\u0026rdquo; adopted in 1994, whereby a supplier authorises a transfer only when satisfied that the transfer would not contribute to the proliferation of nuclear weapons.\u003c/li\u003e\r\n\t\u003cli\u003eThe Non-Proliferation Principle seeks to cover the rare but important cases where adherence to the NPT or to a Nuclear Weapon Free Zone Treaty may not by itself be a guarantee that a State will consistently share the objectives of the Treaty or that it will remain in compliance with its Treaty obligations.\u003c/li\u003e\r\n\t\u003cli\u003eThe NSG Guidelines are consistent with, and complement, the various international, legally binding instruments in the field of nuclear non-proliferation.\u003c/li\u003e\r\n\t\u003cli\u003eThese include the Treaty on the Non Proliferation of Nuclear Weapons (NPT), the Treaty for the Prohibition of Nuclear Weapons in Latin America (Treaty of Tlatelolco), the South Pacific Nuclear-Free Zone Treaty (Treaty of Rarotonga), the African Nuclear-Weapon-Free Zone Treaty (Treaty of Pelindaba), the Treaty on the Southeast Asia Nuclear-Weapon-Free Zone (Treaty of Bangkok), and the Central Asian Nuclear-Weapon-Free Zone Treaty (Treaty of Semipalatinsk)\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47577", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 Only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-w  used?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Chlorophyll content in the vegetation of a specific location\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Greenhouse gas emissions from rice paddies of a specific location\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Land surface temperatures of a specific location\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eWith the development of remote sensing from space, satellite data offers the possibility for measuring land surface temperature over the entire globe with sufficiently high temporal resolution and with complete spatially averaged rather than point values. \u003cstrong\u003eHence, statement 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eIt is also possible to measure chlorophyll content in the vegetation of a specific location as chlorophyll will reflect more light in the green and near infrared spectrum compared to other wavelengths. \u003cstrong\u003eHence, statement 1 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003eRemote sensing from satellites can also deliver information on green house gas(GHGs) soil emissions by estimating tropospherical, near-surface CO2 and CH4 concentrations based on the measurement of the intensity of the reflected sunlight in small wavelength bands in the visible and short-wavelength IR portion of the spectrum.\u003c/li\u003e\r\n\t\u003cli\u003eSo, greenhouse gas emissions from rice paddies of a specific location can also be estimated by satellite image/remote sensing data. \u003cstrong\u003eHence, statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47578", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 Only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:10 003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to communication technologies, what is/are the difference/ differences between LTE (Long-Term Evolution) and VoLTE (Voice over Long Term Evolution)? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. LTE is commonly marketed as 3G and VoLTE is commonly marketed as advanced 3G.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. LTE is data-only technology and VoLTE is voice-only technology.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eVoLTE is a technology update to the LTE protocol used by mobile phone networks.\u003c/li\u003e\r\n\t\u003cli\u003eUnder LTE, the infrastructure of telecom players only allows transmission of data while voice calls are routed to their older 2G or 3G networks.\u003c/li\u003e\r\n\t\u003cli\u003eThis is why, under LTE, you cannot access your 4G data services while on a call.\u003c/li\u003e\r\n\t\u003cli\u003eThis leads to problems such as slow internet speeds and poor voice clarity.\u003c/li\u003e\r\n\t\u003cli\u003eVoLTE allows voice calls to be packaged and carried through LTE networks.\u003c/li\u003e\r\n\t\u003cli\u003eThis means that 4G data is accessible even during calls.\u003c/li\u003e\r\n\t\u003cli\u003eVoL "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;A digital signature is an electronic method of signing an electronic document and ensuring that the original content is unchanged. It is used to establish the authenticity and integrity of a document. Here are the explanations for each statement:\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e1. An electronic record that identifies the certifying authority issuing it :This statement is incorrect. A digital signature is an electronic record that identifies the signatory, not the certifying authority issuing it.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;The digital signature is created using the signer\u0026rsquo;s private key, which is issued by a certifying authority.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e2. Used to serve as proof of identity of an individual to access information of server on the Internet: This statement is incorrect.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;A digital signature is not used as proof of identity to access information on a server.\u003c/li\u003e\r\n\t\u003cli\u003eIt is used to sign electronic documents to establish their authenticity and integrity.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e3. An electronic method of signing an electronic document and ensuring that the original content is unchanged: This statement is correct.\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;A digital signature is created using the signer\u0026rsquo;s private key and is attached to an electronic document to ensure that the original content is unchanged. It also serves as proof that the document was signed by the signer.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, the correct answer is option C, i.e., statement 3 only.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47583", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u  the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;Carbon nanotubes are cylindrical structures made up of carbon atoms arranged in a unique pattern.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;They have several unique properties that make them useful in a variety of applications, including medicine.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e1. Use as drug and antigen carriers in the human body Carbon nanotubes have a large surface area and can be functionalized with different molecules to carry drugs and antigens to specific parts of the body. . This makes them useful in targeted drug delivery and immunotherapy.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Use in artificial blood capillaries Carbon nanotubes can be used to create artificial blood capillaries that mimic the natural structure of capillaries in the human body. This makes them useful in repairing damaged blood vessels and improving blood flow in injured tissues.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Use in biochemical sensors Carbon nanotubes have a high sensitivity to changes in their environment, making them useful in biochemical sensors. They can detect the presence of various molecules, including glucose, DNA, and proteins, and can be used in diagnostic tests and monitoring systems.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Biodegradability of carbon nanotubes Carbon nanotubes are not biodegradable and can persist in the % !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Pneumococcal Conjugate Vaccine (PCV) protects against infections caused by Streptococcus pneumoniae, a bacterium responsible for serious diseases such as pneumonia, meningitis, and sepsis. These diseases are especially dangerous in children under five years of age and in the elderly. Hence, PCV plays a vital role in preventing multiple life-threatening infections. Thus, statement 1 is correct. The use of PCV helps reduce dependence on antibiotics by preventing bacterial infections in the first place. This is particularly important because antibiotic resistance is becoming a major global health issue \u0026mdash; and vaccines like PCV help lower the need for antibiotic treatments, especially for drug-resistant strains of pneumococcal bacteria. Thus, statement 2 is correct. Although PCV is generally safe and well-tolerated, it can occasionally cause mild side effects, such as redness or swelling at the injection site, mild fever, or irritability. Therefore, the claim that it has \u0026ldquo;no side effects and causes no allergic reactions\u0026rdquo; is not true. Thus, statement 3 is incorrect. Therefore, the correct answer is B.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47594", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-wi ": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the context of recent advances in human reproductive technology, \u0026ldquo;Pronuclear Transfer\u0026rdquo; is used for...............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;Pronuclear transfer involves the transfer of pronuclei from one zygote to another.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;This technique first requires fertilisation of healthy donated eggs (provided by the mitochondrial donor) with the intended male parent sperm.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Simultaneously, the intending mother\u0026rsquo;s affected oocytes are fertilised with the intending father\u0026rsquo;s sperm.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;By using a technique, called \u0026lsquo;Maternal Spindle transfer\u0026rsquo;, the maternal DNA is put into the egg of a donor woman, which is then fertilized using the father\u0026rsquo;s sperm.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The procedure was developed to help existing In-vitro-Fertilization (IVF) treatments in which mothers have mitochondrial diseases.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Mutations in maternal DNA are a cause of mitochondrial disease, a heterogeneous group of diseases that can lead to premature death, sometimes in infancy or childhood.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Most mitochondrial diseases lack specific treatments, and women who carry the causative mutations are at high risk of transmitting the diseases to their offspring.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47597", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 5 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 4 and 5 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3, 4 and 5\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith the present state of development, Artificial Intelligence an effectively do which of the following? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Bring down electricity consumption in industrial units.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Create meaningful short stories and songs.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Disease diagnosis.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Text-to-Speech Conversion.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Wireless transmission of electrical energy.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;Google is using the Internet of Things (IoT) and Artificial Intelligence (AI) from its DeepMind acquisition to reduce energy consumption in its data centres by as much as 30%. Hence, option 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Using AI as a tool to make music or aid musicians has been in practice for quite some time.In the 1990s, David Bowie helped develop the Verbasizer, which took literary source material and randomly reordered the words to create new combinations that could be used as lyrics.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;In 2016, Sony used software called Flow Machines to create a melody in the style of The Beatles.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Music-making AI software has become advanced in the past few years. It\u0026rsquo;s a viable tool that can and is being used by producers to help in the creative process. Hence, option 2 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;AI combined with robotics and the Internet of Medical Things (IoMT) could potentially be the new nervous system for healthcare, presenting solutions to address healthcare problems.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Integration of AI technology in cancer care could improve the accuracy and speed of diagnosis, aid clinical decision-making, and lead to better health outcomes. Hence, option 3 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Speech synthesis is the artificial production of human speech. It is a way to convert language to human voice (or speech). For example, Google\u0026rsquo;s Assistant, Amazon\u0026rsquo;s Echo, Apple\u0026rsquo;s Siri, etc. Hence, option 4 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Potential cases of Al\u0026rsquo;s use in the energy sector include energy system modelling and forecasting to decrease unpredictability and increase efficiency in power balancing and usage.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Wireless transmission of electrical energy is not a new technology.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;In a wireless power transmission system, a transmitter device, driven by electric power from a power source, generates a time-varying electromagnetic field, which transmits power across space to a receiver device, which extracts power from the field and supplies it to an electrical load. Hence, option 5 is correct.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47598", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "n 003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3 and 4 only\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Visible Light Communication (VLC) technology, which of the following statements are correct? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. VLC uses electromagnetic spectrum wavelengths 375 to 780 nm.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. VLC is known as long-range optical wireless communication.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. VLC can transmit large amounts of data faster than Bluetooth\u003c/p\u003e\r\n\r\n\u003cp\u003e4. VLC has no electromagnetic interference.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;Visible Light Communication (VLC) systems employ visible light for communication that occupy the electromagnetic spectrum from 375 nm to 780 nm. Hence, statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;VLC is known as short-range optical wireless communication. Hence, statement 2 is not correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Li-Fi, a kind of VLC, has a range of approximately 10 meters and it cannot pass through walls or any solid object. \u0026bull; VLC can transmit large amounts of data faster than bluetooth.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The VLC uses visible light for communication to provide high speed internet up to 10 Gb/s while Bluetooth 4.0 promises speeds up to 25 Mb/s. Hence, statement 3 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;VLC has no electromagnetic interference.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The radio frequency (RF) based signals have the problem of interference with other RF signals such as its interference with pilot navigational equipment signals in aircraft.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Therefore, in the areas that are sensitive to electromagnetic radiation (such as aircrafts) VLC can be a better solution. Hence, statement 4 is correct.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47599", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break bsp;A blockchain is a form of public ledger, which is a series (or chain) of blocks on which transaction details are recorded and stored on a public database after suitable authentication and verification by the designated network participants.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;A public ledger can be viewed but cannot be controlled by any single user. \u003cstrong\u003eHence, statement 1 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The blockchain is not only about the cryptocurrency but it turns out that blockchain is actually a pretty reliable way of storing data about other types of transactions, as well.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;In fact, blockchain technology can be used in property exchanges, bank transactions, healthcare, smart contracts, supply chain, and even in voting for a candidate. \u003cstrong\u003eHence, statement 2 is not correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Although cryptocurrency is regulated and needs approval of the central authorities, blockchain technology is not only about cryptocurrency.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;It can have various uses, and applications based on basic features of the technology can be developed without anybody\u0026rsquo; approval. \u003cstrong\u003eHence, statement 3 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47600", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type= ositive displacement (volumetric) mechanisms which seal water in cavities and force it upward.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Lift capacity is maintained even while pumping slowly.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;These mechanisms include diaphragm, vane and piston pumps.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;These differ from a conventional centrifugal pump that needs to spin fast to work efficiently.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Centrifugal pumps are used where higher volumes are required. So statement 2 is not correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;A surface pump is one that is mounted at ground level.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Surface pumps work well when they draw water through suction less than 10 or 20 feet.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;A submersible pump is one that is lowered into the water. Most deep wells use submersible pumps.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;And both are compatible with the photovoltaic array (For Solar power). So statement 1 is not correct.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47601", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to street lighting, how do sodium lamps differ from LED lamps? \u003cstrong\u003e(UPSC Prelims 2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Sodium lamps produce light in 360 degrees but it is not so in the case of LED lamps.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. As street-lights, sodium lamps have longer life span than LED lamps.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The spectrum of visible light from sodium lamps is almost monochromatic while LED lamps offer significant colour advantages in street lighting.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C) \u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eDifference Between Sodium Vapor and LED Lights\u003c/li\u003e\r\n\t\u003cli\u003eSodium lamps are omnidirectional in that they emit light at 360 degrees, while led lamps emit light at 180. Hence, Statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eThe two different technologies are entirely different methods of producing light.\u003c/li\u003e\r\n\t\u003cli\u003eLED lifespan can be greater than 100,000 hours, more than four times that of sodium lamps.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Therefore, the Lifespan of LED is more than Sodium. Hence, Statement 2 is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Sodium vapor bulbs contain metals that are evaporated into inert gas within the glass casing while LEDs are a solid-state technology. Both technologies are very efficient.\u003c/li\u003e\r\n\t\u003cli\u003eThe difference is that sodium vapor lights were the most efficient technology of the 1970s while LEDs are the modern-day equivalent.Sodium lamps are monochromatic, and LEDs can be designed to generate the entire spectrum of visible light colors without having to use the traditional color filters required by traditional lighting. Hence, Statement 3 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eAlthough sodium vapor lighting beats virtually every other technology in terms of energy efficiency (which is why it was chosen to illuminate the streets of so many cities), it loses out to LEDs.\u003c/li\u003e\r\n\t\u003cli\u003eBoth LEDs and sodium vapor lights emit electromagnetic radiation across a small portion of the visible light spectrum, however, LEDs waste much less energy producing waste heat and they also provide an incredibly better variety of high color rendering index options to the user (thus eliminating the monochromatic black appearance of objects illuminated by LPS and HPS bulbs).\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47604", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_ e\r\n\t\u003cli\u003e\u0026nbsp;The astronomical distances are measured in light-years because, the speed of light is constant throughout the universe and is known to high precision.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;In a vacuum, light travels at 670,616,629 mph (1,079,252,849 km/h).\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;To find the distance of a light-year, you multiply this speed by the number of hours in a year (8,766).\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The result: One light-year equals 5,878,625,370,000 miles (9.5 trillion km).\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;At first glance, this may seem like an extreme distance, but the enormous scale of the universe dwarfs this length.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Measuring in light-years also allows astronomers to determine how far back in time they are viewing.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Because light takes time to travel to our eyes, everything we view in the night sky has already happened.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;In other words, when you observe something 1 light-year away, you see it as it appeared exactly one year ago.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47608", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !impor yle\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSubunit, recombinant, polysaccharide, and conjugate vaccines use specific pieces of the germ\u0026mdash;like its protein, sugar, or capsid (a casing around the germ).\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Because these vaccines use only specific pieces of the germ, they give a very strong immune response that\u0026rsquo;s targeted to key parts of the germ.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;They can also be used on almost everyone who needs them, including people with weakened immune systems and long-term health problems.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;One limitation of these vaccines is that you may need booster shots to get ongoing protection against diseases.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Viral vector vaccines use a modified version of a different virus as a vector to deliver protection.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Several different viruses have been used as vectors, including influenza, vesicular stomatitis virus (VSV), measles virus, and adenovirus, which causes the common cold.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Adenovirus is one of the viral vectors used in some COVID-19 vaccines being studied in clinical trials.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47609", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the context of hereditary diseases, consider the following statements:\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Passing on mitochondrial diseases from parent to child can be prevented by mitochondrial replacement therapy either before or after in vitro fertilization of egg.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A child inherits mitochondrial diseases entirely from mother and not from father.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;The technological development allows nearly complete replacement of the cytoplasm of egg/ embryo, eliminatingthe transmission of undesired defective mitochondria for patients with inherited mitochondrial diseases, which is called mitochondrial replacement therapy (MRT).\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Despite the fact that it is called mitochondrial replacement therapy, the treatment functionally works by transferring the mother\u0026rsquo;s nuclear genetic material from an egg (oocyte) with diseased mitochondria into a donor egg that has healthy mitochondria and whose original nuclear genetic material has been removed.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The healthy mitochondria in the donor egg can allow for normal development and stop the transmission of mitochondrial disease.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;These processes use assisted reproductive technology, including in vitro fertilization.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The father\u0026rsquo;s sperm can fertilize the patient egg before the maternal genetic material is removed or after the maternal genetic material has been transferred to the donor egg. Hence, statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The energy-producing organelle mitochondria contains its own compact genome, which is separate from the nuclear genome.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;In nearly all mammals, this mitochondrial genome is inherited exclusively from the mother, and transmission of paternal mitochondria or mitochondrial DNA (mtDNA) has not been convincingly demonstrated in humans.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Mitochondrial diseases are chronic (long term), genetic, often inherited disorders that occur when mitochondria fail to produce enough energy for the body to function properly.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;As the mitochondrial genome is inherited exclusively from the mother, the child inherits mitochondrial diseases entirely from mother and not from father. \u003cstrong\u003eHence, statement 2 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eTherefore, option (c) is the correct answer.\u003c/strong\u003e\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47610", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !importa mg {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to \u0026ldquo;Software as a Service (SaaS)\u0026rdquo;, consider the following statements:\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e(1) SaaS buyers can customize the user interface and can change data fields.\u003c/p\u003e\r\n\r\n\u003cp\u003e(2) SaaS users can access their data through their mobile devices.\u003c/p\u003e\r\n\r\n\u003cp\u003e(3) Outlook, Hotmail and Yahoo! Mail are forms of SaaS.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eSoftware-as-a-Service (SaaS) is a software licensing model. It allows access to software on a subscription basis using external servers, \u003cstrong\u003eStatement 1 is correct.\u003c/strong\u003e\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Today\u0026rsquo;s web-based software is flexible enough to be modified for specific business uses but also individual users.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Buyers can customize the user interface (UI) to change the look and feel of the program, as well as modify specific areas, such as data fields, to alter what data appears. Several business process features can also be turned off and on at will.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eStatement 2 is correct : \u003c/strong\u003eSaaS allows each user to access programs via the Internet. The user need not install the software on his/her computer.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Thus users can access data through their mobile devices. SaaS allows users to access the software through a web browser from multiple locations.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;He or she can have remote desktop software and can work from home\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003e\u0026nbsp;Statement 3 is correct: \u003c/strong\u003eOutlook, Hotmail or Yahoo! Mail are forms of SaaS.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;With these services, a user log into their account over the Internet, often from a web browser.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;The email software is located on the service provider\u0026rsquo;s network and your messages arestored there as well.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;You can access your email and stored messages from a web browser on any computer or Internet-connected device\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47617", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA hypersonic missile is launched into space to counter the asteroid approaching the Earth and explode it in space.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-w 3e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following communication technologies: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e(1) Closed-circuit Television\u003c/p\u003e\r\n\r\n\u003cp\u003e(2) Radio Frequency Identification\u003c/p\u003e\r\n\r\n\u003cp\u003e(3) Wireless Local Area Network\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above are considered Short Range devices/technologies?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eClosed-Circuit Television (CCTV): This can be regarded as a short-range communication technology because CCTV systems typically operate within a limited local area, such as a building, office, or campus. The video signals are transmitted either through cables (wired CCTV) or via short-range wireless connections to a local monitoring system. The coverage is restricted to a confined, short-distance environment, not across wide areas like satellite or cellular communication. Thus, statement 1 is correct. RFID clearly falls under short-range communication. It uses radio waves to transfer data between a reader and a tag, with a range varying from a few centimeters to a few meters, depending on the system design. It is widely used for tracking goods, ID cards, and toll systems \u0026mdash; all involving short-distance signal transmission. Thus, statement 2 is correct. A WLAN, commonly known as Wi-Fi, enables wireless communication between devices such as laptops and routers within a limited local area, generally up to a few tens of meters. This qualifies it as a short-range communication technology, as it does not extend to long distances like mobile networks or satellite links. Thus, statement 3 is correct. Therefore, the correct answer is D.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47620", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max- dth:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3,4, 5, 6 and 7\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIf a major solar storm (solar-flare) reaches the Earth, which of the following are the possible effects on the Earth ? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. GPS and navigation systems could fail.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Tsunamis could occur at equatorial regions.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Power grids could be damaged.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Intense auroras could occur over much of the Earth.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Forest fires could take place over much of the planet.\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Orbits of the satellites could be disturbed.\u003c/p\u003e\r\n\r\n\u003cp\u003e7. Shortwave radio communication of the aircraft flying over polar regions could be interrupted.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eA major solar storm (solar flare) is a large eruption of charged particles and electromagnetic radiation from the Sun. When such a storm reaches the Earth, it can interact strongly with the planet\u0026rsquo;s magnetosphere and ionosphere, causing several significant effects\u0026mdash;particularly on communication, navigation, and power systems. Solar storms can disturb the Earth\u0026rsquo;s magnetic field and ionosphere, disrupting the satellite signals used in GPS and navigation systems, leading to loss of accuracy or complete signal failure. Thus, statement 1 is correct. Solar storms do not cause tsunamis because they originate from solar activity in space, not from underwater seismic events or volcanic eruptions. Thus, statement 2 is incorrect. The geomagnetic disturbances caused by solar storms can induce strong electric currents in power lines, potentially overloading transformers and leading to large-scale power outages, as occurred during the 1989 Quebec blackout. Thus, statement 3 is correct. Solar storms cause charged particles to interact with Earth\u0026rsquo;s magnetic field and atmosphere, creating brilliant auroras (Northern and Southern Lights), which can sometimes be visible at lower latitudes during strong solar events. Thus, statement 4 is correct. Solar storms do not produce enough heat to cause fires on Earth\u0026rsquo;s surface. Their effects are mostly electromagnetic, not thermal. Thus, statement 5 is incorrect. Increased solar activity can heat and expand the upper atmosphere, increasing atmospheric drag on satellites, which can alter their orbits or cause orbital decay. Thus, statement 6 is correct. Solar storms interfere with radio wave propagation in the ionosphere, especially over the poles, where geomagnetic effects are strongest. This can lead to loss of radio communication for aircraft and ships. Thus, statement 7 is correct. Therefore, the correct set of effects caused by a major solar storm are (C) 1, 3, 4, 6, and 7 only.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47624", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/cs ss\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Non-Fungible Tokens (NFTs), consider the following statements. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. They enable the digital representation of physical assets.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. They are unique cryptographic tokens that exist on a blockchain.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. They can be traded or exchanged at equivalency and therefore can be used as a medium of commercial transactions.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003e\u0026nbsp;Non\u0026ndash;fungible tokens (NFTs) are cryptographic assets on a blockchain with unique identification codes and metadata that distinguish them from each other.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eStatement 1 is correct.\u003c/strong\u003e Anything that can be converted into a digital form can be an NFT.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Everything from your drawings, photos, videos, GIF, music, in-game items, selfies, and even a tweet can be turned into an NFT, which can then be traded online using cryptocurrency.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;It is a unique digital asset that represents ownersh``ip of real-world items like art, video clips, music, and more.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eStatement 2 is correct.\u003c/strong\u003e Non-fungible tokens (NFTs) are cryptographic assets on a blockchain with unique identification codes and metadata that distinguish them from each other.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;\u003cstrong\u003eStatement 3 is incorrect.\u003c/strong\u003e Unlike cryptocurrencies, they cannot be traded or exchanged at equivalency.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;This differs from fungible tokens like cryptocurrencies, which are identical to each other and, therefore, can serve as a medium for commercial transactions.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "455", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47625", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThey protect the body from environmental allergens.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css ext/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following statements best describes the role of B cells and T cells in the human body ? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "309", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eLymphocytes are a type of white blood cells. They play a critical role in keeping ushealthy. Without them, we can\u0026rsquo;t survive.\u003c/li\u003e\r\n\t\u003cli\u003eT cells protect us from infection. In our daily lives, we\u0026rsquo;re constantly exposed to pathogens, such as bacteria, viruses andfungi.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;Without T lymphocytes, also called T cells, every exposure could be life-threatening. T cells can wipe out infected or cancerous cells.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;They also direct the immune response by helping B lymphocytes to eliminate invading pathogens.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;B cells create antibodies.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026nbsp;B lymphocytes, also called B cells, create a type of protein called an antibody.\u003c/li\u003e\r\n\t\u003cli\u003eThese antibodies bind to pathogens or to foreign substances, such as toxins, to neutralize them.\u003c/li\u003e\r\n\t\u003cli\u003e\u0026n
