function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

e\r\n\r\n\u003cp\u003e1. Copper slag\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Cold mix asphalt technology\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Geotextiles\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Hot mix asphalt technology\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Portlant cement\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn rural road construction, materials and technologies that promote environmental sustainability and reduce the carbon footprint are increasingly preferred.\u003c/li\u003e\r\n\t\u003cli\u003eCopper slag, an industrial by-product obtained during copper extraction, serves as a useful substitute for natural sand or aggregates.\u003c/li\u003e\r\n\t\u003cli\u003eIts utilization helps minimize industrial waste and reduces the exploitation of natural resources, thus supporting sustainable development. Thus, statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eThe cold mix asphalt technology uses bitumen emulsions that can be mixed and laid at ambient temperatures, unlike traditional hot mix asphalt that requires heating up to 150\u0026ndash;160\u0026deg;C. This reduces energy consumption, fuel use, and greenhouse gas emissions, making it highly suitable for eco-friendly rural road construction, especially under the Pradhan Mantri Gram Sadak Yojana (PMGSY). Thus, statement 2 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eGeotextiles, made from synthetic fibers, are used for soil stabilization, drainage improvement, and road reinforcement. They help extend road life, reduce maintenance costs, and improve resource efficiency, indirectly contributing to lower environmental impact and reduced material use. Thus, statement 3 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eIn contrast, hot mix asphalt technology requires high energy inputs and emits large amounts of CO\u2082 and other pollutants during heating, making it environmentally unsustainable. Thus, statement 4 is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eSimilarly, Portland cement production involves the calcination of limestone at high temperatures, releasing vast quantities of carbon dioxide, and is therefore not sustainable for reducing carbon footprint. Thus, statement 5 is incorrect.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47300", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/cs  break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 5\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Moringa (drumstick tree) is a legu minous evergreen tree.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Tamarind tree is endemic to South Asia.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. In India, most of the tamarind is col lected as minor forest produce.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. India exports tamarind and seeds of moringa.\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Seeds of moringa and tamarind can be used in the production of biofuels.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Moringa (drumstick tree) is a leguminous tree, but it is not an evergreen species; rather, it is a deciduous tree that sheds its leaves during dry seasons. It belongs to the family Moringaceae, not Fabaceae (the true legume family), although it has nitrogen-fixing properties like legumes. Hence, calling it a \u0026ldquo;leguminous evergreen tree\u0026rdquo; is not correct. Thus, statement 1 is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eThe tamarind tree (Tamarindus indica) is native to tropical Africa, though it has long been naturalized and widely cultivated in South Asia, including India. Therefore, it is not endemic to South Asia, as it originated elsewhere. Thus, statement 2 is incorrect.\u003c/li\u003e\r\n\t\u003cli\u003eIn India, tamarind is commonly gathered from forests and village commons, especially by rural communities, and it is classified as a minor forest produce (MFP) under the forest trade category. Thus, statement 3 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eIndia is a major exporter of both tamarind and moringa seeds. Tamarind is exported in processed and raw form to Southeast Asia and the Middle East, while moringa seeds are exported primarily for use in water purification, pharmaceuticals, and cosmetics. Thus, statement 4 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eThe seeds of both moringa and tamarind contain oils that can be used in the production of biofuels. Moringa seed oil, often called \u0026ldquo;ben oil,\u0026rdquo; is rich in oleic acid and suitable for biodiesel production, while tamarind seed oil can also be processed for similar energy purposes. Thus, statement 5 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore the correct answer is B.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47305", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConiferous forest\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDry deciduous forest\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word; s correct.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eCongress Grass: \u003c/strong\u003eCongress grass or parthenium, a native of tropical America, came to India accidentally in 1955.\u003c/li\u003e\r\n\t\u003cli\u003eA rapidly growing invasive species, this grass competes well for nutrients and space and reproduces fast.\u003c/li\u003e\r\n\t\u003cli\u003eOne of the world\u0026rsquo;s seven most notorious weeds, parthenium has already taken over about five million hectares of the country\u0026rsquo;s land.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eElephant grass:\u003c/strong\u003e Pennisetum purpureum, also known as Napier grass or elephant grass is a robust perennial grass widely naturalized in tropical and subtropical regions of the world.\u003c/li\u003e\r\n\t\u003cli\u003eIt is included in the Global Compendium of Weeds where it is listed as an agricultural and environmental weed as well as an invasive species.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eNut grass: \u003c/strong\u003eCyperus rotundus, or Nutgrass, is a perennial, glossy-green, grass-like Eurasian sedge or weed with an erect triangular stem branching into three stems of purple, antenna-like seedpods.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47307", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: br ater.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eOption (b) is correct :\u003c/strong\u003e Cyanobacteria, also called blue-green algae, are microscopic organisms found naturally in all types of water.\u003c/li\u003e\r\n\t\u003cli\u003eThese organisms are primary producers who use sunlight to make their own food.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eOption (c) is correct : \u003c/strong\u003eDiatoms are photosynthesising algae.\u003c/li\u003e\r\n\t\u003cli\u003eThey are found in almost every aquatic environment including fresh and marine waters.\u003c/li\u003e\r\n\t\u003cli\u003eThey are primary producer in oceanic food chain.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eOption (d) is incorrect : \u003c/strong\u003eForaminifera are single-celled organisms that are found in most marine environments.\u003c/li\u003e\r\n\t\u003cli\u003eThey are characterized by streaming granular ectoplasm for catching food.\u003c/li\u003e\r\n\t\u003cli\u003eForaminifera are heterotrophic organisms which consumes smaller organisms and organic matter.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47308", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u0026nbsp;\u003c/p\u003e", "option_10": "", "option {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMagnetite particles, suspected to cause neurodegenerative problems, are generated as environmental pollutants from which of the following? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Brakes of motor vehicles\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Engines of motor vehicles\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Microwave stoves within homes\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Power plants\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Telephone lines\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u0026nbsp;\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eMagnetite particles (Fe\u2083O\u2084) are microscopic iron oxide particles that can enter the human body through inhalation and have been linked to neurodegenerative diseases such as Alzheimer\u0026rsquo;s due to their ability to generate reactive oxygen species (ROS) in brain tissue.\u003c/li\u003e\r\n\t\u003cli\u003eThese particles are mainly released into the environment from sources involving friction, combustion, and industrial emissions. The brakes of motor vehicles are a significant source of magnetite particles, as the friction between brake pads and discs releases fine iron-rich dust into the air. Thus, statement 1 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eThe engines of motor vehicles also emit magnetite particles during fuel combustion, as trace metals in fuels and lubricants are oxidized at high temperatures. Vehicular exhaust is one of the major contributors to urban magnetite pollution. Thus, statement 2 is correct.\u003c/li\u003e\r\n\t\u003cli\u003ePower plants, especially coal-based ones, release magnetite and other metallic oxides through fly ash and particulate emissions during combustion. These emissions contribute to atmospheric particulate pollution containing magnetic iron compounds. Thus, statement 4 is correct.\u003c/li\u003e\r\n\t\u003cli\u003eOn the other hand, microwave stoves within homes and telephone lines do not generate magnetite particles. Microwave ovens emit electromagnetic radiation but do not involve metal combustion or friction that would produce magnetite.\u003c/li\u003e\r\n\t\u003cli\u003eSimilarly, telephone lines transmit signals and have no process capable of releasing metallic oxides. Thus, statements 3 and 5 are incorrect. Therefore, the correct answer B.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47311", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word; us, because phosphorus and phosphorus based compounds are usually solids at the typical ranges of temperature and pressure found on Earth.\u003c/li\u003e\r\n\t\u003cli\u003eThe production of phosphine gas occurs in only specialized, local conditions.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, the phosphorus cycle should be viewed from whole Earth system and then specifically focused on the cycle in terrestrial and aquatic systems.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe global phosphorus cycle includes four major processes :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e(i) tectonic uplift and exposure of phos phorus-bearing rocks such as apa tite to surface weathering;\u003c/p\u003e\r\n\r\n\u003cp\u003e(ii) physical erosion, and chemical and biological weathering of phosphorus bearing rocks to provide dissolved and particulate phosphorus to soils, lakes and rivers;\u003c/p\u003e\r\n\r\n\u003cp\u003e(iii) riverine and subsurface transporta tion of phosphorus to various lakes and run-off to the ocean;\u003c/p\u003e\r\n\r\n\u003cp\u003e(iv) sedimentation of particulate phos phorus\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47313", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\  the code given below\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) \u0026bull; Soil is an important factor for the growth and survival of plants, but some plants can survive on a surface without soil. \u0026bull; Among the given options, fern is not likely to survive on a surface without soil as it requires soil to grow and obtain nutrients. \u0026bull; Lichen is a composite organism consisting of a fungus and an alga or cyanobacterium. \u0026bull; It can survive on a surface without soil as it obtains nutrients from the air and water. \u0026bull; Moss is a small, nonvascular plant that can grow on a variety of surfaces including rocks, trees, and soil. \u0026bull; It can survive on a surface without soil as it can absorb water and nutrients from the air and rainwater. \u0026bull; Mushroom is a type of fungus that can grow on organic matter such as dead plants and animals. It can survive on a surface without soil as it obtains nutrients from the organic matter.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47322", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/ he lungs of the Earth, then surely wetlands function as its kidneys.\u0026rdquo; Which one of the following functions of wetlands best reflects the above statement ? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) \u0026bull; The water cycle in wetlands involves surface runoff, subsoil percolation and evaporation. \u0026bull; Our kidneys remove wastes and extra fluid from your body. Our kidneys also remove acid that is produced by the cells of your body and maintain a healthy balance of water, salts, and minerals. \u0026bull; In the same manner As sediment, excess nutrients and chemicals flow off of the land, wetlands filter the run off before it reaches open water. \u0026bull; Nutrients are stored and absorbed by plants or microorganisms. \u0026bull; Sediment settles at the bottom after reaching an area with slow water flow\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47329", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3 and 4\u0026nbsp;\u003c/p\u003e", "option_1 s\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The 24-hour mean of PM2.5 should not exceed 15 ug/m3 and annual mean of PM2.5 should not exceed 5 ug/m3.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;In a year, the highest levels of ozone pollution occur during the periods of inclement weather.\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;PM10 can penetrate the lung barrier and enter the bloodstream.\u003c/p\u003e\r\n\r\n\u003cp\u003e4.\u0026nbsp;Excessive ozone in the air can trigger asthma.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct ?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) \u0026bull; Statement 1 is correct: According to the guidelines, The annual average for PM2.5should not exceed 5 micrograms per cubic metre of air, while the 24-hour average should not exceed 15 micrograms per cubic metre. \u0026bull; Statement 2 is not correct: Ozone at ground level is one of the major constituents of photochemical smog. \u0026bull; It is formed by the reaction with sunlight (photochemical reaction) of pollutants such as nitrogen oxides (NOx) from vehicle and industry emissions and volatile organic compounds (VOCs) emitted by vehicles, solvents and industry. \u0026bull; As a result, the highest levels of ozone pollution occur during periods of sunny weather. (Inclement weather is unpleasant, especially with cold wind and rain.) \u0026bull; Statement 3 is not correct: While particles with a diameter of 10 microns or less, (\u0026le; PM10) can penetrate and lodge deep inside the lungs, the even more health- damaging particles are those with a diameter of 2.5 microns or less, (\u0026le; PM2.5). \u0026bull; PM2.5 can penetrate the lung barrier and enter the blood system. \u0026bull; Statement 4 is correct: Excessive ozone in the air can have a marked effect on human health. \u0026bull; It can cause breathing problems, trigger asthma, reduce lung function and cause lung diseases.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47330", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to \u0026ldquo;Gucchi\u0026rdquo; sometimes mentioned in the news, consider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It is a fungus.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It grows in some Himalayan forest areas.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. It is commercially cultivated in the Himalayan foothills of north-eastern India.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C)\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026ldquo;Gucchi\u0026rdquo; refers to a rare variety of wild mushroom scientifically known as Morchella esculenta, which belongs to the fungal group Ascomycetes. It is not a plant but a fungus, often called the morel mushroom, and is highly prized for its rich flavor and nutritional value. Thus, statement 1 is correct. Gucchi mushrooms are found naturally in Himalayan forest regions, especially in the states of Himachal Pradesh, Jammu \u0026amp; Kashmir, and Uttarakhand. They grow in the wild during spring, thriving in moist temperate forests, often after forest fires or rain. They are collected by local villagers and sold at very high prices, making them one of the costliest mushrooms in the world. Thus, statement 2 is correct. However, Gucchi is not commercially cultivated anywhere, including in the Himalayan foothills of north-eastern India. It grows only in the wild, and scientists have so far been unable to cultivate it artificially due to its specific and complex ecological requirements. Thus, statement 3 is incorrect. Therefore, the correct answer is C.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "  is hunted in a sanctuary or National Park declared by the Central Government, such animal or any animal article, trophy, uncured trophy or meat [derived from such animal, or any vehicle, vessel, weapon, trap or tool used in such hunting] shall be the property of the Central Government. \u0026bull; Statement 2 is correct: The law governing the subject of wildlife, the Wildlife (Protection) Act, 1972, does not discriminate between animals found in protected areas and outside. \u0026bull; It provides for equal protection for wild animals irrespective of where they are found.Statement 3 is incorrect: According to Wildlife Protection Act, 1972, only if the wild animal becomes a danger to human life or is diseased or disabled beyond recovery can it be allowed to be captured or killed by the competent authority, the Chief Wildlife Warden of the State. \u0026bull; This provision is applicable to wild animals listed in Schedule I of the Wildlife (Protection) Act, 1972, which includes leopards. \u0026bull; Mere apprehension or fear that a wild animal could endanger human life is not a ground for capture or killing.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47341", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAnt\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u ements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) \u0026bull; Statement 1 is incorrect: Naturally occurring nanoparticles can be found in volcanic ash, ocean spray, fine sand and dust, and even biological matter (e.g. viruses). \u0026bull; Synthetic nanoparticles are equally, if not more diverse than their naturally occurring counterparts. \u0026bull; Statement 2 is correct: The field of nanotechnology is being greatly explored by cosmetic industries in order to improve the efficacy of cosmetic products. \u0026bull; The cosmetics are formulated by using different types of metal and metal oxide nanoparticles such as silver nanoparticles (AgNPs), gold nanoparticles (AuNPs) and titanium dioxide nanoparticles (TiO2 NPs), zinc oxide nanoparticles, (ZnO NPs), iron oxide nanoparticles, (Fe2 O3 NPs) and carbon-based NPs. \u0026bull; The applications of different metal oxides as one of the active ingredients in cosmetics and sunscreens have attracted enormous interest from cosmetologists with advanced knowledge of chemistry, toxicology, dermatology, rheology, and even marketing. \u0026bull; Statement 3 is correct: According to the National Nanotechnology Initiative thousands of tons of silica, alumina and ceria, in the form of ultrafine abrasive particle mixtures including nanoparticles, are used each year in slurries for precision polishing of silicon wafers. \u0026bull; The exposed population to nano materials continues to increase as their application expands. \u0026bull; Despite obvious benefits of the power of small materials, there are open questions about how the nanoparticles used for day to-day life may affect the environment.One of the crucial issues that have to be addressed in the near future, before massive fabrication of nano materials, is their toxicity to humans and impact on the environment.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47343", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle t u003e\u003cp\u003eExplanation : (D) \u0026bull; Mushrooms act as antibacterial, immune system enhancer and cholesterol lowering agents; additionally, they are important sources of bioactive compounds. \u0026bull; As a result of these properties, some mushroom extracts are used to promote human health and are found as dietary supplements. So, statement 1 is correct. \u0026bull; Psychedelic mushrooms are wild or cultivated mushrooms that contain psilocybin, a naturally occurring psychoactive and hallucinogenic compound. So, statement 2 is correct. \u0026bull; Recently, an increasing number of mushrooms have been found to contain insecticidal compounds.Among these are species of Lactarius (Rusulaceae), which react to wounding by exuding a milky fluid and/or color change reactions, which could be a warning reaction. So, statement 3 is correct. \u0026bull; A mushroom documentation project in the forests of Northeast India has revealed a bioluminescent \u0026mdash; or light emitting \u0026mdash; variety of mushroom. \u0026bull; The new species \u0026mdash; named Roridomyces phyllostachydis \u0026mdash; was first sighted on a wet August night near a stream in Meghalaya\u0026rsquo;s Mawlynnong in East Khasi Hills district and later at Krang Shuri in West Jaintia Hills district. \u0026bull; It is now one among the 97 known species of bioluminescent fungi in the world. So, statement 4 is correct. Therefore, option (d) is the correct answer.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47349", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width: width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eCertain microorganisms, known as extremophiles, have adapted to survive and thrive under extreme environmental conditions that are normally hostile to life. Some microorganisms called thermophiles and hyperthermophiles can grow at temperatures even above the boiling point of water (100\u0026deg;C), such as those found in deep-sea hydrothermal vents and hot springs, where temperatures may reach 110\u0026deg;C or more. Thus, statement 1 is correct. Other microorganisms known as psychrophiles or cryophiles can survive and multiply in environments below the freezing point of water (0\u0026deg;C), such as in polar ice caps, glaciers, deep oceans, and permafrost soils. They possess special enzymes and antifreeze proteins that allow metabolic activity at extremely low temperatures. Thus, statement 2 is correct. Additionally, some microorganisms called acidophiles can live in highly acidic environments with a pH below 3, such as in acid mine drainage, volcanic soils, and sulfur springs. These organisms have adapted cell membranes and enzyme systems that function in very low pH conditions. Thus, statement 3 is correct. Therefore, the correct answer is All three.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47351", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/c \u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C)\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Biodiversity Management Committees (BMCs) in India are established under the Biological Diversity Act, 2002, which was enacted to implement the objectives of the Convention on Biological Diversity (CBD) and the Nagoya Protocol on Access and Benefit Sharing (ABS). These committees function at the local body level (Panchayats and Municipalities) and play a key role in documenting biodiversity resources and associated traditional knowledge through the preparation of People\u0026rsquo;s Biodiversity Registers (PBRs). Since the Nagoya Protocol aims at ensuring fair and equitable sharing of benefits arising from the use of biological resources, the BMCs serve as a crucial mechanism for its realization at the grassroots level in India. Thus, statement 1 is correct. The BMCs also have important roles in regulating access to biological resources, ensuring benefit-sharing, and can levy collection fees for access to biological resources and associated knowledge within their jurisdiction. They work in coordination with the State Biodiversity Boards (SBBs) and the National Biodiversity Authority (NBA) to facilitate local-level implementation of biodiversity management and equitable sharing of benefits with local communities. Thus, statement 2 is correct. Therefore, the correct answer is C.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47356", "image_check": "0", "image_link_1": "", "image_link_2": "" .00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOne of the following regions has the world\u0026rsquo;s largest tropical peatland, which holds about three years worth of global carbon emissions from fossil fuels; and the possible destruction of which can exert detrimental effect on the global climate. Which one of the following denotes that region ?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2024)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation: (B) \u0026bull; The Congo Basin is home to the world\u0026rsquo;s largest tropical peatlands, along with Brazil and Indonesia. The peat swamp forest of the Congo Basin stores around 29 billion tons of carbon \u0026ndash; approximately equivalent to three years\u0026rsquo; worth of global greenhouse gas emissions \u0026ndash; and the Basin as a whole absorbs nearly 1.5 billion tons of carbon dioxide a year. \u0026bull; The Basin stretches across six countries- Cameroon, Central African Republic, Democratic Republic of the Congo, Congo, Equatorial Guinea and Gabon. Hence option (b) is correct answer.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47357", "image_check": "0", "image_link s": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to perfluoroalkyl and polyfluoroalkyl substances (PFAS) that are used in making many consumer products, consider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2024)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. PFAS are found to be widespread in drinking water, food and food pack aging materials.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. PFAS are not easily degraded in the environment.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Persistent exposure to PFAS can lead to bioaccumulation in animal bodies.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation: (D) \u0026bull; Per- and polyfluoroalkyl substances (PFAS) are chemicals that resist grease, oil, water, and heat which are used in stain- and water-resistant fabrics and carpeting, cleaning products, paints, and fire-fighting foams. Certain PFAS are also authorised by the FDA for limited use in cookware, food packaging, and food processing equipment. \u0026bull; PFAS are found majorly in drinking water, foods, food packaging materials and other consumer products. Hence, statement 1 is correct. \u0026bull; Chemically, PFAS have a carbon-fluorine bond, which is very strong and therefore, they do not degrade easily. Hence, statement 2 is correct. \u0026bull; Accumulation of certain PFAS has also been shown through blood tests to occur in humans and animals. Over time, people may take in more of the chemicals than they excrete, a process that leads to bioaccumulation in bodies. Hence, statement 3 is correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47358", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly two\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly three\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly four\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003 ing them. \u0026bull; Parasitoids include species of wasps, flies (e.g. tachinid flies), beetles (carabid beetles) and worms (e.g. gordian worms). \u0026bull; Centipedes are exclusively predatory. They eat most anything that is small enough and soft bodied, which includes insects and other small animals. Hence, they cannot be considered parasitoids. \u0026bull; The food of termites is mainly cellulose, which is obtained from wood, grass, leaves, humus, manure of herbivorous animals, and materials of vegetative origin (e.g., paper, cardboard, cotton). Hence, termites cannot be categorised as parasitoids. \u0026bull; Only three of the given options are parasitoids. Hence, option (b) is correct\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47359", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth Statement-I and Statement-II are correct and Statement-II ex plains Statement-I\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth Statement-I and Statement-II are correct, but Statement-II does not explain Statement-I rect but only one of them explains Statement I\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe cement industry contributes significantly to global CO2 emissions, accounting for over 5%, largely due to the calcination process during clinker production.\u003c/li\u003e\r\n\t\u003cli\u003eSilica-bearing clay is indeed mixed with limestone to create the raw material for cement.\u003c/li\u003e\r\n\t\u003cli\u003eDuring clinker production, limestone (CaCO3) is heated and decomposes into lime (CaO) and carbon dioxide (CO\u2082). This reaction is a major source of CO2 emissions in cement manufacturing.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "48177", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003e\u0026nbsp;Both Statement II and Statement III are correct and both of them explain Statement I\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eBoth Statement II and Statement III are correct but only one of them explains Statement I\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eOnly one of the Statements II and III is correct and that explains Statement I\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eNeither Statement II nor Statement III is correct\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "opt ntly discussed in global discussions on sustainable development and climate change.\u003c/p\u003e\r\n\r\n\u003cp\u003eStatement II: Article 6 of the Paris Agreement on climate change sets out the principles of carbon markets.\u003c/p\u003e\r\n\r\n\u003cp\u003eStatement III: Article 6 of the Paris Agreement on climate change intends to promote inter-country non-market strategies to reach their climate targets.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich one of the following is correct in respect of the above statements?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003e\u003cstrong\u003eExplanation: (a) Both Statement II and Statement III are correct and both of them explain Statement I\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eArticle 6 of the Paris Agreement is a key focus in global climate negotiations because it enables voluntary international cooperation in achieving climate targets.\u003c/li\u003e\r\n\t\u003cli\u003eStatement II is correct: Article 6 lays the foundation for carbon markets, including international carbon trading mechanisms such as Internationally Transferred Mitigation Outcomes (ITMOs) and a Sustainable Development Mechanism (SDM).\u003c/li\u003e\r\n\t\u003cli\u003eStatement III is also correct: Article 6 includes non-market approaches under Article 6.8, which encourages cooperation through capacity-building, technology transfer, and policy coordination without necessarily trading carbon credits.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "452", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "48179", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003e\u0026nbsp;I and II only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eIII only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eI, II and III\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eNone of the above statements is correct\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eWith reference to \u0026#39;Direct Air Capture\u0026#39;, an emerging technology, which of the following statements is/are correct? \u003cstrong\u003e(UPSC Prelims 2025)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eI. It can be used as a way of carbon sequestration.\u003c/p\u003e\r\n\r\n\u003cp\u003eII. It can be a valuable approach for plastic production and in food processing.\u003c/p\u003e\r\n\r\n\u003cp\u003eIII. In aviation, it can be a source of carbon for combining with hydrogen to create synthetic low-carbon fuel.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "secti ee\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eNone\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eConsider the following types of vehicles: \u003cstrong\u003e(UPSC Prelims 2025)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eI. Full battery electric vehicles\u003c/p\u003e\r\n\r\n\u003cp\u003eII. Hydrogen fuel cell vehicles\u003c/p\u003e\r\n\r\n\u003cp\u003eIII. Fuel cell electric hybrid vehicles\u003c/p\u003e\r\n\r\n\u003cp\u003eHow many of the above are considered as alternative powertrain vehicles?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003e\u003cstrong\u003eExplanation: (c) All the three\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAll three vehicle types listed are considered alternative powertrain vehicles, as they use propulsion systems other than the conventional internal combustion engine (ICE) running on petrol or diesel:\u003c/li\u003e\r\n\t\u003cli\u003eFull Battery Electric Vehicles (BEVs) : Powered entirely by electricity stored in batteries.\u003c/li\u003e\r\n\t\u003cli\u003eHydrogen Fuel Cell Vehicles (FCEVs) : Use hydrogen to generate electricity through a fuel cell to power an electric motor.\u003c/li\ const QUIZ_TITLE = "Environment \u0026 Ecology PYQ Test 3";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
</body>
