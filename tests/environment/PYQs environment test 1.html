function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

al parks\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eProtection/conservation of forests in Terai region\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOf the various wildlife and forest observation schemes undertaken with world aid funds in India, which one has been the most successful project?\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;1991)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) \u0026bull; Project Tiger is a wildlife conservation initiative in India that was launched in 1973 by the Indira Gandhi government from Jim Corbett National Park in Uttarakhand. The project\u0026rsquo;s primary objective is to ensure the survival and maintenance of the tiger population in their natural habitats by creating dedicated Tiger Reserves. \u0026bull; The main aims of Project Tiger are to : 1. Reduce factors that lead to the deple tion of tiger habitats 2. Mitigate factors that lead to the deple tion of tiger habitats by suitable man agement 3. Rectify the damages done to the habitat to facilitate the recovery of the ecosys tem to the maximum possible extent \u0026bull; The monitoring system M-STrIPES was developed to assist patrol and protect tiger habitats. It maps patrol routes and allows forest guards to enter sightings, events and changes when patrolling. It generates protocols based on these data, so that management decisions can be adapted.Project Tiger has been successful in increasing the population of the tigers, from 1200 to around 5000. Mangroves : \u0026bull; These are trees and shrubs that grow in coastal areas with brackish or saline water. They are adapted to survive in conditions that would kill most plants, such as salty water and being submerged by tides. Mangroves have special adaptations that allow them to take in extra oxygen and remove salt. National park : \u0026bull; It is a large area of land that a government protects for its natural beauty, plants, or animals. National parks are created and protected by national governments for conservation purposes. They can be reserves of natural, semi-natural, or developed land. \u0026bull; National parks can be used for public recreation and enjoyment or for their historical or scientific interest. They are home to many endemic species. \u0026bull; In India, there are nearly more than 100 national parks. Some examples include Jim Corbett National Park and Gir Forest National Park.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47105", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKeystone species\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAllopatric species\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSympatric species\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThreatened species\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWithin biological communities, some species are important in determining the ability of a large number of other species to persist in the community. Such species are called............... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1992)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) \u0026bull; A keystone species is a plant or animal that plays a crucial role in an ecosystem\u0026rsquo;s functioning. Their presence or absence can have a significant impact on the entire ecosystem. Here are some examples of keystone species:1. Top predators: Tigers, lions, croco diles, and elephants 2. Beavers: Ecosystem engineers. \u0026bull; The concept of keystone species was introduced in 1969 by zoologist Robert T. Paine. Allopatric speciation : \u0026bull; It can also be referred to as geographic speciation. It occurs when a group from a population of the same species becomes isolated from the parent group. This leads to a lack of mating and gene flow between the group and parent population. Here are some examples of allopatric speciation: 1. Common chimpanzees: The Congo River divides the common chimpanzee (Pan troglodytes). 2. Grand Canyon squirrels: Before the canyon formed, the squirrels were able to travel from side to side. As the can yon widened, the squirrels were no longer able to cross it. Sympatric speciation : \u0026bull; It is a type of speciation that evolves the population of new species when they are divided by geographical barriers. It is seen in different types of organisms like bacteria, fish, and apple maggot fly. Threatened species : \u0026bull; It is a plant, animal, or fungus that is likely to become endangered in the near future. The Endangered Species Act (ESA) defines a threatened species as one that is likely to become endangered within the foreseeable future.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47106", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOne-fifth\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOne fourth\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/cs tyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDestruction of natural habitats and vegetation and shifting cultivation\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCreation of biosphere reserves\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following strongly threatens biodiversity? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1994)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003csection\u003e\r\n\u003cp\u003eThe correct answer is (c) Destruction of natural habitats and vegetation and shifting cultivation. Destruction of natural habitats and vegetation is the most serious threat to biodiversity. When forests, wetlands, and grasslands are cleared for human activities such as agriculture, urbanization, and industrial development, countless species lose their homes, food sources, and breeding grounds. Shifting cultivation, if practiced unsustainably, further accelerates deforestation and soil erosion, reducing the natural capacity of ecosystems to support diverse species. This process leads to habitat fragmentation and, ultimately, extinction of many plant and animal species. Therefore, this factor directly causes a strong decline in biodiversity. Thus, statement (c) is correct. Option (a) refers to fragile ecosystems like mangroves and wetlands, which actually support biodiversity by providing unique habitats and protecting coastlines. They are not a threat but a means of conserving biodiversity. Thus, statement (a) is incorrect. Option (b) mentions inaccessible habitats in the Himalayas, which are largely undisturbed by humans. Their isolation actually helps preserve rare species by minimizing human interference. Hence, these habitats protect biodiversity rather than threaten it. Thus, statement (b) is incorrect. Option (d) talks about the creation of biosphere reserves, which are protected areas designed specifically to conserve biodiversity and promote sustainable development. They play a key role in protecting ecosystems and endangered species. Thus, statement (d) is incorrect.\u003c/p\u003e\r\n\u003c/section\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47111", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOf about ten million species probably alive today, some 20 species are lost everyday, most of them unknown be cause no more than half a million have yet been actually identified by scien tists.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOf about thirty million living species, some 50 are lost everyday, most of them unknown because no more than one million have been actually identi fied.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOf about forty five million living spe cies, some 100 are lost every day, most of them unknown because no more than 1.5 million have been actually identified.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOf about seventy five million living species, some 500 are lost every day, most of them unknown because no more than 3 million have been actually identified.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following does provide the best estimate of world\u0026rsquo;s biological diversity?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;1994)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) \u0026bull; The best estimate of the world\u0026rsquo;s biological diversity is that of about 45 million living species, some 100 are lost every day. Most of these species are unknown because no more than 1.5 million have been identified by scientists. \u0026bull; Biodiversity refers to all living things on the planet, including plants, bacteria, animals, and humans. Scientists estimate that there are around 8.7 million species of plants and animals in existence, but only around 1.2 million species have been identified and described so far. \u0026bull; Scientists agree that today\u0026rsquo;s extinction rate is hundreds, or even thousands, of times higher than the natural baseline rate. The baseline extinction rate is about one species per every one million species per year.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47112", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max- rtant}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDeserts and savannas\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe greatest diversity of animal and plant species occurs in.............\u003cstrong\u003e\u0026nbsp;(UPSC Prelims\u0026nbsp;1995)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (B)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eTropical moist forests : Tropical rainforests combine year-round warm temperatures, abundant sunlight and very high, evenly distributed rainfall. These conditions produce huge net primary productivity and extremely complex, multi-layered vegetation (canopy, understory, shrub layer, forest floor), which creates countless microhabitats and niches. Long climatic stability (millions of years) has allowed extensive speciation and specialization, so species richness of both plants and animals is highest here. For these reasons tropical moist forests host the greatest diversity of life on Earth. Thus option (b) is correct. Temperate deciduous forests : They have four distinct seasons, moderate temperatures and rainfall, and reasonably high productivity compared with arid zones. Because of seasonal cold and a shorter growing season, however, they support fewer plant species and fewer tightly packed ecological niches than tropical forests. Many species are migratory or have seasonal life cycles, so while biodiversity is significant, it is not maximal globally. Thus option (a) is incorrect. Heavily polluted rivers : Pollution (toxic chemicals, organic overload, low dissolved oxygen) drastically reduces aquatic biodiversity by killing sensitive species and favoring a few tolerant organisms (pollution-tolerant worms, certain bacteria, algae). Eutrophication and toxic runoff simplify communities rather than diversify them. Therefore heavily polluted rivers have low species diversity. Thus option (c) is incorrect. Deserts and savannas : They are characterized by water limitation and (in deserts) extreme temperature fluctuations. Many species in these biomes are highly adapted to stress (drought, heat), but overall species richness is lower than in humid tropical forests because primary productivity and the number of available niches are limited. Savannas can support large populations and unique assemblages (herbivores and large predators), but their species diversity still falls short of that in tropical moist forests. Thus option (d) is incorrect.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47113", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eStratospheric ozone and the chloroflu orocarbons which destroy it\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAcid precipitation and tropospheric ozone\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIncreasing levels of atmospheric CO, which produce the greenhouse effect\u003c/p\u003e", "option_4": "\u ;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) \u0026bull; Option (a) suggests that stratospheric ozone and chlorofluorocarbons (CFCs) are the cause of potential damage to the Taj Mahal. However, these elements generally harm the earths ozone layer and do not directly cause damage to monuments. \u0026bull; Option (b) is the correct answer. The emissions from the oil refinery and thermal power plants could result in acid precipitation (also known as acid rain) and increased levels of tropospheric ozone. Both elements can cause corrosion and decay of the monuments white marble. \u0026bull; Option (c) involves the greenhouse effect caused by rising CO2 levels. While this could potentially cause global warming\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47114", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWestern Himalayas\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEastern Himalayas\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWestern ghats\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEastern ghats\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following regions of India is now regarded as an \u0026lsquo;ecological hot spot\u0026rsquo;? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1996)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C)\u003c/p\u003e\r\n\r\n\u003cp\u003eWestern Ghats : The Sahyadri Hills run parallel to India\u0026rsquo;s western coast and are one of the world\u0026rsquo;s eight \u0026ldquo;hottest hotspots\u0026rdquo; of biological diversity, as recognized by Conservation International. They host enormous plant diversity, with nearly 40% of plant species endemic to this region, and are home to numerous endemic amphibians, reptiles, and mammals. Unfortunately, they face significant threats from deforestation, agriculture, and urbanization, which makes their conservation critically important. Hence, the Western Ghats perfectly fit the definition of an ecological hotspot \u0026mdash; areas that are rich in biodiversity but under threat. Thus, statement (c) is correct. Western Himalayas : They include regions of Jammu \u0026amp; Kashmir, Himachal Pradesh, and parts of Uttarakhand. They are rich in forests and contain diverse plant and animal life, but their level of species endemism (species found nowhere else) is relatively low compared to the Eastern Himalayas and the Western Ghats. Therefore, although ecologically important, they are not classified as an ecological hotspot. Thus, statement (a) is incorrect. Eastern Himalayas : The Eastern Himalayas, covering parts of northeast India, Bhutan, and Myanmar, are indeed one of India\u0026rsquo;s biodiversity hotspots. However, the question asks for \u0026ldquo;which one of the following regions of India is now regarded as an ecological hotspot,\u0026rdquo; and among the given options, the Western Ghats have been more prominently recognized and studied as a major hotspot of India due to their unique ecosystem and extremely high levels of endemism. Thus, statement (b) is incorrect. Eastern Ghats : They are older and less continuous mountain ranges with relatively lower biodiversity and endemism compared to the Western Ghats. They are ecologically valuable but do not qualify as a recognized biodiversity hotspot. Thus, statement (d) is incorrect. Therefore, the correct answer is C.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47115", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 4 are correct\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndonesian forest fire in 1997 was caused by............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1998)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) \u0026bull; The 1997 Indonesian forest fires were caused by human activity, not a natural phenomenon. The fires were caused byslash-and-burn farming methods and changing land use. The changing land use made the tropical forest more susceptible to fire during the drought associated with the 1997 El Ni\u0026ntilde;o. \u0026bull; The 1997\u0026ndash;1998 Indonesian forest was unusually dry due to a powerful El Ni\u0026ntilde;o/ Southern Oscillation weather pattern. The forests that are usually green and moist even during the dry season became tinder dry. The greenhouse effect : \u0026bull; It is a natural process that warms the Earth\u0026rsquo;s surface. It occurs when greenhouse gases trap heat near the Earth\u0026rsquo;s surface. Here\u0026rsquo;s how the greenhouse effect works: 1. Some of the Sun\u0026rsquo;s energy reaches the Earth\u0026rsquo;s atmosphere. 2. Some of the energy is reflected back to space. 3. Some of the energy is absorbed and re-radiated by greenhouse gases. 4. The greenhouse gases absorb and re emit infrared radiation from the Sun in all directions. 5. This warms the Earth\u0026rsquo;s surface and the lower atmosphere. \u0026bull; The greenhouse effect is beneficial for life on Earth. It maintains the planet\u0026rsquo;s temperature at a level suitable for life. \u0026bull; Some examples of greenhouse gases include: Methane, Nitrous oxide, Water vapor. Ozone layer depletion : \u0026bull; It is the thinning of the ozone layer present in the upper atmosphere. This happens when the chlorine and bromine atoms in the atmosphere come in contact with ozone and destroy the ozone molecules. One chlorine can destroy 100,000 molecules of ozone. It is destroyed more quickly than it is created. El Nino : \u0026bull; It is a climate interaction between the ocean and atmosphere that causes periodicwarming in sea surface temperatures in the central and east-central Equatorial Pacific. It is associated with high pressure in the western Pacific.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47117", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDove\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{ov ons and tackle global warming. Hence, the World Environment Conference of 1997 refers to this event. Thus, statement (d) is correct. Stockholm : The Stockholm Conference, officially called the United Nations Conference on the Human Environment, was held in 1972 in Stockholm, Sweden. It was the first major international conference to discuss global environmental issues and led to the establishment of the United Nations Environment Programme (UNEP). However, it was not specifically focused on global warming or climate change, which became a key global concern much later. Thus, statement (a) is incorrect. Rio de Janeiro : The Earth Summit or United Nations Conference on Environment and Development (UNCED) was held in Rio de Janeiro, Brazil, in 1992. It was a landmark event for sustainable development and environmental protection, where the Agenda 21 and the Rio Declaration were adopted. Although it discussed climate change broadly, the specific conference held in 1997 to address global warming was not in Rio. Thus, statement (b) is incorrect. Paris : The Paris Conference refers to the Paris Climate Conference (COP21) held in 2015, where the Paris Agreement was adopted. This agreement aimed to limit global temperature rise below 2\u0026deg;C above pre-industrial levels. Since this conference took place in 2015 and not in 1997, it cannot be the correct answer. Thus, statement (c) is incorrect.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47119", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\ and grasslands. Their prime habitats are, however, the moist deciduous forests. The X India where they are found in the forest population in India ranges from North-West divisions of Dehradun, Bijnor and Nainital districts of UP to the Western Ghats in the states of Karnataka and Kerala and in Tamil Nadu.\u003c/p\u003e\r\n\r\n\u003cp\u003eIn Central India, their population is distributed in southern Bihar and Odisha. In the East, they are seen in North Bengal, Assam and a few other states.\u003c/p\u003e\r\n\r\n\u003cp\u003eThe animal X referred to in this quotation is............... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1999)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (B)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eElephant : The Asian elephant matches the description perfectly. India indeed has the largest population of Asian elephants in the world, estimated around 20,000\u0026ndash;25,000, which corresponds exactly with the figure in the question. Elephants inhabit a variety of ecosystems \u0026mdash; evergreen forests, dry thorn forests, grasslands, and swamps, with moist deciduous forests being their preferred habitat. Their distribution across the Northwest (Dehradun, Bijnor), South India (Kerala, Karnataka, Tamil Nadu), Central India (Bihar, Odisha), and Northeast (Assam, North Bengal) also aligns accurately with the passage. Thus, statement (b) is correct. Lion : The Asiatic lion is found only in the Gir Forest of Gujarat, with a population of around 600 individuals. It is not distributed across India as described in the question. Its habitat is primarily dry deciduous forest and scrubland, not moist deciduous or evergreen forests. Hence, the widespread distribution and large population mentioned in the passage do not fit the lion. Thus, statement (a) is incorrect. Tiger : Tigers are also widely distributed across India and inhabit tropical forests and grasslands. However, the tiger population in India is around 3,000\u0026ndash;3,500, not 20,000\u0026ndash;25,000. Moreover, the tiger\u0026rsquo;s prime habitat is dense forests with good prey base, not specifically moist deciduous forests alone. Therefore, the given population and habitat range do not correspond to tigers. Thus, statement (c) is incorrect. One-horned rhinoceros : The Indian rhinoceros or one-horned rhinoceros is confined mainly to the floodplains of the Brahmaputra Valley (Assam) and parts of North Bengal and Nepal\u0026rsquo;s Terai region. Its total population is around 3,000 individuals, far less than the number stated. It is not found across southern or central India, making this option unsuitable. Thus, statement (d) is incorrect.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47121", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e25%\u003c/p\u003e", "opt e type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following legislations does not deal with the protection of environment? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;1999)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) \u0026bull; The Water (Cess) Act, 1977, deals with the levying and collection of cess on water consumed by persons operating and carrying on certain types of industrial activities, and is clearly related to the environment. \u0026bull; The Forest (Conservation) Act, 1980, provides for the conservation of forests and for matters connected therewith or ancillary or incidental thereto. This law is also related to the environment.The Public Liability Insurance Act, 1991, provides for public liability insurance for the purpose of providing immediate relief to persons affected by accidents occurring while handling any hazardous substance. While it may have some minor implications for the environment, its main focus is not on environmental protection, making it the correct answer. \u0026bull; The Port Laws Amendment Act, 1997, amends laws relating to Ports, and while it may have implications for the environment, the legislation`s primary focus is not environmental protection. However, it still has more connection to environmental protection than option (c), thus making option (c) the correct answer.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id" on_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe first marine sanctuary in India, having within its bounds coral reefs, mollusca, dolphins, tortoises and various kinds of sea birds, has been established in...............\u003cstrong\u003e (UPSC Prelims\u0026nbsp;1999)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) \u0026bull; The first marine sanctuary in India, encompassing coral reefs, mollusca, dolphins, tortoises, and various species of sea birds, has been established in the Gulf of Kachch. \u0026bull; The Gulf of Kachch, located in the western part of India in the state of Gujarat, is home to a diverse marine ecosystem. It is known for its rich biodiversity, including coral reefs, mangroves, seagrass beds, and various marine species. \u0026bull; To protect and conserve this unique marine environment, the Indian government established the Marine National Park in the Gulf of Kachch in 1980. It was the first marine sanctuary in India and was later renamed as the \u0026ldquo;Gulf of Kachch Marine National Park and Sanctuary.\u0026rdquo; \u0026bull; The Gulf of Kachch Marine National Park and Sanctuary is spread across an area of approximately 162 square kilometers and comprises coral reefs, mangrove forests,mudflats, and various other habitats. It serves as a vital breeding and feeding ground for marine species, including endangered and rare species such as the dugong (sea cow), green sea turtles, and dolphins. \u0026bull; The establishment of the marine sanctuary aims to protect and preserve the marine biodiversity of the Gulf of Kachch and promote sustainable tourism and research activities in the region. The Sundarbans : \u0026bull; It is a mangrove forest in the Bay of Bengal, formed by the confluence of the Ganges, Brahmaputra, and Meghna rivers. It covers 10,000 square kilometers of land and water, with more than half in India and the rest in Bangladesh. \u0026bull; The name Sundarbans is thought to come from sundri or sundari. The Sundarbans is home to a number of rare or endangered species, including tigers, aquatic mammals, birds, and reptiles.\u0026nbsp;The Sunderban Tigers have no fear of humans, as they were not hunted systematically due to the remoteness and impenetrable habitats of these Mangroves.\u0026nbsp; \u0026bull; Gahirmatha Marine Sanctuary : It is a marine wildlife sanctuary in Odisha, India. The sanctuary was established in 1997 and covers 1,435 square kilometers. It\u0026rsquo;s the largest nesting beach for the endangered olive ridley sea turtle in the world. Lakshadweep : \u0026bull; It is a union territory of India. It is an archipelago of 36 islands divided into three island subgroups: 1. the Laccadive Islands in the middle with 2. the Amindivi Islands in the north sepa rated roughly by the 11th parallel north and 3. the atoll of Minicoy to the south sep arated by the Nine Degree Channel along the 9th parallel north. \u0026bull; The islands are sandwiched between the Arabian Sea to the west and the Laccadive Sea to the east with the islands locatedabout 220\u0026ndash;440 km (140\u0026ndash;270 mi) off the Malabar Coast of mainland India.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47124", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKeystone species\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAllopatric species\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSympatric species\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThreatened species\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWithin biological communities, some species are important in determining the ability of a large number of other species to persist in the community. such species are called............... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2000)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) \u0026bull; A keystone species is a plant or animal that plays a crucial role in an ecosystems functioning. Their presence or absence can have a significant impact on the entire ecosystem. Here are some examples of keystone species: 1. Top predators: Tigers, lions, croco diles, and elephants 2. Beavers: Ecosystem engineers. \u0026bull; The concept of keystone species was introduced in 1969 by zoologist Robert T. Paine. Allopatric speciation : \u0026bull; It can also be referred to as geographic speciation. It occurs when a group from a population of the same species becomes isolated from the parent group. This leads to a lack of mating and gene flow between the group and parent population. Here are some examples of allopatric speciation : 1. Common chimpanzees: The Congo River divides the common chimpan zee (Pan troglodytes). 2. Grand Canyon squirrels: Before the canyon formed, the squirrels were able to travel from side to side. As the canyon widened, the squirrels were no longer able to cross it.Sympatric speciation : \u0026bull; It is a type of speciation that evolves the population of new species when they are divided by geographical barriers. It is seen in different types of organisms like bacteria, fish, and apple maggot fly. Threatened species : \u0026bull; It is a plant, animal, or fungus that is likely to become endangered in the near future. The Endangered Species Act (ESA) defines a threatened species as one that is likely to become endangered within the foreseeable future.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47125", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2\u0026nbsp;and 4\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3\u0026nbsp;and 4\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3\u0026nbsp;and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements regarding environment issues of India : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2000)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Gulf of Mannar is one of the biosphere reserves.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Ganga Action Plan, phase II has been merged with the National River Conservation Plan\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The National Museum of Natural His tory at New Delhi imparts non formal education in environment and conser vation.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Environmental Information System (ENVIS) acts as a decentralised infor mation network for environmental in formation.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of these statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The Gulf of Mannar Biosphere Reserve (GOMBR) : \u0026bull; It is a 10,500 sq. km marine biosphere reserve in Tamil Nadu, India. It\u0026rsquo;s located at the southeast tip of India, where the Bay of Bengal meets the Indian Ocean. GOMBR is the first marine biosphere reserve in South and Southeast Asia.The GOMBR is one of the world\u0026rsquo;s richest regions for marine biodiversity. It\u0026rsquo;s home to 3,600 species of flora and fauna, including 2,200 species of fin fish, and larger whales like sperm whales, minke whales, and sei whales. The Ganga Action Plan (GAP) Phase II : \u0026bull; It was merged with the National River Conservation Plan (NRCP) in December 1996. The NRCP\u0026rsquo;s goal is to reduce pollution in rivers and improve water quality. \u0026bull; The GAP Phase II began in 1993 and covered seven states: Uttarakhand, Uttar Pradesh, Bihar, Jharkhand, West Bengal, Delhi, and Haryana. The plan included work on the major tributaries of the Ganga, including the Yamuna, Gomti, and Damodar. \u0026bull; The NRCP covers 152 towns along 27 interstate rivers in 16 states. The pollution abatement works are implemented on a cost sharing basis between the Centre and State Governments. The National Museum of Natural History (NMNH) in New Delhi : \u0026bull; It was established in 1978. It uses educational programs, exhibitions, and activities to promote non-formal education about the environment. The museum\u0026rsquo;s goal is to raise public awareness about the conservation of natural resources and nature. The Environmental Information System (ENVIS) : \u0026bull; It is a decentralized information network. It\u0026rsquo;s a web-based system that integrates the country\u0026rsquo;s efforts to collect, store, and share environmental information. \u0026bull; ENVIS consists of a network of 24 subject specific hubs, or centers, located in various institutions and organizations across the country. The network also includes a focal point in the Ministry of Environment to coordinate the activities of the centers.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47126", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAfrica\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAustralia\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-w ials live on the Australian continent. \u0026bull; Marsupials are known for carrying their young in a pouch. They give birth to relatively undeveloped young that often reside in a pouch located on their mothers\u0026rsquo; abdomen for a certain amount of time. Some examples of marsupials include: \u0026bull; Kangaroos, Koalas, Opossums, Tasmanian devils, Wombats, Wallabies, Bandicoots. \u0026bull; The oldest known American marsupials are the skulls of Mayulestes, Andinodelphys, and Pucadelphys from the early Palaeocene epoch of Bolivia.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47127", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRussia\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndia\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;  gas 3. Not burning crop waste\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47129", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAgasthyamalai\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNallamala\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNilgiri\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflo s and the lower Western Ghats, and also contains species of animals between the species of western and eastern Indian forests. \u0026bull; The reserve is identified on the World Network of Biosphere Reserves by UNESCO. It\u0026rsquo;s also home to two dominant tribal groups, 1. 2. the Gond andKorku,who have developed stories about the natural resources, ecosystem, environment, and environmental phenomenon.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47130", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 1 5 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 3 2 1\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 3 5 1\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{ov
