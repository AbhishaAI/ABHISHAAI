le\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) The Chandra Prabha Wildlife Sanctuary : \u0026bull; It is also known as Chandraprabha, is situated in Chandauli district of Uttar Pradesh state in central India. It is well endowed with beautiful picnic spots, dense forests, and scenic waterfalls like Rajdari, Devdari \u0026amp; Naugarh waterfall that attract tourists every year to its vicinity. Chandra Prabha Wildlife Sanctuary is situated about 70 kilometres from the historic city of Varanasi. Karera Wildlife Sanctuary : \u0026bull; It is a wildlife Sanctuary in the Shivpuri district of Madhya Pradesh, India. Established in 1981 to protect a population of the Great Indian bustard in the region, it is now in the process of being denotified due to opposition by the local people and the extinction of the bird locally. Jaisamand Wildlife Sanctuary : \u0026bull; It is a 160 square kilometer wildlife sanctuary in Rajasthan. It\u0026rsquo;s located 50 kilometers south of Udaipur, in the Aravallis Range\u0026rsquo;s lush green valleys. The sanctuary was established in 1957 and is home to a variety of animals, including sloth bears, leopards, chitals, chinkaras, wild boars, and a variety of birds. Crocodiles and fish can also be seen here. \u0026bull; The sanctuary is situated on the shores of Dhebar Lake, which is the largest artificial lake in Asia. The lake has three islands that range from 10 to 40 acres each. The lake is often called the \u0026ldquo;Ocean of Victory\u0026rdquo; because \u0026ldquo;samand\u0026rdquo; means \u0026ldquo;ocean\u0026rdquo;. Nahargarh Biological Park : \u0026bull; It is located near the Nahargarh Fort in Jaipur, the capital of Rajasthan. Which is about 19 km from Jaipur main city. It is situated at a distance of NH 8 by road. \u0026bull; In view of the decreasing number of tigers after independence, the government declared this forest as \u0026ldquo;Nahargarh Wildlife Sanctuary\u0026rdquo; in 1980. Nahargarh Biological Park or Nahargarh Zoological Park situated on the edge of the Aravali Hills range is one of the adventure tourist places in Rajasthan. \u0026bull; This Biological Park was created to promote elephant safari and eco-tourism, this park is popular across the country for elephant safaris. Nahargarh Biological Park is far ahead in comparison to other biological parks in India in cleanliness and care.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47135", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither I nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2007)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. In India, Red Panda is naturally found in the Western Himalayas only\u003c/p\u003e\r\n\r\n\u003cp\u003e2. In India, Slow Loris lives in the dense forests of the North East\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) \u0026bull; Red pandas are found in the Himalayas and other high mountains. They live in temperate forests with bamboo understories at high altitudes, ranging from northern Myanmar to China\u0026rsquo;s Sichuan and Yunnan Provinces. They are also found in Nepal, India, and Tibet. \u0026bull; Red pandas are small arboreal mammals that thrive at 2,200\u0026ndash;4,800 meters in mixed deciduous and conifer forests with dense bamboo understories. They are mainly arboreal species, often living close to water sources and in densely bamboo covered areas. Red pandas have two subspecies: 1. Himalayan red panda: (Ailurus fulgens fulgens) lives in the mountains of northern India, Tibet, Bhutan, and Nepal.2. Chinese red panda : (A. fulgens styani) lives in China\u0026rsquo;s Sichuan and Yunnan provinces. \u0026bull; Red pandas have a false thumb, which is an extended wrist bone that has developed over time to help them climb trees and eat bamboo. They also have semi-retractable claws that help them move easily from branch to branch. \u0026bull; The IUCN has listed red pandas as endangered since 2008. The IUCN estimates that the global population of red pandas is around 10,000, with a decreasing population trend. \u0026bull; The red panda has been listed in CITES Appendix I and is protected in all range countries. Hunting red pandas is illegal. The red panda\u0026rsquo;s habitat is threatened by habitat loss, fragmentation, and degradation. T he Bengal slow loris (Nycticebus bengalensis) : \u0026bull; It lives in the dense forests of Northeast India. This species is native to the Indian subcontinent and Indochina. \u0026bull; The Bengal slow loris is the largest of the slow loris species and is the only nocturnal primate in the North Eastern states. They are arboreal and nocturnal, living in tropical and subtropical rainforests.Slow lorises are found in South and Southeast Asia, ranging from Northeast India through Indochina, east to the Sulu Archipelago, and south to the island of Java.Slow lorises are the only venomous primates on Earth, and their bite is fatal. They are omnivores, eating insects, small birds, eggs, reptiles, fruits, gums, and nectars. \u0026bull; The Bengal slow loris is listed as Endangered on the IUCN Red List of threatened species as of July 2020.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47136", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSimlipal National Park\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePeriyar Wildlife Sanctuary\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eManjira Wildlife Sanctuary\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndira Gandhi Wildlife Sanctuary and National Park\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following is also known as Top Slip?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2007)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) \u0026bull; The Indira Gandhi Wildlife Sanctuary and National Park is also known as Top Slip. The area is located in Tamil Nadu and is also known as Parambikulam Tiger Reserve in Kerala. \u0026bull; The name Top Slip comes from the British era, when a lot of timber from the area would slip down to the plains below. The area is known for its scenery and has been used as a location for many movies. T he Indira Gandhi Wildlife Sanctuary and National Park : \u0026bull; It is also known as Anaimalai Tiger Reserve, is a protected area in Tamil Nadu, India. It\u0026rsquo;s located in the Anaimalai Hills of the Coimbatore and Tiruppur districts. \u0026bull; The sanctuary covers 958 square kilometers, with only 387 square kilometers in Tiruppur district. It\u0026rsquo;s in the Western Ghats, south of the Palghat Gap, also known as Anaimalais, or \u0026ldquo;Mountain of Elephants\u0026rdquo;. The sanctuary is rich in flora and fauna, and includes dams and parks. \u0026bull; Some predators in the area include tigers, leopards, and wild dogs. The sanctuary also has a viable population of gaur bos frontalis. Simlipal National Park :It is a tiger reserve and elephant reserve in the Mayurbhanj district of Odisha, India. T he park is 2,750 square kilometers in size and was established in 1980. It\u0026rsquo;s home to nearly 100 royal Bengal tigers and more than 400 wild elephants. \u0026bull; Simlipal is named after the \u0026ldquo;Simul\u0026rdquo; (silk cotton) tree. The park is known for its scenic beauty and waterfalls, including Joranda and Barehipani. Periyar Wildlife Sanctuary : \u0026bull; It is also known as Periyar Tiger Reserve, is a wildlife preserve in south-central Kerala, India. It\u0026rsquo;s located in the Western Ghats, in the districts of Idukki and Pathanamthitta. \u0026bull; The sanctuary is known for its herds of Asian elephants, which can sometimes number 50. It\u0026rsquo;s also home to tigers, leopards,sambar deer, Indian bison, rare lion-tailed macaques, bonnet monkeys, nilgai, langurs, and porcupines. The sanctuary also has thousands of species of flora and fauna, including rare and endangered ones. \u0026bull; Periyar Lake, which is 100 years old, is located in the north of the park and is popular for boat rides. Manjira Wildlife Sanctuary : \u0026bull; It is a 20 square kilometer wildlife sanctuary and reservoir in the Sangareddy district of Telangana, India. It was established in 1978 as a crocodile sanctuary to protect mugger crocodiles. Today, it is home to over 70 species of birds. \u0026bull; The sanctuary is located along the Manjeera River, 5 kilometers from Sangareddy Town. It follows the river for 36 kilometers and provides drinking water for Hyderabad and Secunderabad. The water body is an important wetland for migratory birds and supports a large population of wetland birds.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47137", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBandhavgarh National Park\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDandeli Sanctuary\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRajaji National Park\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{ove ther animals in the park include tigers, leopards, striped hyenas, wolves,common mongooses, sloth bears, foxes, hares, common langurs, flying squirrels, chital, sambar, barking deer, nilgai, wild boars, and gaur. \u0026bull; The park is also home to many birds, including spotted owlets, hill mynas, racket-tailed drongos, red jungle fowls, parrots, peacocks, red spur falls, steppe eagles, and teeters. Bandhavgarh National Park : \u0026bull; It is located in the Umaria district of Madhya Pradesh. It is a popular tiger safari destination in India, and is home to the world\u0026rsquo;s highest density of Bengal tigers. The park is also known for its evergreen sal forest and mixed forest, which contain about 515 plant species. Dandeli Wildlife Sanctuary : \u0026bull; It is located in the Uttara Kannada District. It is a birdwatching paradise, home to nearly 200 bird species, including the great hornbill and the Malabar pied hornbill. The sanctuary is also home to 40 tigers, rare black panthers, elephants, wild pigs, wild dogs, monkeys, deer, and mongoose. Rajaji National Park : \u0026bull; It is a tiger reserve and national park in Uttarakhand, India. It is located in the Shiwalik hills, near the foothills of the Himalayas. The park covers 820.5 square kilometers and includes the districts of Dehradun, Haridwar, and Pauri Garhwal. \u0026bull; Rajaji National Park is famous for its elephant population, as well as its scenic beauty and rich biodiversity. The park is home to elephants, tigers, leopards, spotted deer, and 315 species of birds, including the Great Pied Hornbill and the White-naped Woodpecker. \u0026bull; The park\u0026rsquo;s forests include the Moist Shivalik Sal Forest, Moist Mixed Deciduous Forest, Northern Dry Mixed Deciduous, and Khair-Sissoo forests. The drier southern margis of the park are covered by low Alluviaval Savannah woodlands.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", s.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Shrew and papir are found in the West ern Ghats of the Malabar region.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) The saltwater crocodile (Crocodylus porosus) : \u0026bull; It is found in the Andaman and Nicobar Islands. The islands\u0026rsquo; 1962 km coastline, mangrove forests, and other coastal areas are habitats for the saltwater crocodile. The crocodile can also be found in the open sea, freshwater rivers, mangrove creeks, and swamps. \u0026bull; The saltwater crocodile is the largest living reptile, reaching 7 meters in length. It is known for swimming long distances, which can make it difficult to relocate. \u0026bull; The saltwater crocodile is listed as Least Concern on the IUCN Red List. However, it is threatened by illegal killing and habitat loss. Shrews and tapirs : \u0026bull; They are found in the Western Ghats, including the Malabar region. However, shrews and tapirs are not native to the Western Ghats and Malabar region. \u0026bull; The Western Ghats are a chain of mountains that run parallel to India\u0026rsquo;s western coast. The Ghats stretch across the states of Kerala, Tamil Nadu, Karnataka, Goa, Maharashtra, and Gujarat. The Malabar region is located primarily in the state of Kerala. \u0026bull; Shrews are small, insectivorous mammals that belong to the Soricidae family. They are mole-like mammals with sharp, spike like teeth. Shrews are more closely related to hedgehogs and moles than they are to rodents. \u0026bull; Tapirs are most closely related to horses and rhinoceroses, though they look more like anteaters or pigs. The Malayan tapir is the only tapir species found in Asia, and only 2,500 of them remain.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47143", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGulf of Mannar\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKhangchendzonga\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n \n\u003cp\u003eOut of all the Biosphere Reserves in India. Four have recognized on the World Network by UNESCO. Which one of the following is not one of them? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2008)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (B) \u0026bull; They protect larger areas of natural habitat than a typical national park or animal sanctuary, and often include one or more national parks or reserves, along with buffer zones that are open to some economic uses. Protection is granted not only to the flora and fauna of the protected region, but also to the human communities who inhabit these regions, and their ways of life. There are 18 biosphere reserves in India: 1. Cold Desert, Himachal Pradesh 2. Nanda Devi, Uttrakhand 3. Khangchendzonga, Sikkim 4. Dehang-Debang, Arunachal Pradesh 5. Manas, Assam 6. Dibru-Saikhowa, Assam 7. Nokrek, Meghalaya 8. Panna, Madhya Pradesh9. Pachmarhi, Madhya Pradesh 10. Achanakmar-Amarkantak, Madhya Pradesh-Chhattisgarh 11. Kachchh, Gujarat (Largest Area) 12. Similipal, Odisha 13. Sundarban, West Bengal 14. Seshachalam, Andhra Pradesh 15. Agasthyamala, Karnataka - Tamil Na du-Kerala 16. Nilgiri, Tamil Nadu-Kerala (First to be Included) 17. Gulf of Mannar, Tamil Nadu 18. Great Nicobar, Andaman \u0026amp; Nicobar Island \u0026bull; Khangchendzonga (Added under Man and Biosphere Reserve Program in 2018).\u0026nbsp;\u003c/p\u003e", "solution_video "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2008)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Rice fields\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Coal mining\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Domestic animals\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Wetlands\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above are sources of methane, a major greenhouse gas?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) All of the above are sources of methane, a major greenhouse gas: \u0026bull; Rice fields: Irrigated rice fields are the main source of methane from rice fields. \u0026bull; Coal mining: Coal seam gas (mine gas) contains almost 100% pure methane. \u0026bull; Domestic animals: Domestic animals, such as cows and sheep, produce methane as a byproduct of their digestive processes. \u0026bull; Wetlands : They are a major source of methane emissions, accounting for about 20\u0026ndash;30% of atmospheric methane. Methane is produced in wetland soils when there is a lack of oxygen for microbes that digest carbon.\u0026nbsp;These microbes, called methanogens, produce methane in the anaerobic zones of submerged soils.\u0026nbsp;In the aerobic zones, methanotrophs oxidize the methane to CO2 .\u0026nbsp;When the balance between production and consumption is positive, methane is emitted to the atmosphere.\u0026nbsp; Methane : \u0026bull; It is a colorless, odorless, and highly flammable gas. It\u0026rsquo;s a hydrocarbon and a primary component of natural gas. Methane is also a greenhouse gas (GHG) that affects the earth\u0026rsquo;s temperature and climate system. Here are some pros and cons of methane: Pros : 1. Cleaner alternative: Methane is a cleaner alternative to coal and oil, and is rich in carbon. 2. Abundant: Methane is abundant in na ture and is generated by many sources. 3. Cheaper: Methane is cheaper than other fossil fuels because it\u0026rsquo;s readily available. Cons : 1. Greenhouse gas: Methane is a pow erful greenhouse gas, second only to carbon dioxide. It\u0026rsquo;s also a harmful air pollutant and the second largest con tributor to ground-level ozone. 2. Hazardous: Methane can be hazardous to store and manage. It\u0026rsquo;s easily com busted and can cause huge explosions, even under small amounts. 3. Non-renewable: Methane is a compo nent of natural gas, which is a non-re newable resource.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47145", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width  largest saline lake and inland saline wetland. The lake is elliptical in shape, about 35.5 km long, and 3\u0026ndash;11 km wide. It\u0026rsquo;s surroundedby the Aravalli hills and salt flats. The lake\u0026rsquo;s depth varies from 60 cm in the dry season to 3 meters in the monsoons. \u0026bull; The Sambhar Lake is a Ramsar site, and is mentioned in the Indian epic Mahabharata. \u0026bull; It\u0026rsquo;s located in Sambhar Lake town, near Ajmer, and touches three districts of Rajasthan: 1. Jaipur, 2. Ajmer, and 3. Nagaur. Inland saline wetlands : \u0026bull; These are wetlands with high salt concentrations in the water and soil. They are also known as salt pans. \u0026bull; Inland wetlands are areas of water that can be natural or artificial, permanent or temporary, and with water that is fresh, brackish, or salty. \u0026bull; The main volume of saline water on Earth is concentrated in the oceans (96%), and only 3.5% in inland waters. Of this 3.5%, 51% is in the form of ice and snow. More than 99% of these waters are underground, and 55% of their volume is saline water.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47148", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{o nt panda is a true bear. \u0026bull; Bears are more closely related to the dog and seal families than to the cat families.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47152", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCarbon Footprint\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCarbon Credit Rating\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eClean Development Mechanism\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEmission Reduction Norm\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the context of CO2 emission and Global Warming, what is the name of a market driven device under the UNFCCF that allows developing countries to get funds/ incentives from the developed countries to adopt better technologies that reduce greenhouse gas emissions? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2009)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) \u0026bull; The Clean Development Mechanism (CDM) is a cooperative mechanism that helps developing countries achieve sustainable development by encouraging environmentally friendly investment from industrialized countries. \u0026bull; The CDM was first defined in the Kyoto Protocol in 1997. The CDM\u0026rsquo;s objectives include: 1. Stimulating emission reductions 2. Preventing climate change 3. Directing private sector investment into emissions-reduction projects in developing countries 4. Promoting sustainable development in developing countries 5. Giving industrialized countries some flexibility in how they meet their emis sion reduction limitation \u0026bull; The CDM is one of three \u0026ldquo;flexibility mechanisms\u0026rdquo; identified in the Kyoto Protocol that participating countries can use to meet their GHG reduction targets. The CDM is the only mechanism under the Kyoto Protocol that involves developing countries, or non-Annex I countries. \u0026bull; In the CDM, industrialized countries investing in projects will receive credits against their Kyoto targets. For example, if you are able to reduce 1 metric ton of CO2 , you will receive one carbon credit (CER). CERs are certificates given by CDM executive boards and can be traded with like a stock in the carbon credit market. Carbon footprint : \u0026bull; It is the amount of greenhouse gases, like carbon dioxide and methane, that a person, organization, or product generates. It\u0026rsquo;s calculated by adding up the emissions from every stage of a product or service\u0026rsquo;s life. Carbon credit rating : \u0026bull; It is an evaluation of a claim that a carbon credit has delivered on its greenhouse gas (GHG) mitigation claims. Carbon credit ratings are often given in the form of letter grades. \u0026bull; Carbon credits are units of exchange that individuals and firms use to offset their GHG emissions. One carbon credit is equal to one metric tonne of GHG reduced or avoided from entering the atmosphere.Emission Reduction norm : \u0026bull; They are legal requirements that limit the amount of air pollutants that can be released from specific sources over a specific time period. \u0026bull; Bharat stage emission standards (BSES) are emission standards instituted by the Government of India to regulate the output of air pollutants from compression ignition engines and Spark-ignition engines equipment, including motor vehicles. The standards and the timeline for implementation are set by the Central Pollution Control Board under the Ministry of Environment, Forest and Climate Change.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47153", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEarth Summit, Rio de Janeiro\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKyoto Protocol\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMontreal Protocol\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eG-8 Summit, Heiligendamm\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe concept of carbon credit originated from which one of the following? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2009)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) \u0026bull; The concept of carbon credit originated from the Kyoto Protocol. The Kyoto Protocol introduced the concept of carbon credits, which are certificates that allow the holder to emit greenhouse gases. \u0026bull; The Kyoto Protocol was adopted in 1997 and entered into force in 2005. The protocol provides countries with several means to reach their targets. \u0026bull; Carbon credits are an integral part of environmental economics. They are certificates that give the holder the right to emit one tonne of carbon dioxide or its equivalent. \u0026bull; Carbon offsetting is a trading mechanism that allows entities to compensate for their greenhouse gas emissions. This is done by supporting projects that reduce, avoid, or remove emissions elsewhere. The United Nations Conference on Environment and Development (UNCED), also known as the Earth Summit : \u0026bull; It was held in Rio de Janeiro, Brazil from June 3\u0026ndash;14, 1992. The conference marked the 20th anniversary of the 1972 United Nations Conference on the Human Environment in Stockholm, Sweden. \u0026bull; The Earth Summit was the first international Earth Summit to address environmental protection and socio economic development. More than 100 heads of state attended the conference, along with 130 heads of state and government from 192 countries and more than 45,000 other individuals. The Montreal Protocol on Substances that Deplete the Ozone Layer : \u0026bull; It is an international agreement that aims to protect the ozone layer. The protocol was finalized in 1987 and is a multilateral environmental agreement that regulates the production and consumption of ozone depleting substances (ODS). \u0026bull; The protocol\u0026rsquo;s goal is to stop the production and import of ODS and reduce their concentration in the atmosphere. ODS are man-made chemicals that were commonly used in products such as refrigerators, air conditioners, fire extinguishers, and aerosols. The protocol bans the release of harmful ODS such as chlorofluorocarbons (CFCs). \u0026bull; The protocol has undergone nine revisions since its finalization in 1987. As a result of the protocol, the ozone hole in Antarctica is slowly recovering. The 33rd G8 summit was held June 6\u0026ndash;8, 2007 at the Kempinski Grand Hotel in Heiligendamm, Germany : \u0026bull; The summit\u0026rsquo;s central themes are \u0026ldquo;growth and responsibility\u0026rdquo;. The meeting\u0026rsquo;s focus is on shaping globalization and helping Africa to develop. \u0026bull; The G8 is an organization that aims to promote global economic progress and prosperity. The G8\u0026rsquo;s members hold each other accountable to ensure that good intentions result in tangible measures for global development.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47154", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements :\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2010)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The boundaries of a National Park are defined by legislation.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A Biosphere Reserve is declared to conserve a few specific species of flora and fauna.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. In a Wildlife Sanctuary, limited biotic interference is permitted.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) \u0026bull; The Wildlife Protection Act of 1972 defines the boundaries of a national park. The act also states the area of the national park, which is then notified by the state government. \u0026bull; The state government can declare national parks by issuing a notification. The boundaries of a national park can only be changed by a resolution passed by the state legislature. National parks : \u0026bull; These are areas set aside for the preservation of natural, cultural, and recreational resources. They are usually large and managed by the government for the public\u0026rsquo;s benefit. National parks provide protection for both flora and fauna. They often have facilities like visitor centers, hiking trails, and campgrounds, and are open to the public for recreational activities. \u0026bull; As of November 2023, India has 106 national parks, covering 44,402.95 square kilometers. This is about 1.35% of India\u0026rsquo;s total geographical area. Biosphere Reserves : \u0026bull; India has 18 biosphere reserves. These are ecosystems that contain plants and animals of scientific and natural interest. They are large areas that protect wildlife, plants, and animals, as well as the traditional lives of the local tribes. Biosphere Reserves also help to preserve a region\u0026rsquo;s biodiversity and culture. \u0026bull; Biosphere Reserves are nominated by national governments and remain under the jurisdiction of the states where they are located. The International Co-ordinating Council (ICC) of the MAB programme selects Biosphere Reserves for inclusion in the Network. \u0026bull; Biosphere Reserves include terrestrial, marine, and coastal ecosystems. They promote solutions that reconcile the conservation of biodiversity with its sustainable use. Wildlife Sanctuary : \u0026bull; Limited biotic interference is permitted in a wildlife sanctuary. This includes human activities like agriculture, organic farming, and collecting honey, fruits, and berries. However, authorities impose wide restrictions, so the commercial scope can be limited. \u0026bull; A wildlife sanctuary is an area that protects wild animals and plants. It\u0026rsquo;s also known as a wildlife refuge. Hunting and fishing are either prohibited or strictly controlled in these areas. There are\u0026nbsp;573\u0026nbsp;existing wildlife sanctuaries in India.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47155", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2010)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Biodiversity hotspots are located only in tropical regions.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. India has four biodiversity hotspots i.e., Eastern Himalayas, Western Hi malayas, Western Ghats and Andaman and Nicobar Islands\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D)Biodiversity hotspots are regions with a high abundance of diverse species, including many species that are unique to the area and a large number of species that are at risk of extinction. They are also areas that are threatened by destruction and need immediate and constant attention to survive and thrive. \u0026bull; India is a megadiverse country, with only 2.4% of the world\u0026rsquo;s land area, but accounting for 7-8% of all recorded species. Biodiversity Hotspots in India: 1. Himalaya: \u0026bull; Includes the entire Indian Himalayan region (and that falling in Pakistan, Tibet, Nepal, Bhutan, China, and Myanmar). 2. Indo-Burma: \u0026bull; Includes entire North-eastern India, except Assam and Andaman group of Islands (and Myanmar, Thailand, Vietnam, Laos, Cambodia, and southern China) 3. Sundalands: \u0026bull; Includes Nicobar group of Islands (and Indonesia, Malaysia, Singapore, Brunei, Philippines). 4. The Western Ghats and Sri Lanka: \u0026bull; Includes entire Western Ghats (and Sri Lanka). Hence statement 2 is incorrect. To qualify as a biodiversity hotspot, a region must meet two strict criteria : 1. It must have at least 1,500 vascular plants as endemics \u0026mdash; which is to say, it must have a high percentage of plant life found nowhere else on the planet. A hotspot, in other words, is irreplace able. 2. A biodiversity hotspot is defined as a region that has lost at least 70% of its original habitat. \u0026bull; There are 36 biodiversity hotspots around the world. These hotspots are Earth\u0026rsquo;s most biologically rich and threatened terrestrial regions. \u0026bull; The North American Coastal Plain (NACP) was recently recognized as the 36th biodiversity hotspot.\u0026nbsp;The NACP meets the criteria for a global biodiversity hotspot with more than 1,500 endemic vascular plants and greater than 70 percent habitat loss.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47156", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKeep all the sites completely inaccessi ble to man so that they will not be ex ploited\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConserve all the sites through ecosys tem approach and permit tourism and recreation only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConserve all the sites through ecosys tem approach for a period without any exploitation with specific criteria and specific period for each site, and then allow sustainable use of them by future generations\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConserve all the sites through ecosys tem approach and allow their simulta neous sustainable use\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndia is a party to the Ramsar Convention and has declared many areas as Ramsar Sites. Which of the following statements best describes as to how we should maintain these sites in the context of this Convention? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2010)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) \u0026bull; The Ramsar Convention, also known as the Convention on Wetlands of International Importance, is an international agreement that aims to protect and sustainably use wetlands. \u0026bull; It\u0026rsquo;s the only global treaty that focuses on a single ecosystem. The Ramsar Convention is an intergovernmental environmental treaty established in 1971 by UNESCO. It was signed in 1971 in Ramsar, Iran and came into effect in 1975. \u0026bull; The convention\u0026rsquo;s goals are to stop the global loss of wetlands and to conserve the remaining wetlands through management and wise use. \u0026bull; The convention encourages the designation of wetlands that are rare, unique, or representative, or wetlands that are important for biological diversity. Once designated, these sites are added to the convention\u0026rsquo;s List of Wetlands of International Importance and become known as Ramsar sites.T he convention\u0026rsquo;s three pillars are: 1. 2. 3. Work towards the wise use of all wet lands Designate suitable wetlands for the list of Wetlands of International Impor tance Ensure their effective management \u0026bull; The convention also requires international cooperation, policy making, capacity building, and technology transfer. \u0026bull; As of January 2024, India has 80 Ramsar sites. Ramsar sites are wetlands that are considered to be of \u0026ldquo;international importance\u0026rdquo; under the Ramsar Convention. \u0026bull; The Sundarbans is the largest Ramsar Site in India, covering 4,230 square kilometers in West Bengal. The Sundarbans is also the largest wetland in India and is part of the world\u0026rsquo;s largest mangrove forest. \u0026bull; The Renuka Wetland in Himachal Pradesh is the smallest Ramsar site in India, covering only 0.2 square kilometers. It was declared a Ramsar site on October 15, 2012.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47157", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eUnited Nations Conference on the Hu man Environment, Stockholm, 1972\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eUN Conference on Environment and Development, Rio de Janeiro, 1992\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWorld Summit on Sustainable Devel opment, Johannesburg, 2002\u0026nbsp;\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eUN Climate Change Conference, co penhagen, 2009\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe United Nations Framework Convention on Climate Change (UNFCCC) is an international treaty drawn at............ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2010)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (B) United Nations Framework Convention on Climate Change (UNFCCC): \u0026bull; The treaty was signed at the United Nations Conference on Environment and Development (UNCED), also known as the Earth Summit. \u0026bull; The Summit held in Rio de Janeiro in the year 1992. The Convention came into force on 21st March 1994.The Convention aims at combating climate change by controlling the emission of Greenhouse gases that cause global warming. \u0026bull; The Convention currently has 197 countries as its members and provisions of the treaty are not binding on them, rather only provide directions to achieve the goals. \u0026bull; The progress of the Convention is reviewed at the annual Conference of the Parties (COP). \u0026bull; The latest Conference of the Parties (COP26) was to be held in Glasgow, Scotland in November 2020 but got postponed due to the covid-19 pandemic. United Nations Conference on the Human Environment, Stockholm, 1972: \u0026bull; The conference dealt with the issues concerning the environment and sustainable development and aimed at protecting human health and the environment from persistent organic pollutants. \u0026bull; The conference was successful in bringing out ideas on how governments could work together to preserve the environment. World Summit on Sustainable Development, Johannesburg, 2002:The Summit held 10 years after the Rio de Janeiro Summit held in 1992, hence also denoted as \u0026lsquo;Rio+10\u0026rsquo;.The Summit aimed at strengthening the role of health in sustainable development. UN Climate Change Conference Copenhagen, 2009: \u0026bull; The COP 15 to the United Nations Framework Convention on Climate Change (UNFCCC) and the 5th Meeting of the Parties (MOP 5) to the Kyoto Protocol were included in the UN Climate Change Conference Copenhagen, 2009. \u0026bull; The conference emphasized building infrastructure required for effective global climate change cooperation; and produced the Copenhagen Accord.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47158", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDue to their extensive rice cultivation, some regions may be contributing to global warming. To what possible reason/ reasons is this attributable? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2010)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The anaerobic conditions associated with rice cultivation cause the emission of methane.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. When nitrogen based fertilizers are used nitrous oxide is emitted from the cultivated soil.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C) \u0026bull; Rice production contributes to climate change by releasing greenhouse gases like carbon dioxide, methane, and nitrogen oxides. Rice cultivation is responsible for 10% of global methane emissions, and in Southeast Asia, it accounts for 25\u0026ndash;33% of the region\u0026rsquo;s methane emissions. Rice production also contributes to climate change in other ways: 1. Water use : Rice uses large amounts of wa ter, which can degrade soil and water qual ity. 2. Deforestation : Agricultural expansion and monocultures can lead to deforestation and land degradation, which can harm wildlife habitats and biodiversity. 3. Climate change impacts : Drought, flood, saltwater, and extreme temperatures can devastate rice crops and threaten the liveli hoods of rice farmers. Climate change can also affect rice production: 1. Food availability: Climate change can reduce access to food and affect food quality. 2. Agricultural productivity: Climate change can reduce agricultural pro ductivity through projected increases in temperatures, changes in precipita tion patterns, and reductions in water availability. \u0026bull; Why some regions may be contributing to global warming due to their extensive rice cultivation: 1. Anaerobic conditions : \u0026bull; Flooded rice fields create anaerobic conditions, which lead to the emission of methane. Microorganisms in these conditions undergo a redox reaction that produces methane. 2. Nitrogen-based fertilizers : \u0026bull; They are used to increase crop yield. Microbes in the soil convert nitrogen from these fertilizers into nitrous oxide, a greenhouse gas. \u0026bull; Methane and nitrous oxide are the two greenhouse gases emitted from rice fields.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47159", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e* ow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOther than Jatropha curcas, why is Pongamia pinnata also considered a good option for the production of bio-diesel in India? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2010)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Pongamia pinnata grows naturally in most of the arid regions of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The seeds of Pongamia pinnata are rich in lipid content of which nearly half is oleic acid\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;Which of the statements given above is / are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "314", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C) \u0026bull; Pongamia pinnata is a non-edible oil plant species that can grow in waterlogged, saline, and alkaline soil waste land. It grows well in both full sun and partial shade and can grow in most soil types. \u0026bull; The oil extracted from Pongamia pinnata is commonly known as \u0026ldquo;Karanja oil\u0026rdquo;. It is used as a raw material for biodiesel production in India.Pongamia pinnata is also used in medicine. The dried flower powder is taken orally to reduce blood sugar. The juice extracted from green fruits is mixed with mustard oil and applied in case of rheumatic pain. Fresh bark extract is administered orally to cure bleeding piles. \u0026bull; Pongamia pinnata is a hardy plant that can grow naturally in most of India\u0026rsquo;s arid regions. It can thrive in areas with annual rainfall ranging from 500 to 2500 mm and temperatures ranging from 27 to 38 \u0026deg;C. It can also survive in temperatures from 5 to 50 \u0026deg;C and altitudes from 0 to 1200 m. \u0026bull; Pongamia pinnata seeds are rich in lipid content, with nearly half of it being oleic acid. \u0026bull; Pongamia pinnata seeds contain 30\u0026ndash;40% oil, with oleic acid being the major fatty acid. The seed oil also contains linoleic acid, palmitic acid, stearic acid, and linolenic acid. \u0026bull; Pongamia pinnata is also used in cosmetics and has medicinal value. The oil is styptic and anthelmintic, and is good for leprosy, piles, ulcers, and chronic fever.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47160", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{over rnate technology as compared to developed countries. Now let us take a look at the statements given in the questions: \u0026bull; Statements 1 and 2 are correct as evident from the points mentioned above. \u0026bull; Statement 3 is incorrect because developed countries can not set up their polluting industries in India. \u0026bull; This is so because the setting up of industries is regulated in India hence, it is not possible to set up polluting industries.In the past few decades, we have observed an increase in the overall temperature prevailing on the Earth. This phenomenon of gradual increase in the temperature near the surface of Earth is referred to as Global Warming. \u0026bull; It has become a hot topic for scientists around the globe as it has many negative effects on the environment. some of them are listed below: 1. 2. 3. T he melting of glaciers, which can re sult in the submergence of cities near oceans. Irregularity in the weather patterns, eg: rise in droughts, etc. It has an effect on agriculture as well, as the weather patterns influence the crop yield.It affects the global food chain, also leading to the extinction of various an imal species.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47163", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\ s and is the strongest greenhouse gas. \u0026bull; It is 23500 times more powerful than carbon dioxide and causes a greater threat towards global warming. 3. Water vapor - It is also one of the most important greenhouse gases which are available in the atmosphere.The atmosphere is having about 37.5 million billion gallons of water vapour. \u0026bull; The higher concentration of water vapor leads to more absorption of the thermal infrared rays radiated from the Earth thus warming the atmosphere. \u0026bull; It is also known that a warmer atmosphere can hold more water vapor and this process goes on.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "450", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47165", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2
