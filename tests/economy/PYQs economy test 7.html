function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

isibles (also called non-merchandise). Invisibles include services, transfers, and income. 2. Capital Account: It shows a capital expen diture and income for a country. It gives a summary of the net flow of both private and public investment into an economy. External Commercial Borrowing (ECB), Foreign Direct Investment, Foreign Portfolio Investment, etc form a part of the capital account. 3. Errors and Omissions: Sometimes the bal ance of payment does not balance. This im balance is shown in the BoP as errors and omissions. \u2219 It reflects the country\u0026rsquo;s inability to record all international transactions accurately.4. Changes in Foreign Exchange Reserves: Movements in the reserves comprise changes in the foreign currency assets held by the Reserve Bank of India (RBI) and also in Special Drawing Rights (SDR) balances. \u2219 Overall the BoP account can be a surplus or a deficit. If there is a deficit then it can be bridged by taking money from the Foreign Exchange (Forex) Account.If the reserves in the forex account are falling short then this scenario is referred to as BoP crisis.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45691", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 4 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003 e\r\n\r\n\u003cp\u003e2. Branch expansion\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Merger of banks\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Winding-up of banks\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (D) Regulation of Commercial Banks by Reserve Bank of India : The Reserve Bank of India (RBI) is the central bank of India and the main regulator of commercial banks. The RBI regulates commercial banks in various matters, including: 1. Liquidity of assets : The RBI regulates the liquidity of assets held by commercial banks to ensure that they maintain adequate reserves to meet their financial obligations. 2. Branch expansion : The RBI regulates the expansion of bank branches to ensure that banks do not expand too quickly or in an uncontrolled manner, which could lead to financial instability. 3. Merger of banks : The RBI regulates the merger of banks to ensure that it is done in a manner that is beneficial to the banking system as a whole and does not lead to any negative consequences. 4. Winding-up of banks : The RBI regulates the winding-up of banks to ensure that it is done in a manner that minimizes the negative impact on depositors and other stakeholders.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45692", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word; come for a country. It gives a summary of the net flow of both private and public investment into an economy. \u2219 External Commercial Borrowing (ECB), Foreign Direct Investment, Foreign Portfolio Investment, etc form a part of the capital account. 3. Errors and Omissions: Sometimes the balance of payment does not balance. This imbalance is shown in the BoP as errors and omissions.It reflects the country\u0026rsquo;s inability to record all international transactions accurately. 4. Changes in Foreign Exchange Reserves: Movements in the reserves comprise changes in the foreign currency assets held by the Reserve Bank of India (RBI) and also in Special Drawing Rights (SDR) balances. \u2219 Overall the BoP account can be a surplus or a deficit. If there is a deficit then it can be bridged by taking money from the Foreign Exchange (Forex) Account. \u2219 If the reserves in the forex account are falling short then this scenario is referred to as BoP crisis.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45693", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBorrowing by scheduled banks from the RBI\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLending by commercial banks to industry and trade\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePurchase and sale of government securities by the RBI\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone of the above\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the context of Indian economy, \u0026lsquo;Open Market Operations\u0026rsquo; refers to............. \u003cstrong\u003e(UPSC Prelims 2013)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C) Open Market Operations (OMOs) : These are market operations conducted by RBI by way of sale/purchase of government securities to/from the market with an objective to adjust the rupee liquidity conditions in the market on a durable basis. If there is excess liquidity, RBI resorts to the sale of securities and sucks out the rupee liquidity. It is one of the quantitative (to regulate or control the total volume of money) monetary policy tools that are employed by the central bank of a country to control themoney supply in the economy, Hence the correct option is 3. Additional Information 1. Long-term Repo Operations (LTRO) : \u2219 Under LTRO, RBI will conduct a term repo of one-year and three-year tenors of appropriate sizes for up to a total amount of Rs 1 lakh crore at the prevailing repo rate. \u2219 As banks get long-term funds at lower rates, their cost of funds falls. In turn, they reduce interest rates for borrowers. \u2219 LTRO helps RBI to ensure that banks reduce thei tion_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the context of food and nutritional security of India, enhancing the \u0026lsquo;Seed Replacement Rates\u0026rsquo; of various crops helps in achieving the food production targets of the future. But what is/are the constraint/ constraints in its wider/ greater implementation? \u003cstrong\u003e(UPSC Prelims 2014)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. There is no National Seeds Policy in place.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. There is no participation of private sector seed companies in the supply of quality seeds of vegetables and planting materials of horticultural crops.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. There is a demand-supply gap regarding quality seeds in case of low value and high volume crops.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) The correct answer is 3 only. There is a National Seed Policy 2002. Hence one is incorrect. The private sector seed companies supply quality seeds of vegetables but in a small volume. The private sector is the majority supplier of hybrid vegetable seeds. Hence statement 2 is also incorrect. There is a demand-supply gap recording quality of seeds in case of low value and high volume crops such as wheat and rice. Farmers prefer to use their own preserve seeds due to the high demand and supply gap. Hence statement 3 is correct. Important Points The seed replacement rate is a measure of how much of the total cropped area was sown with certified seeds in comparison to farm-saved seeds.Seed replacement rate denotes better utilization of certified quality seeds which results in better productivity. The National Seed Policy : It is a national sectoral policy that aims to provide farmers with high-quality seeds of improved crop varieties. The policy also aims to increase crop production, farmer productivity, per capita farm income, and export earnings. The National Seed Policy of 2002 in India has the following objectives: 1. Provide a suitable climate for the seed industry to use available and potential opportunities 2. Safeguard the interests of Indian farmers 3. Conserve agro-biodiversity 4. Double food production and make India hunger free 5. Provide the impetus for a new revolution in Indian agriculture The National Seed Policy provides policy directives to increase the production of improved seeds in both the public and private sectors. It also aims to make the best quality seeds available to farmers on a timely basis and at a competitive price. The National Seed Policy of 2002 established the National Seeds Board (NSB) in place of the existing Central Seed Committee and Central Seed Certification Board.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45698", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66" ion is an example of capital-augmenting technological progress because it involves the replacement of a less efficient capital good (wooden plough) with a more efficient one (steel plough). The steel plough requires less energy to operate, lasts longer, and can cover a larger area in less time than the wooden plough. This results in increased productivity and efficiency in agricultural production. The benefits of capital-augmenting technological progress include: 1. Increased productivity: The use of more advanced and efficient capital goods results in increased productivity and efficiency. 2. Cost savings: Capital-augmenting technological progress can lead to cost savings by reducing the amount of labor required to produce goods and services. 3. Higher quality products: The use of more advanced and efficient capital goods can result in higher quality products.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45710", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEncouraging the farmers to use their own farm seeds and discouraging them to buy the seeds from others\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/c w series. Headquarters : Chandigarh and Shimla. It is responsible for the collection, compilation and publication of labour statistics and other information relating to labour such as employment and unemployment, wages, earnings, industrial relations, working conditions etc. Conducting research studies and surveys on labour-related matters in organized/unorganized sectors covering SC/ ST Workers, Women Labour, Contract Workers and occupational wage surveys in manufacturing industries, mines, plantations and service sectors.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45714", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Asian Development Bank\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe European Bank for Reconstruction and Development\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003csty rdize banking practices worldwide. Basel I defines the capital and structure of risk weights for banks. It classifies assets into categories based on their associated risk level. Risk-free assets include cash, government debt, and central bank debt. 100% risk assessed assets include private sector debt and non-OECD bank debt. Basel I sets the minimum capital requirement at 8% of risk-weighted assets. Basel II : It is a set of international business standards that require financial institutions to maintain enough cash reserves to cover operational risks. The Basel Committee on Banking Supervision issues the Basel accords, which are a series of recommendations on banking regulations and laws.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eBasel III : It is\u0026nbsp;a set of international banking regulations that aims to strengthen the regulation, supervision, and risk management of banks.\u0026nbsp;The Basel Committee on Banking Supervision developed the measures in response to the financial crisis of 2007-09.\u003c/p\u003e\r\n\r\n\u003cp\u003eBasel III is an extension of the existing Basel II Framework, and introduces new capital and liquidity standards.\u0026nbsp; T he reforms are designed to mitigate risk within the international banking sector by requiring banks to maintain certain leverage ratios and keep certain levels of reserve capital on hand.\u0026nbsp;\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45717", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\  one of the most direct and effective ways to lower the deficit. This includes cutting down on non-productive spending such as administrative costs, interest payments, and certain subsidies. Hence, statement 1 is correct. Rationalizing subsidies is another important measure. It involves making subsidies more targeted and efficient to ensure that only the genuinely needy benefit, thereby reducing the financial burden on the government. Rationalization helps prevent wastage and misuse of public funds, thus lowering expenditure. Hence, statement 3 is correct. However, introducing new welfare schemes would increase government spending, thereby worsening the deficit rather than reducing it. Thus, statement 2 is incorrect. Similarly, expanding industries is a long-term measure that may promote growth and revenue in the future but does not directly reduce the fiscal deficit in the short term. Thus, statement 4 is incorrect. Hence, the correct measures that can help reduce the deficit are reducing revenue expenditure and rationalizing subsidies, making the correct answer (a) 1 and 3 only.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45719", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eControlling the inflation in India is the responsibility of the Government of India only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: rd;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (B)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe rate of growth of Real Gross Domestic Product (GDP) in India has not increased steadily over the last decade. Instead, it has shown considerable fluctuations due to various domestic and global factors. For instance, India\u0026rsquo;s real GDP growth rate was around 8% in 2016\u0026ndash;17, but it gradually declined in the subsequent years due to factors like the slowdown in investment, demonetization effects, the implementation phase of GST, and later, the economic disruptions caused by the COVID-19 pandemic. Although there has been recovery in recent years, the overall trend has not been steady or consistently rising, making statement 1 incorrect. On the other hand, the Gross Domestic Product at market prices (in rupees) \u0026mdash; which measures the nominal value of all goods and services produced \u0026mdash; has steadily increased over the last decade. This is because nominal GDP reflects both real growth and inflation, and even when real growth slows, the effect of rising prices generally causes the nominal GDP to increase continuously. India\u0026rsquo;s nominal GDP has grown from around \u20b9105 lakh crore in 2012\u0026ndash;13 to over \u20b9295 lakh crore in 2023\u0026ndash;24, showing a clear upward trend. Hence, statement 2 is correct. Therefore, the correct answer is (b) 2 only.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45723", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-wid style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Pradhan Mantri Jan-Dhan Yojana (PMJDY) was launched on 28th August 2014 by the Government of India with the primary objective of achieving comprehensive financial inclusion. Financial inclusion means ensuring that every household, especially in rural and economically weaker sections, has access to basic banking and financial services. These services include opening bank accounts, access to savings and deposit facilities, credit, insurance, remittance, and pension in an affordable and transparent manner. Under this scheme, every eligible citizen was encouraged to open a basic savings bank deposit account with zero balance. Account holders are provided with benefits such as a RuPay debit card, accidental insurance cover, life insurance cover, and later, access to overdraft facilities. The scheme also focuses on linking these accounts to Direct Benefit Transfer (DBT) to ensure subsidies and welfare benefits reach beneficiaries directly, eliminating middlemen. Hence, the purpose of Pradhan Mantri Jan-Dhan Yojana is not limited to providing housing loans, supporting women\u0026rsquo;s self-help groups, or giving direct financial help; rather, it is aimed at bringing every individual into the formal banking system and promoting financial inclusion across the country.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45726", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: brea "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn India, markets in agricultural products are regulated under the............. \u003cstrong\u003e(UPSC Prelims 2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B)The regulation of agricultural markets in India is done through various acts and committees. The correct option among the given options is B, which refers to the Agricultural Produce Market Committee Act enacted by States. Agricultural Produce Market Committee (APMC) Act : A number of State governments passed the APMC Act to control the marketing of agricultural products and give farmers a place to sell their goods for a reasonable price. Key Features of APMC Act: Establishment of Market Committees: The act provides for the establishment of APMC to regulate the marketing of agricultural produce in a particular area. Licensing of Market Functionaries: The act provides for the licensing of market functionaries like commission agents, traders, and processors who are involved in the buying and selling of agricultural produce. Regulation of Trade Practices: The act regulates the trade practices in the market and prohibits malpractices like hoarding, black marketing, and artificial price manipulation. Pricing of Commodities: The act provides for the fixing of minimum support price (MSP) for certain agri rategic inputs to the federal and state governments in order to promote economic growth and sustainable development. 2. Replacing the Planning Commission: The Planning Commission was an institution that was set up in 1950 to formulate and oversee India\u0026rsquo;s Five-Year Plans. However, over time, it was felt that the Planning Commission\u0026rsquo;s functioning and structure needed to be reformed. The following reasons led to the decision to replace the Planning Commission with NITI Aayog: a) Decentralization of Planning: The Planning Commission was criticized for its centralized approach to planning, which often led to a one-size-fits-all approach. NITI Aayog aims to promote cooperative federalism by involving the states in the planning process and ensuring their active participation. b) Flexibility and Innovation: The Planning Commission was criticized for its rigid planning process, which did not allow for flexibility and innovation. NITI Aayog, on the other hand, focuses on evidence-based policy-making, encourages innovative ideas, and provides a platform for experimentation and learning. c) Focus on Sustainable Development: The Planning Commission primarily focused on economic growth and development. NITI Aayog, in addition to economic growth, also emphasizes social inclusion, environmental sustainability, and regional balance in its policy recommendations. d) Collaborative Approach: The Planning Commission operated as a top-down institution, with limited collaboration and participation from stakeholders. NITI Aayog adopts a collaborative approach by involving experts, academia, industry, and civil society organizations in the policy formulation process.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45729", "image_check": "0", "image_link_1": "", "image_link_2": "" ific percentage of their deposits specific in gold or approved securities. When SLR is reduced, banks have more money to lend which may lead to a decrease in lending rates. By changing the level of SLR, the Reserve Bank of India can increase or decrease bank credit expansion. Ensuring the solvency of commercial banks. By reducing the level of SLR, the RBI can increase liquidity with the commercial banks, resulting in increased investment which is done to fuel growth and demand.\u003c/p\u003e\r\n\u003c/section\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45730", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3 and 4\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Indian economy, consider the following: \u003cstrong\u003e(UPSC Prelims 2015)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Bank rate\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Open market operations\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Public debt\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Public Revenue\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above is/are component/ components of Monetary Policy?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) In order to achieve certain objectives like price stability, economic growth, and employment, the central bank oversees the money supply and interest rates in the economy through a process known as monetary policy. In India, the Reserve Bank of India (RBI) is responsible for formulating and implementing monetary policy. The components of monetary policy in India are: 1. Bank Rate: The bank rate is the rate at which the RBI lends money to commercial banks. It influences the interest rates in the economy, which, in turn, affects the borrowing and spending behavior of individuals and businesses. A higher bank rate means higher borrowing costs for banks, which can lead to higher lending rates and lower borrowing and spending in the economy.2. Open Market Operations: Open market operations refer to the buying and selling of government securities by the RBI in the open market. When the RBI buys government securities, it injects money into the economy, which can stimulate borrowing and spending. When it sells government securities, it withdraws money from the economy, which can reduce borrowing and spending. 3. Public Debt: Public debt refers to the total amount of money owed by the government to individuals, businesses, and other countries. The RBI manages public debt by buying and selling government securities, which can affect the money supply in the economy. 4. Public Revenue: Public revenue refers to the income received by the government from taxes, fees, and other sources. By changing interest rates, the RBI can have an impact on government revenue by changing how people and corporations borrow money and spend it.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45731", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: brea  {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIncreased money circulation helps in controlling the inflation\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to inflation in India, which of the following statements is correct? \u003cstrong\u003e(UPSC Prelims 2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe government (through fiscal policy \u0026mdash; taxes, subsidies, public spending) certainly influences aggregate demand and prices, but it is not the only actor. Monetary policy \u0026mdash; which is mainly the domain of the Reserve Bank of India \u0026mdash; also plays a crucial role in managing inflation by controlling money supply and interest rates. Thus statement (a) is incorrect. The RBI is the central bank and one of its primary mandates is price stability. It uses tools such as the repo rate, reverse repo, cash reserve ratio (CRR), statutory liquidity ratio (SLR), and open market operations to manage liquidity and influence borrowing, spending and inflation. Thus statement (b) is incorrect. When the amount of money circulating in the economy (liquidity) is reduced, aggregate demand falls or grows more slowly, which eases upward pressure on prices. Central banks reduce money supply or raise interest rates to cool demand and control inflation. Therefore, reducing money circulation is an accepted tool for fighting inflation. Thus statement (c) is correct. Increasing money circulation (expansionary monetary policy) typically raises aggregate demand and, if supply does not keep up, pushes prices higher \u0026mdash; i.e., it tends to increase inflation, not control it. That makes statement (d) incorrect.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45732", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the Indian Renewable Energy Development Agency Limited (IREDA), which of the following statements is/are correct? \u003cstrong\u003e(UPSC Prelims 2015)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It is a Public Limited Government Company.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It is a Non-Banking Financial Company.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) Both statements 1 and 2 are correct. The Indian Renewable Energy Development Agency Limited (IREDA) is a public limited government company and a non-banking financial institution. It was established in 1987 under the Ministry of New and Renewable Energy (MNRE). IREDA\u0026rsquo;s main objectives are to: 1. Provide financial support to projects and schemes for generating electricity and/or energy through new and renewable sources 2. Conserve energy through energy efficiency IREDA also provides funds to approved scientific projects in India and supports researchers to attend conferences abroad and conduct experimental work.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45733", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 ews, which of the statements given below is/are correct? \u003cstrong\u003e(UPSC Prelims 2016)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The International Finance Corporation, which offers these bonds, is an arm of the World Bank.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. They are the rupee-denominated bonds and are a source of debt financing for the public and private sector.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) The correct answer is Both 1 and 2. The World Bank Group (WBG) consists of five organizations : 1. International Bank for Reconstruction and Development (IBRD) 2. International Development Association (IDA) 3. International Finance Corporation (IFC) (Hence statement 1 is correct) 4. Multilateral Investment Guarantee Agency (MIGA) 5. International Centre for Settlement of Investment Disputes (ICSID) IFC Masala Bonds: The first Masala bond was issued by IFC in 2014 for the infrastructure projects in India. They are the rupee-denominated bonds issued to offshore investors and are a source of debt financing for the public and private sectors. Hence statement 2 is correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45734", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u erflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the context of which of the following do you sometimes find the terms \u0026lsquo;amber box, blue box and green box\u0026rsquo; in the news? \u003cstrong\u003e(UPSC Prelims 2016)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) The correct answer is WTO affairs. In WTO terminology, domestic subsidies in agriculture are identified by \u0026ldquo;Boxes\u0026rdquo; namely Green Box, Amber Box \u0026amp; Blue Box.1. Amber box : It is a term used by the WTO to describe subsidies that can distort international trade. These subsidies can make a country\u0026rsquo;s products cheaper than similar products from other countries. Some examples of amber box subsidies include: 1. Subsidies for seeds and fertilizers 2. Subsidies for electricity and irrigation 3. Minimum support prices 2. Blue box : It is a category for subsidies given for agriculture ventures. It also includes the amounts spent on government services such as research, disease control, and infrastructure and food security. 3. Green box : It is a subsidy that a country can give to its farmers under the WTO\u0026rsquo;s Agreement on Agriculture. The color green symbolizes that these subsidies are permitted. Green box subsidies are not product specific. They are direct income support to farmers who are distressed due to crop loss or any other calamity. Green box subsidies include: 1. Subsidies that do not cause any trade distortion or cause very minimal distortions 2. Fixed payments to producers for environmental programs, so long as the payments are \u0026ldquo;decoupled\u0026rdquo; from current production levels 3. Government-funded subsidies (not by charging consumers higher prices) and must not involve price support The WTO says that in order to qualify for the green box, a subsidy must not distort trade, or at most cause minimal distortion. Note : A black box, also known as a flight data recorder, is\u0026nbsp;a device that records all aspects of an aircraft\u0026rsquo;s operations duringflight.\u0026nbsp;The FAA requires large commercial aircraft and some smaller aircraft to have two black boxes.\u0026nbsp; The black boxes are usually located at the front and rear of the aircraft.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45735", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRouble\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRand\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\ ed by the IMF in 1969. SDRs are artificial currency created to augment international liquidity. It is neither a currency nor a claim on IMF rather it supplements the existing reserves of member countries of IMF. A currency included as SDR must be freely usable, widely used and widely traded. The U.S. dollar, the euro, British pound and the Japanese yen form the SDR basket. Chinese renminbi (RMB) was included in the SDR basket as the fifth currency in the year 2016. The decision was taken during the IMF\u0026rsquo;s five-yearly review of the basket of currencies. At present, SDR is based on a basket of five currencies\u0026mdash;the U.S. dollar, the euro, the Chinese renminbi, the Japanese yen, and the British pound sterling.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45736", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOrganization for Economic Cooperation and Development (OECD)\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100%  Union Finance Minister\u003c/p\u003e\r\n\r\n\u003cp\u003e3. It monitors macro-prudential supervision of the economy.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) The correct answer is 2 and 3 only. The Financial Stability and Development Council (FSDC) was set up by the Government as the apex level forum in December 2010. It was set up much before NITI Aayog was even setup. So, Statement 1 is not correct. The Chairman of the council is the finance minister. Hence Statement 2 is Correct. The council will act as a coordination agency between the various financial sector regulators - the RBI, SEBI, IRDA and the PFRDA. The Council monitors macro-prudential supervision of the economy, which includes functioning of large financial conglomerates. It also addresses inter-regulatory coordination and financial sector development issues. Hence statement 3 is correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45742", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026lsquo;The establishment of \u0026lsquo;Payment Banks\u0026rsquo; is being allowed in India to promote financial inclusion. Which of the following statements is/are correct in this context? \u003cstrong\u003e(UPSC Prelims 2016)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Mobile telephone companies and supermarket chains that are owned and controlled by residents are eligible to be promoters of Payment Banks.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Payment Banks can issue both credit cards and debit cards.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Payment Banks cannot undertake lending activities.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) A payment bank is a new type of bank that the Reserve Bank of India (RBI) has conceptualized. They can\u0026rsquo;t issue credit, but they can accept deposits up to \u20b9200,000 per customer. They also can\u0026rsquo;t issue loans and credit cards. Payment banks can provide other financial services, such as: 1. Remittance transfer services 2. Selling financial products of other banks 3. Mobile payments/transfers/purchases 4. ATM/debit cards 5. Net banking 6. Third party fund transfers Payment banks can handle both current and savings accounts. They can make it easier for smaller units, including low income households, migrant laborers, small business units, and unorganised sectors, to open an account and use other banking services. Here are some payment banks in India: 1. Paytm Payments Bank 2. India Post Payments Bank Credit cards and debit cards : They both are plastic cards that can be used to make purchases. However, they function differently: 1. Credit cards A short-term loan from the card issuer that can be used to purchase items or withdraw cash. Credit cards provide a line of credit that can be borrowed against and paid back later. Credit cards charge interest on the money borrowed, unless it\u0026rsquo;s paid back within the grace period. 2. Debit cards A way to spend money from your savings or current account. Debit cards are linked to the user\u0026rsquo;s bank account and are limited by how much money is in there. When a debit card is used, the funds for the purchase are taken from the checking account almost instantly. Credit cards can provide more purchase protection than debit cards. Credit cards also allow you to spread the cost of big purchases. Debit cards are mainly used for everyday transactions like buying groceries or paying bills. They are not widely accepted for hotel stays, rental cars, or online purchases.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45743", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u0 ption_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRegarding \u0026lsquo;Atal Pension Yojana\u0026rsquo;, which of the following statements is/are correct? \u003cstrong\u003e(UPSC Prelims 2016)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It is a minimum guaranteed pension scheme mainly targeted at unorganized sector workers.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Only one member of a family can join the scheme.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Same amount of pension is guaranteed for the spouse for life after subscriber\u0026rsquo;s death.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) The correct answer is 1 and 3 only. Atal Pension Yojana is a pension scheme introduced by the Government of India in 2015\u0026ndash;16. The objective of the scheme is to provide pension benefits to individuals in the unorganized sector. Hence statement 1 is correct. Atal Pension Yojana (APY) is open to all bank account holders who are not members of any statutory social security scheme. Hence statement 2 is incorrect. Atal Pension Yojana scheme is regulated and controlled by the Pension Funds Regulatory Authority of India (PFRDA). Beneficiaries of the scheme can choose to receive a periodic pension of Rs. 1000, Rs. 2000, Rs. 3000, Rs. 4000, or Rs. 5000, depending on their monthly contributions. Individuals who are above 18 years and below 40 years of age are eligible to invest in the Atal Pension Yojana. In the case of a beneficiary\u0026rsquo;s death, before he/she reaches 60 years of age, his/her spouse shall be entitled to receive a pension. As such, the spouse has an option to either exit the scheme with the corpus or continue to receive pension benefits. The spouse of the subscriber shall be entitled to receive the same pension amount even after the subscriber\u0026rsquo;s death. Hence statement 3 is correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45751", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMining operation by multinational companies in resource-rich but backward areas\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003 003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following is/are the indicator/indicators used by IFPRI to compute the Global Hunger Index Report? \u003cstrong\u003e(UPSC Prelims 2016)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Undernourishment\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Child stunting\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Child mortality\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) The International Food Policy Research Institute (IFPRI) uses all three indicators to calculate the Global Hunger Index (GHI): 1. Undernourishment: The percentage of the population that doesn\u0026rsquo;t get enough food to be healthy and active 2. Child stunting: The percentage of children under five who are short for their age 3. Child mortality: The percentage of children under five who die each year The GHI is a tool that helps policymakers and development practitioners track progress in reducing hunger and prioritize interventions to improve food security and nutrition.It combines the four indicators into one index to reflect the multidimensional nature of hunger. T he GHI focuses on issues related to undernutrition, though overnutrition is also an important concern. T he GHI severity scale is: \u2219 \u0026ge;50: Extremely alarming \u2219 35-49.9: Alarming \u2219 20-34.9: Serious \u2219 10-19.9: Moderate \u2219 \u0026le;9.9: Low T he 2023 global GHI score is 18.3, which is considered moderate. However, the percentage of people who are undernourished globally has increased from 7.5% in 2017 to 9.2% in 2022. It is prepared by the European NGOs of Concern Worldwide and Welthungerhilfe. T he GHI is calculated annually, and its results are published in a report in October each year. According to the 2023 Global Hunger Index (GHI), India ranks 111th out of 125 countries. T his is a four-place drop from 2022, when India ranked 107th out of 121 countries. India\u0026rsquo;s GHI score is 28.7 on a 100-point scale, where 0 is the best score and 100 is the worst. T he 2023 GHI indicates that India has a serious level of hunger.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45756", "image_check": "0", "image_link_1": " question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is/are the advantage/advantages of implementing the \u0026lsquo;National Agriculture Market\u0026rsquo; scheme? \u003cstrong\u003e(UPSC Prelims 2016)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;It is a pan-India electronic trading portal for agricultural commodities.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It provides the farmers access to nationwide market, with prices commensurate with the quality of their produce.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) Advantages of Implementing the National Agriculture Market Scheme 1. Pan-India electronic trading portal: A national electronic trading platform for agricultural commodities is called the National Agriculture Market plan. It aims to create a unified national market for agricultural commodities by integrating the existing Agricultural Produce Market Committee (APMC) markets. T his would result in a single market for agricultural products across the country, which would ensure the availability of a large number of buyers and sellers. T his would help in reducing the intermediaries in the supply chain, thereby reducing the overall cost of marketing and increasing the income of farmers.Access to nationwide market: T he National Agriculture Market scheme provides farmers access to a nationwide market, with prices commensurate with the quality of their produce. T his means that farmers can not only sell their produce in their local markets but also in markets located in other parts of the country. T his would enable farmers to get better prices for their produce, as they would be able to sell their produce in markets where the demand is high. T his would also help in reducing the price gap between the producer and the consumer, as farmers would get a better share of the consumer price. In Short, the National Agriculture Market scheme has several advantages for farmers as it provides them access to a nationwide market, and helps in reducing the intermediaries in the supply chain.Farmer income would rise as a result of higher pricing for their produce.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "434", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45757", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\
