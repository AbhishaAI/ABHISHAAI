function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

el Committee on Banking Supervision. It is now extended and partially superseded by Basel III. The Basel II Accord was published in June 2004. It was a new framework for international banking standards, superseding the Basel I framework, to determine the minimum capital that banks should hold to guard against the financial and operational risks. The regulations aimed to ensure that the more significant the risk a bank is exposed to, the greater the amount of capital the bank needs to hold to safeguard its solvency and overall economic stability. Basel III :It is also known as the Third Basel Accord or Basel Standards, is a voluntary regulatory framework that deals with capital adequacy, stress testing, and market liquidity risk. Basel III is an international regulatory accord that began in 2009 and is still being implemented as of 2022. The reforms were announced in March 2020 and were to be implemented on January 1, 2023. Basel III requires banks to hold more capital against their assets, which reduces their balance sheets and limits the amount of leverage banks can use. The regulations increase minimum equity levels from 2% of assets to 4.5% with an additional buffer of 2.5%, for a total buffer of 7%.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45595", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img  factors such as cost of production, input-output price parity, demand, and supply. The National Food Security Mission (NFSM) : It was launched in October 2007 as a Centrally Sponsored Scheme. The Ministry of Agriculture considered the scheme. To increase the production of rice, wheat, and pulses. The scheme aims to improve the production and productivity of these crops on a sustainable basis. It also aims to raise the income of farmers and ensure food security in the country.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45618", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003c olution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Second Five-Year Plan (1956\u0026ndash;61) was based on the Mahalanobis model, which emphasized rapid industrialization through the development of the public sector and the establishment of heavy industries such as steel, machine tools, and heavy engineering. The idea was that strengthening the capital goods sector would lay the foundation for long-term economic growth and self-sufficiency. Hence, the first statement is correct because the Second Plan clearly focused on building heavy industries and promoting industrial expansion under public ownership. The Third Five-Year Plan (1961\u0026ndash;66) continued the process of industrialization but introduced a stronger focus on achieving self-reliance by reducing dependence on imports. This led to the adoption of the policy of import substitution, where domestic production was encouraged to replace imported goods. The objective was to strengthen domestic industries and conserve foreign exchange reserves. Therefore, the second statement is also correct as the Third Plan explicitly promoted import substitution as a key industrial strategy. Thus, both statements accurately describe the focus of the Second and Third Five-Year Plans, making the correct answer (c) Both 1 and 2.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", " on_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following terms indicates a mechanism used by commercial banks for providing credit to the government? \u003cstrong\u003e(UPSC Prelims 2010)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (D) 1. The Statutory Liquidity Ratio (SLR) : It is a mechanism used by commercial banks to provide credit to the government. The SLR is a monetary tool used by the Reserve Bank of India (RBI) to regulate commercial bank liquidity. It requires banks to maintain reserves in the form of cash, gold, government bonds, and other RBI-approved securities before providing credit to customers. Under the SLR, banks invest a certain percentage of their money in government securities and other assets, such as gold. They provide long-term credit to the government by investing in government securities and short-term finance by purchasing Treasury Bills. 2. Liquidity Adjustment Facility : It is a monetary policy tool used by the Reserve Bank of India (RBI) to manage liquidity in the banking system and ensure monetary stability. The LAF consists of two operations: i) Repo operation : \u2219 Allows banks to borrow money through repurchase agreements (repos) to meet their short-term liquidity requirements.ii) Reverse repo operation : \u2219 Allows banks to make loans to the RBI through reverse repo agreements to park their excess funds. 3. Cash Credit Ratio : It is\u0026nbsp;a liquidity measure that shows a company\u0026rsquo;s ability to cover its short-term obligations using only cash and cash equivalents.\u0026nbsp;It\u0026rsquo;s calculated by dividing a company\u0026rsquo;s total cash and cash equivalents by its total current liabilities.\u0026nbsp; 4. Debt Service Obligation : Debt service obligation is the total amount of money a company or individual needs to pay back all of their debt obligations. It\u0026rsquo;s calculated annually and includes the total loan amount, the principal, and the interest.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45622", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is a sudden fall in the value of a currency against other currencies\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u ustomers. The Reserve Bank of India (RBI) first introduced the Banking Ombudsman Scheme in 1995. The scheme was created to provide a quick and inexpensive way for bank customers to resolve complaints about banking services. The banking ombudsman functions similarly to a court in resolving customer grievances. The RBI appoints a special officer, called the Banking Ombudsman, to address customer grievances. Each grievance is registered with a unique identification number.The Banking Ombudsman Scheme 2006 (amended in 2017) was in operation until the launch of the Integrated Ombudsman Scheme in 2021. The ombudsman can provide compensation of up to 20 lakh rupees for any consequential loss suffered by the complainant. The ombudsman can also provide up to one lakh rupees for the complainant\u0026rsquo;s loss of time, expenses, and mental anguish. The Banking Ombudsman does not charge any fee for filing and resolving customers complaints. If one is not satisfied with the decision passed by the Banking Ombudsman, one can approach the appellate authority against the Banking Ombudsmen\u0026rsquo;s decision.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45639", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePartners should be less than 20\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !import blic Sector in GDP has declined in the last 10 years.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (B)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eWhile India\u0026rsquo;s GDP has shown consistent growth, it has not increased by four times over any recent ten-year span. The country\u0026rsquo;s economic growth rate has averaged around 6\u0026ndash;7% annually, which is substantial but not enough to quadruple the GDP within a decade. Hence, the first statement is incorrect. The second statement, however, is correct. The percentage share of the public sector in GDP has indeed declined over the last ten years. This trend reflects the economic reforms and liberalization policies that encouraged greater participation of the private sector in production, investment, and infrastructure. Many public sector undertakings have seen their relative contribution to GDP fall, while private enterprises have expanded rapidly across industries such as telecom, manufacturing, services, and infrastructure. Therefore, while the overall GDP has grown, it has not quadrupled; only the share of the public sector in GDP has declined. Thus, the correct answer is (b) 2 only.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": stablished in 1975. The first RRB was established on October 2, 1975. Regional Rural Banks (RRBs) were established in 1975 under the Regional Rural Banks Act, 1976. The Prathama Bank of Moradabad, Uttar Pradesh was the first RRB. Regional Rural Banks (RRBs) are designed to work under the ideal of promoting financial inclusion and rural development. They aim to provide banking and financial services to rural and agricultural areas, particularly focusing on the needs of small and marginal farmers, rural artisans, and other economically disadvantaged sections of society by keeping the lending rates lower than cooperative institutions. Microfinance Institutions : Microfinance institutions (MFIs) are financial companies that provide small loans to people who don\u0026rsquo;t have access to banking services. MFIs are also known as microcredit. Here are some features of microfinance loans: 1. Borrowers are usually from low income backgrounds.2. 3. 4. 5. Loans are usually small amounts. Loan tenures are short. Loans don\u0026rsquo;t require collateral. Loans are usually repaid more frequently. MFIs can help small entrepreneurs set up, expand, or scale up their operations. This can help boost entrepreneurship and small business development, which is important for economic growth and job creation. In India, different types of institutions provide microfinance, including: 1. 2. 3. 4. 5. Commercial banks Credit unions NGOs (Non-Governmental Organizations) Sectors within government banks Cooperatives\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45646", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"tex  for a set period of time. The goal of a teaser loan is to entice borrowers with a lowinterest rate so that they will accept the loan and lock in higher rates later on. Common examples of teaser loans include: 1. Credit cards with low introductory offers 2. Adjustable-rate mortgages Gold loans : A teaser rate is usually 0% and is only temporary. After the teaser rate expires, the rate increases to a normal or higher rate. In some cases, the borrower may not be able to keep up with payments.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45653", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMore liquidity in the market\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLess liquidity in the market\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} ss\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is a tax levied on value addition at each stage of transaction in the production-distribution chain.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is a tax on final consumption of goods or services and must ultimately be borne by consumer.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is basically subject of the central government and state government\u0026nbsp;are merely facilitator for its successful implementation.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following is not a feature of \u0026ldquo;Value Added Tax\u0026rdquo;? \u003cstrong\u003e(UPSC Prelims 2011)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (D) Value-added tax (VAT) : It is a type of indirect tax levied on goods and services for value-added at every point of the production or distribution cycle, starting from raw materials and going all the way to the final retail purchase. VAT was introduced on April 1, 2005. Under it, the amount of value addition is first identified at each stage, and then tax is levied on the same. Ultimately, the end consumer has to pay the complete VAT while buying goods; buyers at earlier stages of production receive reimbursements for tax they have paid. Because the consumer bears the entire tax, VAT is also a consumption tax. Each state has its own VAT laws for proper implementation and levying. Different states apply different VAT rates according to their implied laws. VAT, being a \u0026lsquo;tax on sale or purchase of goods within a State\u0026rsquo; is a State Subject by virtue of Entry 54 of State List of the Seventh Schedule of the Constitution of India. Since VAT/Sales tax is a State subject, the Central Government has been playing the role of a facilitator for the successful implementation of VAT. The main aim behind the introduction of VAT was to eliminate the presence of double taxation and the cascading effect of the then-existing sales tax structure. Has GST totally subsumed VAT? To completely eliminate the cascading effect of taxes and to make the indirect tax structure simpler, the union government introduced the Goods and Services Tax (GST) in July 2017. Though GST replaced VAT on most goods, some goods are still not covered under the new regime. VAT continues to be the tax levied on such goods.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45661", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDeflation\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eInflation\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eStagflation\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eHyperinflation\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEconomic growth is usually coupled with? \u003cstrong\u003e(UPSC Prelims 2011)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (B) Economic growth is usually coupled with inflation. Inflation : It is a sustained rise in overall price levels. Moderate inflation is associated with economic growth, while high inflation can signal an overheated economy. Economic growth : It results in higher disposable income available with the consumers which increases the overall demand along with the supply available for the consumers. This increase in demand spurs inflation. Deflation : It is a persistent fall in the general price level of goods and services. It occurs when the annual inflation rate falls below 0%, which is a negative inflation rate. Deflation is different from disinflation, which is a slowdown in the inflation rate. During disinflation, inflation declines to lower levels but prices continue to rise. Stagflation : It occurs when an economy experiences a combination of slow economic growth (stagnation), high unemployment, and rising prices (inflation) at the same time. This creates a challenging situation for policymakers because the usual tools to address one issue may worsen the other. Hyperinflation : It is a term used to describe a situation where the prices of goods and services rise rapidly and uncontrollably over a period of time. It\u0026rsquo;s generally used when the rate of inflation increases by more than 50% per month. Hyperinflation can be triggered by a very quick growth in the money supply. Hyperinflation rates can reach 5 to 10% a day. In some cases, hyperinflation can be 1,000 percent or more a year.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45662", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Multi-dimensional Poverty Index developed by Oxford Poverty and Human Development Initiative with UNDP support covers which of the following? \u003cstrong\u003e(UPSC Prelims 2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Deprivation of education, health, assets and services at household level\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Purchasing power parity at national level\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Extent of budget deficit and GDP growth rate at national level\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) What is Multidimensional Poverty Index? The Multidimensional Poverty Index (MPI) is a metric that measures acute poverty in over 100 developing countries. The MPI was developed in 2010 by the Oxford Poverty \u0026amp; Human Development Initiative (OPHI) and the United Nations Development Programme. The MPI measures deprivations in health, education, and living standards by looking at 10 indicators: 1. Nutrition, 2. Child mortality, 3. Years of schooling, 4. School attendance, 5. Access to cooking fuel, 6. Sanitation, 7. Drinking water, 8. Electricity,9. Housing, 10. Ownership of assets. The MPI is published by the UNDP\u0026rsquo;s Human Development Report Office. It provides a holistic view of poverty by capturing the severe deprivations each person faces concurrently in education, health, and living standards. The MPI uses a scale from 0 to 1, with 0 being the best and 1 being the worst (poorest). According to Statista, Chad had the highest pre n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eHow does the National Rural Livelihood Mission seek to improve livelihood options of rural poor? \u003cstrong\u003e(UPSC Prelims 2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. By setting up a large number of new manufacturing industries and agribusiness centres in rural areas\u003c/p\u003e\r\n\r\n\u003cp\u003e2. By strengthening \u0026lsquo;self-help groups\u0026rsquo; and providing skill development\u003c/p\u003e\r\n\r\n\u003cp\u003e3. By supplying seeds, fertilizers, diesel pump-sets and micro-irrigation equipment free of cost to farmers\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (B)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe National Rural Livelihood Mission (NRLM) seeks to improve livelihoods by strengthening self-help groups (SHGs) and providing skill development, not by setting up new industries directly. It empowers rural poor households, particularly women, through this network to improve their access to financial resources, markets, and other support services for a variety of livelihoods, including agribusiness and self-employment. Hence, statement 1 is incorrect. The mission primarily works by organizing rural poor households into Self-Help Groups (SHGs) and federating them into higher-level institutions. These SHGs are then provided with training, capacity building, credit linkage, and livelihood support. The central idea is to empower rural women socially and economically through collective action, microfinance, and skill development. Therefore, strengthening SHGs and providing skill training forms the core strategy of the NRLM \u0026mdash; making statement 2 correct. Statement 3 is incorrect since NRLM does not provide free agricultural inputs like seeds, fertilizers, or irrigation equipment \u0026mdash; those are handled under agricultural subsidy programmes. Therefore, answer is (B) 2 only.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45668", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{o opment plan for the district. Increasing the government spending on public health : Government aims to increase public health expenditure to 2.5% of GDP by 2025. T he 15th Finance Commission, the Union Health Minister Dr. Harsh Vardhan, highlighted that the government aims at gradually increasing the public health expenditure to 2.5 per cent of the nation\u0026rsquo;s GDP by the year 2025.Strengthening the Mid-day Meal Scheme : T he Mid-Day Meal Program or MDMP is a program of \u0026bdquo;Nutrition Support to Primary Educationl and is considered as a means of mitigating the classroom hunger to all children below the age of 14 years who are enrolled in schools. It was aimed at improving enrolment, attendance, and retention, while simultaneously improving the nutritional status of students in primary classes. It helps the students belonging to disadvantaged sections to attend the schools more regularly and it helps them to concentrate on classroom activities. Additional Information : Several schemes are being implemented by the government for inclusive growth which includes the following : 1. 2. Mahatma Gandhi National Rural Employment Guarantee Act Scheme (MGNREGA) Prime Minister\u0026rsquo;s Employment Generation Programme (PMEGP)Mudra Bank scheme 4. Deendayal Antyodaya Yojana- National Urban Livelihoods Mission (DAY-NULM) 5. Sarva Siksha Abhiyan (SSA) 6. National Rural Health Mission (NRHM) 7. Bharat Nirman 8. Swachh Bharat Mission\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45676", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-widt 3eEXPLANATION : (D) The correct answer is 1,2 and 3. The increase in the general level of prices may be caused by many factors like an increase in the money supply, a decrease in the aggregate level of output, an increase in the effective demand, an increase in income, the rapid growth of population, etc. 1. Increase in the money supply: The increase in the money supply will generate inflation and increase more customer spending. The rate of interest will become low. Hence statement 1 is correct. 2. The decrease in the Aggregate level of output: The aggregate supply of goods and services decreases with the rise in input prices. The changes in the level of prices don\u0026rsquo;t affect aggregate supply. It creates Cost-push inflation. 3. Increase in the Effective demand: Effective demand refers to a condition in which it shows the consumer\u0026rsquo;s willingness and ability to buy a particular product and services at different rates. An increase in the effective demand results in rising in employment opportunities with rising in prices.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45685", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRepayment of public debt\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflo n_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (D) Deficit financing : It is a policy that involves borrowing funds from the public or central bank to fill the gap between government revenue and expenditure. The gap being covered by borrowing from the public by the sale of bonds or by printing new money. Government expenditure by printing money boosts incomes and raises private demand in the economy. Thus, it fuels inflation. A little increase in inflation is healthy as it encourages business activity. But if the government doesn\u0026rsquo;t stop in time, more and more money floods the market and creates high inflation. And since inflation is revealed with a lag, it is often too late before governments realise, they have over-borrowed. Higher inflation and higher government debt provide grounds for macroeconomic instability.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45686", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA fall in the level of prices\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {m ......\u0026nbsp;\u003cstrong\u003e(UPSC Prelims 2013)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) Effect of Increase in Demand for Money when Money Supply Remains Constant The following outcomes can be seen when the supply of money remains constant and demand for money rises : 1. Increase in Interest Rates: \u2219 As people demand more money, the demand for credit also increases. \u2219 This leads to an increase in interest rates as lenders try to match the demand for credit with the limited supply of money. \u2219 Higher interest rates make borrowing more expensive, which reduces the demand for credit and money. 2. Decrease in Investment: \u2219 Higher interest rates also discourage investment, as borrowing costs increase.This reduces the overall level of investment in the economy, which can lead to lower economic growth and employment. 3. 4. 5. Decrease in Aggregate Demand: \u2219 As interest rates rise, the cost of borrowing for consumption also increases. \u2219 This reduces the overall level of aggregate demand in the economy, as people are less willing to spend money on goods and services. Increase in Savings: Higher interest rates also encourage people to save more, as they can earn higher returns on their savings. T his can lead to a decrease in consumption, as people spend less and save more. Appreciation of Currency: Higher interest rates can also lead to an appreciation of the currency, as foreign investors are attracted by higher returns on investments in the domestic economy. T his can make exports more expensive and reduce the competitiveness of domestic f irms.\u003c/p\u003e", "solution_video": "", "sorting isans, and other economically disadvantaged sections of society by keeping the lending rates lower than cooperative institutions. 2. Land Development Banks (LDBs) : T hey are a type of development bank in India that offer long-term loans, business loans, and basic investment products. T hey are also known as Land Mortgage Banks and Agricultural and Rural Development Banks in some states. T he first LDB was established in Jhang, Punjab in 1920. The Land Mortgage Institutions Act of the 1930s gave these banks their true impetus. LDBs are co-operative institutions that are registered under the Co-operative Societies Act. They are limited liability associations of agricultural borrowers, as their members have limited liability.NABARD : It stands for the National Bank for Agriculture and Rural Development was established on July 12, 1982. T he Parliament established NABARD through Act 61 of 1981, based on the recommendations of the B. Sivaramman Committee. It\u0026rsquo;s an apex development bank in India that focuses on providing financial and developmental support to rural areas, particularly in the agricultural sector, headquartered at Mumbai with regional offices all over India. NABARD plays a crucial role in promoting rural development, agriculture, and alliedactivities through various schemes and initiatives.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45688", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:1 lowing statements: \u003cstrong\u003e(UPSC Prelims 2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Inflation benefits the debtors.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Inflation benefits the bondholders.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) If the borrower already owed the money before the inflation occurred, the inflation benefits the borrower. This is because the borrower still owes the same amount of money, but now he or she has more money in his or her pay check to pay off the debt. This results in less interest for the lender if the borrower uses the extra money to pay his or her debt. The twin factors that affect a bond\u0026rsquo;s price are inflation and changing interest rates. A rise in either interest rates or the inflation rate will tend to cause bond prices to drop. Hence, Inflation benefits the debtors and not Bond holders.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45689", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u /strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Demand deposits with the banks\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Time deposits with the banks\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Savings deposits with the banks\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Currency\u003c/p\u003e\r\n\r\n\u003cp\u003eThe correct sequence of these assets in the decreasing order of liquidity is\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (D) Liquid Assets in Decreasing Order ofLiquidity 1. Currency : Currency is the most liquid asset as it can be used for immediate transactions and is widely accepted.It is easily exchangeable and does not require any clearance or authorization. 2. Demand deposits with the banks : Demand deposits are also known as current deposits or checking accounts. These are deposits that can be withdrawn on demand, without any prior notice. They are highly liquid as they can be easily converted into cash. 3. Savings deposits with the banks : Savings deposits are also known as time deposits. These deposits have a fixed maturity period and cannot be withdrawn before the maturity date without incurring a penalty. Hence, they are less liquid than demand deposits. 4. Time deposits with the banks Time deposits are deposits that have a fixed maturity period and cannot be withdrawn before the maturity date without incurring a penalty. They are the least liquid among all the liquid assets as they cannot be easily converted into cash.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "433", "test_series_id": "19", "topic": ""}];
const QUIZ_TITLE = "Economy PYQ Test 6";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
