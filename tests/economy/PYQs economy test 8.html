function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

ased standards for food and regulate its manufacture, storage, distribution, sale, and importThe FSSAI is responsible for ensuring that food businesses follow the regulations and food standards provided in the FSS Act. The FSSAI also checks for safe food storage, manufacturing, and handling practices. The FSSAI has three types of licenses: 1. FSSAI Basic Registration 2. FSSAI State license 3. FSSAI Central License Registration is for petty food manufacturers, including small or cottage scale industries with an annual turnover of up to 12 lacs. Food businesses with income above this limit are required to take a license.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45792", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !importan s thereafter.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) Prior to the NFSA\u0026rsquo;s introduction, there were mainly three types of ration cards issued by State Governments such as 1. Above Poverty Line (APL), 2. Below Poverty Line (BPL), and 3. Antyodaya (AAY) ration cards distinguished by different colours operated by the concerned StateGovernment. According to NFSA 2013, APL and BPL groups have been re-classified into two categories \u0026ndash; i) Non-Priority ii) Priority. Eldest woman of the household of age 18 years or above is to be the head of the household for the purpose of issuing of ration cards. Hence, statement 2 is correct. Pregnant Women and Lactating Mothers are entitled to food supplement of 600 calories of energy and 18-20 gms of protein per day in the form of Micronutrient Fortified Food and/or energy-dense food as take away home ration.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45793", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r nts: \u003cstrong\u003e(UPSC Prelims 2018)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. BHIM app allows the user to transfer money to anyone with a UPI-enabled bank account.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. While a chip-pin debit card has four factors of authentication, BHIM app has only two factors of authentication.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) Statement 1 is correct: A payment app called Bharat Interface for Money (BHIM)uses the Unified Payments Interface (UPI) to enable simple, quick, and effortless transactions. You can make direct bank payments to anyone on UPI using their UPI ID or scanning their QR with the BHIM app. You can also request money through the app from a UPI ID. Statement 2 is not correct: From a consumer point of view, there are three levels of authentication that are required in this app.One is the device ID and mobile number, then the bank account which you are linking to this app, and the finally the UPI Pin which is needed to complete the transaction. Compared to a standard net banking app or a chip and pin debit card, which only offer two means of authentication, there are three.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45794", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width : "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn a given year in India, official poverty lines are higher in some States than in others because.............. \u003cstrong\u003e(UPSC Prelims 2019)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) Poverty lines are established thresholds for income below which a person is said to be poor. Poverty lines vary from country to country and within countries as well. In India, poverty lines differ from state to state due to various factors. Price Levels vary from State to State: The cost of living in different states of India is not the same. The cost of essential goods like food, clothing, and shelter varies from state to state. Some states have a higher cost of living, and some states have a lower cost of living.Therefore, the poverty line in each state is different. Higher poverty lines in some States: The official poverty line is higher in some states than in others because the price levels are higher in those states. For example, the poverty line in Delhi is higher than in Bihar, as the cost of living in Delhi is higher than in Bihar. The poverty line in Kerala is higher than in Uttar Pradesh, as the cost of living in Kerala is higher than in Uttar Pradesh. Effects on poverty rates: Price level variations affect poverty rates in different states. A person who is above the poverty line in one state may be below the poverty line in another state due to the difference in the cost of living. Therefore, poverty rates differ across the states.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45803", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eChina\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndia\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMyanmar\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u0 \n\r\n\u003cp\u003e2. Now, coal blocks are allocated on lottery basis\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Till recently, India imported coal to meet the shortages of domestic supply, but now India is self-sufficient in coal production.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) 1. Coal sector was nationalised in two phases under Indira Gandhi Government in 1972. 2. The coal Blocks are allocated through Auc tions not on lottery basis. 3. The coal sector is the monopolistic sector in India. India holds 5th biggest coal re serves in the world but due to incapacity of coal production by monopolistic firms, it imports coals to meet the shortages of do mestic supply. But, still the country is not self-sufficient of coal production.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45805", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 4 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims 2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The United Nations Convention against Corruption (UNCAC) has a \u0026lsquo;Protocol against the Smuggling of Migrants by Land, Sea and Air\u0026rsquo;.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The UNCAC is the ever-first legally binding global anti-corruption instrument.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. A highlight of the United Nations Convention against Transnational Organized Crime (UNTOC) is the inclusion of a specific chapter aimed at returning assets to their rightful owners from whom they had been taken illicitly.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. The United Nations Office on Drugs and Crime (UNODC) is mandated by its member States to assist in the implementation of both UNCAC and UNTOC.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) The Correct Answer is Option 3 i.e. 2 and 4 only. The protocol against the smuggling of Migrants by land, sea and air comes under the the United Nations Convention against Transnational Organized Crime (UNTOC) and not UNCAC, Hence Statement 1 is Not Correct. The United Nations Convention Against Corruption (UNCAC) is the only legally binding universal anti-corruption instrument. The Convention covers many different forms of corruption, such as bribery, trading in influence, abuse of functions, and various acts of corruption in the private sector. Hence Statement 2 is Correct. United Nations Convention Against Corruption (UNCAC) includes \u0026ldquo;Returning Assets to their rightful owners from whom they they have been taken illicitly\u0026rdquo;. Hence Statement 3 is Not Correct. The United Nations Office on Drugs and Crime (UNODC) is mandated by its Member States to assist in the implementation of both Conventions,such as UNCAC and UNTOC, along with the UN Drug Conventions of 1961, 1971 and 1988 underpin all the operational work of UNODC. Hence Statement 4 is Correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45806", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cs ening in the forex markets. This decline in value negatively affects an economy by creating instabilities in exchange rates, meaning that one unit of a certain currency no longer buys as much as it used to in another currency. Foreign currency earnings and Remittances contribute to the strengthening of the rupee. Hence Statements 1 and 3 are Correct. Increasing government Expenditure will have no effect on the value of the currency. Hence Statement 2 is Not Correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45811", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCertificate of Deposit\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCommercial Paper\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePromissory Note\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eParticipatory Note\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following is issued by registered foreign portfolio investors to overseas investors who want to be part of the Indian stock market without registering themselves directly? \u003cstrong\u003e(UPSC Prelims 2019)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (D) 1. Certificate of Deposit : A Certificate of Deposit (CD) is a time deposit offered by banks with a fixed term and interest rate. It\u0026rsquo;s a low-risk investment where you deposit a specific amount for a set period, and in return, you receive interest when the CD matures. Early withdrawal may incur penalties. 2. Commercial Paper : Commercial paper refers to short-term, unsecured promissory notes issued by corporations, typically to meet short-term financing needs. These notes are usually sold at a discount and mature in less than a year. Value of CP should be in multiple of 1 lakh and minimum amt must be 5 lakh, for duration of 7-364 days. 3. Participatory note : Participatory notes (PNs) are financial instruments used by foreign investors to invest in Indian securities without directly registering with the Securities and Exchange Board of India (SEBI). These notes are issued by registered foreign institutional investors (FIIs) to overseas investors, enabling them to indirectly participate in the Indian stock market. PNs are often used for anonymity and ease of trading but have faced scrutiny due to concerns about transparency and regulatory oversight. 4. Promissory Note : A promissory note is a legally binding financial instrument that outlines a promise from one party (the issuer or maker) topay a specific sum of money to another party (the payee) at a specified date or on-demand. It includes details such as the amount owed, terms of repayment, interest rate (if any), and the names of the parties involved. Promissory notes are commonly used in various financial transactions, including loans and debt agreements.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45812", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u00 100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to India\u0026rsquo;s Five-Year Plans, which of the following statements is/are correct? \u003cstrong\u003e(UPSC Prelims 2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. From the Second Five-Year Plan, there was a determined thrust towards substitution of basic and capital good industries.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The Fourth Five-Year Plan adopted the objective of correcting the earlier trend of increased concentration of wealth and economic power.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. In the Fifth Five-Year Plan, for the first time, the financial sector was included as an integral part of the Plan.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) India employed the \u0026lsquo;Five Year Plan\u0026rsquo; model, which was derived from Russia, for economic planning. With first five-year plan launched in 1951, India now has a total of 12 such plans. However, the practice was called off in 2017 by the Narendra Modi-led NDA government. The Second Plan focused on the industrial development of the country and stressed capital goods industries. The Fourth Plan was focussed on growth with stability and progressive achievement of self-reliance. The plan focussed on eliminating poverty with slogan of \u0026ldquo;Garibi Hatao\u0026rdquo; given during the 1971 elections by Indira Gandhi.Agriculture, employment, and the fight against poverty were given primary priority in the Fifth Plan.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", eak-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Asian Infrastructure Investment Bank (AIIB), consider the following statements: \u003cstrong\u003e(UPSC Prelims 2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. AIIB has more than 80 member nations.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. India is the largest shareholder in AIIB.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (A)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003csection\u003e\r\n\u003cp\u003eThe Asian Infrastructure Investment Bank (AIIB) is a multilateral development bank established in 2016 with the aim of promoting infrastructure development and regional connectivity across Asia. It currently has more than 80 member nations, including both regional and non-regional members, which makes statement 1 correct. Statement 2 is incorrect because India is not the largest shareholder in the AIIB. The largest shareholder is China, which also hosts the headquarters of the bank in Beijing. India, however, is the second-largest shareholder and has a significant voting share, reflecting its important role in the institution. Therefore, only the first statement is correct. The correct answer is (a) 1 only.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e\r\n\u003c/section\u003e\r\n\r\n\u003csection\u003e\u0026nbsp;\u003c/section\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45814", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100 }\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIf another global financial crisis happens in the near future, which of the following actions/policies are most likely to give some immunity to India? \u003cstrong\u003e(UPSC Prelims 2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Not depending on short-term foreign borrowings\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Opening up to more foreign banks\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Maintaining full capital account convertibility\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) Due to its reliance on short-term borrowing, India will experience a cash shortage during times of global crises because of a worldwide liquidity shortage. T he International movement of capital is not always free; countries restrict flows of capital as and when needed to safeguard their markets from erratic flows of capital. In India, for example, there are restrictions on the movement of foreign capital and the rupee is not fully convertible on capital account. What does Capital Account Convertibility mean?CAC means the freedom to convert rupee into any foreign currency (Euro, Dollar, Yen, Renminbi etc.) and foreign currency back into rupee for capital account transactions. In very simple terms it means, Indian\u0026rsquo;s having the freedom to convert their local f inancial assets into foreign ones at market determined exchange rate.CAC will lead to a free exchange of currency at a lower rate and an unrestricted movement of capital. T he consensus that emerges from the literature focussing on the implications of foreign bank lending during the global f inancial crisis (GFC) is that foreign banks seem to promote instability through rapid cut backs in their lending relative to domestic banks. Opening to foreign banks will be riskier in times of crisis. Banks may transfer capital back to their home nations.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45815", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo reduce it by Rs 1,00,000\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTo increase it by Rs 1,00,000\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{over ll be............. \u003cstrong\u003e(UPSC Prelims 2020)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (D) Money Supply: Money supply is the total amount of currency in use by the general public at a specific period. It needs to be noted that total stock of money is different from total supply of money. Supply of money is only that part of total stock of money which is held by the public at a particular point of time. T he circulating money involves the currency, printed notes, money in the deposit accounts and in the form of other liquid assets. RBI publishes figures for four alternative measures of money supply, viz. M1, M2, M3 and M4. \u2219 M1 = CU + DDM2 = M1 + Savings deposits with Post Office savings banks \u2219 M3 = M1 + Net time deposits of commercial banks \u2219 M4 = M3 + Total deposits with Post Office savings organisations (excluding National Savings Certificates) \u2219 CU is currency (notes plus coins) held by the public and DD is net demand deposits held by commercial banks. \u2219 M1 and M2 are known as narrow money. \u2219 M3 and M4 are known as broad money. \u2219 M1 is most liquid and easiest for transactions whereas M4 is least liquid of all.M3 is the most commonly used measure of money supply. \u2219 It is also known as the total amount of financial resources.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45816", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66 tant} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) Public investments in agriculture are those that the government makes to develop resources or social assets to boost agricultural productivity. Fixing MSP gives farmers the remunerative price without creating any durable infrastructure. Computerization Agri-credit societies improves their productivity by digitising their functioning. Social capital development like agriculture education improves the knowledge base of farmers paving the way for improved productivity. While free electricity and waiver of agricultural loans creates government liabilities without creating any durable assets on ground. Creating durable assets is another benefit of cold chain infrastructure in lowering post harvest losses.Hence, Answer (C) 2, 3 and 6 only is Correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45817", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the importance of the term \u0026ldquo;Interest Coverage Ratio\u0026rdquo; of a firm in India? \u003cstrong\u003e(UPSC Prelims 2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It help in understanding the present risk of a firm that a bank is going to give loan to.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It helps in evaluating the emerging risk of a firm that a bank is going to give loan to.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The higher a borrowing firm\u0026rsquo;s level of Interest Coverage Ratio, the worse is its ability to service its debt.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) The correct answer is 1 and 2 only. Interest Coverage Ratio : It indicates the ability of a firm to take the loan or debt and repay it within the tenure of the loan. It helps in understanding and evaluating the present risk of a firm that a bank is going to give a loan to. Hence statement 1 is true. It is calculated by dividing a company\u0026rsquo;s earnings before interest and taxes by the company\u0026rsquo;s interest expenses for a given period. Hence 2 is correct. The lower the ratio, the more the company is burdened by debt expense. When a company\u0026rsquo;s interest coverage ratio is only 1.5 or lower, its ability to meet interest expenses may be questionable. Hence statement 3 is incorrect. Key Points : The interest coverage ratio is a good assessment of a company\u0026rsquo;s short-term financial health.Moreover, an interest coverage ratio below 1 indicates the company orrect answer using the code given below:\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (D) The correct answer is 1 2 3 and 4. The domestic factors which affect prices of rice in India are as follows The intensity of seasonal monsoon across India and production of Basmati and non basmati rice. The ratio of full and broken kernels in milling the paddy. The government\u0026rsquo;s trading and Minimum support price of rice- it results in the diversion of stocks from the open market hence driving up the price for the ultimate consumers. Hence 1 is correct. Rice tenders by Food Corporation of India and other organizations Consumer subsidies ( it lowers the prices for the ultimate consumer) Hence, statement 3 is correct. The government\u0026rsquo;s stockpiling (low stock levels constraint that ability to buffer the price rise) Hence, statement 4 is correct.Climatic shocks determine rice production and prices in the short run due to increasing demand. Hence 2 is correct. Some international factors which affect Indian rice pricing are as follows 1. Global tenders for procurement of rice 2. Appreciation or depreciation of USD and Indian Rupees. 3. Crude Oil Prices. Additional Information The Manipur black rice, called \u0026lsquo;Chakhao\u0026rsquo; is the most recent addition to GI tagged rice varieties of India. West Bengal is the largest rice producer in India. In 1965, the ICAR launched the AICRIP or All India Coordinated Rice Improvement Project for R\u0026amp;D for improving rice production.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", " \n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims 2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The weightage of food in Consumer Price Index (CPI) is higher than that in Wholesale Price Index (WPI).\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The WPI does not capture changes in the prices of services, which CPI does.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Reserve Bank of India has now adopted WPI as its key measure of inflation and to decide on changing the key policy rates.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (A)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe weightage of food in the Consumer Price Index (CPI) is higher than that in the Wholesale Price Index (WPI) because CPI reflects household consumption patterns where food occupies a major share, while WPI mainly measures wholesale goods and gives less importance to food items. Thus, statement 1 is correct. The Wholesale Price Index (WPI) does not account for changes in the prices of services such as education, healthcare, or transport, while the Consumer Price Index (CPI) includes these services since it measures the overall cost of living for consumers. Thus, statement 2 is correct. The Reserve Bank of India has adopted CPI-based inflation, not WPI, as its key measure for monetary policy and for deciding key policy rates under the inflation targeting framework introduced in 2014. Thus, statement 3 is incorrect. Hence, the correct answer is (a) 1 and 2 only.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45821", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:10  Agricultural Costs and Prices and announced by Cabinet Committee on Economic Affairs. \u2219 MSP for sugarcane is known as Fair and Remunerative Prices. \u2219 Note : The Cabinet Committee on Economic Affairs (CCEA)\u0026nbsp;is responsible for approving the Minimum Support Price (MSP).\u0026nbsp;The CCEA is chaired by the Prime Minister of India.\u0026nbsp;The Commission for Agricultural Costs and Prices (CACP) recommends the Minimum Support Price (MSP). \u2219 The CACP is an advisory body under the Ministry of Agriculture and Farmers Welfare. T he Centre currently fixes MSPs for 24 crops and these are as follows \u0026ndash; \u2219 7 cereals \u0026ndash; paddy, wheat, maize, bajra, jowar, ragi and barley \u2219 5 pulses \u0026ndash; Gram , arhar/tur, urad, moong and Lentil. \u2219 8 oilseeds - rapeseed-mustard, groundnut, soya bean, Toria, sunflower, sesamum, safflower and nigerseed. \u2219 4 commercial crops \u0026ndash; cotton, sugarcane, copra and raw jute.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45822", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle  type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference of the Indian economy, consider the following statements: \u003cstrong\u003e(UPSC Prelims 2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. \u0026lsquo;Commercial Paper\u0026rsquo; is a short-term unsecured promissory note.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;\u0026lsquo;Certificate of Deposit\u0026rsquo; is a long-term instrument issued by the Reserve Bank of India to a corporation.\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;\u0026lsquo;Call Money\u0026rsquo; is a short-term finance used for interbank transitions.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e4.\u0026nbsp;\u0026lsquo;Zero-Coupon Bonds\u0026rsquo; are the interest bearing short-term bonds issued by the Scheduled Commercial Banks to corporations.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) Commercial Papers (CPs) are indeed short-term, unsecured promissory notes issued at a discount to face value, primarily by corporations to fund their short-term liabilities. They are issued for maturities between a minimum of 7 days and a maximum of up to one year from the dateof issue. Hence,, the Statement 1 is correct. Statement 2 is incorrect. Certificates of Deposit (CDs) are actually short-term, negotiable, and interest-bearing financial instruments issued by banks and financial institutions, not specifically by the RBI, and they can be issued to individuals, corporations, companies, trusts, funds, and associations. CDs have a fixed term and are typically intended to be held until maturity, offering higher interest rates than savings accounts. Statement 3 is correct. Call Money is indeed a form of short-term borrowing and lending among banks and financial institutions, where the funds are borrowed and lent on an overnight basis or for a short period. This is used to maintain liquidity and meet short-term mismatches in funds. Statement 4 is incorrect. Zero-Coupon Bonds are issued at a discount and do not pay interest (coupon) during their life but are redeemed at their face value at maturity. T hey can be issued by various entities, not just Scheduled Commercial Banks, and are not limited to short-term maturities nor exclusively issued to corporations.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45823", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is the investment through capital instruments essentially in a listed company.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is a largely non-debt creating capital f low.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is the investment which involves debt-servicing.\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is the investment made by foreign institutional investors in the Government securities.\ t does not create any repayment or interest liability for the receiving country. The investor takes an ownership stake in the enterprise rather than lending money, making it a more stable and sustainable source of foreign capital. Hence, option (b) is correct. Option (a) is incorrect because FDI is not confined to investment in listed companies; it can be made in both listed and unlisted firms, including new ventures or subsidiaries. Option (c) is incorrect because FDI does not involve debt servicing \u0026mdash; that is a feature of foreign loans or debt instruments. Option (d) is incorrect because investment by foreign institutional investors (FIIs) in securities like shares or bonds is known as Foreign Portfolio Investment (FPI), not FDI.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45824", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css als, inorganic chemicals, agro-chemicals, cosmetics \u0026amp; toiletries, and castor oil. From April 2019 to January 2020, the export of dyes increased by 9.12% y-o-y to US$ 2.27 billion. Cosmetics and toiletries increased by 5.62%. Overall India Suffers Trade / Current Account Deficit. Note : Data and Fact Given here is according to exam year, students can update current data w.r.t mentioned export - imports\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45825", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max- s\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (D) Debt incurred by entities other than financial organizations, such as households and non-financial corporations, is referred to as non-financial debt. In the context of the Indian economy, non-financial debt includes the following: 1. Housing loans owed by households : \u2219 This refers to the debt incurred by households for the purpose of buying or constructing a residential property. \u2219 Housing loans are typically long-term loans with a repayment period of up to 30 years. \u2219 Housing loans are a major component of non-financial debt in India.2. Amounts outstanding on credit cards : \u2219 This refers to the debt incurred by individuals or households through credit cards. \u2219 Credit card debt is typically short-term debt with high-interest rates. \u2219 Credit card debt is also a significant component of non-financial debt in India. 3. Treasury bills : \u2219 Treasury bills are short-term government securities that are issued to fund the government\u0026rsquo;s short-term borrowing requirements. \u2219 Housing loans owed by households, Amounts outstanding on credit cards, Treasury bills, Credit Card balance etc. are types of nonfinancial debts. Hence 1 2 and 3 are correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45826", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "n the Marginal Standing Facility Rate\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Cut the Bank Rate and Repo Rate\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) In order to increase economic activity, an expansionary monetary policy entails lowering interest rates or expanding the money supply. An increase in the SLR constricts the ability of the bank to inject money into the economy which affects growth. The MSF or Marginal Standing Facility (MSF) Rate is the rate at which RBI lends funds overnight to scheduled banks, against government securities. RBI has introduced this borrowing scheme to regulate short-term asset liability mismatch in a more effective manner. MSF basically provides a greater liquidity cushion. Higher the MSF rate, more expensive is borrowing for banks, as well as corporate borrowers and individuals. It is used by RBI to control the money supply in the country\u0026rsquo;s financial system. The repo rate is the rate at which the Reserve Bank of India lends money to commercialbanks in order to help these lenders meet their short-term liquidity needs. If the repo rate is low, banks are required to pay lower interest amount towards loans. This impacts the loans taken by customers, who can also avail loans at lower interest rates. This boosts economic activity. The rate of interest charged by the central bank on the loans they have extended to commercial banks and other financial institutions is called \u0026ldquo;Bank Rate.\u0026rdquo; When the RBI raises the bank rate, banks\u0026rsquo; borrowing costs rise as well, which decreases the amount of money available on the market. Note : To Boost Accuracy, Student Should Focus on Keywords of Question. In this Question NOT is Keyword.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45828", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !importa nt}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3, 4 and 5 Only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 5 Only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3, 4 and 5\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Indian economy, demand pull-inflation can be caused/ increased by which of the following? \u003cstrong\u003e(UPSC Prelims 2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Expansionary policies\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Fiscal stimulus\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Inflation-indexing wages\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Higher - purchasing power\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Rising interest rates\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (A) Demand-pull inflation refers to a situation where the demand for goods and services is greater than the supply, leading to an increase in prices. This can be caused or increased by various factors in the Indian economy, which are: 1. Expansionary policies: When the government implements expansionary policies like increasing government spending, lowering taxes, or increasing subsidies, it leads to an increase in demand for goods and services. This, in turn, can lead to demand-pull inflation. 2. Fiscal stimulus: Fiscal stimulus refers to measures taken by the government to increase spending and boost economic growth. This can include measures like increasing infrastructure spending or providing subsidies to certain industries. However, if the fiscal stimulus is too large, it can lead to an increase in demand and inflation. 3. Inflation-indexing wages: Inflation indexing wages, wages in the economy is linked to inflation which means wage moves as inflation changes in the economy. Such indexing is provided to reduce the effect of inflation on wages. For example - a worker is getting 100 rs as a wage and inflation in the economy increases to 5%, so the wage of the worker increases by 5% i.e. 105. So effective change in the wages is zero and it does not increase/ decrease purchasing power. So, it can not lead to a demand to pull inflation in the economy. Hence 3 is not correct.4. Higher purchasing power: When consumers have more money to spend, they tend to spend more, leading to an increase in demand for goods and services. This can happen when there is an increase in income, wealth, or credit availability. 5. Rising interest rates: It decreases the money supply in the economy. This may result in a credit crunch in the economy. It is costlier to borrow money in the economy and it leads to a decreased money supply. So, it can not cause demand-pull inflation in the economy. Hence 5 is not correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45832", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 On
