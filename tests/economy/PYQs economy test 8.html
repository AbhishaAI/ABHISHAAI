tion_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Governor of the Reserve Bank of India (RBI) is appointed by the Central Government, as per the provisions of the RBI Act, 1934, making statement 1 correct. The appointment is made by the Government for a fixed tenure, generally three years, and the Governor is responsible for overseeing the functioning of India\u0026rsquo;s central bank, including monetary policy, currency issuance, and regulation of the financial system. Statement 2 is incorrect because the Constitution of India does not contain any provision granting the Central Government the right to issue directions to the RBI. Instead, this power arises from Section 7 of the RBI Act, 1934, which allows the Central Government to issue directions to the RBI in the public interest after consultation with the Governor. Therefore, it is a statutory provision, not a constitutional one. Statement 3 is correct because the powers and functions of the Governor are clearly derived from the RBI Act, 1934, which provides the legal framework for the management and operation of the Reserve Bank of India. Hence, the correct answer is (c) 1 and 3 only.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45835", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "op ax-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the casual workers employed in India, consider the following statements: \u003cstrong\u003e(UPSC Prelims 2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. All casual workers are entitled for Employees Provident Fund coverage.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. All casual workers are entitled for regular working hours and overtime payment.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The government can by a notification specify that an establishment or industry shall pay wages only through its bank account.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION :\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eCasual workers in India are those employed on a temporary or daily-wage basis without a permanent or contractual employment relationship. They are generally engaged for short-term or seasonal work. Statement 1 is incorrect because not all casual workers are entitled to Employees\u0026rsquo; Provident Fund (EPF) coverage. The EPF Act, 1952 applies only to establishments with a specified number of employees (usually 20 or more) and to those workers who are on the payroll and receive wages above a certain threshold. Many casual and informal workers, especially those in unorganized sectors, fall outside its coverage due to the temporary nature of their employment. Statement 2 is correct because under various labour laws such as the Minimum Wages Act, 1948 and the Contract Labour (Regulation and Abolition) Act, 1970, casual workers are entitled to fair wages, regular working hours, and overtime payment if they work beyond the prescribed limit. These laws apply to all categories of workers, including casual labourers. Statement 3 is also correct because the Payment of Wages (Amendment) Act, 2017 empowers the government to notify that wages in certain establishments must be paid only through bank accounts or digital means, ensuring transparency and reducing wage exploitation. Therefore, the correct answer is (b) 2 and 3 only.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45836", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCut in tax rates accompanied by increase in interest rate.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIncrease in expenditure on public projects\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u0 ce of one of its substitutes rises. The demand for a good decrease, if the price of one of its substitutes falls. 2. The demand for a good increase, if the price of one of its complement\u0026rsquo;s falls. 3. The demand for an inferior good decrease if income increases. The demand for a normal good increase if income increases. 4. If the Price of the good falls, then its demand increases.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45838", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u s have to meet certain criteria in order to get a license from RBI. 3. banks is The area of operation of primary (urban) co-operative confined to metropolitan, urban or semi-urban centres and caters to the needs of small borrowers including retail traders, small entrepreneurs, professionals and the salaried class. The changes to The Banking Regulation Act approved by Parliament in September 2020, brought cooperative banks under the direct supervision of the RBI. Urban cooperative banks will now be treated on a par with commercial banks and a cooperative bank can, with prior approval of the RBI, issue equity shares, preference shares, or special shares to its members or to any other person residing within its area of operation, by way of public issue or private placements.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45839", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 Only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 Only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIndia Government Bond Yields are influenced by which of the following? \u003cstrong\u003e(UPSC Prelims 2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Actions of the United States Federal Reserve.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Actions of the Reserve Bank of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Inflation and short-term interest rates.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (D) Indian Government Bond Yields: The returns that an investor receives from investing in government securities or bonds issued by the Indian government are known as Indian Government Bond Yields. These yields are influenced by various factors, some of which are: 1. Actions of the United States Federal Reserve:T he actions of the United States Federal Reserve, which is the central bank of the USA, have a significant impact on the Indian Government Bond Yields. T his is because the US dollar is a global currency, and any changes in its interest rates affect the global financial markets, including India. For example, if the US Federal Reserve increases its interest rates, it can lead to an outflow of funds from India, which can result in an increase in Indian Government Bond Yields. 2. 3. Actions of the Reserve Bank of India: T he Reserve Bank of India (RBI), which is the central bank of India, also influences the Indian Government Bond Yields. T his is because the RBI is responsible for managing the monetary policy of the country, which includes setting interest rates. For example, if the RBI increases its repo rate, it can lead to a decrease in the demand for government bonds, which can result in an increase in Indian Government Bond Yields. Inflation and short-term interest rates:Inflation and short-term interest rates also influence Indian Government Bond Yields. When inflation is high, investors demand higher returns to compensate for the loss of purchasing power. Similar to this, investors favor short-term securities over long-term bonds when short-term interest rates are high, which can enhance the yield on Indian government bonds.EXPLANATION : (A) A bond issued under the Issue of Foreign Currency Convertible Bonds and Ordinary Shares (Through Depository Receipt Mechanism) Scheme, 1993, as amended from time to time, is referred to as a \u0026ldquo;Foreign Currency Convertible Bond\u0026rdquo; (FCCB). Automatic Route for Issue of Foreign Currency Convertible Bonds (FCCBs) is allowed. (a) Foreign Portfolio Investment is any investment made by a person resident outside India in capital instruments where such investment is less than 10 percent of the post issue paid-up equity capital on a fully diluted basis of a listed Indian company or (b) less than 10 percent of the paid up value of each series of capital instruments of a listed Indian company.It is the percentage which defines whether it is direct or institutional investment.FII made above 10 percent of the post issue paid-up equity capital will be considered as FDI. But Once an FDI always an FDI. Foreign investment in Indian securities has been made possible through the purchase of Global Depository Receipts, Foreign Currency Convertible Bonds and Foreign Currency Bonds issued by Indian issuers which are listed, traded and settled overseas. An NRI can open a rupee-dominated account called a Non-Resident External (NRE) account to make it easier to deposit profits in foreign currencies. This is not FDI.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45840", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 Only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 a r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims 2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe effect of devaluation of a currency is that it necessarily\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Improves the competitiveness of the domestic exports in the foreign markets.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Increases the foreign value of domestic currency.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Improves the trade balance.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above statements is/are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (A)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eDevaluation means an intentional reduction in the value of a country\u0026#39;s currency relative to foreign currencies. When the domestic currency becomes cheaper, exports become less expensive for foreign buyers, leading to an increase in export demand and greater competitiveness in foreign markets. Thus, statement 1 is correct. Devaluation does not increase the foreign value of the domestic currency; it actually decreases it. For example, if \u20b91 was earlier equal to $0.012, after devaluation it may become $0.010, meaning the rupee\u0026rsquo;s foreign value has fallen. Hence, it becomes weaker, not stronger. Thus, statement 2 is incorrect. Although devaluation can potentially improve the trade balance by increasing exports and reducing imports, i nternational organization that aims to promote global monetary cooperation, exchange rate stability, balanced trade growth, and financial stability. It provides financial assistance to member countries facing balance of payments problems. The IMF\u0026rsquo;s headquarters are located in Washington, D.C., United States. Costa Rica, Poland, Brazil, Uruguay, and Cuba were the first members of IMF. At present, 190 Nations are members of IMF, Andorra - 190th Member. Poland Withdrew in 1950 - allegedly pressured by the soviet union - but returned in 1986. The countries that are not a part of the IMF are\u0026nbsp;Cuba, North Korea, Monaco, Taiwan, Vatican City, and East Timor Liechtenstein. India is a founder member of the IMF. India has not taken any financial assistance from the IMF since 1993. The International Monetary Fund (IMF) publishes several reports, including: 1. Global Financial Stability Report : Assesses global financial markets 2. Fiscal Monitor Report : Analyzes public finance developments 3. External Sector Report : Evaluates global external developmentsThe International Monetary Fund (IMF) publishes a number of indices, including: 1. Consumer Price Index (CPI) : It Measures changes in the prices of goods and services purchased by households 2. Financial Development index (FD) : A relative ranking of countries based on the depth, access, and efficiency of their financial institutions and markets\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45845", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003 tion_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the Indian economy, consider the following statements: \u003cstrong\u003e(UPSC Prelims 2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. An increase in Nominal Effective Exchange Rate (NEER) indicates the appreciation of rupee.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. An increase in the Real Effective Exchange Rate (REER) indicates an improvement in trade competitiveness.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. An increasing trend in domestic inflation relative to inflation in other countries is likely to cause an increasing divergence between NEER and REER.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) The Nominal Effective Exchange Rate (NEER) is a weighted average exchange rate that represents the nominal value of one country\u0026rsquo;s currency relative to a basket of various foreign currencies. The nominal exchange rate is the amount of domestic currency needed to purchase foreign currency. If a domestic currency increases against a basket of other currencies inside a floating exchange rate regime, NEER is said to appreciate. If the domestic currency falls against the basket, the NEER depreciates. So, statement 1 is correct.The Real Effective Exchange Rate (REER) is the weighted average of a country\u0026rsquo;s currency in relation to an index or basket of other major currencies. The weights are determined by comparing the relative trade balance of a country\u0026rsquo;s currency against that of each country in the index. An increase in a nation\u0026rsquo;s REER is an indication that its exports are becoming more expensive and its imports are becoming cheaper. This results in losing its trade competitiveness. So, statement 2 is not correct. REER remains in sync with the inflationary trends\u0026mdash;the upward biases in REER due to inflation was recently seen in India. An increase in domestic inflation relative to inflation in other countries is likely to cause an increasing divergence between NEER and REER. The rising disparity between NEER and REER developments in recent years was brought on by India\u0026rsquo;s domestic inflation rate being higher than the six main currencies taken into account. So, statement 3 is correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45846", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\ mport bill. T here are a variety of methods by which RBI intervenes. It can intervene directly in the currency market by buying and selling dollars. If RBI wishes to prop up rupee value, then it can sell dollar and when it needs to bring down rupee value, it can buy dollars. Statement 3 is correct: When the US raises its domestic interest rates, this tends to make India less attractive for the currency trade. As a result, some of the money may be expected to move out of the Indian markets and flow back to the US, therefore decreasing the value of India\u0026rsquo;s currency against the US dollar. As a result, if interest rates in the United States or the European Union were to decline, the value of the rupee versus the dollar would rise, which is likely to prompt RBI to purchase dollars.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45847", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the Indian economy, what are the advantages of \u0026ldquo;Inflation Indexed Bonds (IIBs)\u0026rdquo;? \u003cstrong\u003e(UPSC Prelims 2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Government can reduce the coupon rates on its borrowing by way of IIBs.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;IIBs provide protection to the investors from uncertainty regarding inflation.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The interest received as well as capital gains on IIBs are not taxable.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (A)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eInflation-Indexed Bonds (IIBs) are designed so that both the principal and interest payments are linked to the inflation rate, ensuring that their real value is maintained. Because investors are compensated for inflation risk, the government may offer a slightly lower fixed coupon rate compared to normal bonds since investors receive an inflation-adjusted return. Hence, the government can reduce the real cost of borrowing through IIBs. Thus, statement 1 is correct. One of the main advantages of IIBs is that they protect investors from inflation uncertainty. When inflation rises, the principal or interest payments increase in proportion, ensuring that the investor\u0026rsquo;s purchasing power remains intact. This makes IIBs an effective hedge against inflation risk. Thus, statement 2 is correct. The interest income and capital gains earned from Inflation-Indexed Bonds are not exempt from taxation in India. They are treated like other government securities, and the returns are subject to income tax as per applicable laws. Hence, investors still need to pay tax on the interest and capital gains received from IIBs. Thus, statement 3 is incorrect. Thus, the correct Answer is (a) 1 and 2 only.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45849", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u00 mg {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the Indian economy, consider the following statements : \u003cstrong\u003e(UPSC Prelims 2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A share of the household financial savings goes towards government borrowings.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Dated securities issued at market related rates in auctions form a large component of internal debt;\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above statements is/are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;A portion of household financial savings in India does go towards financing government borrowings. When households invest in small savings schemes, post office deposits, Public Provident Fund (PPF), or government securities (G-Secs) through mutual funds and banks, these funds are ultimately utilized by the government to meet its borrowing requirements. Thus, part of the household sector\u0026rsquo;s financial savings is channeled into government debt instruments. Thus, statement 1 is correct. Dated securities are long-term government bonds issued by the Reserve Bank of India (RBI) on behalf of the government through auctions. These securities carry a fixed or floating interest rate and have maturity periods ranging from 5 to 40 years. They are issued at market-related rates determined in competitive bidding and form the major portion of India\u0026rsquo;s internal debt, as opposed to short-term instruments like Treasury Bills. Thus, statement 2 is correct. Therefore the correct Answer is (c) Both 1 and 2.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45854", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims 2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Tight monetary policy of US Federal Reserve could lead to capital flight.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Capital flight may increase cost of firms with existing External Commercial Borrowings (ECBs)\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Devaluation of domestic currency decreases the currency risk associated with ECBs\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) Tight monetary policy is an action undertaken by a central bank such as the Federal Reserve to slow down overheated economic growth. Central banks engage in tight monetary policy when an economy is accelerating too quickly or inflation\u0026mdash;overall prices\u0026mdash;is rising too fast. Statement 1 is correct: Central Banks enact monetary policy to keep inflation, unemployment, and economic growth stable and positive.When the economy overheats central banks raise interest rates and take other contractionary measures to slow things down \u0026ndash; this can discourage investment and depress asset prices. Thus, tight monetary policy of the US Federal Reserve could lead to capital flight by the investors. What is Capital Flight? Capital flight is a large-scale movement of financial assets and capital out of a country. Capital flight can drive up the interest costs as there is reduced money supply in the system. Thus, it would lead to increase in the interest cost of firms that have external commercial borrowings. Hence, Statement 2 is correct Statement 3 is incorrect: Devaluation of domestic currency does not affect the External Commercial Borrowings as it is denominated in the foreign currency and not in the domestic currency.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45855", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e" ent of public sector banks. Statement 1 is incorrect: Banks Board Bureau comprise the Chairman, three ex officio members i.e., Secretary, Department of Public Enterprises, Secretary of the Department of Financial Services and Deputy Governor of the Reserve Bank of India, and five expert members, two of which are from the private sector. The Chairman is selected by the central government and RBI governor does not head it.Statement 2 and 3 are correct : Banks Board Bureau recommends for the selection of head for Public Sector Banks and other key personnel if required. Additionally, it creates plans for increasing funding and enhancing PSB performance.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45857", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Convertible Bonds consider the following statements: \u003cstrong\u003e(UPSC Prelims 2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. As there is an option to exchange the bond for equity, Convertible Bonds pay a lower rate of interest.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The option to convert to equity affords the bondholder a degree of indexation to rising consumer prices.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is / are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eConvertible Bonds indeed carry an option for the bondholder to exchange the bond for equity shares of the issuing company at a later stage. Because investors get this added potential benefit of conversion (which could yield capital gains if share prices rise), they accept a lower coupon rate compared to ordinary bonds. Thus, statement 1 is correct. The option to convert into equity gives the bondholder a certain hedge against inflation. When consumer prices rise, equity values also tend to go up in nominal terms. Therefore, by having the right to convert into shares, the bondholder indirectly enjoys protection from the erosion of purchasing power that comes with inflation \u0026mdash; in effect, a degree of indexation. Thus, statement 2 is also correct. Therfore the correct answer is (c) Both 1 and 2.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": n\u003cp\u003e1, 2 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn India, what is the role of the Coal Controller\u0026rsquo;s Organization (CCO)? \u003cstrong\u003e(UPSC Prelims 2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. CCO is the major source of Coal Statistics in Government of India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It monitors progress of development of Captive Coal/Lignite blocks.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. It hears any objection \u0026lsquo; to the Government\u0026rsquo;s notification relating to acquisition of coal-bearing areas.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. It ensures that coal mining companies deliver the coal to end users in the prescribed time.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (A)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Coal Controller\u0026rsquo;s Organisation (CCO), under the Ministry of Coal, is indeed the main source of official coal statistics for the Government of India. It collects, compiles, and publishes data on coal production, dispatch, consumption, and quality. This is one of its core and officially recognized roles. Thus, statement 1 is correct. The CCO also monitors the progress of development of captive coal and lignite blocks. It tracks the status of production and ensures that companies allotted these blocks follow the rules and timelines. This function is specifically mentioned in its mandate under the Colliery Control Rules, 2004. Thus, statement 2 is correct. The Coal Controller does have a role in hearing objections under the Coal Bearing Areas (Acquisition and Development) Act, 1957, specifically regarding notices for acquisition of coal-bearing areas. The Controller\u0026rsquo;s office can process and examine objections before final government notifications. So, the statement aligns with that procedural responsibility. Thus, statement 3 is correct. However, ensuring that coal mining companies deliver coal to end users in prescribed time is not a defined function of the CCO. That responsibility lies primarily with Coal India Limited (CIL) and its subsidiaries under the operational control of the Ministry of Coal, not the CCO. Thus, statement 4 is incorrect. Therefore the correct answer is (a) 1, 2 and 3.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45861", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "nega ons\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following activities of the Reserve Bank of India is considered to be part of \u0026lsquo;sterilization\u0026rsquo;? \u003cstrong\u003e(UPSC Prelims 2023)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) Sterilization is an action taken by the Central Bank (such as RBI in India) to counterbalance the effects of foreign exchange interventions on domestic money supply and inflation. It is done to neutralize the impact of inflows or outflows of foreign exchange reserves on the domestic monetary system. Open Market Operations (OMOs) are one of the tools used by the RBI for sterilization. OMOs are the purchase or sale of government securities by the Central Bank in the open market in order to regulate the money supply in the economy. When the RBI buys government securities, it injects liquidity into the economy, while when it sells these securities, it absorbs liquidity from the economy. Through OMOs, the RBI can ei ally more profitable. Based on this definition, we can see that only two of the above markets are included in the capital market, that is Government Bond Market and the stock market. The other two, Call Money Market and Treasury Bill Market are part of the money market, as they deal with short-term financial instruments. Therefore, option (b) is the correct answer.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45868", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eResettlement of a large number of people, uprooted from their countries due to war, by giving them a large cultivable land which they cultivate collectively and share the produce\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMany marginal farmers in an area organize themselves into groups and synchronize and harmonize selected agricultural operations\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMany marginal farmers in an area together . make a contract with a corporate body and surrender their land to \u0026middot; the corporate body for a fixed term for which the corporate body makes. a payment of agreed amount to the farmers\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA company extends loans, technical knowledge and material inputs to a number of small farmers in an area so that they produce the agricultural commodity required by the company for its manufacturing\u0026nbsp;process and commercial production.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following best describes the concept of \u0026lsquo;Small Farmer Large Field\u0026rsquo;?\u003cstrong\u003e (UPSC Prelims 2023)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) The concept of \u0026lsquo;Small Farmer Large Field\u0026rsquo; is a participatory collective action model that aims to improve the livelihood of small and marginal farmers in India by achieving economies of scale and bargaining power in the supply chain. The Small Farmer Large Field (SFLF) model was piloted in two villages of Odisha, an eastern Indian state, with 112 farmers who organized themselves into groups and synchronized their operations such as nursery bed management, transplanting, and harvesting collectively to achieve economies of scale. The SFLF farmers also purchased inputs (seed and fertilizer) and sold paddy as a group to increase their bargaining power in price negotiations. The results from this pilot study showed that the participating farmers almost doubled their profits. The SFLF concept was adapted from the Large Field Model (LFM) of Vietnam, which was also based on the principles of aggregation and achieving economies of scale, through strengthening backward and forward integration along the supply chain and lowering costs by synchronising key agricultural operations from field preparation to harvest. Therefore, option (b) is the correct answer.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45869", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly one\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly two\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAll three\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims 2023)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Government of India provides Minimum Support Price for niger Guizotia abyssinica) seeds.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Niger is cultivated as a Kharif crop.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Some tribal people in India use niger seed oil for cooking. .\u003c/p\u003e\r\n\r\n\u003cp\u003eHow\u0026nbsp;many of the above statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eWhat is MSP? Minimum Support Price (MSP) is a government-set minimum price for certain agricultural products. The government buys crops from farmers at the MSP if the open market prices are lower than the cost of production. The MSP is based on a calculation of at least 1.5 times the cost of production. The government considers the MSP a \u0026quot;minimum price\u0026quot; for any crop that is remunerative for farmers and deserves \u0026quot;support\u0026quot;. The chief objectives of setting up MSP are: a) Support farmers from distress sales b) To procure food grains for public distribution. The Government of India indeed provides a Minimum Support Price (MSP) for niger (Guizotia abyssinica) seeds. Niger is an oilseed crop, and the Commission for Agricultural Costs and Prices (CACP) includes it in the list of crops eligible for MSP under the oilseeds category. The MSP ensures farmers receive a guaranteed minimum price for their produce, protecting them from price fluctuations. Thus, statement 1 is correct. Niger is primarily grown as a Kharif crop in India. It is sown with the onset of the monsoon (June\u0026ndash;July) and harvested around October\u0026ndash;November. The crop is mainly cultivated in states like Madhya Pradesh, Odisha, Maharashtra, Chhattisgarh, Jharkhand, and Gujarat. Its growth depends on rainfed conditions typical of Kharif crops. Thus, statement 2 is correct. Niger seeds are used to produce niger seed oil, which is a form of edible oil. In several tribal regions of India, especially in central and eastern states, tribal communities traditionally use niger seed oil for cooking due to its availability and nutritive properties. It is valued for its light flavor and high nutritional content. Thus, statement 3 is correct. Kharif crops: These are crops that are sown in the Indian subcontinent during the rainy season, which typically occurs from June to September. These crops are also known as monsoon crops. Some common examples of Kharif crops include: Rice: The most significant Kharif crop in terms of acreage and production. Jowar (Sorghum), Bajra (Pearl Millet): Grains used for food and fodder. Maize: Widely cultivated for its grains. Cotton: Cultivated for fiber. Sugarcane: Grown for sugar production. Kharif crops are dependent on the southwest monsoon, and their cultivation is vital for the agrarian economy in countries like India. Therefore the correct answer is (c) All three.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45870", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly one\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly two\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly three\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle typ conomies. Intangible investments can be created or acquired by businesses, but they do not appear on the balance sheet unless they have been purchased. Among the four assets listed above, three are considered intangible investments:1. brand recognition, 2. intellectual property 3. mailing list of clients. These assets have no physical form, but they can generate value for the business by enhancing its reputation, innovation, and customer loyalty. Inventory, on the other hand, is a tangible asset that consists of physical goods that are ready to be sold or used in production. So, points 1, 3 and 4 are correct. Intangible assets exist in opposition to tangible assets, which include land, vehicles, equipment, and inventory. So, point 2 is not correct. Therefore, option (c) is the correct answer.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45871", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly two\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly three\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly four\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAll five\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following : \u003cstrong\u003e(UPSC Prelims 2023)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Demographic performance\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Forest and ecology\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Governance reforms\u003c/p\u003e\r\n\r\n\u003cp\u003e4 . Stable government\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Tax and fiscal efforts\u003c/p\u003e\r\n\r\n\u003cp\u003eFor the horizontal tax devolution, the Fifteenth Finance Commission used how many of the above as criteria other than population area and income distance?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (B)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Fifteenth Finance Commission considered demographic performance as one of the criteria for horizontal tax devolution among states. This was introduced to reward states that successfully controlled population growth, shifting the reference population year from 1971 to 2011 while balancing the interests of states that performed well in population management. Thus, statement 1 is correct. The criterion of forest and ecology was also included by the Fifteenth Finance Commission. It recognizes states with larger forest cover and ecological contributions since maintaining forests limits their economic activity and revenue potential. The inclusion of this factor promotes environmental conservation. Thus, statement 2 is correct. Governance reforms were not included as a criterion for horizontal tax devolution by the Fifteenth Finance Commission. While governance quality is important, it was not used as a measurable parameter in the formula for determining inter-state share in central taxes. Thus, statement 3 is incorrect. Stable government is not a criterion for tax devolution. Political stability is not quantifiable in fiscal transfers and hence has no role in the Commission\u0026rsquo;s formula. Thus, statement 4 is incorrect. Tax and fiscal efforts were indeed used as one of the criteria. This factor rewards states that perform better in mobilizing their own revenues, encouraging fiscal responsibility and efficient taxation systems.Thus, statement 5 is correct. Therefore the correct answer is (b) Only three.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45872", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly one\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly two\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overf ystem.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A digital currency can be distributed with a condition programmed into it such as a time frame for spending it.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is / are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C) Central bank digital currencies (CBDCs) are a form of digital currency issued by a country\u0026rsquo;s central bank. They are similar to cryptocurrencies, except that their value is fixed by the central bank and equivalent to the country\u0026rsquo;s fiat currency. Countries will be able to directly exchange digital currencies in a bilateral way and without going through SWIFT or similar settlement systems. So, statement 1 is correct.A Central bank digital currencies is programmable to the point that the currency can be made to expire, thus forcing consumers to use it upto a certain date. So, statement 2 is correct. Therefore, option (c) is the correct answer.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "435", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45874", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u
