function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e1, 3 and 4\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The World Intellectual Property Organisation (WIPO) is a specialised agency of United Nations System of Organisations\u003c/p\u003e\r\n\r\n\u003cp\u003e2. WIPO has its headquarters at Rome\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Trade Related Aspects of Intellectual Property Rights (TRIPS) Agreement is binding on all WTO members\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Least developed country members of WTO are not required to apply the provisions of TRIPS Agreements for a period of 20 years from the general date of application of the Agreement\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of these statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe World Intellectual Property Organization (WIPO) is a specialized agency under the United Nations system that promotes the protection of intellectual property across the globe through cooperation among member countries and administration of various treaties like the Paris and Berne Conventions. Therefore, it is a specialized UN body, making statement 1 correct. However, WIPO\u0026rsquo;s headquarters is located in Geneva, Switzerland, not in Rome. Rome is the headquarters of the Food and Agriculture Organization (FAO), another UN agency. Hence, statement 2 is incorrect. The Trade-Related Aspects of Intellectual Property Rights (TRIPS) Agreement is an integral part of the World Trade Organization (WTO) framework and is legally binding on all WTO member countries. It sets minimum standards for the protection and enforcement of various forms of intellectual property, including patents, copyrights, trademarks, and trade secrets. Therefore, statement 3 is correct. Regarding least developed countries (LDCs), the WTO granted them a transitional period of 20 years from the date of the TRIPS Agreement\u0026rsquo;s entry into force in 1995, meaning they were not required to implement TRIPS provisions immediately. This period was further extended in subsequent ministerial conferences, currently up to July 1, 2034 for pharmaceutical products. Thus, the statement correctly describes the original 20-year relaxation period, making statement 4 correct. Therefore, the correct answer is (C) 1, 3 and 4.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45516", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAbid Hussain Committee.\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNarasimham Committee.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: , "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich reference to the Indian economy, consider the following activities: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Agriculture, Forestry and Fishing\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Manufacturing\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Trade, Hotels Transport and Communication\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Financing Insurance, Real Estate and Business services.\u003c/p\u003e\r\n\r\n\u003cp\u003eThe decreasing order of the contribution of these sectors to the Gross Domestic Product (GDP) at factor cost at constant prices (2000\u0026ndash;01) is\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe correct answer is (c) 3, 4, 1, 2 The decreasing order of contribution to India\u0026#39;s GDP at factor cost (2000-01 prices) is: 3. Trade, Hotels, Communication, Transport; 4. Financing, Insurance, Real Estate, Business Services; 1. Agriculture, Forestry, Fishing; and 2. Manufacturing. The service sector has the largest contribution, followed by finance and services, then agriculture, and lastly, manufacturing. 3. Trade, Hotels, Communication, Transport: This sector, also known as the service sector, contributed the most to the GDP. 4. Financing, Insurance, Real Estate, and Business services: This is another part of the service sector that has a significant contribution. 1. Agriculture, Forestry, and Fishing: This sector, the primary sector, has a declining share over the years but still contributed more than manufacturing. 2. Manufacturing: This sector, the secondary sector, had the smallest contribution among the four sectors listed.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45519", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 1 4 2\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {ma  The period 1951 to 1981 witnessed rapid and high population growth, mainly because of significant improvements in medical care, sanitation, and nutrition, which reduced mortality sharply while fertility rates remained high. Finally, during 1981 to 2001, India still experienced high population growth, but with definite signs of slowdown, as literacy increased, family planning measures gained acceptance, and fertility rates began to decline. Thus, the correct sequence (A B C D) is 3 1 2 4 \u0026mdash; which corresponds to option (c).\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45520", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/st \u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The new WPI series with base 1993 94 became effective from April 1998\u003c/p\u003e\r\n\r\n\u003cp\u003e2. In the new WPI series, became effective from 1 April 2000.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The weight for electricity has increased in the new WPI series\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of these statements are correct ?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Wholesale Price Index (WPI) measures the average change in the prices of goods traded in bulk at the wholesale level. It serves as an important indicator of inflation trends in the economy. The new WPI series with base year 1993\u0026ndash;94 was introduced by the Government of India and became effective from April 1998, making the first statement correct. The second statement, however, is incorrect, because the new WPI series did not become effective from 1 April 2000; the correct date of implementation was 1 April 1998. The third statement is correct, as in the revised WPI series, the weight for electricity (and other components of the energy sector) was increased to better reflect the growing importance of the power and energy sector in the Indian economy. Hence, the correct answer is C.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answe  for broad money (M3) is\u0026nbsp;M3 = M1 + time deposits with commercial banks.\u0026nbsp; Here\u0026rsquo;s some more information about M3: 1. M1:\u0026nbsp;M1 is the sum of currency with the public and demand deposits with the banking system.2. M2:\u0026nbsp;M2 is the sum of M1 and savings deposits of post office savings banks. 3. M4:\u0026nbsp;M4 is the sum of M3 and total deposits with Post Office savings organizations, excluding National Savings Certificates.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45529", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 4\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3 and 4\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the Indian Public Finance consider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2002)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. External liabilities reported in Union Budget are based on historical exchange rates.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The continued high borrowing has kept the real interest rates high in the economy.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The upward trend in the ratio of Fiscal Deficit to GDP in recent years has an adverse effect to private investments.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Interest payments is the single largest component of the non-plan revenue expenditure of the Union Government.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of these statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eIn the context of Indian Public Finance, the external liabilities reported in the Union Budget are not based on historical exchange rates but are instead valued at the current exchange rates prevailing at the time of reporting. Therefore, statement 1 is incorrect. The continued high borrowing by the government tends to increase the demand for loanable funds, which pushes up interest rates and keeps real interest rates high in the economy; hence, statement 2 is correct. The upward trend in the fiscal deficit to GDP ratio in recent years implies that more government borrowing is taking place, which can crowd out private investment due to reduced availability of funds for the private sector\u0026mdash;making statement 3 correct. Statement 4 is also correct, as interest payments form the largest component of the non-plan (now revenue) expenditure of the Union Government, consuming a major share of total expenditure each year. Thus, statements 2, 3, and 4 are correct, while statement 1 is incorrect.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45530", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3, 4\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3, 4, 1\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3, 4, 1, 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;}  Delhi. 2. The Industrial Credit and Investment Corporation of India (ICICI): It is a financial institution that was established in 1955 to develop small and medium-sized private sector industries. ICICI is governed by the Indian Company Act.In 1994, ICICI joined the financial sector by establishing ICICI Bank as its financial branch. In 1998, ICICI Bank became the first bank in India to offer internet banking. ICICI Bank\u0026rsquo;s headquarters are located at Mumbai. 3. The Industrial Development Bank of India (IDBI) : It is a private sector bank that provides financial and banking services. It was established in 1964 by the Government of India to provide financial and credit facilities for the growth of Indian industries. IDBI\u0026rsquo;s headquarters are in Mumbai.4. NABARD : It stands for the National Bank for Agriculture and Rural Development was established on July 12, 1982. The Parliament established NABARD through Act 61 of 1981, based on the recommendations of the B. Sivaramman Committee. It\u0026rsquo;s an apex development bank in India that focuses on providing financial and developmental support to rural areas, particularly in the agricultural sector, headquartered at Mumbai with regional offices all over India. NABARD plays a crucial role in promoting rural development, agriculture, and allied activities through various schemes and initiatives.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45531", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\ \u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (C)FERA stands for Foreign Exchange Regulation Act. It is a law that was passed in India in 1973. The act went into effect on January 1, 1974. FERA\u0026rsquo;s purpose was to regulate foreign exchange transactions and conserve the country\u0026rsquo;s foreign exchange resources. The act also imposed strict regulations on certain types of payments, foreign exchange and securities dealings, and transactions that indirectly affected foreign exchange and the import and export of currency. FERA was introduced at a time when the country\u0026rsquo;s foreign reserves were low. Its main purpose was to regulate foreign exchanges to maintain a satisfactory account of the country\u0026rsquo;s foreign reserves. What is FEMA? FEMA stands for Foreign Exchange Management Act. It is an act of the Parliament of India that was first published on January 1, 1974 and replaced FERA in 1999. The act\u0026rsquo;s purpose is to promote the development and maintenance of India\u0026rsquo;s foreign exchange market. It also gives the Reserve Bank and the Central Government the power to regulate foreign exchange payments, currency notes and bullion, and the transfer of securities. The Foreign Exchange Management Act (FEMA) is currently active in India.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45548", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: br css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEXPLANATION :\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eIn India, stamp duties on financial transactions are a subject listed under Entry 91 of the Union List and Entry 63 of the State List in the Constitution, which means both the Union and State Governments play a role in their administration. The Union Government has the power to levy stamp duties on certain instruments such as bills of exchange, promissory notes, transfer of shares, etc., but the collection of these duties, except in the case of Union Territories, is done by the State Governments. Hence, the duty is levied by the Union Government but collected and appropriated by the State Governments. Therefore, the first statement \u0026mdash; \u0026ldquo;levied and collected by the State Government\u0026rdquo; \u0026mdash; is incorrect, because while the States collect the duty, it is levied by the Union. The second statement \u0026mdash; \u0026ldquo;appropriated by the Union Government\u0026rdquo; \u0026mdash; is also incorrect, because the revenue from these duties is assigned to the States, not retained by the Centre. Thus, neither statement 1 nor 2 is correct.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45549", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-wor overing parts of Jharkhand and West Bengal. This makes it India\u0026rsquo;s earliest and most significant example of a post-independence multipurpose development project. On the other hand, DVC\u0026rsquo;s power generation system is mainly based on thermal and hydroelectric power plants. It operates several major coal-based thermal stations such as those in Bokaro, Chandrapura, Mejia, Durgapur, and Koderma, along with hydroelectric power stations like Tilaiya, Maithon, and Panchet. However, it does not operate any gas-based power stations, as its generation infrastructure relies primarily on coal and hydropower. Hence, only the first statement is correct, while the second one is incorrect. Therefore, the correct answer is (a) 1 only.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45564", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMetallic minerals Fuel minerals- Nonmetallic minerals a\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\ 03cp\u003e(b) The series of index numbers of wholesale prices introduced from April, 2000 has the year 1993- 94 as base year.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) According to Reserve Bank of India, India\u0026rsquo;s foreign exchange reserves exceeded the 125 billion U.S. dollar mark in the year 2004. Foreign exchange, also known as forex or FX, is the process of exchanging one country\u0026rsquo;s currency for another. This is done at a specific rate called the foreign exchange rate. As of December 22, 2023, India\u0026rsquo;s foreign exchange reserves were $620.441 billion The current series of the Wholesale Price Index (WPI) was introduced in May 2017, with 2011-12 as the base year. The new series became effective in April 2017. The WPI is a measure of inflation based on the prices of goods before they reach consumers. It is the most widely used inflation indicator in India. The Ministry of Commerce and Industry publishes the WPI. The WPI base year was revised from 2004 05 to 2011-12 to align it with the base year of other macro economic indicators like the gross domestic product (GDP). The WPI does not capture changes in the prices of services, which CPI does. In WPI, more weightage is given to manufactured goods, while in CPI, more weightage is given to food items.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45567", "image_check": "0", "image_link_1" ", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following statements is NOT correct? \u003cstrong\u003e(UPSC Prelims 2005)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) The statement \u0026ldquo;Rourkela Steel Plant, the first integrated steel plant in the Public Sector of India was set up with the Soviet Union collaboration\u0026rdquo; is incorrect. 1. Rourkela Steel Plant (RSP) : It was established in 1955 with the help of West Germany. The plant\u0026rsquo;s capacity was 1 million tonnes in the 1960s, but has since been increased to 4.5 million tonnes of hot metal and 4.2 million tonnes of crude steel. RSP is located in Rourkela, Odisha. It gets its iron ore from Noamundi, Bonai, and Barsua. The plant was proposed in India\u0026rsquo;s Second Five-Year Plan, which was drafted in 1954\u0026ndash;55. 2. The Salem Steel Plant (SSP): It is a stainless steel production unit of Steel Authority of India Limited (SAIL). It is located in the foothills of Kanjamalai in Salem district, Tamil Nadu. The plant was founded on September 13, 1981, and began production in 1982. It is India\u0026rsquo;s largest special steel plant, with a capacity of 1 MTPA. The plant produces more than 850 special grades of steel, and utilizes an 8 Stand H/V Mill for size reduction. The surrounding areas have an abundance of iron ore and lime. 3. Maharashtra Elektrosmelt Ltd : It is a public sector unit that produces manganese-based ferro alloys. MEL is also known as the Chandrapur Ferro Alloy Plant. In 2011, MEL became a unit of Steel Authority of India Limited (SAIL), one of India\u0026rsquo;s largest steel-making companies. MEL\u0026rsquo;s main objectives are to manufacture mild steel and other carbon and spring steel billets/ingots from iron ore. 4. The Visakhapatnam Steel Plant (VSP) : It is a unit of Rashtriya Ispat Nigam Limited (RINL). RINL is a Navratna company under the Ministry of Steel, Government of India.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45568", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eITC\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-widt al Training Institute (STI) is one of the institutes that provide training in macroeconomics analysis and policy, and related subjects as a part of programme of the IMF Institute\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) 1. The Poverty Reduction and Growth Facility (PRGF) : It is a lending arm of the International Monetary Fund (IMF) that provides loans to the world\u0026rsquo;s poorest countries. The IMF established the PRGF in 1999 to make poverty reduction and growth more central to its lending operations. The PRGF\u0026rsquo;s purpose is to support programs that strengthen the balance of payments position of low-income members and foster growth that leads to higher living standards and poverty reduction. The PRGF is available to countries that are facing balance of payments problems and are eligible to borrow on concessional terms under the International Development Association (IDA). 2. The Singapore Regional Training Institute (STI) : It is the International Monetary Fund\u0026rsquo;s (IMF) regional training center for the Asia and Pacific region. It is a joint venture between the IMF and the Government of Singapore. The STI\u0026rsquo;s goal is to improve human capital and institutional capacity in the Asia-Pacific region for financial and macroeconomic management. The STI provides training and technical assistance to government officials from 38 countries.The STI is one of seven regional training institutes and programs of the IMF Institute. The other six regional institutes are located in Austria, Brazil, China, India, Tunisia, and the United Ar on_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (A) 1. Fiscal Deficit : This is the difference between the government\u0026rsquo;s total expenditure and its total revenue, excluding money from borrowings. It reflects how much the government needs to borrow to meet its expenses.2. Budget Deficit : It\u0026rsquo;s similar to the fiscal deficit, representing the excess of government expenditures over revenues. However, the budget deficit includes all forms of financing, including borrowings and other liabilities. 3. Revenue Deficit : This is the difference between the government\u0026rsquo;s revenue expenditure and its revenue receipts. It indicates whether the government is generating enough revenue to meet its day to-day expenses. 4. Primary Deficit : This is the fiscal deficit minus interest payments on past borrowings. It provides a clearer picture of the government\u0026rsquo;s fiscal health by excluding the cost of servicing existing debt. In summary, fiscal deficit and budget deficit focus on the overall financial health, revenue deficit looks at revenue aspects, and primary deficit considers the fiscal deficit without the burden of interest payments.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45587", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u00 C Prelims 2006)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "316", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eEXPLANATION : (B) 1. The World Trade Organization (WTO) : It was previously known as the General Agreement on Tariffs and Trade (GATT). GATT was established in 1947 and provided rules for world trade from 1948 to 1994. The WTO was founded in 1995 as GATT\u0026rsquo;s successor organization. GATT\u0026rsquo;s negotiating rounds were successful in lowering tariffs, resulting in a 40% reduction in tariffs on industrial goods. Later negotiating rounds included commitments to reduce non-tariff barriers to trade. The WTO addresses non-tariff barriers, trade facilitation, and intellectual property rights. The WTO also establishes a robust dispute settlement system, which GATT did not have.India has been a member of the World Trade Organization (WTO) since January 1, 1995. India was also a member of the WTO\u0026rsquo;s predecessor, the General Agreement on Tariffs and Trade (GATT), since July 1948 2. The United Nations Conference on Trade and Development (UNCTAD) : It is an intergovernmental organization that promotes the interests of developing countries in world trade. UNCTAD is the Permanent body of UNGA which was established in 1964 and is the main authority for trade and development. India is a member of the UNCTAD. 3. The United Nations Industrial Development Organization (UNIDO) : It is a specialized agency of the United Nations that promotes sustainable industrial development in developing countries and economies in transition. UNIDO\u0026rsquo;s focus is on least developed countries (LDCs) and sub-Saharan Africa. UNIDO promotes industrial development for poverty reduction, inclusive globalization, and environmental sustainability. UNIDO\u0026rsquo;s headquarters are in Vienna, Austria. India is a founding member of UNIDO. 4. The Organisation for Economic Co operation and Development (OECD) : It is an intergovernmental organization that was founded in 1961. The OECD\u0026rsquo;s goal is to create policies that promote prosperity, equality, opportunity, and well-being for all. The OECD is based in Paris and has 38 member countries. The United States, France, and the United Kingdom were the first three founders of the OECD. India is not a member of OECD.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "432", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "45588", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\" ak-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statement: \u003cstrong\u003e(UPSC Prelims 2007)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The nation-wide scheme of the National Child Labour Projects (NCLP) is run by Union Ministry of Social Justice and Empowerment.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Gurupadswamy Committee dealt with the issue of child labour.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "sect const QUIZ_TITLE = "Economy PYQ  Test 5";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
