, "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAmong the following, which one is the least water-efficient crop? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) Sugarcane is the least water-efficient crop. It requires 1800\u0026ndash;2200 mm of water per season due to its high sensitivity to drought. Some crops that require less water include: 1. Cool-season legumes, such as peas, lentils, and fava beans 2. Crucifer crops, such as Brussels sprouts, cabbage, cauliflower, collards, kale, kohlrabi, mustard, broccoli, turnips, and watercress 3. Succulents, such as cacti4. Certain herbs, such as rosemary and thyme 5. Some grains, such as barley Pearl millet and sorghum are crops with high water use efficiency (WUE). WUE is the ratio of water used by plants for metabolism to water lost through transpiration.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47047", "image_check": "0", "image_link_1": "", "image_link_2": "", "im 3e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. In the tropical zone, the western sections of the oceans are warmer than the eastern sections owing to the influence of trade winds.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. In the temperate zone, westerlies make the eastern sections of oceans warmer than the western sections.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) What is Tropical Zone? The tropical zone is the area of the Earth\u0026rsquo;s surface between the Tropic of Cancer and the Tropic of Capricorn. It\u0026rsquo;s also known as the Torrid Zone. The tropical zone is a hot climate region that includes all areas where the sun is directly overhead at least once a year. The tropics are close to the equator and receive direct sunlight year-round, which makes them hot. Trade winds are winds that average 11 13 miles per hour, but can reach speeds of 30 miles per hour or more. The trade winds were named by the crews of sailing ships that depended on the winds during westward ocean crossings. In the Northern hemisphere of the tropical zone, the Northeast trade winds transport warmer water westward in the ocean. This causes a buildup of warm water in the western sections of the oceans. Thisphenomenon is often observed in the Pacific Ocean with the Western Pacific Warm Pool. What is Temperate Zone? The temperate zone is a region on Earth with a mild climate, located between the subtropical and polar regions. It\u0026rsquo;s located between 23.5 and 66.5 degrees latitude in both the Northern and Southern hemispheres. The temperate zone includes two zones: 1. The north temperate zone 2. The south temperate zone The north temperate zone is located between the Arctic Circle and the Tropic of Cancer. The south temperate zone is located between the Tropic of Capricorn and the Antarctic Circle. Westerlies are winds that blow from the west towards the east. They move warm surface water towards the coast on the eastern sections of oceans, making them warmer than the western sections. In the tropical zone, trade winds cause the western sections of the oceans to be warmer. This is because trade winds push the warm surface waters towards the west, causing a buildup of warm water.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47048", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative rap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the context of India\u0026rsquo;s preparation for Climate-smart Agriculture, consider the following statements :\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The \u0026lsquo;Climate-Smart Village\u0026rsquo; approach in India is a part of a project led by the Climate Change, Agriculture and Food Security (CCAFS), an international research programme.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The project of CCAFS is carried out under Consultative Group on International Agricultural Research (CGIAR) headquartered in France.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The International Crops Research Institute for the Semi-Arid Tropics (ICRISAT) in India is one of the CGIAR\u0026rsquo;s research centres.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) The CGIAR is a global partnership that unites organizations working on research for a food secure future. The CCAFS project aims to be long-term, participatory, and relevant to the local context. Climate-smart agriculture is an integrated approach to managing land to help adapt agricultural methods, livestock, and crops to the effects of climate change. It incorporates practices like boosting soil carbon absorption and reducing greenhouse gas emissions.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47049", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCauvery\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eManjira\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePennar\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTungabhadra\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGandikota canyon of South India was created by which one of the following rivers? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Gandikota Canyon, popularly called the \u0026ldquo;Grand Canyon of India,\u0026rdquo; lies on the right bank of the Pennar River near Gandikota village in Kadapa district, Andhra Pradesh. The Pennar River, flowing eastward through the semi-arid Rayalaseema region, has gradually cut deep through quartzite and granite rock formations of the Erramala Hills over millions of years. This intense fluvial erosion has created steep rocky walls, gorges, and valleys that resemble the American Grand Canyon. The Gandikota Fort, built during the Kakatiya period, overlooks the canyon, adding cultural and historical significance. Thus, the canyon owes its formation to the erosional action of the Pennar River through geological timescales. Cauvery River : It originates from Talakaveri in the Brahmagiri Hills (Karnataka) and flows southeast through Karnataka and Tamil Nadu, draining into the Bay of Bengal. It is known for creating beautiful waterfalls and gorges, such as Shivanasamudra Falls, Hogenakkal Falls, and the Mekedatu Gorge. However, these features are not comparable to the deep canyon-like structure of Gandikota. The Cauvery flows mostly through gneissic and metamorphic rocks in the Western and Eastern Ghats, not the hard quartzite terrain seen at Gandikota. Hence, while the Cauvery forms some erosional landforms, it is not responsible for creating the Gandikota Canyon. Manjira River : It is a tributary of the Godavari River and flows through Maharashtra, Karnataka, and Telangana. It originates in the Balaghat Range and joins the Godavari near Basara (Telangana). The Manjira basin is characterized by gentle slopes and alluvial plains, which are not suitable for canyon formation. The river supports irrigation projects such as the Singur Dam and the Manjira Barrage, and its terrain does not include hard rock escarpments necessary for canyon-type erosion. Therefore, the Manjira River has never formed a gorge or canyon like Gandikota, making this option incorrect. Tungabhadra River : It is formed by the confluence of the Tunga and Bhadra rivers in the Western Ghats of Karnataka. It flows eastward through Karnataka and Andhra Pradesh, eventually joining the Krishna River. The river valley is famous for Hampi, the site of the Vijayanagara Empire ruins, where it flows through a rugged landscape with rocky boulders. Although the Tungabhadra has sculpted some small gorges and valleys, these are not true canyons, and none resemble the deep, extensive Gandikota gorge formed by the Pennar River. The rocks around Tungabhadra are mainly granite boulders, which create striking scenery but not canyon-type formations.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47050", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\ es 180 kilometers from the headwaters of the Siyom River to the canyon of the Yarlung Tsangpo. The Chinese government has established a natural sanctuary around Namcha Barwa called the Medog Nature Reserve. The reserve protects about a quarter of the 170 species protected by the Chinese government, including the red panda, snow leopard, deer, monkeys, and rare birds. Nanda Devi is part of the Garhwal Himalayas and the Kumaon Himalayas.The peak is located in the Chamoli district of Uttarakhand, India. Nanda Devi is the second-highest peak in India and the 23rd highest in the world. The peak is 7,816 meters tall and is surrounded by the Nanda Devi Sanctuary and National Park. The park was designated a UNESCO World Heritage Site in 1988. Nokrek is the highest peak in the West Garo Hills of Meghalaya, India. It is not located in the Sikkim Himalaya. Nokrek National Park is located in the West Garo Hills district of Meghalaya, India. The park is mountainous, with Nokrek being the highest peak at 1,412 meters. The park has a tropical climate with high humidity, monsoon rains, and high temperatures. The climate creates ideal conditions for the growth of rich vegetation, which has led to a unique and varied biodiversity. The Nokrek Range is the source of all important rivers and streams of the Garo Hills region. The river Simsang, known as Someshwari when it emerges into Bangladesh at Baghmara, is the most prominent.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47051", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to India, consider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2022)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Monazite is a source of rare earths.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Monazite contains thorium.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Monazite occurs naturally in the entire Indian coastal sands in India.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. In India, Government bodies only can process or export monazite.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) Monazite is a reddish-brown phosphate mineral that contains rare-earth elements. It is a complex phosphate of thorium and rare earth minerals. Monazite is radioactive in nature and is found in India, Madagascar, and South Africa. Monazite is a principal economic source of rare earths, along with bastnasite, loparite, and lateritic ion-adsorption clays. Rare earths are a group of 17 elements, including scandium, yttrium, and the lanthanides. Monazite is also a source of helium, which can be extracted by heating. Helium is the only noble gas that can be obtained from monazite ore. Monazite does not occur naturally in the entire Indian coastal sands. Monazite is a rare earth mineral that is found in the coastal regions of several Indian states, including Tamil Nadu, Kerala, Andhra Pradesh, Odisha, and West Bengal. However, it is not present in the entire Indian coastal sands. Monazite is an atomic mineral that occurs naturally in the coastal sands of three districts: Tirunelveli, Thoothukudi, and Kanyakumari. Tamil Nadu is the primary producer of monazite in India, with deposits located along the coastal stretchbetween Kanyakumari and Puducherry. Monazite is a mineral mainly containing rare earths and thorium. It is a prescribed substance under the Atomic Energy (Radiation Protection) Rules 2004. The Department of Atomic Energy (DAE) handles monazite soil. Indian Rare Earths Limited (IREL) is the only organization that has been permitted to export monazite. IREL is a Public Sector Undertaking under the Department of Atomic Energy (DAE). The DAE has not given a license to any private entity for monazite production. IREL is also the only entity processing monazite to produce Rare Earth (RE) compounds. Monazite contains rare earths in addition to thorium. A license from the DAE is necessary for exporting monazite. The DAE handles monazite soil.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47053", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !importa necting lake that provides an important means of transport for people and goods. The lake and its surrounding marshes are home to important natural wildlife. T he Krishna River does not directly feed Kolleru Lake. Kolleru Lake is located in northeastern Andhra Pradesh, between the Godavari and Krishna river deltas. The lake is fed by the seasonal Budameru and Tammileru streams. It is also connected to the Krishna and Godavari irrigation systems. Kolleru Lake is a freshwater lake that acts as a natural flood-balancing reservoir for the Godavari and Krishna rivers.T he Gandak River\u0026rsquo;s lateral erosion over time caused it to form bends and curves. As the river meandered, it created a loop-like shape that eventually disconnected from its main channel. This cut off became Kanwar Lake. Kanwar Lake is a shallow lake with a maximum depth of about 3 meters. It covers an area of approximately 67 square kilometers and is fed by the Gandak River and rainwater. Kanwar Lake is also known as Kanwar Jheel or Kabad Taal. It is located in the Begusarai district of Bihar and is the largest oxbow lake in India. Oxbow lakes form in flat, low plains where a river drains into another body of water.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47057", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !i cosystem in India. The Bhitarkanika Mangroves is a network of canals and creeks that are flooded by water from the Brahmani, Baitarani, Dhamra, and Patasala rivers. It is one of the most important Ramsar wetlands in India and was declared a Ramsar Site in 2002. The Bhitarkanika Mangroves is a wildlife sanctuary that is home to many species of wildlife, including: 1. Saltwater crocodiles, some of which can grow to 23 feet long 2. Asian water monitors 3. Numerous snakes 4. 215 bird species, including eight types of kingfishers The Marakkanam salt pans are located in the Villupuram district of Tamil Nadu, India. The salt pans cover 4,000 acres, making them one of the largest salt producers in Tamil Nadu. They\u0026rsquo;re a vital source of livelihood for the local community, employing around 1,000 workers each day during peak season. The salt pans produce salt using marine and estuarine water, or groundwater. The salt is used in a variety of industries, including food processing, chemical manufacturing, and textiles. Naupada Swamp, also known as Naupada Wetland, is a freshwater swamp in the Srikakulam district of Andhra Pradesh, India. It\u0026rsquo;s a large wetland complex with an average elevation of 5 meters (19 ft). The swamp is formed by freshwater from rivers and seasonal rainwater, and isn\u0026rsquo;t primarily affected by repeated falls in sea level.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47061", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u0 on_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider tbe following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2023)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Amarkantak Hills are at the confluence of Vindhya and Sahyadri Ranges.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Biligirirangan Hills constitute the easternmost part of Satpura Range.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Seshachalam Hills constitute the southernmost part of Western Ghats.\u003c/p\u003e\r\n\r\n\u003cp\u003eHow many of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) Amarkantak Hills are not at the confluence of the Vindhya and Sahyadri Ranges. Instead, they are located in the Maikal Range of the Satpura Range. The Amarkantak Hills are a natural heritage area and the meeting point of the Vindhya and the Satpura Ranges. The Maikal Hills are the fulcrum of this meeting point. The Amarkantak Hills are the source of the following rivers: Narmada, Mahanadi, Tapti, Son. The town of Amarkantak is located in the Anuppur district of Madhya Pradesh, at an altitude of 1065 meters. It is situated on the Maikal mountain range, which connectsthe Vindhyachal and Satpura mountain ranges. T he Biligirirangan Hills are not the easternmost part of the Satpura Range. T he Biligirirangan Hills are part of the Eastern Ghats mountain range, located in the Chamarajanagar district of Karnataka, India. The Satpura Range runs from eastern Gujarat through Maharashtra and Madhya Pradesh and into Chhattisgarh. T he Biligirirangan Hills, also known as BR Hills, are located in the border region between Karnataka and Tamil Nadu. The sanctuary is unique biogeographically, with the ridges of the hills running north\u0026ndash;south. T he Seshachalam Hills are not the southernmost part of the Western Ghats. T he Seshachalam Hills are part of the Eastern Ghats, located in the Chittoor district of Andhra Pradesh, India. The Western Ghats run through the states of Kerala, Tamil Nadu, Karnataka, Goa, Maharashtra, and Gujarat. T he Seshachalam Hills are a mountain peak made up of seven summits. The ranges were formed during the Precambrian era, which was 3.8 billion to 540 million years ago. The Seshachalam Hills include a national park, a well-known Hindu temple, and a famous rock arch formation.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47065", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\  following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2023)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. East-West Corridor under Golden Quadrilateral Project connects Dibrugarh and Surat.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Trilateral Highway connects Moreh in Manipur and Chiang Mai in Thailand via Myanmar.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Bangladesh-China-India-Myanmar Economic Corridor connects Varanasi in Uttar Pradesh with Kunming in China.\u003c/p\u003e\r\n\r\n\u003cp\u003eHow many of the above statements are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) T he East-West Corridor under the Golden Quadrilateral Project does not connect Dibrugarh and Surat. The corridor connects Silchar in Assam to Porbandar in Gujarat. T he East-West Corridor is part of the Golden Quadrilateral Project, a major highway development project in India. T he project aims to connect the four major metropolitan cities of Delhi, Mumbai, Chennai, and Kolkata. The corridor is also called Mahasadak. T he India-Myanmar-Thailand Trilateral Highway (IMT Highway) is an international highway that will connect Moreh, Manipur in India to Mae Sot in Thailand via Myanmar. The highway is also known as the Asian trilateral highway. T he highway is over 1,400 kilometers long and aims to improve connectivity and economic cooperation between the three countries. T he Bangladesh- China-India-Myanmar Economic Corridor (BCIM) connects Varanasi in Uttar Pradesh with Kunming in China.T he BCIM is a 2,800 km corridor that would link Kunming in China\u0026rsquo;s Yunnan province with Kolkata. The corridor would pass through Mandalay in Myanmar and Dhak  "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) The Correct answer is (d) Temperature Contrast: The temperature contrast between continents and oceans is greater during winter than in summer. During winter, the land cools down faster and to a larger extent compared to oceans, leading to a significant temperature difference. In summer, while land heats up quickly, the difference in temperature between land and sea is less extreme compared to winter. Hence, Statement-I is incorrect. Specific Heat of Water: The specific heat of water is higher than that of land. This means it takes more heat energy to raise the temperature of water compared to land. Due to this property, water heats up and cools down more slowly than land, affecting temperature variations between oceans and continents. Hence, Statement-II is correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47071", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": " ss\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2023)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. In a seismograph, P waves are recorded earlier than S waves.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. In P waves, the individual particles vibrate to and fro in the direction of wave propagation whereas in S waves, the particles vibrate up and down at right angles to the direction of wave propagation.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C) A seismograph is a device that records the motion of the ground during an earthquake. It consists of a ground-motion detection sensor, called a seismometer, and a recording system. The seismometer is the internal part of the seismograph and may be a pendulum or a mass mounted on a spring. It operates on the principle of inertia. P waves are primary waves, and S waves are secondary waves. P waves are the fastest seismic waves, so they are usually the first to be recorded by a seismograph. P waves can travel through solids, liquids, and gases. S waves are transverse waves, where particle motion occurs perpendicular to the direction of wave propagation. In rock, S waves generally travel about 60% the speed of P waves. S waves, or secondary waves, can only travel through solids. P-waves vibrate parallel to the direction of the wave. This exerts pressure on the material in the direction of the propagation. As a result, it creates density differences in the material leading to stretching and squeezing of the material. The direction of vibrations of S-waves is perpendicular to the wave direction in the vertical plane. Hence, they create troughs and crests in the material through which they pass. Surface waves are considered to be the most damaging waves.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47072", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly one\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly two\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !imp ": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following is/are correct inference/inferences from isothermal maps in the month of January? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2024)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;1. The isotherms deviate to the north over the ocean and to the south over the continent.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The presence of cold ocean currents, Gulf Stream and North Atlantic Drift make the North Atlantic Ocean colder and the isotherms bend towards the north.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the answer using the code given below :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation: (A)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eIn January, isothermal maps show temperature distribution patterns across the globe, and these lines (isotherms) help reveal climatic influences of land and ocean. Isotherms tend to deviate northward over oceans and southward over continents during winter in the Northern Hemisphere. This happens because the sea has a moderating effect\u0026mdash;it retains heat longer than land, so coastal and oceanic areas remain warmer, whereas continental interiors cool down faster. Hence, the isotherms bend northward over the oceans and southward over landmasses. Thus, statement 1 is correct. The Gulf Stream and the North Atlantic Drift are warm ocean currents, not cold ones. They raise the temperature of the North Atlantic Ocean and the adjacent coastal regions of Western Europe, causing the isotherms to bend northward in that region. The statement incorrectly refers to these currents as cold, which is factually wrong. Therefore, the bending of isotherms northward is due to warm currents, not cold ones. Thus, statement 2 is incorrect. Therefore, the correct answer is (a) 1 only.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47084", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/s r\n\u003cp\u003eWhich of the following countries are well known as the two largest cocoa producers in the world? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2024)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation: (C) Use of cocoa : \u0026bull; Dried and fermented seeds- chocolate Making \u0026bull; Beans fat \u0026ndash; cocoa butter which is Used as moisturizer to the skin and hair and as a food for cooking. \u0026bull; Cote d\u0026rsquo;Ivoire and Ghana are the two largest cocoa-growing countries, accounting for nearly 60% of global cocoa production, and next is Ecuador . West Africa hosts the world\u0026rsquo;s leading cocoa-producing countries. In Asia, Indonesia is the largest producer. Therefore, option (c) is the correct answer\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47085", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGhaghara - Gomati - Gandak - Kosi\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGomati - Ghaghara - Gandak - Kosi\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGhaghara - Gomati - Kosi - Gandak\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGomati - Ghaghara - Kosi - Gandak\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the Himalayan rivers joining the Ganga downstream of Prayagraj from West to East, which one of the following sequences is correct ? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2024)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation (B) \u0026bull; Ganga basin is the largest river basin in India in terms of catchment area, constituting 26% of the country\u0026rsquo;s land mass and supporting about 43% of its population. River Ganga, originates at Gangotri Glacier at Gaumukh having lenght 2525 kms before flowing into Bay of Bengal \u0026bull; The Ganga river system is the largest in India having a number of perennial and non-perennial rivers originating in the Himalayas in the north and the Peninsula in the south, respectively. \u0026bull; The important left bank tributaries are the Ramganga, the Gomati, the Ghaghara, the Gandak, the Kosi and the Mahananda. \u0026bull; The river finally discharges into the Bay of Bengal. \u0026bull; Gomati is a tributary of Ganga river and an alluvial river of the Ganga Plain. \u0026bull; It originates near Mainkot, from Gomat Taala lake. \u0026bull; The Ghaghara originates near Mapchachungo Glacier, having tributaries Tila, Seti, and Beri. \u0026bull; The Gandak consists of the Kaligandak and Trishulganga streams. It originates in the Nepal Himalayas between Dhaulagiri and Mount Everest, enters in Bihar\u0026rsquo;s Champaran district, and joins the Ganga at Sonpur near Patna. \u0026bull; The Kosi, an antecedent river, originates north of Mount Everest in Tibet with its main stream Arun, then in Nepal it is joined by the Son Kosi from the west and the Tamur Kosi from the east, forming the Sapt Kosi after merging with the Arun. \u0026bull; It is called as sorrow of Bihar because of its flood proneness and heavy devastation in Bihar state. \u0026bull; The correct order from West to East is: Gomati, Ghaghara, Gandak, Kosi. \u0026bull; Trick - HI RAM (RAMGANGA) GOMATI KA GHAGRA GANDA (GANDAK) KAISE (KOSI) HUA\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47086", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth Statement-II and Statement-III are correct and both of them explain Statement-I\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth Statement-II and Statement III are correct, but only one of them explains Statement-I\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly one of the Statements II and III is correct and that explains Statement-I\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;}  rocks and minerals on the surface of Earth. Water, ice, acids, salts, plants, animals, and changes in temperature are all agents of weathering.Weathering of Rocks is affected Mainly By Rainfall and temperature. Hence statement I is correct. \u0026bull; Weathering can be biological, chemical or physical. High temperatures and greater rainfall increase the rate of chemical weathering \u0026bull; Rocks in tropical regions are exposed to abundant rainfall and hot temperatures, they weather much faster than rocks in cold, dry regions. \u0026bull; Carbon dioxide in the air is mixed with rainwater, making it slightly acidic. Normal rain has a pH of about 5.6, it is slightly acidic because carbon dioxide (CO2 ) dissolves into it forming weak carbonic acid. Hence, statement II is correct. \u0026bull; In this process reaction occurs when the rainwater comes into contact with minerals in the rock, causing weathering. \u0026bull; Gases which dissolve in rainwater before it reaches the ground: Oxygen, Nitrogen, Carbon dioxide. \u0026bull; Rain water can dissolve more amount of oxygen than ordinary water due to condensation of water droplets in the atmosphere having no dissolved salts like ordinary water. Also rainwater is in contact with atmospheric air. Hence, it contains more percentage of oxygen. Therefore, option (a) is the correct answer.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47087", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-w or. Hence, statement 2 is correct. Hence, option (c) is correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47093", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 and 4\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 4\u003c/ , the more light one receives during the summer solstice. At the Arctic Circle, the sun never sets during the solstice. \u0026bull; As a large portion of the Northern Hemisphere is getting light from the sun, it is summer in the regions north of the equator. The longest day and the shortest night at these places occur on 21st June. \u0026bull; At this time in the Southern Hemisphere all these conditions are reversed. It is winter there. The nights are longer than the days. This position of the earth is called the Summer Solstice. Hence, option (d) is correct.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47094", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly one\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOnly two\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e const QUIZ_TITLE = "Indian \u0026 World Geography PYQ Test 2";

let current = 0;
let answers = {};            // { questionId: "1", ... }
let seconds = 0;
let isQuiz = false;
let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */
function init(){
  el("qtotal").textContent = QUESTIONS.length;
  renderQuestion(0);
  startTimer();
  attachListeners();
  buildPalette();
  highlightPalette();
}

/* render question */
function renderQuestion(i){
  current = i;
  const q = QUESTIONS[i];
  el("qindex").textContent = i+1;
  el("qtext").innerHTML = q.question || "";
  el("marking").innerHTML = `Marking: <span style="color:var(--success)">+${Number(q.correct_score ?? 1)}</span> / <span style="color:var(--danger)">-${Number(q.negative_score ?? 0)}</span>`;
  const opts = el("options");
  opts.innerHTML = "";
  el("explanation").style.display = "none";

  const keys = ["option_1","option_2","option_3","option_4","option_5"];
  keys.forEach((k, idx) => {
    if(!q[k]) return;
    const div = document.createElement("div");
    div.className = "opt";
    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
