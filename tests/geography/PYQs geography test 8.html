ts : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. At present, the retail price of chemical fertilizers is market-driven and not administered by the Government.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Ammonia, which is an input of urea, is produced from natural gas.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Sulphur, which is a raw material for phosphoric acid fertilizer, is a by product of oil refineries.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The Union Government subsidies the urea manufacturing units. For the cost of transportation to facilitate the availability of urea at the same maximum retail price all over the country. Also, the Government is subsidizing fertilizers for their availability at reasonable prices for agricultural purposes. Under the NBS Policy, the Government announces a fixed rate of subsidy (in Rs. per Kg basis), on each nutrient of subsidized fertilizers, namely Nitrogen (N), Phosphate (P), Potash (K) and Sulphur (S), on annual basis. Synthetic ammonia (NH3) refers to ammonia that has been synthesized (Standard Industrial Classification 2873) from natural gas. Natural gas molecules are reduced to carbon and hydrogen. The hydrogen is then purified and reacted with nitrogen to produce ammonia. Approximately 75 percent of the ammonia produced is used as fertilizer, either directly as ammonia or indirectly after synthesis as urea, ammonium nitrate, and mono ammonium or diammonium phosphates.Sulphur is a by-product of processing natural gas and refining high-sulphur crude oils. And Sulphur is a raw material for phosphoric acid fertilizer.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47030", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEast of Aksai Chin\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEast of Leh\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNorth of Gilgit\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNorth of Nubra Valley\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSiachen Glacier is situated to the.............\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (D) The Siachen Glacier is located north of the Nubra Valley. It\u0026rsquo;s also located to the west of Aksai Chin and almost east of Gilgit. The Siachen Glacier is the longest glacier in the Karakoram and the second-longest in the world\u0026rsquo;s non-polar areas. It\u0026rsquo;s located in Ladakh, part of the eastern Karakoram range, in the Himalayan Mountains. The glacier is strategically located near the border between India and Pakistan in Kashmir\u0026rsquo;s Karakoram Range. Aksai Chin : It is a 38,000 square kilometer arid region that is divided between India and China. It is a part of the Kashmir region and is located in the northernmost part of the Indian subcontinent. India claims Aksai Chin as part of the Ladakh union territory, but China administers the region. Aksai Chin is a salt land at a high altitude and is also known as a soda plain. It is a barren landscape with little to no rainfall. Aksai Chin is a ceasefire line that separates the Indian-controlled state of J\u0026amp;K from the Chinese-controlled area. This line is known as the Line of Actual Control (LAC). Leh : It is a city and district in the Indian Union territory of Ladakh. It is the largest city in Ladakh and the joint capital of the region. Leh is located in the valley of the upper Indus River at an elevation of 11,550 feet (3,520 meters). It was the historical capital of the Kingdom of Ladakh.Leh district is located in the disputed Kashmir region. It has an area of 45,110 square kilometers, making it the second largest district in India. Gilgit : It is a city in the Pakistani-administered region of Gilgit-Baltistan. The city is located in a valley where the Gilgit and Hunza rivers meet. Gilgit is the capital of the Gilgit-Baltistan region. Gilgit-Baltistan is a region that includes the northern part of Kashmir. The region has been disputed between India and Pakistan since 1947, and between India and China since 1959. T he name Gilgit may come from the Shina word ghail gheit, which means \u0026ldquo;white rock\u0026rdquo;. Another theory is that the name comes from the Tibetan word ge-lag, which means \u0026ldquo;happy land\u0026rdquo;. Nubra Valley : It is a high-altitude desert region in the northern part of India. It\u0026rsquo;s located at an elevation of around 10,000 feet above sea level. It\u0026rsquo;s also known as \u0026lsquo;Ldumra\u0026rsquo; which means \u0026ldquo;the valley of flowers\u0026rdquo;. T he valley is characterized by its rugged landscape, towering mountains, sand dunes, and clear blue skies. It separates the Ladakh and Karakoram ranges, and is located just to the north of Khardung La, the highest motorable pass in the world.Nubra Valley is known for its orchards, scenic vistas, Bactrian camels, and monasteries. It\u0026rsquo;s also home to a diverse range of vegetation, including seabuckthorn, wild rose, and medicinal herbs.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47031", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Jet streams occur in the Northern Hemisphere only.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp; Only some cyclones develop an eye.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The temperature inside the eye of a cyclone is nearly 10\u0026deg;C lesser than that of the surroundings.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C) Jet streams are narrow bands of strong wind that circle the globe, blowing from west to east. They are located in the upper levels of the atmosphere, typically at an elevation of 30,000 feet (9,100 meters). Jet streams impact weather and air travel, and are found in the atmospheres of Earth, Venus, Jupiter, Saturn, Uranus, and Neptune. T he polar jets are the strongest jet streams, located 9-12 km above sea level and at higher latitudes. The Northern Hemisphere and the Southern Hemisphere each have a polar jet and a subtropical jet. A cyclone is a powerful storm with strong winds and rains. It is caused by atmospheric disturbances around a low-pressure area. Cyclones form when:Warm, moist air rises: This creates space for cool air in low-pressure areas. T he Earth rotates: This creates forces that cause the winds to swirl around the low pressure. Only some cyclones develop an eye. The eye is a calm area at the center of a tropical cyclone. It\u0026rsquo;s usually circular, with a diameter of 30\u0026ndash;65 kilometers. The eye is surrounded by the eyewall, a ring of thunderstorms where the storm\u0026rsquo;s worst weather and highest winds occur. T he eye has the lowest barometric pressure in the storm, sometimes 15% lower than the pressure outside the storm. T he eye usually develops when sustained wind speeds exceed 119 kilometers per hour. The cause of eye formation is not fully understood, but it may be related to centrifugal force and the conservation of angular momentum. T he temperature inside the eye of a cyclone is higher than its surrounding areas.The eye of a cyclone is the area with the lowest surface pressure and warmest temperatures aloft. At an altitude of 12 km, the eye temperature can be 10\u0026deg;C or more warmer than the surrounding environment. However, at the surface, it is only 0-2\u0026deg;C warmer. The eye of a cyclone is slightly cooler than the air around it due to adiabatic expansion of the air parcels as they transition to a lower pressure near the center.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47032", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is/are the advantage/advantages of zero tillage in agriculture? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Sowing of wheat is possible without burning the residue of previous crop.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Without the need for nursery of rice saplings, direct planting of paddy seeds in the wet soil is possible.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Carbon sequestration in the soil is possible.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) Zero tillage, also known as no-till, is a farming practice that involves sowing seeds directly into soil without disturbing the soil. It\u0026rsquo;s a minimum tillage practice that involves little or no soil disturbance, with the only disturbance being during planting. Zero tillage can be used for small, medium, and large farmers, using hand planting methods, animal traction, or mechanized planting/sowing. Zero tillage can have many advantages in agriculture, including: 1. Reduced soil erosion: Zero tillage re duces soil erosion from wind and wa ter because previous crops cover the soil. 2. Improved soil health: Zero tillage promotes the accumulation of organ ic matter and dry matter in the soil, which improves soil health and fertil ity. 3. Improved soil structure: Zero tillage allows the soil structure to be pre served. 4. Improved soil water infiltration ca pacity: Zero tillage can help to con serve moisture in the soil. 5. Reduced soil compaction: Zero till age reduces soil compaction, which allows for better air and water move ment through the soil. 6. Increased crop yields: Zero tillage systems can increase crop yields by improving soil fertility and increasing water retention in the soil. 7. Reduced greenhouse gas emissions: Sustainably-focused agriculture de creases greenhouse gas emissions by reducing tillage and using renewable energy sources. 8. Reduced water loss: Zero tillage re duces water loss due to evapouration as the residues from the previous crop are left on the surface. 9. Other benefits: Zero tillage can also save water, promote dry seeding of crops, and increase plantation effi ciency. When wheat seeds are sown in soil using happy seeder, the rice stalks act as mulch. It not only prevents harmful gases that are released when stubbles are burnt but also provides enhanced nutrients and improves moisture holding capacity of the soil. The same is also true for rice when it is directly sown without transplantation. As the soil is not tilled the remains of previous crop hold carbon and prevent it from entering atmosphere as carbon di oxide.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47033", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to pulse production in India, consider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026nbsp;1. Black gram can be cultivated as both kharif and rabi crop.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Green-gram alone accounts for nearly half of pulse production.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. In the last three decades, while the production of kharif has increased, the production of rabi pulses has decreased.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (A) Kharif crops are agricultural crops that are planted in the monsoon season and harvested in the fall. They are also known as monsoon crops or autumn crops. Kharif crops are well-suited to regions with heavy rainfall and warm climates. They are typically planted in June or July and harvested in September or October.\u003c/p\u003e\r\n\r\n\u003cp\u003eRabi crops are agricultural crops that are grown in winter and harvested in the spring. They are also known as winter crops. Rabi crops are grown in dry areas and require frequent irrigation. They are mostly grown in the north and northwestern parts of India, such as Punjab, Haryana, Himachal Pradesh, Jammu and Kashmir, Uttarakhand, and Uttar Pradesh.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eBlack gram, also known as urad, is a pulse crop that can be cultivated in both Kharif and Rabi seasons depending on climatic conditions and soil type. It is generally sown as a Kharif crop in northern India during monsoon but also cultivated as a Rabi crop in southern regions due to favorable temperature and irrigation. Thus, statement 1 is correct.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eGreen gram, also known as moong, is an important Kharif pulse crop in India but it does not account for nearly half of the total pulse production. India\u0026rsquo;s total pulse production includes major pulses like chickpea (gram), pigeon pea (tur/arhar), lentil, urad, and moong, among which gram (chickpea) alone contributes around 40\u0026ndash;45% of total pulse output, not green gram. Thus, statement 2 is incorrect.\u003c/p\u003e\r\n\r\n\u003cp\u003eIn the last three decades, the production of Kharif pulses such as tur and urad has increased moderately, but the production of Rabi pulses like gram (chickpea) has also increased substantially due to expansion of irrigation and better varieties. Hence, the statement that Rabi pulse production has decreased is incorrect. Thus, statement 3 is incorrect. Therefore, only statement 1 is correct.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47034", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCotton\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eJute\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSugarcane\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTea\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026ldquo;The crop is subtropical in nature, A hard frost in injurious to it. It requires at least 210 frost-free days and 50 to 100 centimetres of rainfall for its growth. A light well-drained soil capable of retaining moisture is ideally suited for the cultivation of the crop.\u0026rdquo; Which one of the following is that crop? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (A)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe crop described is subtropical in nature and cannot withstand hard frost, which makes it suitable for warm climates with moderate rainfall. Cotton requires a long frost-free period of at least 210 days and 50\u0026ndash;100 cm of annual rainfall, conditions typically found in subtropical and tropical regions such as Maharashtra, Gujarat, Madhya Pradesh, and Telangana. The crop thrives in light, well-drained soils that can retain moisture, such as black cotton soil (Regur soil), which provides ideal aeration and water-holding capacity for its growth. Thus, this description perfectly matches cotton. Jute, on the other hand, requires high temperature and heavy rainfall exceeding 150 cm, which is characteristic of humid tropical regions like West Bengal and Assam, so it does not fit the given conditions. Sugarcane requires a hot and humid climate with rainfall between 100\u0026ndash;150 cm and is grown in both tropical and subtropical regions but needs more water than mentioned here. Tea requires a cool, humid climate with rainfall above 150 cm and acidic soils, found in hilly regions such as Assam and Darjeeling, which again does not match the question\u0026rsquo;s parameters. Hence, the crop that fits all the given conditions \u0026mdash; subtropical climate, 210 frost-free days, 50\u0026ndash;100 cm rainfall, and light, well-drained moisture-retaining soil is Cotton.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47035", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026nbsp;1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026nbsp;3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 4 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3 and 4 only\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the current trends in the cultivation of sugarcane in India, consider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A substantial saving in seed material is made when \u0026lsquo;bud chip settlings\u0026rsquo; are raised in a nurse, and transplanted in the main field.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. When direct planting of setts is done, the germination percentage is better with single-budded setts as compared to setts with many buds.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. If bad weather conditions prevail when setts are directly planted, single budded setts have better survival as compared to large setts.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Sugarcane can be cultivated using settlings prepared from tissue culture.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) Sugarcane is normally propagated by stalk cuttings consisting of 2 to 3 bud sett. In conventional system, about 6\u0026ndash;8 tons seed cane /ha is used as planting material.Establishing the sugarcane crop using bud chips in place of setts could save about 80% by weight of the stalk material, however this technology has not been scaled up at commercial levels due to poor survival of bud chips under field conditions. The researchers found that the setts having two buds are giving germination about 65 to 70 % with better yield. Large setts have better survival under bad weather but single budded setts also gives 70% germination if protected with chemical treatment. Planting is the most important and labour intensive operation in sugarcane cultivation. Sugarcane germination as well as yield is affected by planting material, layout, plant population, method of planting and placement of bud etc. Planting material for vegetative propagation such as whole cane, setts having of single bud to six buds, settling prepared from tissue culture or single buds in nursery are being used.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47036", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7"  for nitrogen fertilizers. 3. Tensiometer use : A device used to measure soil moisture. Using a tensiometer can help farmers to water their crops more efficiently, reducing water waste and conserving resources. 4. Vertical farming : Vertical farming is the practice of growing crops in vertically stacked layers. Sometimes such practices occur environmental damage therefore this practice is not considered eco-friendly. Vertical Farming which aims to optimize plant growth, and soil less farming techniques such as hydroponics, aquaponics, and aeroponics. In vertical farming, crops are grown indoors, under artificial conditions of light and temperature. Japan has been one of the early pioneers in vertical farming. It holds the largest share in the global vertical farming market.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47037", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: n\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eWhich of the pairs given above is/are correctly matched?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C)The Mekong River : It flows into the South China Sea through the Mekong Delta in Vietnam. The river originates in the Tibetan Plateau in China and flows through six countries: 1. China 2. Myanmar 3. Thailand 4. Laos 5. Cambodia 6. Vietnam The river drains over 313,000 square miles (810,000 square km) of land. The Mekong River is a major part of Southeast Asia and is home to some of the world\u0026rsquo;s largest freshwater fish and stingrays. The River Thames : It flows into the\u0026nbsp;North Sea.\u0026nbsp;The river\u0026rsquo;s 215-mile journey begins at Kemble in Gloucestershire and ends at the Thames Estuary in Southend-on-Sea.\u0026nbsp;The North Sea is part of the Atlantic Ocean and forms a natural boundary between Great Britain and mainland Europe.\u0026nbsp; The Thames is England\u0026rsquo;s longest river and the second longest in the UK.\u0026nbsp;It begins as a small trickle in the Cotswolds and flows through some of England\u0026rsquo;s most picturesque towns, including London.\u0026nbsp; The Volga River : It originates in the Valdai Hills, northwest of Moscow, and flows 2,193 miles (3,530 kilometers) south to the Caspian Sea.\u0026nbsp; The Volga is the longest river in Europe and runs through Russia, from Central Russia to Southern Russia. The Volga\u0026rsquo;s delta flows into the Caspian Sea, which is the world\u0026rsquo;s largest inland body of water. The Zambezi River : It flows into the Indian Ocean through a delta in Mozambique. The Zambezi is the fourth largest river in Africa and the longest east-flowing river in the continent. It originates in the wetlands of the Mwinilunga District of north-western Zambia, near the border where Zambia, Angola, and the Congo meet. The Zambezi flows through six countries, including Zambia, Congo, Angola, Namibia, Botswana, Zimbabwe, and Mozambique.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47038", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 and 5\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3 and 4\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3 and 5\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe vegetation of savannah consists of grassland with scattered small trees, but extensive areas have no trees. The forest development in such areas is generally kept in check by one or more or a combination of some conditions. Which of the following are such conditions? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Burrowing animals and termites\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Fire\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Grazing herbivores\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Seasonal rainfall\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Soil properties\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (C)\u0026nbsp;The Savannah vegetation is characterized by grasslands with scattered trees and shrubs, commonly found in tropical regions like Africa, South America, and Australia. These regions experience distinct wet and dry seasons, which play a crucial role in controlling the density and height of vegetation. Fire is a major factor that prevents the dense growth of trees in the savannahs. During the dry season, frequent natural and man-made fires destroy young tree saplings while grasses regenerate quickly after rains. Thus, fire acts as a natural check on forest expansion. Thus, statement 2 is correct. Grazing herbivores such as antelopes, zebras, and elephants also play a key role in maintaining the grassland ecosystem. They feed on young shrubs and saplings, preventing them from growing into large trees and allowing grasses to dominate the landscape. Thus, statement 3 is correct. Seasonal rainfall in savannahs is another controlling factor. The region receives moderate rainfall (around 500\u0026ndash;1000 mm annually), concentrated in a few months, followed by a long dry season. This uneven distribution of rainfall supports grasses but not dense forests, as trees require year-round moisture. Thus, statement 4 is correct. On the other hand, burrowing animals and termites (statement 1) mainly affect soil aeration but are not significant in restricting forest growth. Soil properties (statement 5) do influence vegetation types, but they are not the primary reason for the limited tree cover compared to the impact of fire, grazing, and rainfall patterns. Hence, the factors responsible for keeping forest development in check in savannahs are fire, grazing herbivores, and seasonal rainfall (2, 3, and 4).\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47039", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBrown forest soil\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eFissure volcanic rock\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGranite and schist\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eShale and limestone\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe black cotton soil of India has been formed due to the weathering of........... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (B)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe black cotton soil, also called Regur soil, has developed from the weathering of fissure volcanic rocks, mainly basalt, which is an igneous rock formed due to volcanic eruptions through fissures rather than from a single volcanic cone. These eruptions created the Deccan Traps in central and western India (about 66 million years ago). Over time, the basaltic lava underwent weathering due to temperature changes and moisture, forming fine-grained soil rich in clay minerals like montmorillonite. This soil has a high moisture-retaining capacity, swells when wet, and cracks when dry \u0026mdash; characteristics ideal for growing cotton, hence the name \u0026ldquo;black cotton soil.\u0026rdquo; Thus, black cotton soil is formed from fissure volcanic rocks. Brown forest soil : Brown forest soil (also known as Alfisols or Brown Earths) typically forms in temperate climatic regions under deciduous or mixed forests, where moderate rainfall and organic matter from leaf litter enrich the soil. These soils are rich in humus, have a brownish color, and are found mostly in Europe, the USA, and parts of China. In India, such soils are rare, occurring only in temperate forest areas of the Himalayas (like Himachal Pradesh and Uttarakhand). Hence, brown forest soil has no relation to black cotton soil, as it develops from non-volcanic parent rocks in cooler and wetter conditions. Granite and schist : Granite is an igneous rock, while schist is a metamorphic rock. The weathering of granite typically produces sandy and coarse-textured soils, since granite contains minerals like quartz and feldspar that decompose slowly. Such soils are well-drained but low in fertility, commonly found in the southern peninsular regions (like Tamil Nadu and Karnataka). Schist, being a metamorphic rock, forms shallow, less fertile soils due to its flaky structure. So, neither granite nor schist produces the deep, clayey, black soils like those of the Deccan Plateau. Hence, this option is incorrect. Shale and limestone : Shale (a sedimentary rock) and limestone (composed mainly of calcium carbonate) generally form fertile but light-colored soils upon weathering. Shale-derived soils are often fine-textured and compact, while limestone-derived soils are alkaline and rich in calcium, forming red or loamy soils rather than black ones. These are found in parts of Madhya Pradesh, Bihar, and Andhra Pradesh, but not in the Deccan volcanic region where black cotton soils occur. Therefore, black cotton soil is not formed from shale or limestone either.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47040", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 4\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 Only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eHow is permaculture farming different from conventional chemical farming? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Permaculture Farming discourages monocultural practices but in conventional chemical farming, monoculture practices are pre dominant.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Conventional chemical farming can cause increase in soil salinity but the occurrence\u0026nbsp;of such phenomenon\u0026nbsp;is\u0026nbsp;not observed in permaculture farming.\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Conventional chemical farming is easily possible in semi-arid regions but permaculture farming is not so easily possible in such regions.\u003c/p\u003e\r\n\r\n\u003cp\u003e4.\u0026nbsp;Practice of mulching is very important in permaculture farming but not necessarily so in conventional chemical farming.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) Permaculture is a form of agriculture that aims to develop self-sufficient and sustainable agricultural ecosystems. It is based on crop diversity, resilience, natural productivity, and sustainability. Permaculture relies on three ethics:care for the earthcare for peoplefair share.Conventional chemical farming, also known as traditional farming or industrial agriculture, is a modern agriculture system that uses a lot of chemicals. Conventional farming uses chemical fertilizers and pesticides to increase crop yields per hectare. Conventional farming can contribute to non-point source water pollutants, including salts, fertilizers, pesticides, and herbicides. The intense use of chemical fertilizers and irrigation can also make the soil less fertile over time. High-density crops and the use of single crops over large expanses of land strips away necessary nutrients as generations pass, eventually leaving the land barren. So Permaculture discourages monoculture. At the same time, artificial fertilizers can build up salts over time, making the soil inhospitable to plants. Permaculture tries to look at a piece of land in a holistic manner, integrating every animal and plant living on it, and combining that with social structures designed to foster long-lasting agriculture as well. Each element of a food cycle is broken down into what it requires and what it contributes, and then each element is pieced together to form a dynamically self-supporting whole. Mulching is an important practice in permaculture.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47041", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 Only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 Only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 Only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to \u0026lsquo;palm oil\u0026rsquo;, consider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The palm oil tree is native to Southeast Asia.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The palm oil is a raw material for some industries producing lipstick and perfumes.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The palm oil can be used to produce biodiesel.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The oil palm tree (Elaeis guineensis) is native to West Africa. The trees were brought to Southeast Asia in the mid-19th century as ornamental trees. The trees grow best in tropical climates with lots of water and produce a high yield when grown 10 degrees north and south of the equator. Indonesia and Malaysia produce more than 85% of the world\u0026rsquo;s palm oil. Palm oil is used for human consumption, such as in margarine, cooking oil, and cosmetics. It\u0026rsquo;s also used to make industrial derivatives like soaps, inks, and resins. India is the world\u0026rsquo;s second-largest consumer of palm oil, after Indonesia. India imports most of its palm oil from Indonesia, with about 43% of its imports coming from the country in 2022. The remaining 25% comes from Malaysia. In 2021, India spent $8.72 billion on palm oil imports. India is also the world\u0026rsquo;s largest importer of palm oil, making up about 40% of its vegetable oil consumption. In 2020-21, India imported 8.4 million metric tonnes (MMT) of palm oil, which is about 18% of global imports. In 2021, India launched the National Mission on Edible Oil-Oil Palm to increase its domestic production of palm oil. The government has also pegged domestic prices to the price of imported crude palm oil and created a viability price for farmers. Palm oil is more cost-effective and efficient than other oilseeds, such as sunflower, rapeseed, and soybeans, when it comes to producing biodiesel. Biodiesel is a substitute for diesel fuel that\u0026rsquo;s made from animal fats or vegetable oils. Palm oil can be used to make biodiesel for cars and trucks.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47042", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eChenab\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eJhelum\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRavi\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSutlej\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the Indus river system, of the following four rivers, three of them pour into one of them which joins the Indus direct. Among the following, which one is such river that joins the Indus direct?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) The Sutlej River is the river that joins the Indus River directly. The Indus River system includes the Indus, Jhelum, Chenab, Ravi, Beas, and Sutlej rivers. The Sutlej is the longest tributary of the Indus, and the Chenab is the largest. The Sutlej and Chenab rivers join to form the Panjnad, which then flows southwest for about 44 miles and joins the Indus River at Mithankot. The Indus River is one of the longest rivers in Asia, originating in the Tibetan Plateau. It flows northwest through the Himalayas and enters northern India, where it is joined by several tributaries, including the Zanskar and Sutlej rivers.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": " ": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following rivers : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Brahamani\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Nagawali\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Subarnarekha\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Vamsadhara\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above rise from the Eastern Ghats?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The Nagavali and Vamsadhara rivers originate from the Eastern Ghats. Here\u0026rsquo;s some more information about these rivers: Nagavali : Also known as the Langulya River, it originates in the Kalahandi District of the Eastern Ghats. The river is a major waterway for southern Odisha and northern Andhra Pradesh, and it supports agriculture and water supply for the surrounding districts. Vamsadhara : This river originates in the Eastern Ghats of Orissa and flows into the Bay of Bengal near Kalingapatnam. The Brahmani and Subarnarekha rivers do not originate from the Eastern Ghats. The Brahmani is a seasonal river in Odisha that forms a delta with the Baitarani River before emptying into the Bay of Bengal. The Subarnarekha originates from the Ranchi Plateau in Jharkhand and forms the boundary between West Bengal and Odisha.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47045", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2021)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The Global Ocean Commission grants licences for seabed exploration and mining in international waters.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. India has received licences for seabed mineral exploration in international waters.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. \u0026lsquo;Rare earth minerals\u0026rsquo; are present on seafloor in international waters.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The Global Ocean Commission is not responsible for regulating seabed exploration and mining in international waters. The International Seabed Authority (ISA) is the UN body that regulates the exploration and exploitation of marine non-living resources in international waters. The ISA was established in 1994 and is headquartered in Kingston, Jamaica. The ISA\u0026rsquo;s mandate is to protect the international deep sea, which is the area below 200 meters where photosynthesis is limited by light. According to UNCLOS, exploration and exploitation of seabed minerals can only be carried out under a contract with the ISA and in accordance with its rules, regulations, and procedures. India has exclusive rights to explore polymetallic nodules in the Central Indian Ocean Basin (CIOB). The rights cover 75,000 square kilometers of international waters. In 2002, the Government of India signed a 15-year contract with the International Seabed Authority (ISA) to explore the polymetallic nodules. The nodules contain nickel, cobalt, copper, and manganese. The nodules are small, rounded accretions that can vary in size from a few millimetersto centimeters. They are scattered on the Indian Ocean floor at depths of about 6,000 meters. Rare earth minerals are present on the seafloor in international waters. The seafloor is home to one of the world\u0026rsquo;s largest untapped collections of rare-earth minerals. Rare earth minerals are essential for the production of steel, hybrid cars, cameras, and smartphones. There are 17 rare earth minerals, which are also known as rare earth elements or rare earth metals. They are silver, silvery-white, or gray in color, and have a high luster but tarnish easily when exposed to air. The seafloor in international waters is often rich in rare earth minerals, such as polymetallic nodules, cobalt-rich crusts, and polymetallic sulfides. These elements and others accumulate in potato-sized lumps, called manganese nodules, on the sea floor. Nodules contain a wide variety of metals, including manganese, iron, copper, nickel, cobalt, lead, and zinc.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topi
