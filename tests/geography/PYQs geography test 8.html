    <div>
        <div style="font-weight: 900; letter-spacing: 2px; font-size: 1.6rem; color: #b8860b;">ABHISHA AI</div>
        <div style="font-size: 0.9rem; color: #fff; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold;">

    </div>

        <div id="q-text-display" style="font-size: 1.7rem; line-height: 1.8; font-weight: 900; color: #111; margin-bottom: 35px; padding-bottom: 20px; border-bottom: 2px solid #f0e6cc;"></div>
        <div id="opt-grid-display" style="display: grid; gap: 20px;"></div>
        <div id="analysis-panel" style="display: none; margin-top: 40px; padding: 30px; background: #fdfaf2; border-left: 10px solid #b8860b; border-radius: 0 5px 5px 0;">
            <div style="font-weight: 900; color: #b8860b; margin-bottom: 12px; letter-spacing: 2px; font-size: 1.3rem;"> ABHISHA AI INSIGHTS</div>

        <button onclick="navigate(-1)" style="background: transparent; color: #1b1b1b; border: 3px solid #1b1b1b; padding: 18px 45px; cursor: pointer; font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; transition: 0.3s;">PREVIOUS</button>
<button onclick="navigate(1)" style="background: #1b1b1b; color: #fdf6e3; border: none; padding: 18px 45px; cursor: pointer; font-weight: 900; letter-spacing: 2px; font-size: 1.1rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">NEXT QUESTION</button>

function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>
            <h2 style="margin-bottom:30px;">CANDIDATE: ${name}</h2>
            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

 under the guidelines and directions of the Union Ministry of Rural Development.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. \u0026lsquo;The Agricultural and Processed Food Products Export Development Authority\u0026rsquo; (APEDA) functions as the Secretariat for the implementation of NPOP.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Sikkim has become India\u0026rsquo;s first fully organic State.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eOrganic farming is a system of agriculture that uses natural resources and processes to produce food. It avoids the use of chemicals, genetically modified organisms (GMOs), and artificial fertilizers and pesticides. Instead, organic farming uses fertilizers like compost manure, green manure, and bone meal. It also emphasizes techniques like crop rotation and companion planting.\u003c/li\u003e\r\n\t\u003cli\u003eOrganic farming aims to produce high quality food while benefiting the entire food system. It uses environmentally friendly methods to control weeds, pests, and diseases. The International Federation of Organic Agriculture Movements (IFOAM) has expressed the principles and practices of organic farming as health, ecology, fairness, and care.\u003c/li\u003e\r\n\t\u003cli\u003eThe National Programme for Organic Production (NPOP) is operated by the Agricultural and Processed Food Products Export Development Authority (APEDA) under the Ministry of Commerce and Industry, Government of India. The program was launched in 2001 by the Ministry of Industries and Commerce. The NPOP is a quality assurance program for organic agriculture products in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIt involves:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Accreditation of certification bodies\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Standards for organic production\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Promotion of organic farming\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eMarketing :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThe Food Safety and Standards Authority of India (FSSAI), which comes under the Ministry of Health and Family Welfare, is the regulator for organic products.\u003c/li\u003e\r\n\t\u003cli\u003eIn 2016, Prime Minister Narendra Modi declared Sikkim as India\u0026rsquo;s first fully organic state.\u003c/li\u003e\r\n\t\u003cli\u003eIn 2003, Sikkim\u0026rsquo;s government passed a resolution to transition to organic farming due to land degradation caused by chemical fertilizers and pesticides. Over the next decade, the use of chemicals in agriculture was phased out and, by 2016, it was completely banned and declared a criminal offense.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47005", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {ma k-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to agricultural soils, consider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2018)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. A high content of organic matter in soil drastically reduces its water holding capacity.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Soil does not play any role in the sulphur cycle.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Irrigation over a period of time can contribute to the salinization of some agricultural lands.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (B)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIn fact, organic matter increases the soil\u0026rsquo;s water holding capacity.\u003c/li\u003e\r\n\t\u003cli\u003eOrganic matter increases the number of micropores in the soil. This can happen by \u0026ldquo;gluing\u0026rdquo; soil particles together or by creating favorable living conditions for soil organisms.\u003c/li\u003e\r\n\t\u003cli\u003eOrganic matter can also absorb water like a sponge, storing it for later use by plants. This increases the soil\u0026rsquo;s ability to retain moisture.\u003c/li\u003e\r\n\t\u003cli\u003eSoil organic matter can be increased by incorporating compost, manures, or other stable organic materials.\u003c/li\u003e\r\n\t\u003cli\u003eGrowing and incorporating a high biomass cover crop can also increase soil organic matter.\u003c/li\u003e\r\n\t\u003cli\u003eSoil plays a crucial role in the sulphur cycle. It acts as a reservoir for sulphur and helps transform it into different forms that plants can absorb.\u003c/li\u003e\r\n\t\u003cli\u003eSulphur is one of three nutrients that cycle between the soil, plant matter, and the atmosphere. In the soil, sulphur exists in organic and inorganic forms.\u003c/li\u003e\r\n\t\u003cli\u003eIt cycles between and within these forms through processes like mineralization, oxidation, reduction, immobilization, and mobilization.\u003c/li\u003e\r\n\t\u003cli\u003eSulphur is essential for many growth functions in plants, including protein and oil synthesis, enzyme activity, and nitrogen metabolism. Plants with sulphur deficiency often have short and/or spindly stems and yellowing of the young leaves.\u003c/li\u003e\r\n\t\u003cli\u003eIrrigation over a period of time can contribute to the salinization of some agricultural lands as deposits of salts build up in the soil and can cause harm to crops.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47007", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r 003eIndia does not currently produce silicon on a large scale.\u003c/li\u003e\r\n\t\u003cli\u003eSilicon wafers are used as the substrate for the production of computer chips and other electronic components. They require a high level of technical expertise and specialized equipment to manufacture.\u003c/li\u003e\r\n\t\u003cli\u003eIn India, the Central Electricity Regulatory Commission (CERC) determines solar power tariffs.\u003c/li\u003e\r\n\t\u003cli\u003eThe CERC regulates tariffs for generating companies owned or controlled by the Central Government.\u003c/li\u003e\r\n\t\u003cli\u003eThe CERC can use an \u0026ldquo;appropriate tariff methodology\u0026rdquo; to determine the tariff for solar power, such as cost-plus tariff determination.\u003c/li\u003e\r\n\t\u003cli\u003eSolar power tariffs can also be determined through competitive bidding.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47008", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style /style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAs per the NSSO 70th Round \u0026ldquo;Situation Assessment Survey of Agricultural Households\u0026rdquo;, consider the following statements :\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2018)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Rajasthan has the highest percentage share of agricultural households among its rural households.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Out of the total agricultural households in the country, a little over 60 percent belong to OBCs.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. In Kerala, a little over 60 percent of agricultural households reported to have received maximum income from sources other than agricultural activities.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (C)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to a 2014 report, Rajasthan has the highest percentage of agricultural households among its rural households, at 78.4%. This is followed by Uttar Pradesh at 74.8% and Madhya Pradesh at 70.8%.\u003c/li\u003e\r\n\t\u003cli\u003eThe agricultural and allied sector contributed 24.61% of Rajasthan\u0026rsquo;s total GSDP in 2017-18, which is higher than the national average of 14.82%. Rajasthan also has 11.26% of the country\u0026rsquo;s livestock population and contributes 12.93% of the country\u0026rsquo;s milk production and 32.89% of its wool production.\u003c/li\u003e\r\n\t\u003cli\u003eAccording to the National Sample Survey Office (NSSO) 70th Round, which was conducted between July 2012 and June 2013, The survey found that about 45% of agricultural households belong to Other Backward Classes (OBCs).\u0026nbsp;The survey also found that 16% of agricultural households belong to Scheduled Castes and 13% belong to Scheduled Tribes.\u0026nbsp;\u003c/li\u003e\r\n\t\u003cli\u003eAccording to a 2014 survey, about 61% of agricultural households in Kerala reported that their main source of income is not from agricultural activities.\u003c/li\u003e\r\n\t\u003cli\u003eIn India, agricultural activities are the primary source of income for most agricultural households in all major states, except Kerala.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eKerala\u0026rsquo;s other sources of income include: \u003c/strong\u003eIT, Real estate, Insurance, Transportation, Banking.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47009", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img  !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements: \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2018)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;In India, State Governments do not have the power to auction non-coal mines.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Andhra Pradesh and Jharkhand do not have gold mines.\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Rajasthan has iron ore mines.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (D)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eAccording to the Mines and Minerals (Development and Regulation) Amendment Act, 2015, the respective state governments are responsible for auctioning mining licenses for non-coal minerals.\u003c/li\u003e\r\n\t\u003cli\u003eNon coal mining is the extraction of solid materials and substances of commercial value from natural deposits, excluding coal and other minerals. This includes the mining of clay, stone, sand, gravel, scoria, uranium, and other ores.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hutti gold mine in the Raichur district of Karnataka is the largest gold mine in India. The mine is estimated to have 16.38 million tonnes of gold reserves.\u003c/li\u003e\r\n\t\u003cli\u003eThe Hutti gold mine is one of the world\u0026rsquo;s oldest metal mines and is owned by the Government of Karnataka.\u003c/li\u003e\r\n\t\u003cli\u003eThe mine uses a combination of underground and open-pit mining methods and employs around 3,800 workers. Miners work down to a depth of almost 2,300 feet.\u003c/li\u003e\r\n\t\u003cli\u003eIn Andhra Pradesh, gold mines are located in Ramagiri in the Anantapur district. Jharkhand has both native and alluvial gold.\u003c/li\u003e\r\n\t\u003cli\u003eJharkhand has one operational gold mine, the Kundarkocha gold mine. The mine is located in the village of Kundarkocha in the East Singhbhum district.\u003c/li\u003e\r\n\t\u003cli\u003eRajasthan has iron ore mines. The state\u0026rsquo;s iron ore deposits are located in the following districts : Jaipur, Udaipur, Jhunjhunu, Sikar, Bhilwara, Alwar, Bharatpur, Dausa, Banswara.\u003c/li\u003e\r\n\t\u003cli\u003eIn February 2024, the Rajasthan Mines Department discovered over 840 million tonnes of iron ore in Khoda, Dadaroli, Todupura, and Liloti near Hindon in Karauli.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eIron ore :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a rock or mineral that can be mined for metallic iron. It is usually rich in iron oxides and can be dark grey, bright yellow, deep purple, or rusty red in color. Iron ore is the raw material used to make pig iron, which is a main raw material for making steel.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47010", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% rt_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Kodaikanal Lake, located in the Palani Hills of Tamil Nadu, is an artificial (man-made) lake. It was created in 1863 by Sir Vere Henry Levinge, who was the then Collector of Madurai. The lake was formed by constructing a dam across three streams to provide a water source and enhance the beauty of the hill station. It is star-shaped and surrounded by lush greenery and the famous Bryant Park, making it one of the most popular tourist destinations in South India. Thus, Kodaikanal Lake is a classic example of a man-made or artificial lake in India. The Kolleru Lake in Andhra Pradesh, on the other hand, is a natural freshwater lake, located between the Godavari and Krishna deltas. It serves as an important habitat for migratory birds and acts as a natural flood-balancing reservoir. The Nainital Lake in Uttarakhand is also a natural freshwater lake, formed in a tectonic depression surrounded by the Kumaon hills. It is one of the famous natural lakes in the Himalayas. The Renuka Lake in Himachal Pradesh is the largest natural lake in the state, named after the goddess Renuka, and holds great religious significance. Therefore the correct answer is A.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"ans hanging. The forces that generate the field are constantly changing, causing the field\u0026rsquo;s strength to wax and wane over time. This causes the Earth\u0026rsquo;s magnetic north and south poles to gradually shift, and to even completely flip locations every 300,000 years or so. These reversals are random and can happen as often as every 10 thousand years or as infrequently as every 50 million years or more.The Earth\u0026rsquo;s early atmosphere was made up of nitrogen, water vapour, and carbon dioxide. When the Earth formed 4.6 billion years ago, it had almost no atmosphere. As the Earth cooled, an atmosphere formed from gases released by volcanoes. This atmosphere contained hydrogen sulfide, methane, and 10 to 200 times as much carbon dioxide as the atmosphere today. Microorganisms and plants are examples of living things. After the evolution of species capable of photosynthesis, life began to significantly alter the environment. While photosynthetic life started to produce oxygen, it also started to lower the amount of carbon dioxide in the atmosphere. Therefore, when living things first evolved, they did change the environment.\u003c/p\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47014", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !impor d Turkey. 5. Red Sea : It is an inlet of the Indian Ocean that separates the coasts of Egypt, Sudan, and Eritrea from those of Saudi Arabia and Yemen. It is connected to the Indian Ocean in the south through the Bab-el-Mandeb strait and the Gulf of Aden.The Red Sea contains some of the world\u0026rsquo;s warmest and saltiest seawater. It has an intense blue-green color, but occasionally, the death of the algae Trichodesmium erythraeum turns the sea into a reddish brown color. The Red Sea is bordered by six countries: 1. Eastern shore: Saudi Arabia and Ye men 2. Western shore: Egypt, Sudan, Eritrea, and Djibouti.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47018", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 4\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003 \r\n\t\t\t\u003ctd style=\"border-bottom:1px solid #231f20; width:103px; padding:0cm 0cm 0cm 0cm; height:21px; border-top:none; border-right:1px solid #231f20; border-left:none\" valign=\"top\"\u003e\r\n\t\t\t\u003cp class=\"TableParagraph\" style=\"margin-left:5px; margin-top:1px\"\u003e\u003cspan style=\"font-size:11pt\"\u003e\u003cspan style=\"line-height:13.7pt\"\u003e\u003cspan style=\"font-family:\u0026quot;Times New Roman\u0026quot;,serif\"\u003e\u003cspan lang=\"EN-US\" style=\"font-size:12.0pt\"\u003e\u003cspan style=\"color:#231f20\"\u003e\u003cspan style=\"letter-spacing:-.1pt\"\u003eManas\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\t\t\t\u003c/td\u003e\r\n\t\t\u003c/tr\u003e\r\n\t\u003c/tbody\u003e\r\n\u003c/table\u003e\r\n\r\n\u003cp\u003eWhich of the pairs correctly matched?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (A) Bandarpunch Glacier : It is a 12 km long glacier in the Garhwal Himalayas, in the Uttarkashi district of Uttarakhand, India. It is part of the Gangotri glacier system, which is the source of the Ganges River. The glacier is located on the north slopes of Bandarpunch West, Khatling peak and Bandarpunch peak. The glacier\u0026rsquo;s flanks feed the Ruinsar Gad, which flows into the Yamuna at Seema. The glacier\u0026rsquo;s base feeds the Hanuman Ganga River, which joins the Yamuna at Hanuman Chatti. The name Bandarpoonch literally means \u0026ldquo;monkey\u0026rsquo;s tail\u0026rdquo;. Bara Shigri : It is a glacier in the Chandra Valley of Lahaul, Himachal Pradesh, India. It is the largest glacier in Himachal Pradesh and the second longest glacier in the world.\u0026nbsp;It flows northwards and feeds the Chenab river. The name Bara Shigri comes from the Lahaul dialect, where Bara means big and Shigri means glacier. Milam Glacier : It is the largest glacier in Kumaon, India. It\u0026rsquo;s located in the Pithoragarh district of Uttarakhand, 15 kilometers northeast of Nanda Devi. The glacier is named after the village of Milam, which is 3 kilometers away. The river Gori Ganga, a tributary of the Kali river, originates at the glacier. The Sarda or Saryu river also originates in the glacier, and is known as the Goriganga in the Nepal Himalayas. Along the Indo-Nepal border, it\u0026rsquo;s called Kali or Chauk, where it joins the Ghaghara. The Siachen Glacier : It is the world\u0026rsquo;s second-longest non-polar glacier and is located in Northern Ladakh in the Karakorams. It is a temperate-zone glacier, which means it produces a lot of runoff during the ablation season. It is the source of the Nubra River, which later joins the Shyok River. The Shyok River then joins the Indus River, which flows through Pakistan. The Nubra River is a tributary of the Shyok River and is located in the Nubra Valley of Ladakh, India. The Nubra River flows 90 kilometers (60 miles) before it joins the Shyok River. The Siachen Glacier is also strategically important to India, Pakistan, and China. Because it forms a hub between Shaksgam Valley, Karakoram Pass, and Aksai Chin. Zemu Glacier : It is the largest glacier in the Eastern Himalayas, located in Sikkim, India. It is about 26 kilometers long and is situated at the base of the Kanchenjunga in a large U-shaped valley.The Zemu Glacier is the source of the Teesta River, which originates from the glacier\u0026rsquo;s snout.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {  to ground level.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhy are dewdrops not formed on a cloudy night? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) Dew is a natural form of water that forms when water vapour condenses. Dew forms when the ground cools enough for water vapour to condense. On a clear or mostly clear night, the ground cools and warm air radiates away from the ground. If the ground cools enough, dew forms on the grass. However, on a cloudy night, the ground retains more of its heat and not as much heat is radiated up to the sky. Clouds trap heat, stopping the formation of dew. On a cloudy night, the clouds send the heat (earth\u0026rsquo;s radiation) back to the ground. The ground never gets cold enough for the dew to be formed.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", ", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements about Particularly Vulnerable Tribal Groups (PVTGs) in India : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. PVTGs reside in 18 States and one Union Territory.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. A stagnant or declining population is one of the criteria for determining PVTG status.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. There are 95 PVTGs officially notified in the country so far.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Irular and Konda Reddi tribes are included in the list of PVTGs.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u0026nbsp;\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) A Particularly Vulnerable Tribal Group (PVTG) is a sub-classification of Scheduled Tribe in India. PVTGs are considered more vulnerable than regular Scheduled Tribes. In 1973, the Dhebar Commission, also known as the Tribal Panchsheel Committee, created the category of Primitive Tribal Groups (PTGs). In 1975, the Government of India identified 52 PTGs, and in 1993, an additional 23 groups were added. In 2006, the Government of India renamed the PTGs as PVTGs. The PVTG list was created by the Indian Government with the purpose of better improving the living standards of endangered tribal groups based on priority. As of 2021, the Ministry of Tribal Affairs in India has officially notified 75 Particularly Vulnerable Tribal Groups (PVTGs). PVTGs reside in 18 States and one union territory. The Irular and Konda Reddi tribes are included in the list of Particularly Vulnerable Tribal Groups (PVTGs). Some characteristics of PVTGs include: 1. They are mostly homogenous 2. They have a small population 3. They are relatively physically isolated 4. They lack a written language 5. They have relatively simple technology 6. They have a slower rate of change 7. They have some specific features such as dependency on hunting, gathering for food, having pre-agriculture level of technology, zero or negative growth of population and extremely low level of literacy\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47021", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. As per recent amendment to the Indian Forest Act, 1927, forest dwellers have the right to fell the bamboos grown on forest areas.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. As per the Scheduled Tribes and Other Traditional Forest Dwellers (Recognition of Forest Rights) Act, 2006, bamboo is a minor forest produce.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The Scheduled Tribes and Other Traditional Forest Dwellers (Recognition of Forest Rights) Act, 2006 allows ownership of minor forest produce to forest dwellers.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The Indian Forest (Amendment) Bill 2018 permits felling and transit of bamboo grown in non-forest areas. However, bamboo grown on forest lands would continue to be classified as a tree and would be guided by the existing legal restrictions. The Forest Rights Act (FRA) of 2006 recognises bamboo as an Minor Forest Produce It vests the right of ownership, access to collect, use and dispose of minor forest produce with Scheduled Tribes and traditional forest dwellers. In 2006, the Forest Rights Act (FRA) for the first time defined minor forest produce as including bamboo and tendu and many other things. It also gave tribals and other traditional forest dwellers the right of ownership, access to collect, use and dispose of minor forest produce, which has been traditionally collected within or outside village boundaries.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47022", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {m "text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the management of minor minerals in India, consider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2019)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Sand is a \u0026lsquo;minor mineral\u0026rsquo; according to the prevailing law in the country.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. State Governments have the power to grant mining leases of minor minerals, but the powers regarding the formation of rules related to the grant of minor minerals lie with the Central Government.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. State Governments have the power to frame rules to prevent illegal mining of minor minerals.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) According to the Mines and Minerals (Regulation and Development) Act, 1957, minor minerals are minerals that are locally available and have local use. They are not used in any major industries. Most building and construction materials fall into this category. Minor minerals include: Building stones, Gravel, Ordinary clay, Ordinary sand other than sand used for prescribed purposes, Any other mineral which the Central Government may, by notification in the Official Gazette, declare to be a minor mineral. Some examples of minor minerals include: Limestone, Decorative stones, Sand. Major minerals include all minerals other than minor minerals. Some examples of major minerals include: Uranium, Coal, Gold, Iron ore, Lead, Zinc, Magnesium, Tungsten. According to the Mines and Minerals (Development and Regulations) Act, 1957 (MMDR Act), sand is a \u0026ldquo;minor mineral\u0026rdquo;. Section 23C of the Mines and Minerals (Development and Regulation) Act (MMDR Act) 1957 gives State Governments the power to make rules to prevent illegalmining, transportation, and storage of minerals. These rules can be made by notification in the Official Gazette.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47023", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max of jowar is more than that of oilseeds.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Area of cotton cultivation is more than that of sugarcane.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Area under sugarcane cultivation has steadily decreased.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (A)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe area under rice cultivation in India is the highest among Kharif crops because rice is the staple food crop of the country and is extensively cultivated in states such as West Bengal, Uttar Pradesh, Punjab, and Bihar, where monsoon rainfall and irrigation facilities are abundant. Thus, statement 1 is correct. The area under jowar cultivation has significantly declined in recent years due to the shift of farmers toward more profitable and irrigated crops, while the area under oilseeds (like soybean and groundnut) has increased substantially. Therefore, the area under jowar is not more than that of oilseeds. Thus, statement 2 is incorrect. The area under cotton cultivation is indeed more than that under sugarcane, as cotton is a major Kharif cash crop grown in Maharashtra, Gujarat, and Telangana, whereas sugarcane is cultivated on a comparatively smaller area mainly in Uttar Pradesh and Maharashtra. Thus, statement 3 is correct. The area under sugarcane cultivation has not steadily decreased; rather, it fluctuates slightly based on rainfall and pricing policies, but overall remains stable. Thus, statement 4 is incorrect. Therefore, only statements 1 and 3 are correct.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47024", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSpices\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eFresh fruits\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePulses\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} i _2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat are the advantages of fertigation in agriculture?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Controlling the alkalinity of irrigation water is possible.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Efficient application of Rock Phosphate and all other phosphatic fertilizers is possible.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Increased availability of nutrients to plants is possible.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Reduction in the leaching of chemical nutrients is possible.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) Fertigation is a method of supplying dissolved fertilizers to crops through an irrigation system. It\u0026rsquo;s an efficient way to apply nutrients, and it can improve water- and nutrient-use efficiency. Fertigation works by: 1. Incorporating fertilizer into irrigation water through a drip system 2. Distributing the fertilizer solution evenly in irrigation 3. Delivering pure plant nutrients through the irrigation water 4. Ensuring that nutrition is supplied only where it is required at the zone of active roots5. Enabling matching of the nutrient balance to crop requirements at any particular growth stage 6. Fertigation can reduce water consumption and soil erosion by controlling fertilizer usage. It can also help you control the amount, location, and rate of application. Rock phosphate is not soluble and thus not suitable. Fertigation uses special fertilizer apparatus (injectors) installed at the head control unit of the system, before the filter. The element most commonly applied is nitrogen, but phosphorous and potassium are common for vegetables. Some disadvantages of fertigation include: 1. Concentration of the solution may decrease as the fertilizer dissolves 2. The water supply for fertigation is to be kept separate from the domestic water supply to avoid contamination 3. Possible pressure loss in the main irrigation line.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47027", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3 and 4 only\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following minerals : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1) Bentonite\u003c/p\u003e\r\n\r\n\u003cp\u003e2) Chromite\u003c/p\u003e\r\n\r\n\u003cp\u003e3) Kyanite\u003c/p\u003e\r\n\r\n\u003cp\u003e4) Sillimanite\u003c/p\u003e\r\n\r\n\u003cp\u003eIn India, which of the above is/are officially designated as major minerals?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) Bentonite is a minor mineral. Bentonite is a soft, plastic clay that\u0026rsquo;s made up of montmorillonite, a fine-particle hydrous aluminum silicate. It\u0026rsquo;s formed when volcanic ash and rocks change after coming into contact with water.The Indian government has declared some minerals as minor, including: Chalcedony pebbles, Fuller\u0026rsquo;s earth, Bentonite, Limestone, Lime shell, Kankar, Boulder, Shingle, Brick-earth, Slate. Minor minerals consist of materials such as marble, slate, shale etc The major minerals cover fuel minerals consisting of coal, lignite, petroleum \u0026amp; natural gas and other major minerals i.e. metallic minerals including atomic minerals and non-metallic minerals. Chromite is a major mineral. It is a crystalline mineral that is made up of iron oxide and chromium oxide compounds. Chromite is the main source of the metal chromium, which is used to make steel harder, tougher, and more resistant to chemicals. Kyanite is a major mineral in India. It\u0026rsquo;s an aluminum silicate mineral that\u0026rsquo;s used to make refractory materials that can withstand high temperatures. Kyanite is a member of the aluminosilicate mineral family and its chemical formula is Al2 SiO5 . It\u0026rsquo;s named after the Greek word \u0026ldquo;kuanos\u0026rdquo;, which means blue, and it typically forms bladed crystals. Other major minerals in India include: Chromite, Sillimanite, Coal, Manganese ore, Iron ore, Bauxite, Limestone, Baryte. Sillimanite is a major mineral in India. It is an aluminosilicate mineral with the chemical formula Al2 SiO5 . It is named after the American chemist Benjamin Silliman (1779\u0026ndash;1864). Sillimanite is a polymorph of kyanite and andalusite. It can range in color from colorless to white, brown, yellow, blue, and green. It is made of compact fibrous material with a silky luster.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47028", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to Ocean Mean Temperature (OMT), which of the following statements is/are correct? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2020)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. OMT is measured up to a depth of 26\u0026deg;C isotherm which is 129 meters in the south-western Indian Ocean during January-March.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. OMT collected during January-March can be used in assessing whether the amount of rainfall in monsoon will be less or more than a certain long-term mean.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) Ocean Mean Temperature (OMT) is a parameter that represents the heat available in the ocean layer up to a depth of 26\u0026deg;C isotherm. It is measured by satellites orbiting the Earth to calculate sea surface temperature (SST) and forecast monsoons. OMT is more stable and consistent than SST, which is restricted to a few millimeters of the top ocean layer. SST is largely influenced by strong winds, evapouration, or thick clouds. OMT collected during January\u0026ndash;March can be used to assess whether the amount of rainfall in monsoon will be less or more than a certain long-term mean. At depths between 50 and 100 meters, the 260 C isotherm can be seen. The average depth of the 260 C isotherm in the southwest Indian Ocean from January to March is 59 meters. Ocean Mean Temperature (OMT) collected during January\u0026ndash;March can be used to assess whether the amount of rainfall in monsoon will be less or more than a certain long-term mean. OMT is a better indicator of monsoon rainfall than sea surface temperature (SST) because it measures ocean thermal energy. According to a 1993\u0026ndash;2017 study, OMT was able to correctly predict 20 out of 25 years (80% success rate) whether the amount of rainfall during the summer monsoon was more or less than the long-term mean. Ocean temperatures play a significant role in climate and weather patterns, and can influence monsoon systems.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "449", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "47029", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u00
