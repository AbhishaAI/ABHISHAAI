", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTides occur in the oceans and seas due to which among the following : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Gravitational force of the Sun\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Gravitational force of the Moon\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Centrifugal force of the Earth\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) The gravitational pull of the Sun, Moon, and Earth causes tides to form in oceans and seas. Tides are caused by the gravitational forces of the moon and sun on the Earth\u0026rsquo;s oceans. The Earth and moon also orbit each other, which contributes to tides. Tides are long-period waves that move through the ocean and appear as the regular rise and fall of the sea surface. The highest point of a wave, or crest, reaches the coast during high tide. The lowest point, or trough, reaches the coast during low tide. The Moon\u0026rsquo;s gravitational force is stronger on the side of the Earth closest to it and weaker on the opposite side. This difference in gravity creates a tidal bulge on both sides of the Earth. The side closest to the Moon experiences high tide, while the opposite side experiences low tide. These tides are called lunar tides and occur twice a day. The Sun\u0026rsquo;s gravitational force also affects tides, but its effect is weaker than the Moon\u0026rsquo;s. When the Sun, Moon, and Earth are aligned, the gravitational forces of the Sun and Moon combine, creating stronger tides called spring tides. When the Sun and Moon are at right angles to each other, their gravitational forces cancel each other out, resulting in weaker tides called neap tides. Earth\u0026rsquo;s gravitational force also contributes to the occurrence of tides. The water on the side of the Earth closest to the Moon experiences a gravitational pull towards the Moon, creating a bulge. A centrifugal force pulls the water away from the Moon on the other side, generating another bulge. Tides are produced as a result of these bulges moving across the earth due to the Earth\u0026rsquo;s rotation.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46975", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/c as the word Om (\u0950), which is considered the most sacred sound in Hinduism and represents Lord Shiva. Pushkar : A town in the central-east part of Rajasthan, India, is located in the\u0026nbsp;Aravalli range of hills.\u0026nbsp;The town is about 10 kilometers northwest of Ajmer, and the Nag Parbat (\u0026ldquo;snake mountain\u0026rdquo;) separates the lake from Ajmer.\u0026nbsp; Pushkar Lake, also known as Pushkar Sarovar, is surrounded by hills and desert on all sides.\u0026nbsp;Devotees believe that bathing in the lake\u0026rsquo;s waters on Kartik Poornima (during the Pushkar Fair) will cure skin diseases and nullify sins.\u0026nbsp; The Satmala Hills are a mountain range in Maharashtra, India. They run through the Nashik district and are part of the Sahyadris range. The Satmala Hills have an elevation of 1,472 meters. Dhodap is the highest peak in the range. The Satmala-Chandwad Range runs east and west and is the main divide in the plateau region. The Godavari, India\u0026rsquo;s largest river, originates in the district\u0026rsquo;s Trimbakeshwar Range and flows east through it.Mahadeo Hills are a range of sandstone hills in the northern part of the Satpura Range in Madhya Pradesh, India. The hills are about 20 km from Satpura National Park and are located at an altitude of 1,363 m. The Satpura Range forms a watershed between the Narmada in the north and Tapti in the south. The Mahadeo Hills separate the basin of Narmada from the Wardha and Wainganga rivers to the north. The Narmada and Son rivers originate near the Mahadeo Hills.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46978", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100  India. It originates in the Nandi Hills in Karnataka and flows for 597 km through several mountains and plains, eventually draining into the Bay of Bengal in Andhra Pradesh. The Pennar River\u0026rsquo;s basin area is 55,213 km\u0026sup2;. It flows in two different streams, one in the north and one in the south.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46979", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNorth Coastal Andhra Pradesh\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSouth-West Bengal\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSouthern Saurashtra\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !impor ies. Evergreen Forests : The Andaman and Nicobar Islands also have a large area of evergreen forest, covering an area of 1534 sq km.These forests are found in the higher altitudes of the islands and are characterized by their dense growth of trees that retain their leaves throughout the year. The evergreen forests of the Andaman and Nicobar Islands are known to be home to a variety of endemic species, including the Andaman wild pig, the Andaman hill myna, and the Andaman serpent eagle. Deciduous Forests : The Andaman and Nicobar Islands also have a small area of deciduous forest, covering an area of 191 sq km. These forests are found in the drier areas of the islands and are characterized by their trees that lose their leaves during the dry season. The deciduous forests of the Andaman and Nicobar Islands are known to be home to a variety of species, including the Andaman wild boar, the Andaman squirrel, and the Andaman flying fox.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46980", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKhangchendzonga National Park\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css ent 1 is NOT correct. The westerlies are stronger in the Southern hemisphere due to the vast ocean and comparatively less land. They are best observed between 40 to 60-degree latitude and these latitudes are also known as Roaring forties, Furious fifties, and shrieking sixties. There are fluctuations in the subpolar region. Thus, they produce wet spells due to variation in weather. The moist air masses that cause winter rains in the northwestern region of India are part of the westerlies. During winter, the westerly winds bring moisture from the Mediterranean Sea and the Arabian Sea.\u0026nbsp;This moisture leads to the formation of clouds and precipitation over the region.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46983", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTropical moist deciduous forest\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTropical rain forest\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003  moist deciduous forests. These forests are also known as monsoon forests and are found in the states of Jharkhand, Chhattisgarh, West Odisha, and on the eastern slopes of the Western Ghats. Teak is a major timber tree in India and Southeast Asia. It\u0026rsquo;s known for its high quality timber and thrives in areas with moderate to high rainfall. Other commercially important species found in tropical moist deciduous forests include: Bamboo, Sal, Shisham, Sandalwood, Kusum, Arjun, Mahua, Mulberry. Tropical rainforests are dense and warm rainforests that occur in tropical rainforest climate where there is no dry season \u0026ndash; all months have an average precipitation of at least 60 mm. True rainforests are typically found between 10 degrees north and south of the equatorTropical thorn scrub forests are tropical dry forests that have been degraded by agriculture and grazing. They are found in semi-arid regions of India, including Gujarat, Rajasthan, Uttar Pradesh, Chhattisgarh, Haryana, and Madhya Pradesh. These areas receive less than 70 cm of rainfall annually. Tropical thorn scrub forests are scrub-like deserts. They are dominated by trees such as Acacia senegal, Acacia leucophloea, Prosopis cineraria, Capparis zeylanica, and species of Salvadora and Gymnosporia. Temperate woodlands and grasslands are found in middle latitude areas, where cool subpolar and warm subtropical air masses meet. This boundary moves north and south with the seasons and varies depending on the geography and relief of the region. Temperate grasslands have cold winters and warm summers with some rain.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46984", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{over \u003cp\u003eExplanation : (C) India\u0026rsquo;s steel production industry requires the import of coking coal. Coking coal : It is also known as metallurgical coal, is a vital ingredient in the steel making process. It is used to create coke, which is a key component in the steelmaking process. India has limited availability of coking coal. The coal found in India is mainly of non-coking quality. Some reasons for low productivity of iron and steel in India include high costs and limited availability of coking coal.Saltpetre : It is a natural mineral source found on earth that is also known as potassium nitrate. It is a white solid that is soluble in water and is formed by fractional crystallization of sodium nitrate and potassium chloride solutions. Saltpetre is a principal ingredient in black gunpowder. It is also used in agriculture, where it is commonly sold as a water-soluble, crystalline material. It can be used for a variety of medicinal purposes, including in toothpaste for teeth and gums, to treat hypertension, to treat breathing problems, and as the main ingredient in kidney tablets to treat cystitis. Rock phosphate : It is also known as phosphorite, is a sedimentary rock that contains high levels of phosphate minerals. It\u0026rsquo;s a raw material used to make most commercial phosphate fertilizers. It\u0026rsquo;s also used as a source of phosphorus for acid soils. India produces rock phosphate, but it\u0026rsquo;s only produced in two states: 1. 2. Rajasthan Madhya Pradesh. Jhamarkotra contributes 98% of India\u0026rsquo;s rock phosphate production. Rock phosphate is a key raw material for DAP and NPK fertilizers. However, India is 90% dependent on imports for this raw material.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46986", "image_check": "0", "image_li .00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026lsquo;\u0026lsquo;Each day is more or less the same, the morning is clear and bright with a sea breeze; as the Sun climbs high in the sky, heat mounts up, dark clouds form, then rain comes with thunder and lightning. But rain is soon over.\u0026rdquo; Which of the following regions is described in the above passage? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B)T he passage describes the equatorial region. T he equatorial region is the area around the equator, which covers about 6% of the Earth. T he equatorial climate is hot and humid year-round, with heavy rainfall that occurs throughout the year. This climate supports the growth of dense equatorial forests. T he equatorial climate is characterized by: 1. 2. 3. 4. 5. Consistently high temperatures (around 30 \u0026deg;C [86 \u0026deg;F]) Heavy cloud cover High humidity Plentiful precipitation (150\u0026ndash;1,000 cm [59\u0026ndash;394 inches]) Very little annual temperature variation Savannas are a transitional climate found between hot deserts and equatorial rainforests. They are characterized by warm to hot conditions year-round, with temperatures ranging from 68\u0026deg; to 86\u0026deg;F (20\u0026deg; to 30\u0026deg;C). Savannas have two distinct seasons:a wet summer 2. a dry winter. Monsoon climate is a seasonal change in the direction of the strongest winds in a region. Monsoons are caused by seasonal shifts in winds due to differences in temperature between land and water. For example, in summer, land warms up faster than water, causing monsoon winds to blow from cold to warm. Monsoons result in wet and dry seasons in many tropical areas, and are often associated with the Indian Ocean. A Mediterranean climate is a temperate climate with mild, wet winters and dry summers. It\u0026rsquo;s often connected to prevailing winds and weather patterns. Mediterranean climates are found on the west coasts of continents between 30\u0026deg; and 40\u0026deg; latitude, and along the shores of the Mediterranean Sea. They have warm summers with clear skies, cool nights, and little rain.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46987", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSaltwater crocodile\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eOlive ridley turtle\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGangetic dolphin\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGharial\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following is the national aquatic animal of India? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) The Ganges River Dolphin, also known as \u0026ldquo;Susu\u0026rdquo;, is the national aquatic animal of India. It was declared the national aquatic animal on May 18, 2010 by the Ministry of Environment and Forests. The Ganges River Dolphin is found in the Ganges-Brahmaputra-Meghna and Karnaphuli-Sangu river systems of Nepal, India, and Bangladesh. It is also the official animal of the Indian city of Guwahati. The Ganges River Dolphin is considered the national animal of India because it is the most endangered and cyclical species of River Dolphin. Also, the Ganges Dolphin is seen as the reflector of the health of the Ganga River. The species is listed under Appendix I of CITES. The main reasons for the decline in the population of the species are 1. poaching 2. habitat degradation. The saltwater crocodile (Crocodylus porosus) : It is the largest living reptile and the largest crocodilian. Saltwater crocodiles are native to saltwater habitats, freshwater rivers, and brackish wetlands from India\u0026rsquo;s east coast to northern Australia and Micronesia. They can live up to 70 years in the wild and can grow to an average size of 17 feet long and weigh 1,000 lbs. Saltwater crocodiles are apex predators that can catch prey on land and in water. Juveniles eat smaller prey like fish, amphibians, insects, and crustaceans. Adults eat birds, mammals, and reptiles, and can also attack and kill humans and domestic livestock. Saltwater crocodiles can tolerate saltwater in oceans and can travel long distances over the open ocean using tidal currents. They are excellent swimmers and can easily cross large bodies of water. The olive ridley sea turtle : It is found in India from the Gujarat coast to the Andamans and Lakshadweep, to Odisha, and Bengal. The coast of Odisha is the largest mass nesting site for the olive ridley, followed by the coasts of Mexico and Costa Rica. The gharial : It is also known as the fish-eating crocodile or gavial, is a crocodilian that is among the longest living crocodilians. The scientific name for the gharial is Gavialis gangeticus. Gharials are found in fresh waters of the Himalayan rivers, especially the Chambal river in the northern slopes of the Vindhya mountains (Madhya Pradesh).\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46988", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMeghalaya\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eHimachal Pradesh\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eJharkhand\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTamil Nadu\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn a particular region in India, the local people train the roots of living tree into robust bridges across streams. As the time passes these bridges become stronger. These unique \u0026lsquo;Living Root Bridges\u0026rsquo; are found in.............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) Living root bridges are pedestrian bridges made from the roots of living trees. They are a common feature in the state of Meghalaya, in the northeast of India. To build a living root bridge, two rubber trees (Ficus elastica) are planted on either side of a river. The trees can take about a decade to grow secondary aerial roots. The roots are then woven and manipulated to nto atmosphere by crop fields\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is a combination of a veedicide and a fertilizer for\u0026nbsp;particular crops\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhy does the Government of India promote the use of \u0026lsquo;Neem-coated Urea\u0026rsquo; in agriculture? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2016)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The Government of India promotes the use of Neem-coated Urea in agriculture to improve nutrient efficiency, crop yield, and soil health. Neem-coated urea is a fertilizer that involves coating urea with neem tree seed oil. The neem coating slows down the rate at which urea dissolves in the soil, which increases the availability of nitrogen for crops. The benefits of Neem-coated Urea include: 1. Increasing crop-specific yields by 15 30% on average 2. Higher levels of soil fertility 3. 10% less urea is required compared to normal urea 4. Improved soil condition 5. Reduced costs for plant protection chemicals The Modi Government introduced 100% Neem Coating on all subsidized agricultural grade urea in the country. In January 2015, the government mandated urea manufacturers to increase their production of neem-coated urea from 35 percent to 75 percent.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46990", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone of the above is an advantage of practising drip irrigation\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following is/are the advantage/advantages of practising drip irrigation? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Reduction in weed\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Reduction in soil salinity\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Reduction in soil erosion\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) Drip irrigation, also known as trickle irrigation, is a watering method that delivers water directly to a plant\u0026rsquo;s roots. It\u0026rsquo;s a type of micro-irrigation system that can save water and nutrients. There are two main types of drip irrigation: 1. Sub-surface drip irrigation: Water is applied below the soil surface through narrow tubes. 2. Surface drip irrigation: Water is applied directly to the soil surface. Drip irrigation systems have many advantages, including: 1. Water conservation : Drip irrigation systems deliver water directly to plant roots, reducing evapouration and runoff. This allows plants to absorb more nutrients and ensures efficient use of available resources. 2. Reduced weeds : Drip irrigation systems water plants directly at the root, reducing weed growth. Sprinkler systems water areas that don\u0026rsquo;t need water, which can lead to more weeds. 3. Avoided soil erosion : Drip irrigation systems deliver water under low pressure, reducing the chance of soil erosion, root exposure, and water runoff.The slow distribution allows the soil to absorb the water. 4. Cost-efficient : Drip irrigation is cost-efficient because it uses less water and requires less labor. Farmers and homeowners can save up to 50% on their water bills by switching to drip irrigation. Drip systems are also long lasting and require less maintenance. 5. Precise and even distribution : Drip irrigation systems provide precise and even distribution of water and nutrients across an orchard. This prevents inconsistent flow rates of water to trees, resulting in healthier and more uniform yields. 6. Efficient water usage : Drip irrigation systems minimize water loss due to evapouration or runoff. This is especially important in areas where water is scarce or expensive. Drip irrigation has several disadvantages, including: 1. Cost: Drip irrigation can be expensive, especially when compared to overhead systems. It also requires regular capital to replace equipment. 2. Maintenance : Drip irrigation emitters can clog and malfunction if water is not filtered and equipment is not maintained. Small tubing can also become clogged from hard water. 3. Skill : Drip irrigation requires a high level of skill to manage water distribution. 4. Soil salinity : Drip irrigation can cause soil salinity. 5. Appearance : Drip irrigation tubing can be unsightly, and is often covered by mulch or plants. This can make it difficult to monitor the system\u0026rsquo;s effectiveness. 6. Heat : Excessive heat waves can cause problems with drip irrigation. 7. Blockages : Blockages in pipes can lead to crop loss if not identified in time.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46991", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-w iven below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) The Brahmaputra River has many tributaries, including: 1. Right tributaries: The Lohit, Dibang, Subansiri, Jiabharali, Dhansiri, Manas, Torsa, Sankosh, and Teesta 2. Left tributaries: The Burhidihing, Desang, Dikhow, Dhansiri, and Kopili 3. North bank tributaries: The Subansi ri, Siang, Kameng, and Dhansiri 4. South bank tributaries: The Noa De hing, Buridehing, Debang, and Dik how Other tributaries of the Brahmaputra include: Parlung Tsangpo, Pengbo River. The Brahmaputra originates in the Kailash ranges of the Himalayas at an elevation of 5,300 meters. It flows through Tibet, enters India through Arunachal Pradesh, and then flows through Assam and Bangladesh before joining the Bay of Bengal.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46993", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css t of South India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It is one of the most important trees in the tropical rain forest areas of South India.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) Red Sanders (Pterocarpus santalinus) is a small to medium-sized tree that\u0026rsquo;s native to the southern Eastern Ghats mountain range in South India. It is Mostly found in Andhra Pradesh. It\u0026rsquo;s also known as red sandalwood, red saunders, Yerra Chandanam, Chenchandanam, Rakta Chandana, and saunderswood. Red Sanders is India\u0026rsquo;s most exploited tree species, driven by both domestic and international demand. It\u0026rsquo;s used for timber, shamisen bridges and necks, and medicinal values. The critical threats to Red Sanders are illegal timber extraction, habitat loss, and degradation. In December 2022, following the amendment to the Wildlife (Protection) Act 1972, Red Sanders is now listed in Schedule IV. It can grow in a variety of climates, but prefers hot and dry conditions with a mean annual temperature range of 26\u0026ndash;28\u0026deg; C and a maximum temperature of up to 45\u0026deg; C. It also prefers a rainfall range of 500\u0026ndash;1000 mm annually, though it can grow in areas with higher rainfall (\u0026gt;1800 mm). Red Sanders grows in a variety of soils, including sandy loam, stony soils, and well-drained red soils with gravelled loam. It prefers very shallow to shallow brown colored soils that are friable in nature, and is not found in compact soils.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id" e observation and understanding of the Universe. What is Event horizon? In the context of black holes, the event horizon is the boundary where the velocity needed to escape exceeds the speed of light. This means that anything that passes into the event horizon is doomed to stay inside it, even light. The term was coined in the 1950s by Wolfgang Rindler. In 1784, John Michell proposed that gravity can be strong enough in the vicinity of massive compact objects that even light cannot escape. Singularity : A singularity is a point in space-time where the laws of physics break down. It is a theoretical concept that describes the center of a black hole, where the density and curvature of space-time become infinite. The study of singularities helps us understand the nature of black holes and the behavior of matter and energy under extreme conditions. What is String Theory? String theory is a theoretical framework in physics that describes the universe as being made up of tiny vibrating strings. These strings are smaller than subatomic particles and are said to create matter, energy, and phenomena like electromagnetism and gravity. String theory aims to unify all four forces and, in doing so, unify general relativity and quantum mechanics. It reimagines reality by replacing subatomic particles with one dimensional strings and describing how these strings interact with each other and move through space. String theory also assumes that the universe has nine dimensions of space, but six of those dimensions are very small and curled up on themselves. This hypothesis suggests that the existence of additional dimensions may lead to observable phenomena. The Standard Model of Particle Physics : It is a theory that describes the universe\u0026rsquo;s most basic building blocks. It explains how quarks and leptons make up all known matter. Quarks make up protons and neutrons, while leptons include electrons. The Standard Model also includes the electromagnetic, strong, and weak forces and their carrier particles. It explains how these forces act on all matter particles.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46996", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\ let timerInterval = null;

const el = id => document.getElementById(id);

/* format mm:ss */
function fmt(s){
  const m = Math.floor(s/60);
  const sec = s%60;
  return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
}

/* Timer */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    seconds++;
    el("timer").textContent = fmt(seconds);
  },1000);
}

/* initialize */

}

    div.innerHTML = `<div class="custom-radio" aria-hidden="true"></div><div style="flex:1">${q[k]}</div>`;
    // click anywhere on option selects
    div.addEventListener("click", () => selectOption(q, idx+1, div));
    opts.appendChild(div);
    // if previously answered, mark selected
    const qid = q.id ?? i;
    if(answers[qid] === String(idx+1)) div.classList.add("selected");
  });

  highlightPalette();
}

/* selecting option */
function selectOption(q, val, div){
  const qid = q.id ?? current;
  answers[qid] = String(val);
  // clear previous selections visually
  Array.from(el("options").children).forEach(o => o.className = "opt");
  div.classList.add("selected");
  // immediate feedback in quiz mode
  if(isQuiz) showFeedback(q, val);
  highlightPalette();
}

/* show correct/wrong coloring and explanation */
function showFeedback(q, val){
  const opts = Array.from(el("options").children);
  opts.forEach((o, idx) => {
    o.classList.remove("correct","wrong");
    const idx1 = idx+1;
    if(String(q.answer) === String(idx1)){
      o.classList.add("correct");
    } else if(String(val) === String(idx1)){
      o.classList.add("wrong");
    }
  });
  if(q.solution_text){
    el("explanation").innerHTML = `<strong>Explanation:</strong> ${q.solution_text}`;
    el("explanation").style.display = "block";
  }
}

/* Submit flow */
function submitQuiz(){
  // stop timer
  if(timerInterval) clearInterval(timerInterval);

  let correct = 0, wrong = 0, totalMarks = 0;
  QUESTIONS.forEach((q, i) => {
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    if(isCorrect) correct++;
    else if(ans) wrong++;
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);
    if(isCorrect) totalMarks += cs;
    else if(ans) totalMarks -= ns;
  });

  const attempted = Object.keys(answers).length;
  const unattempted = QUESTIONS.length - attempted;
  const accuracy = attempted ? ((correct/attempted) * 100).toFixed(1) : "0.0";

  // build review HTML
  let reviewHTML = `<div class="card"><h3 style="color:var(--accent);margin:0 0 10px">Results Summary</h3>
    <div class="stats">
      <div class="stat"><h4>Correct</h4><p>${correct}</p></div>
      <div class="stat"><h4>Wrong</h4><p>${wrong}</p></div>
      <div class="stat"><h4>Unattempted</h4><p>${unattempted}</p></div>
      <div class="stat"><h4>Accuracy</h4><p>${accuracy}%</p></div>
      <div class="stat"><h4>Total Marks</h4><p>${totalMarks}</p></div>
      <div class="stat"><h4>Time</h4><p>${fmt(seconds)}</p></div>
    </div></div>`;

  QUESTIONS.forEach((q,i)=>{
    const qid = q.id ?? i;
    const ans = answers[qid];
    const isCorrect = ans && String(ans) === String(q.answer);
    const cs = Number(q.correct_score ?? 1);
    const ns = Number(q.negative_score ?? 0);

    reviewHTML += `<div class="card"><div style="font-weight:700;margin-bottom:8px">Q${i+1}: ${q.question}</div>`;
    ["option_1","option_2","option_3","option_4","option_5"].forEach((k,j)=>{
      if(!q[k]) return;
      const idx = j+1;
      const isOptCorrect = String(idx) === String(q.answer);
      const isUser = ans && String(idx) === String(ans);
      let style = "padding:8px 10px;margin:6px 0;border-radius:8px;";
      if(isOptCorrect) style += "border:2px solid var(--success);background:rgba(31,158,90,0.12);";
      else if(isUser && !isOptCorrect) style += "border:2px solid var(--danger);background:rgba(200,45,63,0.12);";
      else style += "border:1px solid #eee;background:#fafbfd;";
      reviewHTML += `<div style="${style}">${q[k]}</div>`;
    });
    const score = isCorrect ? `<span style="color:var(--success)">+${cs}</span>` : (ans ? `<span style="color:var(--danger)">-${ns}</span>` : `<span style="color:var(--muted)">0</span>`);
    reviewHTML += `<div style="margin-top:8px"><strong>Score:</strong> ${score}</div>`;
    if(q.solution_text) reviewHTML += `<div class="explanation" style="display:block;margin-top:8px"><strong>Explanation:</strong> ${q.solution_text}</div>`;
    reviewHTML += `</div>`;
  });

  el("results").innerHTML = reviewHTML;
  el("results").style.display = "block";
  el("quizCard").style.display = "none";
  // hide bottom nav
  el("floatBar").style.display = "none";

  // replace header controls with results controls (Re-Attempt, Download, Print)
  const header = el("headerControls");
  header.innerHTML = "";
  const left = document.createElement("div");
  left.style.display = "flex";
  left.style.alignItems = "center";
  left.style.gap = "10px";
  const title = document.createElement("h1");
  title.textContent = QUIZ_TITLE;
  left.appendChild(title);

  const right = document.createElement("div");
  right.style.display = "flex";
  right.style.alignItems = "center";
  right.style.gap = "10px";

  const retry = document.createElement("button");
  retry.className = "btn";
  retry.textContent = "Re-Attempt";
  retry.onclick = ()=> location.reload();

  const dl = document.createElement("button");
  dl.className = "btn";
  dl.textContent = "Download";
  dl.onclick = downloadResults;

  const pr = document.createElement("button");
  pr.className = "btn";
  pr.textContent = "Print";
  pr.onclick = ()=> window.print();

  right.appendChild(retry);
  right.appendChild(dl);
  right.appendChild(pr);

  header.appendChild(left);
  header.appendChild(right);
}

/* Download current results page as .html named after quiz title */
function downloadResults(){
  const head = document.head.outerHTML;
  const resultsHtml = el("results").outerHTML;
  const pageHtml = `<!doctype html><html>${head}<body><div style="padding:20px;max-width:1000px;margin:auto">${resultsHtml}</div></body></html>`;
  const blob = new Blob([pageHtml], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = String(QUIZ_TITLE).replace(/[^a-z0-9]/gi,"_");
  a.href = url;
  a.download = `${safe}_results.html`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* attach DOM listeners */
function attachListeners(){
  el("nextBtn").addEventListener("click", ()=> { if(current < QUESTIONS.length-1) renderQuestion(current+1); });
  el("prevBtn").addEventListener("click", ()=> { if(current > 0) renderQuestion(current-1); });
  el("clearBtn").addEventListener("click", ()=> { delete answers[QUESTIONS[current].id ?? current]; renderQuestion(current); highlightPalette(); });

  el("paletteBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    togglePalette();
  });

  el("submitBtn").addEventListener("click", ()=>{
    const attempted = Object.keys(answers).length;
    el("submitMsg").textContent = `You attempted ${attempted} of ${QUESTIONS.length}. Submit?`;
    el("submitModal").style.display = "flex";
  });

  el("cancelSubmit").addEventListener("click", ()=> el("submitModal").style.display = "none");
  el("confirmSubmit").addEventListener("click", ()=> { el("submitModal").style.display = "none"; submitQuiz(); });

  el("modeToggle").addEventListener("click", ()=> {
    el("modeToggle").classList.toggle("active");
    isQuiz = el("modeToggle").classList.contains("active");
    // re-render the current question so immediate behavior toggles
    renderQuestion(current);
  });

  // close palette when clicking outside
  document.addEventListener("click", (ev) => {
    const pal = el("palette");
    if(!pal) return;
    if(pal.style.display === "flex"){
      const viewBtn = el("paletteBtn");
      if(ev.target !== pal && !pal.contains(ev.target) && ev.target !== viewBtn && !viewBtn.contains(ev.target)){
        pal.style.display = "none";
      }
    }
  });
}

/* Build palette buttons + summary */
function buildPalette(){
  const pal = el("palette");
  pal.innerHTML = "";
  for(let i=0;i<QUESTIONS.length;i++){
    const b = document.createElement("button");
    b.className = "qbtn";
    b.textContent = i+1;
    b.addEventListener("click", (e)=>{
      e.stopPropagation();
      renderQuestion(i);
      pal.style.display = "none";
    });
    pal.appendChild(b);
  }
  const summary = document.createElement("div");
  summary.id = "palette-summary";
  summary.style.marginTop = "8px";
  pal.appendChild(summary);
  highlightPalette();
}

/* color palette buttons and show summary */
function highlightPalette(){
  const pal = el("palette");
  if(!pal) return;
  const total = QUESTIONS.length;
  const attempted = Object.keys(answers).length;
  const notAttempted = total - attempted;
  Array.from(pal.children).forEach((child, idx) => {
    // skip summary
    if(child.id === "palette-summary") return;
    child.classList.remove("answered","current");
    const qid = QUESTIONS[idx].id ?? idx;
    if(idx === current) child.classList.add("current");
    else if(answers[qid]) child.classList.add("answered");
  });
  const summary = el("palette-summary");
  if(summary) summary.textContent = `Total: ${total} | Attempted: ${attempted} | Not Attempted: ${notAttempted}`;
}

/* toggle palette visibility */
function togglePalette(){
  const pal = el("palette");
  if(pal.style.display === "flex") pal.style.display = "none";
  else { pal.style.display = "flex"; highlightPalette(); }
}

/* start */
window.addEventListener("DOMContentLoaded", init);
</script>
