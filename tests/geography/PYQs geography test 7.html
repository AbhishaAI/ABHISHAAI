ect?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) Ocean acidification is a serious threat to marine life and human health. It\u0026rsquo;s also sometimes called \u0026ldquo;osteoporosis of the sea\u0026rdquo;. Ocean acidification is the gradual decrease in the pH level of the ocean. This process is caused by the absorption of carbon dioxide (CO2 ) from the atmosphere. Here\u0026rsquo;s how ocean acidification works: 1. The ocean absorbs CO2 from the atmosphere. 2. The CO2 reacts with water molecules to form carbonic acid. 3. The carbonic acid breaks down into a hydrogen ion and a bicarbonate ion. 4. The hydrogen ions lower the pH of the ocean, increasing its acidity. The average pH of the ocean\u0026rsquo;s surface has decreased from 8.15 to 8.05 between 1950 and 2020. The ocean\u0026rsquo;s average pH is currently around 8.1, which is basic or alkaline. However, as the ocean absorbs more CO2 , the pH decreases and the ocean becomes more acidic. The pH scale is logarithmic, so a decrease of one pH unit is a ten-fold increase in acidity. A substance with a pH of 7 is considered neutral, while an acid has a pH less than 7. Here are some reasons why ocean acidification is a concern: 1. Marine life : Ocean acidification decreases the amount of carbonate ions needed for marine life to form shells and skeletons. This makes it harder for marine organisms to form their shells and skeletons, and existing shells may begin to dissolve. This is a concern because these creatures play an important role in the food web of marine life. 2. Coral reefs : Ocean acidification inhibits the ability of corals to build their calcium carbonate structures, leading to coral bleaching and reduced reef growth. 3. Oxygen levels : Ocean acidification causes oxygen levels to dip, suffocating some marine species and ultimately leading to shrinking their habitats. Ocean acidification is primarily caused by the burning of fossil fuels and deforestation. When carbon dioxide in the atmosphere ends up in the ocean, it changes the pH, making the sea acidic and less hospitable to life. Cloud seeding and formation has nothing to do with acidification of oceans.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46922", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDirection facing the polestar\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDirection opposite to the polestar\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} le Star, also known as Polaris or the North Star, is a star that appears to be stationary above the Earth\u0026rsquo;s north pole. It is located on the imaginary line that extends through the planet and out of the north and south poles. The Pole Star is famous for remaining nearly stationary in the sky while the entire northern sky revolves around it. This is because it\u0026rsquo;s located nearly at the north celestial pole, the point around which the entire northern sky turns. The Pole Star is aligned with the Earth\u0026rsquo;s axis of rotation. So when we observe in its direction, we\u0026rsquo;re looking in the direction of north. It is not visible from the southern hemisphere. The convenient way now to reach his village is to walk in the direction keeping the polestar to his left.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46923", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRainfall throughout the year\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRainfall in winter only\u003c/p\u003e", nt} \u003c/style\u003e\u003cp\u003eExplanation : (D) The characteristic climate of the Tropical Savannah Region is a definite dry and wet season. The Tropical Savannah Region is located near the equator and is influenced by trade winds. The region experiences a wet season with heavy rainfall and a dry season with little to no rainfall. The wet season usually occurs in the summer months, while the dry season occurs in the winter months. The Tropical Savannah Region is also known as tropical grasslands and is found to the north and south of tropical rainforest biomes. It is characterized by grasslands with scattered trees, tall grasses, and sparse trees. The largest areas of savanna are found in Africa, South America, Australia, India, the Myanmar (Burma)\u0026ndash;Thailand region in Asia, and Madagascar. Some animals that live in the tropical savanna include: Wildebeest, Warthogs, Elephants, Zebras, Rhinos, Gazelles, Hyenas, Cheetahs, Lions, Leopards.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46924", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eCultivation of both cash crops and food crops\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\ "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) The chief characteristic of mixed farming is the integration of crop production and animal rearing on the same farm. Mixed farming involves: 1. Growing food or cash crops, feed crops, and livestock on the same farm 2. Rearing animals for meat, eggs, or milk 3. Using the dung from cattle to fertilize the crops 4. Using agricultural weeds as feed for the livestock.In mixed farming at least 10% of its gross income must be contributed by livestock activity. The upper limit being 45% under Indian condition. So the farm on which at least 10 to 49% income is found from livestock is called mixed farm. Mixed farming is practiced mostly in Asian countries like India, China, and Indonesia.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46925", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following crops of India : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Groundnut\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Sesamum\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Pearl millet\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above is/are predominantly rainfed crop/crops?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) Rainfed crops are crops that are grown using rainwater. Rainfed agriculture is a type of farming that relies on rainfall for water. It provides a significant portion of the food consumed by poor communities in developing countries. Rainfed agriculture includes both permanent crops and annual crops. Some examples of rainfed crops include: 1. Permanent crops: Rubber, tea, and coffee 2. Annual crops: Wheat, maize, and rice Rainfed agriculture can be practiced in arid and semi-arid regions with limited and unpredictable rainfall. Crops in dryland agriculture are specifically adapted to survive in water-limited conditions. About 50% of India\u0026rsquo;s net sown area is rainfed. This means that about 70 million hectares of India\u0026rsquo;s 329 million hectares of geographical area is rain-fed. Groundnut, sesame, and pearl millet are all predominantly rainfed crops in India. Here is some information about these crops: Groundnut : A rainfed kharif crop that is sown from May to June, depending on the monsoon rains. It is also grown as an irrigated crop between January and March, and between May and July. Groundnut is the main vegetable oil crop in India, and about 85% of its area is rainfed. Sesame : A rainfed kharif crop in northern India, and grown from September to January in central and western regions. Sesame can withstand drought after establishment, but is susceptible to hail damage at all stages of growth. Pearl millet : Mainly cultivated in India under rainfed conditions during the rainy season (kharif). Between 1998 and 2017, 92% of the yearly cultivated surface was rainfed.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subj n_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following crops of India : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Cowpea\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Green gram\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Pigeon pea\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above is/are used as pulse, fodder and green manure?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) All three crops, cowpea, green gram, and pigeon pea, are used as pulses, fodder, and green manure in India. Here is some information about each crop: Cowpea ; This Kharif crop is grown across India for seeds, green pods, fodder, and organic manure. Cowpeas are tolerant of sandysoil and low rainfall, making them an important crop in semiarid regions. The whole plant is used as forage for animals. Pusa Phalguni and Pura Barsati are crop varieties of Cowpea. Green gram : Also known as \u0026ldquo;Moong Dal\u0026rdquo;, this protein rich bean is a main pulse crop in India. It can be cultivated in a wide range of soils, and is consumed in India as a whole or split pulse. Green Gram can be cultivated in a wide range of soils, from black cotton soils in North India red laterite soils in South India and sandy soils in Rajasthan Pigeon pea : Also known as \u0026ldquo;Toor Dal\u0026rdquo;, this crop is scientifically known as Cajanus Cajan. It is the second most important pulse crop in India, and is mainly eaten as a split pulse as \u0026ldquo;dal\u0026rdquo;. In India Pigeon Pea is more popular as Arhar or red gram In India, split pigeon peas (toor dal) are one of the most popular pulses. The split dried seeds are used as a lentil, in dishes such as sambar (lentil soup) In agriculture, green manure is a crop that is specifically cultivated to be incorporated into the soil while still green. The primary goal is to add organic matter to the soil.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46927", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArunachal Pradesh\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAssam\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} on_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) Arunachal Pradesh is located on the same latitude as northern Rajasthan. The latitudethat passes through northern Rajasthan is around 27\u0026deg; North, and much of Arunachal Pradesh is within this latitude. Arunachal Pradesh is a state in northeast India. It\u0026rsquo;s known for its dense forest cover, with over 80% of its area covered by forests. This makes it one of the most forested states in India. A significant portion of the forest cover in Arunachal Pradesh is part of the Protected Area Network, which includes national parks, wildlife sanctuaries, and other types of protected areas. According to a 2021 report from the Forest Survey of India, Arunachal Pradesh\u0026rsquo;s forest cover is 66,430.67 square kilometers, which is 79.33% of its total geographical area. This is a 257 square kilometer decline from the 2019 assessment.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46928", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 and 4 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhen you travel in Himalayas, you will see the following : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Deep gorges\u003c/p\u003e\r\n\r\n\u003cp\u003e2. U-turn river courses\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Parallel mountain ranges\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Steep gradients causing land-sliding\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above can be said to be the evidence for Himalayas being young fold mountains?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) The Himalayas are a range of young, structurally folded mountains that run in a west-east direction from the Indus to the Brahmaputra. The Himalayan landscape is susceptible to landslides and earthquakes because the northward movement of the Indian plate puts continuous stress on the rocks. All of the above are evidence that the Himalayas are young fold mountains: 1. Deep gorges : These are formed by the continuous erosion of rivers, which is a characteristic of young fold mountains.Over time, water has carved out these deep channels, indicating that the Himalayas have not been around for a long period. 2. 3. 4. U-turn river courses : Himalayan rivers often shift their beds and take U-turn-like shapes. The steep gradients and unstable nature of the mountains cause the rivers to change their course frequently. As the mountains continue to rise and erode, the rivers are forced to change their paths, creating u-turns. T his phenomenon is commonly observed in the Himalayas, indicating their recent formation. Parallel mountain ranges ; T he Himalayas have three parallel ranges: 1. 2. 3. the Greater Himalayas, the Lesser Himalayas, and the Shivalik hills. T hese ranges run roughly parallel to each other, separated by deep valleys and gorges. T his pattern is indicative of the folding and uplifting of the Earth\u0026rsquo;s crust, which is a characteristic feature of young fold mountains. Over time, the mountains will continue to rise and erode, eventually merging into a single range. Steep gradients causing land-sliding :T he Himalayas are still growing vertically due to the earth\u0026rsquo;s tectonic forces. This causes steep gradients and land sliding. T his is a common phenomenon in young fold mountains, as they are still undergoing geological processes that shape the landscape.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46929", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;The duration of the monsoon decreases from southern India to northern India.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. The amount of annual rainfall in the northern plains of India decreases from east to west.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) T he Indian summer monsoon typically lasts from June to September. The southern part of India receives rainfall earlier and for a longer duration than the northern part. T his is because the southern part of India is closer to the sea. T he monsoon rains begin to recede from North India at the beginning of October. T he monsoon in India extends for an average of 100-120 days. Large areas of western and central India receive more than 90% of their total annual precipitation during the monsoon season. Southern and northwestern India receive 50%-75% of their total annual rainfall during the monsoon season. T he amount of annual rainfall in the northern plains of India decreases from east to west. This is because the moisture content of the winds decreases as they move inland.T he Bay of Bengal branch of the southwest monsoon winds move northeast and then return westwards, covering the northern plains. As the winds move westwards, their moisture content decreases with each rain. T his results in low rainfall when moving westwards. T he northern plains stretch from the arid and semi-arid regions of Rajasthan in the west to the Brahmaputra valley in the east. T he average width of these plains ranges between 150-300 km. T he city of Jaisalmer in the Rajasthan state of India receives the lowest rainfall in the country, with an annual rainfall of 210 mm. India\u0026rsquo;s average annual rainfall is around 115 inches (2900 mm), but it varies from 50 inches (1270 mm) in the western Himalayas to 160 inches (4000 mm) in the northeast. T he highest rainfall occurs along the west coast, on the Western Ghats, and in the sub-Himalayan areas of the northeast and the hills of Meghalaya. The western coast and northeastern India receive over 400 cmof rainfall annually. However, it is less than 60 cm in western Rajasthan and adjoining parts of Gujarat, Haryana, and Punjab. Mawsynram in the southern range of the Khasi hills receives the highest average rainfall x-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eRevolution of the earth on a titled axis\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eVariations in the length of daytime and nighttime from season to season are due to.............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) The Earth\u0026rsquo;s axial tilt is the primary cause of variations in the length of day and night from season to season. The Earth\u0026rsquo;s axis is tilted 23.5 degrees with respect to the plane of its orbit around the sun. This tilt causes the Earth\u0026rsquo;s polar regions to face the sun for long periods during the summer and away from the sun during the winter. Earth\u0026rsquo;s rotation : It is the movement of the planet around its axis. It takes Earth 24 hours to complete one rotation. This is equal to one day. Earth\u0026rsquo;s axis runs from the North Pole to the South Pole. The North Pole is where the axis meets the surface of the Earth in the Northern Hemisphere. The South Pole is where the axis meets the surface of the Earth in Antarctica. Earth\u0026rsquo;s axis is tilted at a 23.5\u0026deg; angle. It takes Earth about 365 days to complete one revolution around the Sun. As Earth rotates, each area of its surface gets a turn to face and be warmed by the sun. This is important to all life on Earth. Earth\u0026rsquo;s rotation is slowing slightly over time. This is due to the tidal effects the Moon has on Earth\u0026rsquo;s rotation. Atomic clocks show that the modern day is longer by about 1.7 milliseconds than a century ago. The Earth\u0026rsquo;s revolution around the sun is elliptical : It is taking 365.256 days to complete one revolution. The Earth\u0026rsquo;s orbit is elliptical due to the original force that ejected it from the solar disc. If the momentum of this ejection had been greater, the Earth\u0026rsquo;s orbit would have been more elliptical, or it might have been ejected from the solar system entirely.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46931", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIs found in atmosphere as moisture and clouds\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-wo /p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) The largest proportion of Earth\u0026rsquo;s remaining freshwater exists as groundwater. Groundwater is the largest proportion of freshwater on Earth because of its accessibility, global distribution, and vast reservoirs. While ice caps and glaciers contain the majority of freshwater, they are not directly accessible. Here are the percentages of each water reservoir: 1. Oceans: 97.20% 2. Ice Caps/Glaciers: 2.00% 3. Groundwater: 0.62% 4. Freshwater Lakes: 0.01% 5. Inland seas/salt lakes: 0.01% 6. Atmosphere: 0.001% 7. Rivers: 0.0001%\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46932", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3, 5 and 6 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 4, 5 and 6 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3, 4, 5 and 6\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following :\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Electromagnetic radiation\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Geothermal energy\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Gravitational force\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Plate movements\u003c/p\u003e\r\n\r\n\u003cp\u003e5. Rotation of the earth\u003c/p\u003e\r\n\r\n\u003cp\u003e6. Revolution of the earth\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above are responsible for bringing dynamic changes on the surface of the earth?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) Electromagnetic Radiation: Radiation has both electric and magnetic fields and travels in waves. Electromagnetic radiation can vary in strength from low energy to high energy. It includes radio waves, microwaves, infrared light, visible light, ultraviolet light, x-rays, and gamma rays. Also called EMR. Electromagnetic radiation causes temperature change, Evapouration of water results in Precipitation, Formation of Metamorphic Rocks. It means Electromagnetic radiations bring dynamic changes to the surface of Earth. Geothermal Energy: The energy emanating from within the earth is the main force behind endogenic geomorphic processes. This energy is mostly generated by radioactivity, rotational and tidal friction and primordial heat from the origin of the earth. This energy due to geothermal gradients and heat flow from within induces diastrophism and volcanism in the lithosphere. Due to variations in geothermal gradients and heat flow from within, crustal thickness and strength, the action of endogenic forces are not uniform and hence the tectonically controlled original crustal surface is uneven. Gravitational Force: Gravity besides being a directional force activating all downslope movements of matter also causes stresses on the earth\u0026rsquo;s materials. Eg. Mass movement, Avalanche. Plate Movements: Plate movement results in continent building, Earthquake. Rotation of the Earth: Rotation of earth about the axis results in the uneven heating of earth surface causes Pressure difference and forms the Winds. Winds are associated with a phenomenon like Rainfall, Heat budget, Ocean currents etc. Revolution of the Earth: Earth rotates around the sun in an elliptical manner. When the distance between the sun and Earth is highest is called Aphelion and when the distance is smallest then is called Perihelion, which creates the difference in the intensity of sunlight that reaches Earth. Earth is bound by the Gravitational force of the sun causing the Tides in the ocean.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46933", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDesert margins, liable to strong wind action\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLow flat plains, close to stream courses, liable to flooding\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !impo  the slope of the land, following the contour lines. The purpose of contour bunding is to: 1. Reduce run-off 2. Increase water filtration 3. Reduce soil erosion and nutrient loss 4. Maintain soil fertility Contour bunding is a sustainable land management practice for marginal, sloping, and hilly land where the soil productivity is very low. It is suitable for sloping andhilly land with low rainfall and light textured soils. The bunds can be covered with perennial grasses or used for crop production.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46934", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe annual range of temperature in the interior of the continents is high as compared to coastal areas. What is/are the reason(s)? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Thermal difference between land and water\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Variation in altitude between continents and oceans\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Presence of strong winds in the interior\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Heavy rains in the interior as compared to coasts\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) Land heats and cools faster than water because it takes less energy to change the temperature of land. This difference affects the climate of different areas on Earth. Here are some reasons why land and water have different thermal properties: 1. Heat capacity: Water has a specific heat of 1 calorie per gram per 1 degree C (cal/g/\u0026deg;C). This is greater than dry soil, so water absorbs and releases heat more slowly than land. 2. Heat transfer: Water is a slow conductor of heat, so it needs to gain more energy than land to increase its temperature. 3. Solar radiation: Land gets more solar radiation than water. 4. Fluid: Water is fluid, allowing heat to be mixed to greater depth than on land. The differential heating of land and sea can produce distinct air pressure areas in different seasons. For example, as the sun moves north of the equator during the northern hemisphere spring, its energy rapidly heats India relative to surrounding oceans. This is the reason that the temperatures of the Oceans are moderate while that of continents is extreme. The moderating effect on temperature of the land due to proximity of the seas is called Maritime influence. The increasing effect on temperature of the land at interior of the continents is called Continental Influence.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46935", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone of the above produces the thunder\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDuring the thunderstorm, the thunder in the skies is produced by the.............. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Meeting of cumulonimbus clouds in the sky\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Lightning that separates the nimbus clouds\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Violent upward movement of air and water particles\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) A thunderstorm, also known as an electrical storm or a lightning storm, is a storm characterized by the presence of lightning and its acoustic effect on the Earth\u0026rsquo;s atmosphere, known as thunder. Relatively weak thunderstorms are sometimes called thundershowers. Thunderstorms occur in a type of cloud known as a cumulonimbus. They are usually accompanied by strong winds and often produce heavy rain and sometimes snow, sleet, or hail, but some thunderstorms produce little precipitation or no precipitation at all.The violent upward movement of air and water particles is associated with thunderstorms, but it doesn\u0026rsquo;t produce thunder by itself. Thunder is the loud noise that follows a flash of lightning. Thunderstorms occur when layers of warm, moist air rise quickly to cooler regions of the atmosphere. As the air moves upward, it cools, condenses, and forms cumulonimbus clouds. These clouds can reach heights of over 20 km (12.45 miles). When lightning occurs, it rapidly heats the surrounding air, causing it to expand explosively. This rapid expansion creates shock waves that travel through the air, which we perceive as thunder. Cumulonimbus clouds are large, dense, and vertically developed clouds that are associated with thunderstorms. However, the meeting of these clouds in the sky does not produce thunder.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46936", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3 and 4\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 4\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following statements regarding laterite soils of India are correct? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. They are generally red in colour,\u003c/p\u003e\r\n\r\n\u003cp\u003e2. They are rich in nitrogen and potash.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. They are well-developed in Rajasthan and UP.\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Tapioca and cashew nuts grow well on these soils\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) Laterite soil is a type of soil that is rich in iron and aluminum. It is often found in hot and wet tropical areas. Laterite soil is acidic and has a red appearance due to its high iron content. It can range in color from dark reddish brown to purple. Laterite soil contains around 90% of Iron, aluminum, titanium, and manganese oxides. It has a lower content of nitrogen, phosphorus, potassium, lime, and magnesia. Laterite soil is found in areas with heavy rainfall, particularly near the coasts of India. It is used to grow tropical crops like rubber, cashew, coffee, coconut, and tea. Laterite soil is found in areas with high temperatures and heavy rainfall. It\u0026rsquo;s mainly found in the Eastern Ghats and Western Ghats, as well as the southern parts of Maharashtra, Karnataka, Andhra Pradesh, West Bengal, Orissa, Jharkhand, Kerala, and Assam. Laterite soil is also found in the Rajmahal Hills, Vindhyas, Satpuras, and Malwa Plateau. It\u0026rsquo;s spread across 2.48 lakh sq km, mostly on the highest points of the Western Ghats, which are 1000 to 1500 m above mean sea level. Laterite soil is also used for growing cashew nuts in Andhra Pradesh, Tamil Nadu, and Kerala. It is also suitable for growing most dryland crops, including arecanut, banana, vegetables, tapioca, yams, pineapple, pepper, and fruit trees.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", 5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following crops :\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Cotton\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Groundnut\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Rice\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Wheat\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of these are Kharif crops?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) Cotton, groundnut, maize, and rice are examples of Kharif crops. Barley, gram, peas, and wheat are examples of Rabi crops. Kharif crops : These are agricultural crops that are planted during the monsoon season and harvested in the fall. They are also known as summer season crops.Kharif crops are well-suited to regions with heavy rainfall and warm climates. They are planted at the beginning of the southwest monsoon season, around the end of May to early June, and harvested after the monsoon rains beginning in October. Some examples of Kharif crops include: Rice, Maize, Sorghum, Pearl millet/ bajra, Finger millet/ragi, Arhar (pulses), Soyabean, Groundnut (oilseeds), Cotton. Kharif crops account for 60 percent of India\u0026rsquo;s grain output in a year. Rabi crops : T hey are also known as winter crops. T hey are sown in winter from October to December and harvested in summer from April to June. T hese crops are grown mostly in north and northwestern parts of India such as Punjab, Haryana, Himachal Pradesh, Jammu and Kashmir, Uttarakhand and Uttar Pradesh. Some examples of rabi crops include: Wheat, Gram, Barley, Peas, Mustard, Chickpea, Field pea, Lentil, Gobhisarson, Toria. Rabi crops require frequent irrigation because they are grown in dry areas.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46938", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to the usefulness of the by-products of sugar industry which of the following statements is/are correct? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Bagasse can be used as biomass fuel for the generation of energy.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp; Molasses can be used as one of the feedstocks for the production of synthetic chemical fertilizers.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Molasses can be used for the production of ethanol.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D)Bagasse as Biomass Fuel : Bagasse is a by-product of the sugar industry and is the fibrous residue that remains after sugarcane stalks are crushed to extract their juice. Bagasse is a rich source of cellulose and hemicellulose, making it an excellent source of biomass fuel. Bagasse can be burnt to generate steam, which can then be used to generate electricity. T his process is known as cogeneration, and it is an efficient way to generate electricity while also reducing the carbon footprint of the sugar industry. Molasses for Ethanol Production : Molasses is a thick, dark syrup that is a by-product of the sugar industry and is obtained during the process of refining sugarcane juice into sugar. Molasses is a rich source of fermentable sugars, making it an ideal feedstock for the production of ethanol. Ethanol can be used as a fuel additive or as a standalone fuel for vehicles, and it is a renewable and sustainable alternative to fossil fuels. T he production of ethanol from molasses is a value-added use of this by-product, which would otherwise be discarded. Molasses for Fertilizer Production :Molasses can also be used as a feedstock for the production of synthetic chemical fertilizers. T he process involves the fermentation of molasses, which produces organic acids that can be used to make fertilizers. T his is a sustainable and eco-friendly way to produce fertilizers, as it reduces the dependence on non-renewable resources such as fossil fuels.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46939", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} 03e\r\n\u003cp\u003eThermal power\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one among the following industries is the maximum consumer of water in India? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (D)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eAmong the listed industries, the thermal power industry is the maximum consumer of water in India. This is because large quantities of water are required in thermal power plants for cooling purposes, steam generation, and ash disposal. Water is used to condense steam back into water after it passes through turbines, and this process consumes enormous amounts of water continuously. In India, where coal-based thermal power plants dominate electricity generation, their extensive operation makes them the largest industrial users of water. Thus, statement (d) is correct. Engineering industry uses comparatively much less water, as it mainly requires water for cooling machinery, washing, and metal processing, but its overall consumption is far below that of the thermal power sector. Thus, statement (a) is incorrect. Paper and pulp industry also requires large quantities of water, particularly in the pulping and bleaching processes. However, though it is among the high water-consuming industries, it still ranks below the thermal power industry in total water consumption in India. Thus, statement (b) is incorrect. Textile industry uses water in dyeing, bleaching, and finishing processes. While the textile sector consumes substantial water locally, its total usage at the national scale remains less than that of thermal power generation. Thus, statement (c) is incorrect. Therefore, out of all the given options, thermal power plants are the largest consumers of water in India.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46940", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !imp u003e\r\n\r\n\u003cp\u003e2. Low sulphur content\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Low ash fusion temperature\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) Indian coal has the following characteristics: 1. High ash content: Indian coal has a high ash content, ranging from 20-40%. 2. 3. 4. 5. Low sulphur content: Indian coal has a sulphur content of less than 0.6%. High ash fusion temperature: Indian coal has a high ash fusion temperature of about 1,500\u0026deg;C. Low calorific value: Indian coal has a low calorific value. Low phosphorous content: Indian coal has low phosphorous content. On the basis of carbon content it can be classified into the following three types: 1. 2. Anthracite: It is the best quality of coal with the highest calorific value and carries 80 to 95% carbon content. It ignites slowly with a blue flame and found in small quantities in Jammu and Kashmir. Bituminous: It has a low level of moisture content with 60 to 80% of carbon content and has a high calorific value. Jharkhand, West Bengal, Odisha, Chhattisgarh and Madhya Pradesh have deposits of Bituminous.Lignite : It carries 40 to 55% carbon content and is often brown in colour with high moisture content thus, gives smoke when burnt. Rajasthan, Lakhimpur (Assam) and Tamil Nadu have deposits of Lignite. Peat : It is the first stage of transformation from wood to coal with low calorific value and less than 40% carbon content. Bituminous coal is the most commonly found coal in India. It\u0026rsquo;s found in the states of Jharkhand, Orissa, West Bengal, Chattisgarh, and Madhya Pradesh.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46941", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following statements : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Natural gas occurs in the Gondwana belts.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp; Mica occurs in abundance in Kodarma.\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Dharwars are famous for petroleum.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The correct answer is option 2, which is that mica occurs in abundance in Kodarma. Here\u0026rsquo;s some related information about the statements: Natural gas in Gondwana belts: Statement 1 is incorrect because natural gas is usually found in marine sedimentary rocks, not in Gondwana beds. Gondwana is known for its coal fields, not natural gas. The Gondwana rock system, also called the Carboniferous rock system, contains almost 98% of India\u0026rsquo;s coal reserves. The rock system was formed 250 million years ago and is named after the Gond people. The Gondwana rock system also contains iron ore, copper, and uranium. Mica in Kodarma: Mica occurs in abundance in Kodarma, Jharkhand. The mica mines in the Kodarma area contribute the largest amount of muscovite (locally known as \u0026ldquo;Ruby mica\u0026rdquo;) to the world. The Koderma district and the Lokai-Indarwa area cover the southern part of the Great Mica-Belt of Jharkhand, Bihar, and India. Mica is usually found in marine sedimentary rocks and not in Gondwana beds which are fresh water sedimentary deposits. India is one of the world\u0026rsquo;s leading suppliers of mica. Mica-bearing igneous rocks occur in AP, Bihar, Jharkhand, Maharashtra, and Rajasthan. Mica is used in toothpaste and cosmetics because of its glittery appearance. It also acts as a mild abrasive in toothpaste. Dharwars and petroleum: Statement 3 is incorrect because The Dharwar rocks are famous for their iron ore reserves. The Dharwar rocks are also rich in manganese, gold, zinc, lead, and silver. The Dharwar rocks are the oldest metamorphic rocks in India, dating back between 2.5 billion and 1.8 billion years. The bedrock in this region formed between 3.6 and 2.5 billion years ago. The Dharwar rocks are named after the Dharwar region of Karnataka. The Champions series, which contains gold mines, lies within the Dharwar system. The Champions system is named after the Champion reef in the Kolar Gold Fields. The Kolar Gold Fields contain one of the deepest gold mines in the world. However, the Dharwar system does not contain petroleum.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46942", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !impo ic elephants, leopards, and a variety of birds. The Ramganga and Kosi rivers flow through Jim Corbett National Park. The Ramgangais a lifeline for the park, flowing from the Doodhatoli ranges of the Himalayas and passing through the Corbett. It provides a constant water supply throughout the year, attracting predators, prey, and migratory birds. T he Kosi is a perennial river that flows from Dharapani Dhar, located in the Baramandal region of Uttarakhand. The Corbett\u0026rsquo;s wild use the Kosi to quench their thirst, and most of the local animals depend on it. Most of Ramnagar\u0026rsquo;s inhabitants live near the Kosi and work to support the growth of aquatic animals. T he Brahmaputra River flows through Kaziranga National Park in Assam, India. T he Brahmaputra\u0026rsquo;s ecosystem supports a variety of flora and fauna. Some say that a river safari on the Brahmaputra can offer new views of the park\u0026rsquo;s beauty. Kaziranga National Park is 40 kilometers long and 13 kilometers wide, with an area of 378.22 square kilometers. It\u0026rsquo;s located in both the Golaghat and Nagaon districts of Assam, and is about six hours from Guwahati.T he park is also home to other threatened species, including tigers, elephants, wild water buffalo, and bears. It\u0026rsquo;s also an important area for migratory birds, and is home to aquatic species like the Ganges River dolphin.Silent Valley National Park is a national park in Kerala, India. It is located in the Nilgiri hills. The Kunthipuzha River flows through Silent Valley National Park in Kerala. The river originates in the Nilgiri Hills and runs the length of the valley, eventually rushing down to the plains through a deep gorge. The river then merges into the Bharathapuzha River.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "i
