function initApp() {
    document.getElementById('auth-overlay').style.display = 'flex';
    document.getElementById('auth-overlay').style.opacity = '1';

    const wmContainer = document.getElementById('wm-tiled-bg');
    wmContainer.innerHTML = ''; 
    for(let i=0; i<450; i++) {
        const div = document.createElement('div');
        div.style.cssText = "font-size: 1rem; font-weight: 900; color: #222; padding: 25px; white-space: nowrap;";
        div.innerText = "ABHISHA AI";
        wmContainer.appendChild(div);
    }
}

function saveUser() {
    const val = document.getElementById('name-input').value;
    if (val.trim() !== "") {
        const name = val.trim().toUpperCase();
        document.getElementById('user-display-name').innerText = name;
        
        document.getElementById('welcome-msg').innerHTML = `
            <div style="opacity: 0.5; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; font-family: serif; color: #b8860b;">
                WELCOME TO ABHISHA AI BY ABHISHEK PATHAK
            </div>
            <div style="font-family: 'Georgia', serif; color: #fdf6e3; font-size: 3.5rem; font-weight: 900; text-transform: uppercase;">
                ${name}
            </div>
        `;
        
        document.getElementById('auth-motivational-quote').innerText = MOTIVATION[Math.floor(Math.random() * MOTIVATION.length)];
        document.getElementById('auth-overlay').style.display = 'none';
        document.getElementById('greet-gate').style.display = 'flex';
    }
}

function launchEngine() {
    document.getElementById('greet-gate').style.display = 'none';
    liveTimerInterval = setInterval(() => {
        totalSeconds++;
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        document.getElementById('rt-timer').innerText = `${m}m ${s}s`;
    }, 1000);
    renderFolio();
}

function renderFolio() {
    if (typeof QUESTIONS === 'undefined' || QUESTIONS.length === 0) return;
    
    const qData = QUESTIONS[qIdx];
    
    // Update Stats
    const acc = performance.attempted > 0 ? Math.round((performance.correct/performance.attempted)*100) : 100;
    document.getElementById('rt-accuracy').innerText = acc;
    document.getElementById('rt-progress').innerText = `${qIdx + 1}/${QUESTIONS.length}`;
    document.getElementById('quote-strip').innerText = `"${MOTIVATION[qIdx % MOTIVATION.length]}"`;

    // Display Question
    document.getElementById('q-text-display').innerHTML = qData.question;
    const grid = document.getElementById('opt-grid-display');
    const panel = document.getElementById('analysis-panel');
    grid.innerHTML = '';
    panel.style.display = 'none';

    // Solution Logic
    if (userAnswers[qIdx] !== undefined) {
        panel.style.display = 'block';
        const liveScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
        const doubtUrl = `https://t.me/Learner59?text=${encodeURIComponent("Doubt in Q" + (qIdx + 1) + ": " + qData.question.replace(/<[^>]*>/g, '').substring(0, 50))}`;
        
        document.getElementById('analysis-text-content').innerHTML = 
            `<div style="font-weight:900; color:#2e7d32; margin-bottom:10px;">LIVE SCORE: ${liveScore.toFixed(2)}</div>` + 
            qData.solution_text + 
            `<br><button onclick="window.open('${doubtUrl}')" style="margin-top:15px; background:#0088cc; color:white; border:none; padding:10px; cursor:pointer; font-weight:900;">ASK DOUBT ABHISHA AI</button>`;
    }

    // Render Options
    [1, 2, 3, 4].forEach(n => {
        const optText = qData[`option_${n}`];
        if(!optText) return;

        const btn = document.createElement('button');
        btn.style.cssText = "text-align: left; padding: 25px 35px; border: 2px solid #dcd1b3; background: white; cursor: pointer; font-size: 1.4rem; font-family: 'Georgia', serif; font-weight: 600; transition: 0.2s;";
        btn.innerHTML = `<span style="font-weight: 900; margin-right: 20px; color: #b8860b;">${String.fromCharCode(64+n)}.</span> ${optText}`;
        
        if (userAnswers[qIdx] !== undefined) {
            btn.disabled = true;
            if (n == qData.answer) {
                btn.style.background = "#e8f5e9";
                btn.style.border = "4px solid #2e7d32";
            }
            if (n == userAnswers[qIdx] && n != qData.answer) {
                btn.style.background = "#ffebee";
                btn.style.border = "4px solid #c62828";
            }
        } else {
            btn.onclick = () => {
                userAnswers[qIdx] = n;
                performance.attempted++;
                if(n == qData.answer) performance.correct++;
                performance.totalTime += Math.round((Date.now() - performance.qStartTime)/1000);
                performance.qStartTime = Date.now();
                renderFolio(); 
            };
        }
        grid.appendChild(btn);
    });
}

function navigate(dir) {
    const newIdx = qIdx + dir;
    
    if(newIdx >= 0 && newIdx < QUESTIONS.length) {
        qIdx = newIdx;
        performance.qStartTime = Date.now();
        renderFolio();
        window.scrollTo(0, 0);
    } else if (newIdx >= QUESTIONS.length) {
        showFinalReport();
    }
}

function toggleFocusMode() {
    const header = document.querySelector('header');
    const quote = document.getElementById('quote-strip');
    const bg = document.getElementById('wm-tiled-bg');
    const isHidden = header.style.display === 'none';
    header.style.display = isHidden ? 'flex' : 'none';
    quote.style.display = isHidden ? 'block' : 'none';
    bg.style.opacity = isHidden ? '0.25' : '0.05';
}

function showFinalReport() {
    const name = document.getElementById('user-display-name').innerText;
    const finalScore = (performance.correct * 2) - (performance.attempted - performance.correct) * 0.66;
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    document.body.innerHTML = `
        <div style="text-align:center; padding:60px 20px; font-family: 'Georgia', serif; background:#fdfcf8; min-height:100vh; color: #1b1b1b;">
            <h1 style="color:#b8860b; letter-spacing: 3px; font-size: 2.5rem;">YOUR UPSC COMPANION ABHISHA AI TEST REPORT</h1>

            <div style="background: white; max-width: 650px; margin: 0 auto; padding: 40px; border: 1px solid #dcd1b3; box-shadow: 0 15px 35px rgba(0,0,0,0.08);">
                <div style="font-size:2.5rem; font-weight: 900; margin-bottom: 10px;">FINAL SCORE: <span style="color:#2e7d32">${finalScore.toFixed(2)}</span></div>
                <div style="font-size: 1.3rem; margin: 30px 0; border-top: 1.5px solid #b8860b; border-bottom: 1.5px solid #b8860b; padding: 25px 10px;">
                    ALL THE BEST FOR <span style="color: #b8860b; font-weight: bold;">UPSC CSE PRELIMS 2026</span>!
                </div>
                <button onclick="location.reload()" style="background:#1b1b1b; color:#b8860b; padding:18px 60px; border:none; cursor:pointer; font-weight: 900;">RETAKE TEST</button>
            </div>
        </div>
    `;
}
</script>

r\n\t\u003cli\u003eThe in-situ method of conservation is also called an on-site conservation method.\u003c/li\u003e\r\n\t\u003cli\u003eIt means the conservation of biodiversity in their natural habitats itself.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eExamples: \u003c/strong\u003eNational parks, biosphere reserves, parks, sanctuaries.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eEx-Situ method of conservation:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt means the conservation of biological diversity outside their natural habitats through different techniques.\u003c/li\u003e\r\n\t\u003cli\u003e\u003cstrong\u003eExamples :\u003c/strong\u003e It includes Zoo, Captive breeding, Aquarium, Botanical garden, Seed, and Gene bank.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eBiosphere reserves :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eThey protect larger areas of natural habitat than a typical national park or animal sanctuary, and often include one or more national parks or reserves, along with buffer zones that are open to some economic uses. Protection is granted not only to the flora and fauna of the protected region, but also to the human communities who inhabit these regions, and their ways of life. In total there are 18 biosphere reserves in India.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eNational park :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a natural park in use for conservation purposes, created and protected by national governments. Often it is a reserve of natural, semi-natural, or developed land that a government declares or owns. Although individual countries designate their own national parks differently, there is a common idea: the conservation of \u0026lsquo;wild nature\u0026rsquo; for posterity and as a symbol of national pride. National parks are almost always open to visitors.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eWildlife sanctuary :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a protected area that is important for flora, fauna, or geological features. They are reserved and managed for conservation and to provide opportunities for study or research.\u003c/li\u003e\r\n\t\u003cli\u003eWildlife sanctuaries are known for wildlife conservation, which includes insects, animals, birds, and microorganisms of various species and genes.\u003c/li\u003e\r\n\t\u003cli\u003eThey protect animal habitats and their surroundings from any sort of disturbance. The capturing, killing, and poaching of animals is strictly prohibited in these regions.\u003c/li\u003e\r\n\t\u003cli\u003eTherefore, Biosphere reserves, national parks, wildlife sanctuaries, and other places are included in in-situ biodiversity conservation.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46902", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBhitarkanika\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u00 tion_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTwo important rivers one with its sources in Jharkhand and Known by a different name in Odisha, and another, with its source in Odisha merge at a place only a short distance from the coast of Bay of Bengal before flowing into the sea. This is an important site of wildlife and biodiversity and a protected area.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich one of the following could be this? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u003cstrong\u003eExplanation : (A)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eBhitarkanika Mangroves is a 650 square kilometer mangrove wetland in Odisha, India. It is located in the deltas of the Baitarani and Brahmani rivers, and is the second largest mangrove ecosystem in India.\u003c/li\u003e\r\n\t\u003cli\u003eThe Bhitarkanika Mangroves is a network of canals and creeks that are flooded by water from the Brahmani, Baitarani, Dhamra, and Patasala rivers. It is one of the most important Ramsar wetlands in India and was declared a Ramsar Site in 2002.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eThe Bhitarkanika Mangroves is a wildlife sanctuary that is home to many species of wildlife, including:\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Saltwater crocodiles, some of which can grow to 23 feet long\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Asian water monitors\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Numerous snakes\u003c/p\u003e\r\n\r\n\u003cp\u003e4. 215 bird species, including eight types of kingfishers\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eChandipur-on-sea :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is also known as Chandipur, is a resort town and beach in the Balasore district of Odisha, India. It\u0026rsquo;s located on the Bay of Bengal, about 16 kilometers from the Balasore Railway Station.\u003c/li\u003e\r\n\t\u003cli\u003eThe beach is unique because the water recedes up to 5 kilometers during the ebb tide and returns to fill the emptiness during high tide. This natural phenomenon happens twice a day, and visitors can walk on the sea bed.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eGopalpur-on-sea :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a beach resort in the Ganjam district of Odisha, India. It\u0026rsquo;s located on the Bay of Bengal coast, about 15 km from Berhampur.\u003c/li\u003e\r\n\t\u003cli\u003eGopalpur-on-sea is considered one of India\u0026rsquo;s most beautiful beaches. It\u0026rsquo;s known for its remoteness, peace, and offbeat crowd. The beach is surrounded by coconut and casuarina groves and is a popular nesting site for Olive Ridley Turtles.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\r\n\u003cp\u003e\u003cstrong\u003eSimlipal :\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cul\u003e\r\n\t\u003cli\u003eIt is a national park and tiger reserve in the Mayurbhanj district of Odisha, India. The park is 2,750 square kilometers in size and covers waterfalls. It is home to wild elephants and Royal Bengal tigers.\u003c/li\u003e\r\n\t\u003cli\u003eSimlipal is named after the Simul (silk cotton) tree. It was once a hunting ground for the rulers of the province.\u003c/li\u003e\r\n\u003c/ul\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46903", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt has a high rainfall that supports luxuriant vegetative growth\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt is a confluence of different biogeographical zones\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExotic and invasive species have not been introduced in this region\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt has less human interference\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Himalayan Range is very rich in species diversity. Which one among the following is the most appropriate reason for this phenomenon?\u003cstrong\u003e (UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (B)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Himalayan Range is one of the richest regions in the world in terms of biodiversity and species diversity. This is because it serves as a meeting point (confluence) of several major biogeographical zones \u0026mdash; the Palearctic, Indo-Malayan, and Oriental regions. The merging of these diverse ecological regions allows the coexistence of a wide variety of flora and fauna, both temperate and tropical, contributing to high species diversity. Thus, statement (b) is correct. Statement (a) mentions that the Himalayas have high rainfall supporting luxuriant vegetation, which is true for certain parts like the eastern Himalayas. However, rainfall varies greatly across the range \u0026mdash; the western Himalayas receive less rainfall and have dry conditions. Hence, rainfall alone cannot explain the overall species diversity. Thus, statement (a) is incorrect. Statement (c) says exotic and invasive species have not been introduced in this region, which is incorrect, as invasive species such as Lantana camara and Eupatorium have indeed spread in several Himalayan areas, affecting native vegetation. Thus, statement (c) is incorrect. Statement (d) states that the Himalayas have less human interference, which is partly true for high-altitude regions but not for the lower and middle Himalayas, where agriculture, tourism, and urbanization have increased significantly. Therefore, this cannot be the main reason for its biodiversity. Thus, statement (d) is incorrect. Hence, the Himalayan Range\u0026rsquo;s rich species diversity is primarily due to its location at the confluence of different biogeographical zones, making option (b) the most appropriate answer.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46904", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAndhra Pradesh\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGujarat\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eKarnataka\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTamil Nadu\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eA state in India has the following characteristics............\u0026nbsp;\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp; Its northern part is arid and semi arid.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp; Its central part produces cotton.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Cultivation of cash crops is predominant over food crops.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich one of the following states has all of the above characteristics?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) T he state of Gujarat satisfies all of the given conditions. Its northern part is arid and semi arid, its central part is a major cotton producing area, and cash crops dominate over food crops in the state. T he soils of Gujarat can be broadly classified into nine groups- 1. Black soil, 2. 3. Mixed red and black soils, Residual sandy soil,4 5. 6. 7. 8. 9. Alluvial soil, Saline soil, Lateritic soil, Hilly soil, Desert soil, Forest soil. T he predominant texture of North Gujarat\u0026rsquo;s soil is sandy loam to loam. Gujarat is mostly dry and has desert in the north-west part of the state. Gujarat accounts for almost 30% of total cotton production in the country. It is widely cultivated in almost all districts except part of Dangs and Valsad districts. \u0026nbsp;T he main crops grown in Gujarat include cotton, groundnut, milk and milk products and dates. These are all commercial crops.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46905", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe mangrove swamps separate the human settlements from the sea by a wide zone in which people neither live nor venture out.\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe mangroves provide both food and medicines which people are in need of after any natural disaster.\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe mangrove trees are tall with dense canopies and serve as an excellent shelter during a cyclone or Tsunami\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe mangrove trees do not get uprooted by storms and tides because of their extensive roots.\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eT he 2004 Tsunami made people realize that mangroves can serve as a reliable safety hedge against coastal calamities. How do mangroves function as a safety hedge? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) Mangrove forests are coastal wetlands that grow in tropical and subtropical regions. T hey are made up of trees and shrubs that live in the intertidal zone. Mangroves are also known as mangrove swamps, mangrove thickets, or mangals. Mangroves are salt-loving plants that grow in brackish to saline tidal waters. They are also called Halophytes. Brackish water is a mix of salt and fresh water, and can be found where rivers meet the ocean.Mangroves can tolerate salinity levels ranging from 2% to 90%. The trees that grow in Mangrove Forests are generally 8-20 meters high. These trees have thick leaves. They have blind roots which are called Pneumatophores. These roots help these trees to respire in anaerobic soils. The seeds of Mangrove Forests trees germinate in the trees themselves before falling \u0026ndash; This is called the Viviparity mode of reproduction. Mangroves grow in low-oxygen soil, where slow-moving waters allow fine sediments to accumulate. Mangrove forests are characterized by humid climates, saline environments, and waterlogged or muddy soils. Mangroves act as a safety hedge by protecting coastal areas from storms, hurricanes, and tsunamis. Their deep roots prevent them from being uprooted by storms and tides. Mangroves also help to bind and construct soils. Here are some ways mangroves protect coastal areas: 1. Stabilize shorelines: Mangroves prevent erosion and protect the land and people who live there from waves and storms. 2. Reduce wave energy: Mangroves\u0026rsquo; broad roots help reduce the energy stored in huge waves. 3. Act as a natural barrier: Mangroves absorb the impact of waves and storm surges, protecting coastal communities. 4. Act as a buffer zone: Mangroves arrest winds, slowing them down and minimizing impact on land. Mangroves are also important to the ecosystem. They provide essential habitat for thousands of species. The mangrove forests of Sundarbans are the largest mangrove forests in the world.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46906", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLa Nina is suspected to have caused recent floods in Australia. How is La Nina different from EI Nino? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. La Nina is characterized by unusually cold ocean temperature in equatorial Indian ocean whereas EI Nino is characterized by unusually warm ocean temperature in the equatorial pacific ocean.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. EI Nino has adverse effect on south west monsoon of India, but La Nina has no effect on monsoon climate.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) El Ni\u0026ntilde;o and La Ni\u0026ntilde;a are phases of the El Ni\u0026ntilde;o\u0026ndash;Southern Oscillation (ENSO) cycle. El Ni\u0026ntilde;o is the warm phase, while La Ni\u0026ntilde;a is the cool phase. El Ni\u0026ntilde;o occurs when the surface water in the equatorial Pacific becomes warmer than average and east winds blow weaker than normal. La Ni\u0026ntilde;a occurs when the water is cooler than normal and the east winds are stronger. El Ni\u0026ntilde;o events typically occur every 3 to 5 years and typically last for nine to twelve months. Small changes in sea-surface temperature can lead to big changes in the atmosphere. El Ni\u0026ntilde;o and La Ni\u0026ntilde;a events can dramatically affect weather patterns around the world. For example, El Ni\u0026ntilde;o conditions lead to wetter, snowier conditions and cooler maximum temperatures during the winter. La Ni\u0026ntilde;a conditions lead to drier and warmer temperatures overall, with notable extreme cold spells. There are also neutral phases of the cycle when conditions are closer to the long-term average. Approximately half of all years are described as neutral.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46907", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u ute to Chumphon Province. It is the narrowest part of the Malay Peninsula, with a distance from the west coast to the east coast of about 50 kilometers wide.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46908", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAndhra Pradesh\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eArunachal Pradesh\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMadhya Pradesh\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\ yle\u003e\r\n\u003cp\u003eWheat and Jute\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003ePaddy and Jute\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWheat and cotton\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe lower Gangetic plain is characterised by humid climate with high temperature throughout the year. Which one among the following pairs of crops is most suitable for this region? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) Climate and temperature play a significant role in determining the crops suitable for a particular region. T he lower Gangetic plain is characterized by a humid climate with high temperatures throughout the year. Paddy and jute are the most suitable cropsfor the lower Gangetic plain. The lower Gangetic plain is characterized by high humidity and heavy rainfall. The rich bhangar soil in the region is suitable for rice cultivation. Paddy and jute are both important crops that grow in many regions around the world. Paddy is another name for rice. The word \u0026ldquo;paddy\u0026rdquo; comes from the Malay word padi, which means \u0026ldquo;rice plant\u0026rdquo;. Paddy is a rice f ield, or rice, especially in the husk, either uncut or gathered. Jute is a fiber crop that can be harvested after a certain period of vegetative growth, usually between 100 to 150 days. Jute is a natural fiber crop that is biodegradable and annually renewable, making it an environmentally friendly crop. Jute grows best in temperatures between 15\u0026deg;C and 34\u0026deg;C, with a relative humidity of 65%. Jute cannot grow at temperatures below 15\u0026deg;C or above 43\u0026deg;C. Both rice and jute grow in heavily inundated places, particularly near river deltas. Why Paddy and Jute are suitable for this region?Paddy and jute are suitable for the lower Gangetic plain because of the region\u0026rsquo;s humid climate and high temperatures. The lower Gangetic plain is also characterized by heavy, well-distributed precipitation throughout the year. Paddy requires a lot of water, and the high humidity in this region ensures that the soil remains moist. Jute, on the other hand, requires a lot of water during the first few weeks of growth, and the abundant rainfall in this region ensures that the jute plants get the required amount of water.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46911", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": areas. Statement 2 is incorrect: Statement 2 : It is the only means of irrigation in dry land farming. Dryland farming is the production of crops without irrigation in regions that receive rainfall of less than 500 mm annually.Micro-irrigation is a modern method of irrigation that applies water through drippers, sprinklers, foggers, and other emitters on the surface or subsurface of the land. Sprinkler irrigation and drip irrigation are the commonly used micro irrigation methods. Micro-irrigation benefits : . . . . . . . Increase in crop yield. Reduces the loss of water. Fertilizer saving. Nutrient leaching can be reduced. Reduces pest problems Reduces soil erosion Help in reducing ground water depletion\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46912", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt greatly increases the crop production\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt makes some soils impermeable\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt raises the water table\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIt fills the air spaces in the soil with water\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSalinization occurs when the irrigation water accumulated in the soil evapourates, leaving behind salts and minerals. What are the effects of salinization on the irrigated land? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) Salinity is the presence of salts (such as sodium chloride, magnesium and calcium sulfates) and bicarbonates, in soil and water. Problems due to soil salinity : It can have several effects on irrigated land, including: Reduced crop productivity: Salinization can cause high osmotic stress, nutritional disorders, and toxicities in crops. It can also slow plant development and cause yield loss. Soil structure: The type of salt present can affect the soil structure. For example, sodium and magnesium ions can destroy soil structure, while calcium carbonate can improve it.Soil impermeability: Salinization can make some soils impermeable. Vegetation: Salinization can cause vegetation to die. Arable land: Salinization can remove arable land from production.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46913", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat is the difference between asteroids and comets?\u0026nbsp; \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Asteroids are small rocky planetoids, while comets are formed of frozen gases held together by rocky and metallic material.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Asteroids are found mostly between the orbits of Jupiter and Mars, while comets are found mostly between Venus and Mercury.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Comets show a perceptible glowing tail, while asteroids do not.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statement(s) given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) Asteroids and comets are both ancient objects in our solar system that formed about 4.5 billion years ago. Here are some differences between them: Composition: Asteroids are made of metals and rocky material, while comets are made of ice, dust, and rocky material. Size: Asteroids can range in size from Vesta, which is about 329 miles (530 kilometers) in diameter, to bodies that are less than 33 feet (10 meters) across. Location: Most asteroids are located in the asteroid belt between Jupiter and Mars.\u0026nbsp;Comets are located in the outermost regions of the solar system, either in the Oort Cloud or in the Kuiper belt. Appearance: Asteroids are dark in appearance and probably consist of clay and silicate rocks. Comets have a perceptible glowing tail, while asteroids do not.Orbit: As a comet gets closer to the Sun, it moves faster and faster. Gravity: Most of the gravity affecting a comet\u0026rsquo;s motion is due to the Sun.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46914", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWesterlies in southern hemisphere are stronger and persistent than in northern hemisphere. Why? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp; Southern hemisphere has less landmass as compared to northern hemisphere.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Coriolis force is higher in southern hemisphere as compared to northern hemisphere\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statement(s) given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) Westerlies are winds that blow from the west towards the east in the middle latitudes. They are also known as anti trades or prevailing westerlies. Westerlies are found in both the Northern and Southern Hemispheres, between 30 and 60 degrees latitude. They are fed by polar easterlies and winds from the high pressure horse latitudes. 1. Westerlies are permanent winds that blow from the subtropical high-pressure belts towards sub-polar low-pressure belts. T he westerlies in the southern hemisphere are stronger and more persistent than in the northern hemisphere because the southern hemisphere has less landmass. Here are some reasons why: Less land interference : T he westerlies in the southern hemisphere face less land interference than the northern hemisphere. Land interference can obstruct the flow of wind, slowing the westerlies.Less surface friction : T he southern hemisphere has more ocean and less land than the northern hemisphere. T his means there is less surface friction in the southern hemisphere, allowing the westerlies to blow with greater force. Higher Coriolis force : T he Coriolis force deflects the westerlies to the left. The Coriolis force acts identically in both hemispheres. T he Coriolis force is not stronger in the Southern Hemisphere than in the Northern Hemisphere. The Coriolis force is equal on both sides of the equator. T he Coriolis force is a result of the Earth\u0026rsquo;s rotation. The Earth spins quickly at the equator but not at all at the poles. This difference creates a centrifugal force, which is essentially the Coriolis force. T he Coriolis force is strongest at the poles and absent at the equator. It is directlyproportional to the angle of latitude. The Coriolis force is also inversely proportional to the speed of rotation at a given point on the Earth. The Coriolis force affects weather patterns, such as cyclones and trade winds. For example, the Coriolis force is why cyclones spin clockwise in the Southern Hemisphere and counterclockwise in the Northern Hemisphere.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46915", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} u003cp\u003e2. Radio waves have a very long wavelength.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statement(s) given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) The ionosphere facilitates radio communication because it contains charged particles that can reflect radio waves back to Earth. The ionosphere is an electrically charged layer of the Earth\u0026rsquo;s atmosphere that extends from 80\u0026ndash;400 km above the Earth\u0026rsquo;s surface. It contains ionized particles and free electrons that can reflect and refract radio waves back to Earth. The ionosphere can also reflect radio waves directed at an angle into the sky back toward the Earth. This means that radio waves can return to Earth beyond the horizon. Ozone is present in the stratosphere, which is a layer of the atmosphere that begins about 10\u0026ndash;16 kilometers (6\u0026ndash;10 miles) above Earth\u0026rsquo;s surface and extends up to about 50 kilometers (31 miles) altitude. Radio waves have the longest wavelengths in the electromagnetic spectrum. They can range in size from the length of a football to larger than the planet.Radio waves are a type of electromagnetic radiation best-known for their use in communication technologies, such as television, mobile phones and radios. Radio waves are a type of electromagnetic (EM) radiation with wavelengths in the electromagnetic spectrum longer than infrared light. They have frequencies from 300 GHz to as low as 3 kHz and corresponding wavelengths from 1 millimetre to 100 kilometres.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", ption_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhat could be the main reason(s) for the formation of African and Eurasian desert belt? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. It is located in the sub-tropical high pressure cells.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. It is under the influence of warm ocean currents.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statement(s) give above is/ are correct in this context?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) The main reason for the formation of the African and Eurasian desert belt is its location in the subtropical high pressure cells. The cells are characterized by sinking air masses, which suppress cloud formation and precipitation, resulting in arid conditions. The influence of warm ocean currents is also a contributing factor, but it is not the main reason. The belt\u0026rsquo;s formation is influenced by several factors, including: 1. Subtropical high pressure cells : These cells are characterized by sinking air masses that suppress cloud formation and precipitation, resulting in arid conditions. 2. Warm ocean currents : Warm ocean currents, such as the Canary Current and the Benguela Current, causeseawater to evapourate, leading to the formation of dry air. T he subtropical high-pressure cells on Earth are generally between 20\u0026deg; and 35\u0026deg; in both hemispheres. Here\u0026rsquo;s some more information about warm ocean currents: Origin: Warm currents originate near the equator because the Earth\u0026rsquo;s equator is warmed by the sun\u0026rsquo;s most intense rays. T he air at the equator is cooler than the air farther north or south. Direction: Warm currents move towards the poles or higher latitudes. Examples: The Gulf stream and the Kuroshio current are examples of warm ocean currents. Ocean currents are streams of water that f low continuously over the ocean surface in fixed directions. They are caused by a variety of forces acting on the water, such as wind, the Coriolis effect, breaking waves, cabbeling, and temperature and salinity differences.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46917", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBoth 1 and 2\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNeither 1 nor 2\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe jet aircrafts fly very easily and smoothly in the lower stratosphere. What could be the appropriate explanation?\u003cstrong\u003e(UPSC Prelims\u0026nbsp;2011)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. There are no clouds or water vapour in the lower stratosphere.\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;There are no vertical winds in the lower stratosphere.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statement(s) given above is/ are correct in this context?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) T he easy and smooth flying of jet aircraft in the lower stratosphere is that there are no vertical winds in the lower stratosphere. T his is because of the following reasons: 1. Composition of the lower stratosphere: The lower stratosphere is composed of a stable layer of airthat has a consistent temperature profile. This means that there are no significant changes in temperature with altitude, which results in the absence of vertical winds. 2. 3. Absence of weather disturbances: T he lower stratosphere is located above the troposphere, which is the layer of the atmosphere where most weather events occur. As a result, there are no clouds or water vapour in the lower stratosphere, which means that weather disturbances that can cause turbulence are absent. Jet stream: The jet stream is a high altitude wind that blows from west to east in the upper troposphere and lower stratosphere. It is a narrow band of strong winds that can reach speeds of up to 200 miles per hour. However, these winds are also relatively stable, which means that they do not cause turbulence.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46918", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e nd wind\u003c/p\u003e\r\n\r\n\u003cp\u003e3.\u0026nbsp;Density of ocean water\u003c/p\u003e\r\n\r\n\u003cp\u003e4. \u0026nbsp;Revolution of the earth\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above factors influence the ocean currents?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The correct answer is (b) - 1, 2 \u0026amp; 3 Factors affecting Ocean Currents 1. Rotation of Earth The Coriolis effect is a result of the rotation of the earth. Coriolis force causes the mater to move right in the northern hemisphere and left in the southern hemisphere. 2. Air pressure and wind Monsoon winds are responsible for the seasonal reversal of ocean currents in the Indian Ocean. Further influence of atmospheric pressure and insolation causes variation in winds movements which affects ocean currents eventually. 3. Density : Varying density caused by temperature and salinity in oceans led to vertical currents in oceans. 4. Revolution of Earth The Revolution of the earth does not influence the ocean currents. Notes : The primary forces that influence the currents are: . heating by solar energy, . wind; . gravity; . Coriolis force. The secondary forces that influence the currents are: . Temperature difference . Salinity difference\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46920", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100 overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNormally, the temperature decreases with the increase in height from the Earth\u0026rsquo;s surface, because............ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2012)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. The atmosphere can be heated upwards only from the Earth\u0026rsquo;s surface\u003c/p\u003e\r\n\r\n\u003cp\u003e2. There is more moisture in the upper atmosphere\u003c/p\u003e\r\n\r\n\u003cp\u003e3. The air is less dense in the upper atmosphere\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) The atmosphere can only be heated from the Earth\u0026rsquo;s surface. The Earth\u0026rsquo;s surface absorbs solar radiation and heats up. This heat then warms the air above it through conduction and convection. The heated air rises and spreads up through the atmosphere. This is because the Earth\u0026rsquo;s surface is heated by the sun, and the heat is transferred to the surrounding air through conduction and convection. As the air rises, it expands and cools due to the decrease in air pressure. This process is known as adiabatic cooling. The rate at which the temperature decreases with height is known as the lapse rate, and it varies depending on the location and weather conditions. On average, the lapse rate is about 6.5\u0026deg;C per 1000 meters of altitude. However, in some regions, such as the tropics, the lapse rate can be lower due to the high humidity and the presence of clouds. In addition to the adiabatic cooling, other factors can also affect the temperature profile with height.For example, the presence of inversion layers, where the temperature increases with height, can occur due to the trapping of warm air beneath a layer of cool air. This can happen during stable weather conditions, such as clear and calm nights. Overall, the temperature profile with height is an important factor in understanding atmospheric processes, such as cloud formation and precipitation, and it has significant implications for aviation, weather forecasting, and climate modeling.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46921", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img
