haruch, forming a broad 27km long estuary. Sardar Sarovar Dam is built on the river Narmada. The river is known as the \u0026lsquo;Lifeline of Madhya Pradesh and Gujarat\u0026rsquo;. T he Peninsular Drainage System is older than the Himalayan Drainage System. T he rivers like Chambal, Sind, Betwa, Ken, Son originate in the northern part of the peninsula and belong to the Ganga river system. Other prominent rivers of the peninsular region are - Mahanadi, Godavari, Krishna, and Kaveri. Common characteristics of peninsular rivers include - fixed course, absence of meanders, and non-perennial flow.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46944", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u phical connection between Loktak Lake and the Barail Range. Thus, statement 2 is incorrect. Namdapha National Park \u0026ndash; Dafla Hill : Namdapha National Park lies in Changlang district of Arunachal Pradesh, near the India\u0026ndash;Myanmar border, and is known for being one of the richest areas in biodiversity in the Eastern Himalayas. However, Dafla Hills are located in the western part of Arunachal Pradesh, near the border with Bhutan. Hence, Namdapha is not situated in the Dafla Hills. Thus, statement 3 is incorrect.\u003c/p\u003e\r\n\r\n\u003cp\u003eTherefore, the correct answer is A.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46945", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}  @font-face { font-family: \u0027serif\u0027;src: url(\u0027https://appx-content-v2.classx.co.in/fonts/serif.ttf\u0027) format(\u0027truetype\u0027); } \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}  @font-face { font-family: \u0027serif\u0027;src: url(\u0027https://appx-content-v2.classx.co.in/fonts/serif.ttf\u0027) format(\u0027truetype\u0027); }\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}  @font-face { font-family: \u0027serif\u0027;src: url(\u0027https://appx-content-v2.classx.co.in/fonts/serif.ttf\u0027) format(\u0027truetype\u0027); }\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}  @font-face { font-family: \u0027ser  with the oxygen levels will effect which species, and the level of each species that will exist and thrive. Water conditions : Factors such as water temperature, alkalinity, dissolved oxygen, ammonia levels, and turbidity directly impact fish production and overall pond health.Some examples of these fishing grounds are: 1. The Grand Banks of Newfoundland : This fishing ground is located at the meeting point of the Labrador Current and the Gulf Stream. 2. The Humboldt Current : This current flows along the western coast of South America and is known for its high productivity. 3. The Canary Current : This current flows along the western coast of Africa and is known for its high productivity.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46947", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"te "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (D) Equatorial forests are also known as evergreen forests because they receive rainfall year-round and don\u0026rsquo;t shed their leaves. Equatorial forests are located near the equator, where day length is constant and there is little variation. They can be found in Central and South America, southern Mexico, parts of the Caribbean, Southeast Asia, eastern Africa, and New Guinea. The world\u0026rsquo;s largest equatorial forests are found in the Amazon Basin, the Congo Basin, the Southeast Asian islands of Indonesia, and Papua New Guinea. Equatorial forests have several characteristics, including: 1. Climate: Equatorial forests are hot and humid, with temperatures ranging from 70\u0026ndash;90\u0026deg;F (21\u0026ndash;32\u0026deg;C) year-round. They receive more than 100 inches (2,500 mm) of precipitation annually. 2. Vegetation: The vegetation in equatorial forests is evergreen and tall, with hard wood and broad leaves. The trees can grow to a height of 30 50 meters. The vegetation is divided into four vertical strata, starting with the canopy of trees and ending with ferns on the ground. The trees have dense canopies that prevent sunlight from reaching the ground. 3. Fauna: Equatorial rainforests have a diverse fauna. 4. Human life: The forests support primitive people, such as hunter gatherers, and more advanced people who practice shifting cultivation. 5. Day length: The equatorial forest zone has a relatively constant length of day. 6. Weathering crust: The equatorial forest zone has a thick weathering crust.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46948", "image_check": "0", "image_link_1": " ion_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026ldquo;Climate is extreme, rainfall is scanty and the people used to be nomadic herders. \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2013)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e\u0026rdquo; The above statement best describes which of the following regions?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The statement \u0026ldquo;Climate is extreme, rainfall is scanty and the people used to be nomadic herders\u0026rdquo; best describes the Central Asian Steppe. The Central Asian Steppe is a harsh climate with little to no rainfall, dust storms, and temperatures ranging from -4\u0026deg;C to 50\u0026deg;C. The climate is continental, with extreme temperatures and vast differences between summer and winter temperatures. Summers are hot, with temperatures ranging from 18\u0026deg;C to 20\u0026deg;C, while winters are bitterly cold.Nomadic herding is a primitive subsistence activity where herders rely on animals for food, clothing, shelter, tools, and transport. Nomadic herders are people who travel from one place to another to graze their animals. The African savanna : It is a mixed woodland-grassland ecosystem. It\u0026rsquo;s the largest biome in southern Africa, covering 46% of the region and over a third of South Africa. The savanna is home to a wide variety of animals, including herbivores like zebras and wildbeests, and predators like lions and leopards. The savanna is popular with herbivores because of the diverse grasses that grow there during the wet season. The savanna is characterized by trees that are spaced far enough apart to allow light to reach the ground. This supports a layer of grasses. The savanna can be divided into three categories: 1. wet 2. dry 3. thornbush The North American Prairies : It is a large grassland region that stretches from the Appalachian Province to the Rocky Mountains. It includes the Great Plains and the Interior Lowlands of Canada, the United States, and Mexico. Prairies are temperate grasslands with moderate temperatures and rainfall, and few trees. They are mostly made up of grasses and wildflowers. The Siberian tundra : It is a treeless, marshy plain that covers the coastal plain of the central north region of Siberia. It is the world\u0026rsquo;s northernmost continental land and includes a polar desert, mountain and lowland tundra, wetlands, and larch forests. Tundra plants are short and group together to resist the cold temperatures. They can carry out photosynthesis at low temperatures and low light intensities. The growing seasons are short and most plants reproduce by budding and division rather than sexually by flowering.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46949", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{over ng\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Continental drift\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Glacial cycles\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) T he effects of continental drift : The planet has been impacted by continental drift in countless ways. It\u0026rsquo;s difficult to imagine. Animal evolution, geographic locations around the world, and climatic conditions have all been impacted by continental drift. Glacial cycle : T he paleontological evidence consists of changes in the geographical distribution of fossils. During a glacial period cold-adapted organisms spread into lower latitudes, and organisms that prefer warmer conditions become extinct or are squeezed into lower latitudes. T his evidence is also difficult to interpret because it requires (1) Sequences of sediments covering a long period of time, over a wide range of latitudes and which are easily correlated; (2) Ancient organisms which survive for several million years without change and whose temperature preferences are easily diagnosed; and (3) T he finding of the relevant fossils.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46951", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn India, the problem of soil erosion is associated with which of the following? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Terrace cultivation\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Deforestation\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Tropical climate\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the codes given below :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) Soil erosion is a natural process that occurs when the upper layer of soil is worn away.Human activities have increased the rate of soil erosion by 10\u0026ndash;50 times. In India, some of the major causes of soil erosion include: 1. 2. 3. Agriculture: Farming practices can disturb the ground. Unsustainable agricultural practices, such as the excessive use of chemical fertilizers, pesticides, and herbicides, can also contribute to soil degradation. Deforestation: Cutting down trees for agriculture, urbanization, and logging removes the protective canopy and exposes the soil to erosion by wind and water. Overgrazing: Overgrazing is another major cause of soil erosion in India. India is home to two types of erosion: 1. 2. sheet erosion. gully erosion. Gullies can cut clayey soils into deep creeps, making the area unusable for farming. Sheet erosion removes top soils across wide regions, which generally reduces production. Terrace cultivation :It is a method of growing crops on the sides of hills or mountains by planting them on graduated terraces built into the slope.Terrace cultivation is a labor-intensive method of cultivation, but it has been effectively used to maximize farmable land in varied terrains. It can also reduce soil erosion and water loss. Terrace cultivation involves cutting into the slopes of mountains or hills to create rows of level areas of flat land that can be used to plant crops. The steps prevent water from washing away the soil and plants. T his system also allowed them to build aqueducts, which carried water to each level.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46952", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEquatorial climate\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMediterranean climate\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMonsoon climate\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eAll of the above climates\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe seasonal reversal of winds is the typical characteristic of........... \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) T he seasonal reversal of winds is a typical characteristic of monsoons. Monsoons are seasonal changes in the wind direction of an area. They are part of a yearlong cycle of uneven heating and cooling of tropical and mid-latitude coastal regions. Monsoons always blow from cold, high pressure regions. They can bring either extremely wet or extremely dry weather to an area. T he best known example of a monsoon occurs over the Indian subcontinent. Equatorial climates : T hey are hot and wet all year, resulting in a humid climate. They are also known as tropical rainforest climates and are usually found within 10 to 15 degrees latitude of the equator. Here are some characteristics of equatorial climates:Temperature: Temperatures are fairly consistent all year, with only a few degrees of variation.Rainfall: It rains almost every day, resulting in high annual rainfall. Humidity: The rains, along with the hot weather, lead to the Equatorial climate being extremely humid. Seasons: Seasons do not exist.Equatorial climates are ideal weather for rainforests, and so most of the world\u0026rsquo;s rainforests are located in this region. T he year-round high temperatures and abundant rainfall support plant growth all year round. T hese areas usually have equatorial rainforests, which have very dense vegetation. Mediterranean climate : It is a temperate climate with mild, wet winters and dry summers. It\u0026rsquo;s oftenconnected to prevailing winds and weather patterns. Mediterranean climates are found on the west coasts of continents between 30\u0026deg; and 40\u0026deg; latitude, and along the shores of the Mediterranean Sea. They have warm summers with clear skies, cool nights, and little rain. Mediterranean climates have three-fourths of their annual precipitation concentrated between late autumn and spring. Mediterranean-type ecosystems (MTEs) occur in five regions of the world: 1. California 2. Central Chile 3. The Mediterranean Basin 4. The Cape Region of South Africa 5. Southwestern and South Australia\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "e m maize that can be converted into ethanol or biodiesel. The type of alcohol in the alcoholic drinks we drink is a chemical called ethanol. To make alcohol, you need to put grains, fruits, or vegetables through a process called fermentation, the common source of ethanol is maize and other grains.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46954", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2, 3 and 4 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle typ p: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The Sustainable Sugarcane Initiative (SSI) is a method of sugarcane production that aims to increase yields while reducing chemical inputs and water usage. SSI is a credit plus approach from NABARD that combines twin drip irrigation systems with agronomic practices.Sustainable Sugarcane Initiative aims to: 1. Increase yields by at least 20% 2. Reduce chemical inputs by 25% 3. Save water by 940,000 m3 annually 4. Create rural jobs, especially for women 5. Improve land, water, and labor productivity 6. Reduce pressure on water resources 7. Contribute to ecosystem recovery SSI involves: 1. Using fewer seeds 2. Raising seeds in a nursery 3. Using new planting methods, with wider seed spacing 4. Better water and nutrient management 5. Optimum utilization of fertilizers and land 6. Encouraging organic methods of nutrient and plant protection measures However, SSI is a farmer-driven method; and its advantages are dependent on the efforts of the cultivator himself rather. There is an application of Inorganic and organic fertilizers such as NPK (fertilizers) at the rate of 112 kg, 25 kg, and 48 kg per acre, respectively.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "4", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46955", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10" serve is home to several endangered species including the Bengal tiger, Asian elephant, and Hoolock gibbon Gumti Wildlife Sanctuary : It is a 389.54 square kilometer wildlife sanctuary in the south-eastern part of Tripura, India. It was notified as a sanctuary in 1988 and is spread across the districts of Dhalai, Khowai, and Gumti. The sanctuary is home to many animals and birds, including : Asian elephants, Sambar, Water buffalo, Deer, Phayre\u0026rsquo;s leaf monkeys, Serows, Wild goats, Migratory birds, Reptiles. Mount Saramati : It is a 3,826-meter (12,552-foot) tall peak in the Kiphire district of Nagaland, India. It\u0026rsquo;s also known as \u0026ldquo;F\u0026uuml;rim Shuwung,\u0026rdquo; which means \u0026ldquo;the mount of Snow\u0026rdquo; in the Yimchunger dialect. The Saramati-Awung Range is home to the thickest and biggest chunk of virgin forest in Nagaland. The forest is home to a variety of flora and fauna, including hollock gibbons, panthers, jungle cats, bison, sambar, barking deer, wild boars, and slender lorises.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46961", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 4 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich of the following have coral reefs? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Andaman and Nicobar Islands\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Gulf of Kachchh\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Gulf of Mannar\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Sunderbans\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below :\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (A) Coral reefs are large structures made of limestone that are created by coral polyps. They are often called the \u0026ldquo;rainforests of the sea\u0026rdquo; and support about 25% of all known marine species. Coral reefs are made up of colonies of hundreds to thousands of tiny individual corals, called polyps. These marine invertebrate animals have hard exoskeletons made of calcium carbonate, and are sessile, meaning permanently fixed in one place. Coral reefs in India are one of the most ancient and dynamic ecosystems of India. The coral reefs not only provide a sanctuary to a myriad of marine life but also play a key role in protecting the coastline from erosion.The Coral reefs in India are mainly restricted to the Andaman and Nicobar Islands, Gulf of Mannar, Gulf of Kutch, Palk Strait and the Lakshadweep islands. All of these reefs are Fringing reefs, except Lakshadweep which are Atolls. There are Patchy corals present along the inter-tidal areas of the central west coast like the intertidal regions of Ratnagiri, Gaveshani Bank etc. The Hermatypic corals are also present along the sea shore from Kollam in Kerala to Enayam Puthenthurai in Tamil Nadu. The coral reefs in the Andaman and Nicobar Islands are spread across several islands, including Havelock Island, Neil Island, and Barren Island. Gulf of Kachchh : It is a shallow inlet in the Arabian Sea, located on the western coast of India. The Gulf is home to several coral reefs, which are unique in their structure and species composition. The reefs in the Gulf of Kachchh are adapted to the harsh conditions of the region, including high salinity, temperature fluctuations, and strong currents. Gulf of Mannar : It is located in the Indian Ocean, between the southeastern coast of India and the northwestern coast of Sri Lanka. The Gulf is home to some of the most diverse and productive coral reefs in the world, with over 100 species of corals and more than 500 species of fish. The coral reefs in the Gulf of Mannar are threatened by several factors, including overfishing, pollution, and climate change. Sunderbans : It is a mangrove forest located in the delta of the Ganges, Brahmaputra, and Meghna rivers, on the eastern coast of India. While the Sunderbans is not known for its coral reefs, it is home to several other marine ecosystems, including estuaries, mudflats, and creeks.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46962", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u0 003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following rivers : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Barak\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Lohit\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Subansiri\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above flows/flow through Arunachal Pradesh?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (B)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe Barak River originates in the Manipur Hills and flows through the states of Manipur, Mizoram, and Assam, before entering Bangladesh, where it is known as the Surma and Kushiyara rivers. It does not flow through Arunachal Pradesh, hence this river is not part of the correct answer. The Lohit River originates in the Zayal Chu range of eastern Tibet, enters India through Arunachal Pradesh, and flows through the Lohit district before joining the Brahmaputra River near Dibrugarh in Assam. Therefore, the Lohit River does flow through Arunachal Pradesh, making this statement correct. The Subansiri River is the largest tributary of the Brahmaputra River and originates in the Tibetan Plateau, flowing through the Upper Subansiri district of Arunachal Pradesh before entering Assam. It is a major river system of the state and contributes significantly to its hydroelectric potential. Hence, this river also flows through Arunachal Pradesh. Thus, both the Lohit and Subansiri Rivers flow through Aru e Kaziranga National Park in Assam, forming part of the North-East India region. They are part of the Karbi Anglong Plateau and are geologically older than the Himalayas. Hence, this pair is correct. Thus, only Mahadeo Hills \u0026ndash; Central India and Mikir Hills \u0026ndash; North-East India are correctly matched. Therefore, the correct answer is 3 and 4.\u003c/p\u003e\r\n\r\n\u003cp\u003e\u003ccanvas height=\"18\" width=\"18\"\u003e\u003c/canvas\u003e\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46964", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 3 only\u0026nbsp;\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIf you travel through the Himalayas, you are likely to see which of the following plants naturally growing there? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp;Oak\u003c/p\u003e\r\n\r\n\u003cp\u003e2.\u0026nbsp;Rhododendron\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Sandal wood\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below:\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eExplanation : (A)\u0026nbsp;\u003c/p\u003e\r\n\r\n\u003cp\u003eThe oak tree is commonly found in the Himalayan region, particularly in the temperate zones of the Western and Central Himalayas. It thrives in altitudes between 1,500 to 3,000 meters, especially in states like Uttarakhand, Himachal Pradesh, and Jammu \u0026amp; Kashmir. The oak forests are an important part of the Himalayan ecosystem, providing shelter and food for numerous animal species. Hence, this plant naturally grows in the Himalayas and is correctly included. The rhododendron is another characteristic plant of the Himalayan region, growing mainly in the temperate and subalpine zones between 1,500 and 4,000 meters. It is especially abundant in Sikkim, Arunachal Pradesh, and Uttarakhand. Its bright flowers make it one of the most recognizable species in the mountain forests, and some varieties are even used for medicinal and ornamental purposes. Therefore, this plant also naturally grows in the Himalayas and is correctly included. The sandalwood tree, on the other hand, is not native to the Himalayan region. It is typically found in the tropical dry deciduous forests of southern India, particularly in Karnataka, Tamil Nadu, and parts of Kerala. Sandalwood requires warm and dry conditions, which are not suitable for the cold Himalayan environment. Hence, it does not naturally grow in the Himalayas. Thus, oak and rhododendron are the plants that naturally grow in the Himalayas, while sandalwood is not. Therefore, the correct answer is 1 and 2 only.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46965", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 only\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eNone\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the context of food and nutritional security of India, enhancing the \u0026lsquo;Seed Replacement Rates\u0026rsquo; of various crops helps in achieving the food production targets of the future. But what is/are the constraint/constraints in its wider/ greater implementation? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1.\u0026nbsp; There is no National Seeds Policy in place.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. There is no participation of private sector seed companies in the supply of quality seeds of vegetables and\u0026nbsp;planting materials of horticultural crops.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. There is a demand supply gap regarding quality seeds in case of low value and high volume crops.\u003c/p\u003e\r\n\r\n\u003cp\u003eSelect the correct answer using the code given below.\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The National Seeds Policy (NSP) of 2001 aims to ensure the growth of the seed sector in a liberalized economic environment. The NSP\u0026rsquo;s main objectives are: 1. To provide a suitable climate for the seed industry to utilize available and prospective opportunities 2. To safeguard the interests of Indian farmers 3. To conserve agro-biodiversity 4. To provide Indian farmers with a wide range of superior seed varieties, and planting materials in adequate quantity 5. To increase production of improved seed both in the public and private sectors 6. To make best quality seeds available to the farmers on timely basis, and at competitive price 7. To increase crop production, farmer\u0026rsquo;s productivity, per capita farm income and export earnings The NSP of 2002 states that all import of seeds and planting materials will be allowed freely subject to EXIM Policy Guidelines and the requirements of the Plants, Fruits and Seeds (Regulation of import into India) Order, 1989 as amended from time to time. The private sector seed companies supply quality seeds of vegetables but in a small volume. The private sector is the majority supplier of hybrid vegetable seeds. There is a demand-supply gap recording quality of seeds in case of low value and high volume crops such as wheat and rice. Farmers prefer to use their own preserve seeds due to the high demand and supply gap. Seed replacement rate (SRR) : It is the percentage of cropped area covered with quality seeds compared to the amount of farm-saved seeds used in a season. SRR is a measure of cropped area covered with quality seed. It has a direct effect on productivity and farmers\u0026rsquo; income, and can help farmers double their income. SRR is also directly proportional to productivity.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46966", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBlack Sea and Caspian Sea\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eBlack Sea and Mediterranean Sea\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGulf of Suez and Mediterranean Sea\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eGulf of Aqaba and Dead Sea\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eTurkey is located between............ \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) Turkey is located between the Black Sea and the Mediterranean Sea. The country is situated at the intersection of the Middle East, Caucasus, Balkans, and eastern Mediterranean. Turkey is partially located in Asia and partially in Europe. It is surrounded by four seas: the Black Sea to the north, the Aegean to the west, the Sea of Marmara, and the Mediterranean to the south. The Bosporus Strait connects the Black Sea to the Sea of Marmara, and the Dardanelles Strait connects the Sea of Marmara to the Aegean Sea and the Mediterranean Sea. Turkey\u0026rsquo;s geography is characterized by a central plateau surrounded by mountain chains to the north, west, and south. The Northern Anatolian Mountains are a chain that runs almost parallel to the Black Sea. The Black Sea : It is a large inland sea located at the southeastern tip of Europe. It\u0026rsquo;s a marginal sea of the Atlantic Ocean, located between Eastern Europe and Western Asia. TheBlack Sea is bordered by Bulgaria, Georgia, Romania, Russia, Turkey, and Ukraine. The Black Sea is also known as the Euxine Sea. T he Caspian Sea : It is the world\u0026rsquo;s largest inland body of water, covering 371,000 square kilometers. It\u0026rsquo;s located on the border of two parts of Eurasia, and its coastlines are shared by Azerbaijan, Iran, Kazakhstan, Russia, and Turkmenistan. T he Caspian Sea is named after the ancient Kaspi peoples who once lived in Transcaucasia to the west. The ancient Greeks and Persians thought the Caspian Sea was an ocean because of its immense size. T he Mediterranean Sea : It is a semi-enclosed sea that connects to the Atlantic Ocean. It is surrounded by land on three sides:Southern Europe and Anatolia to the north, North Africa to the south, and the Levant in West Asia to the east. It is home to more than 150 million people, and more than 450 ports and terminals that account for about 30% of global sea-borne trade. It is also a major transportation route between the east and west.\u0026nbsp;T he Mediterranean Sea is a mostly enclosed sea, with limited water exchange with the outer oceans. Its water circulation is primarily driven by temperature and salinity differences, rather than tides or winds. The slow rate of water exchange makes the Mediterranean Sea very clear. T he Gulf of Suez : It is a maritime inlet that connects the Isthmus of Suez to the Red Sea. It is located between Africa to the west and the Sinai Peninsula to the east, at the northern end of the Red Sea. T he Gulf of Suez is one of the most productive areas along the Egyptian Red Sea coast, producing more than 64% of all red sea fish. The gulf is characterized byhigh salinity, relatively low water currents, and a wide shallow basin. T he Gulf of Aqaba : It is also known as the Gulf of Eilat, is a large gulf in the Red Sea. It\u0026rsquo;s located at the northern tip of the Red Sea, west of the Arabian Peninsula and east of the Sinai Peninsula. The gulf\u0026rsquo;s coastline is shared by four countries: 1. 2. 3. 4. Israel, Egypt, Jordan, and Saudi Arabia. T he Dead Sea : It is a landlocked salt lake in southwestern Asia. It\u0026rsquo;s bordered by Jordan to the east and Israel to the west, and is located in the Jordan Rift Valley.T he Dead Sea is also the world\u0026rsquo;s deepest hypersaline lake, at 306 m deep. The Dead Sea is also known as the Salt Sea and the Sea of Lot.\u0026nbsp;In Arabic, it\u0026rsquo;s also known as Buhayrat, Bahret, or Birket Lut.T he Dead Sea is one of the most intriguing natural phenomena on Earth.\u0026nbsp;It\u0026rsquo;s completely devoid of life, aside from some microorganisms and algae.\u0026nbsp;The Dead Sea\u0026rsquo;s surface water has a salinity of about five to nine times that found in the oceans, and the salinity increases with depth\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46967", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e4 2 1 3\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e3 2 4 1\u003c/p\u003e", "option_3": "\u003 \u003cp\u003e3 only\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWith reference to \u0026lsquo;Changpa\u0026rsquo; community of India, consider the following statement : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. They live mainly in the State of Uttarakhand.\u003c/p\u003e\r\n\r\n\u003cp\u003e2. They rear the Pashmina goats that yield a fine wool.\u003c/p\u003e\r\n\r\n\u003cp\u003e3. They are kept in the category of Scheduled Tribes.\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the statements given above is/ are correct?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The Changpa are a semi-nomadic Tibetan tribe of people who live in the Changtang, a high plateau that stretches across Ladakh and some parts of Jammu and Kashmir. Some Changpa also live in the western regions of the Tibet Autonomous Region. The Changpa are primarily pastoralists who raise yaks, sheep, goats, and horses for sustenance and livelihoods. They practice a system of rotational grazing to protect the pastures from overgrazing. Most of the Changpa\u0026rsquo;s way of life is adjusted to the harsh terrain they inhabit. They live in tents and move from place to place in search of pastures. In 1989, the Changpa were declared as the Scheduled Tribes. The Changpa\u0026rsquo;s way of life is undergoing shocks and disruption due to climate change. Some of the impacts of climate change include: 1. Receding glaciers 2. Dried up water springs 3. Less dense marshes4. Declining quality of pastures 5. Reduced diversity and changing composition of livestock The Changpa are also under threat due to the India-China standoff.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "3", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46969", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1 and 2 only\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e2 and 3 only\u0026nbsp;\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 2 and 3\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e1, 3 and 4\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConsider the following towns of India : \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2014)\u003c/strong\u003e\u003c/p\u003e\r\n\r\n\u003cp\u003e1. Bhadrachalam\u003c/p\u003e\r\n\r\n\u003cp\u003e2. Chanderi\u003c/p\u003e\r\n\r\n\u003cp\u003e3. Kancheepuram\u003c/p\u003e\r\n\r\n\u003cp\u003e4. Karnal\u003c/p\u003e\r\n\r\n\u003cp\u003eWhich of the above are famous for the production of traditional sarees/fabric?\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (C) Bhadrachalam : It is a town in Telangana, India that is known for producing traditional silk sarees called Bhadrachalam sarees. Chanderi sarees : These are a traditional Koli sari from Chanderi, Madhya Pradesh, India. The Chanderi town is located in the Ashok Nagar district of Madhya Pradesh. The town is surrounded by hills and is situated southwest of the Betwa River. Chanderi sarees are a handloom weave that combines soft cotton and silk yarns to create small golden and silver motifs and borders. The sarees are known for their elegance and artistry and are adorned around the world. The word \u0026ldquo;chanderi\u0026rdquo; comes from the Chanderi Town of Ashok Nagar district. It is believed that the weaving center was established between the 7th and 2nd century BC. Kanchipuram saree : It is a traditional silk sari made in the Kanchipuram region of Tamil Nadu, India. They are also known as Kanjivaram silk sarees.Kanchipuram sarees are known for their rich texture, vibrant colors, and timeless elegance. They are handcrafted by skilled artisans with intricate designs inspired by nature and temple art. Kanchipuram sarees are woven from pure mulberry silk, which comes from South India. The gold and silver zari comes from Gujarat. The silk is called \u0026ldquo;pattu\u0026rdquo; in Tamil, so the sarees are also called Kanchipuram pattu sarees. Kanchipuram sarees are woven using the adai technique in a throw shuttle pit loom. Two weavers carry the saree to make a solid border (Korvai) and a contrast pallu using the petni technique. The sarees are woven using traditional designs inspired by the sculptures of temples in the town.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46970", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSyria\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eJordan\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eLebanon\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIsrael\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eWhich one of the following countries of South-West Asia does not open out to the Mediterranean Sea? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) Jordan is the only country in South-West Asia that doesn\u0026rsquo;t have direct access to the Mediterranean Sea. Jordan is a landlocked country, except for a 26 km shoreline along the Gulf of Aqaba that provides access to the Red Sea. South-West Asia, also known as the Middle East region, is bordered to the south by the Mediterranean Sea. Other countries in the region that do have access to the Mediterranean Sea include Syria, Lebanon, and Israel. The Mediterranean Sea : It is a semi-enclosed sea that connects to the Atlantic Ocean. It is surrounded by land on three sides: 1. Southern Europe and Anatolia to the north, 2. North Africa to the south, and 3. the Levant in West Asia to the east. It is home to more than 150 million people, and more than 450 ports and terminals that account for about 30% of global sea-borne trade. It is also a major transportation route between the east and west.\u0026nbsp; The Mediterranean Sea is a mostly enclosed sea, with limited water exchange with the outer oceans. Its water circulation is primarily driven by temperature and salinity differences, rather than tides or winds. The slow rate of water exchange makes the Mediterranean Sea very clear.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46971", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eSavannah\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eEquatorial\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMonsoon\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eMediterranean\u003c/p\u003e", "option_5": "", "option_6": "", "option_7": "", "option_8": "", "option_9": "", "option_image_1": "", "option_image_10": "", "option_image_2": "", "option_image_3": "", "option_image_4": "", "option_image_5": "", "option_image_6": "", "option_image_7": "", "option_image_8": "", "option_image_9": "", "positive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003e\u0026ldquo;Each day is more or less the same, the morning is clear and bright with a sea breeze; as the Sun climbs high in the sky, heat mounts up, dark clouds form, then rain comes with thunder and lightning. But rain is soon over\u0026rdquo;. Which of the following regions is described in the above passage? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The passage describes the equatorial region. The equatorial region is the area around the equator, which covers about 6% of the Earth. The equatorial climate is hot and humid year-round, with heavy rainfall that occurs throughout the year. This climate supports the growth of dense equatorial forests. The equatorial climate is characterized by: 1. Consistently high temperatures (around 30 \u0026deg;C [86 \u0026deg;F]) 2. Plentiful precipitation (150\u0026ndash;1,000 cm [59\u0026ndash;394 inches]) 3. Heavy cloud cover 4. High humidity 5. Very little annual temperature variationSavannas are a transitional climate found between hot deserts and equatorial rainforests. They are characterized by warm to hot conditions year-round, with temperatures ranging from 68\u0026deg; to 86\u0026deg;F (20\u0026deg; to 30\u0026deg;C). Savannas have two distinct seasons: 1. a wet summer 2. a dry winter. Monsoon climate is a seasonal change in the direction of the strongest winds in a region. Monsoons are caused by seasonal shifts in winds due to differences in temperature between land and water. For example, in summer, land warms up faster than water, causing monsoon winds to blow from cold to warm. Monsoons result in wet and dry seasons in many tropical areas, and are often associated with the Indian Ocean. A Mediterranean climate is a temperate climate with mild, wet winters and dry summers. It\u0026rsquo;s often connected to prevailing winds and weather patterns. Mediterranean climates are found on the west coasts of continents between 30\u0026deg; and 40\u0026deg; latitude, and along the shores of the Mediterranean Sea. They have warm summers with clear skies, cool nights, and little rain.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "2", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46972", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "opti tive_marks": "2.00", "question": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eIn the South Atlantic and South-Eastern Pacific regions in tropical latitudes, cyclone does not originate. What is the reason? \u003cstrong\u003e(UPSC Prelims\u0026nbsp;2015)\u003c/strong\u003e\u003c/p\u003e", "question_heading": "", "question_type": "1", "question_ui_type": "1", "report_count": "0", "section_id": "305", "set_no": "1", "solution_heading": "Full Solution", "solution_image_1": "", "solution_image_2": "", "solution_text": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cp\u003eExplanation : (B) The most proximate reasons for the lack of cyclone formation in the South Atlantic are sea surface temperatures that tend to run a shade cooler than ideal for tropical cyclone formation even in the southern summer, climatologically high values of vertical wind shear across that basin throughout the year, and a lack of pre-existing centers of rotation (vorticity) in that area. This last point is due both to the absence of tropical waves similar to those generated over west Africa in the northern hemisphere and to the fact the the Inter tropical Convergence Zone (ITCZ), which shifts toward the north in our summer and toward the south in the southern summer, usually stays at or north of the equator. Though many people might speculate that the sea surface temperatures are too cold, the primary reasons that the South Atlantic Ocean gets few tropical cyclones are that the tropospheric vertical wind shear is much too strong and there is typically no inter-tropical convergence zone (ITCZ) over the ocean. Without an ITCZ to provide synoptic vorticity and convergence (i.e. large scale spin and thunderstorm activity) as well as having strong wind shear, it becomes very difficult to nearly impossible to have genesis of tropical cyclones.\u003c/p\u003e", "solution_video": "", "sortingparam": "0.00", "subject": "", "test_id": "448", "test_series_id": "19", "topic": ""}, {"answer": "1", "concept": "", "deleted": "0", "difficulty_level": "1", "directive": "", "exam": "", "id": "46973", "image_check": "0", "image_link_1": "", "image_link_2": "", "image_link_3": "", "negative_marks": "0.66", "option_1": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eThe Earth\u0026rsquo;s rotation on its axis\u0026nbsp;\u003c/p\u003e", "option_10": "", "option_2": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eConvergence of the two equatorial currents\u003c/p\u003e", "option_3": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cstyle type=\"text/css\"\u003e*{overflow-wrap: break-word;} img {max-width:100% !important}\r\n\u003c/style\u003e\r\n\u003cp\u003eDifference in salinity of water\u003c/p\u003e", "option_4": "\u003cstyle\u003e*{overflow-wrap: break-word;} img {max-width:100% !important} \u003c/style\u003e\u003cstyle type=\"text/css\"\u003e*
