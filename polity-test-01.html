<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polity Mock Test 01 — ABHISHA AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  :root {
    --bg: #0b0d12; --bg-1: #11141b; --bg-2: #161a23;
    --ink: #e8eaef; --ink-dim: #94a3b8; --line: #232938;
    --gold: #d4a84b; --gold-2: #e9c47a;
    --good: #10b981; --bad: #ef4444; --warn: #f59e0b; --review: #a855f7;
  }
  html, body { height: 100%; }
  body { background: linear-gradient(180deg, #0b0d12 0%, #0f1219 100%); color: var(--ink); }

  /* Header bar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(11,13,18,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 12px 18px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .topbar .title { font-size: 15px; font-weight: 800; letter-spacing: .3px; color: var(--gold-2); }
  .topbar .meta { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 1px; }
  .topbar .spacer { flex: 1; }
  .timer {
    background: var(--bg-2); border: 1px solid var(--line); padding: 7px 14px; border-radius: 10px;
    font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--gold-2);
    display: flex; align-items: center; gap: 8px;
  }
  .timer.warn { color: var(--warn); border-color: var(--warn); }
  .timer.danger { color: var(--bad); border-color: var(--bad); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

  .layout {
    display: grid; grid-template-columns: 1fr 280px; gap: 18px;
    max-width: 1200px; margin: 22px auto; padding: 0 18px;
  }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .palette-card { order: -1; }
  }

  /* Question card */
  .qcard {
    background: var(--bg-1); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 24px; min-height: 360px;
  }
  .qhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .qno { font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 1.2px; }
  .qtag { font-size: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(212,168,75,.12); color: var(--gold-2); border: 1px solid rgba(212,168,75,.3); text-transform: uppercase; letter-spacing: .8px; }
  .qtext { font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.55; margin-bottom: 18px; }
  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg-2); cursor: pointer; transition: all .15s ease;
    font-size: 14px; line-height: 1.45;
  }
  .opt:hover { border-color: var(--gold); background: rgba(212,168,75,.06); }
  .opt input { margin-top: 3px; accent-color: var(--gold); }
  .opt.selected { border-color: var(--gold); background: rgba(212,168,75,.12); }
  .opt.correct { border-color: var(--good); background: rgba(16,185,129,.10); }
  .opt.wrong { border-color: var(--bad); background: rgba(239,68,68,.10); }
  .opt.locked { cursor: default; }
  .opt-letter { font-weight: 800; color: var(--gold-2); min-width: 16px; }

  /* Action row */
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg-2); color: var(--ink); font-weight: 700; font-size: 13px;
    cursor: pointer; letter-spacing: .3px; transition: all .15s ease;
  }
  .btn:hover { border-color: var(--gold); }
  .btn.primary { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-2) 100%); color: #1a1202; border: 0; }
  .btn.review { background: rgba(168,85,247,.12); border-color: rgba(168,85,247,.4); color: #c4b5fd; }
  .btn.danger { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.4); color: #fca5a5; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Palette */
  .palette-card {
    background: var(--bg-1); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    position: sticky; top: 76px; align-self: start;
  }
  .palette-title { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 12px; font-weight: 700; }
  .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
  .pal-cell {
    aspect-ratio: 1; border-radius: 7px; border: 1px solid var(--line); background: var(--bg-2);
    color: var(--ink-dim); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s ease;
  }
  .pal-cell:hover { border-color: var(--gold); }
  .pal-cell.current { border-color: var(--gold); background: var(--gold); color: #1a1202; }
  .pal-cell.answered { background: rgba(16,185,129,.18); color: #6ee7b7; border-color: rgba(16,185,129,.4); }
  .pal-cell.review { background: rgba(168,85,247,.18); color: #c4b5fd; border-color: rgba(168,85,247,.4); }
  .pal-cell.answered.review { background: linear-gradient(135deg, rgba(168,85,247,.25) 50%, rgba(16,185,129,.25) 50%); }

  .legend { display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--ink-dim); margin-bottom: 14px; }
  .legend-row { display: flex; align-items: center; gap: 8px; }
  .legend-sw { width: 14px; height: 14px; border-radius: 4px; }

  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; color: var(--ink-dim); border-top: 1px dashed var(--line); }
  .stat-row b { color: var(--ink); font-weight: 700; }

  /* Result screen */
  .result-screen { display: none; padding: 30px 24px; }
  .result-screen.show { display: block; }
  .score-hero {
    background: linear-gradient(135deg, rgba(212,168,75,.15) 0%, rgba(212,168,75,.04) 100%);
    border: 1px solid rgba(212,168,75,.3); border-radius: 18px; padding: 32px; text-align: center;
    margin-bottom: 24px;
  }
  .score-big { font-size: 48px; font-weight: 900; color: var(--gold-2); margin-bottom: 4px; }
  .score-sub { font-size: 13px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 1.5px; }
  .verdict { font-size: 16px; color: var(--ink); margin-top: 14px; font-style: italic; }

  .breakdown-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .bd-tile { background: var(--bg-1); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: center; }
  .bd-num { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .bd-lbl { font-size: 10px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 1px; }
  .bd-tile.good .bd-num { color: var(--good); }
  .bd-tile.bad .bd-num { color: var(--bad); }
  .bd-tile.warn .bd-num { color: var(--warn); }

  .review-section { background: var(--bg-1); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  .review-section h3 { font-size: 14px; color: var(--gold-2); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .rev-q { padding: 14px 0; border-bottom: 1px dashed var(--line); }
  .rev-q:last-child { border-bottom: 0; }
  .rev-qtext { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .rev-line { font-size: 12px; color: var(--ink-dim); margin: 4px 0; }
  .rev-line b { color: var(--ink); }
  .rev-correct { color: var(--good); font-weight: 700; }
  .rev-wrong { color: var(--bad); font-weight: 700; }
  .rev-explain { background: var(--bg-2); border-left: 3px solid var(--gold); padding: 10px 14px; margin-top: 8px; font-size: 13px; color: var(--ink); border-radius: 0 8px 8px 0; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="title">Indian Polity — Mock Test 01</div>
    <div class="meta">10 Questions · 12 Minutes · ABHISHA AI</div>
  </div>
  <div class="spacer"></div>
  <div class="timer" id="timer">⏱ 12:00</div>
</div>

<div class="layout" id="testLayout">
  <div>
    <div class="qcard" id="qcard">
      <div class="qhead">
        <div class="qno" id="qno">Question 1 / 10</div>
        <div class="qtag" id="qtag">Constitution</div>
      </div>
      <div class="qtext" id="qtext">Loading…</div>
      <div class="opts" id="opts"></div>
      <div class="actions">
        <button class="btn" id="btnPrev">← Previous</button>
        <button class="btn review" id="btnReview">⚑ Mark for Review</button>
        <button class="btn" id="btnClear">Clear Answer</button>
        <div class="spacer" style="flex:1"></div>
        <button class="btn primary" id="btnNext">Next →</button>
        <button class="btn danger" id="btnSubmit">Submit Test</button>
      </div>
    </div>
  </div>

  <div class="palette-card">
    <div class="palette-title">Question Palette</div>
    <div class="palette-grid" id="palette"></div>
    <div class="legend">
      <div class="legend-row"><span class="legend-sw" style="background:var(--gold)"></span> Current</div>
      <div class="legend-row"><span class="legend-sw" style="background:rgba(16,185,129,.4)"></span> Answered</div>
      <div class="legend-row"><span class="legend-sw" style="background:rgba(168,85,247,.4)"></span> Marked for review</div>
      <div class="legend-row"><span class="legend-sw" style="background:var(--bg-2); border:1px solid var(--line)"></span> Not visited</div>
    </div>
    <div class="stat-row"><span>Answered</span><b id="stAns">0</b></div>
    <div class="stat-row"><span>Marked</span><b id="stRev">0</b></div>
    <div class="stat-row"><span>Not attempted</span><b id="stRem">10</b></div>
  </div>
</div>

<div class="result-screen" id="resultScreen">
  <div class="score-hero">
    <div class="score-big" id="resScore">0 / 10</div>
    <div class="score-sub" id="resPct">0%</div>
    <div class="verdict" id="resVerdict"></div>
  </div>
  <div class="breakdown-grid">
    <div class="bd-tile good"><div class="bd-num" id="bdRight">0</div><div class="bd-lbl">Correct</div></div>
    <div class="bd-tile bad"><div class="bd-num" id="bdWrong">0</div><div class="bd-lbl">Wrong</div></div>
    <div class="bd-tile warn"><div class="bd-num" id="bdSkip">0</div><div class="bd-lbl">Skipped</div></div>
    <div class="bd-tile"><div class="bd-num" id="bdTime">0:00</div><div class="bd-lbl">Time taken</div></div>
  </div>
  <div class="review-section">
    <h3>📖 Solutions & Explanations</h3>
    <div id="reviewList"></div>
  </div>
</div>

<script>
/* =========================================================================
   ABHISHA AI Live Test Engine — drop-in template
   To add questions to a new test, just edit the QUESTIONS array + DURATION_MIN
   below. Everything else (timer, palette, review, scoring, postMessage to
   parent) is handled. The parent (ABHISHA AI app) listens via postMessage
   and updates user stats / streak.
   ========================================================================= */

const QUESTIONS = [
  { topic: 'Fundamental Rights', q: 'Which Article of the Indian Constitution deals with the Right to Equality?', opts: ['Article 12', 'Article 14', 'Article 19', 'Article 21'], answer: 1,
    explain: 'Article 14 guarantees equality before the law and equal protection of the laws within the territory of India. Articles 15-18 expand on this Right to Equality.' },
  { topic: 'Constitution', q: 'The Preamble of the Indian Constitution was amended by which Amendment Act?', opts: ['24th Amendment', '42nd Amendment', '44th Amendment', '52nd Amendment'], answer: 1,
    explain: 'The 42nd Amendment Act, 1976 added the words "Socialist", "Secular", and "Integrity" to the Preamble. It is the only amendment that has modified the Preamble.' },
  { topic: 'Parliament', q: 'Who is the ex-officio Chairman of the Rajya Sabha?', opts: ['President of India', 'Vice-President of India', 'Speaker of Lok Sabha', 'Prime Minister'], answer: 1,
    explain: 'Article 64 makes the Vice-President of India the ex-officio Chairman of the Rajya Sabha. The Vice-President presides over Rajya Sabha sessions.' },
  { topic: 'DPSP', q: 'Directive Principles of State Policy in the Indian Constitution are inspired by the Constitution of:', opts: ['USA', 'UK', 'Ireland', 'Canada'], answer: 2,
    explain: 'The Directive Principles of State Policy (Part IV, Articles 36-51) are borrowed from the Irish Constitution, which itself adopted the idea from the Spanish Constitution.' },
  { topic: 'Judiciary', q: 'The collegium system for appointment of judges to the Supreme Court was established by which case?', opts: ['Kesavananda Bharati case', 'Minerva Mills case', 'Second Judges case (1993)', 'Maneka Gandhi case'], answer: 2,
    explain: 'The Second Judges Case (1993) gave birth to the collegium system. The Third Judges Case (1998) further clarified the composition — a 5-member collegium led by the CJI.' },
  { topic: 'Federalism', q: 'Which Schedule of the Constitution contains provisions regarding the administration of tribal areas in Assam, Meghalaya, Tripura and Mizoram?', opts: ['5th Schedule', '6th Schedule', '8th Schedule', '9th Schedule'], answer: 1,
    explain: 'The 6th Schedule deals with the administration of tribal areas in Assam, Meghalaya, Tripura and Mizoram via Autonomous District Councils. The 5th Schedule covers tribal areas in other states.' },
  { topic: 'Emergency Provisions', q: 'Under which Article can the President proclaim a National Emergency?', opts: ['Article 352', 'Article 356', 'Article 360', 'Article 365'], answer: 0,
    explain: 'Article 352 deals with National Emergency (war/external aggression/armed rebellion). Article 356 = President\'s Rule in states. Article 360 = Financial Emergency.' },
  { topic: 'Local Government', q: 'The 73rd Constitutional Amendment Act is associated with:', opts: ['Urban local bodies', 'Panchayati Raj institutions', 'Right to Education', 'Anti-defection law'], answer: 1,
    explain: 'The 73rd Amendment (1992) gave constitutional status to Panchayati Raj institutions (Part IX, Articles 243-243O). The 74th Amendment did the same for urban local bodies (Municipalities).' },
  { topic: 'Fundamental Duties', q: 'Fundamental Duties were added to the Indian Constitution on the recommendation of:', opts: ['Sarkaria Commission', 'Swaran Singh Committee', 'Punchhi Commission', 'Justice Verma Committee'], answer: 1,
    explain: 'Fundamental Duties (Article 51A, Part IV-A) were added by the 42nd Amendment, 1976 on the recommendation of the Swaran Singh Committee. Originally 10 duties; the 11th was added by the 86th Amendment, 2002.' },
  { topic: 'Constitutional Bodies', q: 'Which of the following is NOT a Constitutional body?', opts: ['Election Commission', 'UPSC', 'NITI Aayog', 'Finance Commission'], answer: 2,
    explain: 'NITI Aayog is an executive body created by a Cabinet resolution in 2015 (replacing the Planning Commission). The Election Commission (Art 324), UPSC (Art 315) and Finance Commission (Art 280) are all Constitutional bodies.' },
];

const DURATION_MIN = 12;
const TEST_META = { id: 'polity-test-01', title: 'Polity Mock Test 01', subject: 'Polity' };

/* ---- State ---- */
const state = {
  idx: 0,
  responses: new Array(QUESTIONS.length).fill(null), // index of selected option | null
  reviewed: new Array(QUESTIONS.length).fill(false),
  visited: new Array(QUESTIONS.length).fill(false),
  startedAt: Date.now(),
  ended: false,
  timeLeft: DURATION_MIN * 60,
};

const $ = (s) => document.querySelector(s);

/* ---- Render question ---- */
function renderQ() {
  const i = state.idx;
  const q = QUESTIONS[i];
  state.visited[i] = true;
  $('#qno').textContent = `Question ${i+1} / ${QUESTIONS.length}`;
  $('#qtag').textContent = q.topic;
  $('#qtext').textContent = q.q;
  const optsEl = $('#opts'); optsEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((text, j) => {
    const el = document.createElement('label');
    el.className = 'opt' + (state.responses[i] === j ? ' selected' : '');
    el.innerHTML = `<input type="radio" name="opt" value="${j}" ${state.responses[i]===j?'checked':''} />
      <span class="opt-letter">${letters[j]}.</span>
      <span>${text}</span>`;
    el.onclick = () => {
      state.responses[i] = j;
      renderQ(); renderPalette(); renderStats();
    };
    optsEl.appendChild(el);
  });
  $('#btnPrev').disabled = i === 0;
  $('#btnNext').disabled = i === QUESTIONS.length - 1;
  $('#btnReview').textContent = state.reviewed[i] ? '⚑ Unmark Review' : '⚑ Mark for Review';
}

/* ---- Render palette ---- */
function renderPalette() {
  const pal = $('#palette'); pal.innerHTML = '';
  for (let i = 0; i < QUESTIONS.length; i++) {
    const cell = document.createElement('div');
    let cls = 'pal-cell';
    if (state.responses[i] !== null) cls += ' answered';
    if (state.reviewed[i]) cls += ' review';
    if (i === state.idx) cls += ' current';
    cell.className = cls;
    cell.textContent = i + 1;
    cell.onclick = () => { state.idx = i; renderQ(); renderPalette(); };
    pal.appendChild(cell);
  }
}

/* ---- Stats ---- */
function renderStats() {
  const ans = state.responses.filter(x => x !== null).length;
  const rev = state.reviewed.filter(Boolean).length;
  $('#stAns').textContent = ans;
  $('#stRev').textContent = rev;
  $('#stRem').textContent = QUESTIONS.length - ans;
}

/* ---- Timer ---- */
function fmtTime(secs) {
  const m = Math.floor(secs / 60), s = secs % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function tickTimer() {
  if (state.ended) return;
  state.timeLeft--;
  const t = $('#timer');
  t.textContent = '⏱ ' + fmtTime(state.timeLeft);
  t.classList.toggle('warn', state.timeLeft <= 120 && state.timeLeft > 30);
  t.classList.toggle('danger', state.timeLeft <= 30);
  if (state.timeLeft <= 0) { submitTest(true); return; }
  setTimeout(tickTimer, 1000);
}

/* ---- Buttons ---- */
$('#btnPrev').onclick = () => { if (state.idx > 0) { state.idx--; renderQ(); renderPalette(); } };
$('#btnNext').onclick = () => { if (state.idx < QUESTIONS.length - 1) { state.idx++; renderQ(); renderPalette(); } };
$('#btnReview').onclick = () => { state.reviewed[state.idx] = !state.reviewed[state.idx]; renderQ(); renderPalette(); renderStats(); };
$('#btnClear').onclick = () => { state.responses[state.idx] = null; renderQ(); renderPalette(); renderStats(); };
$('#btnSubmit').onclick = () => {
  const unanswered = state.responses.filter(x => x === null).length;
  const msg = unanswered > 0
    ? `You have ${unanswered} unanswered question(s). Submit anyway?`
    : 'Submit your test?';
  if (confirm(msg)) submitTest(false);
};

/* ---- Keyboard nav ---- */
document.addEventListener('keydown', (e) => {
  if (state.ended) return;
  if (e.key === 'ArrowRight') $('#btnNext').click();
  else if (e.key === 'ArrowLeft') $('#btnPrev').click();
  else if (['1','2','3','4'].includes(e.key)) {
    const j = parseInt(e.key) - 1;
    if (j < QUESTIONS[state.idx].opts.length) {
      state.responses[state.idx] = j; renderQ(); renderPalette(); renderStats();
    }
  } else if (e.key.toLowerCase() === 'r') $('#btnReview').click();
});

/* ---- Submit ---- */
function submitTest(timedOut) {
  state.ended = true;
  let right = 0, wrong = 0, skip = 0;
  QUESTIONS.forEach((q, i) => {
    const r = state.responses[i];
    if (r === null) skip++;
    else if (r === q.answer) right++;
    else wrong++;
  });
  const total = QUESTIONS.length;
  const pct = Math.round((right / total) * 100);
  const elapsed = DURATION_MIN * 60 - state.timeLeft;
  $('#testLayout').style.display = 'none';
  $('#timer').style.display = 'none';
  $('#resultScreen').classList.add('show');
  $('#resScore').textContent = `${right} / ${total}`;
  $('#resPct').textContent = `${pct}% Score${timedOut ? ' · Time Up' : ''}`;
  let verdict = '';
  if (pct >= 80) verdict = '🌟 Excellent! Conceptually sound — keep this momentum.';
  else if (pct >= 60) verdict = '✅ Good attempt. A focused revision will lift you into the top band.';
  else if (pct >= 40) verdict = '⚖️ Decent base. Re-read the explanations below — they will close most gaps.';
  else verdict = '🌱 Every UPSC topper started here. Use the explanations as a focused revision plan.';
  $('#resVerdict').textContent = verdict;
  $('#bdRight').textContent = right;
  $('#bdWrong').textContent = wrong;
  $('#bdSkip').textContent = skip;
  $('#bdTime').textContent = fmtTime(elapsed);

  /* Review with explanations */
  const rl = $('#reviewList'); rl.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const r = state.responses[i];
    const correct = r === q.answer;
    const div = document.createElement('div');
    div.className = 'rev-q';
    const userTxt = r === null ? '<span class="rev-line"><b>Your answer:</b> <span style="color:var(--warn)">Not attempted</span></span>'
      : `<span class="rev-line"><b>Your answer:</b> <span class="${correct?'rev-correct':'rev-wrong'}">${['A','B','C','D'][r]}. ${q.opts[r]}</span></span>`;
    div.innerHTML = `
      <div class="rev-qtext">${i+1}. ${q.q}</div>
      ${userTxt}
      <div class="rev-line"><b>Correct:</b> <span class="rev-correct">${['A','B','C','D'][q.answer]}. ${q.opts[q.answer]}</span></div>
      <div class="rev-explain">${q.explain}</div>
    `;
    rl.appendChild(div);
  });

  /* Notify parent (ABHISHA AI app) — for stats / streak */
  try {
    const payload = {
      type: 'abhisha:test:complete',
      meta: TEST_META,
      result: { right, wrong, skip, total, pct, elapsedSec: elapsed, timedOut },
      at: new Date().toISOString(),
    };
    window.parent && window.parent.postMessage(payload, '*');
  } catch {}

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---- Boot ---- */
renderQ();
renderPalette();
renderStats();
setTimeout(tickTimer, 1000);
</script>
</body>
</html>
